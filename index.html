 = antrenmanın yarattığı **fiziksel + psikolojik** stresin toplamı. Her yük **kaydedilmelidir**.", "Gündelik yaşam (uyku, beslenme, stres, sosyal ve duygusal yaşam) uyumu **antrenman kadar** etkiler.", "Takip araçları: **öznel** (AZD, toparlanma-stres anketi, ruhsal durum profili, sporcuya doğrudan sormak) ve **nesnel** (mesafe, yük, set, GPS).", "Hazırbulunuşluk puanı: **16'ya yakınsa hazır**, **4'e yakınsa** yeterince toparlanamamış.", "Yaygın hata: yük ve toparlanmanın öznel değerlendirmesi için **sporcudan birebir geri bildirim alınmaması**. Antrenör her oyuncuya algıladığı yükü **doğrudan sormalı**."]}, {"title": "Zirveleme ve yüklenmeyi azaltma (taper)", "points": ["**Zirve performans** geçicidir: yaklaşık **7-10 gün** korunabilir; bir yılda **2-3 kez** gerçek zirveye ulaşılabilir.", "**Taper:** önemli maçtan önce yüklenmeyi azaltma. **Temel amaç yorgunluğu azaltmaktır**; kondisyon korunur, süperkompansasyon kolaylaşır.", "Takım sporlarında yaygın yöntem: **şiddet yüksek kalır**, **kapsam ve sıklık azaltılır**.", "Türleri: **basamak şeklinde, doğrusal, yavaş üstel, hızlı üstel** azaltma.", "Önemli turnuva öncesinde: **zirveleme ve yük azaltma stratejileriyle** fiziksel/psikolojik kondisyon ve yorgunluk yönetilir.", "\"Üst düzey antrenör, sporcusunu **nasıl, ne zaman ve ne kadar dinlendireceğini** planlayabilen antrenördür.\""]}, {"title": "Makro döngü ve uzun vadeli gelişim", "points": ["Makro döngü **sürekli güncellenen dinamik** bir yapıdır; en değerli veri **tutulan kayıtların bütünsel değerlendirilmesidir**.", "**Stratejik periyotlama:** zayıf rakip haftaları yüklenme, kritik maç haftaları zirveleme için kullanılır.", "Yıllık plan **geriye doğru** tasarlanır (müsabakaya hazırlığın son haftasından başlanır).", "Sürat ile bağlantılı yetilerdeki kazanımlar **daha kısa sürede kaybolur**, bu yüzden en sık onlar çalışılmalıdır.", "Uzun vadeli sporcu gelişimi: \"Bireyi **yaşam boyu** sporda nasıl tutarız?\" Devlet politikası olarak yaşam boyu spor → **uluslararası başarı + toplumsal refah**.", "İhtiyaç analizinin 3 sorusu: **metabolik** ihtiyaç, **biyomekanik** ihtiyaç, **en sık yaralanmalar**."]}], "questions": [{"q": "Periyotlama alanındaki bilimsel bilgiye yönelik en büyük sorunun kaynağı nedir?", "o": ["Bilgilerin geç yayımlanması", "Sporcuların ilgisizliği", "Bilimsel dergilerin pahalı olması", "Hatalı/eksik bilimsel araştırma tasarımları", "Antrenörlerin az olması"], "a": 3, "e": "Uzun süreli, çok değişkenli süreçleri kontrollü inceleyebilmek çok zordur."}, {"q": "Antrenman planlaması ve periyotlamasında en değerli bilgi kaynağı hangisidir?", "o": ["Sadece bilimsel makaleler", "Sadece elit sporcular", "Sosyal medya", "Profesörler", "Güvenilir bilimsel bilgiyi uygulamada başarıyla kullanmış uygulamacılar"], "a": 4, "e": "Hem bilimsel hem uygulama başarısı olan kaynak daha güvenilirdir."}, {"q": "Antrenman planlaması ile periyotlama arasındaki temel fark nedir?", "o": ["İkisi aynı anlama gelir", "Planlama kısa, periyotlama çok daha uzun zaman dilimlerini yönetir", "Planlama sadece çocuklar içindir", "Periyotlama sadece kuvvet içindir", "Periyotlama sadece günlük antrenmandır"], "a": 1, "e": "Planlama, periyotlamanın bir aracıdır."}, {"q": "Aşağıdakilerden hangisi bir antrenman planlaması ögesidir?", "o": ["Makro döngü", "Olimpiyat döngüsü", "Set sayısı", "Mezo döngü", "Zirveleme dönemi"], "a": 2, "e": "Set, tekrar, yük ve dinlenme kısa vadeli planlama değişkenleridir."}, {"q": "Bompa'ya göre antrenman periyotlamasının en basit tanımı nedir?", "o": ["Sadece yükü artırma", "Test sonuçlarının kaydı", "Günlük antrenman planı", "Yarışma takvimi", "Antrenmanı evreler şeklinde yapılandırma süreci"], "a": 4, "e": "Haff ve Haff ise zamanlamaya vurgu yapan daha ayrıntılı bir tanım verir."}, {"q": "Antrenman periyotlamasının öncüsü olarak anılan kişi kimdir?", "o": ["Bompa", "Verkhoshansky", "Borg", "Issurin", "Matveyev"], "a": 4, "e": "İlk ciddi eleştiri 1990'larda Verkhoshansky'den gelmiştir."}, {"q": "'İki-uçlu periyotlama' terimindeki 'uç' neyi ifade eder?", "o": ["İki temel yetinin geliştirilmesini", "İki yüklenme döngüsünü", "Tersten uygulanabilmesini", "Performansın iki ayrı zaman diliminde zirveye yaklaştırılmasını", "Kadın ve erkeklere uygulanabilmesini"], "a": 3, "e": "Uç sayısı, bir sezondaki zirve sayısıdır."}, {"q": "Olimpiyat döngüsü kaç yıl sürer?", "o": ["1 yıl", "2 yıl", "4 yıl", "6 yıl", "8 yıl"], "a": 2, "e": "Ardışık iki olimpiyat arasındaki süredir."}, {"q": "Blok periyotlamanın evre sırası hangisidir?", "o": ["Geçiş → hazırlık → biriktirme", "Gerçekleştirme → biriktirme → dönüştürme", "Hazırlık → geçiş → müsabaka", "Dönüştürme → gerçekleştirme → biriktirme", "Biriktirme → dönüştürme → gerçekleştirme"], "a": 4, "e": "Blok periyotlama kısa ve tekrarlı evreler kullanır."}, {"q": "Antrenman biriminde ısınmadan hemen sonra çalışılması gereken yeti hangisidir?", "o": ["Anaerobik glikolitik kapasite", "Uzun süreli aerobik dayanıklılık", "Maksimal sürat ve çeviklik", "Soğuma", "Kuvvette devamlılık"], "a": 2, "e": "Sinir sisteminin baskın olduğu yetiler tam dinlenik vücut ister."}, {"q": "Bir antrenman oturumunda birlikte çalışılması olumsuz olabilecek yetiler hangisidir?", "o": ["Denge – patlayıcı kuvvet", "Anaerobik glikolitik dayanıklılık – hipertrofiye yönelik kuvvet", "Aerobik dayanıklılık – kuvvette devamlılık", "Çeviklik – yeni öğrenilen teknik", "Koordinasyon – teknik mükemmellik"], "a": 1, "e": "Uyumsuz yüklenmeler birbirinin uyum etkisini baskılar."}, {"q": "Hazırbulunuşluk puanlamasında toplam puan 4'e yakınsa ne anlaşılır?", "o": ["Sporcu zirvededir", "Sporcu yeterince toparlanamamıştır", "Sporcu sakatlanmıştır", "Puanın anlamı yoktur", "Sporcu antrenmana tamamen hazırdır"], "a": 1, "e": "16'ya yakın puan tam hazır olmayı gösterir."}, {"q": "Zirve performans genellikle ne kadar süre korunabilir?", "o": ["3 ay", "Tüm sezon", "7-10 gün", "1 ay", "1-2 gün"], "a": 2, "e": "Bir yılda 2-3 kez gerçek zirveye ulaşılabilir."}, {"q": "Yüklenmeyi azaltma (taper) antrenmanlarının temel amacı nedir?", "o": ["Kilo aldırmak", "Şiddeti tamamen sıfırlamak", "Yorgunluğu azaltmak", "Kapsamı artırmak", "Yeni teknik öğretmek"], "a": 2, "e": "Kondisyon korunurken birikmiş yorgunluk giderilir."}, {"q": "Takım sporlarında yaygın taper yaklaşımı hangisidir?", "o": ["Sadece şiddet azaltılır, kapsam artırılır", "Şiddet ve kapsam birlikte artırılır", "Antrenmanlar tamamen kesilir", "Sadece maç yapılır", "Şiddet yüksek tutulup kapsam ve sıklık azaltılır"], "a": 4, "e": "Şiddetin korunması kazanılmış uyumları korur."}, {"q": "Yıllık periyotlamanın dinamik yapısını yönetmede en değerli veriye nasıl ulaşılır?", "o": ["Sadece performans testi yaparak", "Sadece makale okuyarak", "Sadece olimpiyat antrenörlerini kopyalayarak", "Tutulan kayıtları bütünsel olarak değerlendirip yorumlayarak", "Sadece seminerlere katılarak"], "a": 3, "e": "Veriyi toplamak başlangıçtır; başarı onu bağlamında yorumlamaktır."}, {"q": "Sporcu ihtiyaç analizinin üç temel sorusu arasında hangisi YER ALMAZ?", "o": ["Sporcunun hangi takımı tuttuğu", "Hepsi yer alır", "Branşın biyomekanik ihtiyaçları", "En sık görülen yaralanmalar", "Branşın metabolik ihtiyaçları"], "a": 0, "e": "Metabolik, biyomekanik ve yaralanma analizi yapılır."}, {"q": "Antrenman planlaması ve periyotlamasındaki bilimsel bilgiye yönelik en büyük sorunun kaynağı aşağıdakilerden hangisidir?", "o": ["Bilgilerin yanlış olması", "Bilgilerin uygulama alanında kullanılamaması", "Bilgilere sağlıklı erişim olanağı bulunmaması", "Bilgilerin çok geç erişime sunulması", "Bilginin elde edilmesinde kullanılan hatalı/eksik bilimsel araştırma tasarımları"], "a": 4, "e": "Doğru cevap: Bilginin elde edilmesinde kullanılan hatalı/eksik bilimsel araştırma tasarımları.", "kb": 1}, {"q": "Antrenman planlaması ve periyotlamasının başarılı yönetilmesindeki en değerli bilgi kaynağı aşağıdakilerden hangisidir?", "o": ["Bilimsel makaleler", "Bilimsel kitaplar", "Elit sporcular", "Güvenilir ve geçerli bilimsel bilgiyi uygulama alanında başarıyla kullanmış uygulamacılar", "Profesörler"], "a": 3, "e": "Doğru cevap: Güvenilir ve geçerli bilimsel bilgiyi uygulama alanında başarıyla kullanmış uygulamacılar.", "kb": 1}, {"q": "\"Yüklenmedeki tekrar sayısı, set sayısı, yük miktarı, antrenman süresi ve dinlenme süresi gibi değişkenlerin uzun vadeli olarak düzenlenmesine antrenman periyotlaması denir\" tanımını yapan bir araştırmacının en temel hatası aşağıdakilerden hangisidir?", "o": ["Bireysel farklılıkları göz ardı etmiştir.", "Periyotlama ve planlama kavramlarını birbiriyle karıştırmıştır.", "Periyotlamanın psikolojik boyutunu tanımlamaya dâhil etmemiştir.", "Periyotlamanın en önemli değişkeni olan maks VO2 düzeyinden bahsetmemiştir.", "Hata yapmamıştır."], "a": 1, "e": "Doğru cevap: Periyotlama ve planlama kavramlarını birbiriyle karıştırmıştır..", "kb": 1}, {"q": "Aşağıdakilerden hangisi geleneksel periyotlama yaklaşımını savunanların ve bu yaklaşıma eleştirel yeni bir yaklaşım geliştirenlerin en büyük yanılgısının kaynağıdır?", "o": ["Var olan bilgiyi bağlamı içinde bütünsel olarak değerlendirmemek.", "Periyotlamada hazırlık periyodunu yeterince uzun tutmamak.", "Olimpiyatlara yönelik periyotlamanın felsefesini anlamamak.", "Takım sporları ve bireysel sporlara yönelik farklı yaklaşımlar geliştirememek.", "Periyotlamada kadın ve erkeklere yönelik farklı yaklaşımlar sunamamak."], "a": 0, "e": "Doğru cevap: Var olan bilgiyi bağlamı içinde bütünsel olarak değerlendirmemek..", "kb": 1}, {"q": "\"İki-uçlu (çift uçlu) periyotlama\" terimindeki uç kelimesi aşağıdakilerden hangisini ifade eder?", "o": ["İki temel yetinin geliştirilmesini", "Periyotlamanın hem kadınlar hem de erkekler için kullanılabileceğini", "İki yüklenme döngüsünü bir dinlenme döngüsünün takip ettiğini", "Performansın iki ayrı zaman diliminde en üst düzeye yaklaştırılmasını", "Periyotlamanın tersten de uygulanabileceğini"], "a": 3, "e": "Doğru cevap: Performansın iki ayrı zaman diliminde en üst düzeye yaklaştırılmasını.", "kb": 1}, {"q": "Bir antrenman oturumunda bir arada çalışılması olumsuz olabilecek yetiler aşağıdakilerden hangisinde verilmiştir?", "o": ["Çeviklik - Yeni öğrenilen teknik", "Denge - Patlayıcı kuvvet", "Anaerobik glikolitik dayanıklılık - Hipertrofiye yönelik kuvvet", "Koordinasyon - Teknik mükemmellik", "Aerobik dayanıklılık - Kuvvette devamlılık"], "a": 2, "e": "Doğru cevap: Anaerobik glikolitik dayanıklılık - Hipertrofiye yönelik kuvvet.", "kb": 1}, {"q": "Bir mezo döngünün sonunda kazanılması gereken çok önemli bir turnuva varsa antrenörün dikkat etmesi gereken en önemli konu aşağıdakilerden hangisidir?", "o": ["Yüklenmeli antrenmanları turnuva tarihine yakın gerçekleştirerek performansı artırmak.", "Döngü boyunca sadece teknik çalışmalara odaklanmak.", "Döngü boyunca sadece taktik çalışmalara odaklanmak.", "Döngü boyunca beslenme düzenini sistematik olarak değiştirmek.", "Zirveleme ve yüklenmeyi azaltma stratejileriyle fiziksel/psikolojik kondisyon ve yorgunluk düzeyini yöneterek performansı artırmak."], "a": 4, "e": "Doğru cevap: Zirveleme ve yüklenmeyi azaltma stratejileriyle fiziksel/psikolojik kondisyon ve yorgunluk düzeyini yöneterek performansı artırmak..", "kb": 1}, {"q": "Aşağıdakilerden hangisi antrenman planlaması ve periyotlamasında antrenman yüklenmesinin yönetilmesi süreci sırasındaki hatanın kaynağıdır?", "o": ["Bireysel anaerobik eşik ve maks VO2 düzeylerinin hesaplanmaması", "Dinlenme ve toparlanmaya çok fazla süre ayrılması", "Antrenman yüklerinin sayısallaştırılmasında teknolojik cihazlara yer verilmemesi", "Antrenman yüklenmesi ve toparlanma düzeyinin öznel değerlendirmesine yönelik sporcudan birebir iletişimle geri bildirim alınmaması", "Antrenörlerin güncel bilimsel makaleleri takip etmemesi"], "a": 3, "e": "Doğru cevap: Antrenman yüklenmesi ve toparlanma düzeyinin öznel değerlendirmesine yönelik sporcudan birebir iletişimle geri bildirim alınmaması.", "kb": 1}, {"q": "Aşağıdakilerden hangisi yıllık antrenman periyotlamasının sürekli güncellenen dinamik yapısının yönetilmesinde kullanılabilecek en değerli veriye ulaşma şeklidir?", "o": ["Antrenman periyotlamasının her boyutuna yönelik tutulan kayıtları bütünsel olarak değerlendirip yorumlayarak", "Düzenli performans testleri düzenleyerek", "Olimpiyatlarda üst düzey başarıya ulaşmış antrenörlerin periyotlamasını takımımızda uygulayarak", "Bilimsel kuruluşların düzenlediği güncel eğitim seminerlerine katılarak", "Güncel bilimsel makaleleri sürekli inceleyerek"], "a": 0, "e": "Doğru cevap: Antrenman periyotlamasının her boyutuna yönelik tutulan kayıtları bütünsel olarak değerlendirip yorumlayarak.", "kb": 1}, {"q": "Yaşam boyu sporun bir devlet politikası ile planlanması ve periyotlamasının bir ülkeye kazandıracakları en uygun şekilde ifadesi aşağıdakilerden hangisidir?", "o": ["Uluslararası arenada sportif başarı", "Milli takıma aday olabilecek daha fazla sayıda sporcu yetiştirmek", "Daha uzun sporculuk kariyerlerinin ortaya çıkarılması", "Elit sporculara yönelik aktif sporun bırakılması sonrası istihdam sağlaması", "Uluslararası arenada sportif başarı ve toplumsal refahın artması"], "a": 4, "e": "Doğru cevap: Uluslararası arenada sportif başarı ve toplumsal refahın artması.", "kb": 1}], "tf": [{"q": "Antrenman planlaması terimi sıklıkla hatalı olarak antrenman periyotlaması yerine kullanılır.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "İkisi bağlantılı ama farklı kavramlardır.", "tf": true}, {"q": "Mikro döngüler her zaman tam 7 gün olmak zorundadır.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Genellikle haftalıktır ama 3 veya 11 gün de olabilir.", "tf": true}, {"q": "Blok periyotlama temel olarak elit düzeydeki sporcuların başarısı için ortaya konmuştur.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Altyapıda uzun vadeli gelişim ve çok yönlülük önceliklidir.", "tf": true}, {"q": "Altyapı takımlarında periyotlamanın birincil amacı turnuva kazanmaktır.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Turnuva başarısı yalnızca bir 'bonus'tur; asıl amaç uzun vadeli gelişimdir.", "tf": true}, {"q": "Sinir sisteminin baskın olduğu yetiler yorgunken daha iyi gelişir.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Bu yetiler dinlenik vücut ister.", "tf": true}, {"q": "Süratle bağlantılı yetilerdeki kazanımlar, diğer yetilere göre daha kısa sürede kaybolur.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Bu yüzden en sık onlar antrene edilmelidir.", "tf": true}, {"q": "Yıllık plan, müsabakaya hazırlık periyodunun son haftasından başlanarak geriye doğru tasarlanır.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Balyi ve ark. adımlarında böyle önerilir.", "tf": true}]}, {"id": "hab7", "title": "Performans Ölçme ve Değerlendirme", "cards": [{"title": "Neden test yaparız?", "points": ["Her antrenman programı **test ve değerlendirmeyle başlamalıdır**.", "Testler: yükü (şiddet, hacim, süre) ayarlamak, **sakatlığı ve aşırı antrenmanı önlemek**, müsabakaya hazırlığı ve uyumu ölçmek, **güçlü-zayıf yönleri** bulmak içindir. Aynı zamanda **motivasyon** kaynağıdır.", "**Alan testleri** az ekipman ister (kronometre, şerit metre, koni); ucuz, güvenli ve hızlıdır.", "Değerlendirmede **kronolojik, biyolojik ve antrenman yaşı**, cinsiyet, sağlık durumu dikkate alınır.", "Güvenilirlik için test **aynı zeminde, aynı saatte, aynı ekipmanla, mümkünse aynı kişi** tarafından yapılır; öncesinde iyi ısınma şarttır."]}, {"title": "Atletik gelişim evreleri (Bompa ve Carrera)", "points": ["**Başlangıç:** 6-10 yaş.", "**Atletik oluşum:** 11-14 yaş.", "**Uzmanlaşma:** 15-18 yaş.", "**Yüksek performans:** 19 yaş ve üzeri.", "**Kaba motor beceriler** (emekleme, yürüme, koşma) çok erken başlar; **ince motor beceriler** (tutma, kavrama, yazma) başlangıç evresinde belirginleşir."]}, {"title": "Çocuklarda dayanıklılık fizyolojisi", "points": ["Çocuklarda VO2maks yetişkinlerden **düşüktür**. VO2maks'ın geliştirilebilirliği **~14 yaşta** zirveye çıkar.", "8-16 yaş arasında VO2maks **erkeklerde %150**, **kızlarda %80** artar. Ergenlik öncesi sonunda kızların VO2maks'ı erkeklerden **%10-15** düşüktür.", "Belirgin dayanıklılık kazanımı: **kızlarda 12-14**, **erkeklerde 15-16 yaş**.", "Çocuklarda **kas glikojeni yetişkinlerin %50-60'ı** kadardır; laktat değerleri düşüktür → **anaerobik glikolitik kapasite sınırlıdır** (15 sn-3 dk). 10-15 sn'lik fosfojen kapasitesi yetişkinle aynıdır.", "Bu yüzden çocuklara **200-400 m** gibi laktik asit yükü yaratan koşular yaptırılmamalıdır."]}, {"title": "Kardiyovasküler dayanıklılık testleri", "points": ["**Altın standart:** laboratuvarda **gaz analizörüyle doğrudan ölçülen VO2maks**.", "**Cooper 12 dk** (Balke'nin 15 dk testinden geliştirildi) yetişkinler için popülerdir, **ergenlik öncesine uygun değildir**; gerekiyorsa **9 dk** versiyonu (5-12 yaş) kullanılır.", "Okul çocukları için en iyi test: **FITNESSGRAM 1 mil (1,6 km) yürüyüş/koşu**. 10 yaş üstü uygulayabilir; 6-10 yaş için milin 1/4-1/3'ü uygundur.", "**PACER (20 m çok aşamalı mekik koşusu):** Leger ve Lambert (1982); sinyal sesine göre giderek hızlanan koşu, **21 seviye**, her seviye ~1 dk.", "**Basamak testi:** **41,3 cm** basamak, **3 dk**, erkek **24**, kız **22** adım/dk; sonra nabız ölçülür.", "Dayanıklılık ölçümlerine **ergenlik sonrası (13 yaş ve üzeri)** başlanması önerilir."]}, {"title": "Kuvvet ve kassal dayanıklılık testleri", "points": ["**Şınav:** üst vücut kuvveti ve dayanıklılığı; **10 yaş ve üzeri**. Gençlerde 1 dakikadaki sayı kaydedilir.", "**Barfikste kol çekme (pull-up):** üst vücut gücü ve dayanıklılığı; zaman sınırı yok.", "**Bükülü kol asılma:** çene bar üzerinde mümkün olduğunca uzun kalma; **gözler barın altına inince** biter.", "**Core testi:** core **kuvveti** ve üst vücut dayanıklılığı; dirsekler üzerinde ön köprü, kalça düşünce biter. Küçük çocuklar (6-10 yaş) için **modifiye core** testi.", "**Mekik:** dinamik kassal dayanıklılık; 30 sn veya 1 dk.", "**El kavrama (hand grip) dinamometresi:** önkolun **statik** kuvvetini ölçer; her elde 4 deneme, en iyisi alınır.", "Gençlerde **1-TM testi sakatlık riski nedeniyle uygun değildir**; 6-10 TM testleri kullanılır."]}, {"title": "Güç (patlayıcı kuvvet) testleri", "points": ["**Dikey sıçrama:** bacak gücünü ölçmenin **en basit ve en popüler** yoludur. Arada **3 dk** dinlenmeyle 3 deneme, **en iyisi** alınır.", "**Durarak uzun atlama** ve **üç adım atlama:** tüm aşamalarda bacak gücü; başlangıç çizgisi ile en yakın topuk arası ölçülür.", "Test-tekrar test aynı zeminde yapılmalıdır.", "Kemik kütlesinin **%70-80**'i genetiktir; direnç ve yüksek etkili egzersizler **%5-10** katkı sağlar."]}, {"title": "Sürat testleri", "points": ["Sürat 3 bileşen: **ivmelenme**, **maksimal sürat**, **süratte devamlılık**.", "Test mesafeleri: **başlangıç (6-10 yaş) 15-20 m**; geç başlangıç **30 m**; atletik oluşum ve sonrası **30-60 m**.", "**5-10-20-30 m** testleri ivmelenmeyi ölçer; **fotosel** gerekir. Tekrarlar arası en az **3 dk**, en iyi süre alınır.", "Çoğu sporcu maksimum hıza **20-30 m**'de ulaşır. 60 m süresinden 100 ve 200 m tahmin edilebilir.", "**Tekrarlı sprint testi:** 20 sn'lik döngüde **6 × 30 m** maksimal sprint."]}, {"title": "Esneklik testleri", "points": ["**Otur-eriş testi:** **sırt (bel) ve hamstring** esnekliğini ölçer; sehpada dizler bükülmeden en az 2 sn uzanılır.", "**Gövde esneklik testi:** yüzüstü, eller ensede; çene ile zemin arası ölçülür.", "**Omuz esneklik testi:** yüzüstü, bar baş üstünden kaldırılır.", "Esneklik yaşla azalır; ergenlik, cinsiyet farkının **en büyük** olduğu dönemdir."]}, {"title": "Çeviklik testleri", "points": ["Çeviklik **12 yaşa kadar** hızla gelişir; ergenlikten sonra erkekler belirgin şekilde öne geçer.", "**T testi:** 9,1 m × 9,1 m (10 yard); sporcu **hep aynı yöne bakar**, ileri, yan, geri koşu; toplam **40 m**.", "**5-0-5:** 10 m yaklaşma koşusu + **5 m gidiş-dönüş**.", "**İllinois:** 10 m × 5 m parkur, **yüzüstü** başlangıç, 4 koni arasında slalom.", "**Pro-çeviklik (5-10-5)**, **dört koni**, **altıgen testi** (sıçrayarak yön değiştirme, 3 tur).", "**100 m sprint bir çeviklik testi değildir.**"]}, {"title": "Koordinatif yeti testleri", "points": ["**Reaksiyon:** **Nelson el** ve **ayak** reaksiyon testleri (cetvel; 20 deneme, en düşük 5 ve en yüksek 5 atılır), **La Fayette**, **New Test** aleti.", "**Oryantasyon:** numaralı sağlık toplarına dokunma testi (Minz).", "**Kinestetik ayrımlama:** baş üstünden geriye top atarak hedefe isabet ettirme.", "**Ritim:** 11 çemberden ritimli koşu ile 30 m düz koşu arasındaki **fark**.", "**Denge:** **Flamingo** → **statik** denge (60 sn'deki düşüş sayısı); **Yıldız** (8 yön) ve **Y denge** (3 yön) → **dinamik** denge.", "**Esneklik testleri koordinatif yeti testi değildir.**"]}], "questions": [{"q": "Kardiyovasküler dayanıklılık ölçümünde altın standart hangisidir?", "o": ["Cooper 12 dk testi", "Gaz analizörüyle doğrudan ölçülen VO2maks", "Basamak testi", "PACER", "1 mil yürüyüş/koşu"], "a": 1, "e": "Laboratuvar ölçümü pahalıdır; alan testleri ona yüksek korelasyon gösterir."}, {"q": "Okul çağı çocukları için en iyi kardiyovasküler dayanıklılık testi hangisidir?", "o": ["Dikey sıçrama", "Wingate testi", "Flamingo testi", "FITNESSGRAM 1 mil yürüyüş/koşu testi", "Cooper 12 dk koşusu"], "a": 3, "e": "Alternatifi PACER (20 m mekik koşusu) testidir."}, {"q": "Cooper'ın 12 dakika testi ergenlik öncesi çocuklar için neden uygun değildir?", "o": ["Çocukların çalışma ekonomisi yetişkinlerden düşüktür ve formüller onlara uymaz", "Pist gerektirdiği için", "Test çok kısadır", "Çocuklar hızlı koştuğu için", "Nabız ölçülemediği için"], "a": 0, "e": "Gerekirse Cooper'ın 9 dk'lık versiyonu kullanılır."}, {"q": "20 m çok aşamalı mekik koşusu (PACER) kaç seviyeden oluşur?", "o": ["10", "21", "12", "5", "30"], "a": 1, "e": "Her seviye yaklaşık 1 dakikadır."}, {"q": "Basamak testinde erkekler için dakikadaki adım sayısı kaçtır?", "o": ["30", "12", "22", "24", "18"], "a": 3, "e": "Kızlarda 22 adım/dk, basamak 41,3 cm, süre 3 dk."}, {"q": "Çocuklarda kas glikojen miktarı yetişkinlerin yaklaşık ne kadarıdır?", "o": ["%50-60", "%10-20", "%100", "%150", "%80-90"], "a": 0, "e": "Bu yüzden anaerobik glikolitik kapasite sınırlıdır."}, {"q": "8-16 yaş arasında VO2maks erkeklerde yaklaşık ne kadar artar?", "o": ["%50", "%80", "%300", "%20", "%150"], "a": 4, "e": "Kızlarda yaklaşık %80 artar."}, {"q": "Bacak kas gücünü ölçmenin en basit ve en popüler yolu hangisidir?", "o": ["Barfiks testi", "El kavrama testi", "Mekik testi", "Otur-eriş testi", "Dikey sıçrama testi"], "a": 4, "e": "Üç deneme yapılır, en iyi sonuç alınır."}, {"q": "El kavrama dinamometresi hangi kuvveti ölçer?", "o": ["Core dayanıklılığı", "Bacak patlayıcı gücü", "Sürat", "Önkol kaslarının statik kuvveti", "Esneklik"], "a": 3, "e": "Her iki elle 4'er deneme yapılır."}, {"q": "Başlangıç aşamasındaki (6-10 yaş) sporcular için önerilen sürat test mesafesi hangisidir?", "o": ["200 m", "100 m", "60-100 m", "15-20 m", "400 m"], "a": 3, "e": "Atletik oluşum ve sonrasında 30-60 m."}, {"q": "Otur-eriş testi neyi ölçer?", "o": ["Sırt ve hamstring esnekliğini", "Statik dengeyi", "Omuz esnekliğini", "Bacak gücünü", "Reaksiyon süresini"], "a": 0, "e": "Sehpa üzerinde dizler bükülmeden uzanılır."}, {"q": "T testinin diğer çeviklik testlerinden farkı nedir?", "o": ["Sadece düz koşudur", "Yüzüstü pozisyonda başlanır", "Sporcu test boyunca hep aynı yöne bakar", "Sıçrayarak yapılır", "Topla yapılır"], "a": 2, "e": "Yön değişimi yan kayma ve geri koşuyla yapılır."}, {"q": "Yüzüstü pozisyonda başlanan çeviklik testi hangisidir?", "o": ["Altıgen testi", "T testi", "Dört koni testi", "5-0-5 testi", "İllinois testi"], "a": 4, "e": "10 m × 5 m parkurda konilerin arasından koşulur."}, {"q": "Aşağıdakilerden hangisi çeviklik ve yön değiştirme testi DEĞİLDİR?", "o": ["İllinois testi", "5-0-5 testi", "100 m sprint", "Altıgen testi", "T testi"], "a": 2, "e": "100 m doğrusal sürat testidir."}, {"q": "Flamingo denge testi hangi dengeyi ölçer?", "o": ["Ritim", "Kinestetik ayrımlama", "Dinamik denge", "Statik denge", "Oryantasyon"], "a": 3, "e": "Yıldız ve Y denge testleri dinamik dengeyi ölçer."}, {"q": "Nelson el reaksiyon testinde kaç deneme yapılır?", "o": ["5", "50", "3", "20 (en düşük ve en yüksek 5'er deneme atılır)", "10"], "a": 3, "e": "Kalan 10 denemenin ortalaması alınır."}, {"q": "Aşağıdakilerden hangisi koordinatif yetiyi ölçen testlerden biri DEĞİLDİR?", "o": ["Oryantasyon testi", "Esneklik testleri", "Denge testleri", "Ritim testi", "Reaksiyon zamanı testleri"], "a": 1, "e": "Esneklik bir biyomotor yetidir."}, {"q": "Çocuk ve gençlerde kardiyovasküler dayanıklılığı ölçebilmek için kullanılan test aşağıdakilerden hangisidir?", "o": ["Durarak uzun atlama", "150 metre sprint", "20 metre çok evreli mekik testi (PACER)", "1 dk mekik testi", "Altıgen testi"], "a": 2, "e": "Doğru cevap: 20 metre çok evreli mekik testi (PACER).", "kb": 1}, {"q": "Aşağıda verilen testlerden hangisi çocuk ve gençlerde uygulanan alan testlerinden biri değildir?", "o": ["Ritim testi", "Wingate testi", "T testi", "30 metre sprint", "1 mil koşu testi"], "a": 1, "e": "Doğru cevap: Wingate testi.", "kb": 1}, {"q": "Aşağıdaki testlerden hangisi çocuk ve gençlerde çeviklik ve yön değiştirme yetisinin ölçümünde kullanılmaz?", "o": ["100 m sprint", "Altıgen testi", "İllinois testi", "T testi", "505 testi"], "a": 0, "e": "Doğru cevap: 100 m sprint.", "kb": 1}, {"q": "Çocuk ve gençlerde esneklik biyomotor yetisini ölçen test aşağıdakilerden hangisidir?", "o": ["Yıldız testi", "T testi", "Altıgen testi", "Cooper testi", "Otur-eriş testi"], "a": 4, "e": "Doğru cevap: Otur-eriş testi.", "kb": 1}, {"q": "1 mil yürüyüş/koşu testi hangi biyomotor yetiyi ölçmek için kullanılmaktadır?", "o": ["Kuvvet", "Sürat", "Kardiyovasküler dayanıklılık", "Çeviklik", "Ritim"], "a": 2, "e": "Doğru cevap: Kardiyovasküler dayanıklılık.", "kb": 1}, {"q": "Çocuk ve gençlerde bacak kas kuvvetini ölçen test aşağıdakilerden hangisidir?", "o": ["Barfiks testi", "Core testi", "Otur-eriş testi", "Dikey sıçrama testi", "Mekik testi"], "a": 3, "e": "Doğru cevap: Dikey sıçrama testi.", "kb": 1}, {"q": "Çocuk ve gençlerde denge koordinatif yetisini ölçen test aşağıdakilerden hangisidir?", "o": ["Flamingo", "T testi", "Basamak testi", "Cooper testi", "Otur-eriş testi"], "a": 0, "e": "Doğru cevap: Flamingo.", "kb": 1}, {"q": "Aşağıdakilerden hangisi koordinatif yetiyi ölçen testlerden biri değildir?", "o": ["Esneklik testleri", "Reaksiyon zamanı testleri", "Denge testleri", "Ritim testi", "Oryantasyon testi"], "a": 0, "e": "Doğru cevap: Esneklik testleri.", "kb": 1}, {"q": "Çocuklarda kas kuvvetini ölçmek için aşağıdaki testlerden hangisi kullanılmaz?", "o": ["El kavrama kuvvet testi", "1 tekrar maksimum", "Şınav testi", "Bükülü kol asılma testi", "Dikey sıçrama testi"], "a": 1, "e": "Doğru cevap: 1 tekrar maksimum.", "kb": 1}, {"q": "Core testi hangi biyomotor yetiyi ölçmek için kullanılır?", "o": ["Sürat", "Çeviklik", "Esneklik", "Kassal dayanıklılık", "Kuvvet"], "a": 4, "e": "Doğru cevap: Kuvvet.", "kb": 1}], "tf": [{"q": "Gençlerde kuvvet ölçümünde 1-TM testi sakatlık riski nedeniyle uygun bulunmaz.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Bunun yerine 6-10 TM testleri kullanılır.", "tf": true}, {"q": "Dayanıklılık ölçümlerine ergenlik öncesinde başlanması önerilir.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Ergenlik sonrası (13 yaş ve üzeri) önerilir.", "tf": true}, {"q": "Çocuklarda 10-15 saniyelik aktivitelerdeki fosfojen depoları yetişkinlerle aynıdır.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Sınırlı olan 15 sn-3 dk arası glikolitik kapasitedir.", "tf": true}, {"q": "Testlerin güvenilirliği için test-tekrar test aynı zeminde ve koşullarda yapılmalıdır.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Saat, rüzgâr, sıcaklık, ekipman ve uygulayıcı aynı olmalıdır.", "tf": true}, {"q": "Bükülü kol asılma testi, gözler barın altına düştüğünde sona erer.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Süre saniye olarak kaydedilir.", "tf": true}, {"q": "Ergenlikten önce erkek ve kızların çeviklik performansı arasında büyük fark vardır.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Ergenlikten önce fark azdır; sonra erkekler belirgin şekilde öne geçer.", "tf": true}, {"q": "Ritim testinde skor, ritimli çember koşusu ile düz 30 m koşu arasındaki farktır.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Minz (2003) testidir.", "tf": true}]}, {"id": "hab8", "title": "Dünyada ve Türkiye'de Yetenek Seçimi", "cards": [{"title": "Yetenek seçiminin felsefesi", "points": ["Bugün yetenekli sporcuyu kesin olarak belirleyen **tek bir ölçüm yöntemi yoktur** (Vaeyens).", "Elit sporcu olmak için yaklaşık **10 yıl / 10.000 saat** antrenman gerekir (Ericsson ve ark., 1993).", "Temel amaç sadece madalya değil; çocukların **yeteneklerine uygun spora katılımını artırmak** ve onları uygun branşa **yönlendirmektir**.", "Başka ülkelerin projelerini **taklit etmek** işe yaramaz; ülke koşullarına göre **özgün** yol bulunmalıdır. Yetenek havuzu ne kadar büyükse en iyiyi bulmak o kadar kolaydır.", "Gardner: \"Toplumda yetenekli bir gencin eğitilmesinden daha önemli bir konu yoktur.\""]}, {"title": "Sürecin aşamaları (Williams ve Reilly, 2000)", "points": ["**1. Yetenek belirleme (detection):** spora katılan çocukların **genel** yeteneklerinin tespiti → sürecin **ilk aşaması**.", "**2. Yetenek tanılama ve yönlendirme (identification):** elit olma potansiyeli olanları bulmak ve uygun branşa önermek.", "**3. Yetenek gelişimi (development):** potansiyeli olan çocuğa **eğitim ortamı ve kaynakların sağlanması**.", "**4. Yetenek seçimi (selection):** gelişimini tamamlayanlardan başarıya yakın olanların **scout/antrenörlerce** kulüplere seçilmesi.", "Akış şemasında **\"yetenek seçimi yöntemlerinin belirsizliği\"** diye bir aşama **yoktur**."]}, {"title": "Temel seçim evresi", "points": ["Sürecin ilk evresidir; takvim yaşına göre **4-8 yaş** çocuklara geniş tabanlı ölçümler yapılır; yaklaşık **4 yıl**, 6 ayda ya da yılda bir.", "Bu evrede **yalnızca genel sağlık durumu** eleme için kullanılır; diğer veriler kaydedilir. Sağlığı uygun olmayan çocuk resim, müzik gibi alanlara yönlendirilir.", "Önce ebeveynler bilgilendirilir ve **\"Ebeveyn İzin Formu\"** alınır. Ardından **13 soruluk \"Fiziksel Aktiviteye Hazırlık Ölçeği\"** doldurulur; bir \"evet\" varsa **hekim onayı** şarttır.", "Toplananlar: **demografik bilgiler** (ebeveynlerin fiziksel özellikleri ve spor geçmişi önemlidir), boy, kilo, **BKİ**, motorik testler.", "Motor testler dayanıklılık testleriyle aynı gün yapılacaksa **motor testler önce** yapılır."]}, {"title": "Test bataryaları ve Eurofit", "points": ["ABD'de **1958**'de **AAHPERD** \"Gençler için Fiziksel Uygunluk Testi (YFT)\"; sonra **HRPFT (1984)**, **FITNESSGRAM (1988)**, **Physical Best**.", "Avrupa'da 1978'den sonra çalışmalar başladı; fikir **Avrupa Konseyi Spor Kalkınma Komitesi**'nden çıktı.", "**Avrupa Konseyi Bakanlar Komitesi**, **11 Mayıs 1987**'de **R-87** sayılı kararla okul çocukları için **Eurofit** testlerini önerdi.", "Eurofit örnekleri: **flamingo denge**, **disklere dokunma** (kol hareket hızı), otur-eriş, durarak uzun atlama, el kavrama, mekik, **bükülü kol asılma**, 10×5 m mekik koşusu, 20 m mekik koşusu.", "Yetenek seçimi evreleri: **3-10**, **11-14** ve **15 yaş üstü**; yaygın uygulamada 4 yaşta başlar, 17 yaşa kadar sürer."]}, {"title": "Almanya modeli", "points": ["Temelleri **Doğu Almanya** döneminde atıldı. Yetenek psikolojik, genetik ve sosyolojik faktörlerin etkilediği **çok boyutlu** bir yapıdır.", "**Okullardaki zorunlu beden eğitimi derslerinde** yetenekli çocuklar belirlenip farklı branşlardaki **sistem (pilot) takımlarına** yönlendirilir.", "Her aşamada seçim yapılır, uygun olmayanlar elenir. Yaklaşık **2000 okul, 70.000 çocuk, 10.000 tam gün antrenör**.", "İlk evre **9-10 yaş**; son evrede 6 ay branş antrenmanı yapılır.", "Başarının anahtarı: **yüksek bütçe, sabır, disiplin ve koordinasyon**."]}, {"title": "ABD modeli", "points": ["**Sistematik olarak tanımlanmış bir model yoktur.** **Doğal seçim**: spora katılım bireyin **istek ve eğilimine** göre olur → **sporcunun isteği birinci önceliktir**.", "Fiziksel testlerle ilgili ilk çalışmalar **askerî** amaçlıdır.", "Önemli katkı: **test bataryaları** (YFT, FITNESSGRAM) ve branşa özel testler.", "**NBA**'de draft edilen deneyimsiz oyuncular bile tekrar fiziksel testlere girer (20 m mekik, antropometri, çeviklik, sürat)."]}, {"title": "Avustralya modeli", "points": ["1970-80'lerin olimpik başarısızlıklarından sonra, özellikle **2000 Sidney Olimpiyatları** için geliştirildi.", "Anahtar: **en doğru tahmin için en doğru performans ölçümü**; multidisipliner yaklaşım.", "5 kural: çocuk **kendi iradesiyle** karar vermeli; yetenek **tek gözlemle** belirlenemez; **\"büyük balık büyük gölette tutulur\"** (geniş tarama); uzmanlaşmadan önce **temel spor eğitimi**; branşa yönlendirme zamanı iyi belirlenmeli.", "1. aşama **12-16 yaş** testleri → ulusal normlarda **ilk %2** \"yetenekli\"; 2. aşamada **ilk %10** yetenek gelişim programına alınır; 3. aşama özel antrenman.", "Yüzme için ailenin **ayakkabı numarası, boyu** ve spor geçmişi kaydedilir."]}, {"title": "Çin, Britanya ve Kanada", "points": ["**Çin (1985):** 4 aşamalı, **okul temelli**; insan kaynağı zengin olduğu için **doğal seçim**. 11-13 → 14-16 → 17-18 yaş → ulusal merkezler. 2008 Pekin öncesi güncellendi.", "**Britanya:** **Avustralya** modeline dayanır; **2012 Londra**'da ilk 5'e girme hedefi. **Lottery Sports Funding** (Spor Toto benzeri). Programlar: World Class Performance, Potential, Start, Events. Londra'da **65 madalya** ile **3.** oldu.", "**Kanada:** **Uzun Vadeli Sporcu Gelişimi (LTAD)** modeli, **7 aşamalı**. Elit sporcu için ~**10 yıl**. Mottolar: **\"Mükemmellik zaman alır\"**.", "LTAD'de **kızlarda 8-11, erkeklerde 9-12 yaş** **\"altın öğrenme çağı\"**dır. Elit olamayanlar da **ömür boyu spora** yönlendirilir."]}, {"title": "Sovyet (Rusya) modeli", "points": ["Soğuk savaş rekabetinden doğdu; \"**spor makinesi**\" olarak anıldı.", "**Temel seçim (8-10 yaş):** beden eğitimi öğretmenlerinin gözlemiyle kitlesel tarama.", "**Ön seçim (10-12 yaş):** özel spor testleri; **uygun olmayanlar
