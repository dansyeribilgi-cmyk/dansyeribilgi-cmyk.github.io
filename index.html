e yönelik rehberde tempo düzeye göre artırılır; orta düzeyde orta-hızlı tempo önerilir."}, {"q": "Antrenman biliminde süratin dört temel türü arasında yer ALMAYAN hangisidir?", "o": ["Koşma sürati", "Maksimal sürat", "Süratte devamlılık", "İvmelenme sürati", "Reaksiyon sürati"], "a": 0, "e": "Sürat sistematik olarak reaksiyon, ivmelenme, maksimal sürat ve süratte devamlılık olarak ayrılır."}, {"q": "Elit sporcu olma potansiyeli olan çocuklara uygun spor dalında yeteneklerini en üst düzeye çıkaracak eğitim ortamı ve kaynakların sağlanması hangi süreçtir?", "o": ["Yetenek seçimi", "Yetenek belirleme", "Yetenek gelişimi", "Yetenek yönlendirmesi", "Yetenek tanımlama"], "a": 2, "e": "Belirlenen yeteneğe uygun ortam ve kaynak sağlamak yetenek gelişimi sürecidir."}, {"q": "Boyut olarak hız, etki olarak kol hareket hızıyla ilgili test hangisidir?", "o": ["Durarak uzun atlama", "Disklere dokunma", "Flamingo denge", "Mekik", "Otur-eriş"], "a": 1, "e": "Disklere dokunma testi Eurofit bataryasında kol hareket hızını ölçer."}, {"q": "Okullardaki zorunlu beden eğitimi derslerinde yetenekli çocukların belirlenip farklı spor dallarındaki sistem takımlarına yönlendirilmesine dayanan model hangi ülkeye aittir?", "o": ["Çin", "Almanya", "İngiltere", "Avustralya", "ABD"], "a": 1, "e": "Almanya modeli okul beden eğitimi üzerinden yetenekleri belirleyip yönlendirir."}, {"q": "Türkiye'de Olimpik Merkezler planlamasında bisiklet ve okçuluk branşları hangi ile verilmiştir?", "o": ["Trabzon", "Erzurum", "Antalya", "Eskişehir", "Konya"], "a": 2, "e": "Branşlar ilin spor alt yapısı ve potansiyeline göre belirlenmiştir."}, {"q": "Antrenman sonrası toparlanma süreçlerinde yaklaşık 3-4 dakika süren süperkompanzasyon hangisidir?", "o": ["Mitokondri sayısının artışı", "Kas glikojeninin süperkompanzasyonu", "Yağ depolarının yenilenmesi", "Kas fosfojenlerinin (ATP-KP) süperkompanzasyonu", "Kas proteinlerinin yenilenmesi"], "a": 3, "e": "Fosfojenler dakikalar içinde, glikojen saatler-günler içinde yenilenir."}, {"q": "Belirli kas gruplarının uzun süre tekrarlayan hareketler yapabilme yeteneğini ölçen testler hangileridir?", "o": ["Reaksiyon testleri", "Maksimal kuvvet testleri", "Denge testleri", "Esneklik testleri", "Dinamik kas dayanıklılığı testleri"], "a": 4, "e": "Ör. belirli sürede yapılan şınav veya mekik sayısı."}, {"q": "Otur-eriş testi öncelikle hangi özelliği ölçer?", "o": ["Reaksiyon süresini", "Bacak kuvvetini", "Aerobik kapasiteyi", "Denge yeteneğini", "Sırt ve hamstring esnekliğini"], "a": 4, "e": "Otur-eriş bir esneklik testidir."}, {"q": "Çok yönlü hızı ve önceden planlanmış yön değiştirme yeteneğini ölçen test hangisidir?", "o": ["T testi", "Dikey sıçrama", "Wingate testi", "Flamingo testi", "Cooper testi"], "a": 0, "e": "T testinde ileri, yan ve geri koşularla yön değiştirme ölçülür."}, {"q": "Dinamik ve balistik germe ile ilgili aşağıdakilerden hangisi YANLIŞTIR?", "o": ["Balistik germede son pozisyonda sabit durulmaz, yaylanma yapılır", "Balistik germe sakatlanma riski taşıyabilir", "Dinamik germe hareket aralığında kontrollü hareketlerle yapılır", "Dinamik germe egzersiz öncesi ısınmada tercih edilmez", "Dinamik germe ısınma bölümünde sıklıkla kullanılır"], "a": 3, "e": "Dinamik germe ısınmada tercih edilen germe türlerindendir."}, {"q": "Hareketin mekân boyutu içinde akıcı ve dinamik değişimlere göre hareket edebilme özelliği hangi koordinatif yetidir?", "o": ["Denge yeteneği", "Ritim yeteneği", "Kinestetik ayrımlama", "Reaksiyon yeteneği", "Oryantasyon yeteneği"], "a": 1, "e": "Ritim yeteneği \"zamanın farkında olma\" ile de tanımlanır."}, {"q": "Uyum oluşturmak amacıyla aşırı yüklenme uygulayıp performansta bilinçli ve geçici bir düşüşe yol açan planlama stratejisi hangisidir?", "o": ["Planlanmış aşırı zorlanma (functional overreaching)", "Zirveleme", "Bakım dönemi", "Taper dönemi", "Aktif dinlenme"], "a": 0, "e": "Ardından gelen toparlanma ile performansta süperkompanzasyon beklenir."}, {"q": "Klasik periyotlamada eğlenceli etkinliklerle aktif dinlenmenin yapıldığı evre hangisidir?", "o": ["Müsabaka öncesi evre", "Geçiş evresi", "Genel hazırlık evresi", "Müsabaka evresi", "Özel hazırlık evresi"], "a": 1, "e": "Geçiş evresi fiziksel ve zihinsel toparlanma içindir."}, {"q": "Bir antrenman oturumunda zamansal olarak antrenmanın ortasına yerleştirilmesi uygun olan yeti hangisidir?", "o": ["Teknik öğrenme", "Aerobik dayanıklılık", "Reaksiyon", "Sürat ve koordinasyon", "Anaerobik glikolitik güç"], "a": 4, "e": "Sürat-koordinasyon başta, laktik güç ortada, aerobik dayanıklılık sonda çalışılır."}, {"q": "Bir antrenman oturumunda zamansal olarak antrenmanın sonunda geliştirilmesi uygun olan yeti hangisidir?", "o": ["Maksimal sürat", "Koordinasyon", "Aerobik dayanıklılık", "Yeni teknik öğrenme", "Reaksiyon sürati"], "a": 2, "e": "Yorgunluk sinir-kas kalitesini bozduğu için sürat ve koordinasyon başta çalışılır."}, {"q": "Dayanıklılık, bireyin fiziksel aktiviteye ve yorgunluğa rağmen gösterdiği hangi yetidir?", "o": ["Hızlanma", "Denge kurma", "Tepki verme", "Esneme", "Direnç (yorgunluğa karşı koyabilme)"], "a": 4, "e": "Dayanıklılık yorgunluğa karşı direnç gösterebilme yetisidir."}, {"q": "400 m koşusunda aerobik ve anaerobik enerji katkısı yaklaşık olarak nasıldır?", "o": ["Aerobik %50 – Anaerobik %50", "Aerobik %70 – Anaerobik %30", "Aerobik %5 – Anaerobik %95", "Aerobik %17 – Anaerobik %83", "Aerobik %83 – Anaerobik %17"], "a": 3, "e": "Kısa ve çok şiddetli yüklenmelerde anaerobik katkı baskındır."}, {"q": "Aşağıdakilerden hangisi VO2maks'ı etkileyen faktörler arasında sayılmaz?", "o": ["Yaş", "Genetik", "Cinsiyet", "Anaerobik enzimler", "Antrenman durumu"], "a": 3, "e": "VO2maks; genetik, yaş, cinsiyet, antrenman durumu ve aerobik kapasiteyle ilişkilidir."}], "source": "Kitap: GSB Antrenör Eğitimi 2. Kademe (AÖF) kitabı; özetler ve sorular özgün olarak yazılmıştır"}, {"id": "ssb", "title": "Spor ve Sağlık Bilimleri II", "short": "Sağlık", "icon": "❤️", "color": "#D9534F", "units": [{"id": "ssb1", "title": "Spor Anatomisi ve Kinesiyoloji II", "cards": [{"title": "Boyun kasları", "points": ["Boyun, baş hareketleri, denge ve başın ağırlığını taşımada esas rolü oynar.", "**Platysma:** boyun derisini gerer, alt çeneyi ve ağız köşesini aşağı çeker → **jest ve mimiklerden** sorumludur.", "**Sternocleidomastoideus:** tek taraflı kasılınca yüzü **karşı tarafa** çevirir, başı aynı tarafa eğer; çift taraflı boynu dik tutar ve **inspirasyona** yardım eder.", "**Scalenus** kasları 1. ve 2. kaburgayı kaldırarak **inspirasyona** yardım eder."]}, {"title": "Omurga (columna vertebralis)", "points": ["Çocukta **33-34**, yetişkinde **26** omur. **7 boyun (C), 12 göğüs (T), 5 bel (L), 5 sakral, 4-5 koksiks**.", "İlk **24** omur hareketlidir (presakral); aralarında **disk (discus intervertebralis)** vardır. Sakral omurlar birleşip **sacrum**, son 4-5 omur **os coccygis** olur.", "Görevleri: **vertebral kanaldan geçen omuriliği korumak**, boşlukları arkadan korumak, gövdeyi dik tutmak, ağırlığı alt ekstremiteye iletmek.", "Bel omurları hareketli omurlar içinde **en geniş gövdeli** olanlardır. Göğüs omurlarında rotasyon fazladır; bel omurlarında fleksiyon-ekstansiyon rahattır."]}, {"title": "Omurga eğrilikleri ve hareketleri", "points": ["**Sagittal eğrilikler (4):** **servikal lordoz**, **torakal kifoz**, **lumbal lordoz**, **sakral kifoz**. Doğuşta yalnızca torakal ve sakral eğrilikler vardır.", "Aşırı arkaya konveksliğe **kifoz**, öne **lordoz**, yana eğriliğe **skolyoz** denir. Eğrilikler yer tepki kuvvetlerini **sönümler**.", "Hareketler: **fleksiyon** (sagittal eksende öne), **ekstansiyon** (arkaya), **lateral fleksiyon** = omurganın **frontal eksende yana eğilmesi**, **rotasyon** (transvers eksende dönme), **sirkumdüksiyon**.", "\"İnterkostal\" bir sagittal eğrilik **değildir**; kaburgalar arası kasların adıdır."]}, {"title": "Göğüs kafesi ve solunum kasları", "points": ["Toraks **12 çift kaburga** + göğüs omurları + **sternum**. İlk **7 çift gerçek kaburga**; 8-10 sahte (kıkırdakla bağlanır); **11-12 serbest (yüzen)**.", "Sternum 3 parça: **manubrium, corpus, processus xiphoideus**.", "**Diyafragma:** asıl solunum kası; **inspirasyonun en önemli kası**dır; nefes alma kapasitesinin **~%60**'ını sağlar.", "**İntercostales externi** → inspirasyon; **intercostales interni**, subcostales, transversus thoracis → ekspirasyon.", "Sağlıklı kişi dakikada **16-20** kez solur. Normal ekspirasyon **pasiftir**, zorlu nefes vermede kaslar çalışır."]}, {"title": "Sırt ve karın kasları", "points": ["**Erector spinae:** gövdenin dik durmasını sağlayan **en kuvvetli sırt ekstansörü**; rectus abdominis'in **antagonisti**.", "Karın ön duvarı 3 tabaka: en derinde **transversus abdominis** (yatay lifler), ortada **obliquus internus**, en dışta **obliquus externus** (en büyük karın kası). **Rectus abdominis** hepsini örter.", "**Rectus abdominis:** gövdeye fleksiyon, pelvise posterior tilt; gövde fleksiyonunda **agonist**, erector spinae **antagonist**.", "**Transversus abdominis:** gövde hareketine etkisi yok; **lumbal stabilizasyon** ve karın içi basıncı.", "Karın kaslarının görevleri: organları korumak, **karın içi basıncı** artırarak ekspirasyon, doğum, dışkılama, kusmaya yardım; gövdeye hareket. (Vertebral kanaldan geçen omuriliği korumak omurganın görevidir.)"]}, {"title": "Omuz kuşağı ve omuz eklemi", "points": ["Omuz kuşağı: **clavicula, scapula, sternum**. **Skapulotorasik eklem** gerçek sinovyal eklem değildir.", "**Trapezius:** sırtın en yüzeyel kası; üst parça elevasyon, alt parça depresyon.", "**Latissimus dorsi:** **kolun en kuvvetli adduktoru**; barfikste vücudu yukarı çeker.", "**Pectoralis major:** kolun en kuvvetli **horizontal adduktoru**. **Serratus anterior** ile **rhomboid** antagonisttir.", "Omuz eklemi **küresel (sferoid), üç eksenli**; en geniş hareketli eklemdir, bu yüzden **çıkıklar** en çok burada olur.", "**Rotator manşet:** **supraspinatus, infraspinatus, teres minor, subscapularis**. **Erector spinae skapulayı hareket ettirmez.**", "**Deltoid** orta parça abdüksiyon; ön parça fleksiyon + iç rotasyon; arka parça ekstansiyon + dış rotasyon."]}, {"title": "Dirsek, ön kol ve el", "points": ["Dirsek eklemi: humerus + ulna + radius; fleksiyon-ekstansiyon. Radioulnar eklemler **pronasyon-supinasyon** yapar.", "**Biceps brachii:** ön kolun **en kuvvetli fleksörü** ve supinatörü; en güçlü olduğu açı **90°** fleksiyon + supinasyon.", "**Brachialis** her pozisyonda fleksör (seri fleksör); **brachioradialis** ağır yük fleksörü.", "**Triceps brachii:** **en kuvvetli dirsek ekstansörü**; antagonisti **biceps brachii**.", "**Agonist** = asıl hareket ettirici; **antagonist** = karşı tarafta gevşeyen; **sinerjist** = yardımcı; sinerjist kemiği sabitlerse **fiksatör**.", "El bileği **8 karpal**, el tarağı **5 metakarpal**; baş parmakta 2, diğerlerinde 3 falanks."]}, {"title": "Pelvis ve kalça", "points": ["**Pelvis kuşağı:** iki **os coxae** + **os sacrum** + **os coccygis**. Os coxae = **ilium + ischium + pubis** (14-16 yaşta birleşir).", "Femur başı ile eklem yapan çukur: **acetabulum**. Oturduğumuz çıkıntı: **tuber ischiadicum** (hamstring başlangıcı).", "**Sakroiliak eklem:** vücudun en sağlam eklemlerinden; şoku absorbe eder.", "**Femur:** en uzun ve kalın kemik (boyun ~1/4'ü). Kalça eklemi **küresel, üç eksenli**.", "**İliopsoas:** femurun **en güçlü fleksörü**, tipik koşu kası. **Gluteus maximus:** kalçanın **en güçlü ekstansörü**. **Gluteus medius:** abdüksiyon, yürürken pelvisi dengeler.", "**Adductor magnus:** femurun en kuvvetli adduktoru. **Sartorius (terzi kası):** hem kalça hem dizde fleksör olan tek kas."]}, {"title": "Diz eklemi", "points": ["**Vücudun en büyük eklemi**; bikondiler, tek eksenli; menisküsler sayesinde bir miktar rotasyon.", "**Patella:** vücudun **en büyük sesamoid kemiği**; dizi korur, quadriceps'in kuvvet kolunu artırır.", "**Medial menisküs** iç yan bağa yapışık → hareketi kısıtlı → **yaralanması daha sık**.", "**Quadriceps femoris:** **vücudun en kuvvetli kası**; rectus femoris, vastus lateralis, **vastus medialis, vastus intermedius**. Sadece **rectus femoris** iki eklemlidir.", "Quadriceps'in antagonistleri **hamstringler**: **biceps femoris, semitendinosus, semimembranosus** (gracilis de diz fleksiyonuna yardım eder). **Vastus intermedius antagonist değildir**, quadriceps'in parçasıdır."]}, {"title": "Ayak bileği ve ayak", "points": ["Tarsus **7** kemik (talus, calcaneus, naviculare, cuboideum, 3 cuneiform); **5** metatarsal; **14** falanks.", "**Talocrural eklem:** dorsifleksiyon (topukta yürüme) ve **plantar fleksiyon** (parmak ucunda yürüme). **Subtalar eklem:** pronasyon-supinasyon.", "**Tibialis anterior:** ayağın **en kuvvetli dorsifleksörü** → plantar fleksiyon yaptırmaz.", "Plantar fleksörler: **gastrocnemius, soleus** (birleşip **aşil tendonu**), tibialis posterior, **peroneus longus ve brevis**, flexor hallucis longus.", "Diz düzken **gastrocnemius**, diz bükükken **soleus** daha aktiftir.", "Ayakta 3 ark: medial ve lateral **longitudinal** ark, **transvers** ark."]}, {"title": "Solunum sistemi", "points": ["Solunum yolları: burun, ağız, **farinks**, **larinks** (ses), **trakea** (C şeklinde kıkırdaklar), bronşlar → **alveoller**.", "Sağ akciğer **3 lob**, sol akciğer **2 lob**; sağ akciğer biraz daha büyüktür. Akciğeri saran zar **plevra**.", "Gaz alışverişi alveoller ile kılcal damarlar arasında **difüzyonla** olur.", "Tidal volüm **500 ml**; **vital kapasite ~4700 ml**; total kapasite ~5900 ml; rezidüel volüm 1000-1200 ml.", "Egzersizde alveollere ulaşan hava **20 katına** çıkabilir; düzenli egzersiz vital kapasiteyi artırır."]}, {"title": "Kan, kalp ve dolaşım", "points": ["Kan vücut ağırlığının **%8**'i; **plazma** kanın %60'ı (plazmanın %90'ı su).", "**Eritrosit:** çekirdeksiz, **hemoglobinle** O2/CO2 taşır, **120 gün** yaşar. **Lökosit:** savunma ve **ölü hücreleri temizler**. **Trombosit:** pıhtılaşma.", "**0 grubu** herkese verir (genel verici), **AB grubu** herkesten alır ama **kimseye veremez**.", "Kalp duvarı: **perikard** (dış), **miyokard** (kas, **en kalın**), **endokard** (iç). Kalbi besleyen damarlar **koroner arterler**.", "Normal kalp atımı **72/dk**; 60'ın altı bradikardi, 100'ün üstü taşikardi. Normal tansiyon **120/80 mmHg**; dinlenmede 150/90 üstü hipertansiyon.", "**Arterler kanı kalpten** vücuda, **venler kalbe** taşır. İletim: **SA düğüm → AV düğüm → His demeti → Purkinje**; kayıt **EKG** ile."]}], "questions": [{"q": "Yetişkinde omurga kaç omurdan oluşur?", "o": ["24", "12", "26", "33", "7"], "a": 2, "e": "Çocukta 33-34 omur vardır; sakral ve koksiks omurları birleşir."}, {"q": "Doğuşta var olan omurga eğrilikleri hangileridir?", "o": ["Servikal lordoz ve lumbal lordoz", "Torakal kifoz ve sakral kifoz", "Skolyoz ve kifoz", "Hiçbiri", "Sadece lumbal lordoz"], "a": 1, "e": "Boyun ve bel lordozu oturma ve yürümeyle sonradan oluşur."}, {"q": "Lateral fleksiyon nedir?", "o": ["Omurganın frontal eksende yana eğilmesi", "Omurganın arkaya bükülmesi", "Kolun yana açılması", "Omurganın kendi ekseni etrafında dönmesi", "Omurganın öne eğilmesi"], "a": 0, "e": "Öne eğilme fleksiyon, dönme rotasyondur."}, {"q": "Jest ve mimiklerden sorumlu boyun kası hangisidir?", "o": ["Trapezius", "Platysma", "Sternocleidomastoideus", "Levator scapula", "Scalenus anterior"], "a": 1, "e": "Boyun derisini gerer, ağız köşesini aşağı çeker."}, {"q": "İnspirasyonun en önemli kası hangisidir?", "o": ["Diyafragma", "İntercostales interni", "Serratus posterior inferior", "Transversus abdominis", "Rectus abdominis"], "a": 0, "e": "Nefes alma kapasitesinin yaklaşık %60'ını sağlar."}, {"q": "Kolun en kuvvetli adduktor kası hangisidir?", "o": ["M. latissimus dorsi", "M. supraspinatus", "M. teres minor", "M. infraspinatus", "M. deltoideus"], "a": 0, "e": "Barfikste vücudu yukarı çeker."}, {"q": "Aşağıdakilerden hangisi rotator manşet kaslarından DEĞİLDİR?", "o": ["M. infraspinatus", "M. trapezius", "M. supraspinatus", "M. subscapularis", "M. teres minor"], "a": 1, "e": "Rotator manşet omuz stabilizasyonu sağlar."}, {"q": "M. triceps brachii'nin antagonisti hangisidir?", "o": ["M. pectoralis minor", "M. deltoideus", "M. trapezius", "M. biceps brachii", "M. subscapularis"], "a": 3, "e": "Triceps dirseği açar, biceps büker."}, {"q": "Pelvis kuşağını oluşturan kemikler hangileridir?", "o": ["Femur, tibia, fibula", "Os coxae, femur, patella", "Os coxae, os sacrum, os coccygis", "Sacrum, tibia, talus", "Ilium, humerus, ulna"], "a": 2, "e": "Os coxae da ilium, ischium ve pubisin birleşmesiyle oluşur."}, {"q": "Vücudun en kuvvetli kası hangisidir?", "o": ["M. deltoideus", "M. biceps brachii", "M. quadriceps femoris", "M. gluteus medius", "M. rectus abdominis"], "a": 2, "e": "Dizin en güçlü ekstansörüdür."}, {"q": "Aşağıdakilerden hangisi m. quadriceps femoris'in antagonistlerinden DEĞİLDİR?", "o": ["M. semimembranosus", "M. biceps femoris", "M. vastus intermedius", "M. gracilis", "M. semitendinosus"], "a": 2, "e": "Vastus intermedius quadriceps'in kendi parçasıdır."}, {"q": "Ayak bileğine plantar fleksiyon YAPTIRMAYAN kas hangisidir?", "o": ["M. tibialis posterior", "M. peroneus longus", "M. tibialis anterior", "M. soleus", "M. gastrocnemius"], "a": 2, "e": "Tibialis anterior en kuvvetli dorsifleksördür."}, {"q": "Kalbin en kalın tabakası hangisidir?", "o": ["Perikard", "Plevra", "Epikard", "Miyokard", "Endokard"], "a": 3, "e": "Kalp kası olan miyokard özellikle sol ventrikülde kalındır."}, {"q": "Eritrositlerle ilgili hangisi YANLIŞTIR?", "o": ["Hemoglobin içerir", "Ölmüş hücreleri temizler", "Yaklaşık 120 gün yaşar", "Kemik iliğinde yapılır", "Çekirdekleri yoktur"], "a": 1, "e": "Ölü hücreleri temizlemek lökositlerin işidir."}, {"q": "Kan gruplarıyla ilgili hangisi YANLIŞTIR?", "o": ["0 grubu herkese kan verebilir", "AB grubu herkese kan verebilir", "0 grubu antijen taşıyan gruplardan kan alamaz", "AB grubu herkesten kan alabilir", "A ve B antijenleri alyuvarların yüzeyindedir"], "a": 1, "e": "AB herkesten alır ama kimseye veremez."}, {"q": "Dolaşım sistemiyle ilgili hangisi YANLIŞTIR?", "o": ["Kalbin elektriksel sinyalleri EKG ile kaydedilir", "Koroner arterler kalbi besler", "Normal kalp atımı yaklaşık 72'dir", "Venler kanı kalpten alıp vücuda dağıtır", "Normal sistolik basınç yaklaşık 120 mmHg'dır"], "a": 3, "e": "Kanı kalpten vücuda dağıtan damarlar arterlerdir."}, {"q": "Vücudun en büyük sesamoid kemiği hangisidir?", "o": ["Patella", "Os pisiforme", "Calcaneus", "Talus", "Sternum"], "a": 0, "e": "Quadriceps tendonu içinde yer alır."}, {"q": "Kolun adduktor kaslarından en kuvvetlisi aşağıdakilerden hangisidir?", "o": ["M. infraspinatus", "M. subscapularis", "M. latissimus dorsi", "M. teres major", "M. teres minor"], "a": 2, "e": "Doğru cevap: M. latissimus dorsi.", "kb": 1}, {"q": "Aşağıdaki kaslardan hangisi m. quadriceps femoris kas grubunun antagonist kaslarından biri değildir?", "o": ["M. semitendinosus", "M. vastus intermedius", "M. biceps femoris", "M. semimembranosus", "M. gracilis"], "a": 1, "e": "Doğru cevap: M. vastus intermedius.", "kb": 1}, {"q": "Hangisi skapulayı hareket ettiren kaslardan biri değildir?", "o": ["M. infraspinatus", "M. subscapularis", "M. trapezius", "M. erector spinae", "M. teres minor"], "a": 3, "e": "Doğru cevap: M. erector spinae.", "kb": 1}, {"q": "M. triceps brachii kasının antagonisti aşağıdakilerden hangisidir?", "o": ["M. biceps brachii", "M. subscapularis", "M. pectoralis minor", "M. trapezius", "M. deltoideus (arka parça)"], "a": 0, "e": "Doğru cevap: M. biceps brachii.", "kb": 1}, {"q": "Dolaşım sistemi ile ilgili aşağıdaki ifadelerden hangisi yanlıştır?", "o": ["Kalp kasının ve kalbin beslenmesini sağlayan damarlar koroner arterlerdir.", "Venler kanı kalpten alıp vücuda dağıtırlar.", "Kalbin dakikada normal atımı ortalama 72'dir.", "Kalbin atışı sırasında meydana gelen elektriksel sinyaller EKG ile kaydedilir.", "Sistolik kan basıncı normal olarak ortalama 120 mmHg'dır."], "a": 1, "e": "Doğru cevap: Venler kanı kalpten alıp vücuda dağıtırlar.. Kitabın cevap anahtarında E yazıyor; ancak metinde sistolik basıncın normalde 120 mmHg olduğu ve kanı kalpten vücuda arterlerin taşıdığı yazar. Yanlış ifade B'dir.", "kb": 1}, {"q": "Sağlıklı bir kişinin dakikada en az kaç kez solunum yapması gereklidir?", "o": ["8", "16", "25", "5", "30"], "a": 1, "e": "Doğru cevap: 16.", "kb": 1}, {"q": "Kan grupları ile ilgili aşağıdaki ifadelerden hangisi yanlıştır?", "o": ["Alyuvarların üzerindeki antijenler A ve B antijenidir.", "0 grubu olan insanlar antijen taşıyan gruplardan kan alamazlar.", "0 grubu olan insanlar kendilerinde antijen olmadığı için herkese kan verebilirler.", "Her iki antijeni taşıyan AB grubu insanlar herkese kan verebilirler.", "Her iki antijeni de taşıyan AB grubu insanlar bunlara karşı antikor taşımazlar ve bu nedenle herkesten kan alabilirler."], "a": 3, "e": "Doğru cevap: Her iki antijeni taşıyan AB grubu insanlar herkese kan verebilirler..", "kb": 1}, {"q": "Pelvis kuşağını oluşturan kemikler aşağıdakilerin hangisinde birlikte ve doğru olarak verilmiştir?", "o": ["Os sacrum, os coxae, os coccyx", "Os femur, os sacrum, os tibia", "Os sacrum, os coxae, os femur", "Os coxae, os coccyx, os tibia", "Os sacrum, os coxae, os patella"], "a": 0, "e": "Doğru cevap: Os sacrum, os coxae, os coccyx.", "kb": 1}, {"q": "Aşağıdakilerden hangisi solunum sırasında inspirasyonun en önemli kasıdır?", "o": ["M. intercostales interni", "M. subcostales", "M. obliquus externus abdominis", "M. transversus abdominis", "Diyafragma"], "a": 4, "e": "Doğru cevap: Diyafragma.", "kb": 1}, {"q": "Aşağıdaki kaslardan hangisi talocrural ekleme (ayak bileğine) plantar fleksiyon yaptırmaz?", "o": ["M. gastrocnemius", "M. soleus", "M. tibialis anterior", "M. tibialis posterior", "M. peroneus longus"], "a": 2, "e": "Doğru cevap: M. tibialis anterior.", "kb": 1}], "tf": [{"q": "Omurganın ilk 24 omuru hareketlidir ve aralarında disk bulunur.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Bunlara presakral omurlar denir.", "tf": true}, {"q": "Sağ akciğer iki, sol akciğer üç lobdan oluşur.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Tersi: sağ akciğer üç, sol akciğer iki lobdur.", "tf": true}, {"q": "Medial menisküs, hareketi kısıtlı olduğu için daha sık yaralanır.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "İç yan bağa sıkıca yapışıktır.", "tf": true}, {"q": "M. sartorius hem kalça hem diz ekleminde fleksör etki gösteren tek kastır.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Bacak bacak üstüne atma kası (terzi kası) olarak da bilinir.", "tf": true}, {"q": "Normal bir ekspirasyonda göğüs kasları aktif olarak çalışır.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Normal ekspirasyon pasiftir; zorlu nefes vermede kaslar çalışır.", "tf": true}, {"q": "Gastrocnemius, diz ekstansiyondayken plantar fleksiyonda daha aktiftir.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Diz bükülünce soleus öne çıkar.", "tf": true}, {"q": "Kalp atımı dakikada 60'ın altına düşerse taşikardi denir.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "60'ın altı bradikardi, 100'ün üstü taşikardidir.", "tf": true}]}, {"id": "ssb2", "title": "Spor Fizyolojisi II", "cards": [{"title": "Kas tipleri ve görevleri", "points": ["**Düz kas:** iç organlar ve damar duvarı; **istemsiz**, çizgisiz, tek çekirdekli.", "**Kalp kası:** sadece kalpte; çizgili ama **istemsiz**, otomatik ve ritmik kasılır.", "**İskelet kası:** çizgili ve **istemli**. 400'den fazla kas; erkekte vücut ağırlığının **%40-45**'i, kadında **%23-25**'i.", "İskelet kasının görevleri: hareket, **postür**, iç organları koruma, **ısı üretimi**, kanın **venöz dönüşüne** yardım. (**Kırmızı kan hücresi üretmek kasın görevi değildir**; kemik iliği yapar.)", "Kasların ortak özellikleri: **uyarılabilme, kasılabilme, uzayabilme, elastikiyet**."]}, {"title": "İskelet kasının yapısı", "points": ["Her lifi saran bağ dokusu **endomisyum**; lif demetine **fasikül**, onu saran dokuya **perimisyum**; tüm kası saran doku **epimisyum** (dışa doğru tendonu oluşturur).", "Kas lifi → **miyofibril** → **miyofilamentler**. Lifi saran zar **sarkolemma**, içi **sarkoplazma**.", "**Sarkomer:** kasılabilir **en küçük birim**; sınırlarını **Z çizgisi** belirler.", "**Kalın filament = miyozin**, **ince filament = aktin** (düzenleyici proteinler **troponin ve tropomiyozin**)."]}, {"title": "Kasılma mekanizması", "points": ["Motor sinir ucuna **motor son plak (nöromüsküler kavşak)** denir; buradan **asetilkolin** salınır.", "Uyarı **sarkoplazmik retikulumdan Ca++** salınmasını sağlar; Ca++ **troponine** bağlanır, aktin aktive olur → **aktomiyozin** kompleksi.", "Miyozindeki **ATPaz** ATP'yi parçalar; aktin sarkomerin merkezine kayar.", "**Kayan filamentler teorisi:** aktin ve miyozin **kendi boyları değişmeden** birbiri üzerinde kayar. Kasılmada **H bölgesi kapanır**, **Z çizgileri yaklaşır**, sarkomer kısalır.", "Dinlenmede çapraz köprüler aktine uzanır ama **temas etmez**."]}, {"title": "Motor ünite ve hep ya da hiç", "points": ["**Motor ünite:** bir motor sinir ve uyardığı **tüm kas lifleri**.", "Lif sayısı kasın büyüklüğüne değil **hareketin inceliğine** bağlıdır: göz kırpma, iğneye iplik geçirme → az lif; quadriceps → yüzlerce, binlerce lif.", "Vücutta ~**çeyrek milyar** kas lifi, ~**420.000** motor nöron vardır.", "**Hep ya da hiç kanunu:** eşik düzeyde uyarılan motor ünitenin liflerinin **ya hepsi kasılır ya hiçbiri**. Bu kural **motor ünite** içindir, tüm kas için değil; kas, farklı sayıda motor ünite kullanarak **dereceli** kuvvet üretir."]}, {"title": "Kas lif tipleri", "points": ["**Tip I – Yavaş kasılan (ST, SO):** aerobik, **geç yorulur**, düşük kuvvet, **çok ve büyük mitokondri**, **yüksek miyoglobin** (kırmızı renk), düşük ATPaz. Dayanıklılık için.", "**Tip II – Hızlı kasılan (FT, FG):** **yüksek ATPaz**, hızlı kasılır, çok kuvvet üretir, **çabuk yorulur**; anaerobik, sürat ve güç için.", "Alt gruplar: **IIa** (hızlı oksidatif-glikolitik, ara tip), **IIb** (daha anaerobik), **IIc** (nadir).", "Gastrocnemius'ta **FT**, soleus'ta **ST** oranı yüksektir. Dayanıklılık sporcularında Tip I, sürat-güç sporcularında Tip II fazladır.", "Lif tipi dağılımı büyük ölçüde **kalıtsaldır**; performans yalnızca lif tipiyle açıklanamaz."]}, {"title": "Kasların egzersize uyumu", "points": ["Antrenman lif tiplerinin **oranını değil, kapasitesini** değiştirir.", "**Dayanıklılık:** Tip I liflerin boyutu artar; **IIb → IIa**'ya döner; mitokondri ve enzim aktivitesi, kas içi trigliserid artar.", "**Hipertrofi:** kas liflerinin enine kesit alanının artmasıdır; antrenmanla **%30-60** olabilir. **Direnç** antrenmanı **Tip II** liflerin çapını artırır.", "Direnç antrenmanı ayrıca **PC depolarını** ve **kreatinkinaz** enzimini artırır."]}, {"title": "Isınma türleri", "points": ["**Pasif ısınma:** sıcak duş, sauna, diatermi, ısıtma pedi; **enerji deposu harcanmaz** ama pratik değildir. Kısa ve orta süreli eforlara olumlu, uzun eforlara etkisiz.", "**Aktif ısınma:** jogging, bisiklet, yüzme, cimnastik; daha fazla metabolik ve kardiyovasküler etki. İkiye ayrılır: **genel** ve **özel** (branşa özgü) ısınma.", "**Süre:** vücut ısısı ilk **3-5 dk**'da hızla artar, **10-20 dk**'da plato yapar → ısınma **10-20 dk** olmalı.", "**Şiddet:** kısa-yüksek şiddetli performans için **%60 VO2maks** üstü; orta şiddet için **%70**.", "**Toparlanma:** ısınmadan sonra fosfojenlerin dolması için **~5 dk** ara verilmeli."]}, {"title": "Isınmanın fizyolojik etkileri", "points": ["**Sıcaklık kaynaklı:** kas ve bağ dokuda **viskozite azalır**; kaslara giden O2 ve hemoglobinden O2 ayrılması artar; **metabolik, anaerobik ve oksidatif reaksiyonlar hızlanır**; **sinirsel uyaranlar hızlanır**.", "**Sıcaklık kaynaklı olmayan:** kas kan akışı, **post-aktivasyon potansiyeli**, **aktin-miyozin bağlarının ayrılması**, psikolojik hazırlık.", "Vücut ısısında ~**2 derece** artış sinir sistemini, reaksiyon ve kasılma hızını yükseltir.", "Çok uzun ısınma **glikojen** depolarını azaltabilir."]}, {"title": "Toparlanma ve oksijen borcu", "points": ["Toparlanma 4 parametreyle ilgilidir: **enerji kaynaklarının yenilenmesi**, **laktatın uzaklaştırılması**, **O2-miyoglobin depolarının yenilenmesi**, oksijen borcu. (Kas esnekliğinin artması bir toparlanma süreci değildir.)", "**Oksijen borcu (ESFOT/EPOC):** toparlanmada istirahatin üstünde tüketilen fazladan O2. Maksimal egzersizden sonra **10-12 litre**, ödenmesi **1 saat** veya fazla.", "Fazladan O2 şunlar için kullanılır: **ATP-PC yenilenmesi, laktatın uzaklaştırılması, O2/miyoglobin depolarının dolması**, nabız-solunumun normale dönmesi. (**Glikojen yenilemek için kullanılmaz**.)", "**Alaktasid borç:** ilk **2-3 dk**, hızlı toparlanma, **fosfojenler** için. **Laktasid borç:** yavaş, **laktat** için, 1 saatten uzun."]}, {"title": "Enerji depolarının yenilenmesi", "points": ["**ATP-PC:** toparlanmada **%70'i ilk 30 sn**'de, **%100'ü ~3 dk**'da (yarı zaman 20-30 sn, tam yenilenme 3-5 dk).", "**Kas glikojeni:** en hızlı yenilenme ilk **10 saatte**. Yüksek karbonhidratla **%60'ı 20 saatte**, tamamı **48 saatte**. Kısa-yüksek şiddetli egzersizden sonra **24 saatte** tamamen yenilenir.", "**Karaciğer glikojeni:** 1 kg karaciğerde ~**40 g**; yüksek karbonhidratla **24 saatte** dolar.", "Yüksek protein-yağ diyetiyle glikojen **5 günde bile** çok az yenilenir."]}, {"title": "Laktik asidin uzaklaştırılması", "points": ["Dinlenmede kanda ~**1,1 mmol/L**. Yarılanma ~**25 dk**; **%95'i ~1 saat 15 dk**'da uzaklaşır.", "**Hafif aktif toparlanma** (sürekli hafif egzersiz) laktatı pasif dinlenmeden **daha hızlı** uzaklaştırır.", "Uzaklaştırma yolları: **oksidasyon** (pirüvik asit → Krebs; en önemlisi), **glikoz/glikojene dönüşme** (az), **ter ve idrarla** (çok az), **proteine dönüşme** (önemsiz).", "Laktat **yağa dönüşerek** uzaklaştırılmaz."]}, {"title": "Miyoglobin", "points": ["İskelet kasında bulunan, **oksijeni kasta depolayan** protein; hemoglobine benzer.", "**Yavaş kasılan liflerde** daha fazladır ve onlara **kırmızı rengi** verir.", "İki görevi: **oksijeni depolamak** ve oksijenin **kandan mitokondriye difüzyonunu** sağlamak.", "Karbonhidrat ve protein **taşımaz**. Aralıklı egzersizde önemlidir; yenilenmesi için ATP gerekmez, oksijen yeterlidir."]}, {"title": "Sınavda çıkan ek fizyoloji konuları", "points": ["Kalbin katmanları: iç **endokard**, kas tabakası **miyokard** (**en kalın** katman), dış **epikard/perikard**.", "**Eritrosit (alyuvar):** çekirdeksiz ve mitokondrisiz; **hemoglobin** ile O₂ taşır, kemik iliğinde yapılır. **Ölü hücreleri temizlemek** alyuvarın değil, akyuvar/makrofajların görevidir.", "**\"Hep ya da hiç\" kanunu:** Uyarılan motor ünite ya **tamamen kasılır ya hiç** kasılmaz (sinir iletimi de bu ilkeye uyar).", "Isınmanın sıcaklığa bağlı etkileri: kas ısısı artar, **oksidatif (metabolik) reaksiyonların hızı artar**, hemoglobinden O₂ ayrılması kolaylaşır, sinir iletimi hızlanır, kas viskozitesi azalır.", "**Dehidrasyon:** performans düşer, **bitkinlik, baş dönmesi**, vücut ısısı artışı, kalp atımı artışı görülür."]}], "questions": [{"q": "Aşağıdakilerden hangisi iskelet kasının görevlerinden biri DEĞİLDİR?", "o": ["Isı üretimi", "İç organların korunması", "Postürün korunması", "Kırmızı kan hücresi üretimi", "Venöz dönüşe yardım"], "a": 3, "e": "Kan hücreleri kemik iliğinde üretilir."}, {"q": "İskelet kasında her bir lifi saran bağ dokusuna ne ad verilir?", "o": ["Sarkolemma", "Perimisyum", "Fasya", "Endomisyum", "Epimisyum"], "a": 3, "e": "Fasikülü perimisyum, tüm kası epimisyum sarar."}, {"q": "Kasılabilir en küçük birim hangisidir?", "o": ["Miyofibril", "Kas lifi", "Fasikül", "Sarkomer", "Motor ünite"], "a": 3, "e": "Sınırlarını Z çizgileri belirler."}, {"q": "Kalın ve ince filamentler sırasıyla hangi proteinlerden oluşur?", "o": ["Aktin – miyozin", "Aktin – troponin", "Miyozin – troponin", "Troponin – tropomiyozin", "Miyozin – aktin"], "a": 4, "e": "Troponin ve tropomiyozin ince filamentteki düzenleyici proteinlerdir."}, {"q": "Kas kasılmasında Ca++ hangi proteine bağlanarak aktini aktive eder?", "o": ["Miyoglobin", "Hemoglobin", "Troponin", "Asetilkolin", "Miyozin"], "a": 2, "e": "Ca++ sarkoplazmik retikulumdan salınır."}, {"q": "Kayan filamentler teorisiyle ilgili hangisi YANLIŞTIR?", "o": ["Uyarı için motor nöronda aksiyon potansiyeli oluşmalıdır", "Z çizgileri birbirine yaklaşır", "Filamentler birbiri üzerinde kayar", "Kasılmada H bölgesi kapanır", "Miyofilamentlerin kendi boyları kısalır"], "a": 4, "e": "Filamentlerin boyu değişmez; sadece kayarlar."}, {"q": "Bir motor sinir ve uyardığı tüm kas liflerine ne denir?", "o": ["Fasikül", "Sarkomer", "Motor son plak", "Motor ünite", "Miyofibril"], "a": 3, "e": "Hep ya da hiç kanunu motor üniteler için geçerlidir."}, {"q": "Hep ya da hiç kanunu neyi ifade eder?", "o": ["Kasın sadece istemsiz kasılmasını", "Kasın hiç yorulmamasını", "Uyarılan motor ünitenin liflerinin ya tamamının kasılmasını ya da hiçbirinin kasılmamasını", "Sinirin uyarıyı her zaman iletmesini", "Tüm kasın her zaman maksimal kasılmasını"], "a": 2, "e": "Kas, motor ünite sayısıyla dereceli kuvvet üretir."}, {"q": "Aşağıdakilerden hangisi Tip I (yavaş kasılan) liflerin özelliği DEĞİLDİR?", "o": ["Yavaş kasılır", "Yüksek mitokondri yoğunluğu vardır", "Düşük kuvvet üretir", "Miyoglobin içeriği yüksektir", "Çabuk yorulur"], "a": 4, "e": "Tip I lifler geç yorulur."}, {"q": "Tip II (hızlı kasılan) liflerin özelliği hangisidir?", "o": ["Aerobik aktivitelere uygundur", "Geç yorulur", "Yüksek ATPaz enzim aktivitesi", "Yüksek miyoglobin içerir", "Fibril çapı küçüktür"], "a": 2, "e": "Hızlı ve güçlü kasılır ama çabuk yorulur."}, {"q": "Dayanıklılık antrenmanı hızlı lif alt tiplerinde hangi dönüşüme yol açar?", "o": ["Tip I → Tip IIb", "Tip IIb → Tip IIa", "Tip IIa → Tip IIb", "Tip I → Tip II", "Hiçbir değişiklik olmaz"], "a": 1, "e": "Oksidatif kapasite artar; lif oranları değil kapasiteler değişir."}, {"q": "Aktif ısınmanın süresi ne kadar olmalıdır?", "o": ["3-5 dakika", "1 saat", "30-45 dakika", "10-20 dakika", "1-2 dakika"], "a": 3, "e": "Vücut ısısı 10-20 dk'da plato yapar; daha uzun ısınma enerji depolarını azaltır."}, {"q": "Isınmadan sonra fosfojen depolarının dolması için ne kadar toparlanma verilmelidir?", "o": ["1 saat", "30 saniye", "15 dakika", "Hiç ara verilmez", "Yaklaşık 5 dakika"], "a": 4, "e": "Aksi hâlde yüksek şiddetli performans düşebilir."}, {"q": "Aşağıdakilerden hangisi ısınmanın sıcaklık kaynaklı OLMAYAN etkisidir?", "o": ["Viskozitenin azalması", "Aktin-miyozin bağlarının ayrılması", "Sinirsel uyaranların hızlanması", "Oksidatif reaksiyonların hızlanması", "Hemoglobinden O2 ayrılmasının artması"], "a": 1, "e": "Post-aktivasyon potansiyeli ve psikolojik hazırlık da sıcaklıktan bağımsızdır."}, {"q": "Egzersiz sonrası fazladan tüketilen oksijen aşağıdakilerden hangisi için kullanılmaz?", "o": ["Fosfojen depolarının yenilenmesi", "O2 depolarının yenilenmesi", "Glikojen depolarının yenilenmesi", "Miyoglobin depolarının yenilenmesi", "Laktatın uzaklaştırılması"], "a": 2, "e": "Glikojen yenilenmesi beslenme ve saatler-günler gerektirir."}, {"q": "Alaktasid oksijen borcu genel olarak ne kadar sürer?", "o": ["24 saat", "2-3 dakika", "10 saniye", "1 saat", "25 dakika"], "a": 1, "e": "Fosfojenlerin yenilenmesi içindir; laktasid borç daha yavaştır."}, {"q": "Laktik asit vücuttan hangi yolla UZAKLAŞTIRILMAZ?", "o": ["Yağ formuna dönüşerek", "Oksidasyona uğrayarak", "Glikoz/glikojene dönüşerek", "Ter ve idrarla", "Proteine dönüşerek (çok az)"], "a": 0, "e": "En önemli yol oksidasyondur."}, {"q": "Aşağıdakilerden hangisi iskelet kasının görevlerinden biri değildir?", "o": ["Postürün korunması", "Isı üretimi", "Venöz dönüşe yardımcı olmak", "Kırmızı kan hücresi üretimi", "İç organların korunması"], "a": 3, "e": "Doğru cevap: Kırmızı kan hücresi üretimi.", "kb": 1}, {"q": "Kalın filamentler temel olarak kasılabilir protein …… den, ince filamentler ise …… den oluşmuştur. Boş bırakılan yerleri sırasıyla hangisi tamamlar?", "o": ["Aktin - miyozin", "Miyozin - troponin", "Aktin - troponin", "Troponin - tropomiyozin", "Miyozin - aktin"], "a": 4, "e": "Doğru cevap: Miyozin - aktin.", "kb": 1}, {"q": "Kayan filamentler teorisi ile ilgili olarak aşağıdaki ifadelerden hangisi yanlıştır?", "o": ["Miyofilamentler kendi boylarında bir değişiklik olmaksızın birbirleri üzerinde hareket ederek kas liflerinin boyunda kısalma veya uzamaya neden olur.", "Ca++ iyonlarının sarkoplazma içerisine bırakılması için bir sinir hücresi tarafından bir uyarının gelmesi gerekir.", "Kas lifi kasıldığında H bölgesi kapanır ve iki Z çizgisi birbirine doğru yaklaşır, böylelikle de sarkomerin boyu kısalır.", "Miyofilamentlerin kendi boyları kısalır ve böylelikle kas liflerinin boyunda kısalma veya uzamaya neden olur.", "Kas fibrilini uyaran motor nöronda bir aksiyon potansiyeli yani bir uyarı oluşturulmalıdır."], "a": 3, "e": "Doğru cevap: Miyofilamentlerin kendi boyları kısalır ve böylelikle kas liflerinin boyunda kısalma veya uzamaya neden olur..", "kb": 1}, {"q": "Aşağıdakilerden hangisi Tip I (slow-twitch, ST) kas liflerinin özelliklerinden biri değildir?", "o": ["Yavaş kasılır.", "Çabuk yorulur.", "Düşük PC deposuna sahiptir.", "Yüksek mitokondri yoğunluğuna sahiptir.", "Düşük kuvvet üretir."], "a": 1, "e": "Doğru cevap: Çabuk yorulur..", "kb": 1}, {"q": "Aşağıdaki seçeneklerin hangisinde Tip II (fast-twitch, FT) kas liflerinin özellikleri doğru verilmiştir?", "o": ["Aerobik metabolizmaya dayanan aktiviteler için uygundur.", "Yüksek düzeyde ATPaz enzim aktivitesine sahiptir.", "Hızlı kasılır, geç yorulur.", "Fibril çapları küçüktür.", "Yüksek miyoglobin içeriğine sahiptir."], "a": 1, "e": "Doğru cevap: Yüksek düzeyde ATPaz enzim aktivitesine sahiptir..", "kb": 1}, {"q": "Aşağıdakilerden hangisi ısınmanın sıcaklık kaynaklı etkilerindendir?", "o": ["Metabolik reaksiyonların hızı artar.", "Anaerobik metabolizma hızlanır.", "Oksidatif reaksiyonların hızı artar.", "Aktin-miyozin bağlarının ayrılması", "Sinirsel uyaranların hızı artar."], "a": 1, "e": "Doğru cevap: Anaerobik metabolizma hızlanır.. Not: Kitabın listesinde A, C ve E de sıcaklık kaynaklı etkiler arasında yer alır; sıcaklık kaynaklı olmayan tek seçenek D'dir (aktin-miyozin bağlarının ayrılması). Kitap anahtarı B'yi kabul etmiştir; sınavda 'oksidatif reaksiyonların hızı artar' şeklinde de sorulmuştur.", "kb": 1}, {"q": "Aşağıdakilerden hangisi toparlanma süreçlerinden biri değildir?", "o": ["O2 borçlanması", "LA'nın vücuttan uzaklaştırılması", "Glikojen depolarının yenilenmesi", "Kasların esnekliğinin artması", "Fosfojen depolarının yenilenmesi"], "a": 3, "e": "Doğru cevap: Kasların esnekliğinin artması.", "kb": 1}, {"q": "Egzersiz sonrası fazladan tüketilen O2 aşağıdaki amaçlardan hangisi için kullanılmaz?", "o": ["LA'nın vücuttan uzaklaştırılması", "O2 depolarının yenilenmesi", "Glikojen depolarının yenilenmesi", "Fosfojen depolarının yenilenmesi", "Miyoglobin depolarının yenilenmesi"], "a": 2, "e": "Doğru cevap: Glikojen depolarının yenilenmesi.", "kb": 1}, {"q": "Laktik asit aşağıdaki yollardan hangisi ile vücuttan uzaklaştırılmaz?", "o": ["Oksidasyona uğrar.", "Glikoz veya glikojene dönüşür.", "Ter ve idrar ile dışarı atılır.", "Proteine dönüşür.", "Yağ formuna dönüşüp enerji kaynağı olarak kullanılır."], "a": 4, "e": "Doğru cevap: Yağ formuna dönüşüp enerji kaynağı olarak kullanılır..", "kb": 1}, {"q": "Miyoglobin ile ilgili aşağıdaki ifadelerden hangisi yanlıştır?", "o": ["İskelet kasının yapısında bulunan bir proteindir.", "Oksijenin kas hücresinde depolanmasını sağlar.", "Yavaş kasılan kas liflerinde daha fazla bulunur.", "Oksijenin kandan mitokondrilere difüzyonunu sağlar.", "Karbonhidrat ve proteinleri hücreye taşır."], "a": 4, "e": "Doğru cevap: Karbonhidrat ve proteinleri hücreye taşır..", "kb": 1}], "tf": [{"q": "Kalp kası çizgili yapıdadır ama istemsiz çalışır.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Sarkomer içerir, otomatik ve ritmik kasılır.", "tf": true}, {"q": "Motor ünitedeki lif sayısı kasın büyüklüğüyle doğru orantılıdır.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Hareketin inceliğiyle ilgilidir; ince hareketlerde lif sayısı azdır.", "tf": true}, {"q": "Egzersiz kas lif tiplerinin oranını değil kapasitesini değiştirir.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Lif tipi dağılımı büyük ölçüde kalıtsaldır.", "tf": true}, {"q": "Pasif ısınma uzun süreli eforlara olumlu etki yapar.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Pasif ısınma kısa ve orta süreli eforlara etkilidir, uzun eforlara değil.", "tf": true}, {"q": "ATP-PC depolarının %70'i toparlanmanın ilk 30 saniyesinde yenilenir.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Tamamı yaklaşık 3 dakikada yenilenir.", "tf": true}, {"q": "Hafif tempolu aktif toparlanma laktatı pasif dinlenmeden daha hızlı uzaklaştırır.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Sürekli hafif egzersiz aralıklı olandan da etkilidir.", "tf": true}, {"q": "Miyoglobin hızlı kasılan liflerde daha fazla bulunur.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Yavaş kasılan liflerde fazladır ve onlara kırmızı rengi verir.", "tf": true}]}, {"id": "ssb3", "title": "Sporda Beslenme II", "cards": [{"title": "Sporcunun enerji ihtiyacı", "points": ["6 besin ögesi: **karbonhidrat, protein, yağ, vitamin, mineral, su**. Az beslenme toparlanmayı bozar ve **sakatlıkları** tekrarlatır; fazla beslenme **yağ** olarak depolanır.", "Günlük enerji = **bazal metabolizma** + **günlük işler** + **antrenmanla harcanan** enerji.", "**Bazal metabolizma (WHO pratik formülü):** erkek = **kg × 24 × 1**, kadın = **kg × 24 × 0,95** kkal. **Günlük alınacak en düşük enerji bazal metabolizma kadardır**; altına inilirse kas kaybedilir.", "Günlük işler: **düşük aktivite ×1,4**, **orta ×1,7**, **yüksek ×2,0**.", "Antrenman enerjisi = **kg × 4 (sabit) × saat**. Örnek: 70 kg, orta aktif, 1,5 saat → BM 1680, günlük 2856 + antrenman 420 = **3276 kkal**."]}, {"title": "Makro besin oranları", "points": ["Günlük oranlar: **karbonhidrat %50-70**, **protein %15-22**, **yağ %10-30**.", "**1 g karbonhidrat = 4 kkal**, **1 g protein = 4 kkal**, **1 g yağ = 9 kkal**.", "**Dayanıklılık** antrenmanında karbonhidrat **%60-70**'e; **kuvvet, güç, sürat** antrenmanında protein **%18-22**'ye çıkarılır.", "Kuvvet antrenmanında **protein**, dayanıklılık antrenmanında **karbonhidrat** önceliklidir."]}, {"title": "Karbonhidrat", "points": ["Kasların **yakıtıdır**; kanda **glikoz**, karaciğer ve kasta **glikojen** olarak depolanır.", "100 g kas **13 g**, antrenmanlı kas **30-32 g**, karbonhidrat yüklenmiş kas **35-40 g** karbonhidrat depolar.", "Günlük karbonhidratın **en fazla %15**'i **basit** (çay şekeri, bal, pekmez, meyve), **%85**'i **bileşik** (nişasta: pirinç, makarna, ekmek, patates, bulgur) olmalı.", "**Glisemik indeks:** 50 g karbonhidratın **kana karışma hızı**. Sofra şekeri **100**; pirinç, patates **60-90**; mercimek, kuru fasulye **40 ve altı**."]}, {"title": "Yağ", "points": ["Yağlar enerjiyi **aerobik** ortamda üretir. Yağda çözünen vitaminler: **A, D, E, K** → bunlar için yağ şarttır.", "**Omega-3** kas gelişimi sağlayan hormonları (testosteron, büyüme hormonu, insülin) destekler.", "**HDL** yüksekliği antrenmanlılığı gösterir ve koroner kalp hastalığı riskinin **azaldığını** gösterir. LDL ve VLDL de lipoproteindir.", "Yağ günlük enerjinin **%10-30**'u olmalı; elzem yağlar sürantrenmandan korur."]}, {"title": "Protein", "points": ["Vücudun **yapı taşı**; büyüme, onarım, kan yapımı. Protein **depolanamaz**; fazlası **yağ** olarak depolanır.", "Fazla proteinin zararları: **su kaybı** ve böbrek yükü, **idrarla kalsiyum kaybı** (osteopeni/osteoporoz), **yağlanma**, **gut**.", "Dışarıdan alınması gereken **8 aminoasit**: lösin, izolösin, valin, triptofan, lizin, metionin, treonin, fenilalanin.", "Günlük ihtiyaç: sedanter **0,8 g/kg**, dayanıklılık sporcusu **1,2-1,4 g/kg**, kuvvet sporcusu **1,4-1,8 g/kg**.", "**16 yaşından küçükler** protein tozu ve bar gibi **sentetik proteinleri asla kullanmamalı**.", "Emilim: **yumurta proteini %93-95** (en yüksek); hayvansal %91-100 sindirilir, %75-80 kullanılır; bitkisel %40 kullanılır."]}, {"title": "Antrenman/müsabaka ÖNCESİ beslenme", "points": ["**Bileşik karbonhidrattan yüksek**, protein ve yağdan düşük beslenilmeli.", "Düşük-orta glisemik indeksli karbonhidrat **1-4 saat önce 1-5 g/kg**; 4 saat önce katı, **1 saat önce sıvı 1-2 g/kg**.", "**Yüksek glisemik indeksli** (basit şeker) besinlerden kaçınılmalı; insülin artar, kan şekeri düşer (**hipoglisemi**).", "**Karbonhidrat yükleme:** günde 350-500 g, müsabakadan **3-4 gün önce 600 g**; kas glikojeni 20'den **35 g/kg**'a çıkar. Müsabakaya **3 hafta** kala yüklenmeler bitirilir, 2 hafta kala şiddet azaltılır."]}, {"title": "Antrenman/müsabaka SIRASINDA", "points": ["1 saati aşan yoğun egzersizde **saatte 30-60 g** karbonhidrat → yorgunluğu geciktirir.", "**Sıvı veya jel** formu tercih edilir (emilimi hızlı).", "Sıvıdaki karbonhidrat **%4-8**, sodyum 0,5-0,7 g/L, sıcaklık **5-10 °C** (serin) olmalı.", "**Sıcak havada** karbonhidrat oranı **%2,5-4**'e indirilir; **soğuk havada %10**'a çıkarılır."]}, {"title": "Antrenman/müsabaka SONRASI ve toparlanma", "points": ["Glikojen depolama hızı ilk **1-2 saatte** yüksektir.", "**İlk 30 dk:** **yüksek glisemik indeksli**/basit karbonhidrat, **0,7-1,5 g/kg**; sonraki 2 saatte düşük-orta glisemik indeksli bileşik karbonhidrat.", "İlk 2 saatte ve sonra her 2 saatte **50 g** karbonhidrat → glikojen **24 saatte** dolar; gecikirse **72 saate** uzar.", "Karbonhidrat + **protein** birlikte alınmalı. **Kazein, yumurta, soya** proteini toparlanma için; **whey** hipertrofi için.", "**BCAA = valin, lösin, izolösin**; kas proteininin **1/3**'ü, kas onarımını sağlar. **Glutamin ve alanin** kas yıkımını engeller.", "Örnek ilk yarım saat: büyük muz + 1 bardak süt; peynirli/tavuklu sandviç + meyve suyu; kuru incir/hurma + süt."]}, {"title": "Su ve dehidratasyon", "points": ["Vücut suyu **%46-75**: kadınlarda **%53**, erkeklerde **%50-55**, **çocuklarda %75**. Kasın %72'si, kanın %80'i sudur.", "Su: sindirim, taşıma, atıkları uzaklaştırma; **vücut ısısının en önemli düzenleyicisi**.", "Çocuklarda ter bezleri gelişmemiştir → **daha sık** su içmeleri öğretilmelidir.", "Dehidratasyon türleri: **izotonik** (su = tuz kaybı, en sık), **hipotonik** (tuz kaybı fazla; kramp, dikkat dağınıklığı), **hipertonik** (hücre içi kayıp).", "**%2** sıvı kaybı performansı düşürür; **%20** kayıp ölümcüldür. Belirtiler: iç ısı artışı, kapasite azalması, **bitkinlik, baş dönmesi**."]}, {"title": "Elektrolitler ve sporcu içecekleri", "points": ["Ter **hipotoniktir**: su kaybı elektrolit kaybından fazladır → **suyu karşılamak daha önemlidir**. Litre ter başına ~**3 g tuz** önerilir. **Tuz hapı gereksiz, hatta zararlıdır**.", "Potasyum kaynakları: maden suyu, portakal ve domates suyu, muz, kayısı, patates.", "**Amerikan Diyetetik Birliği (1980):** müsabakadan **4 saat önce 600 cc**, **30 dk önce 400-500 cc**, müsabaka sırasında **10-15 dakikada bir 90-180 cc**.", "Sporcu içeceği: karbonhidrat **%4-8**, sodyum 10-20 mmol/L, potasyum 3-5 mmol/L. Kayıp sıvının **%150**'si ilk 1-2 saatte yerine konur.", "**Enerji içecekleri** (250 ml'de ~80 mg kafein) güç, sürat ve maksimal kuvvet antrenmanından önce **kesinlikle kullanılmamalı**."]}, {"title": "Vücut yağı ve kilo kontrolü", "points": ["Optimal yağ oranı: **kadın sporcularda %10-18**, **erkeklerde %7-15**.", "Kadınlarda çok düşük yağ → hormon düşüşü, adet bozukluğu, **osteopeni**. Erkekte yağ **%3'ün** altına inerse kas kaybı başlar.", "**Yağsız vücut ağırlığı** = vücut ağırlığı – yağ ağırlığı. **Hedef ağırlık** = yağsız ağırlık / (1 – hedef yağ oranı).", "**1 kg yağ = 7.000 kkal**. Antrenmanda 250-500 kkal harcanır → haftada ~**0,5 kg** sağlıklı kayıp."]}], "questions": [{"q": "WHO pratik formülüne göre 70 kg'lık erkek sporcunun bazal metabolizma enerjisi kaç kkal'dir?", "o": ["1400", "3276", "2856", "1680", "700"], "a": 3, "e": "70 × 24 × 1 = 1680 kkal; günlük alınacak en düşük enerji budur."}, {"q": "Orta düzeyde aktif birinin günlük enerji harcaması bazal metabolizmanın kaç katıdır?", "o": ["2,0", "1,4", "2,5", "1,7", "1,0"], "a": 3, "e": "Düşük 1,4, orta 1,7, yüksek 2,0."}, {"q": "Makro besinlerin günlük alt-üst sınırları hangisidir?", "o": ["Karbonhidrat %50-70, protein %15-22, yağ %10-30", "Karbonhidrat %40-55, protein %5-30, yağ %10-15", "Karbonhidrat %30-70, protein %15-30, yağ %10-40", "Karbonhidrat %50-80, protein %10-20, yağ %10-15", "Karbonhidrat %40-50, protein %20-30, yağ %10-40"], "a": 0, "e": "Antrenmanın türüne göre alt ya da üst sınıra yaklaşılır."}, {"q": "1 gram yağ kaç kkal enerji sağlar?", "o": ["12", "4", "7", "9", "2"], "a": 3, "e": "Karbonhidrat ve protein 4 kkal'dir."}, {"q": "Günlük karbonhidratın ne kadarı basit, ne kadarı bileşik olmalıdır?", "o": ["%15 basit – %85 bileşik", "%40 – %60", "%5 – %95", "%50 – %50", "%60 – %40"], "a": 0, "e": "Basit şekerler en fazla %15 olmalıdır."}, {"q": "50 g karbonhidratın kana karışma hızına ne denir?", "o": ["Kalori değeri", "Biyolojik değer", "Protein emilimi", "Bazal metabolizma", "Glisemik indeks"], "a": 4, "e": "Sofra şekerinin glisemik indeksi 100'dür."}, {"q": "Aşağıdakilerden hangisi yağda çözünen vitaminlerden DEĞİLDİR?", "o": ["C vitamini", "A vitamini", "E vitamini", "K vitamini", "D vitamini"], "a": 0, "e": "Yağda çözünenler A, D, E, K'dir."}, {"q": "Emilimi en yüksek olan protein kaynağı hangisidir?", "o": ["Bitkisel protein", "Yumurta proteini (%93-95)", "Süt proteini", "Kırmızı et proteini", "Balık proteini"], "a": 1, "e": "Bitkisel proteinin yalnızca %40'ı vücutta protein olarak kullanılır."}, {"q": "Kuvvet sporcusu yetişkinlerin günlük protein ihtiyacı ne kadardır?", "o": ["1,2-1,4 g/kg", "1,4-1,8 g/kg", "0,4 g/kg", "3-4 g/kg", "0,8 g/kg"], "a": 1, "e": "Sedanter 0,8, dayanıklılık sporcusu 1,2-1,4 g/kg."}, {"q": "Kaç yaşından küçük sporcular sentetik protein (toz, bar) kullanmamalıdır?", "o": ["18", "10", "21", "12", "16"], "a": 4, "e": "Sağlıklı büyüme ve gelişme için önerilmez."}, {"q": "Antrenman sırasında alınan sıvıdaki karbonhidrat oranı ve sıcaklığı nasıl olmalıdır?", "o": ["%1-2, 40 °C", "%4-8, 5-10 °C", "%34-38, 0 °C", "%24-28, 5-10 °C", "%8-20, 20 °C"], "a": 1, "e": "Sıcak havada oran düşürülür, soğuk havada artırılır."}, {"q": "Antrenman sonrası ilk 30 dakikada hangi tür karbonhidrat alınmalıdır?", "o": ["Düşük glisemik indeksli baklagil", "Hiç karbonhidrat alınmamalı", "Sadece lif", "Sadece yağ", "Yüksek glisemik indeksli/basit karbonhidrat"], "a": 4, "e": "Sonraki 2 saatte düşük-orta glisemik indeksli besinler gelir."}, {"q": "BCAA (dallı zincirli aminoasitler) hangileridir?", "o": ["Glutamin, alanin, glisin", "Lösin, triptofan, arjinin", "Triptofan, fenilalanin, metionin", "Valin, lösin, izolösin", "Lizin, metionin, valin"], "a": 3, "e": "Kas proteininin 1/3'ünü oluşturur."}, {"q": "Çocuklarda vücut suyu oranı yaklaşık yüzde kaçtır?", "o": ["46", "53", "90", "20", "75"], "a": 4, "e": "Kadınlarda %53, erkeklerde %50-55."}, {"q": "Vücuttaki sıvı kaybının yüzde kaçı performansta düşüşe yol açar?", "o": ["%10", "%50", "%20", "%0,1", "%2"], "a": 4, "e": "%20 sıvı kaybı ölümcüldür."}, {"q": "Optimal yağ oranı erkek sporcularda hangi aralıktadır?", "o": ["%25-30", "%7-15", "%1-3", "%20-28", "%10-18"], "a": 1, "e": "Kadın sporcularda %10-18."}, {"q": "Vücut ağırlığını 1 kg azaltmak için yaklaşık kaç kkal harcamak gerekir?", "o": ["7.000 kkal", "2.000 kkal", "1.000 kkal", "10.000 kkal", "5.000 kkal"], "a": 0, "e": "Haftada 0,5 kg sağlıklı bir hedeftir."}, {"q": "Aşağıdakilerden hangisi antrenman yapılan gün enerji hesaplamasında kullanılmaz?", "o": ["Bazal metabolizma enerjisi hesaplama", "Bazal metabolizma enerjisi ve aktivite düzeyi sayısını hesaplama", "Günlük enerji ihtiyacını hesaplama", "Antrenman yaparak harcanan enerjiyi hesaplama", "Karbonhidrat maksimum alımının hesaplanması"], "a": 4, "e": "Doğru cevap: Karbonhidrat maksimum alımının hesaplanması.", "kb": 1}, {"q": "Karbonhidrat, protein ve yağ makro besinlerinden sporcunun gelişimi için alınması gereken yüzde olarak alt ve üst sınır aşağıdakilerden hangisidir?", "o": ["Karbonhidratlar %30-70, proteinler %15-30, yağlar %10-40", "Karbonhidratlar %50-70, proteinler %15-22, yağlar %10-30", "Karbonhidratlar % rla kalsiyum atılımını azaltır", "Kasın onarımı ve yenilenmesinde rol alır"], "a": 3, "e": "Fazla protein idrarla kalsiyum atılımını artırır."}, {"q": "Antrenman ve müsabaka öncesi beslenmeyle ilgili hangisi doğrudur?", "o": ["Sadece yüksek proteinli yiyecekler tercih edilmelidir", "Düşük-orta glisemik indeksli bileşik karbonhidratlar 1-4 saat önce tüketilmelidir", "Bol lifli yiyecekler son 10 dakikada alınmalıdır", "Antrenmandan önce hiçbir şey yenmemelidir", "Müsabakadan hemen önce yağlı yemek yenmelidir"], "a": 1, "e": "Bu öğün kan şekerini dengeli tutar ve glikojen depolarını destekler."}, {"q": "Aşağıdakilerden hangisi dehidratasyonun etkilerinden biri DEĞİLDİR?", "o": ["Vücut iç ısısının artması", "Bitkinlik ve baş dönmesi", "Nabzın düşmesi", "Kan hacminin azalması", "Performansın düşmesi"], "a": 2, "e": "Dehidratasyonda kalp atım hızı artar."}, {"q": "Yağsız vücut kütlesi nasıl hesaplanır?", "o": ["Vücut ağırlığı × yağ yüzdesi", "Yağ ağırlığı ÷ vücut ağırlığı", "Toplam vücut ağırlığı – yağ ağırlığı", "Toplam vücut ağırlığı + yağ ağırlığı", "Boy (m)² ÷ vücut ağırlığı"], "a": 2, "e": "Yağ ağırlığı = vücut ağırlığı × yağ yüzdesi; geri kalan yağsız kütledir."}, {"q": "Sinovyal eklem çıkığında ilk yardımda yapılması doğru olan hangisidir?", "o": ["Sporcuyu oyuna devam ettirmek", "Eklemi zorla hareket ettirmek", "Çıkığı hemen kendisi yerine oturtmak", "Eklemi bulunduğu pozisyonda tespit edip sağlık kuruluşuna ulaştırmak", "Sıcak uygulama yapmak"], "a": 3, "e": "Çıkık ilk yardımcı tarafından yerine oturtulmaya çalışılmaz."}], "source": "Kitap: GSB Antrenör Eğitimi 2. Kademe (AÖF) kitabı; özetler ve sorular özgün olarak yazılmıştır"}, {"id": "soo", "title": "Sporda Öğrenme ve Öğretme II", "short": "Öğretim", "icon": "🎓", "color": "#3A7BD5", "units": [{"id": "soo1", "title": "Antrenörlerin Bilgi Kaynakları ve Antrenörlük Stilleri", "cards": [{"title": "Antrenörün 3 bilgi kaynağı", "points": ["**Profesyonel alan bilgisi:** spor dalının yönetim, kural ve düzenlemeleri; **teknik-taktik** bilgisi; spor dalının **öğretim bilgisi (pedagojisi)** ve bunları uygulama bilgisi.", "**Kişiler arası bilgi:** spor ortamındaki diğer paydaşlarla **olumlu ve verimli ilişki** kurma yeteneği.", "**İçsel alan bilgisi:** antrenörün **kendini anlama, iç gözlem ve düşünme** yeteneği."]}, {"title": "Antrenörün yetkinlikleri", "points": ["Bilgiler spor ortamının **amaçlarına göre** düzenlenmelidir.", "Yetkinlikler: **vizyon ve strateji** oluşturmak, **çevresel düzenlemeler** yapmak, paydaşlarla **iyi ilişkiler**, antrenmanları **planlamak**, **yarışmalara hazırlık**, ortamı **gözlemleyip tepki** vermek, **öğrenmeye açık olup yansıma** yapmak.", "**Antrenör/yönetim merkezli** yaklaşım bir yetkinlik **değildir**; doğru yaklaşım **sporcu merkezlidir**."]}, {"title": "Spora katılım modelleri", "points": ["**Spora katılımın gelişimsel modeli:** **örneklem yıllarında** çok sayıda spor denenir ve **amaçlı oyun** etkinlikleri en fazladır; sonra özelleşme ve yatırım yılları gelir.", "**Uzun süreli sporcu gelişimi modeli:** spora katılımı **fiziksel gelişim ve olgunlaşma** (biyolojik gelişim) üzerinden açıklar; antrenman içerikleri biyolojik gelişime göre belirlenir.", "Küçük çocuklara çeşitli hareket becerileriyle **beden okuryazarlığı** kazandırılır."]}, {"title": "Etkili antrenörlük", "points": ["Tanım: profesyonel, kişiler arası ve içsel bilgilerin sporcunun **yetkinlik, öz güven, bağ kurma, karakter ve umursama** becerilerini geliştirmek için etkili kullanılması.", "**Sporcu merkezli** yaklaşım; her sporcuyu iyi tanımak, ihtiyaç ve fikirlerini dikkate almak.", "**Güvenli fiziki çevre:** kontroller **her antrenman öncesinde** yapılır. **Güvenli sosyal çevre:** akran zorbalığı, gruplaşma, dışlama önlenir.", "Sporculara **saygı ve sevgi**; adil oyun ve iyi davranışlar **taltif edilir**.", "Kronolojik yaş aynı olsa bile **gelişim farklı** olabilir; bilişsel ve algısal farklılıklar gözetilir. Sözel ve sözel olmayan **iletişim** iyi kullanılmalıdır."]}, {"title": "Antrenörlük stilleri", "points": ["**Otokratik:** kararları **antrenör tek başına** alır, sporcunun fikri nadiren alınır; **kazanmaya odaklı**, esnek olmayan yapı; **takım sporlarında** daha iyi çalışır; genç sporcuların **beceri gelişimi** döneminde etkilidir.", "**Demokratik:** kararlar **antrenör ve sporcuyla birlikte** alınır; **sporcu merkezlidir**; sporcu, antrenörün çizdiği çerçevede kendi hedeflerini belirler. **Tenis, atletizm** gibi **bireysel** sporlara uygun; **ergenlerde öz denetim** geliştirir.", "**Bütünsel (holistik) = serbest, “Laissez-faire”:** antrenör çok az karar alır; “**mutlu takım başarılı olur**” fikri; yaratıcılığı ve öz farkındalığı gelişmiş **olgun sporculara** uygundur.", "Antrenör duruma göre **stilleri bir arada** kullanabilir. Stil seçimini **deneyim, felsefe ve sporcuların ilgisi** belirler."]}, {"title": "Antrenörlük felsefesi", "points": ["Antrenörün spor ortamında bazı unsurlara daha çok **eğilim** göstermesi felsefesini oluşturur.", "Sıra: **değerler → inanç sistemi → misyon** → “neden antrenörlük yapıyorum?” → tüm sporcuları içeren misyon ve **standartlar**.", "Felsefeyi etkileyenler: **geçmiş yaşam ve spor deneyimleri, eğitim durumu, antrenörlük deneyimi** (gelir düzeyi değil).", "Felsefe **sezon başında** oluşturulur, sezon içinde **büyük değişikliğe uğramaz**."]}], "questions": [{"q": "Antrenörün kendini anlama, iç gözlem ve düşünme yeteneği hangi bilgi kaynağıdır?", "o": ["Teknik-taktik bilgi", "Profesyonel alan bilgisi", "İçsel alan bilgisi", "Kişiler arası bilgi", "Pedagojik bilgi"], "a": 2, "e": "Kişiler arası bilgi başkalarıyla ilişki kurmaktır."}, {"q": "Spor dalının kural, teknik-taktik ve öğretim bilgisi hangi bilgi kaynağına girer?", "o": ["Kişiler arası bilgi", "İçsel alan bilgisi", "Deneyimsel bilgi", "Profesyonel alan bilgisi", "Sosyal bilgi"], "a": 3, "e": "Pedagoji de profesyonel alan bilgisinin parçasıdır."}, {"q": "Gelişimsel modele göre amaçlı oyunun en fazla olduğu dönem hangisidir?", "o": ["Örneklem yılları", "Erken uzmanlaşma", "Özelleşme yılları", "Rekreasyon yılları", "Yatırım yılları"], "a": 0, "e": "Bu yıllarda çocuk birçok sporu dener."}, {"q": "Takım sporlarında daha iyi çalışan, kazanmaya odaklı stil hangisidir?", "o": ["Laissez-faire", "Sporcu merkezli", "Demokratik", "Bütünsel", "Otokratik"], "a": 4, "e": "Kararları antrenör tek başına alır."}, {"q": "Tenis, atletizm gibi bireysel sporlara uygun, sporcu merkezli stil hangisidir?", "o": ["Komuta", "Demokratik", "Emredici", "Bütünsel", "Otokratik"], "a": 1, "e": "Kararlar birlikte alınır."}, {"q": "“Mutlu takım doğal olarak başarılı olur” fikrine dayanan stil hangisidir?", "o": ["Otokratik", "Komuta", "Bütünsel (Laissez-faire)", "Görev odaklı", "Demokratik"], "a": 2, "e": "Olgun ve öz farkındalığı yüksek sporculara uygundur."}, {"q": "Güvenli fiziki çevre için kontroller ne zaman yapılmalıdır?", "o": ["Sadece müsabaka günü", "Haftada bir", "Sezon başında bir kez", "Ayda bir", "Her antrenman öncesinde"], "a": 4, "e": "Yaralanmaların önüne geçmek için."}, {"q": "Aşağıdakilerden hangisi antrenörlük felsefesini etkileyen bir unsur DEĞİLDİR?", "o": ["Eğitim durumu", "Antrenörlük deneyimi", "Geçmiş yaşam deneyimleri", "Spor deneyimleri", "Aylık gelir düzeyi"], "a": 4, "e": "Felsefe deneyim ve eğitimle şekillenir."}, {"q": "Aşağıdakilerden hangisi antrenörlerin sahip olması gereken içsel alan bilgisi ile ilgili doğru bir ifadedir?", "o": ["Antrenörün başkalarıyla olumlu ve verimli ilişkiler kurma yeteneğidir.", "Antrenörün, antrenörlüğünü yaptığı sporun yönetim ve kural bilgisine sahip olmasıdır.", "Antrenörlerin kendini anlama, iç gözlem ve düşünme yeteneğidir.", "Antrenörün temel teknik ve taktik bilgisine ve spor dalının öğretim bilgisine sahip olmasıdır.", "Antrenörün sporcularının kapasitelerini, gelişim dönemlerini ve motivasyonlarını bilmesidir."], "a": 2, "e": "Doğru cevap: Antrenörlerin kendini anlama, iç gözlem ve düşünme yeteneğidir..", "kb": 1}, {"q": "Aşağıdakilerden hangisi antrenörlük bilgilerinin spor ortamının amaçlarına göre kullanılmasında gerekli olan yetkinliklerden biri değildir?", "o": ["Vizyon ve strateji oluşturmak", "Çevresel düzenlemeler yapmak", "Spor ortamının paydaşları ile iyi ilişkiler kurmak", "Antrenör ve yönetim merkezli bir yaklaşım izlemek", "Öğrenmeye açık olmak ve yansıma yapabilmek"], "a": 3, "e": "Doğru cevap: Antrenör ve yönetim merkezli bir yaklaşım izlemek.", "kb": 1}, {"q": "Spora katılımın gelişimsel modeline göre amaçlı oyun etkinliklerinin en fazla olması gereken dönem hangisidir?", "o": ["Örneklem yılları", "Özelleşme yılları", "Yatırım yılları", "Erken uzmanlaşma", "Rekreasyon yılları"], "a": 0, "e": "Doğru cevap: Örneklem yılları.", "kb": 1}, {"q": "Uzun süreli sporcu gelişimi modeli ile ilgili aşağıdaki ifadelerden hangisi yanlıştır?", "o": ["Model bireyin spora katılımını ve gelişimini fiziksel gelişim ve olgunlaşma gibi unsurlarla açıklar.", "Model bireyin psikososyal gelişim özelliklerini daha çok baskın tutarak tasarlanmıştır.", "Modele göre biyolojik gelişim süreçlerine bağlı olarak antrenman içerikleri belirlenir.", "Antrenörler sporcularının biyolojik gelişimine uygun bireyselleştirilmiş etkinlikler seçmelidir.", "Antrenörler küçük çocuklara beden okuryazarlığı kazandıracak hareket etkinlikleri sunmalıdır."], "a": 1, "e": "Doğru cevap: Model bireyin psikososyal gelişim özelliklerini daha çok baskın tutarak tasarlanmıştır..", "kb": 1}, {"q": "Aşağıdakilerden hangisi güvenli sosyal ve fiziksel çevre oluşturmada antrenörlerin dikkat etmesi gereken unsurlardan biri değildir?", "o": ["Akran zorbalığı gibi durumları önlerken olumlu bir iklim oluşturmak", "Fiziksel risk oluşturabilecek unsurları en aza indirmek", "Spor ortamının fiziksel kontrollerini her hafta mutlaka yapmak", "Sporcuların birbirleriyle olumlu ilişki kurmasını sağlamak", "Gereken güvenlik ekipmanının ulaşılabilir olmasını sağlamak"], "a": 2, "e": "Doğru cevap: Spor ortamının fiziksel kontrollerini her hafta mutlaka yapmak. Kontroller haftada bir değil, her antrenman öncesinde yapılmalıdır.", "kb": 1}, {"q": "Aşağıdakilerden hangisi etkili antrenörlük yapabilmek için dikkat edilmesi gerekenlerden biri değildir?", "o": ["Antrenör merkezli bir yaklaşım oluşturmak", "Güvenli sosyal ve fiziksel çevre oluşturmak", "Sporculara saygı ve sevgi ile yaklaşmak", "İyi davranışlar ve değerler sergilemek", "Sporcuların yaş ve gelişimi arasındaki farkı gözlemlemek"], "a": 0, "e": "Doğru cevap: Antrenör merkezli bir yaklaşım oluşturmak.", "kb": 1}, {"q": "Aşağıdakilerden hangisi otokratik antrenörlük stilinin özelliklerinden biri değildir?", "o": ["Antrenörlerin kararlarını genellikle kendi başlarına almaları", "Sporcuların fikrinin nadiren alınması veya hiç alınmaması", "Kazanmaya odaklı olması ve esnek olmayan yapılara sahip olması", "Takım sporlarında bireysel sporlardan daha iyi çalışması", "Sporcu merkezli olması"], "a": 4, "e": "Doğru cevap: Sporcu merkezli olması.", "kb": 1}, {"q": "Demokratik antrenörlük stili ile ilgili aşağıdaki ifadelerden hangisi yanlıştır?", "o": ["Sporcuların neleri yapması gerektiğine dair bir vizyon oluşturur ve bu vizyonu gerçekleştirmelerini bekler.", "Sporcunun antrenman kontrolünün çok olduğu bireysel spor ortamları için uygundur.", "Küçük yaştaki sporcularda öz denetim ve öz kontrol duygularını geliştirir.", "Kararların sporcuların da katılımıyla birlikte alınmasını hedefler.", "Sporcular antrenörün ana hatlarıyla çizdiği çerçevede kendi hedeflerini şekillendirir."], "a": 0, "e": "Doğru cevap: Sporcuların neleri yapması gerektiğine dair bir vizyon oluşturur ve bu vizyonu gerçekleştirmelerini bekler.. A seçeneği otokratik stili anlatır.", "kb": 1}, {"q": "Aşağıdakilerden hangisi antrenörlük felsefesi oluşurken antrenörü etkileyen unsurlardan biri değildir?", "o": ["Antrenörlerin geçmiş yaşam deneyimleri", "Antrenörlerin spor deneyimleri", "Antrenörün aylık gelir düzeyi", "Antrenörün eğitim durumu", "Antrenörlük deneyimi"], "a": 2, "e": "Doğru cevap: Antrenörün aylık gelir düzeyi.", "kb": 1}, {"q": "Aşağıdakilerden hangisi antrenörlük felsefesi oluşturmak için antrenörlerin kişisel olarak cevaplaması gereken sorulardan biri değildir?", "o": ["Spor ortamında zaman, enerji ve efor harcamayı göze alacağınız unsurlar nelerdir?", "Antrenör olarak değerlerim nelerdir?", "Kişisel misyonum tüm sporcularım tarafından biliniyor mu?", "Benim için önemli olan sporcularım kimlerdir?", "Sporcularımı değerlerime bağlı kılmak için standartlarım neler olmalıdır?"], "a": 3, "e": "Doğru cevap: Benim için önemli olan sporcularım kimlerdir?. Felsefe tüm sporcuları kapsar; sporcular arasında ayrım yapılmaz.", "kb": 1}], "tf": [{"q": "Etkili antrenörlük için antrenör merkezli bir yaklaşım benimsenmelidir.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Sporcu merkezli yaklaşım gerekir.", "tf": true}, {"q": "Kronolojik yaşları aynı olan sporcuların gelişim düzeyleri farklı olabilir.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Antrenör bu farkı gözetmelidir.", "tf": true}, {"q": "Antrenörler tek bir stil seçip her durumda yalnızca onu uygulamalıdır.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Duruma göre stiller bir arada kullanılabilir.", "tf": true}, {"q": "Antrenörlük felsefesi sezon başında oluşturulmalı ve sezon içinde büyük değişikliğe uğramamalıdır.", "o": ["Doğru", "Yanlış"], "a": 0, "e": null, "tf": true}]}, {"id": "soo2", "title": "Beceri Öğrenimi II", "cards": [{"title": "Fitts ve Posner: 3 aşamalı model", "points": ["Sporcunun öğrenme sürecindeki **davranışsal eğilimlerini** anlatır.", "**1. Bilişsel aşama** → **2. İlişkilendirme aşaması** (hareket kalıbı **detaylandırılır**) → **3. Özerk (otonom) aşama** (hareket **neredeyse otomatik**).", "Sporcu bir beceride bilişsel aşamadayken **başka bir beceride özerk** aşamada olabilir.", "Sınırlılığı: ilerleme **bir önceki basamağa bağlıdır**."]}, {"title": "Gentile: 2 aşamalı model", "points": ["Öğrenmeyi **sporcunun bakış açısından** tanımlar.", "**1. Hareketle ilintili düşüncenin oluşması** → **2. Sabitleme/çeşitleme** aşaması.", "**Kapalı becerilerde sabitleme**, açık becerilerde **çeşitleme** önerilir.", "Sınırlılığı: algılama ve becerinin mekanik özelliklerine yer vermez."]}, {"title": "Bernstein: 3 aşamalı model", "points": ["Öğrenmeyi **motor kontrol ve biyomekanik** açısından açıklar.", "**1. Serbestlik derecesini azaltma** (hareketler kaba, **robot gibi**) → **2. Serbestlik derecesini rahatlatma** → **3. Pasif dinamiklerden yararlanma**.", "Sınırlılığı: 2. aşama (rahatlatma) **her beceri için geçerli değildir**."]}, {"title": "Gösterim ve alıştırma dizaynı", "points": ["Gösterimin **yeri** önemlidir: sporcu başka uyaranlara değil **gösterilen beceriye** odaklanmalı.", "Sözel açıklama sporcunun seviyesine uygun, **kısa ve basit** olmalı. Becerinin **neden önemli** olduğunu anlatmak **motivasyonu artırır**.", "Antrenör beceriyi **bütün** mü **parça** mı öğreteceğine önceden karar verir.", "Birden fazla beceride: **blok, seri, rastgele** alıştırma. **Mekânsal doğruluk** gerektiren becerilerde ilk aşamada **blok** alıştırma daha iyidir."]}, {"title": "Geri bildirim ve motivasyon", "points": ["Antrenör geri bildirimin **ne zaman, ne kadar, ne sıklıkta, ne detayda** verileceğini bilmelidir.", "Geri bildirim **öğrenmenin ilk aşamasında** daha faydalıdır; her denemeden sonra verilmez, çok detaya girilmez.", "Öğrenme artar: **olumlu sonuç beklentisi** artırılınca, **seçenek** sunulunca, dikkat **dışsal odağa** (hareketin etkisine) yöneltilince."]}, {"title": "Yetenek, beceri ve bireysel farklılıklar", "points": ["**Bireysel farklılık:** kişiye has, **nispeten değişmeyen** özellikler.", "**Motor yetenek** büyük ölçüde **genetiktir** ve becerinin ön koşuludur; **beceri** antrenmanla geliştirilir.", "**Fleishman:** **algısal motor yetenekler** (kontrol kesinliği, uzuvlar arası koordinasyon, **reaksiyon zamanı**, hız kontrolü, el/parmak becerisi, hedefleme…) ve **fiziksel yeterlik yetenekleri** (statik, dinamik, patlayıcı ve gövde kuvveti, esneklik, bütün vücut koordinasyonu ve dengesi, **dayanıklılık**).", "Antrenör her beceri için **görev analizi** yaparak gereken yetenekleri belirlemelidir."]}, {"title": "Öğrenme stilleri", "points": ["**Dunn ve arkadaşlarının** öğrenme stilleri envanterinde çevresel (uygulama alanı), **duygusal**, sosyolojik, **fizyolojik** ve **psikolojik** tercihler ölçülür; “fiziksel tercihler” yoktur.", "Algısal tarzlar: **görsel** (beceriyi tekrar tekrar görmek ister), işitsel, **kinestetik** (yaparak öğrenir)."]}], "questions": [{"q": "Fitts ve Posner modelinin aşamaları sırasıyla hangisidir?", "o": ["İlişkilendirme – Bilişsel – Özerk", "Bilişsel – Sabitleme – Otonom", "Bilişsel – İlişkilendirme – Özerk", "Azaltma – Rahatlatma – Pasif dinamik", "Sabitleme – Çeşitleme – Özerk"], "a": 2, "e": "Özerk aşamada hareket neredeyse otomatiktir."}, {"q": "Gentile'ye göre kapalı becerilerin öğretiminde ne önerilir?", "o": ["Serbestlik derecesini artırma", "Rastgele alıştırma", "Sabitleme", "Çeşitleme", "Detaylandırma"], "a": 2, "e": "Açık becerilerde çeşitleme önerilir."}, {"q": "Hareketleri robot gibi kaba olan kayak öğrenicisi Bernstein'a göre hangi aşamadadır?", "o": ["Pasif dinamiklerden yararlanma", "Özerk aşama", "Serbestlik derecesini azaltma", "Serbestlik derecesini rahatlatma", "Çeşitleme"], "a": 2, "e": "İlk aşamada eklemler kilitlenir, hareket katıdır."}, {"q": "Bernstein modeli öğrenmeyi hangi açıdan açıklar?", "o": ["Sosyal öğrenme", "Motor kontrol ve biyomekanik", "Davranışsal eğilimler", "Sporcunun bakış açısı", "Duygusal tercihler"], "a": 1, "e": "Gentile sporcunun bakış açısını, Fitts-Posner davranışı esas alır."}, {"q": "Mekânsal doğruluk gerektiren becerilerde ilk aşamada hangi alıştırma yöntemi daha iyidir?", "o": ["Farklılaştırılmış", "Blok", "Seri", "Rastgele", "Değişken"], "a": 1, "e": "Önce aynı beceri art arda çalışılır."}, {"q": "Aşağıdakilerden hangisi algısal motor yetenektir?", "o": ["Dayanıklılık", "Statik kuvvet", "Reaksiyon zamanı", "Bütün vücut dengesi", "Patlayıcı kuvvet"], "a": 2, "e": "Diğerleri fiziksel yeterlik yetenekleridir."}, {"q": "Beceriyi sürekli tekrar görmek isteyen sporcu hangi algısal tarzda öğrenir?", "o": ["İşitsel", "Analitik", "Global", "Görsel", "Kinestetik"], "a": 3, "e": "Kinestetik öğrenen yaparak öğrenir."}, {"q": "Dikkat odağı nereye yöneltilince öğrenme daha fazla olur?", "o": ["İçsel odak (vücut parçaları)", "Seyirciler", "Skor tabelası", "Rakip", "Dışsal odak (hareketin etkisi)"], "a": 4, "e": "Seçenek sunmak ve olumlu beklenti de öğrenmeyi artırır."}, {"q": "Fitts ve Posner'a göre aşağıda belirtilen özelliklerden hangisi ilişkilendirme aşamasında gözlemlenir?", "o": ["Hareket kalıbının detaylandırılması", "Hareket kalıbının oluşturulması", "Hareket üretiminin neredeyse otomatik olması", "Hareketle ilintili düşüncenin oluşması", "Hareketin sabitlenmesi"], "a": 0, "e": "Doğru cevap: Hareket kalıbının detaylandırılması.", "kb": 1}, {"q": "Gentile'ye göre kapalı becerilerin öğretilmesinde antrenörlerin hangi uygulamayı yapması önerilir?", "o": ["Çeşitleme", "Detaylandırma", "Sabitleme", "Değişkenleştirme", "Serbestlik derecesini artırma"], "a": 2, "e": "Doğru cevap: Sabitleme.", "kb": 1}, {"q": "“Kayak öğrenen bir kişinin hareketleri çok kaba ve daha çok robota benzemektedir.” Bu kişi Bernstein'ın öğrenme yaklaşımına göre hangi aşamadadır?", "o": ["Serbestlik derecesini azaltma", "Pasif dinamiklerden yararlanma", "Temel hareket kalıbının detaylandırılması", "İlişkilendirme", "Otonom"], "a": 0, "e": "Doğru cevap: Serbestlik derecesini azaltma.", "kb": 1}, {"q": "Beceri gösterimi yapılırken becerinin neden önemli olduğunun ve sporcuya ne işe yarayacağının anlatılması neyi sağlar?", "o": ["Ortamı sakinleştirir", "Motivasyonu ve istekleri artırır", "Hiçbir etkisi yoktur", "Sporcuların ilgileri dağılır", "Antrenörün ilgisi artar"], "a": 1, "e": "Doğru cevap: Motivasyonu ve istekleri artırır.", "kb": 1}, {"q": "Mekânsal doğruluk gerektiren becerileri öğretirken ilk aşamada antrenörlerin hangi alıştırma yöntemini kullanmaları daha iyi olur?", "o": ["Rastgele", "Değişken", "Seri", "Farklılaştırılmış", "Blok"], "a": 4, "e": "Doğru cevap: Blok.", "kb": 1}, {"q": "Aşağıdaki geri bildirim ile ilgili ifadelerden hangisi doğrudur?", "o": ["Geri bildirim sporcu hareketi bitirdikten çok sonra verilmelidir.", "Geri bildirim yapılan her denemeden sonra verilmelidir.", "Geri bildirim verirken çok fazla detaya gidilmelidir.", "Geri bildirim öğrenmenin ilk aşamasında verildiğinde daha faydalıdır.", "Geri bildirim sıklığı artırılmalıdır."], "a": 3, "e": "Doğru cevap: Geri bildirim öğrenmenin ilk aşamasında verildiğinde daha faydalıdır..", "kb": 1}, {"q": "Aşağıdakilerden hangisi algısal motor yeteneklere örnek olarak verilebilir?", "o": ["Statik kuvvet", "Patlayıcı kuvvet", "Reaksiyon zamanı", "Dayanıklılık", "Bütün vücut dengesi"], "a": 2, "e": "Doğru cevap: Reaksiyon zamanı.", "kb": 1}, {"q": "Aşağıdakilerden hangisi halter branşında başarılı performans için gerekli olan ön koşul fiziksel yeterlik yetenekleri arasında yer almaz?", "o": ["Statik kuvvet", "Dayanıklılık", "Patlayıcı kuvvet", "Bütün vücut dengesi", "Uzanma esnekliği"], "a": 1, "e": "Doğru cevap: Dayanıklılık. Halter kısa süreli, maksimal kuvvet gerektirir; dayanıklılık ön koşul değildir.", "kb": 1}, {"q": "Dunn ve arkadaşları tarafından geliştirilen öğrenme stilleri envanterinde aşağıdaki ölçüm alanlarından hangisi yer almaz?", "o": ["Uygulama alanı ile ilgili tercihler", "Duygusal tercihler", "Fiziksel tercihler", "Fizyolojik tercihler", "Psikolojik tercihler"], "a": 2, "e": "Doğru cevap: Fiziksel tercihler.", "kb": 1}, {"q": "Antrenmanda antrenörüne sürekli “Hocam beceriyi bir daha gösterebilir misiniz?” diye soran sporcu hangi algısal tarzda öğrenen sporcudur?", "o": ["Analitik öğrenen", "Global öğrenen", "Duyusal öğrenen", "Kinestetik öğrenen", "Görsel öğrenen"], "a": 4, "e": "Doğru cevap: Görsel öğrenen.", "kb": 1}], "tf": [{"q": "Bir sporcu bir beceride bilişsel aşamadayken başka bir beceride özerk aşamada olabilir.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Fitts ve Posner bunu belirtir.", "tf": true}, {"q": "Motor yetenekler antrenmanla kolayca değiştirilebilir, beceriler ise genetiktir.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Tam tersi: yetenek genetik, beceri antrenmanla gelişir.", "tf": true}, {"q": "Geri bildirim her denemeden sonra ve çok detaylı verilmelidir.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Ne zaman, ne sıklıkta, ne detayda verileceği ayarlanmalıdır.", "tf": true}, {"q": "Becerinin neden önemli olduğunu anlatmak sporcunun motivasyonunu artırır.", "o": ["Doğru", "Yanlış"], "a": 0, "e": null, "tf": true}]}, {"id": "soo3", "title": "Hareket Eğitimi ve Oyun II", "cards": [{"title": "Koordinasyon kavramı", "points": ["**Koordinasyon:** sinir sistemi ve iskelet kaslarının iş birliği; güç, kuvvet, hız ve dayanıklılıkla uyum içinde performansı artırır.", "Performans yalnızca kondisyona değil **psiko-nörolojik süreçlere** de bağlıdır. Koordinasyon **daha az eforla daha fazla iş** yapmayı sağlar.", "Sınıflama: **genel/özel**, **kapalı beceri/açık beceri** koordinasyonu, **kaba/ince** koordinasyon.", "**Kapalı beceri koordinasyonu** teknik becerilerdir ve **unutma az olur** (ör. **bisiklete binme**)."]}, {"title": "Koordinatif yetiler (Hirtz)", "points": ["Koordinatif yetiler **doğuştan değildir**; doğru öğrenmeyle gelişir.", "**Hirtz'in 5 yetisi:** **tepki, oryantasyon (mekân uyumu), denge, ritim, kinestetik ayrımlama**.", "Antrenmanın **ana evresinde**, tekrar sayısı artırılarak verilir.", "**Ritim yetisi 6-15 yaş** arasında gelişir; hem hareketin ritmi hem dışarıdan gelen ritim algılanmalıdır.", "**Mekân algısı** hareketin boyutunu kavramaktır; **işitsel-görsel** uyaranlarla çalışır.", "**Statik denge:** vücudun dengesini belli bir yerde/pozisyonda sağlama.", "Çocuk kendi hareketleriyle algılarını ne kadar çok devreye sokarsa yeni hareketleri **o kadar kısa sürede** öğrenir."]}, {"title": "Eğitsel oyunların motorik özelliklere etkisi", "points": ["Kazanma arzusu → oyuncular **maksimal yüklenmeyle** mücadele eder.", "**Kuvvet:** mücadele oyunlarında en çok kullanılan özellik; çocuk farkında olmadan dirençle mücadele eder.", "**Çabukluk:** zor gelişir, zor korunur; **kısa mesafeli yüksek hızlı koşu** oyunları ve **stafetler** geliştirir.", "**Dayanıklılık:** oyunun çekiciliği yorgunluk ve bıkkınlığı geri plana iter.", "**Esneklik-hareketlilik:** **eğilmeli, sürünmeli, köprülü** oyunlar.", "**Koordinasyon ve beceri:** her oyunda vardır; **çok fonksiyonlu** oyunlar seçilmelidir."]}, {"title": "Oyunun seçimi ve planlanması", "points": ["**Eğitsel değer ve amaç:** fizyolojik, psikolojik, sosyolojik kazanım.", "**Oyuncu seviyesi:** cinsiyet, yaş, fiziksel kapasite, yetenek, antrene durum.", "**Oyunun yeri:** yer ve zaman oyuna uygun olmalı (bahçede yaz oyunu kışın oynatılmaz).", "**Araç-gereç:** oyun planında belirtilmelidir.", "**Oyunun süresi:** oyuncular **bıkmamalı**, oyunun çekiciliği kaybolmamalıdır."]}, {"title": "Oyunun öğretimi, yönetimi, çeşitlendirilmesi", "points": ["Maksimum verimin ilk şartı **iyi bir oyun öğretimidir**; sorunların çoğu doğru öğretimle baştan önlenir.", "**En önemli yönetim ilkesi:** katılanların **fiziksel ve ruhsal zarar görmemesi** (kayma, düşme, çarpışma, top çarpması, çevre şartları).", "İlgi azalınca oyun **değiştirilir** ya da oyun içinde **değişiklik** yapılır.", "Çeşitlendirme: alanı daraltma-genişletme, koşu mesafesini değiştirme, engeller koyma, eşlerle oynama… Değişiklikler **hafiften ağıra, basitten karmaşığa**.", "**Oyun liderinin oyuna katılması** bir çeşitlendirme ilkesi değildir."]}], "questions": [{"q": "Hirtz'e göre aşağıdakilerden hangisi 5 temel koordinatif yetiden biri DEĞİLDİR?", "o": ["Denge", "Kinestetik ayrımlama", "Kuvvet", "Tepki", "Ritim"], "a": 2, "e": "Beşinci yeti oryantasyondur (mekân uyumu)."}, {"q": "Ritim yetisi hangi yaş aralığında gelişir?", "o": ["15-20 yaş", "4-11 yaş", "6-15 yaş", "5-8 yaş", "8-11 yaş"], "a": 2, "e": "Hem hareketin ritmi hem dış ritim algılanmalıdır."}, {"q": "“Teknik beceridir ve unutma az olur”
