ş, cinsiyet, antrenman durumu. (Rakiple arasındaki mesafe gibi oyun durumları VO₂maks'ı etkilemez.)"]}, {"title": "Dayanıklılığın sınıflandırılması", "points": ["**Spor türüne göre:** **genel dayanıklılık** (her sporda gereken) ve **özel dayanıklılık** (branşın teknik-taktiğiyle birleşik).", "**Enerji oluşumuna göre:** **aerobik** (O₂ borçlanması olmadan; 3 dakikanın üzerindeki aralıksız çalışmalar) ve **anaerobik** (yüksek O₂ borcuna rağmen devam edebilme; genel anaerobikte en fazla **180 sn**).", "**Süreye göre (Sevim):** **kısa süreli 45 sn - 2 dk**, **orta süreli 2-8 dk**, **uzun süreli 8 dk ve üzeri**.", "Uzun süreli dayanıklılık: **30 dk'ya kadar** ağırlıklı yakıt glikoz; **30-90 dk** glikoz ve yağ; **90 dk üzeri** temel yakıt **yağ**.", "1500 m koşuda enerjinin **~%50'si**, 3000 m'de **~%20'si** anaerobik sistemden gelir.", "\"Süregelen dayanıklılık\" diye bir dayanıklılık türü **yoktur**."]}, {"title": "Kuvvet ve etkileyen faktörler", "points": ["**Kuvvet:** İç ve dış dirençleri aşmayı sağlayan **sinir-kas yeteneği**; bir kütleyi hareket ettirme, direnci aşma ya da ona kas gücüyle karşı koyma (Meusel).", "Kuvveti etkileyen başlıca faktörler: **morfolojik-fizyolojik** (antropometri, kas metabolizması), **koordinatif** ve **motivasyonel** faktör. (Çevresel faktörler bu listede yoktur.)", "**İntermüsküler koordinasyon:** harekete katılan **kaslar arası** etkileşim. **İntramüsküler koordinasyon:** bir kastaki **liflerin** senkronize çalışması.", "Düşük genel kuvvet, sporcunun tüm gelişimini sınırlar; genel kuvvet yeni başlayanlarda ve hazırlık evresinde özenle geliştirilmelidir."]}, {"title": "Kuvvet türleri", "points": ["**Genel kuvvet:** Branşa yönelmeyen, tüm kasların çok yönlü kuvveti. **Özel kuvvet:** Branşa özgü kuvvet (sıçrama, atış kuvveti).", "**Maksimal kuvvet:** Sinir-kas sisteminin istemli kasılmayla ortaya koyduğu **en büyük kuvvet**; bir denemede kaldırılabilen en yüksek yük.", "**Çabuk kuvvet:** Yüksek hızda kasılmayla direnci yenebilme; **kuvvet ve süratin ürünüdür** (en kısa sürede en yüksek kuvvet).", "**Kuvvette devamlılık:** Direnci **olabildiğince uzun süre** yenebilme; yorgunluğa karşı kuvveti sürdürme.", "**Statik kuvvet:** **İzometrik** kasılma (gözle görülür kısalma yok). **Dinamik kuvvet:** **İzotonik** (konsantrik, eksantrik) kasılma.", "**Salt (mutlak) kuvvet:** Vücut ağırlığı dikkate alınmadan uygulanan en yüksek kuvvet. **Relatif (göreli) kuvvet = Salt kuvvet / Vücut ağırlığı.** Relatif kuvveti artırmak için: maksimal kuvveti geliştirmek ve kilo vermek."]}, {"title": "Sürat ve türleri", "points": ["**Sürat:** Belirli bir mesafeyi **en kısa sürede** kat edebilme; hareketleri mümkün olduğunca yüksek hızla yapabilme yeteneği. Büyük ölçüde **kalıtsaldır** ama antrenmanla geliştirilebilir.", "Sürati etkileyen faktörler: **kas lifi tipi** (hızlı kasılan lif oranı), yaş, boy, adım uzunluğu, esneklik, ruhsal durum, kuvvet. (Göz rengi gibi özellikler etkilemez.)", "**Reaksiyon sürati:** Bir uyarana karşı **algılama ve tepki gösterme** yeteneği; ani uyarana en kısa sürede verilen tepki. Belirli bir sınırın altına düşmez; **motivasyon, uyarılmışlık ve yoğunlaşmadan** etkilenir.", "Reaksiyon sürecinin aşamaları: **duyu organlarının algılaması → uyarının MSS'ye gelip emrin oluşması → emrin kaslara iletilmesi → kasta mekanik olay**. (Uyarı MSS'ye gelmeden kaslara iletilmez.)", "**İvme:** Minimum sürede maksimum hıza ulaşma. **Sprint sürati:** ~30 m; maksimal sürate **4-5 saniyede**, yaklaşık 28,5-36,5 m'de erişilir.", "Diğer türler: maksimum sürat, ortalama sürat, hareket sürati, algılama sürati."]}, {"title": "Esneklik", "points": ["**Esneklik:** Bir eklem etrafındaki **hareket genişliği (ROM)**; Latince \"flectere\". Yaralanma riskini azaltır, performansı ve rehabilitasyonu destekler.", "**Aktif esneklik:** dış yardım olmadan kas gücüyle. **Pasif esneklik:** dış kuvvet yardımıyla. **Pasif hareket genişliği her zaman aktiften büyüktür**; aradaki fark **hareketlilik rezervidir**.", "**Statik-aktif:** bacağı desteksiz yukarıda tutmak. **Statik-pasif:** split. Aktif esneklik sportif başarıda pasiften **daha etkilidir**.", "**İç faktörler:** eklem yapısı, kemik yapısı, kas-tendon-bağ elastikiyeti, deri elastikiyeti, kasın gevşeme yeteneği, **eklem ve dokuların ısısı**.", "**Dış faktörler:** **ortamın ısısı**, **günün saati** (zirve **14.30-16.00**), sakatlık sonrası dönem, yaş (ergenlik öncesi daha elverişli), cinsiyet (**kadınlar daha esnek**, östrojen), giysi ve ekipman.", "Esnekliğe direnci **kas lifi değil, kasın membranı** yapar."]}, {"title": "Beceri", "points": ["**Beceri:** İskelet kasları ve merkezî sinir sisteminin uyum içinde çalışarak amaca yönelik hareket üretmesi; zor hareketleri kısa sürede öğrenme ve çabuk tepki verme yeteneği.", "Beceriye ait özellikler: **kinestetik ayrımlama**, **boyutsal yön belirleme (mekânsal oryantasyon)**, **denge**, **ritim**, **reaksiyon**. (Esneklik becerinin özelliklerinden değildir.)", "Beceri; dayanıklılık, kuvvet, sürat çalışmalarıyla **kombine alıştırmalarla** geliştirilir. Temel motorik özellikler + beceri kombinasyonuyla **patlayıcılık** gibi bileşik özellikler gelişir.", "Vücudun ağırlık merkezi genelde **göbek civarındadır**.", "Hız ve çabukluk **buluğ öncesi**, çabuk kuvvet ve dayanıklılık **buluğla birlikte**, maksimal kuvvet ve laktik dayanıklılık **buluğ sonrası** gelişir. Kızlar hızlı büyüme evresine erkeklerden **1-2 yıl önce** girer."]}], "questions": [{"q": "Performans/sporsal verim hangi kavramla doğrudan ilişkilidir?", "o": ["Kulübün bütçesi", "Sporcunun boyu", "Tesis kalitesi", "Sadece antrenör deneyimi", "Temel ve tamamlayıcı motorik özelliklerin düzeyi"], "a": 4, "e": "Motorik özelliklerin düzeyi yetenek ve performansı belirler."}, {"q": "Aşağıdakilerden hangisi temel motorik özelliklerden biri değildir?", "o": ["Kuvvet", "Esneklik", "Dayanıklılık", "Hepsi temeldir", "Sürat"], "a": 1, "e": "Esneklik ve beceri tamamlayıcı motorik özelliklerdir."}, {"q": "Uzun süre devam eden müsabaka ya da antrenmanda organizmanın yorgunluğa karşı koyabilme yeteneğine ne denir?", "o": ["Sürat", "Koordinasyon", "Dayanıklılık", "Kuvvet", "Esneklik"], "a": 2, "e": "Dayanıklılık, fiziki ve fizyolojik yorgunluğa dayanma gücüdür."}, {"q": "Aşağıdakilerden hangisi dayanıklılıkla ilgili değildir?", "o": ["Yorgunluğa karşı direnç", "Maksimal aerobik kapasite", "Çalışma anında kullanılabilen karbondioksit miktarı", "Kalp-dolaşım sistemi", "Çabuk toparlanma"], "a": 2, "e": "Dayanıklılık, kullanılabilen oksijen miktarıyla ilgilidir."}, {"q": "Aşağıdakilerden hangisi dayanıklılık çeşitlerinden biri değildir?", "o": ["Özel dayanıklılık", "Süregelen dayanıklılık", "Genel dayanıklılık", "Kısa süreli dayanıklılık", "Aerobik dayanıklılık"], "a": 1, "e": "Süreye göre kısa, orta ve uzun süreli dayanıklılık vardır."}, {"q": "Sevim'e göre orta süreli dayanıklılık hangi süre aralığındadır?", "o": ["90 dk üzeri", "10 sn'den kısa", "45 sn - 2 dk", "8 dk ve üzeri", "2-8 dakika"], "a": 4, "e": "Kısa süreli 45 sn-2 dk, uzun süreli 8 dk ve üzeridir."}, {"q": "Aşağıdakilerden hangisi VO₂maks'ı etkileyen faktörlerden biri değildir?", "o": ["Kalp debisi", "Sporcunun rakibiyle arasındaki mesafe", "Antrenman durumu", "Genetik", "Hemoglobin düzeyi"], "a": 1, "e": "VO₂maks fizyolojik ve kalıtsal faktörlere bağlıdır."}, {"q": "Aşağıdakilerden hangisi kuvvet yeteneği üzerinde etkili başlıca faktörlerden biri değildir?", "o": ["Motivasyonel faktör", "İntramüsküler koordinasyon", "Çevresel faktörler", "Morfolojik-fizyolojik faktör", "Koordinatif faktör"], "a": 2, "e": "Kitapta üç faktör sayılır: morfolojik-fizyolojik, koordinatif, motivasyonel."}, {"q": "Bir kastaki bireysel liflerin senkronize çalışmasına ne denir?", "o": ["İntermüsküler koordinasyon", "Hareketlilik rezervi", "Kinestetik ayrımlama", "Relatif kuvvet", "İntramüsküler koordinasyon"], "a": 4, "e": "Kaslar arası etkileşim intermüsküler koordinasyondur."}, {"q": "Sporcunun kendi vücut ağırlığına oranla geliştirebildiği en büyük kuvvete ne denir?", "o": ["Maksimal kuvvet", "Relatif (göreli) kuvvet", "Çabuk kuvvet", "Statik kuvvet", "Salt kuvvet"], "a": 1, "e": "Relatif kuvvet = Salt kuvvet / Vücut ağırlığı."}, {"q": "Kuvvet ve süratin ürünü olan, en kısa sürede en yüksek kuvveti sergileyebilme yeteneği hangisidir?", "o": ["Statik kuvvet", "Maksimal kuvvet", "Kuvvette devamlılık", "Relatif kuvvet", "Çabuk kuvvet"], "a": 4, "e": "Sıçrama ve atma gibi hareketlerde belirleyicidir."}, {"q": "Aşağıdakilerden hangisi sürati etkileyen faktörlerden biri değildir?", "o": ["Adım uzunluğu", "Esneklik", "Göz rengi", "Kas lifi tipi", "Yaş"], "a": 2, "e": "Sürat büyük ölçüde kalıtsaldır ama göz rengiyle ilgisi yoktur."}, {"q": "Ani bir uyarana karşı en kısa sürede verilen tepkiye ne ad verilir?", "o": ["Sprint sürati", "Reaksiyon sürati", "Maksimum sürat", "Ortalama sürat", "İvme"], "a": 1, "e": "Reaksiyon sürati motivasyon, uyarılmışlık ve yoğunlaşmadan etkilenir."}, {"q": "Reaksiyon süratinin oluş sürecinde aşağıdakilerden hangisi yer almaz?", "o": ["Uyarının MSS'ye gelip emrin oluşması", "Emrin kaslara iletilmesi", "Uyarının merkezî sinir sistemine gelmeden kaslara iletilmesi", "Kasta mekanik olayın oluşması", "Duyu organlarının uyarıyı algılaması"], "a": 2, "e": "Emir her zaman merkezî sinir sisteminde oluşur."}, {"q": "Aşağıdakilerden hangisi esnekliği sınırlayan iç faktörlerden değildir?", "o": ["Antrenmanın yapıldığı ortamın ısısı", "Kemik yapısı", "Eklem ve dokuların ısısı", "Eklemin yapısı", "Derinin elastikiyeti"], "a": 0, "e": "Ortamın ısısı dış faktördür."}, {"q": "Aşağıdakilerden hangisi esnekliği sınırlayan dış faktörlerden değildir?", "o": ["Günün saati", "Cinsiyet", "Giysi ve ekipman", "Eklem ve ekleme birleşen dokuların ısısı", "Yaş"], "a": 3, "e": "Dokuların ısısı iç faktördür."}, {"q": "Aşağıdakilerden hangisi beceriye ait özelliklerden değildir?", "o": ["Denge", "Mekânsal oryantasyon", "Esneklik", "Kinestetik ayrımlama", "Ritim"], "a": 2, "e": "Beceri özellikleri: kinestetik ayrımlama, yön belirleme, denge, ritim, reaksiyon."}, {"q": "Temel motorik özellikler ile beceri antrenmanlarının kombine yapılmasıyla geliştirilebilen özellik hangisidir?", "o": ["Kemik yapısı", "Göz rengi", "Kas lifi tipi", "Patlayıcılık", "Boy uzunluğu"], "a": 3, "e": "Patlayıcılık, kuvvet ve süratin beceriyle birleşimidir."}, {"q": "Performans/sporsal verim ile ilgili kavram aşağıdakilerden hangisidir?", "o": ["Sporcunun yapmış olduğu spor dalındaki kıdemi", "Sporcunun antrenörünün başarıları", "Temel ve tamamlayıcı motorik özelliklerin düzeyi", "Sporcunun ailesinin spor geçmişi", "Sporcunun genel kültür seviyesi"], "a": 2, "e": "Doğru cevap: Temel ve tamamlayıcı motorik özelliklerin düzeyi.", "kb": 1}, {"q": "Aşağıdakilerden hangisi temel motorik özelliklerden biri olan dayanıklılık ile ilgili değildir?", "o": ["Sporcunun fiziki ve fizyolojik yorgunluğa dayanma gücü", "Yüklenme sonrası organizmanın çok çabuk normale dönme yetisi", "Organizmanın aerobik enerji üretimi", "Çalışma anında kullanabildiği karbondioksit miktarı", "İşlevsel potansiyelleri ekonomik olarak kullanma becerisi"], "a": 3, "e": "Doğru cevap: Çalışma anında kullanabildiği karbondioksit miktarı.", "kb": 1}, {"q": "Aşağıdakilerden hangisi dayanıklılık çeşitlerinden biri değildir?", "o": ["Kısa süreli dayanıklılık", "Süregelen dayanıklılık", "Kuvvet dayanıklılığı", "Sürat dayanıklılığı", "Uzun süreli dayanıklılık"], "a": 1, "e": "Doğru cevap: Süregelen dayanıklılık.", "kb": 1}, {"q": "Aşağıdakilerden hangisi kuvvet yeteneği ve kalitesi üzerinde etkili olan başlıca faktörlerden biri değildir?", "o": ["Çevresel faktörler", "Morfolojik-Fizyolojik faktörler", "Koordinatif faktörler", "Motivasyonel faktör", "İntermüsküler ve intramüsküler koordinasyon"], "a": 0, "e": "Doğru cevap: Çevresel faktörler.", "kb": 1}, {"q": "Aşağıdakilerden hangisi sürati etkileyen faktörlerden biri değildir?", "o": ["Kas lifi tipi", "Yaş", "Boy", "Esneklik", "Göz rengi"], "a": 4, "e": "Doğru cevap: Göz rengi.", "kb": 1}, {"q": "Bir hareketin gerçekleşmesi için algılama ve tepki gösterme yeteneği olan reaksiyon süratinin oluş sürecinde aşağıdakilerden hangisi yer almaz?", "o": ["Duyu organlarının impulslarla algılaması", "Uyarının merkezî sinir sistemine gelmeden kaslara iletilmesi", "Uyarının merkezî sinir sistemine gelmesi ve emrin oluşması", "Oluşan emrin kaslara iletilmesi", "Emrin kaslara ulaşmasından sonra, kasta mekanik bir olayın oluşması"], "a": 1, "e": "Doğru cevap: Uyarının merkezî sinir sistemine gelmeden kaslara iletilmesi.", "kb": 1}, {"q": "Aşağıdakilerden hangisi esnekliğin sınırlarını etkileyen iç faktörlerden biri değildir?", "o": ["Eklemin yapısı, tipi ve formu", "Kas dokusunun, tendon ve ligamentlerin elastikiyeti", "Derinin elastikiyeti", "Antrenmanın yapıldığı ortamın ısısı", "Kasın gevşeme ve kasılma yeteneği"], "a": 3, "e": "Doğru cevap: Antrenmanın yapıldığı ortamın ısısı.", "kb": 1}, {"q": "Aşağıdakilerden hangisi esnekliğin sınırlarını etkileyen dış faktörlerden biri değildir?", "o": ["Günün saati", "Giysi ve kullanılan ekipmanın sınırlamaları", "Eklem ve ekleme birleşen dokuların ısısı", "Antrenmanın yapıldığı ortamın ısısı", "Çevresel faktörler"], "a": 2, "e": "Doğru cevap: Eklem ve ekleme birleşen dokuların ısısı.", "kb": 1}, {"q": "Aşağıdakilerden hangisibeceriye ait özelliklerden değildir?", "o": ["KinestetikAyrımlama", "Boyutsal Yön Belirleme", "Ritim", "Denge", "Esneklik"], "a": 4, "e": "Doğru cevap: Esneklik.", "kb": 1}, {"q": "Aşağıdakilerden hangisi temel motorik özellikler ve beceri antrenmanlarının kombine yapılması ile gelişim sağlanabilecek özelliklerden değildir?", "o": ["Dayanıklılık", "Kuvvet", "Patlayıcılık", "Esneklik", "Sürat"], "a": 2, "e": "Doğru cevap: Patlayıcılık.", "kb": 1}], "tf": [{"q": "Pasif hareket genişliği her zaman aktif hareket genişliğinden büyüktür.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Aradaki farka hareketlilik rezervi denir.", "tf": true}, {"q": "Esnekliğe direnci kas lifi oluşturur.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Esnekliğe direnci kas lifi değil, kasın membranı yapar.", "tf": true}, {"q": "Genellikle kadınlar erkeklerden daha esnektir.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Bunun nedeni hormonaldir (östrojen).", "tf": true}, {"q": "90 dakikanın üzerindeki dayanıklılık çalışmalarında temel enerji kaynağı yağdır.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "30 dk'ya kadar glikoz, 30-90 dk glikoz ve yağ ağırlıklıdır.", "tf": true}, {"q": "Statik kuvvet izotonik kasılma ile ortaya çıkar.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Statik kuvvet izometrik, dinamik kuvvet izotonik kasılmayla ortaya çıkar.", "tf": true}, {"q": "Esneklik genellikle sabah saatlerinde en yüksek düzeydedir.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Zirve değer öğleden sonra 14.30-16.00 arasındadır.", "tf": true}]}, {"id": "hab5", "title": "Koordinatif Özellikler", "cards": [{"title": "Koordinasyon nedir?", "points": ["Koordinatif yetenekler **doğuştan gelmez**, antrenmanla kazanılır.", "**Koordinasyon:** Kısa sürede **zor hareketleri öğrenebilme**, değişik durumlarda amaca uygun ve çabuk tepki verebilme, hareketlerin birbirini doğru izlemesi ve istenen kuvvetle yapılması.", "Koordinasyon, **merkezî sinir sistemi, iskelet ve kas sisteminin** kombine iş birliğidir. Örneğin hentbolda düşerek atış; sinir, kas ve iskelet sistemlerinin birlikte çalışmasıyla olur (kan sıvısının bu iş birliğinde rolü yoktur).", "Koordinatif yeteneklerin verimi **beceri**dir. İyi koordinasyon hareket verimini artırır, **daha az enerji** harcatır ve zihinsel gelişime katkı sağlar.", "Koordinatif yetiler: denge, ritim, reaksiyon, çeviklik, hareketlilik, yön bulma, kinestetik ayrımlama gibi motor yeteneklerdir. **Yabancı dil yeteneği koordinatif yeti değildir.**"]}, {"title": "Koordinasyonu oluşturan ve etkileyen faktörler", "points": ["**Oluşturan faktörler (Sevim):** motorik uyum ve yer değiştirme, sevk ve idare (kombinasyon), mekân kavrama, **denge**, çok yönlülük, beceriklilik, hareket hissi, hareket akıcılığı ve yumuşaklığı, **esneklik**, **ritim**, varyasyon. (\"Performans\" bu faktörlerden değildir.)", "**Etkileyen faktörler:** vücut ağırlığı (relatif kuvvet), boy, zaman ayarlama, hareket dakikliği (göz-kas, proprioseptif, kinestetik duyarlılık), denge, **reaksiyon zamanı**, hareket sürati, görerek nişanlama, **kassal tansiyon**, yaş, kondisyon yetersizliği, kötü teknik, sakatlıklar.", "**Basit reaksiyon:** yüzme/atletizmde start. **Kombine reaksiyon:** basketbolda aldatmadan sonra şut veya pas.", "Kaslardaki **gereksiz gerginlik** hareketi tutuk ve koordinasyonsuz yapar; çok az tansiyon zayıf ve kararsız yapar.", "Koordinasyon türleri: **genel dinamik** (koşma, sıçrama), **parçalara ayrılmış** (el-göz, ayak-göz) ve **ayrı ayrı** koordinasyon."]}, {"title": "Koordinasyon antrenmanı", "points": ["Koordinasyon alıştırmaları **kuvvet, çabukluk ve dayanıklılık** alıştırmalarıyla **kombine** uygulanmalıdır.", "Metodik sıra: **kaba (basit) hareketler → kombine hareketler → branşa özgü hareketler**.", "Yöntemler: hareketi çeşitlendirmek, **dış koşulları değiştirmek**, kombinasyonları birleştirmek, farklı taktikler, **zaman baskısı**, oyun kurallarını değiştirmek.", "Koordinasyon çalışmalarında **tam dinlenme** ilkesi uygulanır; yorgunken yapılmaz."]}, {"title": "Hareketlilik", "points": ["**Hareketlilik:** Hareketleri **eklemlerin izin verdiği oranda, geniş açıda ve değişik yönlere** uygulayabilme yeteneği. Esneklikle geliştirilir; esneklik bir motorik özellik değil, **kasın özelliğidir**.", "Gelişim: **3-7 yaş çok iyi**, 7-10 çok iyi, 10-13 iyi, **12-15 kötü**, 15-19 iyi. Hareketlilik çalışmaları **günlüktür** ve yaşam boyu sürer.", "Etkileyen faktörler: eklem yapısı, kas ve derinin gerilme yeteneği, **kasların ısınma derecesi**, yorgunluk, günün saati ve dış ısı, yaş ve cinsiyet.", "**Genel hareketlilik:** omurga, kalça ve omuz eklem sistemleri. **Özel hareketlilik:** branşta kullanılan eklem (engelli koşuda kalça, cimnastikte omurga).", "**Aktif hareketlilik:** Dış kuvvet olmadan, **kendi kas faaliyetiyle** ulaşılan en büyük hareket açısı. **Pasif hareketlilik:** dış kuvvetle.", "**Statik hareketlilik:** pozisyon belli süre korunur (frontal split). **Dinamik hareketlilik:** ritim ve hız fazla (frontal jump)."]}, {"title": "Hareketlilik çalışmalarının ilkeleri", "points": ["Hareketlilik çalışmaları **günlüktür** ve **yorgunken yapılmaz**; kuvvet ve sürat antrenmanlarından ve her müsabakadan **önce** yapılır.", "Önce **genel ısınma**; yoğunluk kademeli artar. Vücut ısısını artırmalı, biraz terletmeli ama **yorgunluk yapmamalı**.", "Müsabakadan **30-35 dk önce** başlanır, 10-15 dk kala tempo düşer, **5 dk kala** bitirilir. Yarışmada **1/3 genel, 2/3 özel** hareketlilik.", "Hareketlilik süresi antrenman veya müsabakanın **%20-30**'u kadardır. **45 dk** dinlenmeden sonra ısınmanın etkisi kaybolur.", "Hafif ağrı hissedilinceye kadar sürdürülür; seriler **10-15 tekrar**. **Dört yöne** çalışılır.", "**Önce pasif germe, sonra aktif** alıştırmalar ağırlık kazanır. (\"Aktiften sonra pasif\" yanlış sıradır.)", "**PNF germe (proprioseptif nöromüsküler fasilitasyon):** **Proprioseptörlerin uyarılmasıyla** sinir-kas mekanizmasının desteklendiği, genellikle eşli yapılan **germe-kasma-gevşeme** yöntemi."]}, {"title": "Çeviklik", "points": ["**Çeviklik:** Yavaşlama, hızlanma ve **yön değiştirme** hareketlerini en kısa sürede verimli uygulama; **iki nokta arasında vücudu hareket ettirme ve yön değiştirme** becerilerini kolay, hızlı, akıcı ve kontrollü yapabilme.", "Çeviklikte olmazsa olmaz üç unsur: **koordinasyon, denge, patlayıcılık**. Örnek: slalom çubukları arasında dripling yapan futbolcu.", "Etkileyen faktörler: vücut ağırlığı (artış olumsuz), **boy** (uzun ve orantısız boy olumsuz), denge, **reaksiyon zamanı**, hareket mesafesi (kısa tutulmalı, **anaerobik**), yön, kas tonusu, yaş, **yorgunluk**, duyu organları, kondisyon, teknik, sporsal zekâ.", "**Sheppard ve Young** çeviklik antrenman türleri: **yön değiştirme tekniği**, **kapalı beceri** alıştırmaları, **çabukluk** alıştırmaları (merdiven, çubuk, huni), **reaktif çeviklik** (ayna-gölge, yakalama-kaçma oyunları). (Denge aleti üzerinde yürüme bu sınıflamada yoktur.)", "Drillerde süre genelde **10-15 saniye**, **3 set**, setler arası **1 dk** dinlenme.", "Yön değiştirmeler sakatlığın önemli nedenidir; çeviklik geliştirildiğinde **sakatlık riski azalır**."]}, {"title": "Denge", "points": ["**Denge:** Günlük yaşamda yürüme, koşma, durma gibi yalın hareketlerde gereken, merkezî sinir sistemi ile kas-iskelet sisteminin uyumlu etkileşimi.", "Denge becerisi **10 yaş civarında** erişkin düzeyine ulaşır; genç erişkinlikte optimumdur, yaşlanmayla bozulur.", "**Statik denge:** Sabit pozisyonda dengede kalma. Örnek: tek ayak üzerinde, diğer ayak geriye gergin, öne eğilip kolları yana açma (**uçak duruşu**). Etkenler: vücut ağırlığı, bağ gerginliği, kas kasılması.", "**Dinamik denge:** **Hareket sırasında** ağırlık merkezini yeni konumlara uyarlayabilme.", "**Objeyle denge:** Top, çubuk gibi ekipmanla sağlanan denge (çekiç atma, buz hokeyi). **Motorsal denge:** farklı ortamlarda (su, buz, kara) denge becerisi.", "Dengenin korunmasında **somatosensoriyel (%70)**, vestibüler ve **görsel (%10)** sistemler rol oynar; **yüksek ses (gürültü)** dengeyi bozabilir. **Kor stabilitesi** ve **bosu topu**, denge tahtası çalışmaları dengeyi geliştirir."]}], "questions": [{"q": "Sporda zor hareketleri kısa sürede öğrenip en az eforla uygulayabilmek için geliştirilmesi gereken özellik hangisidir?", "o": ["Koordinasyon", "Dayanıklılık", "Esneklik", "Hareketlilik", "Maksimal kuvvet"], "a": 0, "e": "Koordinasyon MSS, iskelet ve kas sisteminin kombine iş birliğidir."}, {"q": "Hentbolda düşerek atış hareketinde aşağıdakilerden hangisinin diğerleriyle iş birliği içinde çalışması söz konusu değildir?", "o": ["İskelet sistemi", "Merkezî sinir sistemi", "Duyu organları", "Kan sıvısı", "Kas sistemi"], "a": 3, "e": "Koordinasyon sinir, kas ve iskelet sistemlerinin iş birliğidir."}, {"q": "Aşağıdakilerden hangisi koordinasyonu oluşturan faktörlerden değildir?", "o": ["Esneklik", "Denge", "Varyasyon yeteneği", "Ritim", "Performans"], "a": 4, "e": "Performans, koordinasyonun sonucudur; oluşturan faktörü değildir."}, {"q": "Aşağıdakilerden hangisi koordinatif yetiler arasında yer almaz?", "o": ["Ritim", "Denge", "Yabancı dil yeteneği", "Reaksiyon", "Yön bulma"], "a": 2, "e": "Koordinatif yetiler motor yeteneklerdir."}, {"q": "Koordinasyon antrenmanında doğru metodik sıra hangisidir?", "o": ["Sadece branşa özgü hareketler", "Kombine → basit → branşa özgü", "Branşa özgü → basit → kombine", "Branşa özgü → kombine → basit", "Basit hareketler → kombine hareketler → branşa özgü hareketler"], "a": 4, "e": "Kolaydan zora ilerlenir."}, {"q": "Sporcunun hareketlerini eklemlerin izin verdiği oranda, geniş açıda ve değişik yönlere uygulayabilme yeteneğine ne denir?", "o": ["Denge", "Hareketlilik", "Çeviklik", "Ritim", "Koordinasyon"], "a": 1, "e": "Hareketlilik esneklikle geliştirilir."}, {"q": "Sporcunun dış kuvvet olmadan kendi kas faaliyetiyle eklemin en büyük açısına ulaşmasına ne denir?", "o": ["Dinamik denge", "Aktif hareketlilik", "Statik hareketlilik", "Pasif hareketlilik", "Genel hareketlilik"], "a": 1, "e": "Pasif hareketlilikte dış kuvvet kullanılır."}, {"q": "Hareketliliğin en kötü olduğu yaş aralığı hangisidir?", "o": ["15-19", "3-7", "12-15", "7-10", "10-13"], "a": 2, "e": "3-7 ve 7-10 yaşları çok iyi dönemdir."}, {"q": "Aşağıdakilerden hangisi hareketlilik çalışmalarının temel ilkelerinden değildir?", "o": ["Aktif germe alıştırmalarından sonra pasif alıştırmalar yapmak", "Çalışmaların günlük olması", "Dört yöne de çalışılması", "Genel ısınmayla başlanması", "Yorgunken yapılmaması"], "a": 0, "e": "Önce pasif germe, sonra aktif alıştırmalar ağırlık kazanmalıdır."}, {"q": "Proprioseptörlerin uyarılmasıyla sinir-kas mekanizmasının desteklendiği esneklik yöntemi hangisidir?", "o": ["PNF germe", "Statik germe", "Fartlek", "Dinamik germe", "Balistik germe"], "a": 0, "e": "PNF: proprioseptif nöromüsküler fasilitasyon."}, {"q": "Slalom çubukları arasında dripling yapan futbolcunun bir noktadan diğerine yön değiştirerek ilerlemesi hangi özelliğe örnektir?", "o": ["Çeviklik", "Maksimal kuvvet", "Aerobik dayanıklılık", "Hareketlilik", "Statik denge"], "a": 0, "e": "Çeviklik hızlı ve doğru yön değiştirme özelliğidir."}, {"q": "Çeviklikte olmazsa olmaz üç unsur hangisidir?", "o": ["Dayanıklılık, esneklik, boy", "VO₂maks, laktat, nabız", "Koordinasyon, denge, patlayıcılık", "Ritim, müzik, tempo", "Kuvvet, kilo, yaş"], "a": 2, "e": "Engin (2018) bu üç unsuru vurgular."}, {"q": "Aşağıdakilerden hangisi Sheppard ve Young'ın çeviklik antrenman türleri arasında yer almaz?", "o": ["Yön değiştirme tekniği alıştırmaları", "Çabukluk alıştırmaları", "Reaktif çeviklik antrenmanı", "Denge aleti üzerinde yürüme alıştırmaları", "Kapalı beceri alıştırmaları"], "a": 3, "e": "Ayna-gölge ve yakalama-kaçma oyunları reaktif çevikliktir."}, {"q": "Çeviklik testlerinde mesafe neden kısa tutulmalıdır?", "o": ["Enerji sistemi anaerobik kalmalıdır", "Saha küçük olduğu için", "Sporcu sıkılmasın diye", "Kuralı öyle olduğu için", "Aerobik kapasite ölçülmek istendiği için"], "a": 0, "e": "Sporcu aerobik sisteme geçerse çeviklik testi olmaz."}, {"q": "Tek ayak üzerinde, diğer ayak geriye uzatılmış, öne eğilip kolları yana açarak durmak hangi denge türüdür?", "o": ["Reaktif denge", "Dinamik denge", "Statik denge", "Motorsal denge", "Objeyle denge"], "a": 2, "e": "Statik denge sabit pozisyonda dengede kalabilmedir."}, {"q": "Günlük yaşamda yürüme, koşma, durma gibi yalın hareketleri yaparken gereken kavram hangisidir?", "o": ["Hareketlilik", "Maksimal kuvvet", "Anaerobik güç", "Çeviklik", "Denge"], "a": 4, "e": "Denge her hareketin temelinde vardır."}, {"q": "Çekiç atma ve buz hokeyi hangi denge türüne örnektir?", "o": ["Objeyle denge", "Dinamik esneklik", "Pasif denge", "Motorsal denge", "Statik denge"], "a": 0, "e": "Ek bir ekipmanla sağlanan dengedir."}, {"q": "Aşağıdakilerden hangisinin diğerleriyle iş birliği içerisinde çalışması, hentbolda düşerek atış hareketini gerçekleştiren bir sporcunun vücudunda hareketin sonucunu etkilemez?", "o": ["İskelet kasları", "Merkezî sinir sistemi", "Eklemler", "Kan sıvısı", "Eklem bağları"], "a": 3, "e": "Doğru cevap: Kan sıvısı.", "kb": 1}, {"q": "Sporda zor hareketleri kısa zaman içerisinde öğrenebilmek ve en az efor ile uygulayabilmek için geliştirilmesi gereken özellik aşağıdakilerden hangisidir?", "o": ["Dayanıklılık", "Sürat", "Kuvvet", "Hareketlilik", "Koordinasyon"], "a": 4, "e": "Doğru cevap: Koordinasyon.", "kb": 1}, {"q": "Aşağıdakilerden hangisi koordinasyonu oluşturan faktörlerden biri değildir?", "o": ["Performans", "Hareketin akıcılığı", "Sevk ve idare yeteneği", "Ritim", "Hareket hissi"], "a": 0, "e": "Doğru cevap: Performans.", "kb": 1}, {"q": "Aşağıdaki koordinatif özelliklerden hangisi, sporcunun hareketlerini eklemlerin müsaade ettiği oranda, geniş bir açıda ve değişik yönlere uygulayabilme yeteneği olarak tanımlanır?", "o": ["Koordinasyon", "Hareketlilik", "Çeviklik", "Denge", "Beceri"], "a": 1, "e": "Doğru cevap: Hareketlilik.", "kb": 1}, {"q": "Sporcunun, dış kuvvet olmadan kendi başına kas faaliyeti ile yapabildiği ve eklemin mümkün olan en büyük hareket açısına ulaşabildiği hareketlilik çalışması aşağıdakilerden hangisidir?", "o": ["Genel hareketlilik", "Dinamik hareketlilik", "Statik hareketlilik", "Pasif hareketlilik", "Aktif hareketlilik"], "a": 4, "e": "Doğru cevap: Aktif hareketlilik.", "kb": 1}, {"q": "Aşağıdakilerden hangisi hareketlilik çalışmalarının temel ilkelerinden biri değildir?", "o": ["Aktif germe alıştırmalarından sonra pasif alıştırmalar yapmak", "Hareketlilik çalışmalarını günlük yapmak", "Hareketlilik çalışmalarına müsabakadan 30-35 dk önce başlamak", "Hareketlilik çalışmalarını yorgunken yapmamak", "Hareketlilik çalışmalarında tek yönlü çalışma yapmamak"], "a": 0, "e": "Doğru cevap: Aktif germe alıştırmalarından sonra pasif alıştırmalar yapmak.", "kb": 1}, {"q": "Aşağıdakilerden hangisi Sheppard ve Young’ın geliştirdiği çeviklik antrenman türleri arasında yer almaz?", "o": ["Hızlanma, yavaşlama ve yön değiştirme alıştırmaları", "Geriye ve yanlara koşu ve kayma alıştırmaları.", "Denge aleti üzerinde yürüme alıştırmaları", "Yön değiştirmeli sürat alıştırmaları", "Ayna ve gölge alıştırmaları"], "a": 2, "e": "Doğru cevap: Denge aleti üzerinde yürüme alıştırmaları.", "kb": 1}, {"q": "Aşağıdakilerden hangisi, art arda dizilmiş slalom çubukları arasından dripling yapan bir futbolcunun, bir noktadan diğer noktaya doğru hareket ederken bedenin yönünü olabildiğince hızlı, akıcı, kolay ve kontrollü biçimde değiştirmesini sağlayan özelliktir?", "o": ["Koordinasyon", "Çeviklik", "Beceri", "Denge", "Hareketlilik"], "a": 1, "e": "Doğru cevap: Çeviklik.", "kb": 1}, {"q": "Sporcunun tek ayak üzerinde iken diğer ayak gergin olarak geriye uzatılmış vaziyette öne doğru eğilerek kollarını her iki yana açtığı denge pozisyonu, aşağıdaki denge türlerinden hangisine bir örnektir?", "o": ["Motorsal denge", "Dinamik denge", "Statik denge", "Objeyle denge", "Aktif denge"], "a": 2, "e": "Doğru cevap: Statik denge.", "kb": 1}, {"q": "Aşağıdaki kavramlardan hangisi, insanın günlük yaşantısında yürüme, koşma, durma benzeri yalın hareketleri yaparken gereksinim duyduğu ve yaşam kalitesini de etkileyen durumu tanımlar?", "o": ["Koordinasyon", "Hareketlilik", "Çeviklik", "Denge", "Beceri"], "a": 3, "e": "Doğru cevap: Denge.", "kb": 1}], "tf": [{"q": "Koordinatif yetenekler doğuştan kazanılır, antrenmanla geliştirilemez.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Koordinatif yetenekler antrenmanlarla kazanılır.", "tf": true}, {"q": "Esneklik, motorik bir özellik değil kasın bir özelliğidir.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Hareketlilik yeteneği esneklikle geliştirilir.", "tf": true}, {"q": "Hareketlilik çalışmalarına müsabakadan 30-35 dakika önce başlanmalıdır.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "5 dakika kala bitirilmelidir.", "tf": true}, {"q": "Koordinasyon çalışmalarında eksik dinlenme ilkesi uygulanır.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Koordinasyon çalışmalarında tam dinlenme uygulanır.", "tf": true}, {"q": "Denge becerisi 10 yaş civarında erişkin düzeyine ulaşır.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Genç erişkinlikte optimumdur, yaşlanmayla bozulur.", "tf": true}, {"q": "Yüksek ses seviyesi denge performansını olumsuz etkileyebilir.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Gürültü vestibüler sistemi etkiler; gözler kapalıyken etkisi daha fazladır.", "tf": true}]}, {"id": "hab6", "title": "Antrenman Planlama ve Periyotlama", "cards": [{"title": "Planlama nasıl kurulur?", "points": ["Önce sporcunun **kısa, orta ve uzun vadeli hedefleri** belirlenir; sonra sırasıyla **yıllık → aylık (makro) → haftalık (mikro) → birim** antrenman planları hazırlanır.", "**Makro planlar 2-6 hafta**, **mikro planlar 3-7 gün** (haftalık) çalışmaları kapsar.", "Ön koşullar: sporcunun yaşı, cinsiyeti, spor yaşı, mevcut performansı; antrenörün ve kulübün imkânları. Planlar **esnek** olmalı, değerlendirmelere göre güncellenmelidir.", "**Antrenman planlaması**, kısa zaman dilimlerinde **set sayısı, tekrar, yüklenme, dinlenme** gibi temel antrenman değişkenlerinin yönetilmesidir. **Periyotlama (dönemleme)** ise yıllık planın evrelere bölünmesidir; \"antrenman planlaması\" terimi sıklıkla hatalı olarak periyotlama yerine kullanılır."]}, {"title": "Birim antrenman ve giriş bölümü", "points": ["**Birim (günlük) antrenman, antrenman planlamasının en küçük parçasıdır.**", "Bölümler: **(giriş) → ısınma → ana bölüm → soğuma (bitiriş)**. Bazı kaynaklar 3 bölüm, bazıları girişle birlikte 4 bölüm sayar.", "**Giriş bölümü:** Toplanma, yoklama, antrenmanın **amacı, şiddeti ve yoğunluğunun** anlatılması, motivasyon. Yeni başlayanlarda **5-10 dk**, tecrübelilerde daha kısa veya hiç.", "Ortalama birim antrenman süresi **~2 saat (120 dk)**. Süreye göre: **kısa 30-90 dk**, **orta 2-3 saat**, **uzun 3 saat üzeri**.", "Örnek dağılım (120 dk): ana bölüm ~65-80 dk, soğuma ~10-20 dk."]}, {"title": "Isınma", "points": ["**İdeal ısınma süresi 25-30 dakika** (Bompa: ~30 dk; tecrübelilerde 45 dk'ya kadar). Günay: sürenin **1/3'ü genel, 2/3'ü özel ısınma**.", "**Isınmanın en önemli özelliği vücut ısısını ~1 °C artırmaktır.** Yeterli ısınmanın en iyi göstergesi **terlemedir**.", "**Aktif ısınma:** **genel** (koşu, bisiklet, cimnastik) ve **özel** (branşa özgü hareketler). **Pasif ısınma:** sauna, sıcak duş, ısıtma torbası, diatermi.", "Genel ısınma **VO₂maks'ın %40-60**'ı şiddette **5-10 dk**; vücut ısısı 3-5 dk sonra artmaya başlar, **10-20 dk** arasında zirve yapar.", "Müsabaka öncesi: **30-35 dk önce başla**, 10-15 dk kala tempoyu düşür, **5 dk kala bitir**.", "Fizyolojik etkiler: kas ve vücut ısısı artar, **sinir iletim hızı ve metabolik tepkime hızı artar**, hemoglobin-miyoglobinden **oksijen ayrılması kolaylaşır**, kılcal damarlar genişler, kasılma hızı ve kuvveti artar, **sakatlık riski azalır**.", "Isınmada **dinamik germe** tercih edilir; **statik germe soğuma bölümünde** yapılır. Germeye soğuk vücutla başlanmaz."]}, {"title": "Ana bölüm ve soğuma", "points": ["**Ana bölüm:** Teknik, taktik ve motorik özelliklerin geliştirildiği asıl kısım.", "Yeni başlayanlarda sıra (Bompa): **1. teknik/taktik → 2. sürat ve çeviklik → 3. kuvvet → 4. dayanıklılık**. Yorgunluk teknik öğrenimi bozar; dayanıklılık **en sona** konur.", "Sürat ve çeviklik çalışmaları sporcu **dinlenikken**, ısınmanın hemen ardından yapılır.", "**Soğuma (~20 dk):** İlk ~10 dk **aktif jog** (maksimal kalp atımının **%40-50**'si), ikinci ~10 dk **statik germe**. Amaç laktik asit ve atıkların uzaklaştırılması, vücudun dinlenik duruma dönmesi.", "Soğumada yapılabilecekler: **aktif soğuma, pasif soğuma, jog, statik germe** (hepsi)."]}, {"title": "Mikro döngü (haftalık plan)", "points": ["**Mikro plan:** Haftalık birim antrenman sayısı; haftada **3-6** birim.", "Benzer içerikli birimler biyomotor gelişim için art arda **en az 2-3 kez** tekrarlanmalı.", "Dayanıklılığı **geliştirmek**: submaksimal şiddette haftada **en az 3** antrenman; yarışmada **korumak**: haftada **2** maksimal. Kuvvet, hareketlilik, sürat korumak: haftada **1-2**; pliometrik, sürat, çeviklik: haftada **2-3**.", "**Yeni başlayanlarda haftada 3-4 birim** antrenman.", "Mikro döngü **düşük-orta şiddetle başlar**, sonra sert yüklenmeler gelir. Önemli yarışmadan önce tek doruk, yarışmadan **3-5 gün önce**.", "Türler: **tek zirveli, iki zirveli, iki zirveli aşırı yüklemeli, üç zirveli** mikro döngü."]}, {"title": "Makro döngü ve yıllık plan", "points": ["**Makro döngü:** 2-7 hafta (bazı kaynaklara göre 2-5 hafta); **2-5 veya 2-7 mikro döngüden** oluşur. **Hazırlık döneminde makro döngü 4-7 hafta** sürer.", "Takım sporlarında sezon öncesi hazırlık dönemi yaklaşık **6-8 hafta** sürer.", "**Yıllık plan** dönemleme ilkesine dayanır; **hazırlık, müsabaka ve geçiş dönemi** olarak 3 bölümdür. Hazırlık ve müsabaka dönemleri **genel ve özel** alt bölümlere ayrılır.", "**Geçiş dönemi yıllık planın içindedir**; genellikle son aylardadır. Amaç psikolojik, fizyolojik ve sinir sisteminin toparlanması ve yeni yıla hazırlıktır.", "**Matveyev** tek yarışma dönemli (**tek uçlu**) yapı önermiştir; günümüzde **çift uçlu, üç uçlu, çok uçlu** planlar da kullanılır. Bireysel sporcular yılda **en fazla 2 kez** zirveye çıkabilir.", "**Uzun vadeli plan:** elit sporcuda **olimpik döngü (4 veya 8 yıl)**; **yıldız ve genç sporcularda 8-16 yıl**."]}], "questions": [{"q": "Aşağıdakilerden hangisi en küçük antrenman planını ifade eder?", "o": ["Makro plan", "Birim antrenman planı", "Mikro plan", "Yıllık plan", "Olimpik döngü"], "a": 1, "e": "Birim (günlük) antrenman planlamanın en küçük parçasıdır."}, {"q": "Birim antrenman aşamaları birlikte ve doğru olarak hangi seçenekte verilmiştir?", "o": ["Hazırlık, müsabaka, geçiş", "Giriş, test, ana bölüm, değerlendirme", "Giriş, ısınma, ana bölüm ve soğuma", "Isınma, yüklenme, toparlanma, test", "Isınma, makro, mikro, soğuma"], "a": 2, "e": "Bazı kaynak Doğru", "Yanlış"], "a": 1, "e": "Düşük veya orta şiddetli birimlerle başlamalıdır.", "tf": true}]}, {"id": "hab7", "title": "Ölçme ve Değerlendirme (Yetenek Taraması)", "cards": [{"title": "Çocuklarda fiziksel aktivite ve ölçme", "points": ["Küçük yaşta fiziksel aktivite alışkanlığı **yaşam boyu sporun ilk aşamasıdır**; geniş katılım, yetenekli çocuk bulma şansını artırır.", "Ölçme-değerlendirme bilgisi antrenöre **objektif ve adaletli** seçim imkânı verir. Sistemde test ve ölçümlerle genelde **kondisyonerler**, teknik-taktikle **antrenörler** ilgilenir.", "**Fiziksel uygunluk:** Kişinin çalışma kapasitesi; kuvvet, dayanıklılık, çabukluk ve bunların birlikte çalışmasına bağlıdır. Fiziksel uygunluk testlerinin gelişiminde **AAHPERD (1961)** öncüdür.", "**Eurofit:** Avrupa Konseyi Spor Bakanlar Komitesi'nin **11 Mayıs 1987**'de kabul ettiği, çocuk ve gençlere yönelik **fiziksel uygunluk test bataryası**.", "**Şınav (push-up) testi:** Üst vücut kas kuvveti ve dayanıklılığını ölçer; 10 yaş ve üzerine uygulanır; vücut düz pozisyondayken **dirsekler 90 dereceye** kadar bükülüp başlangıca dönülür."]}, {"title": "Olimpiyatlar için yetenek seçimi projesi (2005)", "points": ["**Gençlik Spor Genel Müdürlüğü (GSGM)** \"Olimpiyatlar İçin Sporda Yetenek Seçimi ve Spora Yönlendirme Projesi\"ni il müdürlüklerine göndermiştir. 4 aşamalıdır:", "**I. aşama:** İlköğretim okullarında **spora yatkınlık ölçümleri** (beden eğitimi öğretmenleri yapar).", "**II. aşama:** Seçilen çocukların **daha kapsamlı test bataryası** ile ölçümü (**BESYO** uzmanları).", "**III. aşama:** **8 haftalık temel spor eğitim** programı.", "**IV. aşama:** Spor dallarına yönlendirme testleri ve uygun spor gruplarına yönlendirme."]}, {"title": "Türkiye Sportif Yetenek Taraması (2018)", "points": ["Cumhuriyet tarihinin en büyük yetenek seçimi projesi: **Gençlik ve Spor Bakanlığı - Milli Eğitim Bakanlığı** iş birliği.", "Protokol **19 Nisan 2016**'da imzalandı; uygulama **Mayıs 2018**'de başladı; **Spor Eğitimi Dairesi Başkanlığı** yürütür. **16 Nisan 2019**'da yeni iş birliği protokolü imzalandı.", "**81 il, 957 ilçe, 9527 okulda, ilkokul 3. sınıftaki 423.557 öğrenci** tarandı; 2943 görevli çalıştı.", "İlk sportif yatkınlık testinde **ortalama %10'luk dilime giren 46.884 öğrenci** temel hareket ve sportif beceri eğitimine davet edildi.", "Program **8-10 yaş** çocuklar içindir; öğreticiler **en az 2. kademe antrenör** belgeli olmalıdır."]}, {"title": "Eğitim modülleri", "points": ["**Modül 1:** **Temel Hareket Becerileri Eğitimi ve Gelişimi** (temel düzey).", "**Modül 2:** **Spora Özgü Temel Eğitim ve Hareket Becerileri Gelişimi** (orta düzey).", "**Modül 3:** **Çoklu Branş (Çoklu Beceri) Gelişimini İçeren Spor Eğitimi** (ileri düzey).", "Toplam **12 aylık** süreç (kitapta bir yerde 2,5 + 5 + 5 ay, başka yerde 2 + 4 + 6 ay olarak verilir).", "Amaç: temel ve spora özgü motor beceriler, **fiziksel okuryazarlık**, olimpik değerleri benimseyen bireyler."]}, {"title": "İlk aşama: antropometrik ve motorik testler", "points": ["**Antropometrik ölçümler:** **boy uzunluğu, vücut ağırlığı, kulaç uzunluğu, bacak uzunluğu, oturma yüksekliği**. (**Esneklik antropometrik ölçüm değildir**, motorik testtir.)", "**Motorik testler:** **dikey sıçrama, esneklik (otur-uzan), geriye sağlık topu atma, pençe (el kavrama) kuvveti, çeviklik, 20 m sürat**.", "**Kulaç uzunluğu:** Kollar yere paralel yana açık, avuçlar karşıya; **iki elin orta parmakları arası** ölçülür.", "**Boy:** Ayakkabısız; topuk, kalça, sırt ve başın arkası aynı dikey doğrultuda, gözler karşıya. **Oturma yüksekliği:** dizler 90°.", "4-5 yaşta yıllık boy artışı ~**6 cm**, kilo artışı ~**2 kg**; cinsiyet farkı yoktur."]}, {"title": "Motorik testlerin uygulanışı", "points": ["**Esneklik (uzan-eriş):** Ayakkabısız, **dizler gergin**, nefes vererek öne uzanılır; 5-10 sn dinlenip ikinci deneme yapılır.", "**Dikey sıçrama:** Ayaklar omuz genişliğinde, hızla çömelip **kolları kullanarak** sıçranır; sıçranan noktaya inilir. **Bacak kaslarının gücünü ölçmenin en basit ve en popüler yolu** dikey sıçramadır.", "**El kavrama:** Kol gergin aşağıda, **el dinamometresi** ile sağ ve sol el ölçülür; tutamak parmakların **ikinci boğumuna** ayarlanır.", "**Geriye sağlık topu atma:** Sırt atış yönüne dönük, iki elle önden geriye atılır; atış alanı **30°**.", "**20 m sürat:** Öğrenci **fotoselin 1 m gerisinde** çıkış çizgisinde durur.", "**Çeviklik testi:** Orta çizginin 50 cm gerisinden yan duruşla başlanır; hedeflere elle dokunarak yön değiştirilir."]}, {"title": "İkinci aşama: ileri düzey testler", "points": ["İkinci aşamadaki testler: **koordinasyon testi (sn), mekik koşusu (adet), denge (mm), görsel reaksiyon (sn)**.", "**Koordinasyon parkuru:** öne takla, 3 m denge tahtası, engel üzerinden top atma, tek ayak sekme, elle ve ayakla top yer değiştirme, duvara top atma, alttan-üstten engel, slalom. Süre **fotoselle** alınır; el kronometresi kabul edilmez.", "**20 m mekik koşusu:** Birinci derecede **dayanıklılık** (aerobik kapasite) hakkında bilgi verir. **7 km/sa** ile başlar, her seviyede **0,5 km/sa** artar.", "Mekik testinde **bir hata** affedilir; **üst üste 2 kez** sinyal kaçırılırsa test sonlandırılır.", "**Denge testi:** Postüral salınımı ölçer; toplam **70 sn** (çift ayak, sol ayak, sağ ayak).", "**Görsel reaksiyon testi:** Öğrencinin **görsel bir uyarıya verdiği tepki süresini ve bu tepkiyi devam ettirebilme** düzeyini ölçer; 8 lambadan **kırmızıyı** yakalama, toplam **24 tekrar**."]}], "questions": [{"q": "Türkiye'de Cumhuriyet tarihinin en büyük yetenek seçimi projesi hangi bakanlıkların koordinasyonunda yürütülmektedir?", "o": ["Kültür ve Turizm Bakanlığı - Gençlik ve Spor Bakanlığı", "Sağlık Bakanlığı - Gençlik ve Spor Bakanlığı", "Milli Eğitim Bakanlığı - Gençlik ve Spor Bakanlığı", "İçişleri Bakanlığı - Milli Eğitim Bakanlığı", "Aile Bakanlığı - Sağlık Bakanlığı"], "a": 2, "e": "Proje Spor Eğitimi Dairesi Başkanlığınca yürütülür."}, {"q": "Büyük yetenek seçimi projesinde ilk sportif yatkınlık testinde ortalama yüzde kaçlık dilime girenler eğitime davet edilmiştir?", "o": ["%10", "%50", "%5", "%1", "%25"], "a": 0, "e": "423.557 öğrenciden 46.884'ü davet edilmiştir."}, {"q": "Yetenek taraması projesi hangi sınıftaki öğrencilere uygulanmıştır?", "o": ["Ortaokul 7. sınıf", "Anaokulu", "Lise 1. sınıf", "İlkokul 3. sınıf", "İlkokul 1. sınıf"], "a": 3, "e": "81 il, 957 ilçe ve 9527 okulda uygulanmıştır."}, {"q": "Projedeki eğitim modüllerinin doğru sırası hangisidir?", "o": ["Elit performans → spora özgü → temel hareket", "Spora özgü → çoklu branş → temel hareket", "Temel hareket becerileri → spora özgü temel eğitim → çoklu branş eğitimi", "Çoklu branş → temel hareket → spora özgü", "Temel hareket → çoklu branş → elit performans"], "a": 2, "e": "Modüller temel, orta ve ileri düzeydir."}, {"q": "Antropometrik ölçümde kulaç uzunluğu hangi parmaklar arasında ölçülür?", "o": ["Başparmak", "Serçe parmak", "Orta parmak", "İşaret parmağı", "Yüzük parmağı"], "a": 2, "e": "Kollar yere paralel açılır, iki elin orta parmakları arası ölçülür."}, {"q": "Aşağıdakilerden hangisi antropometrik ölçümler içinde yer almaz?", "o": ["Oturma yüksekliği", "Kulaç uzunluğu", "Esneklik", "Vücut ağırlığı", "Boy uzunluğu"], "a": 2, "e": "Esneklik motorik bir testtir."}, {"q": "20 metre sürat koşusunda öğrenci fotoselin kaç metre gerisinde konumlanır?", "o": ["5 metre", "1 metre", "0,5 metre", "3 metre", "10 metre"], "a": 1, "e": "Başlangıç fotoseline temas engellenir."}, {"q": "20 metre mekik koşu testi birinci derecede hangi özellik hakkında bilgi verir?", "o": ["Dayanıklılık", "Denge", "Maksimal kuvvet", "Esneklik", "Sürat"], "a": 0, "e": "Mekik koşusu aerobik kapasiteyi ölçer."}, {"q": "20 metre mekik testinde test hangi durumda sonlandırılır?", "o": ["3 hata yapıldığında", "10 dakika dolduğunda", "Nabız 150'yi geçtiğinde", "İlk hatada", "Üst üste 2 kez sinyal kaçırıldığında"], "a": 4, "e": "Tek hata affedilir; sinyal yakalanırsa hata sıfırlanır."}, {"q": "Aşağıdaki testlerden hangisi ikinci aşamada uygulanır?", "o": ["Koordinasyon testi", "Boy ölçümü", "Kulaç uzunluğu", "Dikey sıçrama", "Vücut ağırlığı"], "a": 0, "e": "İkinci aşama: koordinasyon, mekik koşusu, denge, görsel reaksiyon."}, {"q": "Görsel reaksiyon testinin amacı nedir?", "o": ["Görsel uyarıya verilen tepki süresini ve bu tepkiyi devam ettirebilme düzeyini ölçmek", "El kavrama kuvvetini ölçmek", "Görme keskinliğini ölçmek", "Aerobik kapasiteyi ölçmek", "Renk körlüğünü tespit etmek"], "a": 0, "e": "Öğrenci 8 lambadan kırmızı yananı yakalar."}, {"q": "Bacak kaslarının gücünü ölçmenin en basit ve en popüler yolu hangisidir?", "o": ["Mekik koşusu", "Dikey sıçrama testi", "Otur-uzan testi", "Şınav testi", "El dinamometresi"], "a": 1, "e": "Dikey sıçrama anaerobik güç testlerinden biridir."}, {"q": "Üst vücut kas kuvveti ve dayanıklılığını ölçen, dirseklerin 90 dereceye kadar büküldüğü test hangisidir?", "o": ["Şınav (push-up)", "Dikey sıçrama", "El kavrama", "Mekik (sit-up)", "Barfiks"], "a": 0, "e": "10 yaş ve üzerine uygulanır."}, {"q": "Avrupa Konseyi Spor Bakanlar Komitesi'nin 11 Mayıs 1987'de kabul ettiği test bataryası hangisidir?", "o": ["Cooper testi", "Wingate testi", "Eurofit fiziksel uygunluk testleri", "Bosco testi", "Margaria-Kalamen testi"], "a": 2, "e": "Eurofit çocuk ve gençlerin fiziksel uygunluğunu değerlendirir."}, {"q": "2005 tarihli \"Olimpiyatlar İçin Sporda Yetenek Seçimi\" projesinin III. aşamasında ne yapılır?", "o": ["BESYO uzmanları test bataryası uygular", "Seçilen çocuklar 8 haftalık temel spor eğitimine katılır", "Doping kontrolü yapılır", "Okullarda yatkınlık ölçümü yapılır", "Branşlara yönlendirme yapılır"], "a": 1, "e": "I. aşama yatkınlık ölçümü, II. aşama kapsamlı test, IV. aşama yönlendirmedir."}, {"q": "Türkiye’de, Cumhuriyet tarihinin en büyük ‘’Yetenek seçimi’’ projesi, aşağıdaki bakanlıkların hangilerinin koordinasyonunda yürütülmektedir?", "o": ["Aile ve Sosyal Politikalar Bakanlığı - Gençlik ve Spor Bakanlığı", "Milli Eğitim Bakanlığı – Avrupa Birliği Bakanlığı", "Aile ve Sosyal Politikalar Bakanlığı - Milli Eğitim Bakanlığı", "Gençlik ve Spor Bakanlığı – Bilim Sanayi ve Teknoloji Bakanlığı", "Milli Eğitim Bakanlığı - Gençlik ve Spor Bakanlığı"], "a": 4, "e": "Doğru cevap: Milli Eğitim Bakanlığı - Gençlik ve Spor Bakanlığı.", "kb": 1}, {"q": "Sportif yatkınlık testinde % 10’luk dilime girerek, projenin ikinci aşamasına davet edilecek çocuklara, modüllerin uygulama sırası aşağıdakilerden hangisinde doğru bir şekilde verilmiştir?", "o": ["Temel hareket becerileri eğitimi ve gelişimi modülü - Temel düzey - Çoklu branş gelişimini içeren spor eğitimi modülü - Hareket becerileri gelişimi modülü (orta düzey)", "Hareket becerileri gelişimi modülü (orta düzey) - Temel hareket becerileri eğitimi ve gelişimi modülü - Çoklu branş gelişimini içeren spor eğitimi modülü", "Temel hareket becerileri eğitimi ve gelişimi modülü - Hareket becerileri gelişimi modülü (orta düzey) - Çoklu Branş Gelişimini İçeren Spor Eğitimi Modülü", "Çoklu branş gelişimini içeren spor eğitimi modülü - Temel hareket becerileri eğitimi ve gelişimi modülü - Hareket becerileri gelişimi modülü (orta düzey)", "Temel hareket becerileri eğitimi ve gelişimi modülü - Çoklu branş gelişimini içeren spor eğitimi modülü"], "a": 2, "e": "Doğru cevap: Temel hareket becerileri eğitimi ve gelişimi modülü - Hareket becerileri gelişimi modülü (orta düzey) - Çoklu Branş Gelişimini İçeren Spor Eğitimi Modülü.", "kb": 1}, {"q": "Antropometrik ölçümde, kulaç uzunluğu ölçümü yapılırken, her iki kolun hangi parmakları arasındaki uzaklık ölçülür?", "o": ["Orta parmak", "İşaret parmağı", "Baş parmak", "Serçe parmağı", "Yüzük parmağı"], "a": 0, "e": "Doğru cevap: Orta parmak.", "kb": 1}, {"q": "20 mekik koşu testi, birinci derecede hangi fiziksel performans hakkında bilgi veren kavramdır?", "o": ["Sürat", "Kuvvet", "Çeviklik", "Dayanıklılık", "Esneklik"], "a": 3, "e": "Doğru cevap: Dayanıklılık.", "kb": 1}, {"q": "20 metre sürat koşusu öncesi öğrencinin çıkış çizgisinde doğru pozisyonu alması için fotoselin kaç metre gerisinde konum alması sağlanır?", "o": ["1", "1.5", "2", "3", "4"], "a": 0, "e": "Doğru cevap: 1.", "kb": 1}, {"q": "Aşağıdaki testlerden hangisi antropometrik ölçümler içinde yer almaz?", "o": ["Boy uzunluğu", "Kulaç uzunluğu", "Esneklik", "Oturma yüksekliği", "Bacak uzunluğu"], "a": 2, "e": "Doğru cevap: Esneklik.", "kb": 1}, {"q": "Büyük yetenek seçimi projesinde, ilk sportif yatkınlık testinde ortalama yüzde kaçlık dilime girenler temel hareket ve sportif beceriler eğitimine davet edilmiştir?", "o": ["10", "15", "20", "25", "30"], "a": 0, "e": "Doğru cevap: 10.", "kb": 1}, {"q": "Aşağıdaki testlerden hangisi ikinci aşamada uygulanır?", "o": ["Çeviklik testi", "Topu geriye fırlatma testi", "Dikey sıçrama testi", "Koordinasyon testi", "Pençe kuvveti"], "a": 3, "e": "Doğru cevap: Koordinasyon testi.", "kb": 1}, {"q": "20 metre mekik testi (dayanıklılık) prosedürüne göre adayların testlerinin sonlandırma durumu aşağıdakilerden hangisidir?", "o": ["Sadece 1 kez hata yapıldığında", "Aralıklar ile 2 kez hata yapıldığında", "Üst üste 2 kez arka arkaya hata yapıldığında", "Üst üste 3 kez arka arkaya hat yapıldığında", "Aralıklar ile 3 kez hata yapıldığında"], "a": 2, "e": "Doğru cevap: Üst üste 2 kez arka arkaya hata yapıldığında.", "kb": 1}, {"q": "Görsel reaksiyon testinin tam amacı aşağıdakilerden hangisidir?", "o": ["Öğrencinin görsel bir uyarıya vermiş olduğu tepki süresini ve bu tepkiyi devam ettirebilme düzeyini incelemek", "Öğrencinin görsel bir uyarıya vermiş olduğu tepki süresini incelemek", "Öğrencinin verdiği tepkiyi devam ettirebilme düzeyini incelemek", "Öğrencinin refleks düzeyini incelemek", "Öğrencinin sadece hızlı karar vermek yetisini incelemek"], "a": 0, "e": "Doğru cevap: Öğrencinin görsel bir uyarıya vermiş olduğu tepki süresini ve bu tepkiyi devam ettirebilme düzeyini incelemek.", "kb": 1}], "tf": [{"q": "Yetenek taraması projesinde öğreticilerin en az 2. kademe antrenörlük belgesine sahip olması gerekir.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Program 8-10 yaş çocuklar için hazırlanmıştır.", "tf": true}, {"q": "Koordinasyon testinde el kronometresiyle alınan ölçümler kabul edilir.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Süre fotoselle ölçülür; el kronometresi kabul edilmez.", "tf": true}, {"q": "Mekik koşusu 7 km/sa hızla başlar ve her seviyede 0,5 km/sa artar.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Testi sonlandırılan sporcunun mekik sayısı kaydedilir.", "tf": true}, {"q": "Esneklik testinde öğrenci dizlerini bükerek öne uzanabilir.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Dizler gergin tutulmalıdır.", "tf": true}, {"q": "4-5 yaşlarında boy ve kilo artışında cinsiyetler arasında belirgin fark yoktur.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "7-10 yaş sonlarında kızlar lehine durum gözlenir.", "tf": true}]}, {"id": "hab8", "title": "Yetenek Seçimi ve Yönlendirme", "cards": [{"title": "Neden yetenek seçimi?", "points": ["Kulüpler başarıya iki yolla ulaşır: **yıldız transferi** veya geniş tabanlı **scouting** ile küçük yaşta yetenek bulup **kendi altyapısında yetiştirme** (uzun vadede daha avantajlı).", "Çocuklukta düzenli fiziksel aktivite alışkanlığı olmayanların ileride düzenli spor yapma olasılığı yalnızca **~%10**'dur.", "Çocukların **ekran süresi günde 2 saatten az** olmalıdır. WHO, çocukluk obezitesini 21. yüzyılın en önemli küresel sorunlarından sayar.", "Önce **sağlıklı çocuk** sayısı artmalı; sağlıklı çocuk ne kadar çoksa yetenek seçiminde \"menü\" o kadar zenginleşir.", "**Yetenek (Colvin):** Bir şeyi birçok kişiden daha iyi yapmayı sağlayan **doğal, doğuştan** beceri. **Sevim:** sportif güç gelişimi için sahip olunan **ön şartların bütünü**."]}, {"title": "Gelişimle ilgili temel kavramlar", "points": ["**Büyüme:** Hücrelerin büyüyüp çoğalmasıyla vücut kütlesinin **niceliksel** artışı (boy, kilo). Boy uzaması **epifiz plaklarının kapanmasıyla** biter.", "**Olgunlaşma:** Türe özgü gizil güçlerin **öğrenme olmadan, genetik mirasla** ortaya çıkması (bebeğin ~12 ayda yürümesi). Hızı değişse de **sırası değişmez**.", "**Hazır bulunuşluk:** Beklenen davranış için gerekli ön bilgi, beceri ve tutumun kazanılmış olması (teniste servis için kol boyu, raketi tutma, topa vurabilme).", "**Öğrenme:** Çevreyle etkileşim sonucu **kalıcı izli davranış değişikliği**.", "**Hareket ekonomisi:** Daha az enerji ve yorgunlukla etkili hareket; nöromüsküler koordinasyon, Tip I lif oranı, elastik enerji, eklem stabilizasyonu ve esneklik etkiler.", "**Beceri temaları:** **yer değiştirme hareketleri, dengeleme hareketleri, nesne kontrolü hareketleri**.", "Motor beceriler **25-30 yaşında** zirveye ulaşır. Sportif performansı etkileyen **239 gen** tespit edilmiştir; performans farklılıklarının **~%50'sinden** sorumludur."]}, {"title": "Yatkınlık, eğilim, sportif uygunluk", "points": ["Yetenek seçiminin alt bileşenleri: **yatkınlık, eğilim, sportif uygunluk**; hepsi **genetik ve çevresel** faktörlerle ilişkilidir.", "**Yatkınlık:** Öğrenme ve yetiştirme sonunda varılabilecek gelişme düzeyini belirleyen **doğal yeti**; antropometrik ve genetik özellikler.", "**Eğilim:** Coğrafi, kültürel ortam ve **aile-çevre** etkisiyle spora ve branşa duyulan ilgi (Brezilya'da futbol). **Aile ve çevre uyaranları en çok eğilim sürecinde belirleyicidir.**", "**Sportif uygunluk:** Bilişsel, duygusal ve fiziksel özelliklerin hedef davranışa yerindeliği. Çalışmalar daha çok **fiziksel uygunluğa** odaklanmıştır.", "**Genel yetenek:** belli bir branşla ilgili olmayan (kondisyonel ve koordinatif yetenekler). **Özel yetenek:** branşa özgü."]}, {"title": "Koordinatif yeteneklerin gelişimi", "points": ["Koordinatif yetenekler: **denge, antisipasyon (önceleme), ritim, reaksiyon**, hareketlilik-esneklik. **Kalıtsal özellikler baskındır**, çevre ve antrenmanla belirginleşir.", "**Denge:** İç kulaktaki denge organı **24. gebelik haftasında** oluşur. 2 yaşa kadar denge **görsel sisteme** bağlıdır; **12 yaşında** en üst seviyeye ulaşır, cinsiyet farkı yoktur.", "**Antisipasyon:** Rakibin hareketini veya topun yönünü **önceden tahmin ederek** daha hızlı tepki verme; mücadele ve takım sporlarında çok önemli.", "**Reaksiyon zamanı alt sınırları:** görsel **150-200 ms**, işitsel 120-180 ms, dokunsal 90-180 ms. En hızlı gelişim **9-12 yaş**, en iyi değer **20-30 yaş**. Antrenmanla ancak **%10-20** gelişir.", "**Basit reaksiyon:** 100 m startı (MSS değerlendirmesi hızlı). **Kombine reaksiyon:** basketbolda savunma (cevap süresi uzun).", "Koordinasyon en üst düzeyde **7 yaştan ergenlik başlangıcına** kadar gelişir. Ritim 6 yaşta başlar, 11-15 yaşta zirveye ulaşır."]}, {"title": "Kondisyonel özellikler ve yetenek seçimi", "points": ["**Dayanıklılık**, seçimde **en çok zorlanılan** biyomotor özelliktir (maksimum zorlamanın riskleri). VO₂maks sedanterde ~**35 ml/kg/dk**, elit dayanıklılık sporcusunda ~**70**.", "Aerobik sistem dinlenmede enerjinin ~**%70'ini yağlardan** sağlar. Anaerobik kapasite testleri: **dikey sıçrama**, Margaria-Kalamen, 50 yard, **Wingate**, Bosco, laktat ölçümü.", "Kuvvet ölçümü: el kavrama (handgrip), **sırt ve bacak dinamometresi**, 1 tekrar maksimum, şınav, mekik. **Kuvvet, yetenek seçiminde en önemli motorik özellik** olarak belirtilir.", "7-17 yaş arasında kas kütlesi **%300-500** artar. Kuvvet antrenmanı lif **sayısını artırmaz**, lifleri büyütür (**hipertrofi**). Ergenlikte erkeklerde **testosteron** etkisiyle fark açılır.", "Maksimal kuvvet: **1TM'nin %80+**, 1-4 tekrar. Kuvvette devamlılık: %50-60, 10-60 tekrar. Çabuk kuvvet: %30-80, 1-3 tekrar, uzun dinlenme (2-5 dk).", "Sürat gelişim hızının zirvesi: **kızlarda 9-10, erkeklerde 10-12 yaş**. Çabukluk-çeviklikle **en yüksek ilişki 20 m sürat** iledir; imkân kısıtlıysa sadece 20 m sürat bile yeterli bilgi verir.", "Esneklik **3-7 yaşta en iyi** düzeydedir; erkeklerde 10, kızlarda 12 yaştan sonra azalmaya başlar. **Çeviklik:** iki nokta arasında vücudu hareket ettirme ve yön değiştirme becerilerini kolay, hızlı, akıcı ve kontrollü yapabilme."]}, {"title": "Branşlara göre özel yetenek ipuçları", "points": ["**Sprint:** **kısa tepki süresi**, sinir-kas sisteminin çabuk harekete geçmesi, iyi kas gevşemesi, **anaerobik kuvvet**, **stresle başa çıkma**, boy-gövde oranına göre **uzun bacaklar**.", "**Orta mesafe:** anaerobik kuvvet, aerobik kapasite, stresle başa çıkma. **Uzun mesafe:** **yüksek aerobik kapasite**, düşük vücut ağırlığı, yorgunluğa dayanıklılık, dirençli karakter.", "**Atma dalları:** uzun boy ve bacaklar, gelişmiş kas kütlesi, büyük eller, patlayıcı kuvvet. **Basketbol:** uzun boy ve kollar, anaerobik güç ve aerobik kapasite, taktiksel zekâ.", "**Cimnastik:** yüksek denge-koordinasyon, estetik, ritim. **Futbol:** koordinasyon, aerobik ve anaerobik kapasite, taktiksel zekâ. **Güreş:** geniş omuz, uzun kollar, koordinasyon, taktiksel zekâ.", "Aerobik dayanıklılığı iyi olan çocuğu yönlendirirken **100 m sürat** gibi fosfojen sistem ağırlıklı branşlar daha az öncelikli olmalıdır; uzun mesafe, kürek, bisiklet, triatlon gibi aerobik branşlar öne çıkar.", "Temel spor eğitimine en uygun yaş **4-5**; özelleşme/branşa özgü antrenman cimnastik gibi istisnalar dışında **~10 yaş**."]}, {"title": "Yetenek araştırma modelleri ve seçim yöntemleri", "points": ["**Sistematik siyasi yaklaşım:** Uzun süreli, çok disiplinli; eski şampiyon uzman antrenör gözlemi (**SSCB, Çin**).", "**Sistematik sivil yaklaşım:** Kulüp ve şirketlerin fiziksel, psikolojik, teknik testleri ve gözlemleri.", "**Sistematik olmayan yaklaşım:** İnformal; nüfusu kalabalık, popüler branşların baskın olduğu ülkeler.", "**Doğal seçim:** Çocuğun ve ailenin tercihi, çevre etkisiyle spora yönelme; bilimsel temeli zayıf, gelişim yavaş. **Türkiye, ABD ve Batı Avrupa'da** uzun yıllar tercih edilmiştir.", "Doğal seçimde katılım dönemleri: **erken katılım (4-10 yaş)** — dinamik veya statik ebeveyn yaklaşımı; **geç katılım (11-13 yaş)** — en sık görülen; **rekreasyonel katılım (15 yaş sonrası)** — elit olma şansı çok düşük.", "**Bilimsel seçim:** Antropometrik, fizyolojik ve psikolojik özelliklerin bilimsel testlerle ölçülmesine ve **sistematik gözlem ve testlere** dayanır. II. Dünya Savaşı sonrası **Doğu Avrupa**'da benimsendi. **Öznel değerlendirme** (uzman gözlemi) ve **deneysel değerlendirme** (test bataryaları) içerir.", "**Çapraz katılım:** Çocuğun çevre etkisiyle başladığı branştan, yeteneğine uygun başka bir branşa geçmesi; **zaman kaybı sayılmaz**, iyi bir altyapı sağlayabilir."]}, {"title": "Yetenek seçiminde etkili faktörler", "points": ["**Bireysel faktörler** (müdahalesi imkânsız/sınırlı): **yaş, cinsiyet, genetik, antropometrik, bilişsel ve psikolojik** özellikler.", "Yaş türleri: **takvim yaşı**, **relatif (bağıl) yaş** (doğum ayı), **biyolojik yaş** (8-12 yaşta takvim yaşından **1-3 yıl** farklı olabilir), **kemik yaşı** (**sol el-bilek röntgeni**), **gelişim yaşı**, **antrenman yaşı**.", "**Bağıl yaş etkisi:** Yaş sınırı tarihinden sonraki **ilk 3 ayda doğanlar** seçilen sporcular arasında hep daha fazla temsil edilir.", "**Kadın sporcu üçlemesi:** Düşük enerji alımı (yeme bozukluğu) + **menstrüel bozukluk** + **kemik mineral yoğunluğunun azalması** (stres kırıkları).", "**Çevresel faktörler:** aile, okul, yönetim, spor çevresi, **coğrafya** (iklim, yükselti). Küçük kasaba ve köyler oyun alanı bakımından **avantajlıdır**.", "**Aile:** spora katılım ve branş tercihinde **birinci derecede** etkili; ama aşırı beklenti stres ve spordan kopmaya yol açabilir. Ailelerin eğitimi gerekir.", "Yetenek seçimi akış şemasında; amaç belirleme, test-ölçüm, değerlendirme, yönlendirme ve izleme gibi bölümler vardır. **\"Yöntemlerin belirsizliği\" bir aşama değildir**."]}], "questions": [{"q": "Çocuklukta düzenli fiziksel aktivite alışkanlığı olmayanların ileride düzenli spor yapma olasılığı yaklaşık yüzde kaçtır?", "o": ["%50", "%90", "%75", "%10", "%1"], "a": 3, "e": "Bu yüzden çocukluk döneminde oyun ve spor alışkanlığı kazandırılmalıdır."}, {"q": "Öğrenme olmaksızın genetik mirasın sonucu olarak türe özgü yeteneklerin ortaya çıkmasına ne denir?", "o": ["Olgunlaşma", "Öğrenme", "Antisipasyon", "Büyüme", "Hazır bulunuşluk"], "a": 0, "e": "Olgunlaşmanın hızı değişse de sırası değişmez."}, {"q": "Aşağıdakilerden hangisi beceri temalarını doğru vermektedir?", "o": ["Yer değiştirme - Dengeleme - Nesne kontrolü hareketleri", "Aerobik - Anaerobik - Fosfojen", "Isınma - Ana bölüm - Soğuma", "Kuvvet - Sürat - Dayanıklılık", "Teknik - Taktik - Kondisyon"], "a": 0, "e": "Beceri temaları üç gruptur."}, {"q": "Yetenek seçiminde aile ve çevre kavramlarının en etkili olduğu süreç hangisidir?", "o": ["Dikey sıçrama testi", "Kemik yaşı tespiti", "Eğilim tespiti", "Antropometrik ölçüm", "Laktat ölçümü"], "a": 2, "e": "Eğilim; coğrafi, kültürel ortam ve aile-çevre etkisiyle şekillenir."}, {"q": "Rakibin hareketini veya topun gideceği yönü önceden tahmin ederek daha hızlı tepki verme yeteneğine ne denir?", "o": ["Hazır bulunuşluk", "Ritim", "Antisipasyon (önceleme)", "Basit reaksiyon", "Denge"], "a": 2, "e": "Takım ve mücadele sporlarında çok önemlidir."}, {"q": "Denge yeteneği hangi yaşta en üst seviyeye ulaşır?", "o": ["18 yaş", "12 yaş", "2 yaş", "30 yaş", "5 yaş"], "a": 1, "e": "12 yaşında cinsiyet farkı görülmez; ergenlikte geçici sakarlık dönemi olabilir."}, {"q": "Reaksiyon sürati antrenmanla yaklaşık ne kadar geliştirilebilir?", "o": ["Hiç gelişmez", "%100", "%50-60", "%10-20", "%80-90"], "a": 3, "e": "Reaksiyon sürati genetik temellidir."}, {"q": "Yetenek seçimi sırasında kuvvet ölçümünde daha çok tercih edilen test hangisidir?", "o": ["Otur-uzan testi", "Bacak dinamometresi testi", "20 m mekik koşusu", "Görsel reaksiyon testi", "Denge testi"], "a": 1, "e": "Handgrip, sırt ve bacak dinamometresi yaygın kullanılır."}, {"q": "Yetenek seçiminde çabukluk ve çeviklik özelliğiyle en yüksek ilişkiye sahip koşu mesafesi hangisidir?", "o": ["1500 metre", "800 metre", "200 metre", "400 metre", "20 metre"], "a": 4, "e": "Kitabın metninde en yüksek ilişki 20 m sürat ile belirtilir."}, {"q": "Esneklik hangi yaş aralığında en iyi seviyededir?", "o": ["30-35", "10-12", "3-7", "20-25", "15-19"], "a": 2, "e": "Esneklik erkeklerde 10, kızlarda 12 yaştan sonra azalmaya başlar."}, {"q": "Atletizmde sprint branşına sporcu seçerken hangisi daha çok dikkate alınmalıdır?", "o": ["Yüksek aerobik kapasite ve düşük vücut ağırlığı", "Büyük eller ve uzun kollar", "Anaerobik kuvvet, kısa tepki süresi, stresle başa çıkma ve boy-gövde oranına göre uzun bacaklar", "Estetik görüntü ve ritim", "Geniş omuz ve kısa kollar"], "a": 2, "e": "Uzun mesafede ise yüksek aerobik kapasite öne çıkar."}, {"q": "Aerobik dayanıklılığı iyi olan çocuğu yönlendirirken diğerlerine göre daha az önem verilmesi gereken branş hangisidir?", "o": ["Atletizm (100 m sürat)", "Bisiklet", "Kürek", "Uzun mesafe koşu", "Triatlon"], "a": 0, "e": "100 m büyük ölçüde fosfojen sisteme dayanır."}, {"q": "İki nokta arasında vücudu hareket ettirme ve yön değiştirme becerilerini kolay, hızlı, akıcı ve kontrollü yapabilme hangisidir?", "o": ["Esneklik", "Maksimal kuvvet", "Denge", "Çeviklik", "Aerobik kapasite"], "a": 3, "e": "Çeviklik denge, hız, kuvvet ve sinir-kas koordinasyonunu içerir."}, {"q": "Çocuğun çevre etkisiyle başladığı branştan yeteneğine uygun başka branşa geçmesine ne denir?", "o": ["Erken özelleşme", "Doğal seçim", "Bağıl yaş etkisi", "Rekreasyonel katılım", "Çapraz katılım"], "a": 4, "e": "Çapraz katılım zaman kaybı sayılmaz."}, {"q": "Yetenek seçiminde \"bilimsel seçim\" sürecinde hangi yaklaşım benimsenir?", "o": ["Sistematik gözlem ve testlere dayanır", "Ailenin tercihine bırakılır", "Sadece çocuğun isteğine göre yapılır", "Tamamen tesadüfe dayanır", "Hiç test kullanılmaz"], "a": 0, "e": "Öznel ve deneysel değerlendirme içerir."}, {"q": "Doğal seçim yönteminde en sık görülen spora katılım türü hangisidir?", "o": ["Erken katılım (4-10 yaş)", "Çapraz katılım", "Geç katılım (11-13 yaş)", "Rekreasyonel katılım", "Bilimsel katılım"], "a": 2, "e": "Geç katılımda antrenmana uyum daha uzun sürer."}, {"q": "Kemik yaşı nasıl belirlenir?", "o": ["Boy ölçümüyle", "Sol el-bilek röntgeniyle", "Diş sayımıyla", "Dikey sıçrama testiyle", "Kan laktat ölçümüyle"], "a": 1, "e": "Kemik yaşı biyolojik olgunluğu pratik biçimde gösterir."}, {"q": "Yetenek seçimi akış şemasında hangi bölüm bulunmaz?", "o": ["Değerlendirme", "Test ve ölçüm", "Amaç belirleme", "Yetenek seçimi yöntemlerinin belirsizliği", "Yönlendirme ve izleme"], "a": 3, "e": "Akış şeması belirsizlik değil, sistematik aşamalar içerir."}, {"q": "Yetenek seçimi sırasında, aerobik dayanıklılık özelliği iyi olan çocukları yönlendirirken, diğerlerine göre daha az önemli olan branş aşağıdakilerden hangisidir?", "o": ["Maraton", "Bisiklet", "Atletizm (100 Metre Sürat)", "Kayak Kros", "1500 Metre koşusu"], "a": 2, "e": "Doğru cevap: Atletizm (100 Metre Sürat).", "kb": 1}, {"q": "Yetenek seçimi sırasında aşağıdaki testlerden hangisi kuvvet ölçümlerinde daha fazla tercih edilir?", "o": ["12 dk. Cooper testi", "1 Mil koşu testi", "5 m Sprint testi", "Bacak Dinamometresi testi", "Uzan-Eriş testi"], "a": 3, "e": "Doğru cevap: Bacak Dinamometresi testi.", "kb": 1}, {"q": "Yetenek seçimi sırasında, çabukluk ve çeviklik özelliğini belirlerken hangi koşu mesafesi, daha fazla dikkate alınarak ilişkilendirilir?", "o": ["200 Metre", "20 Metre", "100 Metre", "400 Metre", "800 Metre"], "a": 1, "e": "Doğru cevap: 20 Metre. Kitabın cevap anahtarında A (200 m) yazıyor, ancak kitabın metninde çabukluk-çeviklikle en yüksek ilişkinin 20 metre sürat olduğu belirtilir.", "kb": 1}, {"q": "Yetenek testleri sırasında ölçümü alınan esneklik parametresi hangi yaş aralığında en iyi seviyededir?", "o": ["3-7", "11-14", "15-19", "20-23", "24-26"], "a": 0, "e": "Doğru cevap: 3-7.", "kb": 1}, {"q": "Aşağıdakilerden hangisi yetenekli sporcuları belirlemede önemli unsurlardan biri olan beceri özelliğinin ana temaları birlikte ve doğru olarak verilmiştir?", "o": ["Geri geri yürüme - Dizleri karnına çekme - Ritmik adımlama", "Çift ayak ileri sıçrama - Çift ayak geri sıçrama - Parmak ucunda yürüme", "Yer değiştirme hareketleri - Dengeleme hareketleri - Nesne kontrolü hareketleri", "Kanguru hareketleri - Hızlı ve yavaş adımlama – Hizaya dikkat etme hareketleri", "Tırmanma hareketleri - Yuvarlanma hareketleri – Top ile yapılan hareketler"], "a": 2, "e": "Doğru cevap: Yer değiştirme hareketleri - Dengeleme hareketleri - Nesne kontrolü hareketleri.", "kb": 1}, {"q": "Yetenek seçimi ve yönlendirme sürecinde, atletizm(sprint) branşına sporcu seçilirken daha fazla dikkate alınması gereken özellikler aşağıdakilerden hangisinde birlikte ve doğru olarak verilmiştir?", "o": ["Anaerobik kuvvet, kısa tepki süresi, stresle başa çıkma becerisi ve boy-gövde oranıyla beraber uzun bacaklara sahip olunması gerekir.", "Anaerobik kuvvet, aerobik kapasite ve stres ile başa çıkma becerisi istenir.", "Yüksek aerobik kapasite, düşük vücut ağırlığı, düşük KAH, yorgunluğa karşı dayanma özelliği ve dirençli bir karakter beklenir.", "Uzun boy ve bacaklar, gelişmiş kas kitlesi, büyük eller, patlayıcı kuvvet, yüksek anaerobik güç özellikleri istenir.", "Yüksek derecede dayanıklılık, hızlı toparlanma özelliği ve uzun tepki süresi istenir."], "a": 0, "e": "Doğru cevap: Anaerobik kuvvet, kısa tepki süresi, stresle başa çıkma becerisi ve boy-gövde oranıyla beraber uzun bacaklara sahip olunması gerekir.", "kb": 1}, {"q": "Yetenek seçimi ve yönlendirme sürecinde, aile ve çevre kavramlarının daha etkili olduğu test tipi aşağıdakilerden hangisidir ?", "o": ["Yatkınlık tespiti", "Eğilim tespiti", "Sportif özellik tespiti", "Branşa uygunluk tespiti", "Fiziksel özellikler tespiti"], "a": 1, "e": "Doğru cevap: Eğilim tespiti.", "kb": 1}, {"q": "İki nokta arasında vücudu hareket ettirme ve yön değiştirme becerilerini mümkün olduğunca kolay, hızlı, akıcı ve kontrollü bir şekilde yapabilmek olarak tarif edilen ve yetenek seçiminde sıklıkla testleri yapılan biyomotor yetenek aşağıdakilerden hangisidir?", "o": ["Esneklik", "Sürat", "Çeviklik", "Kuvvet", "Dayanıklılık"], "a": 2, "e": "Doğru cevap: Çeviklik.", "kb": 1}, {"q": "Çocukluk yıllarında çevresel koşullar nedeniyle, herhangi bir spor dalında sporcu olunmasına rağmen ilerleyen yaşlarda, gerçek ilgisi ve yeteneğine dönüşler gerçekleşebilir, Aşağıdakilerden hangisi bu durumdaki katılımı ifade eder?", "o": ["Çapraz katılım", "Geç katılım", "Rekreasyonel katılım", "Erken katılım", "Tesadüfen katılım"], "a": 0, "e": "Doğru cevap: Çapraz katılım.", "kb": 1}, {"q": "Yetenek seçimi aşamasında kullanılan ‘’Bilimsel Seçim’’ sürecinde aşağıdaki yaklaşımlardan hangisi benimsenir?", "o": ["Subjektif antrenör görüşü dikkate alınır.", "Sistematik gözlem ve testlere dayanır.", "Sadece yarışma veya maçlarda analiz sonuçlarına dayanır.", "Psikolojik ve sosyolojik koşullar dikkate alınır.", "Branş eğitimcilerinin sübjektif gözlemlerine dayanır."], "a": 1, "e": "Doğru cevap: Sistematik gözlem ve testlere dayanır.", "kb": 1}], "tf": [{"q": "Kuvvet antrenmanları kas lifi sayısını artırır.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Kuvvet antrenmanı lif sayısını değil, lif büyüklüğünü artırır (hipertrofi).", "tf": true}, {"q": "Yaş sınırı tarihinden sonraki ilk aylarda doğan sporcular elit takımlarda daha fazla temsil edilir.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Bu duruma bağıl yaş etkisi denir.", "tf": true}, {"q": "Kadın sporcu üçlemesi; düşük enerji alımı, menstrüel bozukluk ve kemik mineral yoğunluğu azalmasından oluşur.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Erken özelleşme ve yoğun antrenman riski artırır.", "tf": true}, {"q": "Doğal seçim yöntemi bilimsel testlere dayanır ve gelişim hızı yüksektir.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Doğal seçim öznel tercihlere dayanır; gelişim yavaş ve sınırlıdır.", "tf": true}, {"q": "Biyolojik yaş ile takvim yaşı arasında 8-12 yaşlarında 1-3 yıl fark olabilir.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Bu yüzden yalnız takvim yaşına bakmak yanıltıcıdır.", "tf": true}, {"q": "Küçük kasaba ve köyler, çocukların serbest oyun alanı bakımından büyük şehirlere göre avantajlıdır.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Geniş alanlarda çocuklar kendilerini daha rahat gerçekleştirir.", "tf": true}]}], "past": [], "source": "Kitap: AÖF / GSB Antrenör Eğitimi kitabı"}, {"id": "ssb", "title": "Spor ve Sağlık Bilimleri", "short": "Sağlık", "icon": "❤️", "color": "#D9534F", "units": [{"id": "ssb1", "title": "Spor Anatomisi ve Kinesiyoloji", "cards": [{"title": "Anatomi ve yapısal organizasyon", "points": ["Anatomi: Yunanca **\"ana\" (içinden) + \"tome\" (kesmek)**; Latince karşılığı **dissection**.", "Vücudun organizasyon seviyeleri (küçükten büyüğe): **kimyasal → hücre → doku → organ → organ sistemi → organizma**.", "Hücre; yapının, **çoğalma-büyümenin** ve **fonksiyonun** temel birimidir. **Sinir hücreleri dışındaki** tüm hücreler bölünerek çoğalabilir.", "Hücre yapı taşları: **organeller** (nukleus, mitokondriyum, Golgi, endoplazmik retikulum, lizozom, peroksizom) ve membransız **supramoleküler kompleksler** (ribozom, mikrotubulus, sentriyol, enzim kompleksleri).", "**Ribozom protein sentezi** yapar; ribozom faaliyeti artarsa **protein sentezi artar**. Hücre büyüklüğü 10-50 mikrometre; bazı nöronların aksonu **1 m** olabilir."]}, {"title": "Dört ana doku", "points": ["Dört ana doku: **epitel, bağ-destek, kas, sinir** dokusu.", "**Epitel:** İç ve dış yüzeyleri örter. Üç şekli: **yüzey epiteli, salgı bezi epiteli, duyu epiteli**.", "Ürünü vücut yüzeyine boşaltan bez **ekzokrin** (ter, tükürük, gözyaşı); kana boşaltan bez **endokrin** (hipofiz, tiroid).", "Bağ dokusu lifleri: **Kollajen** gerilmeye en dirençli lif (boyunun ancak **%8'i** kadar esner; 1 mm² lif **10-20 kg** taşır). **Elastin** boyunun **%150'si** kadar esneyip geri döner. **Retiküler** en ince lif.", "**Fibroblast**, bağ dokusunun temel yapılarını sentezleyen hücredir. **Gevşek bağ dokusu** insandaki en yaygın dokudur; **sıkı bağ dokusu** ligamentlerde bulunur.", "Yağ dokusu: **depo yağı** (ısı izolasyonu) ve **yapı yağı** (el içi, ayak tabanında basınç yastığı)."]}, {"title": "Destek dokusu: tendon, kıkırdak, kemik", "points": ["**Tendon:** Kas kuvvetini kemiğe aktarır; paralel kollajen lifler sayesinde gerilmeye çok dirençlidir.", "Kıkırdakta **kan damarı ve sinir yoktur**; beslenme difüzyonla olur. Temel birimi **kondrom**, hücresi **kondrosit**.", "**Lifli kıkırdak:** omurlar arası **diskler** ve **menisküs**. **Hiyalin kıkırdak:** tüm **eklem yüzeylerini** kaplar. **Elastik (sarı) kıkırdak:** **kulak** kıkırdağı.", "**Kemik** en sağlam dokudur; basınca dayanıklılığı kıkırdağın **~10 katı**. Anorganik kısım: **%85 kalsiyum fosfat**, %10 kalsiyum karbonat. Kemik hücresi **osteosit**.", "Kemik bölümleri: **diafiz** (orta), **epifiz** (eklem ucu), **metafiz** (büyüme kıkırdağı). Metafiz **20-23 yaşlarında** kemikleşir, boy uzaması durur.", "Kemiği saran zar **periost**; dış tabaka **substantia kompakta**, iç süngerimsi kısım **substantia spongiosa** (kemik iliği burada). Osteonun merkezinde **Havers kanalı** vardır."]}, {"title": "Egzersize doku uyumu", "points": ["Hücre yüklenmeye iki şekilde yanıt verir: **hipertrofi** (hücrenin büyümesi) ve **hiperplazi** (hücre sayısının artması).", "Egzersizle **kollajen lif sayısı ve kesiti artar**; tendon kesiti ve sertliği artar, doku sağlamlaşır.", "Kısa süreli yüklenmede (ısınma) hiyalin kıkırdak **%12-13 su alarak şişer**, basınca direnci artar. Uzun süreli yüklenmede hipertrofi görülür.", "**Mikrotravma:** Tekrarlayan düşük yüklenmelerle oluşan, genelde fark edilmeyen küçük yaralanmalar; tendon kopmalarında rol oynar.", "Kemik, kuvvet doğrultusunda yeniden yapılanır (**Wolff kanunu**). Aşırı yüklenme **stres kırığına** yol açabilir."]}, {"title": "Kas dokusu ve sarkomer", "points": ["Üç kas tipi: **düz kas** (iç organlar, istem dışı), **çizgili iskelet kası** (istemli, hızlı), **kalp kası** (çizgili ama istem dışı).", "Kas hücresinde: hücre zarı **sarkolemma**, sitoplazma **sarkoplazma**, endoplazmik retikulum **sarkoplazmik retikulum** (kalsiyum deposu).", "**Sarkomer**, iki **Z çizgisi** arasındaki bölümdür ve kasın **en küçük işlev birimidir**. Kalın filament **miyozin**, ince filament **aktin**.", "Kasılmada aktin, miyozinin ortasına doğru kayar; **H şeridi ve I şeridi daralır**, A şeridi değişmez. Sarkomer ~%50 kısalabilir.", "**Optimum uzunluk:** Çapraz köprü sayısının maksimum, kuvvetin en yüksek olduğu sarkomer uzunluğu.", "Kalp kası sarkoplazmasının **%30'u mitokondriyumdur**."]}, {"title": "Kas lif tipleri", "points": ["**Tip I (ST, yavaş kasılan):** kırmızı, ince, yavaş, **aerobik**, mitokondriyası fazla, **dayanıklılık** odaklı.", "**Tip II (FT, hızlı kasılan; 2a, 2x):** beyaz, kalın, hızlı, **anaerobik**, mitokondriyası az, **güç** odaklı.", "Lif tipi **kalıtımla** belirlenir ama antrenmanla FT ↔ ST yönünde değişebilir. Bu yüzden haltercinin uzun koşu yapması gücünü azaltabilir.", "Lif tipleri arasında keskin geçiş yoktur; aynı kasta iki tip yan yana bulunabilir."]}, {"title": "Sinir dokusu", "points": ["Sinir dokusunda iki hücre: **nöron** (uyarıyı iletir) ve **glia** (destek, beslenme; uyarı iletmez).", "Nöronun gövdesi **perikaryon**; kısa uzantıları **dendrit**, tek uzun uzantısı **akson**. Uyarı **tek yönde** (gövdeden akson ucuna) iletilir.", "İletim **\"ya hep ya hiç\"** ilkesine uyar. Nöron ile iskelet kası arasındaki sinaps: **motorik son plak**.", "**Schwann hücreleri** aksonu **miyelin** ile sarar. Miyelinsiz aralıklar **Ranvier boğumlarıdır**; uyarı boğumdan boğuma **atlayarak** hızlı iletilir.", "Organ sistemleri: sinir, kas-iskelet, solunum, dolaşım, endokrin, sindirim, üriner, üreme, bağışıklık-lenfatik, **integumenter** (deri)."]}, {"title": "Anatomik duruş, düzlemler, eksenler", "points": ["**Anatomik duruş:** Yüz bize dönük, dik, kollar yanda, **avuç içi öne**, ayaklar birleşik ve öne dönük.", "**Sagittal düzlem:** Vücudu **sağ-sol** ikiye ayırır (tam ortadan geçerse **median düzlem**).", "**Frontal (koronal) düzlem:** Vücudu **ön-arka** ikiye ayırır.", "**Transvers (horizontal) düzlem:** Vücudu **alt-üst** ikiye ayırır.", "Eksenler: **vertikal** (baştan ayağa, yere dik), **sagittal** (önden arkaya), **frontal** (sağdan sola).", "Yön terimleri: anterior/posterior (ön/arka), superior/inferior (üst/alt), **medial** (orta hatta yakın)/**lateral** (uzak), **proksimal** (gövdeye yakın)/**distal** (uzak), **supine** (sırtüstü)/**prone** (yüzüstü), **ipsilateral** (aynı taraf)/**kontralateral** (karşı taraf)."]}, {"title": "Eklem hareketleri", "points": ["**Sagittal düzlem:** fleksiyon-ekstansiyon, dorsifleksiyon-plantar fleksiyon.", "**Frontal düzlem:** abduksiyon (orta hattan uzaklaştırma)-adduksiyon (yaklaştırma), **lateral fleksiyon** (gövdenin sağa-sola bükülmesi), inversiyon-eversiyon.", "**Transvers düzlem:** iç (medial) ve dış (lateral) **rotasyon**.", "**Plantar fleksiyon:** parmak ucuna kalkmak. **Dorsifleksiyon:** topuk üzerine kalkmak. **Sirkümdiksiyon:** açısal hareketlerin birleşimiyle dairesel hareket.", "**Supinasyon:** önkolu dışa çevirip avuç içini yukarı getirmek (su içme pozisyonu). **Pronasyon:** avuç içi aşağı/arkaya.", "Elevasyon (yukarı kaldırma), depresyon (indirme), retraksiyon (arkaya), protraksiyon (öne), örneğin skapulada."]}, {"title": "Kas yapısı ve kasılma tipleri", "points": ["İnsanda yaklaşık **640-850 kas** vardır. Kasın başlangıç noktası **origo**, kemiğe yapışma noktası **insertio**.", "Bağ doku kılıfları (içten dışa): kas lifi çevresi **endomisyum**, fasikül çevresi **perimisyum**, tüm kas çevresi **epimisyum**. Hepsine birden **miyofasya** denir.", "Büyükten küçüğe: **kas → fasikül → kas lifi → miyofibril → miyofilament (aktin/miyozin)**.", "**Fusiform** kasta lifler tendona paralel (biceps). **Pennat** kasta lifler açılı bağlanır (**pennasyon açısı**).", "Kas kuvveti **fizyolojik çapraz kesit alanı** ile doğru orantılıdır (~**25 N/cm²**).", "**İzometrik:** boy değişmez. **Konsantrik:** kas kısalır. **Eksantrik:** kas uzayarak kasılır. Maksimal kuvvet sırası: **eksantrik > izometrik > konsantrik**."]}, {"title": "Kas görevleri ve kaldıraçlar", "points": ["**Agonist:** Hareketi başlatan ve yapan kas (dorsifleksiyonda tibialis anterior).", "**Antagonist:** Harekete **karşı yönde** çalışan, yavaşlatan kas (dorsifleksiyonda gastroknemius ve soleus).", "**Sinerjist:** Agoniste yardım eden kas; sabitleme yapıyorsa **stabilizatör** denir.", "**1. tip kaldıraç:** Eklem, kuvvet ile yükün **arasında** (baş-boyun ekstansörleri).", "**2. tip kaldıraç:** Yük ortada, kuvvet kolu uzun → **mekanik avantaj**. Örnek: **parmak ucuna kalkma** (gastroknemius). Vücutta az bulunur.", "**3. tip kaldıraç:** Kuvvet ortada, yük kolu uzun → mekanik dezavantaj ama **hız avantajı**. Vücutta **en sık** görülen tip; örnek: dirsek fleksiyonunda **biceps**."]}, {"title": "İskelet ve eklemler", "points": ["İskelet sistemi (kitaba göre) **208 kemik**; kemikler vücut ağırlığının **~%17'si**. **Aksiyel** (kafatası, omurga, göğüs kafesi) ve **apendiküler** (kuşaklar ve ekstremiteler) iskelet.", "**Tendon:** kası kemiğe bağlar. **Ligament (bağ):** **kemiği kemiğe** bağlar, eklem hareketini sınırlar.", "**Sinartroz** (az oynar/oynamaz): **sindesmoz** (sıkı bağ dokusu; tibia-fibula), **sinkondroz** (kıkırdak; os pubis), **sinostoz** (kemik; os coxae).", "**Diartroz** (oynar) eklemlerde eklem kapsülünün iç tabakası (**stratum synoviale**) sinovyal sıvı salgılar.", "Tek eksenli **menteşe** (parmak eklemleri), iki eksenli **eyer** (başparmak), üç eksenli **küresel** (omuz, kalça). Omuz soketi sığ olduğu için **çıkık riski** fazla.", "Omurga: **7 servikal, 12 torakal, 5 lumbal**, 5 sakral (sakrum), 3-5 koksigeal. Sagital eğrilikler: **boyun ve bel lordozu, sırt ve sakral kifoz** (skolyoz yana eğrilik olup sagital değildir).", "Üst ekstremitede **humerus, radius, ulna**; alt ekstremitede **femur, patella, tibia, fibula**."]}], "questions": [{"q": "Hücrede ribozom faaliyeti artarsa aşağıdakilerden hangisi artar?", "o": ["Uyarı iletimi", "Protein sentezi", "Hücre bölünmesi", "Kalsiyum depolama", "Yağ depolama"], "a": 1, "e": "Ribozomlar protein sentezi
