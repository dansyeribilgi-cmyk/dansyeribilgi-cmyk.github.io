 = 1:3."}, {"q": "Uluslararası yarışmalara gidecek bir sporcunun yıllık antrenman saati en az ne kadar olmalıdır?", "o": ["600 saat", "1000 saat", "800 saat", "1200 saat", "400 saat"], "a": 2, "e": "Bölgesel 400, ulusal 600, uluslararası 800, dünya sıralaması 1000+ saat."}, {"q": "Maksimal kuvvet ve maksimal sürat için %80-100 şiddet, 1-6 tekrar ve uzun dinlenme kullanılan yöntem hangisidir?", "o": ["Sürekli yüklenme yöntemi", "Ekstensiv interval yöntemi", "Dairesel antrenman", "Tekrar yöntemi", "Fartlek"], "a": 3, "e": "Tekrar yönteminde şiddet yüksek, kapsam düşük, dinlenme tamdır."}, {"q": "Aynı gün dayanıklılıktan sonra yapılan kuvvet antrenmanının kuvvet uyumunu engellediğini ortaya koyan 'alternatif (concurrent) yüklenme' kime aittir?", "o": ["Borg (1982)", "Viru (1995)", "Yakovlev (1977)", "Hickson (1980)", "Matvejev (1981)"], "a": 3, "e": "Hickson 1980'de concurrent antrenman etkisini gösterdi."}, {"q": "Viru'ya göre iki gün üst üste aynı karakterde maksimal sprint antrenmanı yapıldığında süperkompansasyon ne zaman gelir?", "o": ["12 saat sonra", "72 saat sonra", "48 saat sonra", "96 saat sonra", "24 saat sonra"], "a": 1, "e": "Farklı karakterde (dayanıklılık) antrenman eklenince süre 48 saate iner."}, {"q": "Aşağıdakilerden hangisi bir DIŞ yük ölçümüdür?", "o": ["Kan laktatı", "GPS ile koşu mesafesi", "Oksijen tüketimi", "Kalp atım sayısı", "Algılanan zorluk derecesi"], "a": 1, "e": "Dış yük objektif yapılan iştir (GPS, hız, güç); diğerleri iç yüktür."}, {"q": "Algılanan Zorluk Derecesi (AZD) ölçeğini kim geliştirmiştir?", "o": ["Hickson", "Borg", "Foster", "Bompa", "Karvonen"], "a": 1, "e": "Borg (1982); antrenman yükü = süre × AZD."}, {"q": "Pasif dinlenmede laktat en az ne kadar sürede uzaklaştırılır?", "o": ["24 saat", "5 dakika", "10 dakika", "30 dakika", "1 saat"], "a": 4, "e": "Pasif dinlenme en az 1 saat, aktif dinlenme en az 30 dakika."}, {"q": "Aşağıdakilerden hangisi termoterapi (ısı) yöntemi DEĞİLDİR?", "o": ["Kızılötesi lamba", "Isı paketi", "Sauna", "Buz paketi", "Sıcak suya daldırma"], "a": 3, "e": "Buz paketi, buz banyosu ve buz masajı kriyoterapidir."}, {"q": "PHV (hızlı boy uzama dönemi) genellikle erkeklerde hangi yaşlar arasındadır?", "o": ["12-16", "11-15", "16-20", "8-11", "6-10"], "a": 0, "e": "Kızlarda 11-15, erkeklerde 12-16; kızlar daha erken yaşar."}, {"q": "Çocuklarda bir antrenman biriminde ısınmadan hemen sonra hangi özellik çalışılmalıdır?", "o": ["Koordinasyon", "Soğuma", "Aerobik dayanıklılık", "Maksimal kuvvet", "Kuvvette devamlılık"], "a": 0, "e": "Sıra: ısınma, koordinasyon, sürat, yeni teknik..."}, {"q": "Toparlanmayı etkileyen faktörlerle ilgili hangisi doğrudur?", "o": ["Deneyimli sporcular daha yavaş toparlanır", "Soğuk iklim laktat üretimini azaltır", "Kadınlar erkeklerden daha hızlı toparlanır", "Hızlı kasılan lifler daha geç yorulur", "25 yaşından büyük sporcular daha uzun toparlanmaya ihtiyaç duyar"], "a": 4, "e": "Ayrıca kadınlar daha yavaş toparlanır ve soğuk havada laktat artar."}, {"q": "Aşağıdakilerden hangisi organizmadaki sistemlerin fonksiyonel değerlerinin dinamik bir denge içermesi durumunu ifade eder?", "o": ["Yüklenme", "Dinlenme", "Homeostasis", "Katabolik", "Anabolik süreç"], "a": 2, "e": "Doğru cevap: Homeostasis.", "kb": 1}, {"q": "Yüklemede uyumun gerçekleşmediği oran aşağıdakilerden hangisidir?", "o": ["%20'nin altı", "%30", "%40", "%50", "%100'ün üstü"], "a": 0, "e": "Doğru cevap: %20'nin altı.", "kb": 1}, {"q": "Aşırı yüklenmeler sonucu performans düzeyindeki düşüşe ne ad verilir?", "o": ["Süperkompenzasyon", "Sürantrenman", "Homeostasis", "Anabolik", "Azaltım"], "a": 1, "e": "Doğru cevap: Sürantrenman. Kitabın cevap anahtarında A yazıyor; metne göre aşırı yükün sonucu sürantrenmandır.", "kb": 1}, {"q": "Çocuk ve gençlerde antrenman amaçları uyarınca bir antrenman biriminde ısınmadan hemen sonra çalıştırılması önerilen ilk biyomotor yeti aşağıdakilerden hangisidir?", "o": ["Dayanıklılık", "Sürat", "Koordinasyon", "Çabuk kuvvet", "Patlayıcı kuvvet"], "a": 2, "e": "Doğru cevap: Koordinasyon.", "kb": 1}, {"q": "Çocuk ve gençlerde sürat yetisinin geliştirilmesi için ilk hassas pencere aşağıdaki yaş aralıklarından hangisidir?", "o": ["4-5", "7-9", "11-12", "14-15", "16-18"], "a": 1, "e": "Doğru cevap: 7-9.", "kb": 1}, {"q": "Bir antrenmandaki tüm yüklenmelerin süresini ve tekrarını içeren kavram aşağıdakilerden hangisidir?", "o": ["Kapsam", "Şiddet", "Sıklık", "Süre", "Yük"], "a": 0, "e": "Doğru cevap: Kapsam. Kitabın cevap anahtarında B yazıyor; metinde 'süre ve tekrarı içerir' tanımı kapsama aittir.", "kb": 1}, {"q": "Çocukların antrenmanlara başladığı ilk basamakta minimum antrenman süresi kaç dakikadır?", "o": ["30", "45", "75", "90", "120"], "a": 2, "e": "Doğru cevap: 75. Metinde başlangıç 60 dk, sonra 75 ve 90 dk olarak verilir; seçeneklerde 60 olmadığı için kitap 75'i kabul etmiştir.", "kb": 1}, {"q": "Aşağıdaki kavramlardan hangisi toparlanmada tercih edilmelidir?", "o": ["Aktif dinlenme", "Pasif dinlenme", "Antrenman", "Uyku", "Spor branşına göre değişiklik gösterir."], "a": 0, "e": "Doğru cevap: Aktif dinlenme.", "kb": 1}, {"q": "Sporcuların %80-90 oranında yenilenmeleri için kaç saat uyumaları gerekir?", "o": ["5-6", "7-8", "9-10", "12-13", "14-15"], "a": 0, "e": "Doğru cevap: 5-6.", "kb": 1}, {"q": "Enerji metabolizmaları açısından ATP-CP yenilenme süresi maksimum kaç dakikadır?", "o": ["3-4", "10", "30", "60", "120"], "a": 0, "e": "Doğru cevap: 3-4.", "kb": 1}], "tf": [{"q": "Antrenman yükü yetersizse organizmada hiçbir uyum gerçekleşmez.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Yük, değişiklik yaratacak düzeyde olmalıdır.", "tf": true}, {"q": "Dayanıklılık sporlarında şiddet, kuvvet ve çabukluk sporlarında ise kapsam daha belirgindir.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Tersi: dayanıklılıkta kapsam, kuvvet ve çabuklukta şiddet öne çıkar.", "tf": true}, {"q": "Kas fosfojenlerinin büyük bölümü (%90'dan fazlası) ilk 3 dakika içinde yenilenir.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Fosfojen sistemi dakikalar içinde yenilenir; glikojen ise saatler-günler sürer.", "tf": true}, {"q": "Yüksek VO2maks, fosfojenlerin yenilenmesini hızlandırır.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Bu yüzden kısa süreli sporlarda da aerobik temel önemlidir.", "tf": true}, {"q": "Aktif dinlenmede laktat en erken 1 saatte uzaklaştırılır.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Aktif dinlenmede en az 30 dakika, pasifte en az 1 saat.", "tf": true}, {"q": "Çocuklarda yılda en az 10 ay antrenman yapılması önerilir.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Kitapta en çok önerilen süre budur.", "tf": true}, {"q": "Antrenmandan hemen sonra karbonhidrat almak kas ve karaciğer glikojeninin yenilenmesine katkı sağlar.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Toparlanmada beslenme önemli bir yöntemdir.", "tf": true}]}, {"id": "hab2", "title": "Dayanıklılık Antrenmanı", "cards": [{"title": "Dayanıklılık nedir?", "points": ["**7-8 saniyeden** uzun süren aktivitelerde yorgunluğa rağmen performansı sürdürme ve sonra **hızla toparlanabilme** yetisidir.", "**Genel dayanıklılık:** tüm dayanıklılık türlerinin **temelidir**, kalp-dolaşım sistemine dayanır.", "**Spor dalına özgü dayanıklılık:** branşın hareketlerini sürdürebilmek; aerobik + anaerobik yollar değişen oranlarda katılır.", "En genel ayrım: **iskelet kası dayanıklılığı** ve **kardiyovasküler dayanıklılık**."]}, {"title": "Kas dayanıklılığı: lokal mi genel mi?", "points": ["Çalışan kaslar tüm kas kütlesinin **1/6'sından az** ise **lokal kas dayanıklılığı** (ör. **bilek güreşi**).", "**1/6'dan fazla** kas çalışıyorsa **genel kas dayanıklılığı** (ör. cimnastikte **kulplu beygir** serisi).", "Maratoncu için **kardiyovasküler**, asimetrik paralelde 60-90 sn seri yapan cimnastikçi için **kassal** dayanıklılık önemlidir.", "Kardiyovasküler dayanıklılığın **altın standardı: VO2maks**."]}, {"title": "Aerobik dayanıklılık süreleri", "points": ["**Kısa süreli:** **2–8 dk** (sürat ve kuvvet dayanıklılığı bunun etkisindedir).", "**Orta süreli:** **8–30 dk**; genellikle **denge durumu (steady state)** hakimdir.", "**Uzun süreli:** **30 dk'dan** uzun; verim neredeyse tamamen aerobik kapasiteye bağlıdır.", "VO2maks'ın **%70'inin altındaki** egzersizde steady state sırasında laktat **artmaz**."]}, {"title": "Anaerobik dayanıklılık süreleri", "points": ["Anaerobik dayanıklılıkta yüklenme en fazla **180 saniyedir**.", "**Kısa (ATP-CP):** **15-20 sn**'ye kadar, laktat birikmez → atma, atlama, **100 m, 110 m engel, 200 m**.", "**Orta (laktik asit):** **15-20 sn – 60 sn** → **400 m** ve 400 m engelli.", "**Uzun (laktik + oksijen):** **60–120 sn** (en fazla 180 sn) → **800 m** ve **1500 m**.", "İlk **2-3 sn** enerji kastaki **ATP**'den gelir, **CP** ise 8-10 sn daha destek sağlar."]}, {"title": "Aerobik ve anaerobik eşik", "points": ["**Aerobik eşik (AE):** kan laktatının **2 mM**'e ulaştığı ilk steady state. KAH **130-150**, laktat 2-3 mM. Yağ yakımı yüksektir.", "**Anaerobik eşik (AnE):** laktatın **4 mM**'e ulaştığı nokta. Fizyologlar **laktat eşiği**, laktat birikiminin başladığı nokta için **OBLA** der.", "AnE, dayanıklılık sporlarında **VO2maks'tan daha yararlı** bir göstergedir, çünkü VO2maks artmasa bile gelişebilir.", "Hiç kimse anaerobik eşikle **%100 VO2maks**'a ulaşamaz; **%90**'da tutabilmek büyük avantajdır.", "Dinlenmede antrenmanlıların laktatı (0.3-0.6 mM) sedanterlerden (0.4-1.7 mM) **düşüktür**."]}, {"title": "VO2maks (maksimal aerobik güç)", "points": ["Maksimal egzersizde dokuların **1 dakikada kullandığı en fazla oksijen**.", "Hesap (**Fick**): **maksimal kalp atımı × atım hacmi × arterio-venöz O2 farkı**.", "VO2maks'ın **%40-60**'ına kadar kalbin pompaladığı kan **atım hacmiyle**, sonrasında **nabız artışıyla** artar. Sedanter ile maratoncuyu ayıran en önemli fark **atım volümüdür**.", "**Mutlak** değer L/dk (kiloya bakılmaz); **göreceli** değer **ml/kg/dk**. Ör. 90 kg–5 L = 55,5; 60 kg–4 L = **66,6** ml/kg/dk (göreceli olarak daha iyi).", "Geliştirmek için **3-5 dk** yüklenme, **4-8 tekrar**, 160-180 atım, **Borg 16**, haftada **1-2** kez."]}, {"title": "Laktik aside tolerans (LAT)", "points": ["Yüksek şiddette egzersizi sürdürebileceği **maksimum laktat düzeyidir** (Osnes, 1972).", "**Süratte ve kuvvette devamlılık** için çok önemlidir; asidozun yarattığı **ağrıya tolerans** da artar.", "Gelişimi: **tampon kapasitesi** (şiddetli egzersizde tamponlamanın **%92**'si **bikarbonat** ile) + **glikolitik enzim aktivitesi** artışı.", "Maksimum sınırlara **40-50 sn**'de ulaşılır. Antrenman: **10-120 sn**, 4-6 tekrar, **12-18 mM** laktat, **Borg 19-20**."]}, {"title": "Yük belirleme: KAH ve Karvonen", "points": ["**KAHmaks = 220 – yaş** (en sık kullanılan formül; hata payı vardır, mümkünse saha testiyle ölçülmeli: **Yo-Yo, mekik koşusu**).", "**Karvonen (1957):** Hedef KAH = **[(KAHmaks – KAHistirahat) × %yoğunluk] + KAHistirahat**.", "Örnek: 30 yaş, istirahat 70, %50 → (190–70)×0,5+70 = **130**. 20 yaş, istirahat 50, %80 → (200–50)×0,8+50 = **170**.", "**KAH yedeği** = KAHmaks – istirahat KAH. Aerobik gelişim eşiği yedeğin **%60**'ı. Düşük %30-40, orta %40-60, yüksek %60-90.", "Nabız en sık **karotis** ve **radial** arterden alınır. Dinlenik KAH'ın yükselmesi **aşırı antrenman** uyarısı olabilir. Kadınlarda KAHmaks daha düşüktür."]}, {"title": "Borg skalası ve testler", "points": ["**Gunnar Borg (1970)**: algılanan zorluk derecesine dayanan **öznel** ölçek; **6–20** arası puanlanır.", "Puan **×10 ≈ gerçek nabız** (ör. 13 → ~130 atım/dk).", "**Laboratuvar-direkt** ölçüm: gaz analizörü, laktat ölçümü, koşu bandı, ergometre.", "**Saha-dolaylı** ölçüm: **20 m mekik koşusu, Cooper 12 dk, Yo-Yo, Conconi**, basamak testi (30 cm, 3 dk, dakikada 22-24), 1,61 km yürüyüş."]}, {"title": "İnterval antrenman", "points": ["Yüklenme ve dinlenme periyotları **sistemli** olarak değişir (yüksek >%90, düşük <%70 VO2maks).", "Süreye göre: **kısa** 15-20 sn, **orta** 1-8 dk, **uzun** 8-15 dk.", "Şiddete göre: **ekstansif (yaygın)** → AnE altı, %50-70 VO2maks, 20-40 tekrar, laktat **2-4 mmol**; **intensif (yoğun/HIIT)** → AnE ile VO2maks arası, **>%75**, 20-120 sn, 6-9 tekrar.", "Yaygın intervalde tekrarlar arası nabız elit sporcuda **120-130'a**, gençlerde **110-120'ye** düşmeli.", "HIIT: kanda **4 mmol** laktat, nabız **190+**; %95-100 VO2maks yakınındaki bu şiddet toplam **30-40 dk**'dan fazla sürdürülemez."]}, {"title": "Sürekli yüklenme ve Fartlek", "points": ["**Sürekli yöntem:** **<%60 VO2maks**, **>30 dk**, nabız **130-160** (AE antrenmanı 130-150, Borg **10-11**).", "Ergenler **30 dk** üzeri, yetişkinler **60-120 dk** koşabilir.", "Kazanımlar: **mitokondri**, oksidatif enzim, **miyoglobin**, **kılcal damar** artışı; kan hacmi ve hemoglobin artar, submaksimal nabız düşer.", "Örnekler: **eşli bisiklet koşusu**, kesintisiz takım oyunları, ikili-üçlü müsabakalar, tempo bileşenli jogging, **oryantiring**.", "**Fartlek (hız oyunu):** **İskandinav ve Alman** koşucular, **1920-1930**. Sürekli koşu + kısa yüksek şiddetli bölümler; **doğal arazide** hızlı-yavaş tempo. Hem aerobik hem anaerobik kapasiteyi geliştirir."]}, {"title": "Çocuk ve gençlerde dayanıklılık", "points": ["**8-12 yaş** arasında aerobik güç **%49**, vital kapasite **%48** artar. Erkeklerde 12 yaştan sonra kalp hacmi hızla büyür.", "Öncelik **aerobik kapasite**. Test mesafesi okul öncesi ve ilkokulda **600 m**, ortaokulda **1200 m**'yi geçmemeli.", "Aerobik verim en iyi **kızlarda 12-13**, **erkeklerde 13-14** yaşta antrene edilir. Kapsam geniş, yoğunluk az; yükler kısa ve değişken olmalı.", "Kontrol testi için en az **4-6 hafta** antrenman gerekir; test olarak **5 dk** (sonra 10 dk) koşulan mesafe ölçülür.", "Gençlerde **AE**: 20 dk'dan 1-1,5 saate, **130-150** atım, KAHmaks'ın %50-75'i, Borg **10-11**. **AnE**: tekrar 6-8 dk'dan 30 dk'ya, **150-170** atım, **4 mmol**, %70-95, Borg **13-14**."]}], "questions": [{"q": "Aktiviteye katılan kaslar tüm kas kütlesinin 1/6'sından azsa hangi dayanıklılıktan söz edilir?", "o": ["Lokal kas dayanıklılığı", "Kardiyovasküler dayanıklılık", "Anaerobik dayanıklılık", "Genel kas dayanıklılığı", "Uzun süreli aerobik dayanıklılık"], "a": 0, "e": "Bilek güreşi lokal kas dayanıklılığına örnektir."}, {"q": "Orta süreli aerobik dayanıklılık hangi süre aralığındaki yüklenmelerde gereklidir?", "o": ["15-60 saniye", "8-30 dakika", "2-8 dakika", "30-60 dakika", "60-120 saniye"], "a": 1, "e": "Kısa 2-8 dk, orta 8-30 dk, uzun 30 dk üzeri."}, {"q": "400 metre koşusu hangi dayanıklılık türüne örnektir?", "o": ["Lokal kas dayanıklılığı", "Kısa süreli aerobik dayanıklılık", "Uzun süreli anaerobik dayanıklılık", "Orta süreli anaerobik dayanıklılık", "Kısa süreli anaerobik dayanıklılık"], "a": 3, "e": "15-20 sn ile 60 sn arası laktik sistem; 800-1500 m ise uzun süreli anaerobiktir."}, {"q": "Kan laktat seviyesinin 2 mM'e ulaştığı noktaya ne ad verilir?", "o": ["VO2maks", "OBLA", "Aerobik eşik", "Anaerobik eşik", "Laktik aside tolerans"], "a": 2, "e": "2 mM aerobik eşik, 4 mM anaerobik eşiktir."}, {"q": "Kanda laktat birikiminin başladığı 4 mmol/L referans noktası hangi kısaltmayla bilinir?", "o": ["OBLA", "LAT", "AZD", "PHV", "EPOC"], "a": 0, "e": "Onset of Blood Lactate Accumulation."}, {"q": "VO2maks hesabında aşağıdakilerden hangisi YER ALMAZ?", "o": ["Dokuların kullandığı oksijen", "Atım hacmi", "Arterio-venöz oksijen farkı", "Vital kapasite", "Maksimal kalp atım sayısı"], "a": 3, "e": "VO2maks = maksimal nabız × atım hacmi × a-vO2 farkı (Fick)."}, {"q": "60 kg ağırlığında, VO2maks'ı 4 L/dk olan sporcunun göreceli VO2maks değeri yaklaşık kaçtır?", "o": ["55,5 ml/kg/dk", "4 ml/kg/dk", "240 ml/kg/dk", "40 ml/kg/dk", "66,6 ml/kg/dk"], "a": 4, "e": "4000 ml / 60 kg ≈ 66,6 ml/kg/dk."}, {"q": "Laktik aside tolerans antrenmanında Borg skalasındaki yorgunluk seviyesi kaç olmalıdır?", "o": ["6-8", "10-11", "16", "13-14", "19-20"], "a": 4, "e": "LAT antrenmanı çok yüksek şiddettedir: 12-18 mM laktat, Borg 19-20."}, {"q": "Şiddetli egzersizde tamponlamanın yaklaşık %92'sini hangi sistem sağlar?", "o": ["Fosfat tampon sistemi", "Bikarbonat tampon sistemi", "Miyoglobin", "Protein tampon sistemi", "Hemoglobin"], "a": 1, "e": "Beaver ve ark. (1986) bulgusudur."}, {"q": "30 yaşında, istirahat nabzı 70 olan bir kişinin %50 yoğunlukta Karvonen'e göre hedef nabzı kaçtır?", "o": ["95", "130", "140", "120", "155"], "a": 1, "e": "KAHmaks 190; (190-70)×0,5+70 = 130."}, {"q": "Borg skalasının orijinal puan aralığı nedir?", "o": ["60-200", "1-5", "0-10", "6-20", "10-100"], "a": 3, "e": "Puanın 10 katı gerçek nabza yakındır."}, {"q": "Aşağıdakilerden hangisi saha (dolaylı) dayanıklılık testi DEĞİLDİR?", "o": ["Gaz analizörüyle koşu bandı testi", "Cooper 12 dakika testi", "Conconi testi", "Yo-Yo testi", "20 m mekik koşusu"], "a": 0, "e": "Gaz analizörü ve koşu bandı laboratuvar-direkt ölçümdür."}, {"q": "Anaerobik eşik altında yapılan, %50-70 VO2maks şiddetli ve 20-40 tekrarlı interval türü hangisidir?", "o": ["Fartlek", "İntensif (yoğun) interval", "Sürekli yöntem", "Ekstansif (yaygın) interval", "Tekrar yöntemi"], "a": 3, "e": "Yoğun interval AnE ile VO2maks arasındadır."}, {"q": "Fartlek yöntemi ile ilgili hangisi YANLIŞTIR?", "o": ["İskandinav ve Alman koşucular geliştirmiştir", "Hem aerobik hem anaerobik kapasiteyi geliştirir", "Hız oyunu olarak da bilinir", "Sabit tempoda, düz pistte yapılır", "Doğal arazide hızlı-yavaş tempoyla yapılır"], "a": 3, "e": "Fartlek tempo değişimlidir ve arazide yapılır."}, {"q": "Çocuklarda aerobik verim kızlarda en iyi hangi yaşlarda antrene edilir?", "o": ["6-7", "15-16", "9-10", "12-13", "17-18"], "a": 3, "e": "Kızlarda 12-13, erkeklerde 13-14 yaş."}, {"q": "Ortaokul çağındaki çocuklarda dayanıklılık test mesafesi en fazla kaç metre olmalıdır?", "o": ["600 m", "400 m", "2000 m", "1200 m", "3000 m"], "a": 3, "e": "Okul öncesi ve ilkokulda 600 m, ortaokulda 1200 m."}, {"q": "Gençlerde anaerobik eşik antrenmanının yüklenme şiddeti hangi nabız aralığındadır?", "o": ["180-200 atım/dk", "90-110 atım/dk", "110-120 atım/dk", "130-150 atım/dk", "150-170 atım/dk"], "a": 4, "e": "AE 130-150, AnE 150-170 atım/dk."}, {"q": "Aşağıdakilerden hangisi egzersiz şiddetini belirleme yöntemlerinden biridir?", "o": ["Aerobik eşik", "Karvonen formülü", "İnterval yöntem", "VO2maks", "Anaerobik eşik"], "a": 1, "e": "Doğru cevap: Karvonen formülü.", "kb": 1}, {"q": "Aşağıdakilerden hangisi dayanıklılık antrenman şiddetini belirlerken referans alınmaktadır?", "o": ["Sporcunun isteği", "Antrenman koşulları", "Branşın gerektirdikleri", "Rakibin performansı", "Antrenörün isteği"], "a": 2, "e": "Doğru cevap: Branşın gerektirdikleri.", "kb": 1}, {"q": "Aşağıdakilerden hangisi dayanıklılık antrenmanlarının şiddetlerine göre sınıflandırılma şekillerinden biri değildir?", "o": ["VO2maks", "Anaerobik eşik", "Laktik aside tolerans", "Sürekli koşu", "Aerobik eşik"], "a": 3, "e": "Doğru cevap: Sürekli koşu.", "kb": 1}, {"q": "Aşağıdakilerden hangisi anaerobik eşik laktat düzeyini gösterir?", "o": ["7,7 mmol", "4,05 mmol", "2,0 mmol", "1,1 mmol", "2,7 mmol"], "a": 1, "e": "Doğru cevap: 4,05 mmol.", "kb": 1}, {"q": "Sedanterler ile maratoncular arasında VO2maks skorunu belirleyen en önemli parametre aşağıdakilerden hangisidir?", "o": ["Hemoglobin miktarı", "Atım sayısı", "Arterio-venöz O2 farkı", "Vital kapasite", "Atım volümü"], "a": 4, "e": "Doğru cevap: Atım volümü.", "kb": 1}, {"q": "Aşağıdakilerden hangisi laktik aside tolerans antrenmanlarının geliştirdiği yetilerden biridir?", "o": ["Anaerobik eşik", "Aerobik eşik", "VO2maks", "Süratte devamlılık", "Çabuk kuvvet"], "a": 3, "e": "Doğru cevap: Süratte devamlılık.", "kb": 1}, {"q": "İnterval antrenmanlarının şiddetine göre sınıflandırılması aşağıdakilerden hangisinde doğru bir şekilde verilmiştir?", "o": ["Aerobik eşik - Anaerobik eşik", "Kısa - Uzun", "Yaygın - Yoğun", "Sürekli - Aralıklı", "VO2maks - LAT"], "a": 2, "e": "Doğru cevap: Yaygın - Yoğun.", "kb": 1}, {"q": "Çocuk ve gençlerde dayanıklılık antrenmanı ilkeleri ile ilgili aşağıdaki ifadelerden hangisi yanlıştır?", "o": ["Antrenman yapmış ve yapmamış olanlar arasında da farklılıklar mevcuttur.", "Özellikle 8-12 yaş arası aerobik güç gelişimi baskındır.", "Dayanıklılık antrenmanlarının ergenlik dönemi öncesi gelişimi söz konusu değildir.", "Aerobik güç kronolojik yaşla beraber her iki cinsiyette de artmaktadır.", "Dayanıklılık özelliği gelişim dönemindeki cinsiyetler arasında fark vardır."], "a": 2, "e": "Doğru cevap: Dayanıklılık antrenmanlarının ergenlik dönemi öncesi gelişimi söz konusu değildir..", "kb": 1}, {"q": "Çocuk ve gençlerde aerobik dayanıklılık antrenmanları uygulamaları ile ilgili aşağıdaki ifadelerden hangisi yanlıştır?", "o": ["20 dk - 90 dk arası çalışılabilir.", "Antrenman nabız aralığı 140-160'tır.", "KAHmaks %50-75'tir.", "Borg skalasında 10-11 düzeyindedir.", "2-3 mmol/L laktat seviyesinde nabız veya hızdır."], "a": 1, "e": "Doğru cevap: Antrenman nabız aralığı 140-160'tır..", "kb": 1}, {"q": "Çocuk ve gençlerde anaerobik dayanıklılık antrenmanları uygulamaları ile ilgili aşağıdaki ifadelerden hangisi yanlıştır?", "o": ["Borg skalasında 13-14 düzeyindedir.", "Yüklenme şiddeti 150-170 atımdır.", "4 mmol/L laktat seviyesinde nabız veya hızdır.", "KAHmaks %60-80 düzeyindedir.", "Setler şeklinde toplam 6-8 dk ile 30 dk arası çalışılabilir."], "a": 3, "e": "Doğru cevap: KAHmaks %60-80 düzeyindedir..", "kb": 1}], "tf": [{"q": "VO2maks'ın %70'inin altında yapılan steady state egzersizde laktat miktarı artmaz.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Üretim ve uzaklaştırma dengededir.", "tf": true}, {"q": "Anaerobik eşik antrenmanla, VO2maks hiç artmasa bile gelişebilir.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Bu yüzden dayanıklılık sporlarında AnE daha yararlı bir göstergedir.", "tf": true}, {"q": "Göreceli VO2maks, L/dk birimiyle ifade edilir ve vücut ağırlığını dikkate almaz.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Göreceli değer ml/kg/dk'dir; L/dk mutlak değerdir.", "tf": true}, {"q": "Fartlek yöntemi 1920-1930 yılları arasında geliştirilmiştir.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "İskandinav ve Alman koşucular geliştirmiştir.", "tf": true}, {"q": "Sürekli yüklenme yönteminde şiddet VO2maks'ın %60'ının altında, süre 30 dakikanın üzerindedir.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Aerobik kapasiteyi geliştirir.", "tf": true}, {"q": "Kadınlarda maksimal kalp atım hızı erkeklere göre daha yüksektir.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Kadınlarda KAHmaks erkeklerden daha düşüktür.", "tf": true}, {"q": "Kısa süreli anaerobik (ATP-CP) egzersizlerde laktik asit birikiminden söz edilmez.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "15-20 sn'lik maksimal çalışmalarda enerji fosfojenlerden gelir.", "tf": true}]}, {"id": "hab3", "title": "Kuvvet Antrenmanı", "cards": [{"title": "Kuvvet antrenmanı neden yapılır?", "points": ["Birincil katkısı: sporcunun **yaralanmadan** uzun süre performans gösterebilmesi; eklemi saran kaslar ne kadar güçlü ve dengeliyse eklem o kadar korunur.", "Kuvvet, güç, sürat, yön değiştirme, sıçrama, fırlatma gibi özellikleri geliştirir; kas kütlesini artırır.", "En önemli antrenman değişkeni **yüktür**: hangi motor ünitelerin devreye gireceğini belirler.", "Yük **doğrudan (1-TM)** ya da **dolaylı** (tekrar sayısı + katsayı/formül) belirlenir."]}, {"title": "1-TM ve tekrar ilişkisi", "points": ["**Maksimal kuvvet:** bir kasın/kas grubunun **uygun formda tek tekrarlı** maksimal eforda üretebildiği kuvvettir.", "Yük ağırlaştıkça yapılabilen tekrar azalır. Örnek: 80 kg ile 10 tekrar yapılabiliyorsa **10-TM = 80 kg**, yani 1-TM'nin yaklaşık **%75**'i.", "1-TM testi için **çömelme (squat), göğüs itiş (bench press), omuzlama (clean)** gibi büyük kas gruplu, çok eklemli hareketler seçilir.", "**NSCA**, 1-TM testini **çocuklarda** ve sağlık için yeni başlayanlarda **onaylamaz**. Deneyimsizlerde 1-TM yerine **3-TM** önerilir.", "1-TM protokolü: ısınma (5-10 tekrar) → üst vücut %5-10, alt vücut %10-20 yük ekle → başarılıysa **2-4 dk** dinlen. İdeali 1-TM'nin **3-5 deneme setinde** bulunmasıdır."]}, {"title": "Dolaylı 1-TM hesaplama", "points": ["**10-TM testi:** neredeyse tüm sporculara uygundur; çocuk ve ergenler için daha güvenlidir (6-TM ve 8-TM'ye de uyarlanabilir).", "**Çocuklar:** hafif yükle **\"yoruluncaya kadar 20 tekrar\"** yöntemi; **barfiks, squat, göğüs itiş** kullanılır. **1-TM = katsayı × kaldırılan ağırlık** (ör. 40 kg × 9 tekrar → katsayı 1,22).", "**İleri düzey:** **Brzycki** → 1-TM = 100 × ağırlık / (102,78 – 2,78 × tekrar); **Epley** → 1-TM = (1 + 0,0333 × tekrar) × ağırlık.", "**Hazır tablolar** da kullanılır (ör. 90 kg × 10 tekrar → 1-TM ≈ **120 kg**); ancak yalnızca **kılavuz** olarak."]}, {"title": "Kuvvet türleri", "points": ["**Kuvvet:** direnci yenebilme yeteneği; **F = m × a**.", "**Maksimal kuvvet:** istemli olarak karşı konabilen en yüksek direnç. Konsantrik olarak bir tekrarda kaldırılana **maksimal dinamik kuvvet** denir.", "**Güç = kuvvet × hız** (P = m × A / t). İkiye ayrılır: maksimal istemli kasılmanın **%70'inden azı** en hızlı biçimde → **çabuk kuvvet**; **%70'inden fazlası** → **patlayıcı kuvvet**.", "**Başlama kuvveti:** hareketi başlatan, ilk **~30 milisaniyede** uygulanan kuvvet.", "**Kuvvette devamlılık:** çok tekrarlı kasılmalarda yorgunluğa rağmen dayanabilme."]}, {"title": "Akut değişkenler (1): analiz, seçim, sıra", "points": ["**İhtiyaç analizi:** spor dalı (hareket, fizyolojik ve **yaralanma** analizi) + sporcunun antrenman geçmişi ve fiziksel durumu.", "**Egzersiz seçimi:** deneyimli sporcuya **çok eklemli** hareketler; temel egzersizlerde yetkinlik kazanmadan karmaşık olanlara geçilmez.", "**Egzersiz sırası:** önce **büyük**, sonra **küçük** kas grupları. Başlangıçta bir **üst** bir **alt** vücut hareketi sırayla yapılır.", "**Set × tekrar:** 4×8 = 4 set, 8 tekrar. İzometrik çalışmada süre tekrar sayılır (3 × 30 sn ön köprü)."]}, {"title": "Akut değişkenler (2): tempo", "points": ["Tempo 3 haneyle yazılır: **eksantrik / izometrik / konsantrik** (saniye). **X** = mümkün olan en hızlı.", "Örnek **4/2/1** → bir tekrar **7 sn** sürer (4 sn iniş, 2 sn bekleme, 1 sn itiş).", "**Güç** (olimpik kaldırış) **X/X/X**; **kuvvet ve hipertrofi** **2/0/2**; **stabilizasyon** **4/2/1**.", "Gerilim altında kalma süresi: 10 tekrar × 2/0/2 = **40 sn**; 10 tekrar × 2/0/1 = **30 sn**."]}, {"title": "Akut değişkenler (3): şiddet, dinlenme, sıklık", "points": ["**Şiddet** = 1-TM yüzdesi. 1-TM 100 kg ise %75 → **75 kg**. Tek başına yanıltıcıdır; **tempo** ve **AZD** ile birlikte değerlendirilir.", "ATP-PCr: **30 sn**'de %70, **2,5-3 dk**'da %100 yenilenir. **Maksimal kuvvet**te setler arası **3-5 dk**, **hipertrofi**de **1 dk ve altı**.", "Ağır kuvvet antrenmanından sonra **48 saat** toparlanma gerekir. Haftalık sıklık: başlangıç düzeyi **2-3**, ileri/elit **4-5**.", "**Bölmeli (split routine)** sistemde her gün farklı bir bölge çalışılır."]}, {"title": "Amaca göre yük", "points": ["**Kuvvet (maksimal):** 1-TM'nin **%85 ve üzeri**, **3-6 set**, **≤6 tekrar** (3-6).", "**Hipertrofi:** **%67-85**, **3-6 set**, **6-12 tekrar**.", "**Kassal dayanıklılık:** **%65'in altı**, **2-3 set**, **15-25 tekrar**.", "Kural: **yüksek yük + az tekrar → kuvvet**; **düşük yük + çok tekrar → dayanıklılık**."]}, {"title": "Setleme yöntemleri", "points": ["**Klasik setleme:** 1-TM **%40-60**, **3 set**, 8-16 tekrar, setler arası 1-2 dk; sporcu ve rekreatif herkes kullanabilir.", "**Süper set:** iki farklı kas grubuna arka arkaya iki egzersiz; ör. **biceps + triceps** (agonist-antagonist, itme-çekme). Orta-ileri düzey ve vücut geliştiriciler kullanır.", "**Üçlü setleme:** **aynı kas grubuna** dinlenmeden **3 egzersiz** (ör. squat + lunge + ...); setler arası 2-3 dk; üst düzey sporculara uygundur.", "**Piramidal:** her basamakta **yük artar, tekrar azalır**. Klasik piramitte %80-100, 1-5 tekrar, 5-6 set; **elit** sporcular ve maksimal kuvvet için kullanılır. **Çift piramitte** biri ters dönmüş iki piramit vardır.", "**Basamaklamalı artan:** aynı yükle **iki set**, sonra yük artışı (toplam **6 set**). **Dalgasal:** yük ve tekrar dalga gibi artıp azalır.", "**Dairesel (istasyon):** **8 veya 12** hareket çok az dinlenmeyle arka arkaya. Çalışma **30-90 sn**, dinlenme **15-90 sn**, setler arası 1-2 dk."]}, {"title": "Çocuk ve gençlerde kuvvet", "points": ["Ergenlik öncesi kuvvet artışı çoğunlukla **sinirsel (nörolojik)** faktörlerledir, çünkü **anabolik hormonlar düşüktür**.", "8-20 haftalık antrenmanla ergenlerde kuvvet yaklaşık **%30** artar (bazılarında %74'e kadar). Uygun uyaran: 1-TM'nin **%60-70**'i, **1-2 set 10-15 tekrar**.", "Haftada **2-3** kez, **gün aşırı**; her antrenmandan sonra **48-72 saat** toparlanma. Haftada 1 gün yalnızca mevcut düzeyi korur.", "Doğru gözetimle risk düşüktür; liselilerde **halterde yaralanma**, cimnastik, basketbol ve futboldan daha azdır.", "Önce **vücut ağırlığı** (squat, lunge, şınav, yatay barfiks), sonra elastik bant, sağlık topu, serbest ağırlık. **Makinelerden uzak durulmalı**, çünkü stabilizasyonu ortadan kaldırırlar.", "Gençlerde **1-3 set** yeterli uyaran sağlar. Serbest ağırlık programında **\"1 itme – 1 çekme\"** yapısı korunur."]}, {"title": "ASCA'nın 4 seviyesi", "points": ["**Seviye 1 (6-9 yaş):** vücut ağırlığı ve hafif dirençler (sopa, lastik), **15+ tekrar**.", "**Seviye 2 (9-12 yaş):** **10-15-TM** (~%60), basit serbest ağırlıklar.", "**Seviye 3 (12-15 yaş):** **8-15-TM** (~%70); omuzlama, koparma, deadlift, squat gibi **karmaşık kaldırışlardan kaçınılır**.", "**Seviye 4 (15-18 yaş):** **6-15-TM** (~%80); yetişkin programlarına geçiş, olimpik kaldırışlar.", "Yetkinlik örnekleri: ön köprüde **60 sn** (seviye 2) → **90 sn** (seviye 3-4); seviye 4'te **5 nordic hamstring**."]}, {"title": "Vücut merkez bölgesi (core)", "points": ["Omuzlar ile diz arası: karın, kalça, alt bel, üst bacak. **Kollar ve bacaklar arasındaki bağlantı**; \"güç evi\" de denir. **29 çift kas**tan oluşur.", "Görevleri: postür, koordinasyon, denge, **kuvvetin emilimi, üretimi ve transferi**; hareketin süreci ve sonucundan sorumludur. (**Eklem hareket açıklığını artırmak görevi değildir.**)", "**Core stabilizasyonu:** yürüme, koşma, yüzmede kol ve bacaklar hareket ederken **omurgayı tutabilme** yeteneği.", "Sürekli mekik **alt bel sakatlığına** yol açabilir. Stabilizasyon: 12-20 tekrar, tempo **4/2/1**; kuvvet: üç düzlemde (sagital mekik, frontal yan köprü, transvers rotasyon) 8-12 tekrar.", "Gençler için **6-10 hareket**, **8-20 tekrar**, 2-3 set, haftada 2-3 kez, 60-90 sn dinlenme."]}], "questions": [{"q": "Bir sporcu squat'ı 80 kg ile en fazla 10 kez yapabiliyorsa bu yük 1-TM'nin yaklaşık yüzde kaçıdır?", "o": ["%90", "%50", "%75", "%60", "%100"], "a": 2, "e": "10-TM yaklaşık 1-TM'nin %75'ine karşılık gelir."}, {"q": "1-TM testinin çocuklarda uygulanmasını onaylamayan kuruluş hangisidir?", "o": ["IOC", "UEFA", "WADA", "NSCA (Amerikan Ulusal Kuvvet Kondisyon Birliği)", "ACSM"], "a": 3, "e": "NSCA çocuklarda ve sağlık için yeni başlayanlarda 1-TM testini onaylamaz."}, {"q": "Çocuklarda 1-TM kestiriminde kullanılan yöntem hangisidir?", "o": ["3-TM testi", "Wingate testi", "Maksimal 1 tekrar denemesi", "Hafif yükle yoruluncaya kadar 20 tekrar", "Maksimal çömelme-kalkma testi"], "a": 3, "e": "Kaldırılan yük katsayıyla çarpılarak 1-TM bulunur."}, {"q": "Epley formülüne göre 80 kg'ı 6 kez kaldıran sporcunun 1-TM'si yaklaşık kaçtır?", "o": ["86 kg", "120 kg", "96 kg", "80 kg", "106 kg"], "a": 2, "e": "(1 + 0,0333 × 6) × 80 ≈ 96 kg."}, {"q": "Maksimal istemli kasılmanın %70'inden yüksek dirence mümkün olan en hızlı şekilde karşı koyma hangisidir?", "o": ["Başlama kuvveti", "Patlayıcı kuvvet", "Çabuk kuvvet", "Maksimal statik kuvvet", "Kuvvette devamlılık"], "a": 1, "e": "%70'in altı çabuk kuvvet, üstü patlayıcı kuvvettir."}, {"q": "Hareketi başlatmak için ilk yaklaşık 30 milisaniyede uygulanan kuvvete ne denir?", "o": ["Başlama kuvveti", "Çabuk kuvvet", "Maksimal kuvvet", "Patlayıcı kuvvet", "Reaktif kuvvet"], "a": 0, "e": "Başlama kuvveti, hem patlayıcı hem çabuk kuvvette hareketi başlatır."}, {"q": "4/2/1 temposunda bir tekrarın toplam süresi kaç saniyedir?", "o": ["3", "8", "4", "6", "7"], "a": 4, "e": "4 sn eksantrik + 2 sn izometrik + 1 sn konsantrik."}, {"q": "Kuvvet ve hipertrofi antrenmanlarında önerilen hareket temposu hangisidir?", "o": ["1/1/1", "5/5/5", "4/2/1", "2/0/2", "X/X/X"], "a": 3, "e": "Güçte X/X/X, stabilizasyonda 4/2/1 kullanılır."}, {"q": "Hipertrofi amaçlı antrenmanlarda setler arası dinlenme ne kadar olmalıdır?", "o": ["3-5 dakika", "1 dakika ve altı", "24 saat", "10 dakika", "5-10 dakika"], "a": 1, "e": "Biriken laktat ve hipoksi kasın enine kesit artışına katkı sağlar."}, {"q": "Hipertrofi için önerilen yük hangisidir?", "o": ["1-TM %100, 1 set, 1 tekrar", "1-TM %30, 3-5 set, 3 tekrar", "1-TM %85+, 3-6 set, 3-6 tekrar", "1-TM %65 altı, 2-3 set, 15-25 tekrar", "1-TM %67-85, 3-6 set, 6-12 tekrar"], "a": 4, "e": "Kuvvet %85+, hipertrofi %67-85, kassal dayanıklılık %65 altı."}, {"q": "Biceps curl ile triceps push-down'un dinlenmeden arka arkaya yapıldığı yöntem hangisidir?", "o": ["Klasik setleme", "Dalgasal yöntem", "Süper set", "Üçlü setleme", "Piramidal yöntem"], "a": 2, "e": "Süper set iki farklı (genelde karşıt) kas grubuna yöneliktir."}, {"q": "Aynı kas grubuna dinlenmeden üç farklı egzersizin uygulandığı yöntem hangisidir?", "o": ["Süper set", "Basamaklamalı artan", "Çift piramidal", "Dairesel antrenman", "Üçlü setleme"], "a": 4, "e": "Üç hareket bitince bir set tamamlanır; üst düzey sporculara uygundur."}, {"q": "Dairesel (istasyon) antrenmanda bir istasyondaki çalışma süresi genellikle ne kadardır?", "o": ["1-2 saniye", "10-15 dakika", "3-5 dakika", "5-10 saniye", "30-90 saniye"], "a": 4, "e": "Dinlenme 15-90 sn, setler arası 1-2 dk."}, {"q": "Ergenlik öncesi çocuklarda kuvvet artışının ana kaynağı nedir?", "o": ["Sinirsel (nörolojik) uyum", "Anabolik hormon artışı", "Kemik büyümesi", "Yağ kaybı", "Kas hipertrofisi"], "a": 0, "e": "Ergenlik öncesinde anabolik hormonlar düşüktür."}, {"q": "ASCA'ya göre 12-15 yaş (Seviye 3) için hangisi DOĞRUDUR?", "o": ["Karmaşık kaldırışlardan (clean, snatch) kaçınılır", "1-TM'nin %90'ı ile çalışılır", "Yetişkin programına tamamen geçilir", "Sadece sopa ve lastik kullanılır", "Olimpik kaldırışlar temel egzersizdir"], "a": 0, "e": "Seviye 3'te 8-15-TM (~%70) kullanılır; olimpik kaldırışlar seviye 4'tedir."}, {"q": "Aşağıdakilerden hangisi core (vücut merkez bölgesi) görevlerinden biri DEĞİLDİR?", "o": ["Kol ve bacak arasında bağlantı sağlamak", "Eklem hareket açıklığını artırmak", "Kuvvet üretmek ve aktarmak", "Postürü desteklemek", "Kuvvetin emilimine destek olmak"], "a": 1, "e": "Eklem hareket açıklığı esneklik antrenmanının konusudur."}, {"q": "Çocuklarda kuvvet antrenmanıyla ilgili hangisi YANLIŞTIR?", "o": ["Sabit ağırlık makineleri en uygun başlangıç aracıdır", "Haftada 2-3 kez gün aşırı yapılmalıdır", "Kız ve erkekler arasında büyük ayrım gerekmez", "Her antrenmandan sonra 48-72 saat toparlanma gerekir", "Önce vücut ağırlığı egzersizleri verilmelidir"], "a": 0, "e": "Makineler stabilizasyonu ortadan kaldırdığı için çocuklar makinelerden uzak tutulmalıdır."}, {"q": "Aşağıdakilerden hangisi \"maksimal kuvvet\" tanımına en yakın ifadedir?", "o": ["On (10) tekrarda üretilen en büyük kuvvet miktarıdır.", "Bir defada üretilen patlayıcı kuvvet miktarıdır.", "Vücudun uzun süren eforlara karşı ürettiği en büyük kuvvet miktarıdır.", "Bir kasın veya kas grubunun uygun formda tek tekrarlı maksimal eforda üretebildiği kuvvet miktarıdır.", "Vücudun zayıf kaslarının bir defada ürettiği maksimal kuvvet miktarıdır."], "a": 3, "e": "Doğru cevap: Bir kasın veya kas grubunun uygun formda tek tekrarlı maksimal eforda üretebildiği kuvvet miktarıdır..", "kb": 1}, {"q": "Sporcunun maksimal kuvvetini belirlemek için aşağıdakilerden hangi yöntem kullanılmaz?", "o": ["Bir tekrar maksimum (1-TM) test protokolü", "On tekrar (10-TM) test protokolü", "Yoruluncaya kadar 20 tekrar testi", "Maksimum çömelme-kalkma testi", "Epley ve Brzycki 1-TM kestirim yöntemi"], "a": 3, "e": "Doğru cevap: Maksimum çömelme-kalkma testi.", "kb": 1}, {"q": "Çocuk ve gençlerin antrenman yüklerini belirlemede hangi değerlendirme yöntemi kullanılmamalıdır?", "o": ["1-TM", "8-TM", "10-TM", "20-TM", "Katsayı aracılığı 1-TM hesaplama yöntemi"], "a": 0, "e": "Doğru cevap: 1-TM.", "kb": 1}, {"q": "Kuvvet özelliğini geliştirmek için aşağıdaki değişkenlerden hangisi kullanılmalıdır?", "o": ["1-TM %85 ve üzeri, 3-6 set, 3-6 tekrar", "1-TM %30-60 arası, 2-5 set, 2-6 tekrar", "1-TM %67-85 arası, 3-6 set, 6-12 tekrar", "1-TM %65 ve altı, 2-3 set, 15-25 tekrar", "1-TM %30 ve altı, 3-5 set, 3 tekrar"], "a": 0, "e": "Doğru cevap: 1-TM %85 ve üzeri, 3-6 set, 3-6 tekrar.", "kb": 1}, {"q": "Bir sporcu çömelme (squat) hareketini 2/0/1 tempoda 10 kez yaparsa bu hareket toplam kaç saniyede tamamlanmış olur?", "o": ["10", "20", "25", "28", "30"], "a": 4, "e": "Doğru cevap: 30.", "kb": 1}, {"q": "İki karşıt kas grubuna (agonist ve antagonist) yönelik üst üste yapılan 10 tekrarlı setleme yöntemi aşağıdakilerden hangisidir?", "o": ["Dairesel antrenman yöntemi", "Üçlü setleme yöntemi", "Piramidal yöntem", "Süper set yöntemi", "Klasik setleme yöntemi"], "a": 3, "e": "Doğru cevap: Süper set yöntemi.", "kb": 1}, {"q": "Çocuklar için direnç antrenman programı hazırlarken başlangıç düzeyi sporcular için hangi şiddet oranı tercih edilmelidir?", "o": ["1-TM %85-100", "1-TM %85-90", "1-TM %70-75", "1-TM %60-70", "Vücut ağırlığı ya da 1-TM %50-70"], "a": 4, "e": "Doğru cevap: Vücut ağırlığı ya da 1-TM %50-70.", "kb": 1}, {"q": "Uzun süreli sporcu gelişiminde çocuk ve gençlerin direnç antrenmanına başlaması kaç seviyeye ayrılmaktadır?", "o": ["2", "3", "4", "5", "6"], "a": 2, "e": "Doğru cevap: 4.", "kb": 1}, {"q": "Aşağıdakilerden hangisi vücut merkez bölgenin (core) görevlerinden değildir?", "o": ["Bacak ve kollar arasındaki bağlantıyı sağlar.", "Kuvvet üretiminden ve bütün vücut boyunca transferinden sorumludur.", "Hareketlerin sürecinden ve sonucundan sorumludur.", "Kuvvet emilimine destek olur.", "Eklem hareket açıklığının artırılmasını sağlar."], "a": 4, "e": "Doğru cevap: Eklem hareket açıklığının artırılmasını sağlar..", "kb": 1}, {"q": "Yürüme, koşma, yüzme gibi aktiviteler sırasında kol ve bacaklar hareket hâlindeyken omurgayı tutabilme yeteneğini aşağıdakilerden hangisi ifade eder?", "o": ["Omuz kuşağı stabilizasyonu", "Vücut merkez bölge (core) stabilizasyonu", "Kalça stabilizasyonu", "Omurga stabilizasyonu", "Karın kasları stabilizasyonu"], "a": 1, "e": "Doğru cevap: Vücut merkez bölge (core) stabilizasyonu.", "kb": 1}], "tf": [{"q": "Çocuk ve ergenlerde 10-TM testi, 1-TM testine göre daha uygun kabul edilir.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Büyük ağırlıklar sakatlanma riskini artırır.", "tf": true}, {"q": "Piramidal yöntemde her basamakta yük azalırken tekrar sayısı artar.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Tersi: yük artar, tekrar azalır.", "tf": true}, {"q": "Maksimal kuvvet antrenmanında setler arasında 3-5 dakika dinlenme verilir.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Böylece fosfojenler tamamen yenilenir.", "tf": true}, {"q": "Kuvvet antrenmanında egzersiz sırası küçük kas gruplarından büyüklere doğrudur.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Önce büyük, sonra küçük kas grupları çalışılır.", "tf": true}, {"q": "Haftada bir gün kuvvet antrenmanı çocuklarda yeterli gelişimi sağlar.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Bir gün sadece korur; gelişim için haftada 2-3 gün gerekir.", "tf": true}, {"q": "Lise öğrencilerinde halterde yaralanma oranı futbol ve basketboldan daha düşüktür.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Doğru gözetim ve kademeli ilerlemeyle risk düşüktür.", "tf": true}, {"q": "Vücut merkez bölgesi 29 çift kastan oluşur.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Yüzeyde hareket kasları, derinde stabilizasyon kasları bulunur.", "tf": true}]}, {"id": "hab4", "title": "Sürat, Çeviklik ve Yön Değiştirme", "cards": [{"title": "Sürat nedir?", "points": ["Vücudu ya da bir bölümünü **en yüksek hızla / en kısa zamanda** hareket ettirebilme yeteneğidir.", "Sürat çalışmasıyla dayanıklılık gelişebilir ama **dayanıklılık çalışmasıyla sürat gelişmez**.", "Büyük oranda **genetiktir** (\"sprinter doğulur\"); antrenmanla **en az gelişen**, ama **en erken çalışılabilen** yetidir.", "Etkileyen faktörler: **hızlı kasılan lif (FT)** oranı, **MSS** gelişimi, maksimal kuvvet, kas içi/arası koordinasyon, reaksiyon, **aerobik dayanıklılık**, ATP-CP depoları, esneklik. **Vücut yağı olumsuz etkiler.**"]}, {"title": "Sinir sistemi ve miyelinleşme", "points": ["Fetal hayatın **6. ayından** sonra yeni sinir hücresi oluşmaz; büyüme mevcut hücrelerin büyümesiyle olur.", "Sinir sistemi **5-6 yaşına** kadar yetişkin boyutunun **%90**'ına ulaşır; **12-13 yaştan** sonra gelişim çok yavaşlar.", "**Miyelinleşme** = aksonu saran kılıfın kalınlaşması; iletiyi hızlandırır. 16. gebelik haftasında başlar, **en hızlı dönemi ergenliktir**.", "Bu yüzden çocukta **çok yönlü hareket eğitimi** ve **geç uzmanlaşma** önerilir."]}, {"title": "Sürat türleri (4 sistematik tür)", "points": ["Antrenman biliminde sürat 4'e ayrılır: **reaksiyon, ivmelenme, maksimal sürat, süratte devamlılık**. (\"Koşma sürati\" bu listede yoktur.)", "Sporda görünümleri: tepki, aksiyon, hareket, duruma tepki, **karar verme**, **öncelleme**, **algılama** sürati.", "**İvme** = sürat artış hızı. **Akselerasyon** pozitif, **deselerasyon** negatif ivmelenmedir. Koşuda hız, **adım uzunluğu × adım frekansı** uyumuna bağlıdır.", "**Hareket sürati:** **devirsiz (asiklik)** → boks, gülle, eskrim; **devirli (siklik)** → koşu, bisiklet."]}, {"title": "Reaksiyon sürati", "points": ["Ani uyarana en kısa sürede verilen tepkidir. Alt sınırı yaklaşık **0,10 sn**'dir. Motivasyon, uyarılmışlık ve yoğunlaşmadan etkilenir; **her yaşta** geliştirilebilir.", "**Basit reaksiyon:** bilinen tek uyarana tepki; antrenmanla **%10-15** gelişir. Görsel **0,15-0,20 sn**, işitsel **0,12-0,17 sn**, dokunsal **0,09-0,18 sn**.", "**Karmaşık reaksiyon:** **birden fazla** uyaran, sporcu nasıl tepki vereceğini önceden bilmez. Daha uzundur; antrenmanla **%30-40** gelişir. Ör. \"sağ el kalkarsa kaç, sol el kalkarsa kovala\".", "Basit reaksiyon yöntemleri: **tekrarlama, analitik, duyuşsal** (sporcu koştuğu süreyi tahmin eder). Karmaşık reaksiyon: **hareket eden nesnelere tepki**, **seçilmiş tepkiler**."]}, {"title": "100 m'nin aşamaları ve süratte devamlılık", "points": ["Collins'e göre: başlama-reaksiyon **0-10 m** → akselerasyon **10-40 m** → geçiş 30-35 m → **maksimum hız 40-70 m** → sürati koruma 70-100 m.", "Maksimal koşu süratine **4-5 sn**'de ulaşılır; elit sprinterler maksimal hıza **50-80 m**'de ulaşır.", "**Süratte devamlılık:** yorgunluğa rağmen sürati koruma. Etkisi **200-400 m**'de belirgindir; **laktik anaerobik** sistem kullanılır; antrenmanla **büyük ölçüde** gelişir.", "Süratte devamlılık **14-16 yaştan** itibaren, kontrollü başlar. Yarış mesafesinden **%10-20 uzun** mesafelerle, tekrar ve intensif interval yöntemiyle çalışılır.", "Hareket sürati 10-12 yaşa kadar artar; ergenlikte **erkeklerde artmaya devam eder**, kızlarda duraklar."]}, {"title": "Çeviklik", "points": ["Bir **uyarana tepki** olarak hız veya yön değiştirerek yapılan hızlı **tüm vücut** hareketidir.", "Özellikleri: başlama, yön değiştirme, hızlanma/yavaşlama; **tüm vücut**; mekânsal-zamansal **belirsizlik**; **sadece açık becerileri** kapsar; fiziksel + **bilişsel** bileşeni vardır.", "**Çabukluk** yavaşlama ve yön değiştirmeyi **kapsamaz**; çevikliği ayıran fark **beklenmedik** görevleri çözmektir.", "Doğrusal sprint ile çeviklik arasındaki ilişki **zayıftır**; bu yüzden ayrı ve branşa benzer kalıplarla çalışılır. Çeviklik testi bir **reaksiyon/karar verme** unsuru içermelidir.", "Testler: **İllinois, 5-0-5, Pro-çeviklik, T testi**, üç koni, dört köşe, altıgen."]}, {"title": "Yön değiştirme hızı", "points": ["Hızlanma, dönme ve yeniden hızlanma yeteneği; **momentumu en hızlı şekilde taşıyabilme**. Hem **kapalı** (planlı) hem **açık** (uyarana tepki) becerilerde gerekir.", "Etkili yön değiştirme: **ağırlık merkezini alçaltma** (ör. liberonun manşet duruşu), **eğim oluşturma**, **açı oluşturma (angulasyon)**.", "Dikey kuvvet çalışmaları (squat, deadlift, olimpik) tek başına etkili bulunmadı. Etkili olanlar: **yatay ve yana sıçramalar**, ağırlıkla dikey sıçrama, spora özgü yön değiştirme.", "Seviyeye göre: başlangıç **<5 m giriş**, keskin dönüş yerine dönemeç; orta seviye **~10 m giriş**, tek uyaran; ileri seviye **>90°** dönüşler, dar alan oyunları.", "Test skorunda **%10 düşüş** olursa o gün çeviklik çalışması bırakılır."]}, {"title": "Sürat antrenmanında yük", "points": ["**Şiddet** daima **maksimal**dir (%100). Submaksimal çalışmalar daha çok **süratte devamlılığı** geliştirir.", "**Kapsam:** ivmelenme için **25-35 m**, maksimal hız için 25-35 + 20-45 m. Yaklaşık **8 tekrar**, **3-5 set** aşılmamalı.", "**Dinlenme:** tekrarlar arası **1-3 dk**, setler arası **~10 dk**. İvmelenmede **her 10 m için 1 dk**. 15 sn'yi aşan koşularda laktatın atılması için **15-60 dk** gerekir.", "Fonksiyonel kuvvet ön koşulu: derinlik sıçramalarından önce vücut ağırlığının **1,5-2 katıyla squat** yapabilmek."]}, {"title": "Sürat antrenmanı ilkeleri", "points": ["**Erken yaşta** başlanır; sürat ve çabukluk her antrenmanda yer alır; öncesinde **yoğun ısınma** yapılır.", "Antrenmanın **ana bölümünün başında**, **dinlenikken** çalışılır. Yorgunluk görülünce bırakılır.", "3-5 sn'lik patlayıcı yüklenmeden sonra **1-1,5 dk** etkin dinlenme verilir (CP yenilensin).", "Sabah sürat yapıldıysa akşam şiddetli sürat yapılmaz; **maçtan hemen sonra** yapılmaz, **maçtan önceki gün** kısa sprintler yapılabilir.", "**Sürat bariyerini** aşmak için yöntem ve araçlar **çeşitlendirilir**; kuvvet, koordinasyon ve aerobik dayanıklılık da birlikte çalışılır.", "Aerobik dayanıklılığın sürate katkısı: **tekrarlı sprintlerde toparlanmayı hızlandırır**."]}, {"title": "Sürat yöntemleri", "points": ["En belirleyici yöntem **tekrar yöntemi**dir (maksimal şiddet, tam dinlenme). Futbolda mesafe **20-30 m**, voleybolda **5-10 m**; **8 tekrara** kadar.", "Yeni başlayanlarda **aşamalı artan yüklenme**; **kolaylaştırılmış koşullar** (arkadan rüzgâr, yokuş aşağı) ve **ek dirençle** tekrar da kullanılır.", "**İntensif interval:** 6-12 tekrar, tam olmayan dinlenme → sprintte devamlılık.", "**Oyunla bağlantılı sürat:** müsabakaya aktarımı kolaydır ve eğlencelidir.", "İvmelenme çalışmaları: farklı duruşlardan, farklı zeminlerden, paraşütle, farklı uyaranlarla çıkışlar; **pliometrik** sıçramalar."]}, {"title": "Çocuk ve gençlerde sürat", "points": ["Sürat antrenmanı **5-7 yaşta koordinasyonla** başlar; **8-10 yaşta** en yüksek hareket sürati ve adım sıklığına ulaşılır; 12-14 yaşta branşa özgü sürat çalışılır.", "**6-11 yaş**ta hareket sürati önemli ölçüde artar (sinir sistemi). **12-15 yaş**ta çeviklik ve reaksiyon yetişkin değerine ulaşır; 14 yaş erkeklerde **testosteron** etkisiyle büyük artış olur.", "En uygun egzersiz **sprint koşusu**. Süre **1-6 sn**; tekrarlar arası **3-9 dk**, setler arası **10-12 dk** dinlenme. Maksimal/supramaksimal **5-10**, submaksimal **10-20** tekrar.", "Ergenlik öncesi koşular **<7 sn**, 4-8 tekrar, 2-3 dk ara; mesafe yıllar içinde 20 m'den 40-60 m'ye çıkar.", "**7-11 yaş**: koordinasyon, koşu tekniği, vücut ağırlığıyla kuvvet, esneklik (**süratte devamlılık yok**). Dinlenmeler **yürüyerek** yapılır.", "Güçlükler: iyi **koordinasyon** gerektirmesi, kemik-kas gelişiminin tamamlanmamış olması, **kuvvet yetersizliği**, psikolojik zorlanma.", "Yeni başlayanlara oyunlar: reaksiyon çalışmaları, **köşe kapmaca**, slalom sprintler, ivmelenme alıştırmaları, **stafet** (front squat gibi kuvvet hareketleri değil)."]}, {"title": "Koşu tekniği ve adım", "points": ["İyi koşunun merkezinde **dik pozisyon** vardır; öne eğilmek yavaşlatır. Baş dik, gözler ileride.", "Kollar gevşek, **dirsekler 90°**, eller çenenin önüne kadar gelir.", "Adımları zorla uzatmak hızı **engeller**. Maksimum hızdaki adım uzunluğu **bacak boyunun 2,1-2,5 katıdır**.", "**Yatay sıçrama kuvveti** ile sprint arasında pozitif ilişki vardır (durarak uzun atlama, üç adım atlama)."]}], "questions": [{"q": "Antrenman biliminde süratin dört türü arasında yer ALMAYAN hangisidir?", "o": ["Koşma sürati", "Süratte devamlılık", "İvmelenme sürati", "Reaksiyon sürati", "Maksimal sürat"], "a": 0, "e": "Dört tür: reaksiyon, ivmelenme, maksimal sürat, süratte devamlılık."}, {"q": "Sinir sistemi kaç yaşına kadar yetişkin boyutunun yaklaşık %90'ına ulaşır?", "o": ["2-3", "5-6", "9-10", "12-13", "16-18"], "a": 1, "e": "12-13 yaştan sonra gelişim çok yavaşlar."}, {"q": "Miyelinleşmenin en hızlı olduğu dönem hangisidir?", "o": ["Ergenlik dönemi", "Okul öncesi", "Doğum öncesi", "0-1 yaş", "Yetişkinlik"], "a": 0, "e": "Bu yüzden sportif becerilerin gelişimi için en etkili dönem ergenliktir."}, {"q": "Antrenmanla en fazla geliştirilebilen reaksiyon türü hangisidir?", "o": ["Dokunsal reaksiyon (%10-15)", "Karmaşık reaksiyon (%30-40)", "Basit görsel reaksiyon (%10-15)", "Basit işitsel reaksiyon (%10-15)", "Hiçbiri geliştirilemez"], "a": 1, "e": "Basit reaksiyon %10-15, karmaşık reaksiyon %30-40 gelişir."}, {"q": "\"Sağ el kalkarsa kaç, sol el kalkarsa kovala\" uyaranı hangi reaksiyon türüne örnektir?", "o": ["Basit görsel reaksiyon", "Dokunsal reaksiyon", "Karmaşık (seçmeli) reaksiyon", "Basit işitsel reaksiyon", "Refleks"], "a": 2, "e": "Birden fazla uyaran ve seçim vardır."}, {"q": "Boks, gülle atma ve eskrimdeki hareket sürati hangi türdür?", "o": ["Devirsiz (asiklik)", "İvmelenme", "Reaksiyon", "Devirli (siklik)", "Süratte devamlılık"], "a": 0, "e": "Koşu ve bisiklet devirlidir."}, {"q": "Collins'e göre 100 m'de maksimum hıza ulaşma aşaması hangi metreler arasındadır?", "o": ["20-30 m", "40-70 m", "0-10 m", "70-100 m", "10-40 m"], "a": 1, "e": "Sonrasında 70-100 m sürati koruma aşamasıdır."}, {"q": "Süratte devamlılık antrenmanlarına hangi yaştan itibaren başlanmalıdır?", "o": ["8-10 yaş", "10-12 yaş", "14-16 yaş", "20 yaş", "6-7 yaş"], "a": 2, "e": "Laktik asidi tolere etmek gerektiği için 14-16 yaştan itibaren kontrollü başlanır."}, {"q": "Aşağıdakilerden hangisi çevikliğin özelliklerinden DEĞİLDİR?", "o": ["Tüm vücut hareketini içermesi", "Yön değiştirmeyi içermesi", "Sadece kapalı becerileri kapsaması", "Hızlanma/yavaşlamayı içermesi", "Bilişsel bir bileşen içermesi"], "a": 2, "e": "Çeviklik sadece açık becerileri kapsar."}, {"q": "Voleybolda liberonun manşette ağırlık merkezini aşağı alması yön değiştirmenin hangi ilkesine örnektir?", "o": ["Ritim", "Adım uzunluğu", "Ağırlık merkezinin yerinin değişmesi", "Eğim oluşturma", "Açı oluşturma"], "a": 2, "e": "Kütle merkezi alçalınca stabilite ve hareket seçeneği artar."}, {"q": "İvmelenme sürati çalışmalarında dinlenme süresi için hangi kural uygulanabilir?", "o": ["Koşulan her 10 m için 1 dakika", "Dinlenme verilmez", "Her tekrarda 15 dakika", "Her 100 m için 1 dakika", "Her 10 m için 10 saniye"], "a": 0, "e": "Tam dinlenmeli tekrar yöntemi uygundur."}, {"q": "Sürat antrenmanı ilkeleriyle ilgili hangisi YANLIŞTIR?", "o": ["Şiddet maksimal olmalıdır", "Öncesinde yoğun ısınma yapılmalıdır", "Yorgunluk belirtisi görülünce bırakılmalıdır", "Erken yaşta başlanmalıdır", "Antrenman seansının sonunda, yorgunken çalışılmalıdır"], "a": 4, "e": "Sürat ana bölümün başında, dinlenikken çalışılır."}, {"q": "Futbolda tekrar yöntemiyle yapılan sürat çalışmasında koşu mesafesi genellikle ne kadardır?", "o": ["20-30 m", "200 m", "100-150 m", "60-80 m", "5-10 m"], "a": 0, "e": "Voleybolda 5-10 m; branşa göre seçilir."}, {"q": "Çocuklarda sprint çalışmasında performans süresi hangi aralıkta olmalıdır?", "o": ["20-30 saniye", "1-6 saniye", "45-60 saniye", "10-15 saniye", "2-3 dakika"], "a": 1, "e": "ATP-CP sisteminin kullanıldığı süredir."}, {"q": "Maksimum hızdaki adım uzunluğu bacak uzunluğunun yaklaşık kaç katıdır?", "o": ["4-5", "3-3,5", "2,1-2,5", "1-1,2", "0,5"], "a": 2, "e": "Adım uzunluğu bacak boyuyla yüksek ilişkilidir."}, {"q": "7-11 yaş grubunda çalışılmaması gereken yeti hangisidir?", "o": ["Koşu tekniği", "Koordinasyon", "Vücut ağırlığıyla kuvvet", "Esneklik", "Süratte devamlılık"], "a": 4, "e": "Süratte devamlılık 14-16 yaşta başlar."}, {"q": "Gelişmiş aerobik dayanıklılığın sürate katkısı nedir?", "o": ["Adım uzunluğunu artırır", "Tek sprintte maksimum hızı artırır", "Reaksiyon süresini kısaltır", "Tekrarlı sprintlerde toparlanmayı hızlandırır", "Çıkış hızını artırır"], "a": 3, "e": "Tek sprintte aerobik katkı azdır; tekrarlı sprintlerde önemlidir."}, {"q": "Aşağıdakilerden hangisi sürati olumlu etkileyen özelliklerden biri değildir?", "o": ["Hızlı kasılan fibril tipinin (FT) miktarı", "Aerobik dayanıklılık seviyesi", "Vücut yağ miktarı", "Koordinasyon yeteneği", "Esneklik düzeyi"], "a": 2, "e": "Doğru cevap: Vücut yağ miktarı.", "kb": 1}, {"q": "Aşağıdaki uyaranlarla verilen tepki eşleşmelerinden hangisi yanlıştır?", "o": ["Elma dersem çık, armut dersem çıkma (karmaşık reaksiyon)", "Sırtına değince çık (dokunsal reaksiyon, basit)", "Tabanca sesi ile kalk (işitsel reaksiyon, basit)", "Beyaz bayrak görünce koş (görsel reaksiyon, basit)", "Sağ el kalkarsa kaç, sol el kalkarsa kovala (görsel reaksiyon, basit)"], "a": 4, "e": "Doğru cevap: Sağ el kalkarsa kaç, sol el kalkarsa kovala (görsel reaksiyon, basit).", "kb": 1}, {"q": "Aşağıdakilerden hangisi çevikliğin özelliklerinden biri değildir?", "o": ["Tüm vücut hareketini içermesi", "Yön değiştirmeyi içermesi", "Hızlı hızlanma/yavaşlamayı içermesi", "Sadece kapalı becerileri kapsaması", "Bir uyaranın tanınması için fiziksel ve bilişsel bir bileşeni içermesi"], "a": 3, "e": "Doğru cevap: Sadece kapalı becerileri kapsaması.", "kb": 1}, {"q": "Sürat antrenmanlarında yük belirleme yöntemleri ile ilgili aşağıdaki eşleşmelerden hangisi yanlıştır?", "o": ["Kassal aktivite sırasında gerçekleştirilen işin kalitesi, uyaranın süresidir.", "Yüklenme ile dinlenme arasındaki zamansal oran, uyaranın sıklığıdır.", "Antrenmanda tamamlanan uyaran sayısı ve süresinin toplam miktarı, uyaranın kapsamıdır.", "Haftalık antrenman seansı sayısı, antrenmanın sıklığıdır.", "Yüklenmelere verilen ara, dinlenme süresidir."], "a": 0, "e": "Doğru cevap: Kassal aktivite sırasında gerçekleştirilen işin kalitesi, uyaranın süresidir..", "kb": 1}, {"q": "Aşağıdakilerden hangisi süratin genel antrenman ilkelerinden biri değildir?", "o": ["Sürat çalışmalarının küçük yaşlarda başlayabilmesi", "Süratin bir antrenman seansının sonunda çalışılması", "Maksimal sürat gelişimi için şiddetin yüksek olması", "Sürat bariyerinin aşılabilmesi için çok yönlü sürat antrenmanı yapılması", "Aerobik dayanıklılık, kuvvet, koordinasyon, esneklik çalışmalarının sürat antrenmanlarına eşlik etmesi"], "a": 1, "e": "Doğru cevap: Süratin bir antrenman seansının sonunda çalışılması.", "kb": 1}, {"q": "Aşağıdakilerden hangisi çocuklarda süratin geliştirilme ilkelerinden biri değildir?", "o": ["En uygun egzersiz türünün sürat koşuları olması", "Performans süresinin 1-6 sn aralığında olması", "Performansın hızının sadece submaksimal olması", "Dinlenik iken çalışılması", "Aynı seans içinde uyaranların değiştirilmesinin etkili bir yol olması"], "a": 2, "e": "Doğru cevap: Performansın hızının sadece submaksimal olması.", "kb": 1}, {"q": "Aşağıdakilerden hangisi süratin geliştirilmesi sırasında karşılaşılan güçlüklerden biri değildir?", "o": ["İyi bir koordinasyon gerektirmesi", "Kemik ve kas gelişiminin tamamlanmamış olması", "Psikolojik zorlamayı gerektirmesi", "Maksimal ve çabuk kuvvet düzeyinin yetersizliği", "Vücut yağ oranının düşük olması"], "a": 4, "e": "Doğru cevap: Vücut yağ oranının düşük olması.", "kb": 1}, {"q": "7-11 yaş grubunda çalışılacak yetiler ile ilgili aşağıdaki kavramlardan hangisi yanlıştır?", "o": ["Süratte devamlılık", "Koşu tekniği", "Vücut ağırlığı ile kuvvet", "Esneklik", "Koordinasyon"], "a": 0, "e": "Doğru cevap: Süratte devamlılık.", "kb": 1}, {"q": "Gelişmiş aerobik dayanıklılığın sürate olumlu etkisi ile ilgili aşağıdaki ifadelerden hangisi doğrudur?", "o": ["Özellikle tekrarlı sprintler sırasındaki toparlanmayı hızlandırır.", "Sprint hızını artırır.", "Koşuda adım uzunluğunu artırır.", "Çıkış hızını artırır.", "Ulaşılan maksimum sürati artırır."], "a": 0, "e": "Doğru cevap: Özellikle tekrarlı sprintler sırasındaki toparlanmayı hızlandırır..", "kb": 1}, {"q": "Süratte devamlılık yetisi ile ilgili aşağıdaki bilgilerden hangisi yanlıştır?", "o": ["Antrenmanla büyük ölçüde geliştirilebilen bir yetidir.", "Laktik anaerobik enerji kaynakları kullanılır.", "Laktik asidi tolere etme yeteneğine gereksinim duyulur.", "Gelişiminde kuvvet ve koordinasyon yeteneği önemlidir.", "10-12 yaşından itibaren çalışılmaya başlanabilir."], "a": 4, "e": "Doğru cevap: 10-12 yaşından itibaren çalışılmaya başlanabilir..", "kb": 1}], "tf": [{"q": "Dayanıklılık çalışmalarıyla sürat geliştirilebilir.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Sürat çalışması dayanıklılığı geliştirir ama tersi geçerli değildir.", "tf": true}, {"q": "Basit reaksiyon sürati antrenmanla %10-15 oranında geliştirilebilir.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Karmaşık reaksiyon ise %30-40 gelişir.", "tf": true}, {"q": "Çabukluk, yavaşlama ve yön değiştirmeyi kapsar.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Çabukluk bunları kapsamaz; çeviklik kapsar.", "tf": true}, {"q": "Doğrusal sprint sürati ile yön değiştirme hızı arasında yüksek bir ilişki vardır.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "İlişki zayıftır; bu yüzden ayrı çalışılır.", "tf": true}, {"q": "Sürat antrenmanında tekrarlar arasında 1-3 dk, setler arasında yaklaşık 10 dk dinlenme verilir.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Fosfojenlerin yenilenmesi için gereklidir.", "tf": true}, {"q": "Ergenlikte hareket sürati erkeklerde artmaya devam ederken kızlarda duraklar.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Kızlarda plato oluşur.", "tf": true}, {"q": "Sporcu bir çeviklik çalışmasında en iyi skorundan %10 düşüş gösterirse o gün çalışmaya devam edilmelidir.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "%10 düşüşte o günkü çeviklik çalışması sonlandırılır.", "tf": true}]}, {"id": "hab5", "title": "Esneklik, Hareketlilik, Koordinasyon ve Denge", "cards": [{"title": "Esneklik nedir?", "points": ["Bir eklem etrafındaki **hareket aralığıdır (ROM)**. Yetişkinlikte geliştirmek zordur, bu yüzden **genç yaşta** başlanmalıdır.", "Düzenli esneklik çalışması kas gerilimini azaltır, koordinasyona yardım eder, hareket genişliğini artırır, **zorlanma sakatlıklarını önler**.", "Yetersiz esneklik öğrenmeyi zorlaştırır; kuvvet, sürat ve koordinasyon gelişimini olumsuz etkiler.", "Esneklik **kasları** hedefler ve statik duruş ister; **mobilite (hareketlilik) eklemleri** hedefler ve akıcı hareket zinciri ister."]}, {"title": "Esnekliği etkileyen faktörler", "points": ["**Eklem yapısı:** kalça ve omuz gibi **küresel (spheroid)** eklemler en geniş ROM'a sahiptir; el bileği elipsoid, diz modifiye menteşe eklemdir.", "**Kas ve yumuşak doku:** tendon, bağ, fasya, eklem kapsülü, deri. **Elastiklik** = esnemeden sonra eski uzunluğa dönme; **plastisite** = yeni, daha uzun boyu koruma.", "**Gerilme toleransı:** ağrıya dayanabilme. Tolerans **arttıkça** esneklik artar.", "**Nöral kontrol**, **direnç antrenmanı** (uygun programla esneklik artar; aşırı kas kütlesi ROM'u azaltabilir), **aktivite düzeyi** (aktifler daha esnek).", "**Yaş ve cinsiyet:** gençler yaşlılardan, **kadınlar erkeklerden** daha esnektir. **Günün saati:** en yüksek esneklik **10-11** ve **16-17** saatlerinde, en düşük sabah erken."]}, {"title": "Esneklik ve yaş (PHV)", "points": ["Esneklik çalışmalarına **PHV başlamadan önce** başlanmalı.", "**9-12 yaş** (ergenlik öncesi) esneklik için **hassas dönemdir**.", "**15-16 yaşta** doruk esneklik düzeyine ulaşılır.", "Erkekler kas kütlesi kazandıkça esneklik düşer; ergenliğin ikinci yarısında en düşük düzeye iner. Kızlar her dönemde daha esnektir."]}, {"title": "Kas iğciği ve Golgi tendon organı", "points": ["**Proprioseptörler** uzama, gerilme ve basınca duyarlı duyu organlarıdır. İki önemli tane vardır: **kas iğciği** ve **Golgi tendon organı (GTO)**.", "**Kas iğciği:** kasın boyundaki değişime duyarlıdır. Hızlı gerilmede **gerilme (miyotatik) refleksini** tetikler ve kas kasılır. **Pliometri** bu refleksle çalışır.", "**Statik germe** yavaş olduğu için kas iğciğini **uyarmaz** → kas gevşer. **Balistik ve dinamik** germe kas iğciğini uyarır.", "**GTO:** tendon liflerinin içinde, kasın tendona birleştiği yerde bulunur. **Kuvvetli** gerilmeyle aktifleşir ve kasın **gevşemesine** yol açar (**otojenik inhibisyon / ters miyotatik refleks**). Bu bir koruma fonksiyonudur.", "İkisi **birlikte** çalışır: iğcik doğru gerilimi ayarlar, GTO aşırı yükte gevşetir."]}, {"title": "Germe türleri", "points": ["**Aktif germe:** germe kuvvetini kişinin kendi kasları sağlar. **Pasif germe:** dış kuvvetle (eş, ekipman) yapılır.", "**Statik germe:** son noktada **15-30 sn** (gerekirse 60 sn) beklenir. Refleks oluşmaz, **en güvenli** yöntemdir. Kısa süreli kuvvet, güç ve sıçramayı olumsuz etkileyebilir.", "**Balistik germe:** son noktada durmadan **yaylanma/sekme**. Miyotatik refleksi tetikler, yaralanma geçmişi olanlarda risklidir.", "**Dinamik germe:** spora özgü, kontrollü, artan hız ve ROM ile yapılır; yaylanma yoktur. Vücut ısısını artırır, güç ve sıçramayı destekler → **ısınmada** tercih edilir."]}, {"title": "PNF germe", "points": ["**PNF** = proprioseptif nöromüsküler fasilitasyon. **1950'lerde** geliştirildi, önce **fizyoterapide** kullanıldı.", "Proprioseptörler uyarılarak sinir-kas mekanizması desteklenir: **pasif germe → izometrik kasılma → daha fazla pasif germe**.", "**Tut-gevşe:** ağrı eşiğinde **10 sn izometrik** kasılma, **6 sn** gevşeme, sonra **30 sn** daha derin pasif germe.", "Diğer teknikler: **kas-gevşe** ve **agonist kasılmalı tut-gevşe** (karşılıklı inhibisyon da eklenir).", "Önerilen kullanım: ısınmada statik + dinamik; **soğumada** PNF."]}, {"title": "Esneklik çalışma ilkeleri", "points": ["Germeler **giderek artan** yüklenmeyle yapılır, ağrı dikkate alınır; nefes sakin ve derin olmalıdır.", "Sabah erken saatlerde kas iğciği duyarlıdır → **iyi ısınma** gerekir.", "**Ara verilirse** gelişme durur ve hızla başlangıca döner; bu yüzden düzenli çalışılır.", "Antrenmanda **ısınmadan sonra** ya da ana bölümün **sonunda** yer alır.", "Gelişim için haftada **5-6**, korumak için **2-3** seans. Haftada 2 kez, en az **5 hafta** çalışma esnekliği belirgin artırır.", "Çocuklarda **6-9 yaş** düşük şiddetli dinamik + statik; **11-14 yaş** statik + PNF + dinamik; **15-18 yaş** tüm teknikler. Çocuklara **PNF ile başlanmaz**."]}, {"title": "Hareketlilik (mobilite)", "points": ["Eklemleri hareket sınırlarının üst noktasına kadar, **istemli** ve mümkün olduğunca geniş açıda hareket ettirebilme yeteneğidir.", "Kaslar **fasya** ile birbirine bağlıdır; mobilite fasyayı antrenmana hazırlar. **Yalnızca ihtiyaç duyulan eklemlere** uygulanır.", "İyi esneklik her zaman iyi hareketlilik demek değildir; mobilite kontrol, koordinasyon ve kuvveti de içerir.", "**Dinamik** ve **fonksiyoneldir**, **çok eklemlidir**, antrenman ve müsabakadan **önce, ısınmada** yapılır.", "Mobilite isteyen eklemler: **ayak bileği, kalça, torasik omurga**. Stabilite isteyenler: **diz, glenohumeral eklem**."]}, {"title": "Köpük silindir (foam roller)", "points": ["**Kendi kendine miyofasyal salınım (SMR)** tekniğidir; kişi vücut ağırlığıyla yumuşak dokuya baskı uygular.", "Kas performansını düşürmeden ROM'u **akut olarak** artırır.", "Toparlanmayı hızlandırır, **DOMS** (gecikmiş kas ağrısı) etkilerini azaltır.", "Mobilite örnekleri: mobilite squat, kalça köprüsü, yana/öne hamle, **tırtıl yürüyüşü (inchworm)**, **T-Y-W** hareketi."]}, {"title": "Koordinasyon", "points": ["İstemli ve istemsiz hareketlerin **düzenli, uyumlu ve amaca yönelik** bir dizi içinde uygulanmasıdır. Fizyolojik temeli **MSS**'dir.", "**Kas içi** koordinasyon bir kasın içinde, **kaslar arası** koordinasyon agonist-antagonist kaslar arasındaki uyumdur.", "Koordinatif yetiler: **tepki (reaksiyon)**, **kinestetik ayrımlama** (hareketi en ekonomik yapma), **oryantasyon** (hareketin boyutunu kavrama), **denge**, **ritim**. (Yorumlama bir koordinatif yeti değildir.)", "**Ritim yetisi:** hareketin mekân boyutu içinde **akıcı ve dinamik değişimlere göre** hareket edebilme.", "Yorgunlukta koordinasyon bozulur; bu yüzden koordinasyon çalışması **ısınmadan hemen sonra** yapılır. Genel ve özel koordinasyon olarak ikiye ayrılır."]}, {"title": "Koordinasyon ve yaş", "points": ["Temel hareket ve spor becerileri en iyi **5-12 yaşta** çalışılır; antrene edilebilirlik **11-12 yaştan** sonra azalır.", "Kinestetik ayrımlama **7-10 yaş**, mekânsal algı **7-9 yaş** arasında sıçrar.", "Motor koordinasyonun doruk dönemi: **kızlarda 8-11**, **erkeklerde 9-11 yaş**.", "Aşamalar: **başlangıç (6-10)** → \"hızlı kazanç aşaması\", eğlence; **atletik gelişim (11-14)**; **özelleşme (15-18)**.", "Erken olgunlaşanlar koordinasyon ve denge için **daha fazla** alıştırmaya ihtiyaç duyar."]}, {"title": "Denge", "points": ["Vücut ağırlık merkezini **destek yüzeyi içinde tutabilme** yeteneğidir. **Görsel, vestibüler (iç kulak)** ve **somatosensoriyel (proprioseptif)** sistemler birlikte çalışır.", "**Statik denge:** belli bir pozisyonda (amut, planör). **Dinamik denge:** hareket ederken (denge tahtasında yürüme).", "Sıralama: **statikten dinamiğe**, **göz açıktan göz kapalıya**. En son **dinamik + gözler kapalı** gelir.", "Her yaş grubu haftada en az **3 gün**, her antrenmanda **10-15 dk** koordinasyon/çeviklik/denge çalışmalı; **ısınmadan hemen sonra** yapılmalı.", "Denge için hassas dönem **8-12 yaş**; denge **12-14 yaşta** olgunlaşır. Statik denge **17 yaştan sonra** en yüksek düzeye ulaşır."]}], "questions": [{"q": "Statik germe kas iğciği açısından neden daha güvenlidir?", "o": ["Yaylanma hareketleri içerir", "Kasın kasılmasını artırır", "Yavaş yapıldığı için gerilme (miyotatik) refleksini başlatmaz", "GTO'yu devre dışı bırakır", "Kas iğciğini en çok uyaran yöntemdir"], "a": 2, "e": "Kas iğciği uyarılmazsa kas gevşer ve daha fazla esner."}, {"q": "Kasta artan gerilimle GTO'nun uyarılıp kasın refleks olarak gevşemesine ne denir?", "o": ["Miyotatik refleks", "Uzama-kısalma döngüsü", "Otojenik inhibisyon (ters miyotatik refleks)", "Karşılıklı inhibisyon", "Süperkompansasyon"], "a": 2, "e": "GTO kasları inhibe ederek korur."}, {"q": "Pliometrik egzersizlerin fizyolojik temelinde hangi refleks yer alır?", "o": ["Miyotatik (gerilme) refleksi", "Patella refleksi", "Babinski refleksi", "Çekme refleksi", "Otojenik inhibisyon"], "a": 0, "e": "Uzama-kısalma döngüsünde kas iğciği devreye girer."}, {"q": "En geniş hareket aralığına sahip eklem tipi hangisidir?", "o": ["Sabit eklem", "Küresel (spheroid) eklem", "Elipsoid eklem", "Menteşe eklem", "Eyer eklem"], "a": 1, "e": "Kalça ve omuz küresel eklemlerdir ve tüm düzlemlerde hareket eder."}, {"q": "Esnekliğin günün hangi saatlerinde en yüksek olduğu bildirilmiştir?", "o": ["Sadece gece yarısı", "08-09 ve 20-21", "13-14 ve 23-24", "10-11 ve 16-17", "06-07 ve 22-23"], "a": 3, "e": "En düşük değerler sabah erken saatlerdedir."}, {"q": "Esneklik antrenmanı için hassas dönem hangisidir?", "o": ["3-5 yaş", "9-12 yaş (ergenlik öncesi)", "15-16 yaş", "25-30 yaş", "18-20 yaş"], "a": 1, "e": "Doruk esneklik ise 15-16 yaşta görülür."}, {"q": "Son pozisyonda durmadan yaylanma/sekme hareketiyle yapılan germe türü hangisidir?", "o": ["Pasif germe", "PNF germe", "Balistik germe", "Statik germe", "Dinamik germe"], "a": 2, "e": "Balistik germe miyotatik refleksi tetikler; dikkatle uygulanmalıdır."}, {"q": "PNF tut-gevşe tekniğinde ilk izometrik kasılma ne kadar sürdürülür?", "o": ["60 saniye", "2 dakika", "10 saniye", "1 saniye", "30 dakika"], "a": 2, "e": "10 sn kasılma, 6 sn gevşeme, sonra 30 sn pasif germe."}, {"q": "Statik germede önerilen bekleme süresi hangisidir?", "o": ["15-30 saniye", "1-3 saniye", "3-5 dakika", "10 dakika", "60 dakika"], "a": 0, "e": "Gerekirse 60 saniyeye kadar uzatılabilir."}, {"q": "Mobilite (hareketlilik) antrenmanlarıyla ilgili hangisi YANLIŞTIR?", "o": ["Isınmada yapılması önerilir", "Çok eklemli çalışmalardır", "Dinamik ve fonksiyoneldir", "Foam roller mobiliteyi artırabilir", "Kuvvet çıktısını düşürdüğü için antrenmandan önce yapılmamalıdır"], "a": 4, "e": "Mobilite antrenman ve müsabaka öncesinde, ısınmada önerilir."}, {"q": "Mobiliteye ihtiyaç duyan eklemler hangileridir?", "o": ["Ayak bileği, kalça, torasik omurga", "Parmak eklemleri", "Sadece diz", "Diz ve glenohumeral eklem", "Kafatası eklemleri"], "a": 0, "e": "Diz ve glenohumeral eklem daha çok stabiliteye ihtiyaç duyar."}, {"q": "Aşağıdakilerden hangisi koordinatif yetilerden biri DEĞİLDİR?", "o": ["Yorumlama yetisi", "Kinestetik ayrımlama yetisi", "Oryantasyon yetisi", "Denge yetisi", "Ritim yetisi"], "a": 0, "e": "Koordinatif yetiler: tepki, kinestetik ayrımlama, oryantasyon, denge, ritim."}, {"q": "Bir hareketi en ekonomik ve en iyi şekilde yapabilmeyi içeren koordinatif yeti hangisidir?", "o": ["Denge", "Oryantasyon", "Ritim", "Kinestetik ayrımlama", "Reaksiyon"], "a": 3, "e": "Kinestetik reseptörler kas liflerinde bulunur."}, {"q": "Motor koordinasyon gelişiminin doruk noktası erkeklerde hangi yaş aralığıdır?", "o": ["16-18", "9-11", "4-6", "13-15", "20-22"], "a": 1, "e": "Kızlarda 8-11, erkeklerde 9-11 yaş."}, {"q": "Denge antrenmanlarında doğru sıralama hangisidir?", "o": ["Statikten dinamiğe, göz açıktan göz kapalıya", "Sıralama önemli değildir", "Önce dengesiz yüzeyde dinamik çalışma", "Sadece göz kapalı çalışılır", "Dinamikten statiğe, göz kapalıdan göz açığa"], "a": 0, "e": "En son dinamik ve gözler kapalı alıştırmalar gelir."}, {"q": "Dengeyi sağlayan duyu sistemleri arasında hangisi YER ALMAZ?", "o": ["Görsel sistem", "Tat alma sistemi", "Dokunma duyusu", "Vestibüler sistem (iç kulak)", "Somatosensoriyel (proprioseptif) sistem"], "a": 1, "e": "Denge görme, iç kulak ve vücut geri bildiriminin etkileşimidir."}, {"q": "Esneklik gelişimi için haftalık seans sayısı ne olmalıdır?", "o": ["5-6", "1", "7-8", "2-3", "10-12"], "a": 0, "e": "Korumak için 2-3 seans yeterlidir."}, {"q": "Aşağıdaki germe tekniklerinden hangisi kas iğciğinin uyarımını azaltır?", "o": ["Dinamik", "Balistik", "Statik", "Pasif", "PNF"], "a": 2, "e": "Doğru cevap: Statik.", "kb": 1}, {"q": "Mobilite antrenmanları ile ilgili aşağıdaki ifadelerden hangisi yanlıştır?", "o": ["Antrenman ya da müsabakalar öncesinde uygulanması önerilir.", "Dinamik olarak uygulanır ve fonksiyoneldir.", "Foam roller (köpük silindir) kullanımı mobiliteyi artıracak bir yöntemdir.", "Çok eklemli çalışmalardır.", "Kuvvet ve güç çıktısını olumsuz etkilediği için bu tür aktivitelerden önce tercih edilmemelidir."], "a": 4, "e": "Doğru cevap: Kuvvet ve güç çıktısını olumsuz etkilediği için bu tür aktivitelerden önce tercih edilmemelidir..", "kb": 1}, {"q": "\"Hareketin mekân boyutu içerisinde akıcı ve dinamik değişimlere göre hareket edebilme özelliği\" aşağıdaki koordinasyon yetilerinden hangisidir?", "o": ["Ritim yetisi", "Oryantasyon yetisi", "Denge yetisi", "Kinestetik ayrımlama", "Reaksiyon yetisi"], "a": 0, "e": "Doğru cevap: Ritim yetisi.", "kb": 1}, {"q": "Çocuk ve genç sporcularda denge antrenmanlarıyla ilgili aşağıdaki ifadelerden hangisi doğrudur?", "o": ["Antrenmanlara statik-gözler kapalı alıştırmalarla başlanmalıdır.", "Denge alıştırmalarına antrenmanın son bölümünde yer verilmelidir.", "Denge antrenmanları için gelişime en açık dönem ergenlik sonrasıdır.", "Denge antrenmanlarında en son dinamik-gözler kapalı alıştırmalara yer verilmelidir.", "Alıştırmalar tek tekrar uygulanarak sayısı artırılmalıdır."], "a": 3, "e": "Doğru cevap: Denge antrenmanlarında en son dinamik-gözler kapalı alıştırmalara yer verilmelidir..", "kb": 1}, {"q": "Esnekliği etkileyen özellikler ile ilgili aşağıdaki ifadelerden hangisi yanlıştır?", "o": ["Gerilme toleransı azaldıkça esneklik artar.", "Yaş arttıkça esneklik azalır.", "Aktivite düzeyi esnekliği olumlu etkiler.", "Direnç antrenmanları esnekliği olumlu etkiler.", "Kızlar erkeklere göre daha esnektir."], "a": 0, "e": "Doğru cevap: Gerilme toleransı azaldıkça esneklik artar.. Kitabın cevap anahtarında B yazıyor; ancak metinde gençlerin yaşlılardan daha esnek olduğu ve gerilme toleransı arttıkça esnekliğin arttığı anlatılır. Yanlış ifade A'dır.", "kb": 1}, {"q": "Aşağıdakilerden hangisi koordinatif yetilerden biri değildir?", "o": ["Ritim yetisi", "Oryantasyon yetisi", "Denge yetisi", "Yorumlama yetisi", "Reaksiyon yetisi"], "a": 3, "e": "Doğru cevap: Yorumlama yetisi.", "kb": 1}, {"q": "\"İstemli ve istemsiz hareketlerin düzenli, uyumlu, amaca yönelik bir hareket dizisi içerisinde uygulanması\" özelliğinin tanımı aşağıdakilerden hangisidir?", "o": ["Koordinasyon", "Denge", "Esneklik", "Çeviklik", "Hareketlilik"], "a": 0, "e": "Doğru cevap: Koordinasyon.", "kb": 1}, {"q": "Çocuk ve genç sporcularda esneklik çalışmaları için verilen aşağıdaki önerilerin hangisi yanlıştır?", "o": ["Germeler giderek artan yüklenmelerle uygulanmalı, acı/ağrı duygusu dikkate alınmalıdır.", "Hareket genişliği çalışmaları ara verilmeden, düzenli çalışarak gelişim göstermelidir.", "Çocuklarda esneklik çalışmalarına PNF germe egzersizleri ile başlanmalıdır.", "Tekrarlar seriler hâlinde çalışılmalı ve hareketin eski sınırlarını aşacak şekilde alıştırmalar yapılmalıdır.", "Alıştırmaların 15-30 sn arasında uygulanması önerilmektedir."], "a": 2, "e": "Doğru cevap: Çocuklarda esneklik çalışmalarına PNF germe egzersizleri ile başlanmalıdır..", "kb": 1}, {"q": "Golgi tendon organları (GTO) için aşağıda verilen bilgilerden hangisi yanlıştır?", "o": ["Tendon liflerinin içinde ve kasın tendon lifleri ile birleştiği yerde bulunur.", "Gerilmeye karşı hassastırlar.", "Merkezi sinir sistemine duyusal bilgiler gönderir.", "Kas iğciği ile birlikte çalışır.", "Otojenik inhibisyon ile kasılmanın derecesini artırır."], "a": 4, "e": "Doğru cevap: Otojenik inhibisyon ile kasılmanın derecesini artırır..", "kb": 1}, {"q": "\"Görsel, vestibüler ve somatosensoriyel (proprioseptif) sistemleri içeren çok yönlü aktif duyu-motor kontrol sistemi ile kişinin vücut ağırlık merkezini destek yüzeyi içerisinde tutabilme ve bu durumu sürdürebilme yeteneği\" aşağıdakilerden hangisidir?", "o": ["Koordinasyon", "Denge", "Esneklik", "Kuvvet", "Çabukluk"], "a": 1, "e": "Doğru cevap: Denge.", "kb": 1}], "tf": [{"q": "Gerilme toleransı arttıkça esneklik de artabilir.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Düzenli germe gerilme toleransını artırır.", "tf": true}, {"q": "Dinamik germede yaylanma (salınımlı sekme) hareketleri bulunur.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Yaylanma balistik germeye aittir; dinamik germe kontrollüdür.", "tf": true}, {"q": "GTO kas iğciğinin aksine kasları inhibe eder (gevşetir).", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Bu bir koruma fonksiyonudur.", "tf": true}, {"q": "Esneklik çalışmalarına ara verilse bile kazanılan esneklik uzun süre korunur.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Ara uzarsa hızla başlangıç durumuna dönülür.", "tf": true}, {"q": "Koordinasyon çalışmaları antrenmanın sonunda, sporcu yorgunken yapılmalıdır.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Isınmadan hemen sonra, MSS yorulmadan yapılmalıdır.", "tf": true}, {"q": "Köpük silindir uygulaması kas performansını düşürmeden eklem hareket açıklığını akut olarak artırabilir.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "SMR alternatif bir yöntem olarak kabul edilir.", "tf": true}, {"q": "Kadınlar genellikle erkeklerden daha esnektir.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Yaş ve cinsiyet esnekliği etkileyen faktörlerdendir.", "tf": true}]}, {"id": "hab6", "title": "Antrenman Planlama ve Periyotlama", "cards": [{"title": "Periyotlama bilgisine eleştirel bakış", "points": ["Periyotlama (APP) konusundaki bilgilerin çoğu **somut veriye dayanmayan varsayımlara** ve **indirgemeci** (parçayı inceleyen) yaklaşımlara dayanır.", "Bilimin en büyük zorluğu **\"zaman\"** ve **\"kaosu kontrol\"**: çok sayıda değişkeni uzun süre kontrol altında tutmak çok zordur.", "En büyük sorunun kaynağı: bilgiyi elde etmede kullanılan **hatalı/eksik bilimsel araştırma tasarımları**.", "Periyotlamada asıl önemli olan, çıktılara **önceden belirlenen zamanda** (ör. olimpiyat tarihinde) ulaşmaktır.", "\"**Kanıt yokluğu, yokluğun kanıtı değildir**\" (Carl Sagan). Var olan bilimsel bilgilerin çoğu **kuvvet ve kondisyonel yetilere** yöneliktir."]}, {"title": "5N1K yaklaşımı", "points": ["Gazeteciliğin temel soruları: **Ne? Ne zaman? Nerede? Nasıl? Neden? Kim?** Bilgiyi **bağlamından koparmadan** kullanmak için sorulur.", "\"Uygun sorular, uygun cevaplardan daha çok işe yarar.\" Uygun soruyu soramıyorsak **ortak akla danışırız**.", "Dikkat edilecekler: kaynağın **güncellik, güvenilirlik ve geçerliliği**; bilgiyi bağlamından koparmamak; kendi branşa **uyarlamak**; ortak akla danışmak; **kayıt tutarak** süreci sürekli güncellemek.", "En değerli bilgi kaynağı: güvenilir bilimsel bilgiyi **uygulama alanında başarıyla kullanmış uygulamacılardır**."]}, {"title": "Planlama ≠ Periyotlama", "points": ["**Antrenman planlaması:** temel antrenman değişkenlerinin **nispeten kısa** zaman diliminde yönetilmesi (set, tekrar, yük, dinlenme, egzersiz seçimi).", "**Antrenman periyotlaması:** sürecin **çok daha uzun** zaman dilimlerinde, amaca yönelik yönetilmesi; planlama onun bir **aracıdır**.", "Periyotlama değişkenleri: **performansı en verimli hâle getirme**, sporcunun sürekli takibi, **yorgunluk/toparlanma yönetimi**, **zirveleme**.", "\"Planlama\" terimi **hatalı olarak** periyotlama yerine sıkça kullanılır. Örnek: set sayısı bir **planlama** ögesidir."]}, {"title": "Tanımlar ve kısa tarih", "points": ["**Bompa:** periyotlama = **\"antrenmanı evreler şeklinde yapılandırma süreci\"**.", "**Haff ve Haff (2012):** antrenman çıktılarını önceden belirlenen zamanlarda en verimli hâle getirmek için planlama değişkenlerinde yapılan **mantıksal, bütünsel ve art arda** düzenlemeler.", "Periyotlamanın öncüsü: **Leo Pavlovic Matveyev** (sistematik kavram, 1960'ların koşulları). İlk büyük eleştiri **1990'ların başında Verkhoshansky**'den geldi.", "İki tarafın da yanılgısı: konuyu **bütünsel değil, indirgemeci** biçimde ele almak."]}, {"title": "Zaman dilimleri", "points": ["**Antrenman birimi (oturum/seans):** antrenman etkisinin doğrudan yaratıldığı en küçük birim.", "**Mikro döngü:** genellikle **1 hafta** (3 veya 11 gün de olabilir). Bir veya en fazla **iki** uyumlu yetiye odaklanılır.", "**Mezo döngü:** birkaç haftalık, **en işlevsel** yapı; özellikle blok periyotlamada temel birimdir.", "**Makro döngü:** uzun vadeli (yıllık). **Olimpiyat döngüsü: 4 yıl**.", "Klasik periyotlar: **genel hazırlık → özel hazırlık → müsabaka öncesi → müsabaka → geçiş (aktif dinlenme)**."]}, {"title": "Tek-uçlu, çift-uçlu, çok-uçlu", "points": ["Geleneksel periyotlama, bir sezonda ulaşılacak **zirve sayısına** göre adlandırılır.", "**\"Uç\"** = performansın kaç kez **zirveye yaklaştırılacağı**. Çift-uçlu → performans **iki ayrı zaman diliminde** en üst düzeye yaklaştırılır.", "Sonraki hazırlık periyotları (Hazırlık-2, 3) ilkinden **daha kısa** ve **branşa daha özgüdür**.", "**Blok periyotlama:** biriktirme → dönüştürme → gerçekleştirme evreleri; kısa ve tekrarlı. **Elit** düzey için geliştirilmiştir.", "Altyapıda amaç maç kazanmak değil, **uzun vadeli gelişimdir**; **erken uzmanlaşmadan kaçınılır**, çok yönlülük korunur."]}, {"title": "Antrenman biriminde sıralama", "points": ["Isınmadan **hemen sonra** (tam dinlenik MSS gerekir): **çeviklik, çabukluk, reaksiyon, maksimal sürat**, yeni teknik-taktik, patlayıcı/çabuk kuvvet, maksimal kuvvet (sinirsel).", "Hafif-orta yorgunlukta yapılabilenler: hipertrofi, anaerobik glikolitik, VO2maks vb.", "Antrenmanın sonunda: **kuvvette devamlılık**, **uzun süreli aerobik dayanıklılık**.", "Bir birimde en fazla **1-2** yetiye odaklanılır. Birlikte çalışılması **olumsuz** olan örnek: **anaerobik glikolitik dayanıklılık + hipertrofiye yönelik kuvvet**.", "**Sinir sisteminin baskın olduğu yetiler dinlenik vücut ister.**"]}, {"title": "Yükün takibi ve hazırbulunuşluk", "points": ["Antrenman yükü
