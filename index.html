: "soo5", "title": "Ölçme ve Değerlendirme II", "cards": [{"title": "Ölçmede hata ve kaynakları", "points": ["**Ölçmede hata:** ölçüm sonucu ile özelliğin **gerçek değeri arasındaki fark**.", "Hata kaynakları: **ölçmeyi yapan kişi**, **ortam**, **ölçme aracı**, **ölçülen özellik**."]}, {"title": "3 hata türü", "points": ["**Sabit hata:** her sonucu **aynı yönde ve aynı miktarda** etkiler; yönü ve miktarı bellidir. Örn. bozuk kronometrenin her koşuyu **2 sn az** ölçmesi, rubrikte herkese **3 puan fazla** vermek.", "**Sistematik hata:** ölçülen büyüklüğe/koşullara bağlı olarak **sistematik biçimde değişir**. Örn. yaşı küçük sporculara fazla puan vermek, velisini tanıdığı sporcuya öncelik tanımak.", "**Tesadüfi hata:** yönü, miktarı ve kaynağı **belli değil**; rastgele karışır; **tespiti en zor** hata. Örn. testi uygularken dikkatsizlik, salonda **GPS'in veri kaybı**."]}, {"title": "Ölçme aracının nitelikleri", "points": ["**Güvenirlik:** hatalardan arınık, **tutarlı** ölçüm; farklı zamanlarda **aynı/benzer sonuç** (ör. uzan-eriş testinde bir hafta arayla benzer sonuç, mm hassasiyeti).", "**Geçerlik:** amaçlanan özelliği **başka özelliklerle karıştırmadan** tam ve doğru ölçmek. Sıçrama testi kuvveti de ölçüyorsa **geçerlik azalır**; kapsam daralırsa geçerlik düşer.", "İkisi de **var/yok** değil, **düzey** (yüksek-orta-düşük) olarak ifade edilir.", "**Geçerli olan araç güvenilirdir; güvenilir olan araç her zaman geçerli değildir.**", "**Kullanışlılık:** geliştirme, uygulama, puanlama ve yorumlamanın **kolay ve ekonomik** (emek, zaman, para) olması."]}, {"title": "Gözleme dayalı ölçme araçları", "points": ["**Kontrol listesi:** **evet-hayır, var-yok** gibi **ikili** değerlendirme; özelliğe **ne derece** sahip olunduğunu değil, **sahip olunup olunmadığını** gösterir.", "**Dereceli puanlama anahtarı (rubrik):** her anahtar öğeye **ne derece** sahip olunduğunu derecelendirir.", "**Niceliksel analitik rubrik:** her öğenin **ideal formu** yazılır, sahip olma derecesi **puanlanır** (3'lü, 5'li, 7'li…).", "**Niteliksel analitik rubrik:** ideal formun yanında **eksik/hatalı formlar** da tanımlanır.", "**Bütüncül rubrik:** tüm ölçütler **bir arada**; tüm kriterler **aynı anda** değerlendirilir (ör. tüm yüzme teknikleri birlikte)."]}, {"title": "Öz, akran ve grup değerlendirme", "points": ["**Öz-değerlendirme:** sporcu **kendi** performansını değerlendirir.", "**Akran değerlendirme:** sporcu **başka bir sporcuyu** değerlendirir; **iş birlikçi** ortam yaratır.", "**Grup değerlendirme:** antrenörün ölçütlerine göre kendi, akranlarının performansı ve **her bireyin takıma katkısı** değerlendirilir."]}, {"title": "Branşa özgü standardize beceri testleri", "points": ["Branşa özgü motor becerileri **objektif** ölçer; **geçerlik ve güvenirliği sınanmıştır**; oyun ortamına **en yakın** ölçümü yapar.", "Türleri: **isabete (doğruluğa) dayalı**, **tekrarlı performans**, **tüm vücudun hareketine dayalı**, **mesafe ya da güç performansı** ölçen testler."]}], "questions": [{"q": "Her ölçümü aynı yönde ve aynı miktarda etkileyen hata hangisidir?", "o": ["Sistematik hata", "Sabit hata", "Kasıtlı hata", "Yanlılık hatası", "Tesadüfi hata"], "a": 1, "e": "Örn. her koşuyu 2 sn az ölçen bozuk kronometre."}, {"q": "Tespiti en zor hata türü hangisidir?", "o": ["Tesadüfi hata", "Sistematik hata", "Sabit hata", "Ölçek hatası", "Puanlama hatası"], "a": 0, "e": "Yönü, miktarı ve kaynağı belli değildir."}, {"q": "Ölçme aracının farklı zamanlarda aynı/benzer sonuç vermesi hangi niteliğidir?", "o": ["Kapsamlılık", "Ekonomiklik", "Kullanışlılık", "Güvenirlik", "Geçerlik"], "a": 3, "e": null}, {"q": "Bir sıçrama testi kuvveti de ölçüyorsa hangi nitelik azalır?", "o": ["Kullanışlılık", "Geçerlik", "Güvenirlik", "Tutarlılık", "Ekonomiklik"], "a": 1, "e": "Özellik başka özelliklerle karışmıştır."}, {"q": "Ölçme aracının emek, zaman ve para açısından ekonomik olması hangi niteliktir?", "o": ["Geçerlik", "Kullanışlılık", "Kapsam", "Objektiflik", "Güvenirlik"], "a": 1, "e": null}, {"q": "Yalnızca davranışın yapılıp yapılmadığını gösteren ölçme aracı hangisidir?", "o": ["Bütüncül rubrik", "Kontrol listesi", "Niceliksel analitik rubrik", "Niteliksel analitik rubrik", "Grup değerlendirme"], "a": 1, "e": "Ne derece yapıldığını göstermez."}, {"q": "İdeal formun yanında olası eksik/hatalı formların da tanımlandığı rubrik hangisidir?", "o": ["Niteliksel analitik rubrik", "Bütüncül rubrik", "Kontrol listesi", "Niceliksel analitik rubrik", "Öz-değerlendirme"], "a": 0, "e": null}, {"q": "Tüm yüzme tekniklerini birlikte değerlendirmek isteyen antrenör hangi aracı kullanmalıdır?", "o": ["Kontrol listesi", "Bütüncül rubrik", "Niteliksel analitik rubrik", "Niceliksel analitik rubrik", "Gözlem"], "a": 1, "e": "Tüm kriterler aynı anda değerlendirilir."}, {"q": "Aşağıdakilerden hangisinde hata türü ve örneği yanlış eşleştirilmiştir?", "o": ["Tesadüfi hata – antrenörün maç kadrosunu belirlerken velisini tanıdığı sporculara öncelik tanıması", "Sabit hata – antrenörün rubrik kullanırken sporculara üç puan fazla vermesi", "Tesadüfi hata – antrenörün sürat testi uygularken dikkatsiz davranması", "Sabit hata – bozuk kronometreyle koşu sürelerinin iki sn az ölçülmesi", "Sistematik hata – antrenörün rubrik kullanırken yaşı küçük sporculara fazla puan vermesi"], "a": 0, "e": "Doğru cevap: Tesadüfi hata – antrenörün maç kadrosunu belirlerken velisini tanıdığı sporculara öncelik tanıması. Belli sporculara öncelik tanımak rastgele değil, yönü belli (sistematik) bir hatadır.", "kb": 1}, {"q": "Bir basketbol antrenörü spor salonunda GPS ile koşu mesafelerini ölçmüş, ancak GPS iyi çalışmadığı için bazı veriler kaybolmuştur. Bunun farkında olmadan maç kadrosunu bu sonuçlara göre belirleyen antrenörün yaptığı hata hangisidir?", "o": ["Sistematik hata", "Yanlılık hatası", "Kasıtlı hata", "Tesadüfi hata", "Sabit hata"], "a": 3, "e": "Doğru cevap: Tesadüfi hata.", "kb": 1}, {"q": "Bir antrenör altı motorik beceri testinden, hiçbir sporcunun doğru yapamadığı ikisini puanlamaya dahil etmemiştir. Bu durum ölçümün geçerliğini nasıl etkiler?", "o": ["Test kolaylaştığı için geçerlik artar.", "Yapılamayan testler puanlanmadığından geçerlik etkilenmez.", "Test kapsamı daraldığı için geçerlik düşer.", "Puanlama güvenirliği arttığı için geçerlik yükselir.", "Geçerlik etkilenmez."], "a": 2, "e": "Doğru cevap: Test kapsamı daraldığı için geçerlik düşer..", "kb": 1}, {"q": "Uzan-eriş testinin mm olarak hassas sonuç vermesi ve bir hafta arayla yapılan iki ölçümün benzer çıkması testin hangi niteliği ile ilgilidir?", "o": ["Uyumlu", "Ekonomik", "Güvenilir", "Kullanışlı", "Geçerli"], "a": 2, "e": "Doğru cevap: Güvenilir.", "kb": 1}, {"q": "Bir sıçrama testinin sporcuların kuvvetini de ölçüyor olması durumunda ölçme aracının hangi niteliği azalır?", "o": ["Güvenirlik", "Geçerlik", "Kullanışlılık", "Tutarlılık", "Kapsamlılık"], "a": 1, "e": "Doğru cevap: Geçerlik.", "kb": 1}, {"q": "Sporcularının tüm yüzme tekniklerine ilişkin beceri düzeylerini birlikte değerlendirmek isteyen bir yüzme antrenörünün hangi ölçme aracını kullanması daha uygun olur?", "o": ["Gözlem", "Kontrol listesi", "Niceliksel analitik rubrik", "Niteliksel analitik rubrik", "Bütüncül rubrik"], "a": 4, "e": "Doğru cevap: Bütüncül rubrik.", "kb": 1}, {"q": "Hedef becerilerden kaçının yapıldığını gösteren, en belirgin gözlenebilir davranışları içeren, performansın düzeyini değil davranışların gerçekleştirilip gerçekleştirilmediğini gösteren ölçme aracı hangisidir?", "o": ["Kontrol listesi", "Öz-değerlendirme", "Grup değerlendirmesi", "Dereceli puanlama anahtarı", "Akran değerlendirme"], "a": 0, "e": "Doğru cevap: Kontrol listesi.", "kb": 1}, {"q": "Gözleme dayalı ölçme yöntemleri ile ilgili aşağıdaki eşleşmelerden hangisi doğrudur?", "o": ["Her öğenin ideal formu yazılır ve sahip olma derecesi puanlanır – niteliksel analitik rubrik", "Antrenörün ölçütlerine göre kendi ve akranlarının performansını ve her bireyin takıma katkısını değerlendirirler – grup değerlendirme", "Evet-hayır, var-yok gibi ikili değerlendirmeler yapılır – akran değerlendirme", "Her bir anahtar öğeye ne düzeyde sahip olunduğu hakkında bilgi verir – bütüncül rubrik", "İdeal formun yanında eksik/hatalı formlar da tanımlanır – niceliksel analitik rubrik"], "a": 1, "e": "Doğru cevap: Antrenörün ölçütlerine göre kendi ve akranlarının performansını ve her bireyin takıma katkısını değerlendirirler – grup değerlendirme.", "kb": 1}, {"q": "Bir antrenör sporcularının motorik becerilerini ölçmek ve aynı zamanda iş birlikçi bir antrenman ortamı yaratmak istemektedir. Hangi ölçme aracını kullanması en ideal olur?", "o": ["Dereceli puanlama anahtarı", "Kontrol listesi", "Öz-değerlendirme", "Akran değerlendirme", "Grup değerlendirme"], "a": 3, "e": "Doğru cevap: Akran değerlendirme.", "kb": 1}, {"q": "Bir koordinasyon parkurunda sporcular beceriyi sınırlı bir zamanda doğru teknikle ve süratli yaptıklarında yüksek puan almaktadır. Bu test hangi standardize beceri testidir?", "o": ["Doğruluğa dayalı testler", "Mesafe ya da güç performansı ölçen testler", "Sakatlık belirleme testleri", "Tüm vücudun hareketine dayalı testler", "Tekrarlı performans testleri"], "a": 4, "e": "Doğru cevap: Tekrarlı performans testleri. Kitabın cevap anahtarına göre verilmiştir.", "kb": 1}], "tf": [{"q": "Güvenilir olan her ölçme aracı mutlaka geçerlidir.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Geçerli olan güvenilirdir; tersi her zaman doğru değildir.", "tf": true}, {"q": "Geçerlik ve güvenirlik var/yok şeklinde değil, düzey olarak ifade edilir.", "o": ["Doğru", "Yanlış"], "a": 0, "e": null, "tf": true}, {"q": "Kontrol listeleri sporcunun bir özelliğe ne derece sahip olduğunu gösterir.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Sadece sahip olup olmadığını gösterir.", "tf": true}, {"q": "Akran değerlendirmede sporcu başka bir sporcunun performansını değerlendirir.", "o": ["Doğru", "Yanlış"], "a": 0, "e": null, "tf": true}]}, {"id": "soo6", "title": "Spor Pedagojisi II", "cards": [{"title": "Öğretim tasarımı", "points": ["**Tanım:** eğitim gereksinimlerini karşılamak için **işlevsel öğrenme sistemleri geliştirmek**; makro sistemleri ve mikro uygulamaları kapsar.", "**Sistem yaklaşımı:** her aşamanın **çıktısı** bir sonrakinin **girdisidir**.", "**5 aşama (sırası önemli):** **1. Çözümleme** (ihtiyaç belirleme) → **2. Tasarımlama** (amaç ve öğrenme çıktıları) → **3. Geliştirme** (içerik) → **4. Uygulama** → **5. Değerlendirme**."]}, {"title": "Mosston ve Ashworth öğretim stilleri yelpazesi", "points": ["Antrenörün öğretimi kişilik özelliklerine ve ortamın amacına (**katılım/performans**) göre çeşitlendirmesini sağlar. **11 yöntem**; bilişsel, duyuşsal, psikomotor alanlar.", "**Öğreten merkezli (sunuş yoluyla) 5 yöntem:** **A Komut, B Alıştırma, C Eşli çalışma, D Kendini denetleme, E Katılım**.", "**Öğrenen merkezli (buluş yoluyla) 6 yöntem:** **F Yönlendirilmiş buluş, G Problem çözme (tek doğru), H Farklı yollar üretimi, I Öğrencinin tasarımı, J Öğrencinin başlatması, K Kendi kendine öğretme**.", "**Buluş eşiği:** sunuştan buluşa geçiş noktası → **Katılım (E) ile Yönlendirilmiş buluş (F)** arası."]}, {"title": "Yöntemleri örnekle tanı", "points": ["**Komut (A):** tüm kararları antrenör verir.", "**Alıştırma (B):** **istasyonlar**; sporcular kendi hızlarında çalışır. Kararlar **ilk kez** sporcuya geçer: başlama zamanı, **hız ve ritim**, bitirme zamanı, sıralama… (**içerik** antrenörde kalır).", "**Eşli (C):** bir sporcu yapar, eşi gözlemleyip geri bildirim verir.", "**Katılım (E):** aynı amaca uygun **farklı zorluk düzeyleri**; başarılı olan bir üst düzeye geçer.", "**Problem çözme (G):** antrenör soru sorar, sporcu sorgulayıp **tek doğru cevabı** bulur."]}, {"title": "Öğretim teknolojileri", "points": ["En sık kullanılanlar: bilgisayarla **veri analizi**, **video ve fotoğraf**, **mobil uygulamalar**, **adımsayar/akselerometre**, **kalp atım monitörü**.", "Antrenör veri toplayıp **düzenli analiz** ederek sporcunun **gelişimini takip** etmelidir."]}, {"title": "Mesleki gelişim ve yansıma", "points": ["**Yansıma yapma** becerisi öğretim ortamını yeniden tasarlamak için gereklidir: öğrenme fırsatı, deneyimi gözden geçirme, **öz değerlendirme**, **kritik düşünme**. Sporcuları **kıyaslamak** yansıma değildir.", "Mesleki gelişim kaynakları: **antrenör toplulukları**, **kongre/konferanslar**, **akademik dergi ve kitaplar**, **üniversiteler ve spor bilimciler** (sporcu toplulukları değil)."]}], "questions": [{"q": "Öğretim tasarımının aşamaları doğru sırayla hangisidir?", "o": ["Tasarımlama – Uygulama – Geliştirme – Değerlendirme – Çözümleme", "Çözümleme – Tasarımlama – Geliştirme – Uygulama – Değerlendirme", "Çözümleme – Geliştirme – Uygulama – Tasarımlama – Değerlendirme", "Geliştirme – Çözümleme – Tasarımlama – Uygulama – Değerlendirme", "Çözümleme – Tasarımlama – Uygulama – Geliştirme – Değerlendirme"], "a": 1, "e": "Her aşamanın çıktısı sonrakinin girdisidir."}, {"q": "Mosston ve Ashworth yelpazesinde kaç öğretim yöntemi vardır?", "o": ["6", "12", "11", "8", "5"], "a": 2, "e": "5 sunuş, 6 buluş yöntemi."}, {"q": "Aşağıdakilerden hangisi sunuş (öğreten merkezli) yöntemlerden DEĞİLDİR?", "o": ["Komut", "Eşli çalışma", "Öğrencinin tasarımı", "Kendini denetleme", "Alıştırma"], "a": 2, "e": "Öğrencinin tasarımı (I) buluş yöntemidir."}, {"q": "Buluş eşiği hangi iki yöntem arasındadır?", "o": ["Kendini denetleme – Problem çözme", "Katılım – Yönlendirilmiş buluş", "Komut – Alıştırma", "Kendini denetleme – Katılım", "Eşli – Yönlendirilmiş buluş"], "a": 1, "e": null}, {"q": "Farklı zorluk düzeylerinde alıştırma hazırlayıp başarılı olanın üst düzeye geçtiği yöntem hangisidir?", "o": ["Kendini denetleme", "Katılım", "Komut", "Yönlendirilmiş buluş", "Alıştırma"], "a": 1, "e": null}, {"q": "Sporcuların istasyonlarda kendi hızlarında çalıştığı yöntem hangisidir?", "o": ["Eşli", "Alıştırma", "Problem çözme", "Yönlendirilmiş buluş", "Komut"], "a": 1, "e": null}, {"q": "Antrenörün sorusunu sorgulayıp tek doğru cevabı aradıkları yöntem hangisidir?", "o": ["Öğrencinin function dailyCard(){

function dailyPool(cid){
  if(cid==="wrong")return Object.keys(S.wrong).filter(i=>QI[i]).map(i=>QI[i]);
  const cs=cid==="mix"?DATA.courses:[course(cid)];
  return cs.flatMap(c=>c.units.flatMap(u=>u.questions.concat(u.tf||[])).concat(c.past||[],c.deneme||[]));
}
function pickDaily(cid,n){
  const pool=dailyPool(cid);if(cid==="wrong")return shuffle(pool).slice(0,n);
  const wr=shuffle(pool.filter(q=>S.wrong[q.id])).slice(0,Math.ceil(n*.3));
  const pa=shuffle(pool.filter(q=>q.past&&!S.wrong[q.id])).slice(0,2);
  const used=new Set(wr.concat(pa).map(q=>q.id));
  const rest=shuffle(pool.filter(q=>!used.has(q.id))).slice(0,n-used.size);
  return shuffle(wr.concat(pa,rest));
}

function confetti(){
  const box=document.createElement("div");box.className="confetti";const cols=["#F5B700","#1F4FD8","#2BB673","#F08A24","#E54B6A","#6A3DE8"];
  for(let i=0;i<90;i++){const e=document.createElement("i");e.style.left=Math.random()*100+"%";e.style.background=cols[i%6];e.style.animationDuration=(2.2+Math.random()*2)+"s";e.style.animationDelay=Math.random()*.6+"s";e.style.transform=`rotate(${Math.random()*180}deg)`;box.appendChild(e)}

function finishDaily(o,right,n){

const ORD={1:"Birinci",2:"İkinci",3:"Üçüncü",4:"Dördüncü",5:"Beşinci"};
function speakable(s){
  return String(s).replace(/\*\*/g,"")
   .replace(/(\d+)\s*[–-]\s*(\d+)\s*sn/g,"$1 ile $2 saniye").replace(/(\d+)\s*sn\s*[–-]\s*(\d+)\s*dk/g,"$1 saniye ile $2 dakika")
   .replace(/(\d+)\s*sn\b/g,"$1 saniye").replace(/(\d+)\s*dk\b/g,"$1 dakika").replace(/(\d+)\s*m\b/g,"$1 metre")
   .replace(/%\s?(\d+)/g,"yüzde $1").replace(/MÖ\s/g,"milattan önce ").replace(/\b([1-5])\.\s/g,(m,d)=>ORD[d]+" ")
   .replace(/→/g,", sonra, ").replace(/[–—]/g,", ").replace(/×/g," çarpı ").replace(/[()]/g,", ").replace(/\//g," ya da ")
   .replace(/\bATP-PC\b/g,"A Te Pe, Pe Ce").replace(/\bATP\b/g,"A Te Pe").replace(/\bTUE\b/g,"Te U E").replace(/\bTDMK\b/g,"Te De Me Ke")
   .replace(/\bWADA\b/g,"Vada").replace(/\bIOC\b/g,"I O Se").replace(/\bGSB\b/g,"Ge Se Be").replace(/\b4P\b/g,"dört P")
   .replace(/\bPRICE\b/g,"Prays").replace(/\bRICE\b/g,"Rays").replace(/\bSMART\b/g,"Smart").replace(/\b112\b/g,"yüz on iki")
   .replace(/\bvs\.?\b/g,"ve benzeri").replace(/\s\+\s/g," artı ").replace(/\s=\s/g," eşittir ").replace(/([?!])\./g,"$1").replace(/\s+,/g,",").replace(/,\s*([.:;!?])/g,"$1").replace(/,\s*,/g,",").replace(/\s{2,}/g," ").trim();
}

const CLIPS={};
let ACTX=null;
function playClip(x){
  stopTalk();mountCoach();
  const tk=++TTS.token,c=coachEl();TTS.active=true;bubble(null);
  const a=new Audio(x.clip);a.preload="auto";TTS.audio=a;
  let an=null,buf=null;
  try{ACTX=ACTX||new (window.AudioContext||window.webkitAudioContext)();if(ACTX.state==="suspended")ACTX.resume();
    const src=ACTX.createMediaElementSource(a);an=ACTX.createAnalyser();an.fftSize=512;src.connect(an);an.connect(ACTX.destination);buf=new Uint8Array(an.fftSize)}catch(e){an=null}
  const w=x.parts.map(p=>speakable(p.text).length+12),tot=w.reduce((s,v)=>s+v,0);
  let cur=-1;
  const tickF=()=>{
    if(tk!==TTS.token)return;
    const d=a.duration||x.dur||1,tm=a.currentTime;let k=0;
    if(x.marks&&x.marks.length===x.parts.length){k=0;for(let j=0;j<x.marks.length;j++)if(tm+.12>=x.marks[j])k=j}
    else{let acc=0;for(;k<w.length;k++){acc+=w[k];if(tm<acc/tot*d)break}}
    if(x.marks&&x.exact){if(k!==cur){sw.querySelectorAll(".reading").forEach(e=>e.classList.remove("reading"));cur=k;const p=x.parts[k];if(p&&p.el){p.el.classList.add("reading");p.el.scrollIntoView({block:"nearest",behavior:"smooth"})}}}
    else{const art=sw.querySelector(".lesson");if(art){art.classList.add("playing");const b=art.querySelector(".aprog i");if(b)b.style.width=Math.min(100,tm/d*100)+"%"}}
    if(an){an.getByteTimeDomainData(buf);let s=0;for(let i=0;i<buf.length;i+=4){const v=(buf[i]-128)/128;s+=v*v}c.classList.toggle("talk",Math.sqrt(s/(buf.length/4))>0.035)}
    else c.classList.add("talk");
    TTS.raf=requestAnimationFrame(tickF);
  };
  a.onplay=()=>{if(tk===TTS.token)tickF()};
  a.onended=a.onerror=()=>{if(tk!==TTS.token)return;TTS.active=false;cancelAnimationFrame(TTS.raf);c.classList.remove("talk");{const art=sw.querySelector(".lesson.playing");if(art){const b=art.querySelector(".aprog i");if(b)b.style.width="100%";setTimeout(()=>art.classList.remove("playing"),600)}}sw.querySelectorAll(".reading").forEach(e=>e.classList.remove("reading"))};
  a.play().catch(()=>{TTS.active=false;bubble("Ses çalınamadı. Bana bir daha dokunur musun?",false,3000)});
}
function startTalk(){
  if(TTS.cur&&TTS.cur.clip){playClip(TTS.cur);return}
  if(!TTS.ok){bubble("Bu tarayıcı sesli okumayı desteklemiyor. Chrome ya da Claude uygulamasında deneyebilirsin.",false,4000);return}
  if(TTS.cur)say(TTS.cur);
}
function stopTalk(said){
  TTS.token++;TTS.active=false;try{speechSynthesis.cancel()}catch(e){}
  if(TTS.audio){try{TTS.audio.pause()}catch(e){}TTS.audio=null}cancelAnimationFrame(TTS.raf);
  sw.querySelectorAll(".lesson.playing").forEach(a=>{a.classList.remove("playing");const b=a.querySelector(".aprog i");if(b)b.style.width="0%"});
  sw.querySelectorAll(".reading").forEach(e=>e.classList.remove("reading"));
  const c=coachEl();if(c){c.classList.remove("talk");if(said)bubble("Tamam, sustum. Devam etmemi istersen bana dokun.",false,2600)}
}
function say(parts){
  if(parts&&parts.clip){playClip(parts);return}
  if(!TTS.ok)return;
  stopTalk();mountCoach();
  const tk=++TTS.token,c=coachEl();TTS.active=true;
  let i=0;
  const next=()=>{
    if(tk!==TTS.token)return;
    if(i>=parts.length){TTS.active=false;c.classList.remove("talk");TTS.fadeT=setTimeout(()=>{if(tk===TTS.token)bubble(null)},1400);return}
    const p=parts[i++],u=new SpeechSynthesisUtterance(speakable(p.text));
    const base=TTS.femaleVoice||TTS.voice;
    u.lang="tr-TR";if(base)u.voice=base;u.rate=p.rate||.94;u.pitch=p.pitch||1.05;
    u.onstart=()=>{if(tk!==TTS.token)return;c.classList.add("talk");bubble(null);
      sw.querySelectorAll(".reading").forEach(e=>e.classList.remove("reading"));if(p.el){p.el.classList.add("reading");p.el.scrollIntoView({block:"nearest",behavior:"smooth"})}};
    u.onend=u.onerror=()=>{if(tk!==TTS.token)return;c.classList.remove("talk");if(p.el)p.el.classList.remove("reading");setTimeout(next,p.pause||320)};
    try{speechSynthesis.speak(u)}catch(e){}
  };
  setTimeout(next,80);
}

function words(s){return String(s).replace(/\*\*/g,"").split(/\s+/).map(stem).filter(w=>w.length>=3&&!STOP.has(w))}
function findCard(q){
  const c=course(q.cid),us=(q.past||q.dn)?c.units:[c.units.find(x=>x.id===q.uid)];
  const key=new Set(words(q.q+" "+q.o[q.a]+" "+q.e));
  let best=us[0].cards[0],bu=us[0],bs=-1;
  us.forEach(u=>u.cards.forEach(k=>{const ws=words(k.title+" "+k.points.join(" "));let s=0;ws.forEach(w=>{if(key.has(w))s++});s=s/Math.sqrt(ws.length+1);if(s>bs){bs=s;best=k;bu=u}}));
  return {c,u:bu,k:best};
}
function openReview(q,chosen){
  const {c,u,k}=findCard(q);
  const el=document.createElement("section");el.className="review";el.style.setProperty("--c",c.color);
  el.innerHTML=`<div class="sbar"><button class="x" aria-label="Soruya dön">×</button><span class="eyebrow" style="flex:1">Konu tekrarı · ${esc(u.title)}</span></div>
   <article class="lesson" style="--c:${c.color}">${ILL(c.id,c.color)}<h3>${esc(k.title)}</h3><div class="aprog" aria-hidden="true"><i></i></div><ul>${k.points.map(p=>`<li>${md(p)}</li>`).join("")}</ul></article>
   <div class="why"><span class="eyebrow">Bu soruda</span>
     ${chosen!=null&&chosen!==q.a?`<p class="w-no"><b>Senin cevabın:</b> ${esc(q.o[chosen])}</p>`:""}
     <p class="w-ok"><b>Doğru cevap:</b> ${esc(q.o[q.a])}</p><p>${esc(q.e)}</p></div>
   <div class="deep" hidden><span class="eyebrow">Detaylı anlatım</span><p class="deep-t"></p></div>
   <button class="btn ghost" id="more" ${SAMPLE?"":"hidden"}>Daha detaylı anlat</button>
   <button class="btn" id="back">Soruya dön</button>`;
  sw.appendChild(el);el.scrollTop=0;
  const lis=[...el.querySelectorAll("li")];
  const parts=[{text:"Bu soru, "+k.title+" konusundan. Birlikte hatırlayalım.",el:el.querySelector("h3"),pitch:1.1,pause:400}]
    .concat(k.points.map((x,j)=>({text:x,el:lis[j],pitch:j%2?1.02:1.07})))
    .concat([{text:"Bu soruda doğru cevap: "+q.o[q.a]+".",el:el.querySelector(".w-ok"),pitch:1.08,pause:300},{text:q.e,pitch:1.03}]);
  const close=()=>{stopTalk();el.remove();TTS.cur=TTS.qCur||null;TTS.onYes=null};
  el.querySelector(".x").onclick=close;el.querySelector("#back").onclick=close;
  const more=el.querySelector("#more");
  more.onclick=async()=>{
    if(!SAMPLE){more.hidden=true;return}
    more.disabled=true;more.textContent="Hazırlanıyor…";stopTalk();
    const box=el.querySelector(".deep"),tx=el.querySelector(".deep-t");box.hidden=false;tx.textContent="";
    const prompt=`Sen Türkiye'de 1. kademe (yardımcı antrenör) temel eğitim sınavına hazırlanan adaylara ders anlatan sıcak ve net bir antrenörsün.
Aday aşağıdaki soruyu ${chosen!=null&&chosen!==q.a?"yanlış":"doğru"} cevapladı. Konuyu ona daha detaylı ama sade biçimde anlat.
Kurallar: Türkçe yaz. 6-8 cümle. Önce kavramı kendi kelimelerinle açıkla, sonra sahadan (antrenman ortamından) somut bir örnek ver${chosen!=null&&chosen!==q.a?", sonra adayın seçtiği şıkkın neden yanlış olduğunu kısaca söyle":""}, en sonda sınav için akılda tutulacak tek cümlelik bir ipucu ver. Markdown, madde işareti, başlık veya emoji kullanma; düz paragraflar yaz. Bilmediğin mevzuat ayrıntısı uydurma.

Ders: ${c.title} / ${u.title}
Konu kartı: ${k.title} — ${k.points.map(plain).join(" | ")}
Soru: ${q.q}
Şıklar: ${q.o.map((o,j)=>"ABCDE"[j]+") "+o).join(" ; ")}
Doğru cevap: ${q.o[q.a]}
${chosen!=null&&chosen!==q.a?"Adayın cevabı: "+q.o[chosen]:""}
Kısa açıklama: ${q.e}`;
    try{
      const r=await SAMPLE(prompt,{onText:({text})=>{tx.textContent=text},modelTier:"quick"});
      const full=(r&&r.text)||tx.textContent;tx.textContent=full;
      more.hidden=true;
      const sents=full.match(/[^.!?]+[.!?]+/g)||[full];
      TTS.cur=sents.map((s,j)=>({text:s.trim(),el:j===0?box:null,pitch:j%2?1.03:1.07,pause:260}));
      
    }catch(e){
      if(e&&e.code==="not_granted"){box.hidden=true;more.hidden=true}
      else{tx.textContent="Şu an detaylı anlatım alınamadı. Biraz sonra tekrar dene.";more.disabled=false;more.textContent="Daha detaylı anlat"}
    }
  };
  TTS.cur=parts;say(parts);
}
/* Ses ve koç kaldırıldı: tüm sesli fonksiyonlar etkisiz */
mountCoach=function(){return null};offer=function(){};say=function(){};startTalk=function(){};playClip=function(){};bubble=function(){};
const cheers=["Harika!","Süpersin!","Aynen böyle!","Tam isabet!"];

/* ---------- sessions ---------- */
const sess=document.getElementById("sess"),sw=document.getElementById("sw");
let tick=null;
function openS(){sess.hidden=false;document.body.style.overflow="hidden"}
function closeS(){stopTalk();TTS.cur=null;sess.hidden=true;sess.classList.remove("with-coach");document.body.style.overflow="";clearInterval(tick);render()}

function startUnit(c,u){
  openS();const n=u.cards.length;let i=Math.min(S.pos[u.id]||0,n-1);
  const parts=()=>{const k=u.cards[i],art=sw.querySelector(".lesson"),lis=[...art.querySelectorAll("li")];
    const p=[{text:(i===0?`${u.title} ünitesine hoş geldin. İlk konumuz: `:"Sıradaki konu: ")+k.title+".",show:k.title,el:art.querySelector("h3"),pitch:1.12,pause:420}];
    k.points.forEach((x,j)=>p.push({text:x,el:lis[j],pitch:j%2?1.02:1.07}));
    p.push(i<n-1?{text:"Anladıysan devam edelim.",pitch:1.12}:{text:"Bu ünitenin konuları bitti. Şimdi kendini test etme zamanı!",pitch:1.15});
    const id=u.id+"-k"+(i+1);
    if(CLIPS[id])return {clip:"ses/"+id+".mp3",dur:CLIPS[id].d,marks:CLIPS[id].m,parts:p};
    return p};
  const draw=()=>{const k=u.cards[i];S.pos[u.id]=i;S.spot={c:c.id,u:u.id};save();
    sw.innerHTML=`<div class="sbar"><button class="x" aria-label="Kapat">×</button><div class="prog"><i style="width:${(i+1)/(n+1)*100}%;background:${c.color}"></i></div><span class="mono" style="font-size:13px">${i+1}/${n}</span></div>
    <div class="body"><span class="eyebrow">${esc(u.title)} · Konu ${i+1}/${n}</span><article class="lesson" style="--c:${c.color}">${ILL(c.id,c.color)}<h3>${esc(k.title)}</h3><ul>${k.points.map(p=>`<li>${md(p)}</li>`).join("")}</ul></article></div>
    <div class="toggle">${i>0?'<button class="btn ghost" id="pv">Geri</button>':""}<button class="btn" id="nx">${i<n-1?"Devam":"Teste geç"}</button></div>`;
    sw.querySelector(".x").onclick=closeS;
    const pv=sw.querySelector("#pv");if(pv)pv.onclick=()=>{i--;draw()};
    sw.querySelector("#nx").onclick=()=>{if(i<n-1){i++;draw()}else{stopTalk();delete S.pos[u.id];if(S.spot&&S.spot.u===u.id)S.spot=null;save();startQuiz({title:u.title,qs:unitQs(u),mode:"unit",uid:u.id,cid:c.id})}};
    offer(parts(),i===0?"Merhaba, ben Koç Zahide! Bu konuyu sana anlatmamı ister misin? Sonraki konularda bana dokunman yeterli.":null);
  };draw();
}

function startQuiz(o){
  openS();let i=0,right=0,combo=0;const n=o.qs.length;
  const draw=()=>{
    const q=o.qs[i],order=q.tf?[0,1]:shuffle(q.o.map((t,j)=>j));let sel=null;
    sw.innerHTML=`<div class="sbar"><button class="x" aria-label="Kapat">×</button><div class="prog"><i style="width:${i/n*100}%"></i></div>${combo>=3?`<span class="combo">${combo}× seri</span>`:`<span class="mono" style="font-size:13px">${i+1}/${n}</span>`}</div>
    <div class="body"><div class="qtag"><span>${q.tf?"Doğru mu, yanlış mı?":"Tek seçim · 5 puan"}</span><span>${esc(o.title)}</span></div>${q.past?`<span class="pastb">★ 25 Nisan 2026 sınavında çıkmış soru</span>`:""}${q.dn?`<span class="pastb kbb">📝 Dönem sonu deneme sınavından uyarlandı</span>`:""}${q.kb?`<span class="pastb kbb">📘 Kitabın bölüm sonu sorusu</span>`:""}<div class="qtext">${esc(q.q)}</div>
    <div class="opts">${order.map((j,x)=>`<button class="opt" data-j="${j}" aria-pressed="false"><span class="k">${"ABCDE"[x]}</span><span>${esc(q.o[j])}</span></button>`).join("")}</div><div id="fb"></div></div>
    <button class="btn" id="ck" disabled>Kontrol et</button>`;
    sw.querySelector(".x").onclick=closeS;
    const ops=[...sw.querySelectorAll(".opt")],ck=sw.querySelector("#ck");
    const qParts=()=>q.tf?[{text:q.q,el:sw.querySelector(".qtext"),pitch:1.08,pause:300},{text:"Sence doğru mu, yanlış mı?",pitch:1.12}]:[{text:q.q,el:sw.querySelector(".qtext"),pitch:1.08,pause:450}].concat(ops.map((b,x)=>({text:["A şıkkı","Be şıkkı","Ce şıkkı","De şıkkı","E şıkkı"][x]+", "+q.o[+b.dataset.j]+".",show:"ABCDE"[x]+") "+q.o[+b.dataset.j],el:b,pitch:1.02,pause:220})));
    offer(qParts(),i===0?"Soruları sesli okumamı ister misin? Sonrakilerde de bana dokunman yeterli.":null);
    ops.forEach(b=>b.onclick=()=>{stopTalk(true);sel=+b.dataset.j;ops.forEach(x=>x.setAttribute("aria-pressed",x===b));ck.disabled=false});
    ck.onclick=()=>{
      const ok=sel===q.a;ops.forEach(b=>{b.disabled=true;const j=+b.dataset.j;if(j===q.a)b.classList.add("right");else if(j===sel)b.classList.add("wrong")});
      if(ok){right++;combo++;addXP(combo>=3?15:10);delete S.wrong[q.id]}else{combo=0;S.wrong[q.id]=1}save();
      const cheer=cheers[Math.random()*4|0];
      const fbParts=ok?[{text:cheer,pitch:1.22,rate:1,pause:250},{text:q.e,pitch:1.04}]:[{text:"Doğru cevap: "+q.o[q.a]+".",pitch:1.06,pause:300},{text:q.e,pitch:1.02}];TTS.qCur=fbParts;
      if(!ok){offer(fbParts,"Bu soruyu bilemedin. Konuya birlikte bir daha bakmak ister misin?",()=>openReview(q,sel),"Evet, bakalım")}
      else offer([{text:cheer,pitch:1.22,rate:1,pause:250},{text:q.e,pitch:1.04}],null);
      sw.querySelector("#fb").innerHTML=`<div class="fb ${ok?"ok":"no"}"><strong>${ok?cheer:"Yanlış"}</strong>${ok?"":`<p><b>Doğru cevap:</b> ${esc(q.o[q.a])}</p>`}<p>${esc(q.e)}</p>${ok?"":`<button class="revlink" id="rv">Konuyu tekrar et →</button>`}</div>`;
      {const rv=sw.querySelector("#rv");if(rv)rv.onclick=()=>{bubble(null);openReview(q,sel)}}
      sw.querySelector(".body").scrollTop=1e5;
      ck.textContent=i<n-1?"Sonraki soru":"Sonucu gör";ck.className="btn "+(ok?"good":"bad");
      ck.onclick=()=>{if(i<n-1){i++;draw()}else finish()};
    };
  };
  const finish=()=>{
    if(o.mode==="daily")return finishDaily(o,right,n);
    const pct=Math.round(right/n*100),stars=pct===100?3:pct>=80?2:pct>=60?1:0,pass=pct>=60;
    if(o.mode==="unit"&&pass){const p=S.units[o.uid];S.units[o.uid]={stars:Math.max(stars,p?p.stars:0)};addXP(20)}
    if(o.mode==="test")S.tests[o.cid]=Math.max(pct,S.tests[o.cid]||0);
    save();
    sw.innerHTML=`<div class="body"><div class="result"><span class="eyebrow">${esc(o.title)}</span>
      <div class="big mono" style="color:${pass?"var(--good)":"var(--bad)"}">${pct}</div><div class="stars" style="font-size:30px">${"★".repeat(stars)}${"☆".repeat(3-stars)}</div>
      <h2 style="font-size:24px">${pass?(o.mode==="unit"?"Ünite tamamlandı!":"Barajı geçtin!"):"Biraz daha tekrar"}</h2>
      <p class="note">${right} doğru, ${n-right} yanlış. ${pass?"Yanlışların “Yanlışlarım” sekmesinde seni bekliyor.":"Geçmek için en az 60 puan gerekiyor. Konu kartlarına bir kez daha göz at."}</p></div></div>
      <div class="toggle"><button class="btn ghost" id="again">Tekrar</button><button class="btn" id="cont">Devam</button></div>`;
    {offer([{text:pass?`Tebrikler! ${n} sorudan ${right} doğru yaptın. Puanın ${pct}.`:`${n} sorudan ${right} doğru yaptın. Puanın ${pct}. Pes etmek yok, konu kartlarına bir kez daha bakıp tekrar deneyelim!`,pitch:pass?1.18:1.05}],null)}
    sw.querySelector("#again").onclick=()=>startQuiz(Object.assign({},o,{qs:shuffle(o.qs)}));
    sw.querySelector("#cont").onclick=closeS;
  };
  draw();
}

function startExam(){
  openS();
  const qs=DATA.courses.flatMap(c=>courseQs(c));
  const n=qs.length,ans={},orders=qs.map(q=>shuffle(q.o.map((t,j)=>j)));let i=0,left=100*60;
  const fmt=s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
  clearInterval(tick);tick=setInterval(()=>{left--;const t=sw.querySelector(".timer");if(t)t.textContent=fmt(left);if(left<=0)grade()},1000);
  const cnt=()=>Object.keys(ans).length;
  const draw=()=>{const q=qs[i],c=course(q.cid);
    sw.innerHTML=`<div class="sbar"><button class="x" aria-label="Kapat">×</button><div class="prog"><i style="width:${cnt()/n*100}%;background:var(--accent)"></i></div><span class="timer">${fmt(left)}</span></div>
    <div class="body"><div class="qtag"><span>Soru ${i+1} / ${n}</span><span>${esc(c.short)}</span></div><div class="qtext">${esc(q.q)}</div>
    <div class="opts">${orders[i].map((j,x)=>`<button class="opt" data-j="${j}" aria-pressed="${ans[i]===j}"><span class="k">${"ABCDE"[x]}</span><span>${esc(q.o[j])}</span></button>`).join("")}</div></div>
    <div class="toggle"><button class="btn ghost" id="pv" ${i?"":"disabled"}>Önceki</button><button class="btn" id="nx">${i<n-1?"Sonraki":"Sınavı bitir"}</button></div>
    <button class="btn ghost" id="end" style="padding:10px">Sınavı bitir (${cnt()}/${n} cevaplandı)</button>`;
    sw.querySelector(".x").onclick=closeS;
    sw.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ans[i]=+b.dataset.j;sw.querySelectorAll(".opt").forEach(x=>x.setAttribute("aria-pressed",x===b));sw.querySelector(".prog i").style.width=cnt()/n*100+"%";sw.querySelector("#end").textContent=`Sınavı bitir (${cnt()}/${n} cevaplandı)`});
    sw.querySelector("#pv").onclick=()=>{i--;draw()};
    sw.querySelector("#nx").onclick=()=>{if(i<n-1){i++;draw()}else grade()};
    sw.querySelector("#end").onclick=grade;
  };
  const grade=()=>{clearInterval(tick);
    const per=DATA.courses.map(c=>{let r=0,t=0;qs.forEach((q,k)=>{if(q.cid!==c.id)return;t++;if(ans[k]===q.a){r++;delete S.wrong[q.id]}else S.wrong[q.id]=1});return{c,r,t,p:Math.round(r/t*100)}});
    const pass=per.every(m=>m.p>=60),tot=per.reduce((a,m)=>a+m.r,0);
    S.tests.deneme={pass,score:tot};addXP(tot);save();
    sw.innerHTML=`<div class="body"><div class="result"><span class="eyebrow">Deneme Sınavı</span><div class="big mono" style="color:${pass?"var(--good)":"var(--bad)"}">${tot}</div>
      <h2 style="font-size:24px">${pass?"Tüm derslerden geçtin!":"Bazı derslerde baraj altındasın"}</h2>
      <div class="mods">${per.map(m=>`<div class="row" style="--c:${m.c.color}"><span class="ic">${ILL(m.c.id,m.c.color)}</span><span class="tx"><b>${esc(m.c.title)}</b><small class="mono">${m.r}/${m.t} doğru</small></span><span class="pill ${m.p>=60?"ok":"no"}">${m.p}</span></div>`).join("")}</div>
      <p class="note">Her dersten en az 60 puan (20 sorudan 12 doğru) gerekir. Yanlışların “Yanlışlarım” sekmesine eklendi.</p></div></div>
      <button class="btn" id="cont">Bitir</button>`;
    sw.querySelector("#cont").onclick=closeS;
  };
  draw();
}
