 kulüpleri", "Bölgesel yarışmalar", "Okul sporu / beden eğitimi", "Aile ortamı"], "a": 3, "e": "Piramit modelinin tabanında okul sporu ve beden eğitimi yer alır."}, {"q": "Aynı yıl doğmuş çocuklardan ay olarak önce doğanların avantajlı olmasına ne denir?", "o": ["Olgunlaşma farkı", "Bağıl yaş etkisi", "Piramit etkisi", "Yetenek seçimi", "Erken özelleşme"], "a": 1, "e": "Önce doğan çocuklar daha olgun olduğu için daha nitelikli antrenman yapabilir."}, {"q": "Katılım spor ortamında çocuk grubu hangi yaşa kadar kabul edilir?", "o": ["18 yaş", "12 yaş", "6 yaş", "9 yaş", "15 yaş"], "a": 1, "e": "Ergenler 12 yaşından ergenliğin sonuna kadar olan gruptur."}, {"q": "Performans spor ortamında en az katılıma sahip grup hangisidir?", "o": ["Yüksek performans sporcuları", "Ergenler", "Performans sporcuları", "Gelişmekte olan sporcular", "Yetişkinler"], "a": 0, "e": "Yüksek performans sporcuları uluslararası düzeyde ve üst liglerde yarışır."}, {"q": "Çocuk antrenörlüğünde haftalık antrenman etkinlikleri en fazla kaç saat olmalıdır?", "o": ["2 saat", "10 saat", "6 saat", "4 saat", "8 saat"], "a": 3, "e": "Çocuk antrenörlüğünde yarışma ve performans planlaması yapılmaz."}, {"q": "Asıl amacı eğlenmek olan ve kuralları katılımcıların isteğine göre esnetilebilen etkinlik hangisidir?", "o": ["Yüksek performans antrenmanı", "Amaçlı oyun etkinliği", "Amaçlı alıştırma etkinliği", "Yarışma etkinliği", "Test etkinliği"], "a": 1, "e": "Amaçlı alıştırmada ise amaç beceri gelişimidir ve antrenör tam karar vericidir."}, {"q": "Eğlenceli etkinlikler ile beceri etkinliklerinin beraber ve eşit oranda yapıldığı grup hangisidir?", "o": ["Yüksek performans sporcusu", "Çocuklar (6-12 yaş)", "Gelişmekte olan sporcu (13-15 yaş)", "Yetişkin katılım grubu", "Performans sporcusu"], "a": 2, "e": "Bu grupta beceri etkinlikleri kademeli olarak artırılır."}, {"q": "Yüksek performans sporcusu antrenörlüğünde hangisine yer verilmez?", "o": ["Performans testlerine", "Sporcunun fikrinin alınmasına", "Yarışma planlamasına", "Tek alanda uzmanlaşmaya", "Eğlence için amaçlı oyun etkinliklerine"], "a": 4, "e": "Bu düzeyde keyif; performans gelişimi, başarı ve kariyerden beklenir."}, {"q": "Ebeveynlerin antrenörden öncelikli beklentisi nedir?", "o": ["Ücretsiz antrenman", "Çocuğun hızlı şampiyon olması", "Çocuğun her maçta oynaması", "Çocuklarına adil davranılması", "Antrenmanların kısa sürmesi"], "a": 3, "e": "Antrenör temel değerlerini ve amaçlarını ebeveynlerle paylaşmalıdır."}, {"q": "Aşağıdakilerden hangisi çocuk katılım sporu antrenörünün dikkat etmesi gereken unsurlardan biri değildir?", "o": ["Spor ortamlarının eğlenceli ve zevkli olması", "Yarışma performansına önem verilmesi", "Etkinliklerin ilgi çekici ve tatmin edici olması", "Temel hareket gelişimine önem verilmesi", "Çocukların sosyal gelişimine de eşit önemin verilmesi"], "a": 1, "e": "Doğru cevap: Yarışma performansına önem verilmesi.", "kb": 1}, {"q": "Ergen ve yetişkin katılım sporu ortamları ile çocuk katılım sporu ortamı karşılaştırıldığında, aşağıdakilerden hangisi iki ortam arasındaki farkı ifade eder?", "o": ["Spor ortamlarında eğlencenin olması", "Sosyal etkileşimi destekleyen unsurların olması", "Beceri gelişiminin daha önem kazanması", "Temel hareket gelişimini destekleyen etkinliklerin olması", "Bir spor dalı aracılığıyla sosyal becerilerin kazanılması"], "a": 2, "e": "Doğru cevap: Beceri gelişiminin daha önem kazanması.", "kb": 1}, {"q": "Performans sporu antrenörlüğü ve katılım sporu antrenörlüğünü birbirinden ayıran unsurlar arasında aşağıdakilerin hangisinden söz edilemez?", "o": ["Katılım antrenörlüğü kısa süreli planlama yaparken; performans antrenörü daha çok orta ve uzun süreli planlama yapar.", "Katılım antrenörü bireysel ve sosyal gelişime, performans antrenöründen daha çok öncelik verir.", "Katılım antrenörü de, performans antrenörü gibi yaptığı performansa dayalı ölçüm ve gözlemler sonucuna göre antrenmanlarını planlar.", "Çocuk spor ortamlarında katılım antrenörü amaçlı oyunlara, performans antrenörü ise amaçlı alıştırma etkinliklerine daha çok yer verir.", "Katılım antrenörü oyun kurallarında esneklik sağlarken, performans antrenörü oyun kurallarına daha bağlı kalır."], "a": 2, "e": "Doğru cevap: Katılım antrenörü de, performans antrenörü gibi yaptığı performansa dayalı ölçüm ve gözlemler sonucuna göre antrenmanlarını planlar.", "kb": 1}, {"q": "Antrenör görevinin “sporcu performansını en üst düzeye çıkarmak, yarışma ve müsabakalarda başarı elde etmek ve geliştirilen performansın korunması” olduğu spor ortamı aşağıdakilerden hangisidir?", "o": ["Çocuk katılım antrenörlüğü", "Ergen katılım antrenörlüğü", "Yetişkin katılım antrenörlüğü", "Gelişmekte olan sporcu antrenörlüğü", "Yüksek performans dönemi antrenörlüğü"], "a": 4, "e": "Doğru cevap: Yüksek performans dönemi antrenörlüğü.", "kb": 1}, {"q": "Amaçlı oyun etkinliklerinin en fazla olması gereken spor ortamı aşağıdakilerin hangisinde doğru olarak verilmiştir?", "o": ["Çocuk katılım spor ortamı", "Ergen katılım spor ortamı", "Performans sporu antrenörlüğü – Gelişmekte olan sporcu", "Performans sporu ortamı antrenörlüğü – Performans dönemi", "Performans sporu antrenörlüğü- Yüksek performans dönemi"], "a": 0, "e": "Doğru cevap: Çocuk katılım spor ortamı.", "kb": 1}, {"q": "Küçük yaş grubu spor ortamları düşünüldüğünde, aşağıdakilerden hangisi spor ortamının en temel paydaşları arasında yer almaz?", "o": ["Antrenör", "Sporcu", "Ebeveyn", "Hakem", "Yönetici"], "a": 4, "e": "Doğru cevap: Yönetici.", "kb": 1}, {"q": "Aşağıdakilerden hangisi antrenörlerin sporcuları ile güçlü bağlar geliştirmesine yardımcı olacak stratejiler arasında yer almaz?", "o": ["Sporcularla etkili iletişim kurmak", "Sporculara pozitif destek sağlamak", "Sporculara samimi ve ilgili olmak", "Sporcular tarafından ulaşımı zor olmak", "Sporcuların güvenini kazanmış olmak"], "a": 3, "e": "Doğru cevap: Sporcular tarafından ulaşımı zor olmak.", "kb": 1}, {"q": "Aşağıdaki spor ortamlarının hangisinde antrenörlerin amaçlı oyun etkinliklerine en az yer vermesi gerekir?", "o": ["Çocuk katılım sporu ortamı", "Ergen katılım sporu ortamı", "Yetişkin katılım sporu ortamı", "Gelişmekte olan performans sporu ortamı", "Yüksek performans spor ortamı"], "a": 4, "e": "Doğru cevap: Yüksek performans spor ortamı.", "kb": 1}, {"q": "Antrenörlerin özellikle küçük yaş grubu çocukların gelişiminde ebeveynler ile birlikte, çocukların gelişimi için ortak bir anlayış geliştirmeleri gereklidir. Aşağıdakilerden hangisi çocuk spor ortamlarındaki antrenörlerin ebeveynlere ileteceği mesajlardan biri olmamalıdır?", "o": ["Spor ortamının amaçları doğrultusunda çocukları desteklemelerini istemek", "Ebeveynlerin tutum ve çabaları ile, çocuklara iyi birer rol model olmaya gayret göstermelerini istemek", "Çocukların teknik beceri gelişiminin yanında, bireysel ve sosyal gelişimine de odaklanmalarını istemek", "Çocukların yaşadıkları başarı veya başarısızlık durumlarını, kişisel olarak algılamalarını istemek", "Belirlenen amaçlar doğrultusunda spor ortamının gelişimine katkı sunmasını istemek"], "a": 3, "e": "Doğru cevap: Çocukların yaşadıkları başarı veya başarısızlık durumlarını, kişisel olarak algılamalarını istemek.", "kb": 1}, {"q": "Aşağıdakilerden hangisi antrenörlerin ebeveynlerle etkili bir ilişki kurabilmeleri için uygulayabilecekleri stratejilerden biri değildir?", "o": ["Ebeveynlere olumlu davranış geliştirmeleri için eğitim verilmesi", "Ebeveynlerle düzenli toplantılar düzenlenmesi", "Ebeveynlerle iki yönlü iletişim kurulması", "Ebeveynlerin davranışları için kurallar belirlenmesi", "Ebeveynlerin spor ortamından uzak tutulması"], "a": 4, "e": "Doğru cevap: Ebeveynlerin spor ortamından uzak tutulması.", "kb": 1}], "tf": [{"q": "Başka bir mesleği icra ederken ücret karşılığı antrenörlük yapanlar gönüllü antrenördür.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Bunlar kısmi zamanlı antrenördür; gönüllü antrenör ücret almaz.", "tf": true}, {"q": "Antrenörler sadece sporcuların teknik becerilerinin gelişimine odaklanmalıdır.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Antrenörün amacı sporcunun bütünsel gelişimidir.", "tf": true}, {"q": "Bireyin spora katılımı ilk ve en yoğun olarak okul sporu ve beden eğitiminden başlar.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Piramit modelinin tabanı okul sporudur.", "tf": true}, {"q": "Aynı yıl doğan çocuklardan ay olarak önce doğanlar diğerlerine göre avantajlıdır.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Buna bağıl yaş etkisi denir.", "tf": true}, {"q": "Hedefleri eğlenmek, beceri geliştirmek ve sağlıklı yaşam olan ortam katılım spor ortamıdır.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Katılım ortamında yarışma ve kazanma hedefi yoktur.", "tf": true}, {"q": "Katılım spor ortamından performans spor ortamına geçiş yoktur.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Bireyler ortamlar arasında her iki yönde de geçiş yapabilir.", "tf": true}, {"q": "Performans sporu antrenörlüğü yarışma performansı odaklıdır ve kısa ve uzun vadeli planlama yapılır.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Katılım sporu antrenörlüğü ise yarışmaya odaklanmaz.", "tf": true}, {"q": "Çocuk antrenörü, katılımı artırmak için öncelikle sporun performansa olumlu etkilerinden bahsetmelidir.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Önce sporun ilgi çekici ve tatmin edici olması gerekir.", "tf": true}, {"q": "Amaçlı oyun etkinliklerinin asıl amacı beceri ve performans gelişimidir, eğlence de içerir.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Amaçlı oyunun asıl amacı eğlenmektir.", "tf": true}, {"q": "Performans sporcusu antrenörleri amaçlı alıştırmaya oyundan daha fazla yer vermeli, ancak oyunu tamamen bırakmamalıdır.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Oyun etkinlikleri yüksek performans düzeyinde bırakılır.", "tf": true}]}, {"id": "soo2", "title": "Beceri Öğrenimi", "cards": [{"title": "Motor davranışın 3 alanı", "points": ["**Motor davranış** alanı 3'e ayrılır: **motor öğrenme, motor gelişim, motor kontrol**.", "**Motor öğrenme (beceri öğrenimi):** Alıştırma ve deneyim sonucu hareketlerin nasıl öğrenildiğini inceler. Algı ve dikkati incelediği için **psikolojiden** de yararlanır.", "Büyüme ve gelişim amaçlı antrenman sonucu oluşan değişimler beceri öğrenimi **sayılmaz**.", "**Motor gelişim:** Hareketlerin **yaşa bağlı** nasıl geliştiğini veya gerilediğini inceler.", "**Motor kontrol:** **Merkezi sinir sisteminin** kas ve eklem hareketlerini nasıl organize ettiğini inceler; **biyomekanikle** yakından ilgilidir."]}, {"title": "Öğrenme ve performans", "points": ["**Öğrenme:** Alıştırma ve deneyimle oluşan, **göreceli olarak kalıcı** bir değişimdir.", "Öğrenme **doğrudan gözlenemez**; gözlenen performanstır, öğrenme performanstan **çıkarılır**.", "**Performans:** Beceriyi uygulama eylemidir; **kalıcı değildir**, değişkenlik gösterir.", "Performansı düşürenler: **yorgunluk, hastalık, dikkat eksikliği**. Olumlu etkileyenler: **motivasyon, şans**."]}, {"title": "Beceri nedir? Tek boyutlu sınıflama", "points": ["Bir hareketin beceri sayılması için **amacı** olmalıdır: amaç varsa **beceri**, yoksa **hareket**.", "**Guthrie:** Beceri, bir sonuca **maksimum kesinlik, minimum enerji ve zamanla** ulaşma yeteneğidir.", "**Kas büyüklüğüne göre:** Büyük kas (kaba): yürüme, atlama. Küçük kas (ince): yazı yazma, dikiş; yüksek el-göz koordinasyonu ister.", "**Çevrenin tahmin edilebilirliğine göre:** **Açık** beceri: çevre değişken (ormanda koşu). **Kapalı** beceri: çevre sabit, önceden plan yapılabilir (dart).", "**Başlangıç-bitiş netliğine göre:** **Kesik** (topa vurma), **seri** (vites değiştirme, cimnastik yer hareketleri), **devamlı** (yüzme, bisiklet).", "**Motor/bilişsel öğeye göre:** **Motor** beceride hareketin **nasıl** yapıldığı (halter), **zihinsel** beceride **hangi** hareketin yapıldığı (satranç) başarıyı belirler."]}, {"title": "Gentile'nin çok boyutlu sınıflaması", "points": ["**Gentile**'nin sınıflaması 2 boyuttan oluşur, her birinin 2 alt boyutu vardır; beceriler **16 farklı** şekilde tanımlanır.", "**Düzenleyici şartlar:** Çevre **durağan mı değişken mi?** Denemeler **sabit mi farklı mı?**", "**Hareket gereklilikleri:** **Vücut taşınımı** (tüm vücut yer değiştiriyor mu?) ve **nesne manipülasyonu** (bir cisim hareket ettiriliyor mu?).", "Örnekler: **gülle atmak** çevre sabit, denemeler sabit, vücut ve nesne **var**. **Mekik** sabit/sabit, ikisi de yok. **Satrançta taş oynamak** sabit/sabit, sadece nesne var.", "**Yamaçta slalom kaymak** çevre hareketli, denemeler farklı, vücut ve nesne var. **Skeet atışı** hareketli/farklı, sadece nesne var."]}, {"title": "Karar verme ve reaksiyon zamanı", "points": ["Karar vermenin **ilk ve en önemli unsuru algıdır**. Algı, bilgiye anlam yükleme işlevidir.", "**Reaksiyon zamanı:** Uyaranın verilmesi ile tepkinin başlaması arasında geçen süre.", "Birden fazla uyarana her biri için farklı tepki verilmesine **seçici reaksiyon zamanı** denir.", "Etkileyenler: yaş, cinsiyet, uyaranın şiddeti ve çeşidi, besin/ilaç, uyaran sayısı, sezinleme, uyarı-tepki tutarlılığı.", "Kararı **olumsuz** etkileyenler: **uyaran sayısının artması**, cevap hareketinin karmaşık olması, düşük deneyim, art arda uyarılar (**aldatma hareketleri**)."]}, {"title": "Dikkat ve canlılık (Ters U)", "points": ["**Dikkat:** Aynı anda farklı nesne veya düşünceler içinden birinin zihin tarafından belirgin olarak alınması.", "Yeni başlayanlarda: uyaran sayısı **az** olmalı, hareket **basitleştirilmeli**, **açık beceriler kapalı hâle** getirilerek öğretilmeli.", "**Canlılık düzeyi** merkezi sinir sisteminin aktivasyonudur ve **Ters U hipoteziyle** açıklanır: optimal noktaya kadar performans artar, sonra düşer.", "**İnce motor / yüksek bilişsel karmaşıklık → düşük** canlılık. **Orta → orta** canlılık. **Kaba motor / düşük bilişsel karmaşıklık → yüksek** canlılık."]}], "questions": [{"q": "Merkezi sinir sisteminin kas ve eklem hareketlerini nasıl organize ettiğini inceleyen alan hangisidir?", "o": ["Motor öğrenme", "Spor psikolojisi", "Motor gelişim", "Antrenman bilgisi", "Motor kontrol"], "a": 4, "e": "Motor kontrol biyomekanikle yakından ilgilidir."}, {"q": "Hareketlerin yaşa bağlı olarak nasıl geliştiğini veya gerilediğini inceleyen alan hangisidir?", "o": ["Motor öğrenme", "Biyomekanik", "Motor gelişim", "Fizyoloji", "Motor kontrol"], "a": 2, "e": "Motor gelişime psikomotor gelişim de denir."}, {"q": "Öğrenme ile ilgili aşağıdakilerden hangisi doğrudur?", "o": ["Yorgunlukla kolayca değişir", "Doğrudan gözlenemez, performanstan çıkarım yapılır", "Kalıcı değildir", "Doğrudan ölçülebilir", "Sadece şansa bağlıdır"], "a": 1, "e": "Gözlenebilen şey performanstır; öğrenme performansa bakılarak anlaşılır."}, {"q": "Aşağıdakilerden hangisi performansı OLUMLU etkileyen bir faktördür?", "o": ["Motivasyon", "Dikkat eksikliği", "Hastalık", "Yorgunluk", "Uykusuzluk"], "a": 0, "e": "Motivasyon ve şans performansı olumlu etkiler."}, {"q": "Beceriyi \"bir sonuca maksimum kesinlik ve minimum enerji ve zamanla ulaşma yeteneği\" olarak tanımlayan kimdir?", "o": ["Piaget", "Bandura", "Gentile", "Guthrie", "Laban"], "a": 3, "e": "Bir hareketin beceri sayılması için amacı olmalıdır."}, {"q": "Çevresel şartların sabit ve tahmin edilebilir olduğu beceriye ne denir?", "o": ["Açık beceri", "Seri beceri", "Zihinsel beceri", "Devamlı beceri", "Kapalı beceri"], "a": 4, "e": "Dart atışı kapalı beceriye örnektir; eylemden önce plan yapılabilir."}, {"q": "Ormanlık alanda koşu, beceri sınıflamasında hangi gruba girer?", "o": ["Zihinsel beceri", "Kesik beceri", "İnce motor beceri", "Açık beceri", "Kapalı beceri"], "a": 3, "e": "Rota ağaçların sıklığına göre değiştiği için çevre tahmin edilemez."}, {"q": "Yüzme ve bisiklet sürme, başlangıç-bitiş netliğine göre hangi beceridir?", "o": ["Kesik beceri", "Seri beceri", "Devamlı beceri", "Zihinsel beceri", "Kapalı beceri"], "a": 2, "e": "Devamlı becerilerin başı ve sonu belli değildir."}, {"q": "Satrançta başarıyı belirleyen beceri türü hangisidir?", "o": ["Açık beceri", "Zihinsel beceri", "Kaba motor beceri", "Motor beceri", "Devamlı beceri"], "a": 1, "e": "Zihinsel becerilerde hangi hareketin yapıldığı başarıyı belirler."}, {"q": "Gentile'nin sınıflamasına göre gülle atmak nasıl tanımlanır?", "o": ["Çevre sabit, denemeler farklı, sadece nesne var", "Çevre değişken, denemeler farklı, ikisi de yok", "Çevre sabit, denemeler sabit, vücut taşınımı ve nesne manipülasyonu var", "Çevre hareketli, denemeler farklı, ikisi de var", "Çevre hareketli, denemeler sabit, sadece vücut var"], "a": 2, "e": "Kitabın D/Y testinde bu örnek tuzak olarak sorulur."}, {"q": "Gentile'nin sınıflamasında beceriler kaç farklı şekilde tanımlanabilir?", "o": ["8", "24", "16", "4", "12"], "a": 2, "e": "2 boyut ve her birinin 2 alt boyutu vardır."}, {"q": "Karar vermenin ilk ve en önemli unsuru hangisidir?", "o": ["Dikkat", "Motivasyon", "Algı", "Reaksiyon zamanı", "Kuvvet"], "a": 2, "e": "Algı, bilgiye anlam yükleme işlevidir."}, {"q": "Birden fazla uyarana karşı her uyaran için farklı tepki verilmesine ne denir?", "o": ["Uyarıcı genelleme", "Seçici reaksiyon zamanı", "Hareket zamanı", "Sezinleme", "Basit reaksiyon zamanı"], "a": 1, "e": "Uyaran sayısı arttıkça karar verme yavaşlar."}, {"q": "Yeni başlayan sporculara açık beceriler nasıl öğretilmelidir?", "o": ["Çok uyaranla", "Yarışma ortamında", "Aldatma hareketleriyle", "Hızlı tempoda", "Kapalı beceri hâline getirilerek"], "a": 4, "e": "Önce hareket koordinasyonu, sonra çevreye uyum çalışılır."}, {"q": "Ters U hipotezine göre ince motor kontrol gerektiren bir beceride optimal canlılık düzeyi nasıl olmalıdır?", "o": ["Maksimum", "Yüksek", "Değişken", "Düşük", "Orta"], "a": 3, "e": "Kaba motor ve düşük bilişsel karmaşıklık gerektiren becerilerde ise yüksek canlılık gerekir."}, {"q": "Aşağıdakilerden hangisi motor becerilerin ortak özelliklerinden biri değildir?", "o": ["Öğrenilmiş olmalıdır.", "İstemsiz yapılır.", "İstemli yapılmalıdır.", "Beden/uzuv hareketi içerir.", "Bir gaye ile yapılmamalıdır."], "a": 1, "e": "Doğru cevap: İstemsiz yapılır.", "kb": 1}, {"q": "Aşağıdakilerden hangisi öğrenme kavramının temel özelliklerinden biri değildir?", "o": ["Öğrenme belirli bir süreç gerektirir.", "Öğrenme alıştırma yapmanın sonucunda oluşur.", "Öğrenme hareket kapasitesinin artırımıdır.", "Öğrenme deneyimlerimiz ile meydana gelen değişimdir.", "Öğrenme doğrudan gözlemlenir."], "a": 4, "e": "Doğru cevap: Öğrenme doğrudan gözlemlenir.", "kb": 1}, {"q": "Aşağıdaki ifadelerden hangisi rastgele başlangıç ve bitiş yeri olan bir beceriyi tanımlar?", "o": ["Seri motor beceri", "Kesik motor beceri", "Devamlı motor beceri", "İnce motor beceri", "Kapalı beceri"], "a": 2, "e": "Doğru cevap: Devamlı motor beceri. Kitabın cevap anahtarında D yazıyor, ancak kitabın kendi metnine göre başı ve sonu belli olmayan beceri devamlı beceridir.", "kb": 1}, {"q": "Aşağıdakilerden hangisi devamlı bir beceridir?", "o": ["Yüzmek", "Düz takla atmak", "Tenis servis atışı", "Basketbolda turnike", "Voleybolda yerleşme"], "a": 0, "e": "Doğru cevap: Yüzmek.", "kb": 1}, {"q": "Aşağıdakilerden hangisi “Seçici reaksiyon zamanına” ilişkin bir örnektir?", "o": ["Bir trafik lambasının olduğu kavşağa bir arabanın yanaşması", "Bir koşucunun parkuru üzerinde bir şey(ler) bulması", "Bir sürat koşucusunun yarışa başlama anı", "Hakemin uyarısından sonra basketbolda serbest atış", "Yukarıdakilerin hepsi"], "a": 0, "e": "Doğru cevap: Bir trafik lambasının olduğu kavşağa bir arabanın yanaşması. Kitabın cevap anahtarında C yazıyor, ancak farklı uyaranlara (kırmızı, sarı, yeşil ışık) farklı tepki gerektiren durum seçici reaksiyondur; sürat koşusundaki start basit reaksiyondur.", "kb": 1}, {"q": "Çevre veya görevin zorluk derecesi arttıkça, diğer bir görev için ayrılacak dikkat --------.\nYukarıdaki cümlede boş bırakılan yeri aşağıdakilerden hangisi doğru şekilde tamamlar?", "o": ["kapasitesinde bir değişme olmaz", "kapasitesi artar", "kapasitesi azalır", "kapasitesi iki katına çıkar", "kapasitesi azalır sonra artar"], "a": 2, "e": "Doğru cevap: kapasitesi azalır.", "kb": 1}, {"q": "Yeni bir motor becerinin öğreniminden önce öğrenenin dikkatini topladığımıza emin olabilmek için aşağıdakilerden hangisinin yapılması gereklidir?", "o": ["Sporcuları sırtları güneşe gelecek şekilde düzenlemek", "Sporcuların dikkatlerini dağıtmayacak bir alanda düzene koymak", "Bütün sporcuların bizi gördüğünden ve duyduğundan emin olmak", "Sporcuların hareketi neden öğrenmemiz gerektiğine ilişkin bilgi vermek", "Yukarıdakilerin hepsi"], "a": 3, "e": "Doğru cevap: Sporcuların hareketi neden öğrenmemiz gerektiğine ilişkin bilgi vermek.", "kb": 1}, {"q": "Aşağıdaki stratejilerden hangisi reaksiyon zamanını azaltmak amacıyla kullanılır?", "o": ["Olacak olay hakkında önceden bilgi vermek", "Tepki seçeneklerinin sayısını artırmak", "Uyaranın tahmin edilebilirliğini azaltmak", "Uyarı sinyalinin sunumunu çıkarmak", "Tepki verildikten sonra ek bir iş istemek"], "a": 0, "e": "Doğru cevap: Olacak olay hakkında önceden bilgi vermek.", "kb": 1}, {"q": "Her birine farklı tepki gereken ve ardı ardına kısa aralıklarla verilen iki uyaran olduğu duruma ------- denir.\nYukarıdaki cümlede boş bırakılan yeri aşağıdakilerden hangisi doğru şekilde tamamlar?", "o": ["aldatma", "Hick Kanunu", "Fitts Kanunu", "uyarı tepki tutarlılığı", "zamansal sezinleme"], "a": 0, "e": "Doğru cevap: aldatma.", "kb": 1}, {"q": "Aynı anda birden fazla düşünce silsilesinden birinin belirgin tarzda zihin tarafından alınmasına -------- denir.\nYukarıdaki cümlede boş bırakılan yeri aşağıdakilerden hangisi doğru şekilde tamamlar?", "o": ["dikkat", "sezinleme", "seçici dikkat", "canlılık düzeyi", "seçici reaksiyon zamanı"], "a": 0, "e": "Doğru cevap: dikkat.", "kb": 1}], "tf": [{"q": "Motor öğrenme, alıştırma ve deneyim sonucu harekette oluşan davranış değişimlerine göre hareketlerin nasıl öğrenildiğini inceler.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Motor öğrenmeye beceri öğrenimi de denir.", "tf": true}, {"q": "Öğrenme doğrudan gözlenemez.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Gözlenen performanstır; öğrenme ondan çıkarılır.", "tf": true}, {"q": "Performans kalıcı değildir ve değişkenlik gösterir.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Yorgunluk, hastalık ve motivasyon performansı değiştirir.", "tf": true}, {"q": "Bir eylemin amacı varsa hareket, amacı yoksa beceridir.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Tam tersi: amacı varsa beceri, yoksa harekettir.", "tf": true}, {"q": "Çevrenin tahmin edilebilirlik düzeyine göre beceriler açık ve kapalı olarak ayrılır.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Açıkta çevre değişken, kapalıda sabittir.", "tf": true}, {"q": "Devamlı beceriler kısa süreli, başı ve sonu belli olan becerilerdir.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Bu tanım kesik becerilere aittir.", "tf": true}, {"q": "Gülle atmak; çevrenin değişken, denemelerin farklı olduğu, vücut taşınımı ve nesne manipülasyonu olmayan bir beceridir.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Gülle atmakta çevre ve denemeler sabittir; vücut taşınımı ve nesne manipülasyonu vardır.", "tf": true}, {"q": "Karar vermenin ilk ve en önemli unsuru algıdır.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Algı, bilgiye anlam yükler.", "tf": true}, {"q": "Dikkat, aynı anda farklı nesne veya düşünceler içinden birinin zihin tarafından belirgin olarak alınmasıdır.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Bu, dikkatin kapsamlı tanımıdır.", "tf": true}, {"q": "İnce motor kontrol veya yüksek bilişsel karmaşıklık gerektiren beceriler yüksek canlılık düzeyi gerektirir.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Bu beceriler düşük canlılık düzeyi gerektirir.", "tf": true}]}, {"id": "soo3", "title": "Hareket Eğitimi ve Oyun", "cards": [{"title": "Hareket eğitimi", "points": ["Hareket, insanın çevresini algılama ve dış dünyayı keşfetme aracıdır; aynı zamanda **toplumsal bir iletişim aracıdır**.", "Temel hareket yeterliliği; yaşam boyu aktivitenin temelidir ve **yeterlilik bariyerinin** geçilmesini sağlar.", "Hareket eğitimini **Rudolf Laban** geliştirmiştir. **Gilliom** ise **problem çözme ve keşfetme** metodunu kullanmıştır.", "Amaçlar: kendine güven, problem çözme ve **işbirliği** ile öğrenme becerileri.", "Temel hareket becerilerinin **en hassas dönemi 6-9 yaştır**.", "Hareketler önce **zorlanmadan, yavaş ve doğru**, sonra akıcı ve hızlı yaptırılır."]}, {"title": "Hareket eğitiminin özellikleri", "points": ["Bireysel bir keşiftir; **öğrenci merkezlidir**; temelinde **problem çözme** vardır.", "Geleneksel beden eğitiminden **daha az formaldir (resmîdir)**.", "Motor becerilerin öğrenilmesini kolaylaştırır ve çocukta **tatmin duygusu** yaratır.", "Kolay bulunabilen, ekonomik malzeme gerektirir; gelişmeler **belirli aralıklarla ölçülmelidir**."]}, {"title": "Temel hareket becerileri", "points": ["Hareket kavramları ve temel beceriler **okul öncesi ve ilkokulda** öğrenilmelidir. **6-12 yaşta algısal yetenek keskinleşir**.", "3 beceri teması: **yer değiştirme, dengeleme, nesne kontrolü**.", "**Yer değiştirme:** yürüme, koşma, atlama, sıçrama, galop, kayma, yuvarlanma, tırmanma.", "**Dengeleme:** eğilme, esnetme, dönme, salınım, ağırlık aktarma, konma, başlama-durma, itme-çekme.", "**Nesne kontrolü:** atma, tutma, yakalama, ayakla vurma, yuvarlama, durdurma, top sürme, raketle vurma."]}, {"title": "Temel hareket kavramları", "points": ["Temel beceri hareketin bir **eylem** olduğunu, hareket kavramı ise hareketin **nasıl** yapılacağını anlatır.", "**Vücut farkındalığı:** \"Vücut **ne** yapabilir?\" Vücut parçalarını, şekillerini, ağırlık transferini tanıma.", "**Alan farkındalığı:** \"Vücut **nerede** hareket eder?\" Yönler, seviyeler, yollar.", "**Genel alan:** Çocuğun güvenle yer değiştirebileceği, sınırları belli alan. **Kişisel alan:** Kollarını açtığında sahip olduğu alan.", "**Efor farkındalığı:** \"Vücut **nasıl** hareket eder?\" **Zaman, güç, tempo, akıcılık**; denge, hız ve hareketleri birbirine bağlama.", "**Hareket ilişkileri:** Vücut parçaları, nesne, eş ve grupla neler yapılabileceği."]}, {"title": "Oyunun tarihi", "points": ["Oyun, insanın doğadaki olayları **taklit etmesiyle** başlamıştır; taklit önce **hayvanların** ses ve hareketlerinden doğmuştur.", "İlkçağ insanı avcılığı taklit ederek egzersiz yaptı. Örnek: **Eskimoların** ayı balığı avını yansıtan oyunu.", "Oyun dini tören ve şenliklerle gelişti; sonra bayram, düğün ve asker uğurlama gibi alanlara yayıldı.", "Ritüel veya tören şeklindeki oyun **görev** kavramıyla birleşir."]}, {"title": "Caillois'nın oyun sınıflaması", "points": ["**Roger Caillois** oyunları 4'e ayırır.", "**Şans oyunları (Alea):** Kadere bağlı; oyuncu enerji harcamaz, beceri kullanmaz (zar, tombala, rulet).", "**Gösteri/rol oyunları (Mimicry):** Taklit; oyuncu başka role bürünür (tiyatro, sinema).", "**Macera/heyecan oyunları (Vertigo/Ilinx):** Baş döndüren, ürpertili zevk veren (dans, kayak, havada dalış).", "**Mücadele/yarışma oyunları (Agon):** Zekâ veya güce dayalı; 4'e ayrılır: fiziksel beceri (halter, stafet), strateji (satranç), fiziksel beceri + strateji (boks, güreş, mendil kapmaca), **strateji + şans + fiziksel beceri (futbol)**."]}, {"title": "Oyunun gelişime katkısı", "points": ["**Fiziksel gelişim ve sağlık:** Tüm sistemler çalışır, iştah açılır, **bağışıklık** güçlenir; oyun **yaşlılar** için de faydalıdır.", "**Sosyal gelişim:** Oyun dışı kalmamak için **kurallara uymayı** öğrenir; **hoşgörü, mensubiyet ve fedakârlık** gelişir.", "**Psikolojik gelişim:** Oyun **en doğal öğrenme ortamıdır**; liderlik ve dürüstlük gelişir, **pasif çocuklar aktifleşir**.", "**Zihinsel gelişim:** En önemli etkisi **öğrenmedir**; oyun çocuğun **zihinsel antrenmanıdır**; **akıl yürütme ve sezinleme** gelişir."]}, {"title": "Eğitsel oyunlar", "points": ["Eğitsel oyunlar **mücadele/yarışma (Agon)** oyunlarıdır. Çocuğun amacı kazanmak ve eğlenmek; oynatanın amacı yetenek geliştirmektir.", "Hem motorik özellikleri hem **iradeyi** geliştirir; pasifleri aktifleştirir.", "İlgi görme nedenleri: **motivasyon, özgür ortam, motorik özellikleri test etme, sonucun belirsizliği, birliktelik, karmaşıklık**.", "**Yapısına göre 3:** **Taklit** oyunları (tavşan sıçraması, top yuvarlanması), **mücadele** oyunları (sportif figür yok; stafet, halat çekme), **basit sportif oyun formları** (yakan top, yengeç futbolu).", "**Oyuncu sayısına göre** sınıflamada **mücadeleyi yapan** oyuncu sayısı esas alınır: ferdi, ikili, grup.", "Diğer sınıflamalar: yaş grubu, oynandığı alan, düzen (çizgi, daire, dağınık), araç-gereç, **amaç (eğlenme, eğitim, tedavi)**."]}], "questions": [{"q": "Hareket eğitimini geliştiren kişi kimdir?", "o": ["Gilliom", "Bruner", "Rudolf Laban", "Roger Caillois", "Piaget"], "a": 2, "e": "Gilliom ise problem çözme ve keşfetme metodunu kullanmıştır."}, {"q": "Temel hareket becerilerinin en hassas dönemi hangi yaş aralığıdır?", "o": ["12-14 yaş", "15-17 yaş", "2-5 yaş", "0-2 yaş", "6-9 yaş"], "a": 4, "e": "Kitabın D/Y testinde bu yaş 15-17 diye yanlış verilir."}, {"q": "Hareket eğitimi ile ilgili hangisi YANLIŞTIR?", "o": ["Gelişmeler belli aralıklarla ölçülmelidir", "Bireysel bir keşiftir", "Öğrenci merkezlidir", "Temelinde problem çözme vardır", "Geleneksel beden eğitiminden daha formaldir"], "a": 4, "e": "Hareket eğitimi geleneksel beden eğitiminden daha az formaldir."}, {"q": "Atma, tutma, yakalama ve ayakla vurma hangi beceri temasına girer?", "o": ["Alan farkındalığı", "Nesne kontrolü", "Dengeleme", "Efor farkındalığı", "Yer değiştirme"], "a": 1, "e": "Yer değiştirme becerileri yürüme, koşma, sıçrama gibi becerilerdir."}, {"q": "Galop, kayma ve tırmanma hangi beceri temasına girer?", "o": ["Hareket ilişkileri", "Yer değiştirme", "Dengeleme", "Nesne kontrolü", "Vücut farkındalığı"], "a": 1, "e": "Bu beceriler vücudun bir yerden başka yere taşınmasıdır."}, {"q": "\"Vücut nerede hareket eder?\" sorusu hangi hareket kavramına aittir?", "o": ["Hareket ilişkileri", "Alan farkındalığı", "Nesne kontrolü", "Vücut farkındalığı", "Efor farkındalığı"], "a": 1, "e": "Vücut farkındalığı \"ne\", efor farkındalığı \"nasıl\" sorusunu sorar."}, {"q": "Zaman, güç, tempo ve akıcılık hangi hareket kavramının bileşenleridir?", "o": ["Hareket ilişkileri", "Efor farkındalığı", "Vücut farkındalığı", "Dengeleme", "Alan farkındalığı"], "a": 1, "e": "Efor farkındalığı vücudun nasıl hareket ettiğini tanımlar."}, {"q": "Çocuğun güvenle yer değiştirebileceği, sınırları belli alana ne denir?", "o": ["Kişisel alan", "Genel alan", "Oyun alanı", "Yörünge", "Hareket alanı"], "a": 1, "e": "Kişisel alan, çocuğun kollarını açtığında sahip olduğu alandır."}, {"q": "Oyunun ortaya çıkışı ile ilgili hangisi doğrudur?", "o": ["Sanayi Devrimi ile başlamıştır", "İlk olarak okullarda ortaya çıkmıştır", "Antik Yunan'da icat edilmiştir", "Doğadaki olayların taklit edilmesiyle başlamıştır", "Sadece savaş eğitimi için yapılmıştır"], "a": 3, "e": "Taklit dürtüsü önce hayvanların ses ve hareketlerinden doğmuştur."}, {"q": "Roger Caillois'ya göre oyuncunun enerji harcamadığı, gidişatı kadere bıraktığı oyunlar hangileridir?", "o": ["Mücadele oyunları (Agon)", "Gösteri oyunları (Mimicry)", "Strateji oyunları", "Macera oyunları (Vertigo)", "Şans oyunları (Alea)"], "a": 4, "e": "Zar, rulet ve tombala şans oyunlarıdır."}, {"q": "Dans, kayak ve havada dalış Caillois'ya göre hangi oyun grubundadır?", "o": ["Macera/heyecan oyunları (Vertigo/Ilinx)", "Şans oyunları", "Fiziksel beceri oyunları", "Strateji oyunları", "Gösteri/rol oyunları"], "a": 0, "e": "Bu oyunlar baş döndürerek heyecan ve ürpertili zevk verir."}, {"q": "Futbol, mücadele oyunlarının hangi alt grubuna girer?", "o": ["Fiziksel beceri ve strateji oyunları", "Strateji ve şans içeren fiziksel beceri oyunları", "Şans oyunları", "Fiziksel beceri oyunları", "Strateji oyunları"], "a": 1, "e": "Futbolda fiziksel beceri, strateji ve tesadüf sonucu birlikte etkiler."}, {"q": "Oyunda takım çıkarını kendi çıkarından önde tutmak hangi duyguları geliştirir?", "o": ["Korku ve kaygı", "Mensubiyet ve fedakârlık", "Kıskançlık", "Utangaçlık", "Bencillik ve rekabet"], "a": 1, "e": "Bu katkı oyunun sosyal gelişime etkisidir."}, {"q": "Oyunun zihinsel gelişime en önemli etkisi nedir?", "o": ["Bağışıklık", "Liderlik", "Öğrenme", "Kas gelişimi", "İştah artışı"], "a": 2, "e": "Oyunlar çocukların zihinsel antrenmanı olarak görülür."}, {"q": "Eğitsel oyunlar Caillois'nın hangi oyun sınıfına girer?", "o": ["Ritüel oyunlar", "Macera (Vertigo)", "Şans (Alea)", "Gösteri (Mimicry)", "Mücadele/yarışma (Agon)"], "a": 4, "e": "Eğitsel oyunların temelinde kazanma ve üstün gelme vardır."}, {"q": "Sportif figür içermeyen, stafet ve halat çekme gibi oyunlar yapısına göre hangi gruptadır?", "o": ["Rol oyunları", "Basit sportif oyun formları", "Şans oyunları", "Mücadele oyunları", "Taklit oyunları"], "a": 3, "e": "Yakan top ve yengeç futbolu ise basit sportif oyun formlarıdır."}, {"q": "Oyuncu sayısına göre sınıflamada hangi sayı esas alınır?", "o": ["Sahadaki toplam oyuncu sayısı", "Mücadeleyi yapan oyuncu sayısı", "Takım sayısı", "Seyirci sayısı", "Yedek oyuncu sayısı"], "a": 1, "e": "Bu sınıflamada oyunlar ferdi, ikili ve grup oyunları olarak ayrılır."}, {"q": "“Çocuklar voleybol sahasında dağınık düzende yürürler. Çocukların ellerinde birer tane voleybol topu vardır. Voleybol topunu direksiyon gibi kullanarak voleybol sahasının içinde birbirlerine çarpmadan yürürler.”\nYukarıdaki etkinlik örneği hangi hareket kavramı ile daha yakından ilişkilidir?", "o": ["Vücut farkındalığı", "Alan farkındalığı", "Efor farkındalığı", "Hareket ilişkileri", "Çaba farkındalığı"], "a": 1, "e": "Doğru cevap: Alan farkındalığı.", "kb": 1}, {"q": "“Çocuklar beşerli grup olurlar. Her grup sahanın ortasındaki çizgisinde arka arkaya sıralanır. Sahanın dip çizgisinde huniler bulunmaktadır. Antrenörün komutu ile grubun önündeki çocuklar, gidip ilk huniyi alıp grubunun yanına gelir. Daha sonra ikinci çocuk gidip ikinci huniyi alır. Etkinlik son çocuğun huniyi almasına kadar devam eder.”\nYukarıdaki etkinlik örneği hangi temel hareket becerisine karşılık gelmektedir?", "o": ["Birleştirilmiş hareketler", "Dengeleme hareketleri", "Yer değiştirme", "Nesne kontrolü", "Yer hareketleri"], "a": 2, "e": "Doğru cevap: Yer değiştirme.", "kb": 1}, {"q": "Çocuğun temel hareket becerilerini geliştirdiği dönem aşağıdakilerden hangisidir?", "o": ["Okul öncesi ve ilkokul", "İlkokul ve ortaokul", "Okul öncesi", "İlkokul", "Tüm okul dönemi"], "a": 0, "e": "Doğru cevap: Okul öncesi ve ilkokul.", "kb": 1}, {"q": "“Basketbol topunu baş, omuz, bel, diz çevresinden, ayakların arasından düşürmeden çevirme”\nYukarıdaki etkinliğin karşılık geldiği temel hareket kavramı ve hareket becerisi aşağıdakilerden hangisinde birlikte ve doğru olarak verilmiştir?", "o": ["Alan farkındalığı – nesne kontrol becerisi", "Efor farkındalığı – dengeleme becerisi", "Vücut farkındalığı – nesne kontrol becerisi", "Alan farkındalığı – dengeleme becerisi", "Vücut farkındalığı - akrobatik beceriler"], "a": 2, "e": "Doğru cevap: Vücut farkındalığı – nesne kontrol becerisi.", "kb": 1}, {"q": "Aşağıdakilerden hangisi hareket eğitiminin özelliklerinden biri değildir?", "o": ["Hareket eğitimi bireysel bir keşiftir.", "Hareket eğitimi öğrenen merkezlidir.", "Temelinde problem çözme vardır.", "Geleneksel beden eğitiminden daha az formal yapıdadır.", "Motor becerilerin öğrenilmesini kolaylaştırır."], "a": 2, "e": "Doğru cevap: Temelinde problem çözme vardır.", "kb": 1}, {"q": "Oyunun tarihsel gelişimi aşağıdakilerden hangisinde doğru olarak verilmiştir?", "o": ["Algılama-Öğrenme- Yaşatma", "Bilgi- Görgü- Davranış", "Taklit – Ritüel- Gelenek", "İhtiyaç – Yaşam biçimi – Malzeme", "Beceri- Eğlenme- Kazanma"], "a": 2, "e": "Doğru cevap: Taklit – Ritüel- Gelenek.", "kb": 1}, {"q": "Aşağıdakilerden hangisi sportif mücadele oyun grubudur?", "o": ["Geleneksel oyunlar", "Şans oyunları", "Gösteri - rol oyunları", "Macera - heyecan oyunları", "Mücadele oyunları"], "a": 4, "e": "Doğru cevap: Mücadele oyunları.", "kb": 1}, {"q": "Aşağıdakilerden hangisi oyunların sosyal gelişim üzerine etkilerinden biri değildir?", "o": ["Meslekleri öğrenir.", "Rolleri öğrenir.", "Toplumsal farklı kültürleri öğrenir.", "İyi - kötüyü öğrenir.", "Gelenekleri öğrenir."], "a": 3, "e": "Doğru cevap: İyi - kötüyü öğrenir.", "kb": 1}, {"q": "Eğitsel oyunlarda kurallar belli olsa bile, oyuncular kendilerinden bazı şeyler oyuna katarak, bunları kurallar çerçevesinde arkadaşlarıyla paylaşırlar. Sınırlandırılmış hareketleri kendilerine göre yorumlama ve sergileme özgürlüğüne sahiptirler.\nYukarıdaki açıklama, eğitsel oyunların hangi özelliği ile ilgilidir?", "o": ["Motivasyon", "Özgür ortam olması", "Motorik özellikleri test etme imkânı", "Sonucun belirsizliği", "Karmaşıklık"], "a": 1, "e": "Doğru cevap: Özgür ortam olması.", "kb": 1}, {"q": "Aşağıdakilerden hangisi oynandıkları alanlara göre sınıflandırılan oyunlardan biri değildir?", "o": ["Sınıf oyunları", "Salon oyunları", "Bahçe veya kırsal alan oyunları", "Su oyunları", "Tiyatro oyunları"], "a": 4, "e": "Doğru cevap: Tiyatro oyunları.", "kb": 1}], "tf": [{"q": "Hareket eğitimi Rudolf Laban tarafından geliştirilmiştir.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Gilliom ise problem çözme ve keşfetme metodunu kullanmıştır.", "tf": true}, {"q": "Temel hareket becerilerinin en hassas dönemi 15-17 yaştır.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "En hassas dönem 6-9 yaştır.", "tf": true}, {"q": "Atma, tutma, yakalama, durdurma ve vurma yer değiştirme gerektiren hareketlerdir.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Bunlar nesne kontrolü becerileridir.", "tf": true}, {"q": "Vücut farkındalığı; vücut parçalarını tanıma, alabileceği şekilleri fark etme, vücudu taşıma ve dengede kalabilmeyi keşfetmeyi içerir.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Vücut farkındalığı \"vücut ne yapabilir?\" sorusunu sorar.", "tf": true}, {"q": "Kişisel alan, çocuğun güvenle yer değiştirebileceği alandır.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Bu tanım genel alana aittir.", "tf": true}, {"q": "Dengenin rolünü anlamak, hareketleri birbirine bağlamak ve sınırlı zaman ve alanda gerçekleştirmek için efor farkındalığı gerekir.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Efor farkındalığı vücudun nasıl hareket ettiğini tanımlar.", "tf": true}, {"q": "Oyunlar, insanların doğadaki olay ve özellikleri taklit etmesiyle başlamıştır.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Taklit önce hayvanların ses ve hareketlerinden doğmuştur.", "tf": true}, {"q": "Gösteri/rol oyunlarında oyuncular gidişata kendilerini bırakır ve enerji harcamazlar.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Bu özellik şans oyunlarına aittir.", "tf": true}, {"q": "Çocuk oyun dışı kalmamak için kurallara uymayı öğrenir ve topluma uyumlu olur.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Bu, oyunun sosyal gelişime katkısıdır.", "tf": true}, {"q": "Eğitsel oyunlar motorik özelliklerin gelişimine katkı sağlamaz.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Eğitsel oyunlar motorik özellikleri ve iradeyi geliştirir.", "tf": true}, {"q": "Oyunlar oynanma ve oynatılma amacına göre eğlenme, eğitim ve tedavi amaçlı olarak 3'e ayrılır.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Bu, seçmede ve oynamada etkili özelliklere göre yapılan sınıflamalardan biridir.", "tf": true}]}, {"id": "soo4", "title": "Motor Gelişim", "cards": [{"title": "Motor gelişimin tarihi", "points": ["Motor gelişim **doğum öncesinden ölüme** kadar süren tüm hareketsel süreçlerdir. Çocuklukta beceriler **oyunla** keşfedilir.", "**Başlangıç periyodu (1787-1928):** **Tiedemann** oğlunu gözlemledi; **Darwin** \"Bebeğin Biyografik Taslağı\", **Shinn** \"Bebeğin Biyografisi\".", "**Olgunlaşma periyodu (1928-1946):** Gelişim doğuştan sayıldı, **çevrenin etkisi yok** kabul edildi. Gessel, McGraw, **Bayley** ölçeği.", "**Norm/tanımlama periyodu (1946-1970):** **Standart testler** geliştirildi. Espenschade, Glassow, Rarick.", "**Süreç yönelimli periyot (1980-1990'lar):** Altta yatan süreçler incelendi. **Connolly**."]}, {"title": "Temel tanımlar", "points": ["**Hareket:** Vücudun ağırlık merkezinin iz düşümünün yer değiştirmesi; tüm vücut (**lokomotor**) veya bir parça.", "**Form:** Hareketin oluşması için gerekli, **dışarıdan gözlenebilen** tüm nörolojik süreçler.", "**Temel motor beceriler** **2-7 yaşta** ortaya çıkar: koşma, atma, atlama, yakalama, tırmanma.", "**Spor becerisi:** Temel becerilerin geliştirilmesiyle oluşan branşa özgü beceri.", "**Motor performans:** Süre, mesafe gibi değerlerle **ölçülebilen** özellikler.", "**Motor davranış:** Motor öğrenme, motor kontrol ve motor gelişimden oluşan biyolojik temelli değişimler."]}, {"title": "Büyüme, gelişim, olgunlaşma", "points": ["**Büyüme:** Gelişimin **ölçülebilen (niceliksel)** yönü; boy ve kilo artışı. **Pozitif** bir kavramdır.", "Büyümenin **en hızlı** olduğu dönem **doğum öncesidir**; sonra **bebeklik** ve **ergenlik** gelir.", "**Gelişim:** Büyüme, olgunlaşma, kalıtım ve öğrenmenin ürünüdür; **nitel ve nicel** değişimleri içerir.", "**Psikomotor gelişim** zamanla **ters yöne** gidebilir; olumlu ve olumsuz tüm değişimleri kapsar.", "**Olgunlaşma:** Doğuştandır, sınırları **genetiktir**, **çevreden etkilenmez**. Yenidoğandan yürüme beklenmez.", "**Hazırbulunuşluk:** Bir davranışı yapabilecek **ön bilgi, beceri ve tutuma** sahip olmak; fiziksel ve **zihinsel** hazır olmak."]}, {"title": "Refleks ve öğrenme", "points": ["Hareket ikiye ayrılır: **istem dışı (refleks)** ve **bilinçli (reaksiyon)**.", "**Refleks:** Uyarı **serebral kortekse ulaşmadan omurilikte** cevaba dönüşür. Yenidoğanda emme, göz kırpma.", "Refleksler büyüdükçe yerini **istemli** hareketlere bırakır. Yaşlanmayla sinir iletimi yavaşlar.", "**Öğrenme:** Deneyimle davranışın **kalıcı değişmesi** veya **yeniden düzenlenmesi**.", "Yüzme bilmeyenin yüzmeyi öğrenmesi **kalıcı davranış değişikliği**, yüzme bilenin yeni teknik öğrenmesi **davranışın yeniden düzenlenmesidir**."]}, {"title": "Gelişimin ilkeleri", "points": ["Gelişim zamanları farklı olsa da **sıra aynıdır**: önce emekleme, sonra yürüme, sonra koşma.", "Gelişimin yönü: **baştan ayağa, merkezden dışarı, genelden özele**. Yaşlılıkta baştan ayağa ilkesi tersine döner.", "Büyüme hızı **evrenseldir** ve dış etkenlere **direnç gösterir**; hastalıktan sonra **kendi kendine düzenlenme** ile yaşıtlarını yakalar.", "**Farklılaşma:** Basitten karmaşık becerilere geçiş. **Bütünleşme:** Duyu ve kas sistemlerinin koordineli çalışması (el-göz koordinasyonu).", "**Kritik dönem:** Doğum öncesinden **6 yaşa** kadar. Çocuk **zihinsel gelişiminin %60'ını, sinir sistemi gelişiminin %80'ini 5 yaşa** kadar tamamlar.", "**Bireysel farklılık:** 10. veya 13. ayda yürümek normaldir; **2 yaşında** hâlâ yürüyemiyorsa **gelişimsel gerilik** vardır."]}, {"title": "Filogeni ve ontogeni", "points": ["**Filogenetik beceriler:** Öğrenme gerekmeden **kendiliğinden** ortaya çıkan, büyük kaslarla yapılan beceriler: **atma, tutma, yürüme**.", "**Ontogenetik beceriler:** **Çevre ve öğrenme** sonucu gelişir; temel becerilerin özelleşmiş becerilere dönüşmesi.", "Filogenetik = **motor gelişim** süreci; ontogenetik = **motor öğrenme** süreci."]}, {"title": "Kalıtım", "points": ["Gelişimi etkileyen iki faktör: **kalıtım ve çevre**. Kalıtıma çok müdahale edilemez; çevreye müdahaleyle gelişimin yönü değişebilir.", "Cinsiyeti **babanın genleri** belirler (kız **XX**, erkek **XY**).", "Bireysel farklılıklardaki **en büyük etken kalıtımdır**.", "**Baskın:** koyu göz, yuvarlak kafatası, esmer ten, **kısa boy**. **Çekinik:** **açık göz**, uzun kafatası, beyaz ten, **uzun boy**.", "**Genotip:** Taşınan tüm genler. **Fenotip:** Genotip + çevrenin dış görünüşe yansıması.", "**Homozigot (arı döl):** AA veya aa. **Heterozigot (melez):** Aa. Baskın gen **büyük**, çekinik gen **küçük** harfle gösterilir."]}, {"title": "Çevre", "points": ["Becerilerin kazanılabilmesinin **temeli kalıtımdır**; ama çevre kısıtlıysa yetenek tam gelişmez. **Irk** da kalıtsal bir faktördür.", "**Doğum öncesi çevre:** Bebeğin ilk ve tek çevresi **anne rahmidir**. En sık sorunlar: annenin **yetersiz beslenmesi** ve **alkol/sigara** kullanımı.", "**Doğum sırasında:** Kordon dolanması ve oksijensiz kalma, ters pozisyon gibi etmenler.", "**Doğum sonrası fiziksel çevre:** beslenme, fiziksel aktivite, hastalık, iklim, yorgunluk, **teknoloji bağımlılığı**. **Aşırı yorgunluk** büyümeyi olumsuz etkiler.", "**Sosyal çevre:** Aile, örf ve âdetler. Alışkanlıklar büyük oranda sosyal çevreye bağlıdır."]}, {"title": "Piaget: bilişsel gelişim", "points": ["Piaget'ye göre 3 aşama: **özümleme → uyma → adaptasyon**.", "**Duyusal motor (0-2 yaş):** **Nesnelerin sürekliliği**, taklit, deneme-yanılma. Saklanan oyuncağı yok sanır.", "**İşlem öncesi (2-6 yaş):** Önce **sembolik**, sonra **sezgisel**. Sınıflandırma **tek boyutludur**; **korunum ve tersine çevirme yoktur**.", "**Somut işlemler (7-11 yaş):** **Nedensel mantık**, korunum ve tersine çevirme gelişir; **çok boyutlu** sınıflandırma; soyut kavramlarda yetersiz.", "**Soyut işlemler (12+ yaş):** **Tümdengelim ve tümevarım**; ergenliğe geçiş. Bilişsel gelişim **~15 yaşında** zirveye ulaşır.", "**2-5 yaş** oyunla öğrenme dönemidir; **lego ve yapboz** bilişsel gelişimi destekler. **6-11 yaşın** en belirgin özelliği sürekli **\"neden\"** sorusudur."]}, {"title": "Duyuşsal ve psikomotor gelişim", "points": ["Duyuşsal gelişim **yaşam boyu** sürer ve bilişsel gelişimi destekler. Çocuk **5-6 yaşına** kadar başkalarının farklı düşünebileceğini bilmez.", "**2-5 yaş duyuşsal:** En **bencil ve ısrarcı** dönem. **En önemli özelliği doğruyu yanlıştan ayırt edebilmeleridir**; vicdan gelişmeye başlar.", "**6-11 yaş duyuşsal:** **Cinsiyet farkları** hissedilir; kaybetmeyi tam kabullenemez; dışarıda evdekinden daha olgun davranır.", "**2-5 yaş motor:** **İnce motor**, kaba motordan çok daha zayıftır; yürümek yerine **koşmayı** tercih eder; cinsiyet farkı yoktur.", "**6-11 yaş motor:** **Kaba motor** gelişimi ince motordan fazladır; **enerji yüksek, dayanıklılık düşüktür**; **dominant el ve ayak** bellidir."]}], "questions": [{"q": "Motor gelişim ne zaman başlar?", "o": ["Okula başlayınca", "Doğumla", "Ergenlikte", "Emeklemeyle", "Doğum öncesinde"], "a": 4, "e": "Kitabın D/Y testinde \"doğumdan başlar\" ifadesi yanlıştır."}, {"q": "Gelişimin doğuştan geldiği kabul edilen ve çevrenin etkisinin yok sayıldığı periyot hangisidir?", "o": ["Süreç yönelimli periyot", "Olgunlaşma periyodu (1928-1946)", "Modern periyot", "Başlangıç periyodu", "Norm/tanımlama periyodu"], "a": 1, "e": "Gessel, McGraw ve Bayley bu dönemde çalışmıştır."}, {"q": "Motor performans düzeyini belirlemek için standart testlerin geliştirildiği periyot hangisidir?", "o": ["Endüstri öncesi periyot", "Olgunlaşma periyodu", "Başlangıç periyodu", "Süreç yönelimli periyot", "Norm/tanımlama periyodu (1946-1970)"], "a": 4, "e": "Espenschade, Glassow ve Rarick bu dönemin isimleridir."}, {"q": "Temel motor beceriler hangi yaş aralığında ortaya çıkar?", "o": ["0-1 yaş", "11-14 yaş", "8-10 yaş", "15-18 yaş", "2-7 yaş"], "a": 4, "e": "Bu beceriler sportif (özelleşmiş) becerilere zemin hazırlar."}, {"q": "Büyümenin en hızlı olduğu dönem hangisidir?", "o": ["Geç çocukluk", "Bebeklik", "Erken çocukluk", "Doğum öncesi dönem", "Ergenlik"], "a": 3, "e": "Doğum öncesinden sonra sırasıyla bebeklik ve ergenlik gelir."}, {"q": "Doğuştan gelen, sınırları genetik olan ve çevresel etkilerden etkilenmeyen kavram hangisidir?", "o": ["Deneyim", "Motor performans", "Olgunlaşma", "Öğrenme", "Hazırbulunuşluk"], "a": 2, "e": "Olgunlaşmadan sonra ortaya çıkan becerinin gelişimi ise çevreye bağlıdır."}, {"q": "Fiziksel ve taktiksel olarak hazır ama zihinsel hazırlığı yetersiz bir sporcunun hangi özelliği düşüktür?", "o": ["Olgunlaşma", "Hazırbulunuşluk", "Motor kontrol", "Büyüme", "Filogenetik beceri"], "a": 1, "e": "Hazırbulunuşluk fiziksel ve zihinsel olarak hazır olmayı gerektirir."}, {"q": "Uyarının serebral kortekse ulaşmadan omurilikte cevaba dönüşmesiyle oluşan hareket hangisidir?", "o": ["Spor becerisi", "Refleks", "Seri beceri", "Reaksiyon", "İstemli hareket"], "a": 1, "e": "Yenidoğandaki emme ve göz kırpma refleks örnekleridir."}, {"q": "Yüzme bilen birinin yeni bir yüzme tekniği öğrenmesi neye örnektir?", "o": ["Olgunlaşma", "Büyüme", "Kalıcı davranış değişikliği", "Davranışın yeniden düzenlenmesi", "Refleks"], "a": 3, "e": "Yüzme bilmeyenin yüzmeyi öğrenmesi ise kalıcı davranış değişikliğidir."}, {"q": "Aşağıdakilerden hangisi gelişimin yönüyle ilgili ilkelerden biri DEĞİLDİR?", "o": ["Büyük kaslardan küçük kaslara", "Baştan ayağa", "Merkezden dışarı", "Ayaktan başa", "Genelden özele"], "a": 3, "e": "Gelişim baştan ayağa doğru ilerler; yalnızca yaşlılıkta tersine döner."}, {"q": "Çocuk, sinir sistemi gelişiminin yüzde kaçını 5 yaşına kadar tamamlar?", "o": ["%40", "%100", "%50", "%80", "%60"], "a": 3, "e": "Zihinsel gelişimin ise %60'ı 5 yaşına kadar tamamlanır."}, {"q": "Hangi durumda gelişimsel gerilikten söz edilir?", "o": ["10. ayda yürümesi", "Önce emekleyip sonra yürümesi", "13. ayda yürümesi", "1 yaşında koşamaması", "Çocuğun 2 yaşında hâlâ yürüyememesi"], "a": 4, "e": "10. ve 13. ayda yürümek bireysel farklılıktır."}, {"q": "Öğrenme gerekmeden kendiliğinden ortaya çıkan atma, tutma ve yürüme gibi becerilere ne denir?", "o": ["Filogenetik beceriler", "Ontogenetik beceriler", "Seri beceriler", "Zihinsel beceriler", "Spor becerileri"], "a": 0, "e": "Ontogenetik beceriler çevre ve öğrenme sonucu gelişir."}, {"q": "Cinsiyeti hangi ebeveynin genleri belirler?", "o": ["Babanın", "Her ikisinin eşit olarak", "Annenin", "Çevrenin", "Büyükannenin"], "a": 0, "e": "Kadınlar XX dizilimli olduğu için cinsiyeti belirleyemez."}, {"q": "Aşağıdakilerden hangisi kalıtımda BASKIN bir özelliktir?", "o": ["Açık göz rengi", "Beyaz ten rengi", "Uzun kafatası", "Kısa boy", "Uzun boy"], "a": 3, "e": "Açık göz, uzun kafatası, beyaz ten ve uzun boy çekinik özelliklerdir."}, {"q": "Genotip ile çevre etkisinin birleşerek dış görünüşe yansımasına ne denir?", "o": ["Alel", "Heterozigot", "Genotip", "Fenotip", "Homozigot"], "a": 3, "e": "Genotip, canlının taşıdığı baskın ve çekinik genlerin tümüdür."}, {"q": "Doğum öncesi çevrede en sık görülen olumsuz etkenler hangileridir?", "o": ["Babanın yaşı", "Annenin uyuması", "Mevsim değişikliği", "Annenin yetersiz beslenmesi ve alkol/sigara kullanımı", "Annenin spor yapması"], "a": 3, "e": "Bebeğin ilk ve tek çevresi anne rahmidir."}, {"q": "Piaget'ye göre nesnelerin sürekliliği hangi dönemde öğrenilir?", "o": ["Soyut işlemler dönemi", "Ergenlik dönemi", "İşlem öncesi dönem", "Duyusal motor dönem (0-2 yaş)", "Somut işlemler dönemi"], "a": 3, "e": "Bu dönemde saklanan oyuncağın yok olduğu sanılır."}, {"q": "Sınıflandırmanın tek boyutlu olduğu, korunum ve tersine çevirmenin gelişmediği dönem hangisidir?", "o": ["Soyut işlemler dönemi", "İşlem öncesi dönem (2-6 yaş)", "Somut işlemler dönemi", "Bebeklik", "Duyusal motor dönem"], "a": 1, "e": "\"Kardeşinin kardeşi var mı?\" sorusuna \"yok\" demesi tersine çevirememeye örnektir."}, {"q": "Piaget'ye göre bilişsel gelişim yaklaşık hangi yaşta en üst düzeye ulaşır?", "o": ["25", "15", "7", "18", "11"], "a": 1, "e": "Soyut işlemler dönemi 12 yaşında başlar."}, {"q": "Erken çocuklukta (2-5 yaş) duyuşsal gelişimin en önemli özelliği nedir?", "o": ["Doğru ile yanlışı ayırt edebilmeleri", "Cinsiyet farklılıklarını hissetmeleri", "Kaybetmeyi kabullenmeleri", "Dominant elin belirlenmesi", "Soyut düşünebilmeleri"], "a": 0, "e": "Cinsiyet farklılıkları 6-11 yaşta hissedilmeye başlar."}, {"q": "Geç çocuklukta (6-11 yaş) motor gelişimle ilgili hangisi doğrudur?", "o": ["Cinsiyetler arası hiç fark yoktur", "Dominant el henüz belirlenmemiştir", "Enerjileri yüksek, dayanıklılıkları düşüktür", "Büyüme erken çocukluğa göre daha hızlıdır", "İnce motor gelişimi kaba motordan fazladır"], "a": 2, "e": "Bu dönemde kaba motor gelişimi ince motordan fazladır."}, {"q": "Ali ve Yeşim, boyları 48- 49 cm. kiloları ise 1550 ve 1540 gr. olarak doğan ikiz kardeşlerdir. Doğumlarından 6 aylık olduklarında Ali 68 cm. ve 8 kg., Yeşim ise 64 cm. ve 7.2 kg.’ye ulaşmıştır. Aynı zamanda anne sütüne ek olarak, elma ve havuç püresi yiyebilmektedirler.\nYukarıdaki bilgilere göre Ali ve Yeşim’in geçirdiği bu süreç aşağıdaki kavramlardan hangileri ile açıklanabilir?", "o": ["Gelişim – Hazırbulunuşluk", "Büyüme – Hazırbulunuşluk", "Gelişme – Olgunlaşma", "Büyüme – Gelişme", "Olgunlaşma – Hazırbulunuşluk"], "a": 3, "e": "Doğru cevap: Büyüme – Gelişme.", "kb": 1}, {"q": "Ahmet bebekliğinden beri suyu çok sevmektedir. Annesi ve babası Ahmet’i 5 yaşına geldiğinde yüzmeyi öğrenebilmesi için kursa yazdırmışlardır. Kısa bir süre sonra yüzmeyi öğrenen Ahmet öğretmeni tarafından yetenekli bulunmuş, farklı yüzme stilleri öğrenmeye başlamıştır ve yarışmalara katılacak düzeye gelmiştir.\nYukarıdaki bilgilere göre Ahmet’in geçirdiği aşamalar aşağıdakilerden hangisinde sırasıyla ve doğru olarak verilmiştir?", "o": ["Gelişim - Motor Gelişim – Motor Öğrenme davranışı", "Olgunlaşma – Motor Gelişim – Algısal davranış değişikliği", "Gelişme – Kalıcı davranış değişikliği – Davranışların yeniden düzenlenmesi", "Büyüme – Olgunlaşma - Kalıcı davranış değişikliği", "Olgunlaşma – Kalıcı davranış değişikliği – Davranışların yeniden düzenlenmesi"], "a": 4, "e": "Doğru cevap: Olgunlaşma – Kalıcı davranış değişikliği – Davranışların yeniden düzenlenmesi.", "kb": 1}, {"q": "Buğra doğduğu günden iki ay sonra yüzüstü durduğunda kollarının üzerinde gövdesini yukarı kaldırabilmiştir. Kuzeni Gonca ise aynı hafta doğmuş olmalarına rağmen, hâlâ bu hareketi yapamamaktadır. İkisi de son derece sağlıklı olan kuzenlerin hareketleriyle ilgili bu durumun olası sebebi aşağıdakilerden hangisidir?", "o": ["Bu durum Buğra’nın üstün yetenekli olmasından kaynaklanmaktadır.", "Bu durum Gonca’nın yetersiz olmasından kaynaklanmaktadır.", "Bu durum bireysel olarak aynı olmalarından kaynaklanmaktadır.", "Bu durum bireysel olarak farklı olmalarından kaynaklanmaktadır.", "Bu durum Gonca’da gelişim geriliği olmasından kaynaklanmaktadır."], "a": 3, "e": "Doğru cevap: Bu durum bireysel olarak farklı olmalarından kaynaklanmaktadır.", "kb": 1}, {"q": "Eren düz saçlı ve ela gözlü 4 yaşında bir erkek çocuğudur. Eren’in göz rengi annesine, saçlarının düz olması ise babasına benzemektedir. Eren’in anne ve babasıyla olan bu benzerliği aşağıdaki kavramlardan hangisiyle açıklanabilir?", "o": ["Benzerlik", "Farklılık", "Değişim", "Kalıtım", "Gelişme"], "a": 3, "e": "Doğru cevap: Kalıtım.", "kb": 1}, {"q": "Koray fiziksel açıdan çok yetenekli bir çocuktur. Ancak yaşadıkları köyde spor yapabileceği bir alan bulunmamaktadır. Bu nedenle Koray tarlada anne ve babasına yardım etmekte, okula gidip gelmektedir. Koray’ın içerisinde bulunduğu duruma bakılarak, bu ortamın oluşma sebebi aşağıdakilerden hangisidir?", "o": ["Kalıtım", "Maddi Yetersizlik", "Fiziksel Çevre", "Sosyal Çevre", "Kalıtım Çevre ilişkisi"], "a": 2, "e": "Doğru cevap: Fiziksel Çevre.", "kb": 1}, {"q": "Aşağıdakilerden hangisinde Piaget’in bilişsel gelişim aşamaları birlikte ve doğru olarak verilmiştir?", "o": ["Duyusal Motor Dönem – İşlem Dönemi – Somut İşlemler Dönemi– Soyut İşlemler Dönemi", "İşlem Öncesi - İşlem Sonrası Dönem – Somut İşlem Öncesi – Somut İşlem Sonrası Dönem", "Duyusal Motor Dönem -İşlem Öncesi Dönemi - Somut İşlemler Dönemi- Soyut İşlemler Dönemi", "İşlem Öncesi Dönem - İşlem Dönemi – Somut İşlemler Dönemi– Soyut İşlemler Dönemi", "İşlem Öncesi Dönem - İşlem Dönemi - İşlem Sonrası Dönem- Soyut İşlemler Dönemi"], "a": 2, "e": "Doğru cevap: Duyusal Motor Dönem -İşlem Öncesi Dönemi - Somut İşlemler Dönemi- Soyut İşlemler Dönemi.", "kb": 1}, {"q": "Mert annesine, öncesinde severek gittiği futbol kursuna artık gitmek istemediğini sevmediğini söylemiştir. Mert’in bu davranışı aşağıdaki gelişim süreçlerinden hangisiyle açıklanabilir?", "o": ["Motor gelişim süreci", "Bilişsel gelişim süreci", "Duyuşsal gelişim süreci", "Psikomotor gelişim süreci", "Psikososyal gelişim süreci"], "a": 1, "e": "Doğru cevap: Bilişsel gelişim süreci.", "kb": 1}, {"q": "Becerilerin türü açısından incelendiğinde, yürüme ve paten kayma becerilerinin türü aşağıdakilerden hangisinde birlikte ve doğru olarak verilmiştir?", "o": ["Motor Beceri- Motor Beceri", "Motorgenetik beceri– Ontogenetik beceri", "Ontogenetik beceri- Ontogenetik beceri", "Filogenetik beceri- Ontogenetik beceri", "Ontogenetik beceri – Filogenetik becer"], "a": 3, "e": "Doğru cevap: Filogenetik beceri- Ontogenetik beceri.", "kb": 1}, {"q": "Motor gelişimin tarihsel gelişimine bakıldığında 4 ana periyot olduğu görülmektedir. Bu periyotlar aşağıdakilerden hangisinde sırasıyla ve doğru olarak verilmiştir?", "o": ["Başlangıç periyodu-Olgunlaşma periyodu- Norm/tanımlama periyodu-Süreç yönelimli dönem", "Başlangıç periyodu-Norm/tanımlama periyodu- Olgunlaşma periyodu-Süreç yönelimli dönem", "Başlangıç periyodu-Norm/tanımlama periyodu- Süreç yönelimli dönem-Olgunlaşma periyodu", "Başlangıç periyodu-Süreç yönelimli dönem- Norm/tanımlama periyodu-Olgunlaşma periyodu", "Başlangıç periyodu-Olgunlaşma periyodu-Süreç yönelimli dönem-Norm/tanımlama periyodu"], "a": 0, "e": "Doğru cevap: Başlangıç periyodu-Olgunlaşma periyodu- Norm/tanımlama periyodu-Süreç yönelimli dönem.", "kb": 1}, {"q": "I. Yüze su geldiğinde göz kırpmak\nII. Nefesi tutarak suya dalmak\nIII. Tek gözü kırpmak\nIV. Sıcak bir nesneye değdiğinde elini çekmek\nYukarıdaki hareket çeşitlerinden hangileri refleksif hareketler grubuna girmektedir?", "o": ["I ve II", "I ve IV", "II ve IV", "I, II ve III", "I, III ve IV"], "a": 2, "e": "Doğru cevap: II ve IV.", "kb": 1}], "tf": [{"q": "Motor gelişim doğumdan başlar ve ölüme kadar devam eden tüm hareketsel süreçleri kapsar.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Motor gelişim doğum öncesinden başlar.", "tf": true}, {"q": "Form, hareketin oluşması için gerekli olan ve dışarıdan gözlemlenebilen tüm nörolojik süreçleri ifade eder.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Form, hareketin belirli düzende yapılarak model oluşturmasıdır.", "tf": true}, {"q": "Büyümenin en hızlı olduğu dönem doğum öncesi dönemdir.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Sonra bebeklik ve ergenlik gelir.", "tf": true}, {"q": "İstemli hareketler, eklem reseptörlerinden alınan uyarının serebral kortekse ulaşmadan omurilikte cevaba dönüşmesiyle oluşur.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Bu tanım refleksin tanımıdır.", "tf": true}, {"q": "Yüzme bilmeyen birinin yüzme öğrenmesi kalıcı davranış değişikliği, yüzme bilen birinin yeni teknik öğrenmesi davranışın yeniden düzenlenmesidir.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Öğrenme bu iki şekilde gerçekleşebilir.", "tf": true}, {"q": "Hazırbulunuşluk, olgunlaşma ve öğrenme sonucu belli davranışları gerçekleştirebilecek ön bilgi, beceri ve tutuma sahip olmaktır.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Hazırbulunuşluk fiziksel ve zihinsel hazır olmayı içerir.", "tf": true}, {"q": "Gelişim baştan ayağa, merkezden dışarı ve genelden özele yol izler.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Bunlar gelişimin yönüyle ilgili ilkelerdir.", "tf": true}, {"q": "Öğrenme ihtiyacı duymadan kendiliğinden ortaya çıkan atma, tutma, yürüme gibi beceriler ontogenetik becerilerdir.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Bunlar filogenetik becerilerdir.", "tf": true}, {"q": "Açık göz rengi kalıtımda çekinik bir özelliktir.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Koyu göz rengi ise baskındır.", "tf": true}, {"q": "Piaget'nin bilişsel gelişim kuramına göre duyusal motor dönem 0-2 yaş arasını kapsar.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Bu dönemde nesnelerin sürekliliği, taklit ve deneme-yanılma öğrenilir.", "tf": true}, {"q": "Geç çocuklukta kaba motor becerilerin gelişimi, ince motor becerilerin gelişimine oranla daha fazladır.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Erken çocuklukta da ince motor, kaba motordan zayıftır.", "tf": true}]}, {"id": "soo5", "title": "Ölçme ve Değerlendirme", "cards": [{"title": "Neden ölçeriz?", "points": ["Ölçme ve değerlendirme **bir amaç değil, araçtır**.", "**Yerleştirme:** Sporcuları uygun gruplara ayırmak (yüzme bilen ve bilmeyen ayrı).", "**Tanı (teşhis):** Mevcut durumu ve zayıf yönleri belirlemek.", "**Başarının değerlendirilmesi:** Amaçlara ulaşılıp ulaşılmadığını görmek.", "**Tahmin (kestirim):** Gelecekteki başarıyı veya riskleri öngörmek.", "**Program değerlendirme** ve **motivasyon:** Test edileceğini bilmek sporcuyu motive eder."]}, {"title": "Ölçme ve değişkenler", "points": ["**Ölçme:** Bir özelliğe sahip olunup olunmadığını ve ne oranda sahip olunduğunu **sayı, sıfat veya sembolle** ifade etmek.", "3 aşama: **özelliği tanımlama → sayı/sembol kümesini belirleme → kuralı belirleme**.", "Ölçülen şey bireyin kendisi değil, bireydeki bir **değişkendir**. Değişken en az **2 farklı değer** alır.", "**Nicel:** Sayıyla (boy, yaş). **Nitel:** Sıfat veya sembolle (cinsiyet, tutulan takım).", "**Sürekli:** İki değer arasında her zaman başka değer vardır (uzunluk, **VO2maks**). **Süreksiz (kesikli):** Sınırlı değer (medeni durum, diploma derecesi).", "**Bağımsız (etkileyen)** değişken başkasına bağlı değildir; **bağımlı (etkilenen)** değişken ona göre değişir."]}, {"title": "Ölçme türleri", "points": ["**Doğrudan ölçme:** Özellik aynı türden bir araçla ölçülür (boy, ağırlık); **güvenirlik ve geçerlik yüksektir**.", "**Dolaylı ölçme:** Özellik doğrudan ölçülemez, ilgili başka bir özellik ölçülür. **Termometre**, sıcaklığı cıvanın yükselmesinden ölçer; kişilik de tepkilerden ölçülür.", "**Türetilmiş ölçme:** Başka ölçümlerden hesapla bulunur (**vücut kitle endeksi**). En az **iki ölçme sonucu** gerekir."]}, {"title": "Birim ve sıfır", "points": ["**Birim:** Ölçme aracını oluşturan en küçük parça (cm, gram); objektiflik ve standart sağlar.", "**Eşitlik:** Birimler eşit olmalı (metredeki santimetreler eşit; **karış ve adım eşit değil**).", "**Genellik:** Herkesçe bilinmeli; cm yerine **inç** kullanmak genelliği bozar.", "**Kullanışlılık:** Değişkenin büyüklüğüne uygun olmalı; boyda **cm**, mm'den kullanışlıdır.", "**Mutlak (gerçek) sıfır:** Özelliğin **yokluğunu** gösterir (\"takımda oynayan öğrenci yok\").", "**Bağıl (göreceli) sıfır:** Yokluk göstermez (\"hava 0 derece\")."]}, {"title": "4 ölçek türü", "points": ["En az bilgi verenden en çoğa: **Sınıflama → Sıralama → Eşit aralıklı → Eşit oranlı**.", "**Sınıflama (nominal):** En basit ölçek; uzun/kısa gibi sınıflar. **Karşılaştırma yapılamaz**; sadece **frekans** ve **mod (tepe değer)**.", "**Sıralama (dereceleme):** Sıralar ama farkın miktarını vermez; **birimler eşit değildir**. **Medyan**, yüzdelik ve korelasyon hesaplanır.", "**Eşit aralıklı:** Sıfır noktası **görecelidir** (termometre, takvim). Aritmetik ortalama ve standart sapma da hesaplanır.", "**Eşit oranlı:** Sıfır **gerçek sıfırdır** (kilogram, metre); her işlem yapılır.", "Saati söylemek **eşit aralıklı**, **kronometreyle** süre tutmak **eşit oranlı** ölçektir."]}, {"title": "İstatistik terimleri", "points": ["**Frekans:** Her birimden kaç tane olduğu.", "**Mod:** En çok tekrar eden değer; **tepe değer** de denir.", "**Medyan:** Sıralı veriyi **ortadan ikiye** bölen değer.", "**Aritmetik ortalama:** Toplam puan / veri sayısı.", "**Standart sapma:** Kitapta \"ortalamadan sapmaların kareleri ortalaması\" diye geçer. (Bu tanım aslında varyansın tanımıdır; standart sapma onun karekökü.)", "**Korelasyon katsayısı:** İki değişken arasındaki ilişkinin **yönünü ve büyüklüğünü** gösterir."]}, {"title": "Değerlendirme ve ölçüt", "points": ["**Değerlendirme:** Ölçme sonucunun bir **ölçütle karşılaştırılıp karar verilmesidir**. Öğeleri: **ölçme sonuçları, ölçüt, karar**.", "**Mutlak ölçüt:** Ölçmeden **önce** belirlenir, kesindir (\"**boyu 180 üstü** olanlar seçilecek\"). Kurumdaki **yetkili kurul** belirler.", "**Bağıl ölçüt:** Ölçmeden **sonra**, grubun sonuçlarına göre belirlenir (\"**ilk 3'e girenler** başarılı\"). **Değerlendirmeyi yapan kişi** belirler.", "Ölçüte göre değerlendirme: **mutlak = kritere bağlı**, **bağıl = norm dayanaklı** değerlendirme."]}, {"title": "Amaca göre değerlendirme", "points": ["**Tanıma ve yerleştirme:** Sürecin **başında** yapılır; sporcuyu tanımak ve seçmek için.", "**Biçimlendirici (formatif):** Süreç **içinde** yapılır; eksikleri bulup aksaklıkları gidermek ve programı güncellemek için.", "**Özetleyici (değer biçme):** Sürecin **sonunda** yapılan nihai değerlendirme; **müsabaka sonuçları** da özetleyicidir.", "Biçimlendirici değerlendirmeler, özetleyici değerlendirmeye **katkı sağlar**."]}], "questions": [{"q": "Ölçme ve değerlendirmenin niteliği ile ilgili hangisi doğrudur?", "o": ["Bir amaç değil, araçtır", "Motivasyonu düşürür", "Sadece yarışmalarda kullanılır", "Tek başına bir amaçtır", "Sadece tanı koymak içindir"], "a": 0, "e": "Yerleştirme, tanı, tahmin ve motivasyon gibi amaçlar için kullanılır."}, {"q": "Yüzme bilenlerle bilmeyenlerin ayrı gruplara ayrılması ölçmenin hangi amacına örnektir?", "o": ["Tahmin", "Motivasyon", "Yerleştirme", "Program değerlendirme", "Tanı"], "a": 2, "e": "Benzer yetenekteki sporcuları aynı grupta toplamak öğretimi kolaylaştırır."}, {"q": "Bir sporcunun gelecekteki kardiyovasküler hastalık riskinin öngörülmesi ölçmenin hangi amacıdır?", "o": ["Yerleştirme", "Başarının değerlendirilmesi", "Motivasyon", "Tahmin (kestirim)", "Tanı"], "a": 3, "e": "Tahmin, gelecekteki başarıyı veya riskleri öngörmektir."}, {"q": "Aşağıdakilerden hangisi nitel bir değişkendir?", "o": ["Zeka puanı", "Ağırlık", "Tutulan futbol takımı", "Boy uzunluğu", "Yaş"], "a": 2, "e": "Nitel değişkenler sıfat veya sembolle ifade edilir."}, {"q": "VO2maks ve uzunluk hangi tür değişkendir?", "o": ["Sınıflama değişkeni", "Süreksiz değişken", "Sürekli değişken", "Nitel değişken", "Kesikli değişken"], "a": 2, "e": "Sürekli değişkenlerde iki değer arasında her zaman başka bir değer bulunur."}, {"q": "Termometrenin sıcaklığı cıvanın yükselmesinden ölçmesi hangi ölçme türüdür?", "o": ["Dolaylı ölçme", "Doğrudan ölçme", "Türetilmiş ölçme", "Mutlak ölçme", "Bağıl ölçme"], "a": 0, "e": "Kişilik özelliklerinin tepkilerden ölçülmesi de dolaylı ölçmedir."}, {"q": "Vücut kitle endeksinin hesaplanması hangi ölçme türüdür?", "o": ["Dolaylı ölçme", "Türetilmiş ölçme", "Doğrudan ölçme", "Sınıflama", "Sıralama"], "a": 1, "e": "Türetilmiş ölçme için en az iki ölçme sonucu gerekir."}, {"q": "Ölçmede birimin değişkenin büyüklüğüne uygun olması hangi özelliktir?", "o": ["Eşitlik", "Geçerlik", "Güvenirlik", "Genellik", "Kullanışlılık"], "a": 4, "e": "Kitabın D/Y testinde bu özellik \"genellik\" diye yanlış sorulur."}, {"q": "Karış ve adımın güvenilir birim olmamasının nedeni hangi özelliği taşımamasıdır?", "o": ["Objektiflik", "Eşitlik", "Kullanışlılık", "Süreklilik", "Genellik"], "a": 1, "e": "Metredeki santimetreler birbirine eşittir; karış ve adım kişiden kişiye değişir."}, {"q": "\"Hava bugün 0 derece\" ifadesindeki sıfır hangi türdür?", "o": ["Gerçek sıfır", "Bağıl (göreceli) sıfır", "Başlangıç sıfırı", "Doğal sıfır", "Mutlak sıfır"], "a": 1, "e": "0 derece sıcaklığın olmadığı anlamına gelmez."}, {"q": "En az bilgi veren ölçek türü hangisidir?", "o": ["Sıralama ölçeği", "Eşit oranlı ölçek", "Dereceleme ölçeği", "Eşit aralıklı ölçek", "Sınıflama ölçeği"], "a": 4, "e": "Sınıflama ölçeğinde sadece frekans ve mod hesaplanabilir."}, {"q": "Bir veri setinde en çok tekrar eden değere ne denir?", "o": ["Aritmetik ortalama", "Frekans", "Medyan", "Standart sapma", "Mod"], "a": 4, "e": "Moda tepe değer de denir."}, {"q": "Sıralama ölçeğinde hangisi hesaplanabilir?", "o": ["Aritmetik ortalama", "Çarpma", "Medyan", "Toplama", "Oran"], "a": 2, "e": "Sıralama ölçeğinde birimler eşit olmadığından dört işlem yapılamaz."}, {"q": "Kronometre ile süre tutmak hangi ölçek türüdür?", "o": ["Sıralama ölçeği", "Eşit oranlı ölçek", "Nominal ölçek", "Sınıflama ölçeği", "Eşit aralıklı ölçek"], "a": 1, "e": "Saati söylemek ise eşit aralıklı ölçektir."}, {"q": "\"Boyu 180 cm üstü olanlar takıma seçilecek\" ifadesindeki ölçüt hangisidir?", "o": ["Bağıl ölçüt", "Biçimlendirici ölçüt", "Norm ölçüt", "Göreceli ölçüt", "Mutlak ölçüt"], "a": 4, "e": "Mutlak ölçüt ölçmeden önce belirlenir ve kesindir."}, {"q": "Bağıl ölçütü kim belirler?", "o": ["Değerlendirmeyi yapacak kişi", "Federasyon", "Bakanlık", "Sporcular", talama puanın üzerinde olanlar dersi geçer.", "15 saniyenin altında koşanlar finale kalır.", "60 puan alan dersi geçer.", "Ödevini zamanında teslim etmeyen kalır.", "15 atışın tamamını basket atan 100 alır."], "a": 0, "e": "Doğru cevap: Aritmetik ortalama puanın üzerinde olanlar dersi geçer.", "kb": 1}, {"q": "Bir antrenör takımındaki sporcuları başarı durumlarına göre “başarılı” ve “başarısız” diye ayırmıştır. Buna göre başarı ölçütlerinin değişken türü aşağıdakilerden hangisidir?", "o": ["Bağımlı", "Bağımsız", "Sürekli", "Kesikli", "Nicel"], "a": 3, "e": "Doğru cevap: Kesikli.", "kb": 1}, {"q": "Bir antrenörün sporcusunun gol atışına göre her golüne puan vermesi ölçme türlerinden hangisine örnektir?", "o": ["Doğrudan", "Türetilmiş", "Dolaylı", "Mutlak", "Oranlı"], "a": 0, "e": "Doğru cevap: Doğrudan.", "kb": 1}], "tf": [{"q": "Ölçme ve değerlendirme bir amaç değil, araçtır.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Yerleştirme, tanı, tahmin gibi amaçlar için kullanılır.", "tf": true}, {"q": "Ölçme ve değerlendirme yöntemleriyle tahmin yapılabilir, ancak tanı/teşhis konulamaz.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Tanı koyma da ölçme ve değerlendirmenin amaçlarındandır.", "tf": true}, {"q": "Cinsiyet, tutulan futbol takımı, mezun olunan okul türü gibi değişkenler nitel değişkenlerdir.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Nitel değişkenler sıfat veya sembolle ifade edilir.", "tf": true}, {"q": "Ölçülecek özelliğin doğrudan ölçülemediği durumda onunla ilgili başka bir özellikle ölçülmesi türetilmiş ölçmedir.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Bu, dolaylı ölçmedir.", "tf": true}, {"q": "Ölçmede kullanılan birimin değişkenin büyüklüğüne uygun olması birimlerin genellik özelliğiyle ilgilidir.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Bu, kullanışlılık özelliğidir.", "tf": true}, {"q": "Mutlak sıfır ölçülen özelliğin yokluğunu ifade ederken, bağıl sıfır gerçek anlamda yokluğu ifade etmez.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "\"Hava 0 derece\" bağıl sıfıra örnektir.", "tf": true}, {"q": "En basit düzeyde ve en az bilginin elde edilebileceği ölçek sınıflama ölçeğidir.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Sınıflama ölçeğine nominal ölçek de denir.", "tf": true}, {"q": "Mod, bir veri setinde en çok tekrar eden birimdir; tepe değer olarak da adlandırılır.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Sınıflama ölçeğinde mod hesaplanabilir.", "tf": true}, {"q": "Sıralama ölçeği eşit birimlere sahip bir ölçektir.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Sıralama ölçeğinde birimler eşit değildir; farkın miktarı bilinemez.", "tf": true}, {"q": "Mutlak ölçüt, bir kurum veya kurum içindeki yetkili kurul tarafından belirlenir.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Bağıl ölçütü değerlendirmeyi yapan kişi belirler.", "tf": true}, {"q": "Sporcuların eksiklerini belirlemek veya aksaklıkları gidermek için yapılan değerlendirmeler biçimlendirici değerlendirmedir.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Biçimlendirici değerlendirme süreç içinde yapılır.", "tf": true}]}, {"id": "soo6", "title": "Spor Pedagojisi", "cards": [{"title": "Eğitim, öğretim, öğrenme", "points": ["**Eğitim:** Davranışları istenen yönde değiştiren, **planlı ve programlı** süreç. İnsan gelişiminin 3 alanı: **bilişsel, duyuşsal, psikomotor**.", "Sporda eğitim sadece beceri değil, **bilişsel ve duyuşsal** özellikler de kazandırır.", "**Öğretim:** Öğrenmeyi sağlayacak etkinlikleri düzenleme, araç sağlama ve **kılavuzluk**; planlı bir süreçtir.", "**Öğrenme:** Yaşantı sonucu davranışta **nispeten kalıcı** değişiklik. Eğitimin **ürünüdür**; görev **öğrenciye** aittir.", "Yorgunluk, hastalık, ilaç gibi **geçici** etkenlerle veya sadece **büyümeyle** olan değişim öğrenme sayılmaz."]}, {"title": "Spor pedagojisi", "points": ["Çocuk ve gençlerin spor becerilerini öğrenmesinin nasıl destekleneceğiyle ilgilenir; **spor bilimlerinin alt disiplinidir**.", "**3 alt boyutu** vardır: **içerik (bağlam) bilgisi, öğrenenler ve öğrenme, antrenörler/antrenörlük**.", "Etkili antrenör **eleştirel düşünür**, kendi üzerine düşünür (**yansıma**) ve **yaşam boyu öğrenmeyi** ilke edinir.", "Uzman antrenör, **spor içerik bilgisini pedagoji alan bilgisiyle** birleştirebilen antrenördür.", "Antrenör kendine sormalı: \"Ne öğretiyorum? Neden böyle? Bu çocuk için en iyisi bu mu? **Bilgim uygun, güncel ve verimli mi?**\""]}, {"title": "Öğrenmeyi etkileyen faktörler 1", "points": ["3 başlık: **öğrenenle**, **öğretme yöntemiyle** ve **öğrenme malzemesiyle** ilgili faktörler.", "**Öğrenenle ilgili:** türe özgü hazır oluş, olgunlaşma, **genel uyarılmışlık**, **kaygı**, eski yaşantılar, güdü, dikkat.", "Uyarılmışlık ve kaygıda **orta düzey** en iyisidir; çok düşük veya çok yüksek olması öğrenmeyi zorlaştırır.", "Eski öğrenme yenisini kolaylaştırırsa **olumlu aktarım (transfer)**, zorlaştırırsa **olumsuz aktarım** denir.", "**İçsel güdülenme:** İhtiyacı kişi kendisi hisseder. **Dışsal:** Başka bir kaynak (antrenörün istemesi)."]}, {"title": "Öğrenmeyi etkileyen faktörler 2", "points": ["**Öğrenme yöntemiyle ilgili:** öğrenmeye ayrılan zaman, konunun yapısı, **aktif katılım**, **geribildirim**.", "Sporcular yoğun **toplu çalışmadan uzak durmalı**, **aralıklı çalışmayı** benimsemelidir.", "Beceri basitse **bütün** olarak, çok bileşenliyse **parçalara bölerek** çalışılır.", "**İçsel geribildirim** sporcunun kendine, **dışsal geribildirim** antrenörün verdiğidir; dışsal geribildirim işitsel, görsel veya yazılı olabilir.", "**Malzemeyle ilgili:** telaffuz edilebilirlik, **algısal ayırt edilebilirlik**, **anlamsal çağrışım**, **kavramsal gruplandırma**. 6-12 yaşa bilmedikleri kelimelerle açıklama yapılmaz."]}, {"title": "Davranışçı kuramlar", "points": ["Öğrenme **uyarıcı ile tepki (U-T)** arasında bağ kurmaktır; önemli olan bireyin ne düşündüğü değil, **ne yaptığıdır**.", "**Pavlov:** **Uyarıcı genelleme** (benzer uyarıcılara aynı tepki) ↔ **ayırt etme**; **alışma** (tepkinin azalması) ↔ **duyarlılık kazanma**; **öğrenilmiş çaresizlik**.", "**Watson:** Ödül veya pekiştirme **yoktur**; korku öğrenilebilir. **Sistematik duyarsızlaştırma:** Korkulan şeye yavaş yavaş yaklaştırma.", "**Thorndike:** **Hazır bulunuşluk yasası** (hazırsa yapmak mutluluk verir). **Etki yasası:** Pekiştirilen davranış güçlenir; cezalandırılan davranışta **azalma olmaz**.", "Davranışçı yaklaşımda **ödüller cezalara** tercih edilir; öğrenme hedefleri açık olmalıdır."]}, {"title": "Skinner: edimsel koşullanma", "points": ["Övgü gibi hoşa giden uyarıcılar **pekiştireçtir** ve davranışı güçlendirir; pekiştireçler **bireysel** olmalıdır.", "**Premack ilkesi:** Daha az istenen etkinlik, **daha çok sevilen** etkinliğe bağlanır.", "Pekiştirme **mümkün olan en kısa sürede** yapılmalı; hep aynı tür pekiştireç kullanılmamalı.", "**Şekillendirme:** Davranış hiç sergilenmiyorsa **aşamalara bölünür**, her aşama ayrı pekiştirilir.", "**Değişken oranlı ve değişken zamanlı** pekiştireçler, sabit olanlara göre **sönmeye daha dirençlidir**.", "**Ceza**, istenmeyen davranışı zayıflatmaya yöneliktir."]}, {"title": "Sosyal bilişsel kuram (Bandura)", "points": ["**1960'larda Bandura** ortaya attı: Kişi başkalarını **gözleyerek** öğrenir; pekiştirilen davranışı yapar, cezalandırılanı yapmaz.", "Gözlem genelde saygın ve güçlü kişiler (**rol model**) üzerinde yapılır; bu yüzden **antrenör iyi bir model** olmalıdır.", "Sosyal öğrenme **zaman ve emek tasarrufu** sağlar.", "4 süreç: **Dikkat → Hatırda tutma → Davranışı meydana getirme → Güdüleme**. Son aşamada antrenör **dışsal pekiştireç** sağlar.", "**İşbirlikli öğrenme** kuramın merkezindedir; acemileri uzmanlar sosyalleştirir."]}, {"title": "Bilişsel kuramlar", "points": ["Öğrenme **Uyarıcı-Organizma-Tepki (U-O-T)** ile açıklanır; belirleyici olan **zihindeki süreçlerdir**. Öğrenen pasif değil, **aktif oluşturucudur**.", "**Gestaltçılar (Wertheimer, Köhler, Koffka):** Bütün, parçaların toplamından farklıdır. Dikkat edilen nesne **şekil**, geri kalanı **zemindir**.", "Gestalt antrenörü önce **genel çerçeveyi**, sonra **ayrıntıyı** verir; sporcuda **merak** ve bilişsel dengesizlik uyandırır.", "**Bilgiyi işleme modeli:** Önce dikkati çek, temel bilgiyi ayrıntıdan ayır. Yeni bilgiyi eskisiyle ilişkilendirmek **eklemleme**, tablo-grafik kullanmak **örgütleme stratejisidir**.", "Antrenör **soyut fikirleri somutlaştırır**; karışabilecek kavramlarda biri tam öğrenilmeden diğerine geçmez.", "Bilişsel kurama göre zihin bir **bilgisayar** gibidir; antrenör uzman, sporcu deneyimsizdir."]}, {"title": "Yapılandırmacı kuram", "points": ["**Nesnelci görüşe karşı** çıkar; öğrenenlerin bilgiyi nasıl yapılandırdığını inceler.", "**Bilişsel yapılandırmacılık (Piaget):** Yeni bilgi dengeyi bozar; birey deneyimiyle **benzersiz bilgi inşa eder**.", "**Sosyal yapılandırmacılık (Vygotsky):** Öğrenme için **sosyal etkileşim ve grup diyaloğu** gerekir.", "Antrenör öğretmekten çok **öğrenmeyi kolaylaştıran** kişidir; aşırı kuralcılık öğrenmeyi olumsuz etkiler.", "**Yönlendirilmiş buluş yöntemi:** Antrenör cevabı **önceden belli** bir dizi soru sorar. Ayrıca **akran eğitimi** ve **durumsal öğrenme** yapılır."]}, {"title": "Öğretim ilkeleri", "points": ["**Sporcuya görelik:** İlgi, yetenek ve hazırbulunuşluğa uygunluk. **Etkin katılım:** Ne kadar çok duyu organı, o kadar kalıcı öğrenme.", "**Somuttan soyuta:** Özellikle **6-12 yaşta** görsel araçlarla somutlaştırma.", "**Bilinenden bilinmeyene**, **yakından uzağa**, **basitten karmaşığa**, **güncellik** (haberler, kurallar).", "**Genelden özele (tümdengelim):** Beceri önce **bütün** hâlinde gösterilir, sonra parçalara ayrılır.", "**Ekonomiklik:** En az maliyet, süre ve çabayla en yüksek verim. **Açıklık:** Sade ve net dil. **Bütünlük:** Bütünsel gelişim."]}, {"title": "3 öğretme stratejisi", "points": ["**Sunuş yoluyla (Ausubel):** Bilgi hazır verilir; **tümdengelim**; antrenör merkezde, sporcu **yarı aktif**. İçerik fazla, süre az ve sporcu sayısı fazlaysa tercih edilir; **ekonomiktir**.", "Sunuş basamakları: temel kavram → alt kavram → örnek → sporcunun örneği → **antrenör özetler** → nesnel değerlendirme.", "**Buluş yoluyla (Bruner):** Sporcu keşfeder; **tümevarım** (parçadan bütüne); düşünme gücünü artırır; sunuştan **daha fazla hazırlık** ister.", "Buluşun faydaları: orijinal fikir, **düşünce esnekliği**, kendini ifade, özgüven.", "**Araştırma/inceleme yoluyla (Dewey):** Problem çözmeye dayanır; **çok zaman alır**, her konuya uygun değildir. Bilimsel düşünmeyi ve yardımlaşmayı geliştirir.", "Araştırma basamakları: problemi fark etme → tanımlama → bilgi toplama → **hipotez kurma** → test etme → sonuca varma."]}, {"title": "Öğretim yöntemleri", "points": ["**Anlatma:** Ekonomik ve sistematik, ama sporcu **pasif** kalır; **psikomotor hedeflerde etkisizdir**, sadece işiterek öğrenenlere hitap eder.", "**Soru-cevap:** Sunuşta **kapalı uçlu**, buluşta **açık uçlu** sorular. Önce soru, sonra düşünme süresi, **sonra** cevaplayacak sporcu seçilir. **Evet/hayır** sorusu sorulmaz.", "**Tartışma:** Antrenör önce tema ve amacı açıklar; çok baskın olmaz; herkesi katar; **küçük yaşlarda süre kısa** tutulur.", "**Gösteri (demonstrasyon):** Görsel ve işitsel olduğu için çok etkilidir. Basit ve **mükemmele yakın** olmalı; anlatım ve gösterim **eşzamanlı** yapılmalı.", "Gösteride **yazılı materyal sonunda** dağıtılır ve gösteri **1-2 sporcuya** tekrar ettirilir.", "**Örnek olay:** Gerçek yaşamdan **ikilem** yaratan bir olay işlenir. Tüm grupla incelenecekse **U düzeni**; kalabalıksa küçük gruplar ve grup sözcüleri."]}], "questions": [{"q": "İnsan gelişiminin 3 alanı hangileridir?", "o": ["Sosyal, kültürel, dini", "Fiziksel, sosyal, ekonomik", "Teknik, taktik, kondisyonel", "Bilişsel, ahlaki, ekonomik", "Bilişsel, duyuşsal, psikomotor"], "a": 4, "e": "Sporda eğitim bu üç alanın hepsine katkı sağlar."}, {"q": "Öğrenme ile ilgili hangisi YANLIŞTIR?", "o": ["Davranışta nispeten kalıcı değişikliktir", "Hastalık ve ilaç gibi etkenlerle de oluşur", "Sadece büyüme sonucu oluşmaz", "Eğitim sürecinin ürünüdür", "Öğrenme görevi öğrenciye aitti
