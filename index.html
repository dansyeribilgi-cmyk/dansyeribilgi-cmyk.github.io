r"], "a": 1, "e": "Geçici etkenlerle oluşan değişimler öğrenme sayılmaz."}, {"q": "Spor pedagojisinin 3 alt boyutundan biri hangisidir?", "o": ["Spor hukuku", "Tesis yönetimi", "Biyomekanik", "Sponsorluk", "İçerik (bağlam) bilgisi"], "a": 4, "e": "Diğer iki boyut öğrenenler ve öğrenme ile antrenörler/antrenörlüktür."}, {"q": "Öğrenme için en uygun uyarılmışlık ve kaygı düzeyi hangisidir?", "o": ["Değişken olmayan maksimum", "Çok yüksek", "Çok düşük", "Orta düzey", "Sıfır"], "a": 3, "e": "Bu düzey kişiden kişiye değişir."}, {"q": "Önceden öğrenilen bir becerinin yenisini öğrenmeyi kolaylaştırmasına ne denir?", "o": ["Şekillendirme", "Sönme", "Olumsuz aktarım", "Olumlu aktarım (transfer)", "Alışma"], "a": 3, "e": "Yenisini zorlaştırırsa olumsuz aktarım denir."}, {"q": "Sporcunun antrenörü istediği için çalışması hangi tür güdülenmedir?", "o": ["Olgunlaşma", "Öz yeterlilik", "İçsel güdülenme", "Hazırbulunuşluk", "Dışsal güdülenme"], "a": 4, "e": "İçsel güdülenmede ihtiyacı kişi kendisi hisseder."}, {"q": "Öğrenmeye ayrılan zaman açısından sporcular hangi çalışma tarzını benimsemelidir?", "o": ["Toplu çalışma", "Çalışmasız ezber", "Aralıklı çalışma", "Sadece yarışma öncesi çalışma", "Tek seferde yoğun çalışma"], "a": 2, "e": "Kitabın D/Y testinde bu ifade ters verilerek sorulur."}, {"q": "Çok bileşenli, karmaşık bir beceri nasıl çalışılmalıdır?", "o": ["Bütün olarak", "Hiç tekrar etmeden", "Sadece anlatarak", "Sadece izleyerek", "Parçalara bölerek"], "a": 4, "e": "Beceri çok karmaşık değilse bütün olarak çalışılır."}, {"q": "Aşağıdakilerden hangisi öğrenme malzemesiyle ilgili bir faktördür?", "o": ["Geribildirim", "Anlamsal çağrışım", "Dikkat", "Kaygı", "Aktif katılım"], "a": 1, "e": "Telaffuz edilebilirlik, algısal ayırt edilebilirlik ve kavramsal gruplandırma da malzemeyle ilgilidir."}, {"q": "Davranışçı kuramlara göre öğrenme nedir?", "o": ["Uyarıcı ile tepki arasında bağ kurma süreci", "Uyarıcı-organizma-tepki süreci", "Bilginin kişi tarafından inşa edilmesi", "Zihinsel yapıların değişmesi", "Gözleyerek model alma"], "a": 0, "e": "Davranışçılara göre zihinsel olaylar gözlenemediği için önemli değildir."}, {"q": "Uzun süre çabalarından olumlu sonuç alamayan birinin asla başaramayacağını düşünmesine ne denir?", "o": ["Uyarıcı genelleme", "Alışma", "Duyarlılık kazanma", "Öğrenilmiş çaresizlik", "Ayırt etme"], "a": 3, "e": "Bu kavram Pavlov'un klasik koşullama kuramında yer alır."}, {"q": "Korkulan bir nesneye kişinin yavaş yavaş yaklaştırılmasıyla korkunun giderilmesine ne denir?", "o": ["Şekillendirme", "Sistematik duyarsızlaştırma", "Alışma", "Premack ilkesi", "Etki yasası"], "a": 1, "e": "Bu yöntem Watson'un davranışçılık kuramına aittir."}, {"q": "Thorndike'ın etki yasasına göre cezalandırılan davranışa ne olur?", "o": ["Azalma olmaz", "Hemen sönmeye başlar", "Tamamen yok olur", "Güçlenir", "Başka davranışa dönüşür"], "a": 0, "e": "Pekiştirilen davranış ise güçlenir."}, {"q": "Daha az istenen bir etkinliği, sporcunun sevdiği bir etkinliğe bağlamaya ne denir?", "o": ["Sistematik duyarsızlaştırma", "Premack ilkesi", "Uyarıcı genelleme", "Şekillendirme", "Etki yasası"], "a": 1, "e": "Örneğin önce kuvvet çalışması, sonra sevilen maç oyunu."}, {"q": "Hiç sergilenmeyen bir davranışın aşamalara bölünüp her aşamanın ayrı pekiştirilmesine ne denir?", "o": ["Şekillendirme", "Premack ilkesi", "Sönme", "Alışma", "Eklemleme"], "a": 0, "e": "Şekillendirme Skinner'in edimsel koşullanma kuramında yer alır."}, {"q": "Sönmeye karşı en dirençli pekiştireç hangisidir?", "o": ["Hiç verilmeyen pekiştireç", "Değişken oranlı ve değişken zamanlı pekiştireç", "Sabit zamanlı pekiştireç", "Her davranışta verilen ödül", "Sabit oranlı pekiştireç"], "a": 1, "e": "Sabit pekiştireçler daha çabuk söner."}, {"q": "Sosyal bilişsel öğrenme kuramını ortaya atan kimdir?", "o": ["Piaget", "Skinner", "Pavlov", "Bandura", "Dewey"], "a": 3, "e": "Bandura'ya göre öğrenme çoğunlukla gözleme dayalı sosyal öğrenmeyle olur."}, {"q": "Sosyal bilişsel kuramda öğrenme süreçlerinin doğru sırası hangisidir?", "o": ["Dikkat → Davranış → Güdüleme → Hatırda tutma", "Güdüleme → Dikkat → Hatırda tutma → Davranış", "Hatırda tutma → Dikkat → Güdüleme → Davranış", "Davranış → Hatırda tutma → Dikkat → Güdüleme", "Dikkat → Hatırda tutma → Davranışı meydana getirme → Güdüleme"], "a": 4, "e": "Son aşamada antrenör dışsal pekiştireç sağlamalıdır."}, {"q": "Bilişsel öğrenme kuramları öğrenmeyi hangi bağ ile açıklar?", "o": ["Ödül-Ceza", "Dikkat-Güdü", "Uyarıcı-Tepki (U-T)", "Uyarıcı-Organizma-Tepki (U-O-T)", "Model-Taklit"], "a": 3, "e": "Organizmanın, yani öğrenenin zihnindeki süreçler belirleyicidir."}, {"q": "Gestaltçılara göre resimde dikkat edilen nesne nasıl algılanır?", "o": ["Parça", "Çerçeve", "Arka plan", "Şekil", "Zemin"], "a": 3, "e": "Resmin geri kalan kısımları zemin olarak algılanır."}, {"q": "Bilgiyi işleme modelinde yeni bilginin önceki bilgiyle ilişkilendirilmesine ne denir?", "o": ["Şekillendirme", "Eklemleme", "Örgütleme", "Özümleme", "Transfer"], "a": 1, "e": "Tablo ve grafik kullanmak ise örgütleme stratejisidir."}, {"q": "Sosyal yapılandırmacılık hangi düşünürün çalışmalarına dayanır?", "o": ["Ausubel", "Piaget", "Vygotsky", "Thorndike", "Watson"], "a": 2, "e": "Bilişsel yapılandırmacılık ise Piaget'nin çalışmalarına dayanır."}, {"q": "Antrenörün sorduğu, cevabı önceden belli bir dizi soruya sporcunun cevap vermesine dayanan yöntem hangisidir?", "o": ["Yönlendirilmiş buluş yöntemi", "Anlatma yöntemi", "Örnek olay", "Tartışma tekniği", "Gösteri tekniği"], "a": 0, "e": "Bu yöntem yapılandırmacı yaklaşımda anlamlı öğrenmeyi kolaylaştırır."}, {"q": "\"Sporcu öğrenme sürecine ne kadar çok duyu organıyla katılırsa öğrenme o kadar kalıcı olur\" hangi ilkedir?", "o": ["Somuttan soyuta", "Açıklık", "Ekonomiklik", "Yaşama yakınlık", "Etkin katılım ilkesi"], "a": 4, "e": "Etkin katılım öğrenmeyi artırır."}, {"q": "Becerinin önce bütün olarak gösterilip sonra parçalara ayrılarak çalışılması hangi ilkedir?", "o": ["Bilinenden bilinmeyene", "Genelden özele (tümdengelim)", "Bütünlük", "Basitten karmaşığa", "Yakından uzağa"], "a": 1, "e": "Bütünlük ilkesi ise sporcunun bütünsel gelişimiyle ilgilidir."}, {"q": "Sunuş yoluyla öğretme stratejisini geliştiren kimdir?", "o": ["Bandura", "Dewey", "Laban", "Bruner", "Ausubel"], "a": 4, "e": "Buluş yoluyla öğretme Bruner'e, araştırma-inceleme Dewey'e aittir."}, {"q": "Parçadan bütüne (tümevarım) mantığıyla ilerleyen ve düşünme gücünü artıran strateji hangisidir?", "o": ["Programlı öğretim", "Gösteri tekniği", "Sunuş yoluyla öğretme", "Anlatma yöntemi", "Buluş (keşfetme) yoluyla öğretme"], "a": 4, "e": "Sunuş yoluyla öğretme tümdengelim mantığıyla ilerler."}, {"q": "Araştırma/inceleme stratejisinin sınırlılıklarından biri hangisidir?", "o": ["Düşünmeyi engellemesi", "Yardımlaşmayı azaltması", "Uygulamanın çok zaman alması", "Bilimsel yaklaşımı zayıflatması", "Sporcuyu pasif bırakması"], "a": 2, "e": "Ayrıca her konuya uygun değildir ve çok hazırlık gerektirir."}, {"q": "Psikomotor hedeflerin gerçekleştirilmesinde etkisiz kalan yöntem hangisidir?", "o": ["Buluş yoluyla öğretme", "Gösteri tekniği", "Örnek olay", "Anlatma yöntemi", "Araştırma-inceleme"], "a": 3, "e": "Anlatma yönteminde sporcular pasif kalır."}, {"q": "Buluş yoluyla öğretme stratejisinde hangi tür sorular sorulmalıdır?", "o": ["Evet/hayır soruları", "Sadece sayısal sorular", "Açık uçlu, çok cevaplı sorular", "Sadece ezber soruları", "Kapalı uçlu, tek cevaplı sorular"], "a": 2, "e": "Sunuş yoluyla öğretimde ise kapalı uçlu sorular sorulur."}, {"q": "Gösteri tekniğinde yazılı materyaller ne zaman dağıtılmalıdır?", "o": ["Hiç dağıtılmamalı", "Gösterinin sonunda", "Gösterinin ortasında", "Gösteriden önce", "Bir hafta sonra"], "a": 1, "e": "Gösteri 1-2 sporcuya da tekrar ettirilmelidir."}, {"q": "Örnek olay tüm sporcularla birlikte incelenecekse sporcular nasıl oturmalıdır?", "o": ["Tek sıra halinde", "U düzeninde", "Daire dışında ayakta", "Sıra düzeninde", "Gruplar arası uzakta"], "a": 1, "e": "Grup kalabalıksa olay küçük gruplarda incelenir."}, {"q": "Yaşantılar sonucu davranışlarımızda oluşan oldukça kalıcı değişikliklere ne ad verilir?", "o": ["Eğitim", "Öğretim", "Öğrenme", "Öğretme", "Algı"], "a": 2, "e": "Doğru cevap: Öğrenme.", "kb": 1}, {"q": "Aşağıdakilerden hangisi öğrenmeyi etkileyen öğrenenle ilgili öğelerden biri değildir?", "o": ["Genel uyarılmışlık düzeyi", "Dikkat", "Eski yaşantılar", "Katılma", "Güdü"], "a": 3, "e": "Doğru cevap: Katılma.", "kb": 1}, {"q": "“Yaptıklarının ve söylediklerinin ne kadar hatalı ya da hatasız olduğuna ilişkin bilgi edinen sporcu daha kolay öğrenmektedir.”\nYukarıdaki ifade hangi kavram ile ilgilidir?", "o": ["Olgunlaşma", "Hazıroluş", "Güdü", "Pekiştireç", "Dönüt"], "a": 4, "e": "Doğru cevap: Dönüt.", "kb": 1}, {"q": "Aşağıdakilerden hangisi öğrenilmiş bir davranış değildir?", "o": ["Arkadaşlarının etkisiyle sigara içmeye başlaması", "Yüksek ses karşısında aniden irkilme", "Trafikte yeşil ışıkta geçme", "Bir şiiri ezberden okuma", "Turnike becerisini yapma"], "a": 1, "e": "Doğru cevap: Yüksek ses karşısında aniden irkilme.", "kb": 1}, {"q": "Hasan basketbol oynayamadığını ve hiç öğrenemeyeceğini düşünerek basketbola hiç çalışmamaktadır. Hasan’ın bu durumu aşağıdaki kavramlardan hangisi ile açıklanır?", "o": ["Kendini gerçekleştiren kehanet", "Öğrenilmiş çaresizlik", "Olumsuz pekiştirme", "Olumsuz transfer", "Öğrenmeye ket vurma"], "a": 1, "e": "Doğru cevap: Öğrenilmiş çaresizlik.", "kb": 1}, {"q": "Aşağıdakilerden hangisi bilişsel öğrenme yaklaşımının özelliklerinden biri değildir?", "o": ["İçsel güdülenme ve pekiştirme daha fazla tercih edilmelidir.", "Öğrenme, algılama ve anlam vermedir.", "Öğrenmenin odağında ürün olmalıdır.", "Daha çok bireyin zihninde gerçekleşen öğrenmeler üzerinde durur.", "Öğrenme mekanik değil, insanidir."], "a": 2, "e": "Doğru cevap: Öğrenmenin odağında ürün olmalıdır.", "kb": 1}, {"q": "Pekiştirecin en etkili kullanım zamanı aşağıdakilerden hangisidir?", "o": ["Davranışla birlikte kullanıldığında", "Davranıştan önce kullanıldığında", "Davranıştan hemen sonra kullanıldığında", "Davranıştan onbeş dakika sonra kullanıldığında", "Kullanılma zamanı önemli değildir."], "a": 2, "e": "Doğru cevap: Davranıştan hemen sonra kullanıldığında.", "kb": 1}, {"q": "Araştırma-incelemeye dayalı yaklaşımı benimseyen bir antrenör, öğretim sürecinde aşağıdaki davranışlardan hangisinden kaçınmalıdır?", "o": ["Problem durumunu sporculara hissettirmek", "Sporcuların birlikte çalışmasını teşvik etmek", "Sporculara kaynaklar konusunda yardımcı olmak", "Problemin çözüm yolları hakkında sporcuları bilgilendirmek", "Sporcuları belirledikleri problemlerle ilgili çalışmalarına rehberlik etmek"], "a": 3, "e": "Doğru cevap: Problemin çözüm yolları hakkında sporcuları bilgilendirmek.", "kb": 1}, {"q": "Halil antrenör öğretim sürecini düzenlerken öncelikle sporcularının hazır bulunuşluklarını dikkate almaktadır. Halil antrenörün öğretimde hangi ilkeyi öncelikle dikkate aldığı savunulabilir?", "o": ["Aktivite", "Hayatilik", "Basitten karmaşığa", "Bilinenden bilinmeye", "Sporcuya görelik"], "a": 4, "e": "Doğru cevap: Sporcuya görelik. Kitabın cevap anahtarında C yazıyor, ancak hazırbulunuşluğu dikkate almak \"sporcuya görelik\" ilkesinin tanımıdır.", "kb": 1}, {"q": "Antrenörün öğrenme-öğretme yaşantılarında kullanacağı öğretim teknik ve yöntemi belirlerken aşağıdakilerden hangisine dikkat etmesine gerek yoktur?", "o": ["Sporcuların sosyo-ekonomik düzeyleri", "Sporcuların maksimum düzeyde etkin katılım sağlanması", "Sporcuların gelişim düzeyleri ve ön öğrenmeleri", "Araç-gereç ve materyaller", "Antrenmanın hedefleri"], "a": 0, "e": "Doğru cevap: Sporcuların sosyo-ekonomik düzeyleri.", "kb": 1}], "tf": [{"q": "Öğretim planlı bir süreç değildir, ansızın gelişir.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Öğretim planlı bir süreçtir.", "tf": true}, {"q": "Öğrenme; yorgunluk, hastalık, ilaç alma gibi etkenlerle geçici biçimde meydana gelmez.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Öğrenme nispeten kalıcı bir değişimdir.", "tf": true}, {"q": "Öğrenilen konunun yapısı, geribildirim, telaffuz edilebilirlik ve anlamsal çağrışım öğrenenle ilgili faktörlerdir.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Konunun yapısı ve geribildirim yöntemle, diğer ikisi malzemeyle ilgilidir.", "tf": true}, {"q": "İyi bir öğrenme için orta düzey uyarılmışlık gereklidir ve bu kişiden kişiye değişir.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Çok az veya çok fazla uyarılmışlık öğrenmeyi zorlaştırır.", "tf": true}, {"q": "Sporcular aralıklı çalışmadan uzak durmalı, toplu çalışma tarzını benimsemelidir.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Tersi doğrudur: toplu çalışmadan uzak durup aralıklı çalışmalıdırlar.", "tf": true}, {"q": "Davranışçı öğrenme kuramlarına göre öğrenme, uyarıcı ile tepki (U-T) arasında bağ kurma sürecidir.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Davranışçılar gözlenebilen davranışa odaklanır.", "tf": true}, {"q": "Watson'un sistematik duyarsızlaştırma yöntemine göre birey korktuğu nesneye yavaş yavaş yaklaştırılarak korkusu ortadan kaldırılabilir.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Watson'a göre korkma ve korkmama öğrenilebilir.", "tf": true}, {"q": "Sosyal bilişsel kurama göre öğrenme; dikkat etme, hatırda tutma, davranışı meydana getirme ve güdüleme süreçleri sonucunda sağlanır.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Bu dört süreç Bandura'nın kuramına aittir.", "tf": true}, {"q": "Bilgiyi işleme modelinin ilkelerini benimseyen antrenör, anlatacağı somut fikirleri soyutlaştırarak anlatmalıdır.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Antrenör soyut fikirleri somutlaştırmalıdır.", "tf": true}, {"q": "Buluş yoluyla öğretim stratejisi sporcuların farklı düşünmelerini sağlar ve düşünce esnekliğine yardımcı olur.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Ayrıca orijinal fikir üretmeyi ve özgüveni destekler.", "tf": true}, {"q": "Antrenörlerin kullandığı temel öğretim yöntemlerinden biri olan anlatma yönteminde sporcular konuya aktif katılım sağlayamazlar.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Anlatma yönteminde sporcular pasif kalır.", "tf": true}, {"q": "Soru-cevap tekniğinde sorulan sorular evet/hayır ile cevaplanabilir olmalıdır.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Sorular evet/hayır ile cevaplanabilecek tarzda olmamalıdır.", "tf": true}]}], "source": "Kitap: Sporda Öğrenme ve Öğretme 1, s.111-147", "past": []}, {"id": "spa", "title": "Sporda Psikososyal Alanlar", "short": "Psikoloji", "icon": "🧠", "color": "#8E5BD9", "units": [{"id": "spa1", "title": "Spor Tarihi", "cards": [{"title": "Spor teriminin kökeni", "points": ["\"Spor\" terimi **Ortaçağ** ürünüdür; ama sportif etkinlikler insanlıkla yaşıttır.", "Antik Yunan'da **athletes** = yarışmacı (\"athlios\": zahmet çeken). **Gymnastes** sporcu değil, **spor eğitmeni** (antrenör) demektir.", "Eski Roma'da spor karşılığı **egzersiz** (askeri talim) ve **ludus** (tatil günü oyunları) kullanıldı.", "Türkçedeki en eski spor sözcükleri **oyun** ve **yarış**tır (yarış, **Göktürk Yazıtları**'nda geçer). **İdman** İslamiyetle girdi (1914'te \"İdman\" dergisi).", "Türkçede ilk cimnastik kitabı **Risale-i Cimnastik (1847)**; \"spor\" kelimesi ilk kez **1895'te İkdam gazetesinde** kullanıldı.", "Kelime, denizcilerin argosundaki **\"de portu\" (limanda olmak)** ifadesinden gelir → disportare → desport (Fransızca) → **sport** (İngilizce, ilk kez 1440). İspanyolcada hâlâ **Deportivo**."]}, {"title": "Sporun kökeni: iki görüş", "points": ["**İdealist görüş:** İlk bilinçli sportif hareketler **büyüsel-ayinsel danslardır** (mağara resimlerindeki av dansları).", "**Materyalist görüş:** Sportif egzersiz, bilinçli bir amaçla tekrarlanan harekettir; kaynağı **iş ve alet kullanımıdır**.", "Bu görüşe göre en eski egzersizler **mızrak (cirit) atma** alıştırmalarıdır; isabet için önceden \"antrenman\" gerekir. **Bumerang** atışı da ileri teknik ister.", "Atış egzersizleri **sadece insana özgüdür**; koşma, tırmanma, yüzmede hayvanlar üstündür.", "**Neolitik Çağ** (tarım, MÖ 10.000-5.500) **serbest zaman** yarattı; ilk spor uygulamaları Tunç Çağında **Sümer ve Mısır**'da imtiyazlı sınıfın uğraşı olarak doğdu (güreş, boks, eskrim, okçuluk ~MÖ 3000)."]}, {"title": "Antik Yunan: ideal insan", "points": ["Eğitimin hedefi **Kalokagathia**: \"güzel\" (kalos, estetik) ve \"iyi\" (agathos, etik) insan.", "Dönemler: **Girit-Miken** (MÖ 1600-1200), **Arkaik** (MÖ 800-500), **Klasik** (MÖ 500-300), **Helenistik-Roma**.", "**Girit-Miken:** Spor **aristokratların** uğraşı; disiplinler **savaşçılık ve avcılık** kaynaklı. İdeal insan: şan kazanmış **kahraman**.", "**Klasik Çağ:** Demokratikleşmeyle halk da spora katıldı. Atina'da **7-18 yaş erkek çocuklar** için okul: temel dersler, müzik, **cimnastik**. Kızların eğitimi yalnız **Sparta**'da vardı.", "Küçük spor tesisi **palestra**; koşu pisti ve top alanı da olan büyük tesis **gymnasium**. \"Cimnastik\" kelimesi **gymnos = çıplak** kökünden gelir.", "**Helenistik Çağ:** \"Sağlığa yönelik beden eğitimi\" hâkim; yarışma sporu ihmal edildi, ideal insan **zihinsel-entelektüel** insan oldu."]}, {"title": "Antik Olimpiyat Oyunları", "points": ["Şampiyonların kaydı **MÖ 776'da**, **Arkaik Çağ** başında başladı. Olimpiya'da **Zeus** adına düzenlenirdi.", "4 büyük (Panhelenik) oyun: **Olimpiya-Zeus (zeytin dalı)**, **Pythia-Delphi-Apollon (defne)**, **İsthmia-Korinth-Poseidon (çam)**, **Nemea-Zeus (kereviz)**.", "4 yılda bir; organizatör **Elis halkı** (hakemleri onlar seçer, tarafsız). Yarışmalar **tanrılara adaktır**.", "Katılım yalnız **hür Yunanlı erkeklere**; ilk iki yüzyıl **soylularla** sınırlı. **Evli kadınlar** izleyemez de. Kadınlar için ayrı **Heraia** oyunları vardı.", "**Ekecheiria (Kutsal Barış):** Oyunlar süresince **ateşkes**.", "Hristiyanlığı devlet dini yapan **I. Theodosius** oyunları **MS 393'te** \"putperest\" diye yasakladı; son bilinen şampiyon Pers boksör **Varazdates** (MS 385)."]}, {"title": "Antik olimpiyat disiplinleri", "points": ["İlk 13 oyunda tek yarış **stadium koşusu (192,27 m)**; sonra **diaulos** (2 stad), **dolichos** (24 stad), **hoplitodromos** (silahlı koşu) eklendi.", "**Güreş (pale)**, MÖ 708'de ilk mücadele sporu; rakibi **3 kez** yere atan kazanır. **Boks (pygme)** MÖ 688.", "**Pankrasyon** (MÖ 648): Güreş + boks + tekme; neredeyse her şey serbest.", "**Pentatlon** (MÖ 708): disk, uzun atlama, cirit, koşu, güreş. Disk, cirit ve uzun atlama **sadece pentatlonda** yapılırdı; **güreş son** yarışmadır.", "Atlı araba yarışları (MÖ 680) **hipodromda** yapılır; kazanan **arabanın sahibidir** — bu yolla **kadınlar da şampiyon** olabildi."]}, {"title": "Ortaçağ ve Rönesans", "points": ["Ortaçağ'da tek eğitimci **kilise**; bedene özen \"şeytan işi\" sayıldı.", "**Yüksek Ortaçağ'da** beden faaliyetlerini yalnız **şövalyeler** yaptı (7 şövalye becerisi: binicilik, yüzme, okçuluk, tırmanma, güreş-kılıç, mızrak dövüşü, dans).", "**Rönesans** = yeniden doğuş; **Hümanizm**'in ideali her yönüyle gelişmiş insan (saray adamı **Cortigiano**).", "**Vittorino Feltre:** İlk beden eğitimi öğretmeni sayılır. **De Arte Gymnastica (1569, Mercurialis)**: cimnastikle ilgili ilk eser (tıbbi, askeri, atletik). **Petrus Faber, Agonisticon (1592)**.", "**Komensky** okul beden eğitiminin öncüsü; **Martin Luther** zorunlu ve laik eğitimi savundu."]}, {"title": "Aydınlanma ve filantroplar", "points": ["**John Locke:** Sağlıklı akıl, sağlıklı bedende; tüm çocuklar **yüzme** öğrenmeli. Eseri: \"Eğitim Üzerine Düşünceler\".", "**Rousseau:** \"Emile\" ile modern beden eğitiminin **teorik temelini** attı. **Pestalozzi:** basitten karmaşığa **basamaklama** metodu.", "**Filantroplar (insansever):** **Basedow** 1774'te **Dessau Philanthropinum**'u kurdu; günde **5 saat** beden eğitimi. Okul beden eğitiminin ilk öncü kurumu.", "**Salzmann** 1785'te **Schnepfenthal**'i açtı; cimnastik derslerini **GutsMuths** devraldı.", "**GutsMuths:** \"Gençler için Cimnastik\" (1793); **jimnastiğin en önemli öncüsü**, oyunun eğitsel değerini vurguladı."]}, {"title": "Cimnastik akımları", "points": ["**Alman jimnastiği – F. L. Jahn:** **1811'de Turnplatz**'ı kurdu; **\"turnen\"**; amaç **vatansever, güçlü insan**. Temeli: ırksal üstünlük, halk sağlığı, askeri eğitim. Bugünkü karşılığı **artistik ve aletli cimnastik**.", "**İsveç jimnastiği – P. H. Ling:** **1813'te Stockholm Kraliyet Merkez Cimnastik Enstitüsü**. Temelde **aletsiz**, sağlık yönelimli; Alman jimnastiğinin tam zıttı.", "İsveç jimnastiğinin 4 bölümü: **pedagojik, tıbbi, askeri, estetik**. Her yaş ve kesime, her mekânda uygulanabildiği için yayıldı.", "**İngiliz spor akımı:** Yarışmaya, rekabete ve yüksek performansa dayanır; Antik Yunan yarışmacı sporuna benzer."]}, {"title": "Modern sporun doğuşu (İngiltere)", "points": ["Modern sporun 3 temel prensibi: **performans, rekabet, rekor**.", "**Allen Guttmann**'a göre özellikleri: laiklik, fırsat eşitliği, uzmanlaşma, rasyonelleşme, bürokratikleşme, sayısallaştırma, rekor arayışı.", "İngiltere'de doğma nedenleri: **Püritenizm**, **bahis tutkusu** ve soyluların hamiliği, **primogenitur** yasası, **parlamenter sistem**, **kulüp sistemi ve halk okulları**.", "**Endüstri Devrimi** etkileri: şehirleşme, sanayileşme, kitle iletişimi; **ücretli işçi** ve **ortak boş zaman** doğdu (maçlar Cumartesi öğleden sonra).", "**Thomas Arnold (Rugby Koleji)** sporu karakter eğitiminin aracı yaptı. **1823'te Rugby** doğdu; **1863 Futbol Birliği**, **1871 Rugby Birliği**, **1880 Amatör Atletizm Birliği**.", "Oxford-Cambridge **kürek yarışı** ilk kez **1829**'da yapıldı."]}, {"title": "Modern olimpiyatların kuruluşu", "points": ["Hazırlayan etkenler: Rönesans'ta antik eserlerin bulunması (**Pausanias**, \"Yunanistan'ın Tasviri\"), **yerel olimpiyat denemeleri** (1612 Cotswold, 1850 **Much Wenlock**).", "Olimpiya'yı **1766'da Richard Chandler** keşfetti; ilk sistemli kazılar **1875'te Almanlar**.", "**Baron Pierre de Coubertin** (1863-1937): Asıl hedefi Fransız eğitimini İngiliz modeliyle spor yoluyla **reform** etmekti.", "**23 Haziran 1894'te** IOC kuruldu; ilk modern oyunlar **1896 Atina**. Oyunlar **evrensel**, **4 yılda bir**, **amatör** olacaktı.", "Amatörlük kuralının tek istisnası **eskrim**: eskrim ustaları profesyonel ama \"centilmen\" sayıldı.", "Coubertin kadın katılımına karşıydı; ama **ikinci oyunlarda** kadınlar iki branşta yarıştı. **1912 Stockholm** oyunların devamını garantiledi."]}], "questions": [{"q": "Antik Yunan'da \"gymnastes\" terimi neyi ifade eder?", "o": ["Spor eğitmenini (antrenörü)", "Seyirciyi", "Yarışmayı", "Spor tesisini", "Sporcuyu"], "a": 0, "e": "Sporcu için \"athletes\" kullanılırdı."}, {"q": "Türkçede \"spor\" kelimesi ilk kez ne zaman ve nerede kullanılmıştır?", "o": ["1922, TİCİ kuruluşu", "1847, Risale-i Cimnastik", "1895, İkdam gazetesi", "1903, Beşiktaş Kulübü tüzüğü", "1914, İdman dergisi"], "a": 2, "e": "Risale-i Cimnastik (1847) ise Türkçedeki ilk cimnastik kitabıdır."}, {"q": "Türkçede spor karşılığı kullanılan en eski iki sözcük hangileridir?", "o": ["Atlet ve egzersiz", "Oyun ve yarış", "Beden terbiyesi ve spor", "İdman ve cimnastik", "Ludus ve agon"], "a": 1, "e": "\"Yarış\" sözcüğü Göktürk Yazıtları'nda geçer."}, {"q": "İdealist tarih görüşüne göre ilk bilinçli sportif hareket formları hangileridir?", "o": ["Yüzme", "Koşu", "Mızrak atma", "Güreş", "Büyüsel-ayinsel danslar"], "a": 4, "e": "Materyalist görüş ise alet kullanımını (mızrak atmayı) esas alır."}, {"q": "Antik Yunan eğitiminin \"güzel ve iyi insan\" idealine ne ad verilir?", "o": ["Palestra", "Pankrasyon", "Agon", "Ekecheiria", "Kalokagathia"], "a": 4, "e": "Kalos = güzel (estetik), agathos = iyi (etik)."}, {"q": "Antik Olimpiyat Oyunları süresince ilan edilen ateşkese ne ad verilir?", "o": ["Diaulos", "Kalokagathia", "Heraia", "Hoplitodromos", "Ekecheiria"], "a": 4, "e": "Kutsal barış, oyunlara güvenli katılımı sağlıyordu."}, {"q": "Olimpiya'daki oyunlarda kazananlara verilen ödül çelengi hangisidir?", "o": ["Çam dalı", "Defne yaprağı", "Zeytin dalı", "Kereviz yaprağı", "Altın madalya"], "a": 2, "e": "Defne Pythia, çam İsthmia, kereviz Nemea oyunlarına aittir."}, {"q": "Antik Olimpiyat Oyunlarının organizatörü kimdi?", "o": ["Atinalılar", "Elis halkı", "Spartalılar", "Romalılar", "Makedonlar"], "a": 1, "e": "Hakemleri de Elis halkı belirlerdi ve tarafsızlıkla yükümlüydüler."}, {"q": "Antik olimpiyatlarda yalnızca kadınların katıldığı oyunlar hangisidir?", "o": ["Pythia oyunları", "Panhelenik oyunlar", "İsthmia oyunları", "Heraia oyunları", "Nemea oyunları"], "a": 3, "e": "Heraia tanrıça Hera adına düzenlenirdi."}, {"q": "Antik pentatlonun son ve genellikle belirleyici yarışması hangisidir?", "o": ["Cirit atma", "Uzun atlama", "Disk atma", "Koşu", "Güreş"], "a": 4, "e": "Disk, cirit ve uzun atlama yalnızca pentatlon içinde yapılırdı."}, {"q": "Antik olimpiyatlarda kadınların da şampiyon olabildiği yarış hangisidir?", "o": ["Atlı araba yarışları", "Pentatlon", "Stadium koşusu", "Pankrasyon", "Güreş"], "a": 0, "e": "Atlı araba yarışında kazanan, arabanın sahibi sayılırdı."}, {"q": "Antik Olimpiyat Oyunlarını MS 393'te yasaklayan Roma imparatoru kimdir?", "o": ["Jül Sezar", "I. Theodosius", "Büyük İskender", "Konstantin", "Neron"], "a": 1, "e": "Hristiyanlığın devlet dini olmasıyla oyunlar putperest sayıldı."}, {"q": "Basedow'un 1774'te kurduğu ve günde 5 saat beden eğitimi yapılan okul hangisidir?", "o": ["Stockholm Merkez Cimnastik Enstitüsü", "Rugby Koleji", "Dessau Philanthropinum", "Schnepfenthal Philanthropinum", "Turnplatz"], "a": 2, "e": "Klasik Çağ'dan sonra okul beden eğitiminin ilk öncü kurumudur."}, {"q": "\"Turnen\" adıyla bilinen ve vatanseverliği amaçlayan cimnastik akımının öncüsü kimdir?", "o": ["GutsMuths", "Pierre de Coubertin", "Thomas Arnold", "Friedrich Ludwig Jahn", "Pehr Henrik Ling"], "a": 3, "e": "Jahn 1811'de Turnplatz'ı kurdu."}, {"q": "Sağlık yönelimli, temelde aletsiz uygulanan cimnastik akımı hangisidir?", "o": ["İngiliz spor akımı", "Alman jimnastiği", "İsveç jimnastiği", "Artistik cimnastik", "Turnen"], "a": 2, "e": "Kurucusu Pehr Henrik Ling'dir."}, {"q": "Modern sporun üç temel prensibi hangileridir?", "o": ["Performans, rekabet, rekor", "Amatörlük, kazanç, bahis", "Estetik, ahlak, sağlık", "Disiplin, itaat, vatanseverlik", "Eğlence, sağlık, barış"], "a": 0, "e": "Bu prensipler modern sporu cimnastik akımlarından ayırır."}, {"q": "Rugby Koleji'nde sporu karakter eğitiminin aracı yapan eğitimci kimdir?", "o": ["Thomas Arnold", "Basedow", "John Locke", "Richard Chandler", "Allen Guttmann"], "a": 0, "e": "Coubertin de Arnold'un modelinden etkilenmiştir."}, {"q": "Uluslararası Olimpiyat Komitesi (IOC) hangi tarihte kurulmuştur?", "o": ["1896", "6 Nisan 1896", "23 Haziran 1894", "25 Kasım 1892", "1912"], "a": 2, "e": "İlk modern olimpiyat oyunları 1896'da Atina'da yapıldı."}, {"q": "Spor teriminin başlangıcı sayılan; sohbet, tartışma, dövüş, güç gösterileri, beceri oyunlarını kapsayan “limanda olmak” anlamına gelen argo kelime aşağıdakilerden hangisidir?", "o": ["Disportare", "Deportare", "To disport", "De portu", "Desport"], "a": 3, "e": "Doğru cevap: De portu.", "kb": 1}, {"q": "“Sportif egzersiz, belirli bir hareket formunun veya kombinasyonunun uygulama öncesi bilinçli olarak tasarlanmış bir amaç doğrultusunda tekrarlanmasıdır.” görüşünden hareket edildiğinde aşağıdaki fiziksel aktivitelerden hangisi sportif egzersizin başlangıcı sayılabilir?", "o": ["Koşma", "Tırmanma", "Yüzme", "Dans", "Bumerang atma"], "a": 4, "e": "Doğru cevap: Bumerang atma.", "kb": 1}, {"q": "Antik Olimpiyat Oyunları ile ilgili aşağıdaki ifadelerden hangisi yanlıştır?", "o": ["Yarışmalar dinsel festivallerin bir parçasıydı.", "Hakemlik hakkı politik tarafsızlıkla yükümlü soylulara aitti.", "Evli kadınların aktif ve pasif katılımları yasaktı.", "Katılımcılar ilk iki yüzyılda sadece soylularla sınırlıydı.", "Oyunlar süresince ateşkes ilan ediliyordu."], "a": 1, "e": "Doğru cevap: Hakemlik hakkı politik tarafsızlıkla yükümlü soylulara aitti.", "kb": 1}, {"q": "Aşağıdakilerden hangisi MS 4. yüzyılda Antik Olimpiyat Oyunlarının Romalılar tarafından sonlandırılmasının ana nedeni olarak gösterilebilir?", "o": ["Sert sporlardan hoşlanan Romalıların Yunan sporlarını hafif ve etkisiz bulması", "Romalıların oyunların devamını siyasi bir tehdit olarak algılamaları", "Hristiyanlığın Roma Devleti tarafından resmi din olarak kabulü", "Oyunların düzenlendiği Olympiya bölgesinin askeri bölge ilan edilmesi", "Ekonomik nedenlerle oyunların sürdürülebilir olmaması"], "a": 2, "e": "Doğru cevap: Hristiyanlığın Roma Devleti tarafından resmi din olarak kabulü.", "kb": 1}, {"q": "Aşağıdakilerden hangisi 19. yüzyılda İngiltere’de doğan modern sporun başlangıcındaki prensiplerinden biri sayılamaz?", "o": ["Rekabetçi olması", "Yüksek performans amaçlı yapılması", "Bağlayıcı kurallarının olması", "Kazanç güdülerek, profesyonelce yapılması", "Rekor hedefli olması"], "a": 3, "e": "Doğru cevap: Kazanç güdülerek, profesyonelce yapılması.", "kb": 1}, {"q": "Antik Yunan’da Olimpiyat Oyunları’nın hangi dönemde yapılmaya başlandığı kabul edilir?", "o": ["Girit-Miken Çağı", "Arkaik Çağ", "Klasik Çağ", "Helenistik Çağ", "Helen-Roma Dönemi"], "a": 1, "e": "Doğru cevap: Arkaik Çağ.", "kb": 1}, {"q": "Yüksek Ortaçağ’da bedensel faaliyetler yalnızca Hıristiyanlığın koruyucusu olarak kabul edilen ------- tarafından uygulanmıştır.\nYukarıdaki cümlede boş bırakılan yeri aşağıdakilerden hangisi doğru şekilde tamamlar?", "o": ["Papazlar", "Soylular", "Şövalyeler", "Krallar", "Köylüler"], "a": 2, "e": "Doğru cevap: Şövalyeler.", "kb": 1}, {"q": "Aşağıdakilerden hangisi İsveç jimnastiğinin uygulama alanlarından biri değildir?", "o": ["Askeri Cimnastik", "Estetik Cimnastik", "Akrobatik Cimnastik", "Tıbbi Cimnastik", "Pedagojik Cimnastik"], "a": 2, "e": "Doğru cevap: Akrobatik Cimnastik.", "kb": 1}, {"q": "Profesyonel oldukları halde “centilmen” olarak kabul edildikleri için başlangıçta olimpiyat oyunlarına katılım şartlarından olan sıkı amatörlük prensibi dışında bırakılan branş aşağıdakilerden hangisidir?", "o": ["Tenis", "Güreş", "Boks", "Eskrim", "Cimnastik"], "a": 3, "e": "Doğru cevap: Eskrim.", "kb": 1}, {"q": "Aşağıdakilerden hangisi modern sporun İngiltere’de doğmuş olmasının sebeplerinden biri değildir?", "o": ["İngiliz parlamenter sistemi", "Soyluluğun ilk doğan erkek çocukla sınırlandırılması", "İngiliz kulüp sistemi", "İngilizlerin bahis tutkusu", "İngiliz coğrafyasının genişliği"], "a": 4, "e": "Doğru cevap: İngiliz coğrafyasının genişliği.", "kb": 1}], "tf": []}, {"id": "spa2", "title": "Spor Sosyolojisi", "cards": [{"title": "Toplumsal olgu olarak spor", "points": ["Spor, içinde yaşadığımız dünyanın **minyatürüdür**; ekonomi, siyaset ve medyanın etkilerini taşır.", "**Kurthan Fişek**'e göre ilk sporlar **savunma-saldırı** kökenli (güreş, boks, okçuluk), sonra **taşıma-ulaştırma** kökenli (koşu, yüzme, kayak, binicilik), en son **takım sporları** ortaya çıktı.", "**John Loy**'a göre spor 4 görünümde ele alınır: **örgüt, yarışma, toplumsal sistem, toplumsal kurum**.", "**Toplumsal olay:** Başı ve sonu belli (örneğin bir maç). **Toplumsal olgu:** Başı ve sonu kesin belirlenemeyen süreç (sporun kendisi).", "**Rol:** Bir mevkiye özgü davranışlar. **Statü:** Toplumsal hiyerarşideki konum, saygınlık. Ünlü sporcunun dopingi bu yüzden daha çok gündem olur."]}, {"title": "Sporun sosyal işlevleri", "points": ["**Wilkerson ve Dodder**'a göre 7 işlev:", "**Duygusal boşalma:** Stresi azaltır, saldırganlığı geriletir (güvenlik sübabı). Örnek: düzenli antrenman ve maça çıkmak.", "**Kimliğin teyidi:** Tanınma ve kişisel nitelikleri gösterme fırsatı.", "**Sosyal kontrol**, **sosyalleşme**, **değişim organı** (ping-pong diplomasisi, dikey hareketlilik).", "**Kolektif bilinç:** Ortak amaç etrafında topluluk ruhu. **Başarı:** Sporcuya ve izleyiciye tatmin duygusu."]}, {"title": "Toplumsal hareketlilik", "points": ["**Toplumsal hareketlilik:** İnsanların farklı mekânlar ve statüler arasındaki hareketi.", "**Yatay hareketlilik:** Statü ve gelir değişmeden olur. Örnek: bir memurun İzmir'den Antalya'ya tayini.", "**Dikey hareketlilik:** Statü, gelir ve yaşam tarzı değişir. Örnek: amatör basketbolcunun profesyonel lige transferi, takımın **üst lige çıkması**.", "Spor, özellikle **elit sporcular** için dikey hareketlilik fırsatı sunar."]}, {"title": "Spor ve toplumsal kurumlar", "points": ["**Aile:** Toplumun en küçük yapı taşı; çocuk spor kültürünü önce ailede içselleştirir.", "**Ekonomi:** Spor bir tüketim kategorisidir; büyük organizasyonlar konaklama, ulaşım gibi alanlarda ekonomi yaratır.", "**Medya:** Sporla koparılamaz bir bağı vardır; sporcu şöhretler tüketim endüstrisinin yüzüdür.", "**Siyaset:** İktidarlar kitleleri etkilemek için sporu kullanmıştır (Roma'daki gladyatör dövüşleri).", "**Hukuk:** **Bosman kararı** sporcuların serbest dolaşımını sağladı. **CAS** (Uluslararası Spor Tahkim Mahkemesi) uyuşmazlıkları tahkimle çözer.", "**Din:** Brezilya'da stadyumlarda şapel, Arjantin'de \"Maradona'ya tapanlar kilisesi\"."]}, {"title": "Kuramsal yaklaşımlar", "points": ["**İşlevselci yaklaşım:** Spor **kurallara uyma** alışkanlığı kazandırır, toplumsal düzeni ve ortak değerleri güçlendirir; yaygınlaştırılmalıdır.", "**Çatışmacı yaklaşım:** Sporu ırk, cinsiyet ve sınıf üzerinden inceler; sporu halkı uyutan **\"afyon\"** olarak görür (Bambery).", "**Eleştirel yaklaşım:** Spor mevcut ideolojinin sürmesine katkıda bulunur. **Adorno-Horkheimer:** uyum sağlatma işlevi; **Habermas:** spor, çalışma rasyonalizasyonunun bir sektörüdür.", "Diğerleri: **etkileşimci**, **feminist**, **figürasyon** yaklaşımı.", "**Pierre Bourdieu – Habitus:** Her toplumsal sınıfın kendine özgü **sportif zevkleri** vardır."]}, {"title": "Spor ve kültür", "points": ["**Kültür:** Bir topluluğun belli zaman ve koşullardaki sosyal kişiliği; düşünce, değer ve inançlar bütünü.", "**Tayfun Amman**'a göre kültür: öğrenilir, tarihidir ve süreklidir, sosyaldir, ideal kurallar sistemidir, ihtiyaçları karşılar, değişir, birleştiricidir.", "Her toplumun spor kültürü **kendi kültürünün yansımasıdır**.", "Spor, içinde yapıldığı toplumdan beslenir ve ürettiği değerlerle toplumsal hayatı besler."]}, {"title": "Spora yönelik sosyalleşme", "points": ["**Sosyalleşme:** İçinde yaşanılan toplumun kültürünü öğrenme süreci; ailede başlar ve **yaşam boyu** sürer.", "**Leonard II**'nin modeli iki boyutludur: **spora yönelik sosyalleşme** ve **spor yoluyla sosyalleşme**.", "Spora yönelik sosyalleşme ajanları: **aile, arkadaşlar, okul, sosyal çevre, medya**.", "Küçük yaşta en etkili ajan **ailedir**; ergenlikte yerini öğretmen, antrenör ve özellikle **akranlara** bırakır.", "Medya etkisine örnek: 1980'lerde TRT'deki **Beyaz Gölge** dizisiyle basketbolun yaygınlaşması."]}, {"title": "Spor yoluyla sosyalleşme ve fair play", "points": ["**Spor yoluyla sosyalleşme:** Spora katılımın psikolojik ve sosyal sonuçları: karakter, disiplin, ahlaki gelişim, iyi vatandaşlık.", "Spor okul çağı çocuklarında **akademik başarıyı** da artırır.", "**Fair play**, bir ideal anlayışı ve **yüksek kültür ürünüdür**; bir yaşam biçimidir.", "Fair play ilkeleri: **kurallara, hakemlere ve rakibe saygı**, herkese **eşit şans**, **duyguları kontrol etmek**.", "Olumsuz yanları: Elit düzeyde başarı baskısı, sakatlık, **doping** ve sosyal ilişkilerin bozulması."]}, {"title": "Toplumsal cinsiyet kavramları", "points": ["**Biyolojik cinsiyet:** Kadın ve erkeğin biyolojik ve fizyolojik özellikleri.", "**Toplumsal cinsiyet:** Toplumun kadına ve erkeğe yüklediği roller, sorumluluklar ve beklentiler. Bu roller **doğal ve sabit değildir**, kültüre ve zamana göre değişir.", "**Kalıp yargı:** \"Erkekler iyi futbol oynar\", \"güreş kadınlara uygun değildir\" gibi genellemeler.", "**Cinsiyete dayalı ayrımcılık:** Örnek: kadın hakeme erkek maçı verilmemesi, kadınlara daha düşük ödül.", "Anayasa'nın **10. maddesi**: Kadınlar ve erkekler eşit haklara sahiptir. Olimpizmin **4. temel ilkesi**: Spor yapmak bir insan hakkıdır."]}, {"title": "Sporda cinsiyet eşitliği", "points": ["Dünyada **5 stratejik alan**: spora katılım, spor yönetimi, antrenörlük ve hakemlik, toplumsal cinsiyet temelli şiddet, spor medyası. Türkiye'de ayrıca **spor eğitimi** eklenir.", "Federasyonlara bağlı sporcuların **%34'ü kadın**, **%66'sı erkek**. Antrenörlerin **%31'i kadın**; 5. kademede kadın oranı **%7,5**.", "**Güvenli spor:** Her türlü şiddetten uzak, saygı ve eşitliğin hakim olduğu ortam.", "Toplumsal cinsiyete duyarlı antrenör: iki cinsiyete eşit davranır, **işbirliğini destekler**, güvenli ortam ve ulaşım sağlar, aileyi bilgilendirir, kıyafette esnek olur.", "Duyarlı dil: \"sportmen\" yerine **sporcu**, \"teknik adam\" yerine **teknik direktör**, \"adam adama\" yerine **bire bir**; \"kız gibi koşma\" gibi ifadelerden kaçınılır."]}], "questions": [{"q": "Kurthan Fişek'e göre tarihte ilk ortaya çıkan sporlar hangi kökenlidir?", "o": ["Takım sporları", "Dinsel kökenli", "Savunma-saldırı kökenli", "Eğlence kökenli", "Taşıma-ulaştırma kökenli"], "a": 2, "e": "Sonra taşıma-ulaştırma kökenli sporlar, en son takım sporları ortaya çıkmıştır."}, {"q": "Başlangıç ve bitiş noktaları belli olan, görülen ve duyulan her şeye ne ad verilir?", "o": ["Toplumsal hareketlilik", "Toplumsal statü", "Toplumsal rol", "Toplumsal olgu", "Toplumsal olay"], "a": 4, "e": "Bir futbol maçı toplumsal olaydır; sporun kendisi ise toplumsal olgudur."}, {"q": "Wilkerson ve Dodder'a göre ortak amaçlar etrafında topluluk ruhu yaratan sosyal işlev hangisidir?", "o": ["Duygusal boşalma", "Kimliğin teyidi", "Sosyal kontrol", "Kolektif bilinç", "Başarı"], "a": 3, "e": "Latin Amerika'daki taraftar ritüelleri kolektif bilince örnektir."}, {"q": "Ping-pong diplomasisi, sporun hangi sosyal işlevine örnektir?", "o": ["Değişim organı", "Kimliğin teyidi", "Duygusal boşalma", "Başarı", "Sosyal kontrol"], "a": 0, "e": "Spor, tarihsel ve sosyal değişimlere yol açabilir."}, {"q": "Bir memurun aynı görevle İzmir'den Antalya'ya tayin edilmesi hangi hareketliliğe örnektir?", "o": ["Sınıfsal hareketlilik", "Yukarı doğru hareketlilik", "Kuşaklar arası hareketlilik", "Yatay hareketlilik", "Dikey hareketlilik"], "a": 3, "e": "Statü ve gelir değişmediği için yataydır."}, {"q": "Sporu halkı uyutan \"afyon\" olarak gören kuramsal yaklaşım hangisidir?", "o": ["Eleştirel yaklaşım", "Çatışmacı yaklaşım", "Figürasyon yaklaşımı", "Etkileşimci yaklaşım", "İşlevselci yaklaşım"], "a": 1, "e": "Çatışmacı yaklaşım sporu ırk, cinsiyet ve sınıf temelinde inceler."}, {"q": "Habermas'ın sporu \"çalışma rasyonalizasyonunun bir sektörü\" olarak görmesi hangi yaklaşıma aittir?", "o": ["Çatışmacı yaklaşım", "Etkileşimci yaklaşım", "Feminist yaklaşım", "İşlevselci yaklaşım", "Eleştirel yaklaşım"], "a": 4, "e": "Adorno ve Horkheimer de bu yaklaşımın temsilcileridir."}, {"q": "Sporcuların serbest dolaşımının önündeki engelleri kaldıran karar hangisidir?", "o": ["Lozan kararı", "Olimpik Ajanda 2020", "CAS kararı", "Bosman kararı", "Avrupa Spor Şartı"], "a": 3, "e": "Bosman kararıyla sporcuların transferindeki engeller kalktı."}, {"q": "Spordaki uyuşmazlıkları arabuluculuk ve tahkim yoluyla çözen uluslararası kurum hangisidir?", "o": ["WADA", "CAS (Uluslararası Spor Tahkim Mahkemesi)", "IOC", "FIFA", "UNESCO"], "a": 1, "e": "CAS, spor hukukunun en önemli kurumlarındandır."}, {"q": "Leonard II'nin modeline göre bireylerin spora katılmaya başlamasını sağlayan sürece ne ad verilir?", "o": ["Habitus", "Spora yönelik sosyalleşme", "Toplumsal hareketlilik", "Kolektif bilinç", "Spor yoluyla sosyalleşme"], "a": 1, "e": "Spor yoluyla sosyalleşme ise spora katılımın sonuçlarını ifade eder."}, {"q": "Ergenlik döneminde spora yönelmede en etkili sosyalleşme ajanı hangisidir?", "o": ["Akranlar (arkadaşlar)", "Aile", "Medya", "Sponsorlar", "Devlet"], "a": 0, "e": "İlk çocuklukta ailenin etkisi, ergenlikte yerini öğretmen, antrenör ve akranlara bırakır."}, {"q": "Aşağıdakilerden hangisi fair play ilkelerinden biri DEĞİLDİR?", "o": ["Rakibe saygı göstermek", "Kurallara saygı göstermek", "Duyguları kontrol altında tutmak", "Hakem kararlarını kabullenmek", "Her koşulda kazanmayı hedeflemek"], "a": 4, "e": "Fair play kazanmaktan çok dürüst mücadeleyi öne çıkarır."}, {"q": "Toplumun kadına ve erkeğe yüklediği rol, sorumluluk ve beklentilere ne ad verilir?", "o": ["Habitus", "Ayrımcılık", "Biyolojik cinsiyet", "Toplumsal cinsiyet", "Kalıp yargı"], "a": 3, "e": "Biyolojik cinsiyet ise doğuştan gelen fizyolojik özelliklerdir."}, {"q": "\"Kuvvet ve temas gerektiren sporlar kadınlar için uygun değildir\" düşüncesi neye örnektir?", "o": ["Toplumsal cinsiyet eşitliği", "Fair play", "Toplumsal cinsiyet kalıp yargısı", "Güvenli spor", "Biyolojik cinsiyet"], "a": 2, "e": "Kalıp yargılar çocukların istedikleri sporu seçmesini engelleyebilir."}, {"q": "Türkiye'de spor federasyonlarına bağlı sporcuların yaklaşık yüzde kaçı kadındır?", "o": ["%34", "%66", "%50", "%10", "%20"], "a": 0, "e": "Erkek sporcu oranı %66'dır."}, {"q": "Toplumsal cinsiyete duyarlı dil kullanımında \"sportmen\" yerine hangi ifade kullanılmalıdır?", "o": ["Teknik adam", "Spor adamı", "Erkek sporcu", "Centilmen", "Sporcu"], "a": 4, "e": "\"Teknik adam\" yerine de \"teknik direktör\" denmelidir."}, {"q": "John Loy’un ‘Toplumsal Bir Olgu Olarak Spor’ tablosunda spor kavramı dört farklı noktayla kesişim içerisindedir.\nYukarıdaki bilgiye göre aşağıdakilerden hangisi bu kesişim noktalarından biri değildir?", "o": ["Örgüt olarak", "Yarışma olarak", "Toplumsal sistem olarak", "İmaj pazarlaması olarak", "Toplumsal kurum olarak"], "a": 3, "e": "Doğru cevap: İmaj pazarlaması olarak.", "kb": 1}, {"q": "Aşağıdakilerden hangisi sporun sosyal işlevlerinden biri olan duygusal boşalmaya bir örnektir?", "o": ["Amatör bir takımda düzenli olarak antrenmanlara ve maçlara çıkmak", "Tuttuğu takımın maçını televizyondan izlemek", "Arkadaşlarla birlikte Efeler Voleybol ligi karşılaşması için spor salonuna gitmek", "Oyun konsoluyla oynamak", "Hipodroma giderek at yarışlarını takip etmek"], "a": 0, "e": "Doğru cevap: Amatör bir takımda düzenli olarak antrenmanlara ve maçlara çıkmak.", "kb": 1}, {"q": "İnsanlara kurallara uyma alışkanlığı kazandırdığı ve toplumun ortak değerlerinin yerleşmesine katkıda bulunduğu için sportif faaliyetlerin son derece olumlu işlevleri olduğunu ifade eden ve bu doğrultuda sporun yaygınlaştırılması gerektiğini savunan kuramsal bakış açısı aşağıdakilerden hangisidir?", "o": ["Çatışmacı Yaklaşım", "Eleştirel Yaklaşım", "Etkileşimci Yaklaşım", "Eleştirel Feminist Yaklaşım", "İşlevselci Yaklaşım"], "a": 4, "e": "Doğru cevap: İşlevselci Yaklaşım.", "kb": 1}, {"q": "-------, içinde yapıldığı toplumdan beslenen ve ortaya çıkardığı değerler aracılığı ile toplumsal hayatı besleyen bir etkinlik türüdür.\nYukarıdaki cümlede boş bırakılan yeri aşağıdakilerden hangisi doğru bir şekilde tamamlar?", "o": ["Serbest zaman", "Kültür", "Spor", "Sosyalizasyon", "İdeoloji"], "a": 2, "e": "Doğru cevap: Spor.", "kb": 1}, {"q": "Aşağıdakilerden hangisi spora yönelik sosyalleşme ajanlarından biri değildir?", "o": ["Sendika", "Aile", "Medya", "Arkadaşlar ve Sosyal Çevre", "Okul"], "a": 0, "e": "Doğru cevap: Sendika.", "kb": 1}, {"q": "-------, bir ideal anlayışıdır ve bir yüksek kültür ürünüdür.\nYukarıdaki cümlede boş bırakılan yeri aşağıdakilerden hangisi doğru bir şekilde tanımlar?", "o": ["Spor yoluyla sosyalleşme", "Spor aracılığıyla sosyalleşme", "Fair Play", "Kahraman sporcu olmak", "Fanatizm"], "a": 2, "e": "Doğru cevap: Fair Play.", "kb": 1}, {"q": "Habitus kavramı ile spor alanında da çok sık başvurulan, her sınıfın kendisine özgü sportif zevk ve beğenileri olduğunu savunan düşünür aşağıdakilerden hangisidir?", "o": ["Anthony Giddens", "Pierre Bourdieu", "Max Weber", "Jennifer Hargreaves", "Chris Bambery"], "a": 1, "e": "Doğru cevap: Pierre Bourdieu.", "kb": 1}, {"q": "Aşağıdakilerden hangisinde cinsiyet ve toplumsal cinsiyet kavramları arasındaki fark doğru ifade edilmiştir?", "o": ["Cinsiyet, toplumun kadına ve erkeğe uygun gördüğü rollerdir; toplumsal cinsiyet kadın ve erkeğin taşıdığı biyolojik özelliklerdir.", "Cinsiyet, kadın ve erkeğin taşıdığı biyolojik ve fizyolojik özelliklerdir; toplumsal cinsiyet kadın ve erkeğe toplum tarafından yüklenen roller ve beklentilerdir.", "Cinsiyet, kadın ve erkeğin sahip olduğu kültürel rollerdir; toplumsal cinsiyet kadın ve erkeğin taşıdığı toplumsal rollerdir.", "Cinsiyet, kadın ve erkeğin sahip olduğu biyolojik özelliklerdir; toplumsal cinsiyet kadın ve erkeğin sahip olduğu fizyolojik özelliklerdir.", "Cinsiyet, kadın ve erkeğin hormonal özellikleridir; toplumsal cinsiyet genetik özelliklerdir."], "a": 1, "e": "Doğru cevap: Cinsiyet, kadın ve erkeğin taşıdığı biyolojik ve fizyolojik özelliklerdir; toplumsal cinsiyet kadın ve erkeğe toplum tarafından yüklenen roller ve beklentilerdir.", "kb": 1}, {"q": "Aşağıdakilerden hangisi sporda toplumsal cinsiyet eşitliğinin ele alındığı stratejik alanlardan biri değildir?", "o": ["Spora katılım", "Spor yönetimi", "Antrenörlük ve hakemlik", "Sporda toplumsal cinsiyet temelli şiddet", "Spor pazarlaması"], "a": 4, "e": "Doğru cevap: Spor pazarlaması.", "kb": 1}, {"q": "Aşağıdakilerden hangisi toplumsal cinsiyete duyarlı antrenörün özelliklerinden biridir?", "o": ["Sporcuların beslenmesine dikkat etmek", "Cinsiyetler arasında işbirliğinden kaçınmak", "Spor malzemelerini sadece erkek sporculara taşıtmak", "Toplumsal cinsiyet kalıp yargı içeren ifadeler kullanmamak", "Spor tesislerine ulaşım, tesis güvenliği vb. konularla ilgilenmemek"], "a": 3, "e": "Doğru cevap: Toplumsal cinsiyet kalıp yargı içeren ifadeler kullanmamak.", "kb": 1}], "tf": []}, {"id": "spa3", "title": "Spor Psikolojisi", "cards": [{"title": "Spor ve egzersiz psikolojisi", "points": ["İlk spor psikolojisi çalışması **1898**'de **Norman Triplett**'in yüksek lisans tezidir. Türkiye'de ilk yayın **1943** (\"Sporun Fizyo Patolojisi\" çevirisi).", "**Spor psikolojisi:** Psikolojinin ilke ve kurallarının **spor ortamına** uygulanması. Sporda amaç **yarışmak ve kazanmaktır**.", "**Egzersiz psikolojisi:** 1982'den itibaren APA tarafından ayrı alan sayıldı; insanın **neden egzersiz yaptığını** araştırır. Egzersizde amaç **sağlıktır**.", "**Fiziksel aktivite:** İskelet kaslarıyla enerji harcanan her hareket. **Egzersiz:** Planlı, yapılandırılmış, tekrarlanabilir fiziksel aktivite. **Fiziksel sağlıklılık:** Fiziksel etkinliği uygulayabilme yeteneği."]}, {"title": "Spor psikolojisinin amaçları", "points": ["**APA**'ya göre spor psikolojisinin **2 amacı** vardır: spora katılımın psikolojik gelişime ve sağlığa etkisini anlamak; performans için psikoloji ilkelerini kullanmak (**sağlık ve performans**).", "Bu amaçlara bağlı **3 işlev** vardır:", "**1. Fiziksel performansı artırma ve toparlanma:** kişilik, motivasyon, konsantrasyon, algılama, dikkat, gevşeme ve kendine güven çalışmaları.", "**2. Teknik öğrenimi hızlandırma ve müsabakaya hazırlık:** beceri öğrenimi ağırlıklı **zihinsel antrenman**, hayal etme çalışmaları.", "**3. Performansa engel olan etmenleri kaldırma:** müsabaka kaygısı, stres, gerginlikler, **tükenme**, ruhsal sorunlar."]}, {"title": "Temel psikolojik kavramlar", "points": ["**Motivasyon:** Kişinin çabalarının **yönü ve şiddeti**; sadece \"gaz vermek\" değildir.", "**Konsantrasyon:** En önemli şeye isteyerek ortaya konan zihinsel çaba. **Algıda seçicilik:** Bazı uyaranları seçip diğerlerini görmezden gelme.", "**Kendine güven:** Başarılı ve daha az başarılı sporcuları **en tutarlı biçimde ayıran** faktör.", "Bedensel kaygıya karşı: derin gevşeme, **nefes kontrolü**, **biofeedback**. Bilişsel kaygıya karşı: gevşeme tepkisi, otojenik egzersiz, **sistematik duyarsızlaştırma**.", "**Yarışma sürekli kaygısı:** Rekabeti genel olarak tehdit algılama eğilimi. **Durumluk kaygı:** Belli bir olay öncesi olumsuz düşünceler.", "**Tükenme:** Aşırı çalışma ve yetersizlik çabasının psikofizyolojik tepkisi; **sporu bırakmaktan farklıdır**."]}, {"title": "Spor psikoloğunun rolleri", "points": ["Palacio ve Salmela (1986) 2 rol tanımladı; May'e göre spor psikoloğunun **3 rolü** vardır: **araştırmacı, klinik-danışmanlık, eğitimci**.", "**Uygulamacı (danışmanlık):** Performans becerilerini geliştirir, stres ve kaygıyla başa çıkmayı öğretir, takım havasını iyileştirir.", "**Akademisyen (eğitimci):** Üniversitede ders verir, performansı bilimsel yöntemlerle araştırır.", "**Klinik:** Alkol-ilaç kullanımı, **yeme bozuklukları**, şiddetli depresyon gibi sorunlara müdahale eder; **klinik psikoloji eğitimi** şarttır."]}, {"title": "Çocukların spora katılma ve bırakma nedenleri", "points": ["Spora katılım **10-13 yaşta zirve** yapar, 18'e doğru ciddi azalır. **7 yaşından önce** başlayanların yaklaşık **%75'i 15 yaşına gelmeden** sporu bırakır.", "En sık katılma nedeni: sporu **eğlenceli bulmak**. Diğerleri: yetenek geliştirme, formda kalma, arkadaşlık. Motivasyonların çoğu **içseldir**; kazanma tek ya da en yaygın neden değildir.", "En sık bırakma nedeni: sporun artık **eğlenceli olmaması**, başka ilgi alanları. Olumsuz nedenler: aşırı baskı, **antrenörü sevmeme**, kazanmaya aşırı önem.", "Bırakma kararını en çok etkileyen iki etken: **antrenör ve takım arkadaşları**. Altta yatan ihtiyaç: kendini **değerli ve yetkin** hissetmek.", "Sporcuların öncelikli **4 ihtiyacı**: eğlenmek ve heyecan, bir gruba **ait olmak**, **kontrol ve özerklik**, **yeterli hissetmek**."]}, {"title": "Yeterlik, özerklik, ilişkisellik", "points": ["Her insanın doğuştan 3 temel psikolojik ihtiyacı: **yeterlik, özerklik, ilişkisellik**.", "**Özerklik:** Davranışı başlatma, sürdürme ve bitirmede tercih ve irade hissi. Desteklemek için sporcuyu **karar süreçlerine katın**.", "**Yeterlik:** Bir işi yapabileceğine inanma. Desteklemek için **olumlu geribildirim** ve uygun görev dağılımı.", "**İlişkisellik:** Ait olma duygusu. Desteklemek için sıcak ve samimi işbirliği.", "**Yeterlik algısı motivasyonun temelidir.** İlişkisellik, içsel motivasyonda diğer ikisinden **daha az** rol oynar."]}, {"title": "Motivasyonel iklim ve TARGET", "points": ["**Ustalık iklimi (görev yönelimli):** Başarı ölçütü **kişinin kendi gelişimi ve çabası**. Sporcu kaybetse bile iyi oynadıysa kendini başarılı hisseder.", "**Performans iklimi (ego/sonuç yönelimli):** Hatalar cezalandırılır, yetenekliler ilgi görür, takım içi rekabet antrenörce körüklenir.", "Ustalık ikliminde sporcuların **motivasyonu ve özgüveni yüksek, kaygısı düşüktür**; performans iklimi **ahlaktan uzaklaşmaya** yol açabilir.", "Ustalık hedefli sporcu **başarısızlıktan korkmaz**, zor ama gerçekçi görevler seçer, yeterlik algısı yüksektir.", "**TARGET:** **T**ask (görev), **A**uthority (özerklik), **R**ewards (ödül), **G**rouping (grup), **E**valuation (değerlendirme), **T**ime (zaman).", "Antrenör **yetenek yerine çabayı** övmelidir."]}, {"title": "Çocuk antrenörlüğünün 12 ilkesi", "points": ["Olumlu, eğitici ve özerkliği destekleyici ol; **cezalandırıcı ve kontrolcü** yaklaşımdan kaçın.", "Doğru yapanı bul ve teşvik et; **içten övgü** ver; **gerçekçi beklentiler** geliştir.", "**Çabayı en az sonuç kadar** ödüllendir; sadece sonucu değil **doğru tekniği** ödüllendir.", "Beceri ve aktiviteleri uyarla: \"**Çocuğu aktiviteye değil, aktiviteyi çocuğa uydurun.**\" Kuralları başarıyı artıracak şekilde düzenle.", "Hata düzeltirken **sandviç yaklaşımı**: önce doğru yaptığı şey → sonra düzeltme bilgisi → teşvikle bitir.", "Yeni beceri deneme korkusunu azalt ve **coşkulu ol**."]}, {"title": "İletişim süreci", "points": ["\"Motive etmeden iletişim kurabilirsiniz, ama iletişim kurmadan motive edemezsiniz.\" (**John Thompson**)", "Sporcu eğitimi **antrenör-sporcu-aile üçgeni** üzerine kuruludur.", "**Tek yollu iletişim** sırası: gönderme kararı → nasıl iletileceğine karar (**kodlama**) → kanalla aktarma → alıcının çözümlemesi → **alıcının içsel tepkisi**.", "İletişim türleri (aynı zamanda çatışma türleri): **kişi-içi, kişilerarası, örgüt-içi, kitle**.", "Mesajların yaklaşık **%50-70'i sözsüzdür**. Martens'e göre sözsüz iletişimin 5 yolu: **fiziksel görüntü, vücut hareketleri, dokunma, ses özellikleri, vücudun konumu**.", "\"Ne söylediğin değil, **nasıl söylediğin** önemlidir.\" Sözlü ve sözsüz mesaj **tutarlı** olmalı."]}, {"title": "Etkili ve verimli iletişim", "points": ["**Sabit kapasite kuramı:** Aynı anda çok sayıda uyaran işlenemez; gereksizleri eleme işine **seçici dikkat** denir.", "İnsanlar iletişimde zamanlarının **%40'ını dinleyerek** geçirir. Dinleme teknikleri: **katılımcı (aktif)**, **destekleyici**, **farkında olarak** dinleme.", "Çatışmalar: **mesajı gönderenden** (çift anlamlı, tutarsız mesaj) veya **mesajı alandan** (dinlememe, kendine göre yorumlama) kaynaklanır.", "Mesaj doğrudan kişiye verilmeli, \"**ben**\" diliyle sahiplenilmeli, **zamanında** iletilmeli, alıcının özelliklerine uygun olmalı.", "Verimli iletişimin temelleri: **karşılıklı güven, saygı, empati** (kendini karşısındakinin yerine koyabilme).", "**Anshel**'in 10 altın kuralı: dürüst ol, iyi dinle, tutarlı ol, empatik ol, alaycı olma, **kişiyi değil davranışı eleştir**, sözsüz iletişimi kullan."]}], "questions": [{"q": "Spor ile egzersiz arasındaki temel fark nedir?", "o": ["Egzersiz yarışmayı, spor sağlığı hedefler", "Aralarında hiçbir fark yoktur", "Spor sadece profesyonellerce yapılır", "Spor bireysel, egzersiz takım halinde yapılır", "Sporda amaç yarışmak, egzersizde amaç sağlıktır"], "a": 4, "e": "Amaç farkı katılımcıların davranışlarını da farklılaştırır."}, {"q": "Egzersiz psikolojisi hangi yıldan itibaren APA tarafından ayrı bir alt alan olarak tanımlanmıştır?", "o": ["1982", "2000", "1898", "1966", "1943"], "a": 0, "e": "Egzersiz psikolojisi insanın neden egzersiz yaptığını araştırır."}, {"q": "Motivasyonun en basit tanımı hangisidir?", "o": ["Kişinin çabalarının yönü ve şiddeti", "Antrenörün baskısı", "Ödül beklentisi", "Sporcuya gaz vermek", "Kazanma isteği"], "a": 0, "e": "Motivasyon birey-çevre etkileşimini içeren çok boyutlu bir konudur."}, {"q": "Başarılı ve daha az başarılı sporcuları en tutarlı şekilde birbirinden ayıran faktör hangisidir?", "o": ["Antrenman süresi", "Kaygı düzeyi", "Yaş", "Kendine güven", "Boy uzunluğu"], "a": 3, "e": "Sportif kendine güven aslında başarı beklentisidir."}, {"q": "Bilişsel kaygıyı azaltmak için kullanılan teknik hangisidir?", "o": ["Masaj", "Nefes kontrolü", "Derinleşen gevşeme", "Biofeedback", "Sistematik duyarsızlaştırma"], "a": 4, "e": "Nefes kontrolü ve biofeedback bedensel kaygıya yöneliktir."}, {"q": "May'e göre spor psikoloğunun üç rolü hangileridir?", "o": ["Araştırmacı, klinik-danışmanlık, eğitimci", "Sporcu, aile, antrenör", "Menajer, sponsor, gazeteci", "Doktor, fizyoterapist, diyetisyen", "Antrenör, yönetici, hakem"], "a": 0, "e": "Başlangıçta yalnızca araştırmacı ve uygulamacı roller tanımlanmıştı."}, {"q": "Çocukların spora katılımı hangi yaş aralığında zirveye ulaşır?", "o": ["15-17 yaş", "7-9 yaş", "10-13 yaş", "18-21 yaş", "4-6 yaş"], "a": 2, "e": "18 yaşına doğru katılım ciddi şekilde azalır."}, {"q": "7 yaşından önce spora başlayan gençlerin yaklaşık yüzde kaçı 15 yaşına gelmeden sporu bırakır?", "o": ["%10", "%25", "%95", "%75", "%50"], "a": 3, "e": "Gerekçe olarak aşırı rekabet baskısı ve eleştirel antrenörler gösterilmiştir."}, {"q": "Çocukların spora katılımında en sık belirtilen neden hangisidir?", "o": ["Ailenin zorlaması", "Para kazanmak", "Sporu eğlenceli bulmak", "Kazanmak", "Ünlü olmak"], "a": 2, "e": "Kazanma ne tek ne de en yaygın katılma sebebidir."}, {"q": "İçsel motivasyonda en az rolü oynayan temel psikolojik ihtiyaç hangisidir?", "o": ["İlişkisellik", "Hiçbiri rol oynamaz", "Hepsi eşit rol oynar", "Yeterlik", "Özerklik"], "a": 0, "e": "Yeterlik algısı motivasyonun temelidir."}, {"q": "Kötü performansın cezalandırıldığı, yeteneklilerin öne çıktığı motivasyonel iklim hangisidir?", "o": ["Ustalık iklimi", "Görev yönelimli iklim", "Performans (ego/sonuç yönelimli) iklimi", "İşbirlikçi iklim", "Özerklik iklimi"], "a": 2, "e": "Bu iklim sporcularda ahlaktan uzaklaşmaya yol açabilir."}, {"q": "TARGET kısaltmasındaki \"A\" harfi neyi ifade eder?", "o": ["Dikkat (attention)", "Özerklik (authority)", "Kaygı (anxiety)", "Saldırganlık (aggression)", "Başarı (achievement)"], "a": 1, "e": "TARGET: görev, özerklik, ödül, grup, değerlendirme, zaman."}, {"q": "\"Çocuğu aktiviteye değil, aktiviteyi çocuğa uydurun\" ilkesi neyi vurgular?", "o": ["Çocuğu zorlamayı", "Sadece yetenekli çocuklarla çalışmayı", "Kuralları sabit tutmayı", "Becerileri ve aktiviteleri çocuğa göre uyarlamayı", "Yetişkin antrenman yöntemlerini kullanmayı"], "a": 3, "e": "Bu, çocuk sporlarında antrenörlüğün 12 ilkesinden biridir."}, {"q": "Hata düzeltirken önce olumlu bir şey söyleme, sonra düzeltme, sonra teşvik etme yaklaşımına ne denir?", "o": ["Şekillendirme", "Sistematik duyarsızlaştırma", "TARGET yaklaşımı", "Premack ilkesi", "Sandviç yaklaşımı"], "a": 4, "e": "Bu yaklaşım hata yapan çocuğun hayal kırıklığını azaltır."}, {"q": "Martens'e göre aşağıdakilerden hangisi sözsüz iletişim yollarından biri DEĞİLDİR?", "o": ["Vücudun konumu", "Yazılı mesaj", "Dokunma", "Fiziksel görüntü", "Ses özellikleri"], "a": 1, "e": "Yazılı mesaj sözlü iletişim kapsamındadır."}, {"q": "Araştırmalara göre insanlar iletişim zamanlarının yaklaşık yüzde kaçını dinleyerek geçirir?", "o": ["%10", "%40", "%70", "%90", "%20"], "a": 1, "e": "Dinleme en önemli iletişim becerisi olarak görülür."}, {"q": "Anshel'in iletişimin 10 altın kuralına göre antrenör neyi eleştirmelidir?", "o": ["Sporcunun ailesini", "Hiçbir şeyi", "Sadece davranışı", "Sporcunun fiziğini", "Sporcunun kişiliğini"], "a": 2, "e": "Kişisel eleştirilerden kaçınılmalıdır."}, {"q": "Spor psikolojisi alanında ilk çalışma hangi tarihte yapılmıştır?", "o": ["1880", "1898", "1900", "1910", "1920"], "a": 1, "e": "Doğru cevap: 1898.", "kb": 1}, {"q": "Aşağıdakilerden hangisi sporcuların teknik öğrenimlerini hızlandırıcı ve sporcuların müsabakaya hazırlanmalarını sağlamak amacıyla kullanılan çalışmalardan biridir?", "o": ["Beceri öğrenimi ağırlıklı zihinsel antrenmanlar", "Sporcu kişiliği", "Motivasyon çalışmaları", "Konsantrasyon çalışmaları", "Algılama çalışmaları"], "a": 0, "e": "Doğru cevap: Beceri öğrenimi ağırlıklı zihinsel antrenmanlar.", "kb": 1}, {"q": "Aşağıdakilerden hangisi fiziksel performansı artırma ve toparlanmaya yardımcı olmak amacıyla kullanılan spor psikolojisi uygulamalarından biri değildir?", "o": ["Kendine güven çalışmaları", "Gerginlikler", "Çeşitli gevşeme çalışmaları", "Dikkat çalışmaları", "Algılama çalışmaları"], "a": 1, "e": "Doğru cevap: Gerginlikler.", "kb": 1}, {"q": "Performans sporcularının çok sık yaşadığı alkol ve ilaç kullanımı, ilişki bozuklukları, yeme bozuklukları, şiddetli depresyon vb. gibi sorunlara müdahale edebilecek psikolog rolü aşağıdakilerden hangisidir?", "o": ["Gelişim psikoloğu", "Sosyal psikolog", "Eğitimci spor psikoloğu", "Araştırmacı spor psikoloğu", "Klinik spor psikoloğu"], "a": 4, "e": "Doğru cevap: Klinik spor psikoloğu.", "kb": 1}, {"q": "Bir gencin sporu bırakma nedenleri sıralandığında, en son sırada sayılabilecek gerekçe aşağıdakilerden hangisi olabilir?", "o": ["Sporcunun hissettiği aşırı baskı", "Tesiste yemek verilmemesi", "Antrenörü sevmeme", "Başarısızlık", "Kazanmaya aşırı önem verilmesi"], "a": 1, "e": "Doğru cevap: Tesiste yemek verilmemesi.", "kb": 1}, {"q": "Aşağıdakilerden hangisi ustalık hedef yönelimli sporcuların özelliklerinden biri değildir?", "o": ["Zorlu ancak gerçekçi görevleri ve rakipleri seçerler.", "Başarısızlıktan korkmazlar.", "Arkadaş edinmede zorlanırlar.", "Yeterlik algıları yüksektir.", "Yeni beceriler öğrenmede isteklidirler."], "a": 2, "e": "Doğru cevap: Arkadaş edinmede zorlanırlar.", "kb": 1}, {"q": "Aşağıdakilerden hangisi, sporcuların öncelikli dört ihtiyacı arasında yer almaz?", "o": ["Eğlenmek ve heyecan deneyimlemek", "Bir gruba ait olduğunu ve kabul edildiğini hissetmek", "Milli takıma seçilmek", "Davranışları üzerinde kontrol ve özerklik hissetmek", "Yeterli hissetmek"], "a": 2, "e": "Doğru cevap: Milli takıma seçilmek.", "kb": 1}, {"q": "Tek yollu iletişim sürecinin gerçekleşme sırasının ilk basamağı aşağıdakilerden hangisidir?", "o": ["Mesajın ne şekilde iletileceğine karar verilir.", "Mesajı gönderecek birey mesajı gönderme kararını verir.", "Mesaj uygun kanalla karşı tarafa aktarılır.", "Alıcı tarafından mesaj çözümlenir.", "Alıcı tarafından mesaja verilen içsel tepkiler gerçekleşir."], "a": 1, "e": "Doğru cevap: Mesajı gönderecek birey mesajı gönderme kararını verir.", "kb": 1}, {"q": "Aşağıdakilerden hangisi mesajları verimli alabilmek için kullanılan dinleme tekniklerinden biri değildir?", "o": ["Katılımcı Dinleme", "Aktif Dinleme", "Tükenme", "Destekleyici Dinleme", "Farkında Olarak Dinleme"], "a": 2, "e": "Doğru cevap: Tükenme.", "kb": 1}, {"q": "İletişim halindeki bireylerin kendilerini birbirlerinin yerine koyabiliyor olabilmeleri aşağıdakilerden hangisini ifade etmektedir?", "o": ["Karşılıklı Güven", "Sempati", "Saygı", "Kendine güven", "Empati"], "a": 4, "e": "Doğru cevap: Empati.", "kb": 1}], "tf": []}, {"id": "spa4", "title": "Sporda Fair Play", "cards": [{"title": "Fair play kavramının gelişimi", "points": ["Fair play'in Türkçe sözlük karşılığı **adil oyun**; TDK **\"dürüst oyun\"** karşılığını önerir. Diğer karşılıklar: sporda erdemlik, sportif erdem, örnek davranış.", "\"Fair\" sıfatı önce **estetik** anlam taşıyordu (uygun, güzel); **14. yüzyıldan** itibaren **etik** içerik (dürüst, namuslu) kazandı.", "İlk oyunla ilgili kullanımlar **15. yüzyıl şövalye turnuvalarında**: \"fayre attaynt\" (dürüst kazanma), \"**foule play**\" (faullü oyun).", "**Shakespeare**, kavramı fırsat eşitliği ve **şövalyece düşünüş** anlamında kullandı. Spor terminolojisine **18. yüzyılda** girdi.", "Türkçede fair play terimini ilk kullanan **Selim Sırrı Tarcan**'dır (\"Sporcu Neler Bilmeli\", **1926**). Adında fair play geçen ilk kitap: \"Sporda Erdemlik – Fair Play\" (**1974**)."]}, {"title": "Fair play'in 5 temel şartı", "points": ["**1. Kurallara uyma:** **Kurucu kurallar** sporu mümkün kılar (futbolda topu elle oynamamak). **Düzenleyici kurallar** oyun içi talimatlardır.", "**2. Hakem kararlarını kabullenme.**", "**3. Rakibe saygı:** Rakip bir **oyun partneridir**, düşman değil.", "**4. Fırsat eşitliği.**", "**5. Yarışma şartlarının eşitliği:** Genetik farkları eşitlemek değil, sadece **başlama şartlarının** biçimsel eşitliğidir. Güreş, boks, halterdeki **sıklet** ayrımı buna hizmet eder."]}, {"title": "Formal ve informal fair play", "points": ["Bu ayrımı ilk kez **1964'te Hans Lenk** yaptı.", "**Formal fair play:** Yazılı **oyun kurallarına** kesinlikle uymak ve hakem talimatlarına itaat etmek. Örnek: rakibi **kural dışı yollarla düşürmemek**, doping kullanmamak.", "**İnformal fair play:** Kuralların ötesinde, **yazısız** kurallar (örf, norm). Rakibe insan olarak saygı, dostluk, haksızlığı giderme.", "İnformal örnekler: **hakemin doğru karar almasına yardım etmek** (aleyhine olsa bile), düşen rakibi kaldırmak, sakatlanan oyuncuya yardım.", "Günümüzde \"**enselenmemek**\" (yakalanmamak) gayriresmî norm hâline geldiği için kurallara uymak bile olumlu bir gelişme sayılır."]}, {"title": "Antik Çağ ve Ortaçağ'da fair play", "points": ["**Antik olimpiyatlarda** sporcular, babaları, kardeşleri ve antrenörleri kurallara uyacaklarına **ant içerdi**; hakemler de adil olacaklarına yemin ederdi.", "Kuralı ihlal eden **halkın önünde kırbaçlanırdı**; ağır ihlalde \"onursuz\" damgasıyla gönderilirdi.", "**Rüşvete** verilen ceza: suçlunun adının yazılı olduğu **bronz Zeus heykeli** yaptırmak (5 olayda 18 heykel).", "Antik oyunlarda **sıklet yoktu**, bu yüzden güreş ve boksta fırsat eşitliğinden söz edilemez.", "Günümüzle Antik Çağ arasındaki benzerlik: **yazılı kurallar ve hakem otoritesi**.", "**Ortaçağ şövalyeliği** rakibe saygı ve onurlu davranışı içerir; ama bunlar sadece **soylu bir zümrenin** kodlarıdır, fırsat eşitliği değil gösteriş öndedir."]}, {"title": "Modern fair play: İngiltere", "points": ["Modern fair play **19. yüzyıl İngiltere**'sinde şekillendi; kaynakları aile, spor basını ve özellikle **yatılı kolejler** (Eton, Harrow, Rugby) ile **Oxford-Cambridge**.", "**Thomas Arnold** (Rugby Koleji): Eğitim hedefi \"**genç Hristiyan centilmen**\"; sporu moral eğitimin aracı yaptı, **takım sporlarını** öne çıkardı.", "**Edward Thring** (Uppingham): Spor ve jimnastiği müfredata aldı; **ilk cimnastik salonunu** kurdu.", "Soyluların **bahis tutkusu** ve **primogenitur** yasası fair play'in yayılmasını kolaylaştırdı.", "**Amatör kurallar** başlangıçta çalışan kesimi spordan uzak tutmak için konuldu; amatörlük **sosyal tabakaya** göre belirlenirdi (Henley kürek yarışlarına işçiler katılamazdı)."]}, {"title": "Fair play'de gerileme", "points": ["Modern sporun başında ağırlık **informal fair play**'deydi.", "19. yüzyıl sonundan itibaren **ticarileşme** ile denge, **informal'den formal fair play'e** doğru bozuldu; fair play sadece kurallara uymaya indirgendi.", "Nedenler: ticarileşme, **siyasileşme**, başarının abartılması, sporun **prestij** aracı görülmesi (\"kasabanın namusu\").", "Yeni anlayış: \"**Ne pahasına olursa olsun kazanmak**\"; kuralı **hakeme fark ettirmeden** çiğnemek taktik olarak öğretiliyor.", "Fair play **doğuştan gelmez**; amaca uygun bir eğitimle kazanılır."]}, {"title": "Fair play kuruluşları", "points": ["**CIFP (Uluslararası Fair Play Komitesi):** İlk adım **1963 UNESCO** semineri; adını **29 Mayıs 1973**'te aldı; IOC tarafından tanındı. Merkezi **Paris**. Fair play'i **dünya çapında** yaygınlaştırır.", "CIFP **3 dalda** ödül verir: **davranış**, **kariyer**, **tanıtım**.", "**Pierre de Coubertin Büyük Ödülü:** Rakibine yardım için kendi performansını riske atan davranış. İlk sahibi İtalyan kızakçı **Eugenio Monti** (1964; rakiplerine kızak vidasını verdi).", "**Jean Borotra Ödülü:** Kariyeri boyunca fair play. **Willi Daume Ödülü:** Fair play'i teşvik eden kişi/kurum.", "**EFPM (Avrupa Fair Play Birliği):** **27 Mayıs 1994, Zürih**; Türkiye **kurucu üye**. Yayın organı **\"Play Fair\"**. Ödülleri: Fair Play Ruhu, **Fair Play Alevi** (18 yaş altı), **Fair Play'in Sesi** (medya)."]}, {"title": "Türkiye'de fair play", "points": ["Türkiye'de ilk kurumsal yapı: **17 Kasım 1981**'de **TMOK** bünyesinde **Fair Play Komisyonu** (başkan Turgut Atakol).", "**1983**'te kaleci **İsmet Karababa** (Derbent Spor), takımı aleyhine **topun çizgiyi geçtiğini hakeme söyledi** ve uluslararası Fair Play Trophy'yi kazandı.", "**1993**'te **TMOK Fair Play Konseyi** kuruldu. Amblemi: üzeri **ay-yıldızlı kart** gösteren el (\"Sana kırmızı kart göstermiyorum, kalbimi veriyorum\").", "Konsey **4 yılda bir** seçilen **20 üyeden** oluşur; ödüller davranış, kariyer, tanıtım dallarında: Büyük Ödül, Şeref Diploması, Kutlama Ödülü.", "Öncü isim: **Erdoğan Arıpınar**. Konsey **Fair Play Karikatür Yarışması** (1996) ve **Fair Play Üniversiteler Kervanı** (2014) projelerini yürütür."]}], "questions": [{"q": "TDK fair play terimi için hangi Türkçe karşılığı önermektedir?", "o": ["Adil oyun", "Dürüst oyun", "Örnek davranış", "Centilmenlik", "Sporda erdemlik"], "a": 1, "e": "Sözlük karşılığı \"adil oyun\" olsa da TDK \"dürüst oyun\" önerir."}, {"q": "\"Fair\" sıfatına etik içeriğin eklenmesi hangi yüzyılda başlamıştır?", "o": ["18. yüzyıl", "4. yüzyıl", "10. yüzyıl", "14. yüzyıl", "20. yüzyıl"], "a": 3, "e": "Kelime önce estetik, 14. yüzyıldan itibaren etik anlam kazandı."}, {"q": "Fair play terimini Türkçe literatürde ilk kullanan kimdir?", "o": ["Pierre de Coubertin", "Selim Sırrı Tarcan", "Erdoğan Arıpınar", "Turgut Atakol", "Ruhi Sarıalp"], "a": 1, "e": "1926'daki \"Sporcu Neler Bilmeli\" eserinde kullanmıştır."}, {"q": "Futbolda topu elle oynamamak gibi, sporun oynanmasını mümkün kılan kurallara ne ad verilir?", "o": ["Ahlak kuralları", "Düzenleyici kurallar", "Örf kuralları", "Yazısız kurallar", "Kurucu kurallar"], "a": 4, "e": "Kurucu kurallar ihlal edilirse o spor oynanmıyor demektir."}, {"q": "Güreş, boks ve halterde sıklet uygulaması fair play'in hangi şartına hizmet eder?", "o": ["Amatörlük", "Hakem kararlarını kabullenme", "Kurallara uyma", "Rakibe saygı", "Yarışma şartlarının eşitliği"], "a": 4, "e": "Amaç başlama şartlarını biçimsel olarak eşitlemektir."}, {"q": "Formal ve informal fair play ayrımını ilk kez yapan kimdir?", "o": ["Shakespeare", "Selim Sırrı Tarcan", "Thomas Arnold", "Edward Thring", "Hans Lenk (1964)"], "a": 4, "e": "Formal fair play yazılı kurallara, informal fair play yazısız kurallara dayanır."}, {"q": "Kaleci İsmet Karababa'nın takımı aleyhine hakeme topun çizgiyi geçtiğini söylemesi hangi fair play türüne örnektir?", "o": ["Kurucu fair play", "Formal fair play", "Foul play", "İnformal fair play", "Bağıl fair play"], "a": 3, "e": "Bu davranış kuralların ötesinde bir erdem örneğidir."}, {"q": "Antik olimpiyatlarda rüşvet veren atlete verilen ceza hangisiydi?", "o": ["Ülkeden sürgün", "Adının yazılı olduğu bronz Zeus heykeli yaptırmak", "Ömür boyu hapis", "Para cezası verilmeden uyarı", "Madalyasının elinden alınması"], "a": 1, "e": "Yaklaşık bin yılda 5 rüşvet olayında 18 heykel yaptırıldı."}, {"q": "Rugby Koleji'nde eğitim hedefini \"genç Hristiyan centilmen\" yetiştirmek olarak belirleyen kimdir?", "o": ["Pierre de Coubertin", "William Shakespeare", "Hans Lenk", "Thomas Arnold", "Edward Thring"], "a": 3, "e": "Arnold sporu moral eğitimin aracı olarak kullandı."}, {"q": "İngiliz yatılı kolejlerinin ilk cimnastik salonunu kuran eğitimci kimdir?", "o": ["GutsMuths", "Jahn", "Ling", "Thomas Arnold", "Edward Thring"], "a": 4, "e": "Thring Uppingham Koleji'nin müdürüydü."}, {"q": "Günümüzde fair play anlayışındaki denge hangi yönde bozulmaktadır?", "o": ["Amatörlükten profesyonelliğe doğru değil", "Formal fair play'den informal fair play'e doğru", "İnformal fair play'den formal fair play'e doğru", "Hiçbir değişim yoktur", "Kurallardan uzaklaşarak tamamen kuralsızlığa"], "a": 2, "e": "Fair play giderek sadece kurallara uymaya indirgenmektedir."}, {"q": "Uluslararası Fair Play Komitesi (CIFP) adını hangi tarihte almıştır?", "o": ["1926", "29 Mayıs 1973", "1963", "27 Mayıs 1994", "17 Kasım 1981"], "a": 1, "e": "İlk adım 1963'te UNESCO seminerinde atılmıştı."}, {"q": "Pierre de Coubertin Dünya Fair Play Büyük Ödülü'nü ilk kazanan sporcu kimdir?", "o": ["Jean Borotra", "Willi Daume", "İsmet Karababa", "Yasemin Adar", "Eugenio Monti"], "a": 4, "e": "Monti, rakiplerine kendi kızak vidasını vermişti."}, {"q": "Kariyeri boyunca fair play davranışı sergileyen sporculara verilen dünya ödülü hangisidir?", "o": ["Pierre de Coubertin Büyük Ödülü", "Jean Borotra Ödülü", "Fair Play'in Sesi", "Willi Daume Ödülü", "Fair Play Alevi"], "a": 1, "e": "Willi Daume Ödülü fair play'i teşvik eden kişi ve kurumlara verilir."}, {"q": "Avrupa Fair Play Birliği (EFPM) nerede kurulmuştur?", "o": ["Münih (1963)", "Paris (1973)", "Zürih (1994)", "Lozan (1987)", "İstanbul (1995)"], "a": 2, "e": "Türkiye EFPM'nin kurucu üyelerindendir."}, {"q": "EFPM'nin 18 yaş altı takım, sınıf veya kişilere verdiği ödül hangisidir?", "o": ["Fair Play Alevi", "Fair Play Ruhu", "Fair Play'in Sesi", "Jean Borotra Ödülü", "Avrupa Fair Play Plaketi"], "a": 0, "e": "Fair Play'in Sesi ise medya kuruluşlarına verilir."}, {"q": "TMOK Fair Play Konseyi'nin ambleminde ne vardır?", "o": ["Olimpiyat halkaları", "Zeytin dalı", "Kırmızı kart", "Üzeri ay-yıldızlı kart gösteren el", "Altın madalya"], "a": 3, "e": "Anlamı: \"Sana kırmızı kart göstermiyorum, kalbimi veriyorum.\""}, {"q": "Aşağıdakilerden hangisi fair play anlayışına uygun bir müsabaka ortamının yaratılmasının temel şartlarından biri değildir?", "o": ["Kurallara uyma", "Hakem kararlarını kabullenme", "Rakibe saygı", "Fırsat eşitliği", "Çevre şartlarının eşitliği"], "a": 4, "e": "Doğru cevap: Çevre şartlarının eşitliği.", "kb": 1}, {"q": "Aşağıdakilerden hangisi informal fair playe örnek bir davranıştır?", "o": ["Gole giden rakibi düşürmemek", "Hakemin doğru karar almasına yardımcı olmak", "Gol sonrası forma çıkarmak", "Doping kullanmamak", "Rakibe faul yapmak"], "a": 1, "e": "Doğru cevap: Hakemin doğru karar almasına yardımcı olmak.", "kb": 1}, {"q": "Türkçe literatürde “fair play” teriminin kullanıldığı ilk kaynak aşağıdakilerden hangisine aittir?", "o": ["Baron Pierre de Coubertin", "Shakespeare", "Selim Sırrı Tarcan", "Faik Üstünidman", "Mazhar Kazancı"], "a": 2, "e": "Doğru cevap: Selim Sırrı Tarcan.", "kb": 1}, {"q": "Fair play tanımı ile ilgili aşağıdaki ifadelerden hangisi yanlıştır?", "o": ["Sporcuların yarışmalar esnasında; güçleşen şartlar altında dahi kurallara sabırla, tutarlı ve bilinçli olarak riayet etmeleridir.", "Fırsat eşitliğini bozmamak amacıyla haksız avantajları kabullenmemeleridir.", "Rakibin haksız dezavantajlarından yararlanmaya kalkışmamalarıdır.", "Rakibi düşman değil, aksine oyunun gerçekleşmesini sağlayan, eşdeğer haklara sahip birey ve partner olarak görmeleri ve değer vermeleridir.", "Sporcuların ne pahasına olursa olsun mücadeleyi bırakmamalarıdır."], "a": 4, "e": "Doğru cevap: Sporcuların ne pahasına olursa olsun mücadeleyi bırakmamalarıdır.", "kb": 1}, {"q": "Fair play anlayışını dünya çapında yaygınlaştırmaktan sorumlu organizasyon aşağıdakilerden hangisidir?", "o": ["Türkiye Fair Play Konseyi", "Uluslararası Fair Play Komitesi", "Avrupa Fair Play Birliği", "Dünya Sağlık Örgütü", "Türkiye Milli Olimpiyat Komitesi"], "a": 1, "e": "Doğru cevap: Uluslararası Fair Play Komitesi.", "kb": 1}, {"q": "Günümüz fair play anlayışı ile Antik Çağ fair play anlayışı arasındaki benzerlik aşağıdaki hangisinde doğru olarak verilmiştir?", "o": ["Yazılı kuralların belirlenmesi ve hakem otoritesi", "Şövalyece düşünüş tarzı", "Yazısız kurallara uygun davranılması", "Kural dışı davrananlara heykel yaptırma cezası", "Fırsat eşitliği"], "a": 0, "e": "Doğru cevap: Yazılı kuralların belirlenmesi ve hakem otoritesi.", "kb": 1}, {"q": "Fair play anlayışını şövalyece düşünüş tarzı ve fırsat eşitliği anlamında kullanan ünlü edebiyatçı aşağıdakilerden hangisidir?", "o": ["Atinalı Kallipsos", "Homeros", "William Shakespeare", "Pausanias", "William Wordsworth"], "a": 2, "e": "Doğru cevap: William Shakespeare.", "kb": 1}, {"q": "Aşağıdakilerden hangisi formal fair playe örnek bir davranıştır?", "o": ["Düşen rakibin yerden kaldırılması", "Hakemin hatalı kararının düzeltilmesi", "Hakeme topun kendinden çıktığının söylenmesi", "Rakibin kural dışı yollarla düşürülmemesi", "Sakatlanan oyuncuya yardım edilmesi"], "a": 3, "e": "Doğru cevap: Rakibin kural dışı yollarla düşürülmemesi.", "kb": 1}, {"q": "“Bir sporcu, kazanmak için doping kullanmaya karar verirse ilk olarak sporcunun bu davranışın kurallara aykırı olduğunu bilmesi” aşağıdaki hangi tür fair play anlayışıyla ilgilidir?", "o": ["Formal Fair Play", "İnformal Fair Play", "Faul Play", "Faul Game", "Biçimsel Olmayan Fair Play"], "a": 0, "e": "Doğru cevap: Formal Fair Play.", "kb": 1}, {"q": "Türkiye’de Fair Play’e ilişkin ilk kurumsal yapılanma olan “Fair Play Komisyonu” hangi organizasyonel yapı içerisinde yer almaktadır?", "o": ["CIFP", "EFPM", "TMOK", "UEFA", "EOC"], "a": 2, "e": "Doğru cevap: TMOK.", "kb": 1}], "tf": []}, {"id": "spa5", "title": "Sporda Koruma", "cards": [{"title": "Çocuk koruma temel kavramları", "points": ["**BM Çocuk Hakları Sözleşmesi 1. madde:** Daha erken reşit olma hariç, **18 yaşına kadar** her insan çocuktur.", "**Çocuk koruma:** Çocuğun **yaşama, gelişme, korunma ve katılım** haklarını güvenceye alıp yararını ve **esenliğini** gözetmek.", "**UNICEF**: Çocuk koruma, her türlü şiddet, istismar, ihmal, sömürü ve tacizi **engelleme** ve hızla **müdahale etmedir**.", "Çocuk koruma **önleyici** bir programdır; riskler önceden fark edilir.", "Çocuk koruma **sadece çocuğu değil**; antrenör, yönetici, ebeveyn gibi tüm unsurları korumayı da amaçlar.", "**Güvenli spor:** Spor ortamındaki herkesin ihmale ve fiziksel, duygusal, cinsel, **ekonomik** istismara uğramaması için tüm önlemlerin alındığı sistem."]}, {"title": "İstismar riski ve fiziksel temas", "points": ["Spor, çocuklar için **en çok risk taşıyan** alanlardan biri olabilir.", "Risk nedenleri: başarının cazibesi, maddi-manevi getiriler, yoğun etkileşim, kariyer isteği, antrenör-sporcuyla **kuvvetli güven** ve **güç dengesizliği**, otoriter liderlik, yoğun kamplar ve izolasyon.", "Fiziksel temas şu amaçlarla yapılabilir: beceri geliştirmek, yaralanmayı tedavi etmek, kazayı önlemek, başarıyı kutlamak.", "Temasta: **özel bölgelere dokunulmaz**; önce nereye ve neden dokunulacağı **açıklanır ve onay** alınır; **gizli yerlerde** yapılmaz.", "Seyahatte çalışanlar çocuklarla **aynı odada kalmaz**; bire bir görüşmeler **kapısı açık** odada yapılır."]}, {"title": "Taciz, istismar ve DSÖ sınıflaması", "points": ["TDK: **Taciz** = tedirgin etme, rahatsız etme; **istismar** = sömürme.", "**DSÖ**'ye göre **4 temel istismar türü**: **fiziksel, cinsel, duygusal istismar ve ihmal**. Uluslararası federasyonlar bu sınıflamayı temel alır.", "Taciz ve istismar genellikle **otoritenin kötüye kullanılmasından** kaynaklanır; IOC ikisini **bir bütün** sayar.", "En yüksek risk altındakiler **çocuklar ve engelliler**; en çok **psikolojik istismar** yaşanır; kızlar cinsel istismar açısından daha fazla risk altındadır."]}, {"title": "Fiziksel istismar", "points": ["Çocuğun kaza dışı her türlü yaralanmasına neden olmak; **en yaygın rastlanan ve belirlenmesi en kolay** tür.", "Örnekler: **vurmak**, tekmelemek, itmek, saç-kulak çekmek, **ekipman fırlatmak**, kapasitesinin üstünde antrenman, tükenmişken zorlamak.", "**Doping** kullandırmak, yaralıyken oynatmak, sıklet için aşırı kilo verdirmek, **fiziksel egzersizi ceza** olarak kullanmak.", "**Takıma kabul ritüelleri** (onur kırıcı) de fiziksel istismardır; erkek sporcular arasında daha sık görülür.", "Göstergeler: açıklanamayan morluklar, yanıklar, kırıklar, dokunulunca **irkilme**, belli biriyle yalnız kalma korkusu."]}, {"title": "Duygusal istismar", "points": ["Çocuğun psikolojik ve ruhsal gelişimine zarar veren **temassız** davranışlar.", "Spor ortamında **en sık görülen** ve **en geniş olumsuz etkiye** sahip istismar türüdür.", "Örnekler: **değersiz hissettirmek**, görmezden gelmek, **öfkeli bağırmak**, küçük düşürmek, tehdit, alay, **lakap takmak**, yenilgiyi bir sporcuya yüklemek, olumsuz iletişim dili.", "Ağlayan sporcuya duyarsız kalmak, gerçekçi olmayan yüksek hedefler koymak da duygusal istismardır.", "Önlemek için her sporcuya **eşit mesafe ve ilgi** gösterilmelidir."]}, {"title": "Cinsel istismar ve ihmal", "points": ["**Cinsel istismar:** Bir yetişkinin, cinsel gelişimini tamamlamamış çocuğu güç, tehdit veya kandırmayla kullanması; temas olsun olmasın.", "Mahremiyet alanlarında (soyunma odası, tuvalet) **fotoğraf çekmek** ve uygunsuz görüntü paylaşmak da cinsel istismar kapsamındadır.", "**IOC 2007 bildirgesi:** Mağduriyet oranı **elit sporcularda daha yüksek**; cinsel istismara **sıfır tolerans**. **2017**'de koruma **araç kiti** yayımlandı.", "**İhmal:** Çocuğa bakmakla yükümlü kişinin beslenme, giyim, sağlık, sosyal ve duygusal gereksinimleri karşılamaması; **yapılması gerekeni yapmamak**.", "Önlenebilecek nedenle zarar görmek **kaza değil ihmaldir** (örnek: sahada unutulan malzemeyle sakatlanma, sivri uçlu malzemeyle kesilme).", "İhmal örnekleri: **uygun olmayan ekipman**, aşırı soğuk-sıcakta antrenman, sakatken oynatmak, yolculukta **yetersiz denetim**, **akran zorbalığına izin vermek**, izinsiz fotoğraf paylaşmak."]}, {"title": "Hak temelli anlayış", "points": ["Çocuk hakları **ihtiyaç temelli değil, hak temelli** bir anlayıştır; çocuklar yardımın nesnesi değil, hak sahibidir.", "Hak temelli yaklaşımın özellikleri: çocuk ve haklarına odaklanma, **ayrımcılık gözetmeme**, **hesap verilebilirlik**, **katılım**, **çocuğun yüksek yararı**, ortak amaçlar için işbirliği.", "**Cenevre Bildirgesi (26 Eylül 1924):** Çocukların korunmasına ilişkin **ilk uluslararası metin**; 5 madde; Atatürk de imzalayanlar arasında.", "**1948 İnsan Hakları Evrensel Bildirgesi** (çocuk hakları sınırlı); **1959 BM Çocuk Hakları Bildirgesi** (10 madde, çocuğun özel bakıma ihtiyacı kabul edildi; yaptırımı yok)."]}, {"title": "BM Çocuk Hakları Sözleşmesi", "points": ["**20 Kasım 1989**'da kabul edildi; çocuk haklarının **anayasası** sayılır. Türkiye
