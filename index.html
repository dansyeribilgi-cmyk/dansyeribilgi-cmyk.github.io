 **14 Eylül 1990**'da imzaladı.", "Anayasa'nın **90. maddesi** gereği iç hukukta **kanun hükmünde** ve uyuşmazlıkta üstündür.", "4 temel ilke: **yaşama ve gelişme** (6. madde), **eşitlik ve ayrım gözetmeme** (2. madde), **katılım** (12. madde), **çocuğun yüksek yararı** (3. madde).", "**19. madde:** Çocuğun her türlü istismar ve kötü muameleye karşı korunması; spor örgütlerinin sorumluluğunu da ortaya koyar.", "**31. madde:** Çocuğun **dinlenme, boş zaman, oyun** ve kültürel yaşama katılma hakkı (spora katılım)."]}, {"title": "Diğer uluslararası belgeler", "points": ["**Lanzarote Sözleşmesi** (Avrupa Konseyi, çocukların cinsel sömürü ve istismara karşı korunması): **25 Ekim 2007** imzaya açıldı, **2010**'da yürürlüğe girdi; Türkiye'de **2011**.", "Lanzarote'nin **5. maddesi**: Sporda çocuklarla çalışacak kişilerin **işe alımı, eğitimi ve bilinçlendirilmesi**.", "**EPAS** (Sporda Genişletilmiş Kısmi Anlaşma): Türkiye **2020**'de **38. üye** oldu.", "**UNESCO Uluslararası Beden Eğitimi ve Spor Şartı (21 Kasım 1978):** Beden eğitimi ve spora erişim **herkes için temel haktır**.", "**Olimpik Antlaşma 4. madde:** Spor yapmak bir **insan hakkıdır**; IOC kararları tüm spor örgütleri için **bağlayıcıdır**."]}], "questions": [{"q": "BM Çocuk Hakları Sözleşmesi'ne göre kaç yaşına kadar her insan çocuk sayılır?", "o": ["16", "18", "21", "15", "12"], "a": 1, "e": "Daha erken yaşta reşit olma durumu hariçtir."}, {"q": "UNICEF çocuk korumayı nasıl tanımlar?", "o": ["Çocuklara spor yaptırma", "Çocukları yarışmalardan uzak tutma", "Ailelere maddi yardım", "Sadece istismar sonrası tedavi", "Her türlü şiddet, istismar ve ihmali engelleme ve hızla müdahale etme"], "a": 4, "e": "Çocuk koruma önleyici bir programdır."}, {"q": "Çocuk korumanın en önemli unsuru hangisidir?", "o": ["Önleyici olması", "Cezalandırıcı olması", "Sadece çocuğu koruması", "İstismardan sonra başlaması", "Sadece aileyi kapsaması"], "a": 0, "e": "Riskler önceden fark edilerek önlem alınır."}, {"q": "Dünya Sağlık Örgütü'ne göre temel istismar türü sayısı kaçtır?", "o": ["6", "5", "3", "2", "4"], "a": 4, "e": "Fiziksel, cinsel, duygusal istismar ve ihmal."}, {"q": "Belirlenmesi en kolay ve en yaygın rastlanan istismar türü hangisidir?", "o": ["İhmal", "Fiziksel istismar", "Ekonomik istismar", "Cinsel istismar", "Duygusal istismar"], "a": 1, "e": "Duygusal istismar ise spor ortamında en sık görülen ve en geniş etkiye sahip türdür."}, {"q": "Spor ortamında en sık görülen ve en geniş olumsuz etki alanına sahip istismar türü hangisidir?", "o": ["Ekonomik istismar", "Fiziksel istismar", "İhmal", "Duygusal istismar", "Cinsel istismar"], "a": 3, "e": "Duygusal istismar temassız davranışlarla gerçekleşir."}, {"q": "Sporcuya lakap takmak hangi istismar türüne girer?", "o": ["Fiziksel istismar", "İhmal", "Duygusal istismar", "Cinsel istismar", "Ekonomik istismar"], "a": 2, "e": "Küçümseme, alay ve lakap takma duygusal istismardır."}, {"q": "Fiziksel egzersizin ceza olarak kullanılması hangi istismar türüne örnektir?", "o": ["Fiziksel istismar", "Ekonomik istismar", "İhmal", "Cinsel istismar", "Duygusal istismar"], "a": 0, "e": "UNICEF bunu sporda istismar biçimleri arasında sayar."}, {"q": "Sporcuları aşırı soğuk hava koşullarında antrenmana maruz bırakmak hangi kapsama girer?", "o": ["İhmal", "Duygusal istismar", "Kaza", "Cinsel istismar", "Fiziksel istismar"], "a": 0, "e": "Önlenebilecek nedenle zarar görmek kaza değil ihmaldir."}, {"q": "Sporcular arasındaki akran zorbalığına müsaade etmek hangi istismar türüne girer?", "o": ["İhmal", "Fiziksel istismar", "Cinsel istismar", "Kaza", "Ekonomik istismar"], "a": 0, "e": "Koruma yükümlülüğünü yerine getirmemek ihmaldir."}, {"q": "Çocukların korunmasına ilişkin ilk uluslararası metin hangisidir?", "o": ["Cenevre Bildirgesi (1924)", "UNESCO Spor Şartı (1978)", "İnsan Hakları Evrensel Bildirgesi (1948)", "Lanzarote Sözleşmesi (2007)", "BM Çocuk Hakları Sözleşmesi (1989)"], "a": 0, "e": "Atatürk de Cenevre Bildirgesi'ni imzalayanlar arasındadır."}, {"q": "BM Çocuk Hakları Sözleşmesi hangi tarihte kabul edilmiştir?", "o": ["14 Eylül 1990", "1959", "21 Kasım 1978", "26 Eylül 1924", "20 Kasım 1989"], "a": 4, "e": "Türkiye sözleşmeyi 14 Eylül 1990'da imzalamıştır."}, {"q": "BM Çocuk Hakları Sözleşmesi'nin hangi maddesi çocuğun oyun, dinlenme ve boş zaman hakkını düzenler?", "o": ["1. madde", "12. madde", "31. madde", "19. madde", "3. madde"], "a": 2, "e": "Bu madde çocukların spora katılım hakkıyla ilgilidir."}, {"q": "Çocuğun katılım hakkı BM Çocuk Hakları Sözleşmesi'nin hangi maddesinde yer alır?", "o": ["6. madde", "3. madde", "2. madde", "12. madde", "31. madde"], "a": 3, "e": "Çocuk kendini ilgilendiren konularda görüşünü serbestçe ifade edebilir."}, {"q": "Lanzarote Sözleşmesi'nin hangi maddesi sporda çocuklarla çalışacak kişilerin işe alımı ve eğitimini düzenler?", "o": ["28. madde", "4. madde", "5. madde", "1. madde", "18. madde"], "a": 2, "e": "4. madde ise devletlerin genel önlem alma yükümlülüğünü düzenler."}, {"q": "Türkiye EPAS'a (Sporda Genişletilmiş Kısmi Anlaşma) kaçıncı üye olarak katılmıştır?", "o": ["28. üye", "1. üye", "50. üye", "10. üye", "38. üye (2020)"], "a": 4, "e": "EPAS, Avrupa Konseyi'nin spor işbirliği platformudur."}, {"q": "\"Beden eğitimi ve spora erişim herkes için temel haktır\" ilkesi hangi belgeyle ortaya konmuştur?", "o": ["Olimpik Ajanda 2020", "Bosman Kararı", "Cenevre Bildirgesi", "UNESCO Uluslararası Beden Eğitimi ve Spor Şartı", "Lanzarote Sözleşmesi"], "a": 3, "e": "Şart 21 Kasım 1978'de Paris'te kabul edildi."}, {"q": "Aşağıdakilerden hangisi spor alanlarında istismara zemin hazırlayan unsurlardan biri değildir?", "o": ["Oyuncu ve antrenör arasındaki güç ilişkisi", "Maddi ve manevi getiriler", "Oyuncu ve antrenör arasında kuvvetli güven ilişkisi", "Fiziksel temasın yoğunluğu", "Eğlence unsurunun ön plana çıkarılması"], "a": 4, "e": "Doğru cevap: Eğlence unsurunun ön plana çıkarılması.", "kb": 1}, {"q": "Aşağıdakilerden hangisi Dünya Sağlık Örgütü’nün belirlediği temel istismar sınıflandırmalarından biri değildir?", "o": ["Fiziksel İstismar", "Cinsel İstismar", "Duygusal İstismar", "İhmal", "Akran Zorbalığı"], "a": 4, "e": "Doğru cevap: Akran Zorbalığı.", "kb": 1}, {"q": "Çocuk koruma ile ilgili aşağıdaki ifadelerden hangisi yanlıştır?", "o": ["Önleyici bir programdır.", "Çocuk koruma sadece çocuğun korunmasına yönelik önlemleri içerir.", "Hak Temelli bir anlayıştır.", "Çocuğun yaşama, gelişme, korunma ve katılım haklarını güvence altına alır.", "Kısa sürede yanıt verip müdahale edebilme imkanı sağlar."], "a": 1, "e": "Doğru cevap: Çocuk koruma sadece çocuğun korunmasına yönelik önlemleri içerir.", "kb": 1}, {"q": "Çocukların korunmasına ilişkin ilk uluslararası metin aşağıdakilerden hangisidir?", "o": ["Cenevre Bildirgesi", "BM Çocuk Haklarına Dair Sözleşme", "Avrupa Konseyi Çocukların Cinsel Sömürü ve İstismara Karşı Korunması Sözleşmesi", "İnsan Hakları Evrensel Bildirgesi", "AB Temel Haklar Bildirgesi"], "a": 0, "e": "Doğru cevap: Cenevre Bildirgesi.", "kb": 1}, {"q": "Aşağıdaki davranış biçimlerinden hangisi sporda fiziksel istismar kapsamında yer almaktadır?", "o": ["Velilerden izin almadan çocuğun fotoğraflarını paylaşmak", "Öfkeli bağırmak", "Sporcuya vurmak", "Sporcuyu antrenmandan kovmak", "Akran zorbalığına müsaade etmek"], "a": 2, "e": "Doğru cevap: Sporcuya vurmak.", "kb": 1}, {"q": "Aşağıdaki davranış biçimlerinden hangisi ihmalden kaynaklanan istismar türüne girmektedir?", "o": ["Uygunsuz herhangi bir temas", "Sporcuyu küçük düşürmek", "Takımın başarısızlığını belirli sporcuya yüklemek", "Uygun olmayan ekipmanlarla antrenman yaptırmak", "Bir ekipman veya cisim fırlatmak"], "a": 3, "e": "Doğru cevap: Uygun olmayan ekipmanlarla antrenman yaptırmak.", "kb": 1}, {"q": "Aşağıdakilerden hangisi sporda duygusal istismar davranışları arasında yer almamaktadır?", "o": ["Çocuğu küçük düşürmek", "Lakap takmak", "Olumsuz sorular ve olumsuz iletişim dili kullanmak", "Çocuğa değersiz olduğunu hissettirmek", "Yolculuklarda ve konaklamalarda yetersiz denetim"], "a": 4, "e": "Doğru cevap: Yolculuklarda ve konaklamalarda yetersiz denetim.", "kb": 1}, {"q": "Aşağıdakilerinden hangisi çocuk haklarında hak temelli yaklaşımın özelliklerinden biri değildir?", "o": ["Çocuklara eşit muamelede bulunmama", "Ayrımcılık gözetmeme", "Çocuğun yüksek yararı", "Hesap verilebilirlik", "Katılım"], "a": 0, "e": "Doğru cevap: Çocuklara eşit muamelede bulunmama.", "kb": 1}, {"q": "“Sporcunun antrenman esnasında sahada unutulan bir malzeme nedeniyle sakatlanması” aşağıdaki istismar türlerinden hangisine bir örnektir?", "o": ["Ekonomik istismar", "Duygusal istismar", "Cinsel istismar", "İhmal", "Fiziksel istismar"], "a": 3, "e": "Doğru cevap: İhmal.", "kb": 1}, {"q": "Avrupa Konseyi tarafından imzalanan hangi antlaşmada spor alanlarında çocuklarla çalışacak kişilerin işe alımına, eğitimine ve bilinçlendirilmesine yönelik maddeler yer almaktadır?", "o": ["Cenevre Bildirgesi", "BM Çocuk Hakları Sözleşmesi", "Avrupa Konseyi Çocukların Cinsel Sömürü ve İstismara Karşı Korunması Sözleşmesi", "BM İnsan Hakları Evrensel Bildirgesi", "Avrupa Birliği Temel Haklar Bildirgesi"], "a": 2, "e": "Doğru cevap: Avrupa Konseyi Çocukların Cinsel Sömürü ve İstismara Karşı Korunması Sözleşmesi.", "kb": 1}], "tf": []}], "past": [], "source": "Kitap: AÖF / GSB Antrenör Eğitimi kitabı"}, {"id": "sy", "title": "Spor Yönetimi", "short": "Yönetim", "icon": "🏛️", "color": "#2F8F83", "units": [{"id": "sy1", "title": "Yönetim ve Yönetim Yaklaşımları", "cards": [{"title": "Yönetim nedir?", "points": ["Yönetim; belirlenen **amaçlara**, insanların çabalarını birleştirip düzenleyerek **etkin ve verimli** biçimde ulaşma sürecidir.", "Yönetim süreci: **iş bölümü, planlama, örgütleme, yöneltme, karar verme, koordinasyon ve denetleme**.", "Kullanılan kaynaklar: **insan, para, zaman, malzeme ve yer**.", "Yönetim kavramı, insanların avlanma, barınma ve korunma için bir araya gelip lidere ihtiyaç duymasıyla doğmuştur."]}, {"title": "Bilim mi, sanat mı?", "points": ["**Bilimdir:** Sistematik bilgi kümesine ve kanıtlanmış kuram, kural ve ilkelere sahiptir; ekonomi ve hukukun yöntemlerinden yararlanır. **Sevk ve idare bilimi** de denir.", "**Sanattır:** Somut amaçları başarma, durum yaratma ve sonuçları etkileme yönleriyle sanata benzer.", "Kısaca yönetim, **hem bilim hem sanattır**."]}, {"title": "Endüstri öncesi yaklaşım", "points": ["**Milattan önceden MS 1778'e** kadar süren dönemdir.", "Sümerlerde din adamlarının kurduğu **vergi, denetleme ve raporlama** sistemleri yönetime önemli katkı sağlamıştır.", "Hükümdar buyrukları ve din kitaplarındaki ilkeler fikir verir, ama tam bilgi sunmaz."]}, {"title": "Klasik yaklaşım: Taylor", "points": ["James Watt'ın **1778**'de buhar makinesini yapmasıyla başlayan **Sanayi Devrimi**'nden 2. Dünya Savaşı'na kadar sürer; 3 alt yaklaşımı vardır.", "**Bilimsel yönetim:** Öncüsü **Frederick Taylor** (Taylorizm), Amerika'da doğmuştur.", "Taylor işi **zaman ölçümüne** dayalı standartlara bağlar; standardı aşan işçiyi **ödüllendirir**.", "Bilimsel Yönetim İlkeleri kitabı (**1911**): her işin standart zaman ve yöntemi, uzmanlaşma, planlama, teşvik edici ücret ve sürekli denetim.", "Verim arttı, ama işçileri bedensel ve ruhsal olarak yıprattığı için tepki aldı."]}, {"title": "Fayol ve Weber", "points": ["**Yönetim süreci yaklaşımı:** Öncüsü Fransız **Henri Fayol**; yönetimi kapsamlı inceleyip ilkeler koymuştur.", "Fayol'un **14 ilkesinden** bazıları: iş bölümü, yetki-sorumluluk, disiplin, **komuta birliği**, yürütme birliği, merkeziyetçilik, **kademe zinciri**, eşitlik, personelin devamlılığı, **inisiyatif**, birlik duygusu.", "**Bürokrasi yaklaşımı:** Öncüsü Alman sosyolog **Max Weber**; **katı kuralcılık** ve kişiye göre esnemeyen tarafsız kurallar.", "Bürokrasinin ilkeleri: iş bölümü, **hiyerarşik yapı**, standart geliştirme, **yeteneğe dayalı seçim**, terfi sistemi.", "**Eleştiri:** Klasik yaklaşım **insan gerçeğini görmezden gelmiş**, insana robot gibi davranmıştır."]}, {"title": "Neo-klasik yaklaşım", "points": ["Davranışsal yaklaşım da denir; **çalışan insanı** merkeze alır. **1940-1960** arasında etkili olmuştur.", "Katkı verenler: **Elton Mayo**, Fritz Roethlisberger, Douglas McGregor, **Abraham Maslow**.", "**Hawthorne Deneyleri (1924):** Western Elektrik Şirketi'nde ışık, mola ve sıcaklık gibi fiziksel iyileştirmelerin verime etkisinin **az** olduğu görülmüştür.", "Verimi asıl **inançlar, tutumlar, değerler ve gruplar** etkiler; işletme **sosyal bir sistemdir** ve en önemli öğesi **insandır**.", "Bu yaklaşımla **motivasyon, yönetime katılma ve iş doyumu** kavramları gündeme gelmiştir."]}, {"title": "Çağdaş yaklaşımlar", "points": ["4 alt yaklaşım: **modern yönetim, mükemmellik, stratejik yönetim, toplam kalite yönetimi**.", "**Sistem kuramı:** Sistem, birbirine ve çevresine bağlı parçalardan oluşan bir bütündür; sonuç kötüyse bir parçada aksaklık vardır.", "**Durumsallık kuramı:** Her duruma uyan tek bir doğru yoktur; **durum değiştikçe yönetim uygulaması da değişir**.", "**Mükemmellik yaklaşımı:** Tom Peters ve Robert Waterman, 1980'ler, \"Mükemmeli Araştırma\"; başarının **8 ortak özelliği** (harekete değer verme, müşteriyle sürekli ilişki, basit örgüt ve az yönetici, gevşek ve sıkı kontrolü birlikte yürütme vb.).", "**Toplam kalite yönetimi:** Süreçteki **herkesin** kaliteye katkısıdır; **müşteri beklentisi** ön plandadır."]}, {"title": "Stratejik yönetim", "points": ["Stratejik kavramlar 2. Dünya Savaşı'ndan sonra ortaya çıkmıştır.", "**Ticari stratejik planlama** 1960'larda, **ortak stratejik planlama** 1970'lerde, **stratejik yönetim** 1980'lerde ortaya çıkmıştır.", "Kamuda uygulamak zordur: kârlılık değil **hizmet** önceliklidir, başarıyı ölçmek zordur, **siyasi baskı** ve **bürokrasi** vardır.", "Stratejik planlamanın temel unsurları: **durum analizi**, katılımcılık, **misyon-vizyon-temel değerler**, amaç ve hedef, ölçüm kriterleri, stratejiler, **tahmini maliyet tablosu**."]}, {"title": "SWOT, misyon ve vizyon", "points": ["**SWOT** bir gelecek durum analizidir: **Güçlü** ve **zayıf** yönler örgütün içine, **fırsatlar** ve **tehditler** dış çevreye bakar.", "**Misyon:** Örgütün amacını diğerlerinden ayırır; **süreklidir**, ulaşınca bitmez; **dışa dönüktür**.", "İyi bir misyon bildirimi **kısa, açık ve çarpıcı** olur; hizmetin amacını ve alanını tanımlar.", "**Vizyon:** Örgütün düşlenen geleceğini tasarlayıp paylaşmaktır; liderleri ve iyi yöneticileri birbirinden ayırır.", "**Temel değerler:** Kurumun ilkeleri ve davranış kurallarıdır; kararlara rehberlik eder."]}], "questions": [{"q": "Saptanan amaçlara etkin ve verimli ulaşmak için insanların çabalarını birleştirip düzenleyen sürece ne ad verilir?", "o": ["Denetim", "Yönetim", "Liderlik", "Strateji", "Organizasyon"], "a": 1, "e": "Bu tanım yönetimin tanımıdır. Kitaptaki tuzak soru bunu \"strateji\" diye sorar."}, {"q": "Endüstri öncesi yönetim yaklaşımı hangi döneme karşılık gelir?", "o": ["1940-1960 arası", "1980 sonrası", "1778'den 2. Dünya Savaşı'na kadar", "Sanayi Devrimi'nden sonra", "Milattan önceden MS 1778'e kadar"], "a": 4, "e": "Endüstri öncesi dönem, buhar makinesinin yapıldığı 1778'e kadar sürer."}, {"q": "Bilimsel yönetim yaklaşımının öncüsü kimdir?", "o": ["Elton Mayo", "Max Weber", "Frederick Taylor", "Henri Fayol", "Tom Peters"], "a": 2, "e": "Bilimsel yönetime soyadından dolayı Taylorizm de denir."}, {"q": "Fayol'un yönetim ilkelerinin sayısı kaçtır?", "o": ["5", "8", "14", "12", "10"], "a": 2, "e": "Henri Fayol 14 yönetim ilkesi tanımlamıştır."}, {"q": "Kişiye göre esneklik tanımayan, katı kurallara ve hiyerarşiye dayalı yaklaşım hangisidir?", "o": ["Bilimsel yönetim", "Neo-klasik yaklaşım", "Mükemmellik yaklaşımı", "Durumsallık kuramı", "Bürokrasi yaklaşımı"], "a": 4, "e": "Max Weber'in bürokrasi yaklaşımı tarafsız kurallara uyumu temel alır."}, {"q": "Klasik yönetim yaklaşımının en çok eleştirilen yönü nedir?", "o": ["Çok esnek olması", "Müşteriyi fazla önemsemesi", "Örgüt kuramaması", "İnsan gerçeğini görmezden gel 'ler", "1960'lar"], "a": 0, "e": "1960'larda ticari, 1970'lerde ortak stratejik planlama gelişmiş; stratejik yönetim 1980'lerde ortaya çıkmıştır."}, {"q": "Yönetim ile ilgili aşağıdaki ifadelerden hangisi yanlıştır?", "o": ["Evrenseldir.", "İnsanla ilgilidir.", "İnsanın diğer kişilerle ilişkilerini inceler.", "Yaşantımızın çok az alanında yer almaktadır.", "Yönetim bilimciler, yönetimin bir otorite sistemi olduğunu belirtir."], "a": 3, "e": "Doğru cevap: Yaşantımızın çok az alanında yer almaktadır.", "kb": 1}, {"q": "Aşağıdakilerden hangisi Bürokrasi Yaklaşımı’nın özelliklerinden biridir?", "o": ["Hareket araştırmaları", "Esneklik", "İnsana saygı", "Katı kuralcılık", "Teknik üstünlük"], "a": 3, "e": "Doğru cevap: Katı kuralcılık.", "kb": 1}, {"q": "Aşağıdakilerin hangisi, insanın motive edilmesi, insan davranışları, insanın özellikleri, insanların yönetime katılması ve insanın iş doyumu gibi ana kavramları içeren yönetim yaklaşımıdır?", "o": ["Neoklasik Yönetim Yaklaşımı", "Modern Yönetim Yaklaşımı", "Stratejik Yönetim Yaklaşımı", "Toplam Kalite Yönetimi Yaklaşımı", "Klasik Yönetim Yaklaşımı"], "a": 0, "e": "Doğru cevap: Neoklasik Yönetim Yaklaşımı.", "kb": 1}, {"q": "Durumsallık Yaklaşımı ve Sistem Kuramı aşağıdakilerden hangisinin kapsamında yer alır?", "o": ["Klasik Yönetim Yaklaşımı", "Modern Yönetim Yaklaşımı", "Neoklasik Yönetim Yaklaşımı", "Toplam Kalite Yönetim Yaklaşımı", "Davranışsal Yönetim Yaklaşımı"], "a": 1, "e": "Doğru cevap: Modern Yönetim Yaklaşımı.", "kb": 1}, {"q": "Sistem Kuramı aşağıdakilerden hangisini ifade eder?", "o": ["İşletmenin üzerinde kurulmuş bölgeyi", "İşletmenin sistemli çalışmasını", "İşin belirli bir bölümünün ele alınmasını", "Bütünü oluşturan parçaların tamamının ele alınmasını", "Modern üretim araç ve gereçleri kullanılmasını"], "a": 3, "e": "Doğru cevap: Bütünü oluşturan parçaların tamamının ele alınmasını.", "kb": 1}, {"q": "İleriyi görmek ile ilgili yönetim işlevi aşağıdakilerden hangisidir ?", "o": ["Eğitim", "Program", "Planlama", "Yürütme", "Denetim"], "a": 2, "e": "Doğru cevap: Planlama.", "kb": 1}], "tf": [{"q": "Ortak bir amaca ulaşmak için yapılan iş bölümü, planlama, örgütleme, yöneltme, karar verme, koordinasyon ve denetleme eylemlerinin bütününe strateji denir.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Bu bütünün adı yönetimdir.", "tf": true}, {"q": "Endüstri öncesi yönetim yaklaşımı, milattan önceden MS 1778'e kadar süren dönemdir.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Bu dönem buhar makinesiyle sona erer.", "tf": true}, {"q": "Klasik yönetim yaklaşımı, insan gerçeğini görmezden geldiği için eleştirilmiştir.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Klasik yaklaşım insanlara robot gibi davranmıştır.", "tf": true}, {"q": "Neo-klasik yaklaşıma göre inançlar, tutumlar, değerler ve gruplar verimliliği önemli ölçüde etkiler.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Hawthorne deneylerinin vardığı sonuç budur.", "tf": true}, {"q": "SWOT analizi, iç ve dış durum analizini içeren bir stratejik yönetim tekniğidir.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "SWOT bir gelecek durum analizidir.", "tf": true}, {"q": "Durumsallık kuramı, her duruma en uygun yönetim uygulamasını bulmayı amaçlar.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Durumsallık kuramında yönetim uygulaması duruma göre değişir.", "tf": true}, {"q": "Toplam kalite yönetiminde müşteri istekleri geri plandadır; işletme ne üretirse müşteri onu almalıdır.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Toplam kalite yönetiminde müşteri beklentisi ön plandadır.", "tf": true}]}, {"id": "sy2", "title": "Spor Yönetiminin Gelişimi ve İlkeleri", "cards": [{"title": "Dünyada spor yönetimi", "points": ["Antik olimpiyatlar ve gladyatör dövüşleri gibi büyük organizasyonlar, geçmişte de spor yönetimi olduğunu gösterir.", "Avustralya, Kanada, Yeni Zelanda ve Birleşik Krallık'ta spor kulüplerinin çoğu **kâr amacı gütmez** ve **gönüllülük** esasına dayanır.", "Spor yönetimi müfredat çalışmaları **1957'de Amerika**'da başlamıştır.", "İlk spor yönetimi yüksek lisans programı **1966'da Ohio Üniversitesi**'nde açılmıştır. Alanın önemli kuruluşlarından biri **NASSM**'dir."]}, {"title": "Cumhuriyet öncesi: tekkeler", "points": ["1903 öncesinde **cirit, ata binme, çöğen (polo), okçuluk, kılıç ve güreş** ön plandaydı; spor tekkeleri branşa göre örgütlenmişti.", "İlk Osmanlı güreş tekkesi: **1358**, Orhan Gazi döneminde kurulan **Bursa Güreşçiler Tekkesi**.", "Okçuluğa **kemankeşlik** denirdi. İlk ok meydanı Bursa'da açıldı; sonra Edirne, İstanbul (**Okmeydanı**) ve Kahire'de de açıldı.", "Tekke olmayan yerlerde spor işlerini **Ahi Teşkilatı** desteklerdi.", "Her yıl düzenlenen **Kırkpınar Güreşleri**'nin masraflarını varlıklı bir **ağa** karşılardı."]}, {"title": "Tanzimat ve futbolun gelişi", "points": ["**Tanzimat (1839-1876)** ile tekkeler işlevini yitirdi; **kulüp modeli** benimsendi ve ilgi **futbola** kaydı.", "Türkiye'de futbol **1890**'da İzmir'de yaşayan **İngiliz ailelerin** kendi aralarında oynamasıyla başladı.", "İlk Türk futbolcu **Fuat Hüsnü Kayacan**, \"Black Stockings\" kulübünün kurucuları arasındadır.", "Türk kulüpleri: **Beşiktaş (1903), Galatasaray (1905), Fenerbahçe (1907)**.", "İlk lig çatısı: **1903**'te kurulan **İstanbul Futbol Birliği (İFB)**."]}, {"title": "1903-1922 ligleri", "points": ["Osmanlı yönetimi spora \"**kalabalık ürettiği**\" için düşmanca bakıyordu; Türkler futbolu gizlice oynuyordu.", "**İFB (1903-1910)** → **İFKL (1910-1914)** → **Cuma Ligi (1912'de kuruldu, 1913'te başladı)**, buna \"tepki ligi\" de denir.", "**Cuma Birliği:** 1915'te Fenerbahçe'nin Galatasaray'ı yenmesiyle iki lig arasındaki ikilik bitti.", "**Türk İdman Birliği (1919-1920)**, Beşiktaş'ın öncülüğünde kuruldu.", "Bu karmaşa **TİCİ** kurulana kadar sürdü."]}, {"title": "Cumhuriyet sonrası örgütlenme", "points": ["**TİCİ (Türkiye İdman Cemiyetleri İttifakı):** 22 Mayıs **1922**'de **özerk** olarak kuruldu; ilk resmî ve çok sporlu örgüttür. 1924 ve 1928 Olimpiyatlarına katılım sağladı.", "**TSK (Türk Spor Kurumu):** **1936**'da **yarı özerk** olarak, CHP denetiminde kuruldu; 1938'de kapatıldı.", "**BTGM (Beden Terbiyesi Genel Müdürlüğü):** **16 Temmuz 1938**, **3530 sayılı kanun**; spor yönetiminde **devlet dönemini** başlattı.", "**1986**'da adı **Gençlik ve Spor Genel Müdürlüğü (GSGM)** oldu.", "**2011**'de **Gençlik ve Spor Bakanlığı** kuruldu (638 sayılı KHK). **2018**'den beri bakanlığa bağlı birimin adı **Spor Hizmetleri Genel Müdürlüğü**'dür."]}, {"title": "Spor yönetiminin süreçleri", "points": ["**Spor yönetimi:** Spor örgütlerinin kaynaklarını en verimli ve etkili kullanması için karar alma anlayışıdır.", "**Planlama:** İleriyi görmek ve işi **önceden** kararlaştırmaktır. İlk adım **amaçları saptamaktır**.", "**Örgütleme:** İnsan, araç ve imkânları bulup amaca uygun **gruplandırmak ve görevlendirmektir**.", "**Yürütme (yöneltme):** Görevlerin yapılmasını sağlamaktır; zorlayarak değil **motive ederek** yapılır.", "**Koordinasyon:** Çabaları birleştirip zamanlamayı uyumlu hâle getirmektir. **Denetleme:** İşin doğru gidip gitmediğini kontrol edip düzeltmektir."]}, {"title": "Spor yönetiminin 8 ilkesi", "points": ["**Tarafsızlık:** Kurallar herkese aynı uygulanır. **Yeterlik:** İşi yapabilecek yeterlikte insanlar seçilir.", "**Güvence:** Kurallara uyduğu sürece çalışanın işi ve hakları garanti altındadır.", "**Denklik:** Ödeme, yapılan işe denk olur. **Eşitlik:** Denk çalışanlara eşit ödeme yapılır; yıldız oyuncu farkı bazen sorun yaratır.", "**Yetiştirme:** Sürekli hizmet içi eğitim verilir. **Güç birliği:** Takım çalışmasına uygun ortam kurulur.", "**Emek:** Emeğin karşılığı verilmezse verim düşer. Sporda bu karşılık para olabileceği gibi madalya, kupa ya da milli formayı giymek de olabilir."]}], "questions": [{"q": "Spor yönetimi müfredat programlarına ilişkin ilk çalışmalar nerede ve ne zaman başlamıştır?", "o": ["1966, İngiltere", "1987, Kanada", "1957, Amerika", "1945, Almanya", "1922, Türkiye"], "a": 2, "e": "İlk yüksek lisans programı ise 1966'da Ohio Üniversitesi'nde açılmıştır."}, {"q": "İlk Osmanlı güreş tekkesi hangisidir?", "o": ["Edirne Tekkesi", "Kahire Tekkesi", "Okmeydanı Tekkesi", "Bursa Güreşçiler Tekkesi", "Zeyrek Tekkesi"], "a": 3, "e": "Bursa Güreşçiler Tekkesi 1358'de Orhan Gazi döneminde kurulmuştur."}, {"q": "Osmanlı döneminde okçuluğa verilen ad nedir?", "o": ["Kemankeşlik", "Cirit", "Çöğen", "Pehlivanlık", "Tebdil"], "a": 0, "e": "İstanbul'daki ok meydanının adı ise Okmeydanı'dır."}, {"q": "Tekke kurulmayan yerlerdeki spor işlerini destekleyen teşkilat hangisidir?", "o": ["TİCİ", "Türk Spor Kurumu", "Lonca Meclisi", "Ahi Teşkilatı", "Enderun"], "a": 3, "e": "Bölgelerdeki gençler de vakıf gelirleriyle eğitilirdi."}, {"q": "Türkiye'de futbol nasıl başlamıştır?", "o": ["1903'te Beşiktaş'ın kurulmasıyla", "1938'de BTGM'nin kurulmasıyla", "1890'da İzmir'de yaşayan İngiliz ailelerin kendi aralarında oynamasıyla", "1923'te Ankara'da devlet eliyle", "1950'de İzmir'de Türk ailelerin oynamasıyla"], "a": 2, "e": "Kitapta yanlış seçenek olarak \"1950'de Türk aileler\" ifadesi kullanılır."}, {"q": "Türkiye Cumhuriyeti'nin ilk çok kulüplü, çok sporlu ve resmî spor örgütü hangisidir?", "o": ["Türk Spor Kurumu", "Cuma Birliği", "Beden Terbiyesi Genel Müdürlüğü", "Türkiye İdman Cemiyetleri İttifakı (TİCİ)", "İstanbul Futbol Birliği"], "a": 3, "e": "TİCİ, 22 Mayıs 1922'de özerk bir yapıda kurulmuştur."}, {"q": "1936'da yarı özerk yapıda ve CHP denetiminde kurulan spor örgütü hangisidir?", "o": ["Türk Spor Kurumu (TSK)", "GSGM", "TİCİ", "BTGM", "Spor Hizmetleri Genel Müdürlüğü"], "a": 0, "e": "TSK'nın faaliyetlerine 1938'de son verilmiştir."}, {"q": "Spor yönetiminde devlet döneminin başlangıcı sayılan örgüt hangi kanunla kurulmuştur?", "o": ["3530 sayılı kanun", "638 sayılı KHK", "7405 sayılı kanun", "5253 sayılı kanun", "6223 sayılı kanun"], "a": 0, "e": "Beden Terbiyesi Genel Müdürlüğü, 16 Temmuz 1938'de 3530 sayılı kanunla kurulmuştur."}, {"q": "Planlama sürecinde İLK yapılan iş hangisidir?", "o": ["Sonuçların denetlenmesi", "Personelin görevlendirilmesi", "Politikaların kararlaştırılması", "Bütçenin hazırlanması", "Örgütün amaçlarının saptanması"], "a": 4, "e": "Önce amaçlar saptanır, sonra işler belirlenir; en son politikalar kararlaştırılır."}, {"q": "Yönetici işleri zorlayarak değil, çalışanları motive ederek yaptırmalıdır. Bu ifade hangi süreçle ilgilidir?", "o": ["Koordinasyon", "Planlama", "Örgütleme", "Denetleme", "Yürütme (yöneltme)"], "a": 4, "e": "Yürütme, örgütlenen yapının görevlerini yapmasını sağlama sürecidir."}, {"q": "\"Kurallar her sporcu ve takım için aynı olmalı, asla taviz verilmemelidir.\" Bu ifade hangi ilkeyi anlatır?", "o": ["Tarafsızlık", "Güvence", "Yeterlik", "Denklik", "Güç birliği"], "a": 0, "e": "Tarafsızlık, kuralların tüm personele aynı uygulanmasıdır."}, {"q": "Yıldız futbolculara daha fazla ödeme yapılması hangi ilkeyle ilgili bir farklılık örneğidir?", "o": ["Tarafsızlık", "Emek", "Denklik", "Eşitlik", "Yetiştirme"], "a": 3, "e": "Eşitlik ilkesi, birbirine denk çalışanlara eşit ödeme yapılmasını ister."}, {"q": "Akademik çalışma alanı olarak incelenen spor yönetimi dünyada ilk kez aşağıdaki ülkelerden hangisinde ortaya çıkmıştır?", "o": ["İngiltere", "İtalya", "ABD", "İsviçre", "Hollanda"], "a": 2, "e": "Doğru cevap: ABD.", "kb": 1}, {"q": "Aşağıdakilerden hangisi, Türkiye’de 1922- 1936 yılları arasında faaliyet gösteren spor yönetimi dönemidir?", "o": ["BTGM Dönemi", "TİCİ Dönemi", "TSK Dönemi", "GSGM Dönemi", "BTSGM Dönemi"], "a": 1, "e": "Doğru cevap: TİCİ Dönemi.", "kb": 1}, {"q": "Spor örgüt ve organizasyonlarında belirlenen amaçları gerçekleştirmek için sporun özel şartlarında, çağdaş yönetim ilke, prensip ve süreçleri doğrultusunda insan ve maddi kaynakları en etkin, verimli ve rasyonel bir şekilde kullanarak gerçekleştirme faaliyetine ne ad verilir?", "o": ["Spor ekonomisi", "Spor endüstrisi", "Spor korsanlığı", "Spor yönetimi", "Spor iktisadı"], "a": 3, "e": "Doğru cevap: Spor yönetimi.", "kb": 1}, {"q": "Aşağıdakilerin hangisi spor yönetiminin ilkelerinden biri değildir?", "o": ["Taraflılık", "Yeterlilik", "Eşitlik", "Denklik", "Güç birliği"], "a": 0, "e": "Doğru cevap: Taraflılık.", "kb": 1}], "tf": [{"q": "Spor yönetimiyle ilgili ilk müfredat programı çalışmaları 1957'de Amerika'da başlamıştır.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "1966'da da Ohio Üniversitesi'nde ilk yüksek lisans programı açılmıştır.", "tf": true}, {"q": "Türkiye'de futbol, 1950 yılında İzmir'de yaşayan Türk ailelerin aralarında oynamasıyla başlamıştır.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Futbol 1890'da İzmir'deki İngiliz ailelerle başlamıştır.", "tf": true}, {"q": "TİCİ, 22 Mayıs 1922'de Cemiyetler Kanunu'na göre özerk yapıda kurulmuştur.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "TİCİ ilk resmî spor örgütüdür.", "tf": true}, {"q": "Örgütleme; amaçlara ulaşmak için insan, araç ve imkânların bulunup amaca uygun gruplandırılması ve görevlendirilmesidir.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Bu tanım örgütlemenin tanımıdır.", "tf": true}]}, {"id": "sy3", "title": "Spor İşletmeciliği", "cards": [{"title": "İşletme nedir?", "points": ["**İşletme:** Başkalarının ihtiyaçları için mal veya hizmet üreten birimdir. **Kendi ihtiyacı için üreten işletme sayılmaz.**", "İşletmeler ülke ekonomisinin **en küçük** birimidir.", "Üretim faktörleri: **sermaye, doğa, beşeri kapasite ve bilgi**. Günümüzde en önemlisi **bilgidir**.", "Kamu spor işletmeleri sporu yaymak için, özel olanlar ayakta kalmak için **kâr** da hedefler.", "**İşletme bilimi:** Amaca en etkin şekilde nasıl ulaşılacağını, işletmedeki sebep-sonuç ilişkileriyle inceler."]}, {"title": "İhtiyaçlar ve Maslow", "points": ["**Birincil ihtiyaçlar** doğuştandır: hava, su, gıda.", "**İkincil ihtiyaçlar** sosyaldir: arkadaşlık kurmak, birlikte olmak.", "Maslow hiyerarşisi (alttan üste): **fizyolojik → güvenlik → ait olma ve sevgi → saygı → kendini gerçekleştirme**.", "Kendini gerçekleştirme, yaratma ve kendini aşmaktır; toplumda **çok az** kişide görülür.", "**Trampa:** Fazla malı başka bir malla değiştirmektir. Yunanlıların kapalı ev ekonomisine **okinomika** denir."]}, {"title": "Satın alma ve üretim", "points": ["**Satın alma:** Hammaddeyi doğru kalite ve miktarda, uygun fiyatla ve **zamanında** almaktır.", "Satın alma tek elden yürütülürse **merkezleşme**, alt birimlere yetki verilirse **merkezleşmeme** denir.", "Satın almanın 3 şekli: **ihtiyaç duyulduğunda**, **belirli miktarda sürekli** ve **sözleşmeyle sürekli** satın alma.", "Kâr amacı gütmeyen ve kamu işletmeleri gelir-gider dengesi gözetir ve **sosyal getiri** elde eder.", "Spor hizmetlerinin **girdileri** iş gücü, malzeme, tesis ve sermayedir. **Çıktısı** sağlıklı, sosyal ve gelişmiş bireylerdir.", "**Aktif katılım:** Kişi bizzat spor yapar. **Pasif katılım:** Seyircidir, örneğin maç izler."]}, {"title": "Pazarlama", "points": ["Pazarlama, bireylerin değişen ihtiyaçlarını analiz edip onları tatmin etmeye yönelik çalışmalardır.", "Hizmet sektöründe kalitenin ölçütü, hizmeti veren **personeldir**.", "Başarısız hizmet sonrası müşterilerin olumsuz yorum yapmasına **negatif pazarlama** denir.", "Spor yöneticisi, insanların spora **ne amaçla** katıldığını bilmelidir: zaman geçirmek, sağlık, sosyalleşmek ya da profesyonellik."]}, {"title": "Finans ve muhasebe", "points": ["**Öz sermaye:** Ortakların işletmeye koyduğu değerlerdir. **Dış kaynaklı sermaye:** **Faiz** karşılığında dışarıdan alınır.", "**Sabit sermaye** uzun sürelidir: arazi, bina, makine, marka. **İşletme sermayesi** genelde **bir yılda** nakde dönen varlıklardır.", "Finansal planlama fonları **en düşük maliyetle** sağlamayı ve olası açıklara önceden tedbir almayı amaçlar.", "**Fon:** Bir işi finanse etmek için ayrılan para, tahvil, döviz ya da değerli maden portföyüdür.", "**Muhasebe:** Parayla ifade edilen işlemlerin kaydedilmesi, sınıflandırılması, raporlanması ve yorumlanmasıdır. **Birim maliyet** muhasebeyle belirlenir."]}, {"title": "Personel, halkla ilişkiler, AR-GE", "points": ["Personel yönetiminin iş hayatına yerleşmesinde en önemli rolü **Frederick Taylor** oynamıştır.", "**İç kaynaktan seçim** (terfi, rotasyon) **hızlı ve ekonomiktir**, moral yükseltir. **Dış kaynaktan seçim** yeni fikir getirir ama daha **maliyetlidir**.", "Hizmet içi eğitimin en belirgin sebebi **teknolojik gelişmelerdir**. Spor hizmetlerinin en maliyetli ve en önemli kaynağı **personeldir**.", "Halkla ilişkilerde broşür, **en az 16 sayfalık** el kitapçığı, afiş ve pankart gibi araçlar kullanılır.", "AR-GE'ye ihtiyacın 4 nedeni: **pazarla ilgili, örgütsel, sosyal ve personelle ilgili**. Araştırma çeşitleri: **genel, uygulamalı, özel alan**."]}], "questions": [{"q": "Aşağıdakilerden hangisi işletme SAYILMAZ?", "o": ["Özel spor salonu", "Belediyeye ait yüzme havuzu işletmesi", "Futbol kulübünün ürün mağazası", "Yalnızca kendi ihtiyacı için üretim yapan bir aile", "Spor malzemesi satan şirket"], "a": 3, "e": "İşletme başkalarının ihtiyaçları için üretim yapar. Kendi ihtiyacı için üretenler işletme sayılmaz."}, {"q": "Günümüzde önemi en çok artan üretim faktörü hangisidir?", "o": ["Hammadde", "Kaba iş gücü", "Bilgi", "Arazi", "Doğa"], "a": 2, "e": "Bilgiye sahip olmayan işletmeler, diğer kaynakları olsa bile başarısız olabilir."}, {"q": "Maslow'a göre arkadaşlık kurma ve insanlarla birlikte olma ihtiyacı hangi gruptadır?", "o": ["Fizyolojik ihtiyaçlar", "İkincil ihtiyaçlar", "Birincil ihtiyaçlar", "Kendini gerçekleştirme", "Güvenlik ihtiyaçları"], "a": 1, "e": "Birincil ihtiyaçlar hava, su ve gıda gibi doğuştan gelen ihtiyaçlardır."}, {"q": "Maslow hiyerarşisinin en üst basamağı hangisidir?", "o": ["Kendini gerçekleştirme", "Güvenlik", "Fizyolojik ihtiyaçlar", "Ait olma ve sevgi", "Saygı görme"], "a": 0, "e": "Kendini gerçekleştirme, yaratma ve kendini aşma ihtiyacıdır."}, {"q": "İnsanların ihtiyacından fazla ürettiği malı başka bir fazla malla değiştirmesine ne denir?", "o": ["Trampa", "Fon", "Merkezleşme", "Sponsorluk", "Okinomika"], "a": 0, "e": "Okinomika ise Yunanlıların kapalı ev ekonomisine verdikleri addır."}, {"q": "Satın alma işlevinin tek elden yürütülmesine ne ad verilir?", "o": ["Merkezleşme", "Merkezleşmeme", "Rotasyon", "Örgütleme", "Koordinasyon"], "a": 0, "e": "Alt birimlere de satın alma yetkisi verilmesine merkezleşmeme denir."}, {"q": "Futbol maçını tribünden izleyen bir kişi hangi katılım türüne örnektir?", "o": ["Profesyonel katılım", "Rekreatif katılım", "Pasif katılım", "Zorunlu katılım", "Aktif katılım"], "a": 2, "e": "Pasif katılımda kişi dinamik sürece girmez, seyirci kalır."}, {"q": "Başarısız bir hizmetten sonra müşterilerin olumsuz yorum ve öneride bulunmasına ne denir?", "o": ["Tutundurma", "Negatif pazarlama", "Sponsorluk", "Lobicilik", "Halkla ilişkiler"], "a": 1, "e": "Başarılı hizmet ise öneriler sayesinde yeni iş fırsatları doğurur."}, {"q": "İşletmenin belirli bir faiz karşılığında dışarıdan sağladığı kaynaklara ne denir?", "o": ["Öz sermaye", "Fon", "Sabit sermaye", "İşletme sermayesi", "Dış kaynaklı sermaye"], "a": 4, "e": "Dış kaynaklar kısa veya uzun süreli olabilir."}, {"q": "Üretilen hizmetin birim maliyeti hangi işlevden yararlanılarak belirlenir?", "o": ["Pazarlama", "AR-GE", "Muhasebe", "Personel", "Halkla ilişkiler"], "a": 2, "e": "Muhasebe, maliyetleri hesaplayıp kontrol eder ve yöneticilere bilgi sunar."}, {"q": "İç kaynaklardan personel seçiminin avantajı hangisidir?", "o": ["Daha hızlı ve ekonomik olması, morali yükseltmesi", "İşletmeye yeni fikirler getirmesi", "Dış kaynaktan daha uzun sürmesi", "Hiç eğitim gerektirmemesi", "Daha pahalı ama kaliteli olması"], "a": 0, "e": "Yeni fikir getirmek, dış kaynaktan seçimin avantajıdır."}, {"q": "\"Endüstride yenilikçi olarak isim yapmak ve bunu sürdürmek\" AR-GE'ye ihtiyaç duyulmasının hangi nedenidir?", "o": ["Personelle ilgili neden", "Sosyal neden", "Finansal neden", "Örgütsel neden", "Pazarla ilgili neden"], "a": 3, "e": "Rakiplere karşı yeni ürün geliştirmek ise pazarla ilgili nedendir."}, {"q": "İşletmeler aşağıdakilerden hangisini gerçekleştirir?", "o": ["Kendi ihtiyaçlarını karşılamak üzere üretim yapma", "Kamu yararı sunma", "İktisadi teoriler geliştirme", "İktisadi mal ve hizmet üretme", "Neden-sonuç ilişkisini açıklama"], "a": 3, "e": "Doğru cevap: İktisadi mal ve hizmet üretme.", "kb": 1}, {"q": "Maslow’un ihtiyaçlar hiyerarşisinin temelinde yer alan ihtiyaç aşağıdakilerden hangisidir?", "o": ["Sevme ve sevilme ihtiyacı", "Saygı görme ihtiyacı", "Kendini gerçekleştirme ihtiyacı", "Güvenlik ihtiyacı", "Temel fizyolojik ihtiyaçlar"], "a": 4, "e": "Doğru cevap: Temel fizyolojik ihtiyaçlar.", "kb": 1}, {"q": "Statü kazanma ihtiyacı, Maslow’un ihtiyaçlar hiyerarşisinde hangi ihtiyacın kapsamında yer alır?", "o": ["Aidiyet ihtiyacı", "Saygı görme ihtiyacı", "Fizyolojik ihtiyaç", "Güvenlik ihtiyacı", "Kendini gerçekleştirme ihtiyacı"], "a": 1, "e": "Doğru cevap: Saygı görme ihtiyacı.", "kb": 1}, {"q": "Aşağıdakilerden hangisi muhasebe bölümünün gerçekleştirmesi gereken faaliyetlerden biri değildir?", "o": ["Yeni pazar araştırması yapmak", "Mali durum tablolarını hazırlamak", "Yapılan işlerin kayıtlarını tutmak", "İşletme bütçesini hazırlamak", "Üretilen mal ve hizmetlerin maliyetlerini hesaplamak"], "a": 0, "e": "Doğru cevap: Yeni pazar araştırması yapmak.", "kb": 1}, {"q": "Tüketim için değil de kullanılmak üzere, uzun süreli olarak işletmeye bağlanmış varlıkların oluşturduğu sermayeye ne ad verilir?", "o": ["Değişken sermaye", "Sabit sermaye", "Marjinal sermaye", "Olağanüstü sermaye", "Esnek sermaye"], "a": 1, "e": "Doğru cevap: Sabit sermaye.", "kb": 1}, {"q": "İhtiyaç ve isteklerin değişimler yoluyla giderilip tatmin edilmesine yönelik birtakım insan faaliyetlerine ne ad verilir?", "o": ["Pazarlama", "Senyoraj", "Ar-ge", "Muhasebe", "Finans"], "a": 0, "e": "Doğru cevap: Pazarlama.", "kb": 1}, {"q": "Aşağıdaki işletme işlevlerinden hangisi, işletmenin halkın davranışlarından etkilenmesi ve halkı etkilemesi durumunu ifade eder?", "o": ["Muhasebe", "Halkla ilişkiler", "Satın alma", "Ar-ge", "Pazarlama"], "a": 1, "e": "Doğru cevap: Halkla ilişkiler.", "kb": 1}, {"q": "Bir üretim faktörü olan insan kaynağının en ekonomik yollardan sağlanması ve verimli bir biçimde çalıştırılması amacına yönelik işletme faaliyetlerinin yerine getirilmesi, aşağıdaki işletme işlevlerinden hangisini ifade eder?", "o": ["Satın alma", "Personel", "Muhasebe", "Finans", "Ar-ge"], "a": 1, "e": "Doğru cevap: Personel.", "kb": 1}, {"q": "Yeni bilgiler elde etmek ya da mevcut bilgileri ortaya çıkarmak amacıyla yapılan ve bilginin sistematik olarak toplanmasını, analizini ve yorumunu gerektiren çalışmaya ne ad verilir?", "o": ["Muhasebe", "Satın alma", "Finans", "Ar-ge", "Arbitraj"], "a": 3, "e": "Doğru cevap: Ar-ge.", "kb": 1}, {"q": "İnsanların ihtiyaçlarını karşılayan bir değerin elde edilmesine ne ad verilir?", "o": ["Pazarlama", "Üretim", "Satın alma", "Personel", "Muhasebe"], "a": 1, "e": "Doğru cevap: Üretim.", "kb": 1}], "tf": [{"q": "Kendi ihtiyaçlarını karşılamak için üretim yapan kişi ve gruplar işletme sayılmaz.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "İşletme başkalarının ihtiyacı için üretir.", "tf": true}, {"q": "Maslow'a göre birincil ihtiyaçlar, arkadaşlık kurma gibi sosyal ihtiyaçlardır.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Bunlar ikincil ihtiyaçlardır.", "tf": true}, {"q": "Hammadde ve parçaların uygun kalite, fiyat ve zamanda alınması personel işlevidir.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Bu, satın alma işlevidir.", "tf": true}, {"q": "Spor hizmetlerinin çıktısı; duygusal, ruhsal ve fiziksel yönden gelişmiş, sağlıklı ve sosyal bireylerdir.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Girdiler ise iş gücü, malzeme, tesis ve sermayedir.", "tf": true}, {"q": "İç kaynaklardan personel seçimi, dış kaynaklardan seçime göre daha uzun ve maliyetlidir.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "İç kaynaktan seçim daha hızlı ve ekonomiktir.", "tf": true}, {"q": "AR-GE, üretimi düzenlemek için modern araç-gereç alımından sorumludur.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "AR-GE yeni bilgi ve ürün geliştirme çalışmasıdır.", "tf": true}]}, {"id": "sy4", "title": "Sporda Liderlik", "cards": [{"title": "Lider ve liderlik", "points": ["**Platon**'a göre liderde 4 özellik bulunmalıdır: **akıl, cesaret, öz denetim ve tarafsızlık**. **Aristo**'ya göre lider **bilge** olmalıdır.", "\"Lider\" kelimesi, \"yol göstermek\" anlamındaki **leden** kelimesinden gelir.", "1940'lardan sonra yapılan araştırmalar, **demokratik** liderlerin daha etkin olduğunu göstermiştir. 1980'lerde **durum faktörü** de hesaba katılmaya başlanmıştır.", "**Liderlik**, ekibi hedefe doğru etkileme ve ona ivme kazandırmadır; **sosyal bir olgudur** ve sürekli yenilenir.", "Spor yöneticisini diğer yöneticilerden ayıran en önemli unsur, **toplumu etkilemesidir**."]}, {"title": "Liderde olması gerekenler", "points": ["**Etkin dinleme:** Her üyeyi tek tek dinleyip anlamak ve bunu ona hissettirmektir; bağlılığı artırır.", "**Problem çözme:** Lider kendini bir **tamirci** gibi görür ve her parçadaki sorunu ayrı ayrı çözer.", "**Empati:** Kendini sporcunun yerine koymaktır. **Takdir:** Patron gibi değil, destekleyen biri gibi davranmaktır.", "**Şahsi bütünlük:** Sözleri ve davranışları açık, tutarlı ve uyumludur.", "Disiplin, analiz, iletişim ve **vizyon sahibi olmak** da liderde bulunması gereken özelliklerdir."]}, {"title": "Lider mi, yönetici mi?", "points": ["Yöneticilik bir **meslektir**, liderlik bir **davranış biçimidir**.", "Yönetim **görev** meselelerine, liderlik **insani** meselelere odaklanır.", "Yönetici **sürdürür**, lider **geliştirir**. Yönetici **kontrol eder**, lider **güven verir**.", "Yönetici **nasıl ve ne zaman** sorularını sorar, lider **ne ve niçin** sorularını.", "Yönetici **statükoyu kabul eder**, lider ona **meydan okur**. Yönetici işi doğru yapar, lider **doğru işi** yapar."]}, {"title": "Liderlik tarzları – 1", "points": ["**Otokratik:** Görev odaklıdır, **tek başına** karar verir. Karar hızlıdır, ama güven ve yaratıcılık azalır.", "**Demokratik (katılımcı):** Ekibin görüşünü alır. Kararlar daha doğru olur ve **bağlılık artar**, ama karar verme **gecikir**.", "**Liberal:** Hedefleri ekip belirler, lider yalnızca ortamı hazırlar. Sadece **uzman ekiplerde** işe yarar; aksi hâlde **anarşi** doğabilir.", "**Dönüşümcü:** Değişim ve reform odaklıdır; hataları gelişim fırsatı olarak görür.", "Dönüşümün 4 faktörü: **idealize edilmiş etki, ilham verici motivasyon, entelektüel uyarım, bireysel ilgi**."]}, {"title": "Liderlik tarzları – 2", "points": ["**Vizyoner:** Ekibe **yönü** gösterir ama **nasıl** gideceğini göstermez; risk almasına izin verir.", "**Karizmatik:** Kitleleri sorgusuz sualsiz peşinden sürükler. Bu kavramdan ilk bahseden **Max Weber**'dir.", "**Durumsal:** Sabit bir tekniği yoktur; duruma göre yöntemini değiştirir ve **sürekli kontrol** gerektirir.", "**Stratejik:** Özü 3 sorudadır: \"**Ne oluyor? Ne olmuyor? Eylemi nasıl etkileyebilirim?**\""]}], "questions": [{"q": "Platon'a göre liderde bulunması gereken 4 özellik hangi seçenekte doğru verilmiştir?", "o": ["Disiplin, empati, vizyon, takdir", "Akıl, cesaret, öz denetim, tarafsızlık", "Bilgelik, zenginlik, güç, karizma", "Dürüstlük, sabır, sevgi, öfke", "Hitabet, ikna, cesaret, servet"], "a": 1, "e": "Aristo ise liderlerin bilge kişiler olması gerektiğini savunmuştur."}, {"q": "\"Lider\" kelimesinin kökeni olan \"leden\" ne anlama gelir?", "o": ["Yönetmek", "Savaşmak", "Seyahat etmek veya yol göstermek", "Seçilmek", "Emir vermek"], "a": 2, "e": "Kelime İngilizcede 1300'lerde kullanılmaya başlanmıştır."}, {"q": "Spor yöneticilerini diğer yöneticilerden ayıran en önemli unsur nedir?", "o": ["Teknik bilgileri", "Kendilerini yönlendirmeleri", "Hukuk eğitimleri", "Daha çok maaş almaları", "Toplumu etkilemeleri"], "a": 4, "e": "Bu yüzden spor yöneticileri liderlik özelliği taşımalıdır."}, {"q": "Liderin ekibe örnek olacak şekilde davranış ve sözlerinde açık, tutarlı ve uyumlu olması hangi özelliktir?", "o": ["Etkin dinleme", "Analiz yeteneği", "Takdir", "Empati", "Şahsi bütünlük"], "a": 4, "e": "Kitapta yanlış seçenek olarak \"etkin dinleme\" kullanılır."}, {"q": "Liderin kendini tamirci gibi görüp her parçadaki sorunu ayrı ayrı çözmesi hangi yetenekle ilgilidir?", "o": ["İletişim yeteneği", "Disiplin", "Vizyon sahibi olma", "Takdir", "Problem çözme yeteneği"], "a": 4, "e": "Problem çözen lider sorunları önceden görür ve zor dönemlerde vazgeçmez."}, {"q": "Aşağıdakilerden hangisi YÖNETİCİYE ait bir özelliktir?", "o": ["Ne ve niçin sorularını sorar", "Uzun dönemli bakış açısına sahiptir", "Risk alır", "Statükoyu kabul eder", "Güven verir"], "a": 3, "e": "Lider statükoya meydan okur, yönetici ise kabul eder."}, {"q": "Ekibin görüşlerini alan; kararları daha doğru olan ama karar verme süreci gecikebilen liderlik tarzı hangisidir?", "o": ["Vizyoner liderlik", "Karizmatik liderlik", "Liberal liderlik", "Otokratik liderlik", "Demokratik liderlik"], "a": 4, "e": "Fikri önemsenen üyeler, karara daha çok bağlılık gösterir."}, {"q": "Hedef ve planları ekip üyelerinin belirlediği, liderin yalnızca ortamı hazırladığı tarz hangisidir?", "o": ["Liberal liderlik", "Otokratik liderlik", "Stratejik liderlik", "Durumsal liderlik", "Demokratik liderlik"], "a": 0, "e": "Liberal liderlik, ekibin eğitim düzeyi yüksek değilse anarşiye yol açabilir."}, {"q": "Ekibin yaratıcılığı için onları problem çözmeye teşvik etmek, dönüşümcü liderliğin hangi faktörüdür?", "o": ["İlham verici motivasyon", "İdealize edilmiş etki", "Karizma", "Entelektüel uyarım", "Bireysel ilgi"], "a": 3, "e": "Diğer faktörler idealize edilmiş etki, ilham verici motivasyon ve bireysel ilgidir."}, {"q": "Ekibe hangi yöne gideceğini gösteren, ama nasıl gideceğini göstermeyip risk almasına izin veren lider hangisidir?", "o": ["Vizyoner lider", "Durumsal lider", "Otokratik lider", "Stratejik lider", "Liberal lider"], "a": 0, "e": "Vizyoner lider, yapılan işin büyük amaca nasıl hizmet ettiğini sürekli hatırlatır."}, {"q": "Karizmatik liderlikten ilk bahseden kişi kimdir?", "o": ["Platon", "Elton Mayo", "Abraham Maslow", "Henri Fayol", "Max Weber"], "a": 4, "e": "Weber aynı zamanda bürokrasi yaklaşımının da öncüsüdür."}, {"q": "\"Ne oluyor? Ne olmuyor? Eylemi nasıl etkileyebilirim?\" soruları hangi liderlik tarzının özüdür?", "o": ["Durumsal liderlik", "Stratejik liderlik", "Dönüşümcü liderlik", "Demokratik liderlik", "Vizyoner liderlik"], "a": 1, "e": "Stratejik lider, örgütü geleceğe hazırlar ve kalıcı değişim sağlar."}, {"q": "Liderlik ile ilgili aşağıdaki ifadelerden hangisi yanlıştır?", "o": ["Soyut bir kavramdır.", "Sosyal bir olgudur.", "İnsanları etkileme ve kontrol etme sanatıdır.", "Değişik olay ve koşullara göre farklı içerikler gerektirir.", "Değişimlerden etkilenmez."], "a": 4, "e": "Doğru cevap: Değişimlerden etkilenmez.", "kb": 1}, {"q": "Aşağıdakilerden hangisi liderde bulunması gereken özelliklerden biri değildir?", "o": ["Kriz yönetiminde hızlı ve negatif tutum sergilemek", "Risk ve sorumluluk üstlenmekten kaçınmamak", "Enerjik bir yapıya sahip olmak", "Güçlü iletişim becerisine sahip olmak", "Ahlaklı ve inançlı olmak"], "a": 0, "e": "Doğru cevap: Kriz yönetiminde hızlı ve negatif tutum sergilemek.", "kb": 1}, {"q": "İnsanların kalplerine hitap ederek ve onların hislerini anlayarak görevlerini yapmalarına destek olması bir liderin aşağıdaki özelliklerinden hangisini ifade eder?", "o": ["Problem çözme yeteneği", "İnsanlarda derinden temas sağlama yeteneği", "Güvenilir olma", "Etkin dinleme", "Empati"], "a": 1, "e": "Doğru cevap: İnsanlarda derinden temas sağlama yeteneği.", "kb": 1}, {"q": "Spor liderinin rakip oyunculara ilişkin “empati becerisini” kullanması, başarı açısından aşağıdakilerden hangisini sağlar?", "o": ["Kondisyonun artmasını", "Teknik üstünlüğün artmasını", "Sakatlıklardan korunmayı", "Rakibin nasıl davranacağını tahmin etmeyi", "Psikolojik üstünlüğü"], "a": 3, "e": "Doğru cevap: Rakibin nasıl davranacağını tahmin etmeyi.", "kb": 1}, {"q": "Aşağıdakilerden hangisi liderliğin sağladığı davranışlardan biri değildir?", "o": ["Bir iş kültürü yerleştirmek", "Gelişme için fırsat oluşturmak", "Arbitraj oranını belirlemek", "Geniş kapsamlı bir vizyon oluşturmak", "Başkalarını mücadeleye davet etmek"], "a": 2, "e": "Doğru cevap: Arbitraj oranını belirlemek.", "kb": 1}, {"q": "Yönetici ve lider arasındaki farklar ile ilgili aşağıdaki ifadelerden hangisi yanlıştır?", "o": ["Yönetici idarecidir, lider yenilikçidir.", "Yönetici taklit eder, lider orjinaldir.", "Yönetici sistem ve yapı üzerine odaklanır, lider insanlara odaklanır.", "Yönetici sürdürür, lider geliştirir.", "Yönetici risk alır, lider garanticidir."], "a": 4, "e": "Doğru cevap: Yönetici risk alır, lider garanticidir.", "kb": 1}, {"q": "Martin Luther King ve Mahatma Gandi hangi tarz liderliğin prototipleridir?", "o": ["Karizmatik", "Otokratik", "Dönüşümcü", "Liberal", "Vizyoner"], "a": 0, "e": "Doğru cevap: Karizmatik.", "kb": 1}, {"q": "Aşırı disiplinli bir liderlik tarzı olan otokratik liderliğin sporcular üzerindeki etkisi aşağıdakilerden hangisidir?", "o": ["Çatışma ve bölünmeler", "Sevgi, saygı", "Spor liderine güven", "Vizyon birliği", "Üst düzeyde işbirliği"], "a": 0, "e": "Doğru cevap: Çatışma ve bölünmeler.", "kb": 1}, {"q": "Liderlikte durumsallık kuramını ilk kez kullanan kişi aşağıdakilerden hangisidir?", "o": ["Ricardo", "Friedman", "Fiedler", "Weber", "Taylor"], "a": 2, "e": "Doğru cevap: Fiedler.", "kb": 1}, {"q": "Sadece eğitim seviyesi yüksek, kurumsal yapılarının, uzmanlık düzeylerinin üst seviyede olduğu spor örgütleri ve elit düzeyde sporcularda uygulanmasının başarılı sonuçlar getirebileceği liderlik tarzı aşağıdakilerden hangisidir?", "o": ["Durumsal", "Liberal", "Dönüşümcü", "Stratejik", "Demokratik"], "a": 1, "e": "Doğru cevap: Liberal.", "kb": 1}], "tf": [{"q": "Liderlik sosyal bir olgudur ve değişimlerden etkilenerek sürekli yenilenir.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Liderlik bir sosyal olgudur.", "tf": true}, {"q": "Spor yöneticilerini diğer yöneticilerden ayıran en önemli unsur, toplumu etkilemeleridir.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Bu nedenle spor yöneticileri liderlik özelliği taşımalıdır.", "tf": true}, {"q": "Liderin ekibe örnek olması ve tutarlı davranması etkin dinleme özelliğiyle ilgilidir.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Bu özellik şahsi bütünlüktür.", "tf": true}, {"q": "Yöneticilik bir meslek, liderlik ise bir davranış biçimi olarak tanımlanır.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Lider ile yönetici arasındaki temel fark budur.", "tf": true}, {"q": "Otokratik lider karar verirken tüm ekibin düşüncelerini sorar ve ortak karar hedefler.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Bu, demokratik liderin özelliğidir.", "tf": true}, {"q": "Liberal liderlikte bireysel başarının öne çıkması, takım başarısını azaltabilir.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Bu durum liberal liderliğin dezavantajıdır.", "tf": true}, {"q": "Karizmatik liderlikten ilk bahseden kişi Max Weber'dir.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Max Weber hem bürokrasinin hem karizmatik liderlik kavramının öncüsüdür.", "tf": true}, {"q": "Durumsal liderler sabit bir tekniğe bağlı olarak liderlik yaparlar.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Durumsal lider, duruma göre değişken teknikler kullanır.", "tf": true}]}, {"id": "sy5", "title": "İletişim ve Halkla İlişkiler", "cards": [{"title": "Halkla ilişkilerin tarihi", "points": ["İlk örnekler Antik Yunan ve Roma'ya dayanır. **Büyük İskender**'in Persleri yendikten sonra yerel kıyafetle halkın karşısına çıkması bunlardan biridir.", "Mesleki anlamdaki ilk çalışma **1897**'de **Michigan Üniversitesi**'nde açılan halkla ilişkiler ofisidir.", "Modern halkla ilişkilerin öncüsü **Edward Bernays**'tir; propaganda ile psikolojiyi birleştirmiştir.", "2. Dünya Savaşı sırasında **OWI (Savaş Bilgilendirme Ofisi)** kurulmuştur.", "Newsom'un 4 dönemi: **başlangıç (1600-1799), cevaplama (1800-1899), planlama/önleme (1900-1939), profesyonellik (1940'tan günümüze)**."]}, {"title": "Türkiye'de ve kavram olarak", "points": ["Osmanlı'da açık divan, cami duyuruları ve padişahın **tebdil-i kıyafet**le halkın arasına karışması halkla ilişkiler örnekleridir.", "Atatürk'ün Milli Mücadele'yi halka anlatmak için çıkardığı gazete **İrade-i Milliye**'dir (**14 Eylül 1919, Sivas**).", "**Halkla ilişkiler:** Kurumun hedef kitlesiyle etkileşim kurarak olumlu algı ve güven oluşturup bunu sürdürmesidir.", "**İletişim**, halkla ilişkilerin **temelidir**."]}, {"title": "Faaliyet alanları ve stratejiler", "points": ["**Kulüpler arası iletişim:** Rakip takımlarla müsabaka ve ortak etkinlikler düzenlemektir.", "**Lobicilik:** Yasama kademelerini kurumun çıkarı doğrultusunda etkilemektir. **Sponsorluk:** Karşılıklı fayda için yapılan ayni ya da nakdi destek anlaşmasıdır.", "**Kurumsal kimlik:** Kulübün adı, renkleri, logosu ve sloganıdır. **Kriz yönetimi:** Olağanüstü durumlarda açık ve doğru mesajlar vermektir.", "**Proaktif strateji** kurumun **güçlü** yanlarına dayanır, uzun vadelidir ve iletişimin aşağıdan yukarıya akmasına izin verir.", "**Reaktif strateji** kurumun **zayıf** yanlarını telafi etmeye çalışır; savunmacıdır ve daha karmaşık bir süreçtir.", "Duyurum planının adımları: ihtiyaç oluşur → medya kaynakları belirlenir → hedef ve yöntem seçilir → duyurum yapılır → sonuçlar değerlendirilir."]}, {"title": "İletişim ve engelleri", "points": ["Yüz yüze iletişimdeki etki oranları: **beden dili %55, ses tonu %38, sözler %7**.", "**Fiziksel ve teknik engeller:** Gürültü, dil ve araç sorunlarıdır. Teknik engele **entropi** denir ve temel nedeni **gürültüdür**. Etkisi **kısa sürelidir**.", "**Psikososyal engeller:** Önyargılar, algı farklılıkları ve dinleme yetersizliği gibi engellerdir. **Daha etkilidir ve daha geç giderilir**.", "**Örgütsel engeller:** Hiyerarşi, statü farkı, aşırı bilgi yüklemesi ve zaman baskısı gibi engellerdir.", "4 temel iletişim becerisi: **okuma, yazma, konuşma, dinleme**."]}, {"title": "Dinleme", "points": ["Dinleme, duyulan bir sözü anlama ve yorumlama sürecidir ve **duyma** ile başlar.", "**Etkin dinleme:** Karşındakini **yargılamadan**, **sözünü kesmeden** ve **göz teması** kurarak dinlemektir. Etkin dinleme **aktif** bir süreçtir.", "**Ayırt edici dinleme:** Gürültülü maçta takım arkadaşının sesini seçebilmektir. **Estetik dinleme:** Zevk almak için dinlemektir.", "**Eleştirel dinleme:** Anlamak için değil, **puan vermek ve yargılamak** için dinlemektir. **Empatik dinleme:** Karşındakinin duygularını anlamak için dinlemektir.", "Maç sırasında yapılması gereken bir uyarı **sahada** verilmelidir; maç sonuna bırakılmamalıdır. Müsabaka öncesi konuşmalar **kısa** tutulmalıdır."]}, {"title": "İletişim araçları ve medya", "points": ["Kulüplerin kullandığı 4 araç grubu: **yazılı, sözlü, görsel-işitsel ve sosyal medya**.", "Sınav tuzağı: Soru \"**Sosyal medya**\" hangi araca örnektir diye sorarsa cevap **görsel-işitsel araçlardır**. \"**Video paylaşım siteleri**\" hangi araca örnektir diye sorarsa cevap **sosyal medya araçlarıdır**.", "Türkiye'deki ilk canlı spor yayını: **1971**, İzmir, **Karşıyaka-İstanbulspor** maçı, TRT.", "**Spor medya okuryazarlığı:** Spor içeriklerini anlamak, yorumlamak ve eleştirel bakışla değerlendirmektir; okuma-yazma bilmek **yetmez**.", "Okuryazarlığın 5 becerisi: **erişim, anlama, analiz, değerlendirme ve üretim**."]}], "questions": [{"q": "Halkla ilişkilerin mesleki anlamdaki ilk çalışması hangisidir?", "o": ["1941'de OWI'nin kurulması", "1948'de İngiltere'de enstitü kurulması", "1919'da İrade-i Milliye'nin çıkarılması", "1897'de Michigan Üniversitesi'nde halkla ilişkiler ofisinin açılması", "1971'de ilk canlı spor yayını"], "a": 3, "e": "1904'te Wisconsin Üniversitesi'nde bir basın bürosu kurulmuştur."}, {"q": "Amerika'da modern halkla ilişkilerin öncüsü kabul edilen kişi kimdir?", "o": ["Henri Fayol", "Tom Peters", "Max Weber", "Edward Bernays", "Frederick Taylor"], "a": 3, "e": "Bernays, propaganda ile psikolojiyi birleştirerek alanın bilimsel temellerini atmıştır."}, {"q": "Newsom'a göre 1900-1939 yılları halkla ilişkilerin hangi dönemidir?", "o": ["Propaganda dönemi", "Başlangıç dönemi", "Profesyonellik dönemi", "Cevaplama dönemi", "Planlama/önleme dönemi"], "a": 4, "e": "Halkla ilişkiler bu dönemde bir yönetim fonksiyonu olarak ortaya çıkmıştır."}, {"q": "Atatürk'ün Milli Mücadele bilgilerini halka aktarmak için 14 Eylül 1919'da Sivas'ta çıkardığı gazete hangisidir?", "o": ["Takvim-i Vekayi", "Cumhuriyet", "İrade-i Milliye", "Tasvir-i Efkâr", "Hâkimiyet-i Milliye"], "a": 2, "e": "İrade-i Milliye, kamuoyu oluşturma amacıyla çıkarılmıştır."}, {"q": "Kurumun zayıf yönlerini telafi etmeye yönelik, savunmacı iletişim stratejisi hangisidir?", "o": ["Lobicilik", "Kurumsal kimlik", "Reaktif strateji", "Etkinlik yönetimi", "Proaktif strateji"], "a": 2, "e": "Proaktif strateji ise kurumun güçlü yanlarına dayanır ve uzun vadelidir."}, {"q": "Kurumun kendi çıkarı doğrultusunda yasama kademelerini etkilemesine ne denir?", "o": ["Lobicilik", "Kamusal ilişkiler", "Danışmanlık", "Metin yazımı", "Sponsorluk"], "a": 0, "e": "Lobicilik, halkla ilişkilerin faaliyet alanlarından biridir."}, {"q": "Yüz yüze iletişimde en fazla etkiye sahip unsur hangisidir?", "o": ["Ortamın sıcaklığı", "Ses tonu (%38)", "Kıyafet", "Beden dili (%55)", "Sözler (%7)"], "a": 3, "e": "Etki oranları beden dili %55, ses tonu %38, sözler %7'dir."}, {"q": "İletişimdeki teknik engellere verilen ad nedir?", "o": ["Mobbing", "Empati", "Entropi", "Önyargı", "Hiyerarşi"], "a": 2, "e": "Entropinin temel nedeni gürültüdür."}, {"q": "Diğer engellere göre daha etkili olan ve giderilmesi daha uzun süren engel türü hangisidir?", "o": ["Dil engelleri", "Psikososyal engeller", "Fiziksel engeller", "Teknik engeller", "Gürültü"], "a": 1, "e": "Fiziksel ve teknik engellerin etkisi geçici ve kısa sürelidir."}, {"q": "Sporcunun gürültülü bir salonda takım arkadaşının sesini seçebilmesi hangi dinleme türüdür?", "o": ["Empatik dinleme", "Etkili dinleme", "Eleştirel dinleme", "Ayırt edici dinleme", "Estetik dinleme"], "a": 3, "e": "Ayırt edici dinleme, sesleri ve görsel uyaranları birbirinden ayırma amacı taşır."}, {"q": "Anlamak için değil, puan vermek veya yargılamak için yapılan dinleme hangisidir?", "o": ["Estetik dinleme", "Etkin dinleme", "Eleştirel dinleme", "Ayırt edici dinleme", "Empatik dinleme"], "a": 2, "e": "Empatik dinleme ise yargıdan kaçınarak karşıdakinin duygularını anlamaya çalışır."}, {"q": "Sınavda \"Sosyal medya, kulüplerin kullandığı hangi halkla ilişkiler aracına örnektir?\" sorusunun cevabı hangisidir?", "o": ["Sosyal medya araçları", "Sözlü araçlar", "Yazılı araçlar", "Görsel ve işitsel araçlar", "Basılı araçlar"], "a": 3, "e": "Kitabın uyarısına göre \"video paylaşım siteleri\" sorulursa cevap sosyal medya araçlarıdır."}, {"q": "Türk televizyon tarihindeki ilk canlı spor yayını hangisidir?", "o": ["1980'de yayınlanan bir milli takım maçı", "1971'de yayınlanan bir güreş müsabakası", "1968'de yayınlanan Fenerbahçe-Galatasaray maçı", "1976'da yayınlanan Olimpiyat açılışı", "1971'de TRT'de yayınlanan Karşıyaka-İstanbulspor maçı"], "a": 4, "e": "Maç İzmir'de oynanmıştır."}, {"q": "------- , enformasyon, ikna ve uyum aracılığıyla; organizasyonlar, ün, gelişim eğilimleri ya da örgütlenme için kamunun desteğini kazanma denemesidir.\nYukarıdaki cümlede boş bırakılan yeri aşağıdakilerden hangisi doğru şekilde tamamlar?", "o": ["Pazarlama", "Strateji", "Halkla ilişkiler", "Medya", "İtibar yönetimi"], "a": 2, "e": "Doğru cevap: Halkla ilişkiler.", "kb": 1}, {"q": "Spor ortamlarında yetenek, beceri, duygu ve düşüncelerin oyun aracılığı ile anlamlandırma ve izleyicilere aktarma sürecine ne ad verilir?", "o": ["Optimizasyon", "Kurumsallaşma", "Kriz yönetimi", "İletişim", "Sentezleme"], "a": 3, "e": "Doğru cevap: İletişim.", "kb": 1}, {"q": "Aşağıdakilerden hangisi sporda başarılı bir duyurum programı yapılması için duyurum planında yer alması gereken temel unsurlardan biri değildir?", "o": ["Duyurum ihtiyacının tanımlanması", "Uygun medya kaynaklarının belirlenmesi", "Hedeflenen ", "Medya okuryazarlığı", "Web tasarımı", "Digital gelişim"], "a": 2, "e": "Doğru cevap: Medya okuryazarlığı.", "kb": 1}, {"q": "Aşağıdakilerden hangisi spor medya okuryazarlığının özelliklerinden biri değildir?", "o": ["Konsantrasyon sağlaması", "Algılanan yeterliliği artırabilmesi", "Fiziksel aktiviteye karşı olumlu tutum geliştirebilmesi", "Fiziksel aktiviteler için daha fazla çabayı desteklemesi", "Dışsal motivasyonu ortadan kaldırması"], "a": 4, "e": "Doğru cevap: Dışsal motivasyonu ortadan kaldırması.", "kb": 1}], "tf": [{"q": "Halkla ilişkilerin mesleki anlamdaki ilk çalışmaları, 1897'de Michigan Üniversitesi'nde ofis açılmasıyla başlamıştır.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Bu bilgi kitapta aynen geçer.", "tf": true}, {"q": "Edward Bernays, Amerika'da modern halkla ilişkilerin öncüsü kabul edilmektedir.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Bernays propaganda ile psikolojiyi birleştirmiştir.", "tf": true}, {"q": "Rakip takımlarla iletişim kurmak ve ortak sosyal etkinlik düzenlemek halkla ilişkilerin faaliyet alanlarından biri değildir.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Bu faaliyet, kulüpler arası iletişim alanına girer.", "tf": true}, {"q": "Proaktif strateji kurumun güçlü taraflarını, reaktif strateji ise zayıf yönlerini ele alır.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "İki strateji arasındaki temel fark budur.", "tf": true}, {"q": "Gürültü ve dil engelleri gibi iletişim kanallarını etkileyen engeller psikososyal engellerdir.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Bunlar fiziksel ve teknik engellerdir.", "tf": true}, {"q": "Etkin dinleme pasif bir süreçtir.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Etkin dinleme aktif bir süreçtir.", "tf": true}, {"q": "Eleştirel dinleme, anlamak için değil puan vermek, değerlendirmek veya yargılamak için yapılır.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Eleştirel dinlemenin tanımı budur.", "tf": true}, {"q": "Spor medya okuryazarı olabilmek için okuma ve yazma bilmek yeterlidir.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Medyadan edinilen bilgiyi düzenleyip yorumlayabilmek gerekir.", "tf": true}]}, {"id": "sy6", "title": "Spor Hukuku", "cards": [{"title": "Toplumsal düzen kuralları", "points": ["Birey, toplumun en küçük birimi olan **ailede** yer alır. Kurduğu geçici ve sürekli ilişkilere **toplumsal ilişki** denir.", "Toplumsal düzeni sağlayan 4 kural vardır: **görgü, ahlak, din ve hukuk**.", "**Görgü (muaşeret)** kurallarına uyulmazsa kınama ve ayıplama gibi **manevi** yaptırımlar uygulanır.", "**Ahlak** kurallarına uyulmazsa vicdan azabı ve dışlanma gibi **manevi** yaptırımlar uygulanır.", "**Hukuk** kurallarını diğerlerinden ayıran en önemli özellik **maddi yaptırımdır**. Hukuk, **cebir (zor) kullanma** yetkisine sahiptir."]}, {"title": "Hukukun türleri", "points": ["**Kamu hukukunda** taraflar **eşit değildir**; devlet gücünü tek taraflı kullanır.", "Kamu hukukunun dalları: **Anayasa, İdare, Ceza, Uluslararası Kamu, Mali, Yargılama, İcra-İflas ve Vergi** hukuku.", "**Özel hukukta** taraflar **eşittir**; kira ve satış sözleşmesi bu ilişkilere örnektir. Dalları: **Medeni, Borçlar, Ticaret, Devletler Özel** hukuku.", "**Karma hukuk** hem kamu hem özel hukuktan beslenir. Dalları: **İş, Fikri Mülkiyet, Bankacılık, Hava ve Çevre** hukuku."]}, {"title": "Yaptırım türleri", "points": ["**Cebri icra:** Borcun devlet eliyle zorla alınması gibi, kuralı zorla uygulatmaktır.", "**Tazminat:** Maddi ya da manevi zararın bedelini ödemektir.", "**Geçersizlik:** Bir işlemin şekil şartlarına uyulmadan yapılmasıdır; örneğin sözleşmeye kanuna aykırı bir madde eklenmesi.", "**Yokluk:** İşlemin **hiç doğmamış** sayılmasıdır; örneğin lise mezunu olmayan birinin üniversiteye kaydı.", "**Ceza** ve **iptal** de yaptırım türleridir. Montesquieu'ya göre iyi bir kanun suçu **önlemenin** yoluna bakar."]}, {"title": "Hukukun kaynakları", "points": ["Yazılı kaynaklara **mevzuat** denir: Anayasa, kanunlar, milletlerarası antlaşmalar, Cumhurbaşkanlığı kararnameleri ve yönetmelikler.", "Türkiye Cumhuriyeti Anayasası **yazılı** ve **katı (sert)** bir anayasadır. İngiltere'de anayasa yazılı **değildir**.", "Yasama yetkisi **TBMM**'ye, yürütme **Cumhurbaşkanı**'na, yargı **bağımsız mahkemelere** aittir; buna **güçler ayrılığı** denir.", "Usulüne göre yürürlüğe konmuş milletlerarası antlaşmalar **kanun hükmündedir**.", "Kanunda bir hüküm yoksa hâkim önce **örf ve âdete** bakar; o da yoksa kendisi kanun koyucu olsaydı nasıl karar verecekse öyle karar verir."]}, {"title": "Normlar hiyerarşisi", "points": ["Sıralama (en üstten): **1. Anayasa → 2. Milletlerarası antlaşmalar, kanunlar ve olağanüstü hâl kararnameleri → 3. Olağan dönem Cumhurbaşkanlığı kararnameleri → 4. Yönetmelikler**.", "Kanunla milletlerarası antlaşma çatışırsa **antlaşma** esas alınır.", "Kararname ile kanun çatışırsa **kanun** uygulanır. TBMM aynı konuda kanun çıkarırsa kararname hükümsüz kalır.", "Olağanüstü hâlde çıkarılan kararnameler **aynı gün** Meclis'e sunulur; **3 ay** içinde görüşülmezlerse yürürlükten kalkar.", "Yönetmelik çıkarmak için kanundan ayrıca yetki almaya **gerek yoktur**."]}, {"title": "Kişi, hak ve spor hukuku", "points": ["Her insanın **hak ehliyeti** vardır. **Ayırt etme gücüne** sahip, **ergin** ve **kısıtlı olmayan** kişinin **fiil ehliyeti** de vardır.", "**Spor kulüpleri tüzel kişidir**. 2022'den beri **7405 sayılı Spor Kulüpleri ve Spor Federasyonları Kanunu**'na göre kurulurlar.", "Anayasa'nın **58. ve 59. maddeleri** gençliği ve sporu düzenler.", "**Spor hukuku**, **karma hukuk** alanındadır; sportif faaliyetler ve örgütlerle ilgili kuralları sistematik olarak inceler.", "**Gerçek kişi** süjeleri: sporcu, antrenör, hakem, seyirci. **Tüzel kişi** süjeleri: kulüpler, federasyonlar, üniversiteler, Gençlik ve Spor Bakanlığı."]}], "questions": [{"q": "Hukuk kurallarını diğer toplumsal kurallardan ayıran en önemli özellik nedir?", "o": ["Uyulmadığında maddi yaptırım uygulanması", "Toplumca kabul görmeleri", "Dini kaynaklı olmaları", "Yazılı kurallar olmaları", "Vicdan azabı doğurmaları"], "a": 0, "e": "Hukuk kuralları cebir (zor) kullanma yetkisine de sahiptir."}, {"q": "\"Muaşeret kuralları\" olarak da bilinen kurallar hangileridir?", "o": ["Örf ve âdet", "Din kuralları", "Ahlak kuralları", "Hukuk kuralları", "Görgü kuralları"], "a": 4, "e": "Görgü kurallarına uyulmazsa kınama ve ayıplama gibi manevi yaptırımlar söz konusudur."}, {"q": "Aşağıdakilerden hangisi kamu hukukunun dalıdır?", "o": ["Ticaret hukuku", "Borçlar hukuku", "İş hukuku", "Medeni hukuk", "Vergi hukuku"], "a": 4, "e": "İş hukuku karma hukukun, medeni, borçlar ve ticaret hukuku özel hukukun dallarıdır."}, {"q": "Aşağıdakilerden hangisi karma hukukun dallarından biridir?", "o": ["İdare hukuku", "Medeni hukuk", "Ceza hukuku", "Anayasa hukuku", "Fikri mülkiyet hukuku"], "a": 4, "e": "Karma hukukun dalları iş, fikri mülkiyet, bankacılık, hava ve çevre hukukudur."}, {"q": "Lise mezunu olmayan bir kişinin üniversiteye kaydının hiç doğmamış sayılması hangi yaptırımdır?", "o": ["Yokluk", "Cebri icra", "İptal", "Tazminat", "Geçersizlik"], "a": 0, "e": "Kitapta yanlış seçenek olarak \"geçersizlik\" kullanılır. Yokluk, idare hukuku alanında gerçekleşir."}, {"q": "Mahkeme kararına rağmen ödenmeyen bir borcun devlet tarafından zorla alınması hangi yaptırımdır?", "o": ["Yokluk", "Ceza", "Cebri icra", "İptal", "Tazminat"], "a": 2, "e": "Cebri icra, kurala uymayan kişiye kuralı zor kullanarak uygulatmaktır."}, {"q": "Türkiye Cumhuriyeti Anayasası hangi niteliktedir?", "o": ["Yazılı ve yumuşak", "Gelenek hukukuna dayalı", "Yazısız ve katı", "Yazısız ve yumuşak", "Yazılı ve katı (sert)"], "a": 4, "e": "Değiştirilmesi zor anayasalara katı (sert) anayasa denir."}, {"q": "Normlar hiyerarşisinin en tepesinde ne bulunur?", "o": ["Milletlerarası antlaşmalar", "Cumhurbaşkanlığı kararnameleri", "Yönetmelikler", "Anayasa", "Kanunlar"], "a": 3, "e": "En altta ise yönetmelikler bulunur."}, {"q": "Bir kanun ile usulüne göre yürürlüğe konmuş bir milletlerarası antlaşma çatışırsa hangisi i değildir?", "o": ["Cebri icra", "Hükümsüzlük", "Ayıplama", "Tazminat", "Ceza"], "a": 2, "e": "Doğru cevap: Ayıplama.", "kb": 1}, {"q": "Aşağıdakilerden hangisi kanunun suç işleyen kişiye uygulanmasını öngördüğü yaptırımı ifade eder?", "o": ["Cebri icra", "Hükümsüzlük", "İptal", "Tazminat", "Ceza"], "a": 4, "e": "Doğru cevap: Ceza.", "kb": 1}, {"q": "Normlar hiyerarşisine göre Türk hukuk sisteminde aşağıdakilerden hangisi en üstte yer alır?", "o": ["Anayasa", "Kanun", "Yönetmelikler", "Milletlerarası Antlaşmalar", "Cumhurbaşkanlığı Kararnamesi"], "a": 0, "e": "Doğru cevap: Anayasa.", "kb": 1}, {"q": "Aşağıdakilerden hangisi hukukun yazılı kaynakları arasında yer almaz?", "o": ["Kanunlar", "Örf Adet", "Yönetmelik", "Milletlerarası Antlaşmalar", "Cumhurbaşkanlığı Kararnamesi"], "a": 1, "e": "Doğru cevap: Örf Adet.", "kb": 1}, {"q": "Aşağıdakilerden hangi spor hukukunun konu ve paydaşları bakımından incelendiğinde, hukuki açıdan farklı türde bir kişiliğe sahiptir?", "o": ["Spor federasyonu", "Spor kulübü", "Şirket", "Sporcu", "Tahkim Kurulu"], "a": 3, "e": "Doğru cevap: Sporcu.", "kb": 1}, {"q": "Spor hukukunun süjelerinden hangisi tüzel kişiliğe sahiptir?", "o": ["Gençlik ve Spor Bakanlığı", "Antrenörler", "Hakemler", "Sporcular", "Spor yöneticisi"], "a": 0, "e": "Doğru cevap: Gençlik ve Spor Bakanlığı.", "kb": 1}, {"q": "1982 Anayasasına göre Devlet organları arasında belirtilen ve Türk Milleti adına Bağımsız ve tarafsız mahkemelerce kullanılan yetkiyi ifade eden kavram aşağıdakilerden hangisidir?", "o": ["Yürütme", "Adalet", "Denetleme", "Yasama", "Yargı"], "a": 4, "e": "Doğru cevap: Yargı.", "kb": 1}], "tf": [{"q": "Toplumsal düzeni sağlayan kurallar görgü, ahlak, din ve hukuk kuralları olmak üzere 4 sınıfa ayrılır.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Bu dört kuralın yalnızca hukukta maddi yaptırım vardır.", "tf": true}, {"q": "Hukuk kurallarını diğer kurallardan ayıran en önemli özellik yazılı kurallar olmalarıdır.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Hukuku ayıran en önemli özellik maddi yaptırımdır.", "tf": true}, {"q": "Anayasa hukuku, idare hukuku ve ceza hukuku özel hukukun dallarıdır.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Bu üçü kamu hukukunun dallarıdır.", "tf": true}, {"q": "Karma hukuk, hem kamu hukuku hem de özel hukuktan beslenen bir hukuk dalıdır.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "İş hukuku ve fikri mülkiyet hukuku karma hukuka örnektir.", "tf": true}, {"q": "Hukuksal bir işlemin hiç doğmamış sayılması geçersizlik hükmüdür.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Bu durumun adı yokluktur.", "tf": true}, {"q": "İngiltere gibi gelenek hukukunun uygulandığı ülkelerde anayasa yazılı değildir.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Türkiye'de ise anayasa yazılıdır.", "tf": true}, {"q": "Usulüne göre yürürlüğe konmuş milletlerarası antlaşmalar kanun hükmündedir.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Bu antlaşmalar hakkında Anayasa Mahkemesi'ne başvurulamaz.", "tf": true}, {"q": "Kanunda uygulanabilir hüküm yoksa hâkim önce örf ve âdete, o da yoksa kanun koyucu olsaydı koyacağı kurala göre karar verir.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Bunlar hukukun tali (yardımcı) kaynaklarıdır.", "tf": true}, {"q": "Spor hukuku özel hukuk alanında değerlendirilir.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Spor hukuku karma hukuk alanında değerlendirilir.", "tf": true}]}], "source": "Kitap: Spor Yönetimi 1, s.80-110", "past": []}]},{"meta": {"title": "2. Kademe Antrenörlük Temel Eğitim", "version": "1.0", "note": "Konular 2. kademe kitaplarına göre düzenlenmiştir. Soru ve özetler özgün olarak yazılmıştır; resmî sınav sorusu değildir.", "exam": {"modules": 5, "questionsPerModule": 20, "passScore": 60}}, "courses": [{"id": "hab", "title": "Hareket ve Antrenman Bilimleri II", "short": "Antrenman", "icon": "⚡", "color": "#E8833A", "units": [{"id": "hab1", "title": "Yüklenme ve Dinlenme İlişkisi", "cards": [{"title": "Homeostasis ve uyum", "points": ["Organizmadaki sistemlerin fonksiyonel değerlerinin **dinamik dengesine** **homeostasis** denir.", "Antrenman (dış yük) bu dengeyi bozar → organizma **yeni bir denge** kurar. Bu tepkiye **uyum (adaptasyon)** denir.", "Uyum 3 alanda olur: **metabolik**, **yapısal** (kas hücresi, kılcal damar) ve **koordinatif-teknik** (sinir sistemi). Hepsi psikolojik uyumu da destekler.", "Yük **yetersizse** hiç uyum olmaz; **aşırı ve uzun** sürerse **sakatlık** ya da **sürantrenman** (aşırı antrenman) çıkar."]}, {"title": "Süperkompansasyon (fazlaya tamlama)", "points": ["Dinlenmeyle performansın **başlangıç düzeyinin üstüne** çıkmasına **süperkompansasyon** denir (Alman literatüründe **hiperkompenzasyon**).", "**Yakovlev (1977)**'e göre 4 evre: **yüklenme → performansta düşüş → dinlenme (geri kazanım) → süperkompansasyon**. Yeni yük gelmezse başlangıca dönülür.", "Model, Yakovlev'in hayvanlarda **kas ve karaciğer glikojeni** üzerine yaptığı araştırmaya dayanır.", "Dinlenme **çok uzun** ya da **çok kısa** olursa antrenmanın yapısı bozulur (Matvejev)."]}, {"title": "Yüklenme ögeleri", "points": ["**Yüklenme–yorgunluk–uyum ilkesi** (Doğu Bloğu'nda **Aşırı Yüklenme ilkesi**) 4 ögeyi kapsar: **sıklık, şiddet, kapsam, bileşkenlik (karmaşıklık)**.", "**Dayanıklılık** sporlarında **kapsam**, **kuvvet ve çabukluk** sporlarında **şiddet** öne çıkar.", "**Şiddet** = işin **niteliği**, zorluk derecesi (m/sn, 1TM'nin %'si, kalp atımının maksimale oranı).", "**Kapsam** = tüm **nicel** veriler; yüklenmelerin **süresi ve tekrarı** (km, kg, tekrar, dakika)."]}, {"title": "Sıklık (yoğunluk) ve dinlenim oranı", "points": ["**Sıklık** = yüklenme ile dinlenme arasındaki **zamansal ilişki**. İkiye ayrılır: **antrenman içi** ve **antrenmanlar arası** sıklık.", "Örnek: 10 sn sürat + 30 sn dinlenme → oran **1:3**.", "Antrenman düzeyi arttıkça dinlenim **kısalabilir**, ama hedeflenen enerji sisteminin dışına çıkılmamalı.", "Setler arası dinlenme 5 dk → fosfojenler tam yenilenir; 1 dk'ya inerse iş **laktik sisteme** kayar.", "Yüksek **VO2maks**, fosfojenlerin daha hızlı yenilenmesini sağlar → kısa süreli sporlarda bile **aerobik temel** gerekir."]}, {"title": "Rakamlarla kapsam ve toparlanma", "points": ["Kapsam: **göreceli kapsam** = toplam antrenman süresi (ör. 120 dk); **salt kapsam** = aktif çalışılan süre.", "Yıllık saat: **dünya düzeyi 1000+**, uluslararası **800+**, ulusal **600+**, bölgesel **400** saat.", "Dayanıklılıkta yüklenme süresi **30 dk'nın altına** düşürülmemeli.", "Kas **fosfojenleri**: **2–3/4 dk** içinde yenilenir (%90'dan fazlası ilk 3 dk'da). **Glikojen**: 10–48 saat (uzun kesintisiz antrenman sonrası **48 sa**, interval sonrası **24 sa**).", "Maksimal kuvvet için %30'un altındaki statik yük **etkisizdir**; kalp-dolaşım gelişimi için VO2maks'ın **%40**'ının üstüne çıkılmalı."]}, {"title": "Antrenman yöntemleri", "points": ["**Tekrar yöntemi:** şiddet **%80–100**, **1–6 tekrar**, kapsam düşük, **uzun (tam) dinlenme** → maksimal kuvvet ve sürat.", "**İntensiv interval (HIIT):** **>%75 VO2maks**, 6–9 tekrar; 1930'larda **Almanya**'da doğdu (Gerschler ve Reindell).", "**Ekstensiv interval:** **%50–70 VO2maks**, **20–40 tekrar**, kısa \"verimli dinlenme\" (30 sn–2,5 dk).", "**Sürekli yöntem:** **<%60 VO2maks**, **30 dk'dan uzun**, dinlenmesiz → aerobik kapasite."]}, {"title": "Alternatif (concurrent) yüklenme", "points": ["**Hickson (1980):** Aynı gün dayanıklılıktan sonra yapılan kuvvet/hipertrofi çalışması **kuvvet uyumunu engeller**.", "Haftada 2–4 gün, aerobik eşiğin altında 30–50 dk dayanıklılık kuvveti **etkilemez**; ama haftada 4'ten fazla ya da **%80 VO2maks üstü** çalışma engeller.", "**Viru (1995):** Aynı karakterli iki maksimal sprint antrenmanı üst üste → süperkompansasyon **72 saat**; sprintten sonra **farklı karakterde** (dayanıklılık) çalışma → **48 saat**.", "Sonuç: Ardışık yüklenmeler **farklı karakter ve şiddette** olursa yenilenme hızlanır."]}, {"title": "İç ve dış yük", "points": ["**Dış yük:** sporcunun yaptığı işin **objektif** ölçümü → güç çıkışı, hız, ivmelenme, zaman-hareket analizi, **GPS**, ivme ölçer.", "**İç yük:** sporcunun **fizyolojik/psikolojik** tepkisi → **kalp atım sayısı, kan laktatı, oksijen tüketimi, AZD**.", "**AZD (Algılanan Zorluk Derecesi)** **Borg (1982)** tarafından geliştirildi.", "Formül: **Antrenman yükü = Süre (hacim) × Şiddet (AZD)**."]}, {"title": "Dinlenme oksijeni ve toparlanma", "points": ["Egzersiz sonrası fazladan tüketilen oksijen: eski adıyla **oksijen borcu**, yeni adıyla **EPOC**. **Hızlı** ve **yavaş** evresi vardır.", "**Pasif dinlenme**: hiç egzersiz yok → laktat en az **1 saatte**; **aktif dinlenme** (<%60 VO2maks, jog) → en az **30 dk**'da uzaklaşır.", "**Miyoglobin** O2 depoları küçüktür ama **3–5 dk**'da yenilenir; 1 saatlik interval çalışmada oksijenin **%20**'sini sağlar.", "Toparlanmayı etkileyenler: **yaş** (25 üstü daha uzun), **cinsiyet** (kadınlar daha yavaş), **kas lifi** (hızlı lifler çabuk yorulur), esneklik, deneyim, **iklim** (soğuk → laktat artar), **psikolojik durum**."]}, {"title": "Toparlanma yöntemleri", "points": ["**Masaj**, **termoterapi** (ısı: sauna, sıcak su, ısı paketi, kızılötesi), **kriyoterapi** (soğuk: **buz banyosu, buz paketi**, buz masajı).", "**Kombine yöntem**: su içinde jog, yürüme, yan/geri koşu (su + aktif toparlanma). Aktif toparlanma + masaj (20 dk) en etkili bulundu.", "Antrenmandan **hemen sonra karbonhidrat** → kas ve karaciğer glikojeni artar. Protein/yağ eklemenin katkısı gösterilmemiş.", "Ayrıca fizik tedavi, elektrostimülasyon, uyku, psikolojik destek (yoga, gevşeme, biofeedback)."]}, {"title": "Çocuk ve gençlerde yüklenme", "points": ["Çocuklar yetişkinin **minyatürü değildir**. Planlamada en önemli gösterge: **PHV** (hızlı boy uzama dönemi) → kızlarda **11–15**, erkeklerde **12–16** yaş.", "En önemli ilke: **aşamalı artan yüklenme**. Antrenman 1 saatten sezon sonunda **1,5 saate** çıkar; haftada 2×**60 dk** → 75 → **90 dk**, sonra haftada **3** antrenman.", "Yılda en az **10 ay** antrenman önerilir; antrenman süresi maç süresinden uzun olmalı.", "Ders sırası: **ısınma → koordinasyon → sürat** → yeni teknik → çabuk kuvvet/kuvvet → eski teknik tekrarı → devamlılık → aerobik dayanıklılık → **soğuma**.", "Çocuklarda **laktik sistem yetersiz**, **ısı toleransı zayıf**, **glikojen depoları düşüktür**; sıcak/nemde süre kısaltılır."]}], "questions": [{"q": "Organizmadaki sistemlerin fonksiyonel değerlerinin dinamik denge içinde olmasına ne ad verilir?", "o": ["Katabolizma", "Adaptasyon", "Sürantrenman", "Süperkompansasyon", "Homeostasis"], "a": 4, "e": "Homeostasis dinamik dengedir; antrenman bu dengeyi bozar ve uyum başlar."}, {"q": "Dinlenme sonrası performansın başlangıç düzeyinin üzerine çıkmasına ne denir?", "o": ["Sürantrenman", "Taper", "Homeostasis", "Detraining", "Süperkompansasyon"], "a": 4, "e": "Süperkompansasyon = fazlaya tamlama; Almanlar hiperkompenzasyon da der."}, {"q": "Yakovlev'in süperkompansasyon modelinin evre sırası hangisidir?", "o": ["Yüklenme → süperkompansasyon → düşüş → dinlenme", "Yüklenme → düşüş → dinlenme → süperkompansasyon", "Dinlenme → yüklenme → düşüş → süperkompansasyon", "Yüklenme → dinlenme → düşüş → süperkompansasyon", "Düşüş → yüklenme → süperkompansasyon → dinlenme"], "a": 1, "e": "Önce yük ve performans düşüşü, sonra dinlenme ve fazlaya tamlama gelir."}, {"q": "Doğu Bloğu antrenman bilimcilerinin 'aşırı yüklenme ilkesi' dediği ilke hangisidir?", "o": ["Bireysellik ilkesi", "Süreklilik ilkesi", "Alternatif yüklenme ilkesi", "Çok yönlülük ilkesi", "Yüklenme–yorgunluk–uyum ilkesi"], "a": 4, "e": "Bileşenleri: sıklık, şiddet, kapsam ve bileşkenlik."}, {"q": "Bir antrenmandaki yüklenmelerin süresini ve tekrarını, yani tüm nicel verileri ifade eden öge hangisidir?", "o": ["Sıklık", "Kapsam", "Yoğunluk", "Şiddet", "Bileşkenlik"], "a": 1, "e": "Kapsam niceliktir; şiddet ise işin niteliği/zorluğudur."}, {"q": "10 saniyelik sürat koşusu 30 saniye dinlenmeyle yapılıyorsa yüklenme:dinlenme oranı nedir?", "o": ["1:3", "1:2", "3:1", "1:1", "2:1"], "a": 0, "e": "10 sn yük / 30 sn dinlenme
