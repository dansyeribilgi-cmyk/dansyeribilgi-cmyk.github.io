<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Antrenörlük Eğitimi</title>
<meta name="description" content="Antrenörlük 1. ve 2. Kademe sınavlarına kısa konu kartları, günlük egzersiz ve testlerle hazırlan.">
<meta name="theme-color" content="#101A33">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Antrenörlük">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: tek kolon mobil uygulama. Girişte koyu pist bandı (hero), altında kıvrımlı kesik çizgili yol üzerinde ders kartları; ders içinde Dersler/Testler/Özet sekmeleri; altta yüzen sekme çubuğu */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --ink:#13203A; --muted:#5E6A82; --line:#DCE2EC;
  --accent:#1F4FD8; --accent-ink:#FFFFFF; --lane:#FFC93C; --lane-ink:#3A2A00;
  --hero:#101A33; --hero-ink:#F2F5FB; --hero-muted:#A9B4CC; --track:#C2563A; --track-line:#F4E9E4;
  --good:#1E9E62; --good-bg:#E3F6EC; --bad:#D63B3B; --bad-bg:#FCE7E7; --lock:#C9D0DC;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Figtree",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:18px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1120; --surface:#151E33; --ink:#E9EEF8; --muted:#9AA6BF; --line:#26314A;
  --accent:#7A9CFF; --accent-ink:#0B1020; --hero:#060B17; --hero-ink:#F2F5FB; --hero-muted:#9AA6BF; --track:#A9472F; --track-line:#E9D9D2;
  --good:#3DCB88; --good-bg:#12392A; --bad:#FF6B6B; --bad-bg:#3D1B20; --lock:#34405C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1120; --surface:#151E33; --ink:#E9EEF8; --muted:#9AA6BF; --line:#26314A;
  --accent:#7A9CFF; --accent-ink:#0B1020; --hero:#060B17; --hero-ink:#F2F5FB; --hero-muted:#9AA6BF; --track:#A9472F; --track-line:#E9D9D2;
  --good:#3DCB88; --good-bg:#12392A; --bad:#FF6B6B; --bad-bg:#3D1B20; --lock:#34405C; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:600px;margin:0 auto;min-height:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.08}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:12px 10px}
.top .brand{flex:1;display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:18px;letter-spacing:-.01em;min-width:0}
.top .brand svg{width:30px;height:30px;flex:none}
.stat{display:flex;align-items:center;gap:6px;font-family:var(--f-mono);font-weight:700;font-size:14px;padding:6px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.stat svg{width:16px;height:16px}
.back{display:inline-flex;align-items:center;gap:8px;border:none;border-radius:999px;background:var(--ink);color:var(--bg);padding:10px 16px 10px 12px;font-weight:700;font-size:15px}
.back svg{width:18px;height:18px}

/* hero band */
.hero{position:relative;overflow:hidden;border-radius:26px;background:var(--hero);color:var(--hero-ink);padding:26px 22px 22px;margin-top:4px;isolation:isolate}
.hero .trk{position:absolute;right:-90px;top:-30px;width:330px;height:330px;z-index:-1;opacity:.95}
.hero .eyebrow{color:var(--lane)}
.hero h1{font-size:clamp(36px,10vw,50px);font-weight:800;letter-spacing:-.03em;margin-top:8px;max-width:9ch}
.hero p{color:var(--hero-muted);margin:12px 0 0;max-width:30ch}
.hero .by{display:inline-flex;align-items:center;gap:8px;margin-top:16px;font-size:13px;color:var(--hero-muted)}
.hero .by b{color:var(--hero-ink);font-weight:700}
.hero .by i.face{width:40px;height:40px;background:none}.hero .by i.face svg{width:100%;height:100%}
.hero .by i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:11px;background:var(--lane);color:var(--lane-ink)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:22px}
.kpi{background:color-mix(in srgb,var(--hero-ink) 8%,transparent);border:1px solid color-mix(in srgb,var(--hero-ink) 14%,transparent);border-radius:14px;padding:10px 12px;display:grid;gap:0}
.kpi b{font-family:var(--f-mono);font-size:22px;font-weight:700;color:var(--hero-ink)}
.kpi small{color:var(--hero-muted);font-size:12px}

.resume{display:flex;align-items:center;gap:14px;width:100%;text-align:left;margin-top:14px;padding:14px 16px;border-radius:var(--r);border:2px solid var(--c);background:color-mix(in srgb,var(--c) 10%,var(--surface));color:var(--ink);font:inherit;cursor:pointer}
.resume .ic{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#fff}
.resume .ic svg{width:20px;height:20px}
.resume .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.resume .tx b{font-size:17px;line-height:1.25}
.resume .tx small{color:var(--muted);font-size:13px}
.resume .tx small:first-child{color:var(--c);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:12px}
.resume .play{flex:none;width:22px;height:22px;color:var(--c)}
.resume .play svg{width:22px;height:22px}
.daily{display:flex;align-items:center;gap:14px;width:100%;text-align:left;margin-top:14px;padding:16px;border-radius:var(--r);border:none;background:linear-gradient(135deg,#1F4FD8,#6A3DE8);color:#fff;box-shadow:0 10px 24px rgba(40,60,200,.28)}
.daily .ic{flex:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.18);font-size:24px}
.daily .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.daily .tx b{font-size:18px;line-height:1.25}
.daily .tx small{opacity:.88;font-size:13px}
.daily .tx small:first-child{font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:12px;opacity:1}
.daily .play svg{width:22px;height:22px}
.daily.done{background:linear-gradient(135deg,#169C6B,#2BB673)}
.miss{margin-top:14px;padding:14px 16px;border-radius:var(--r);background:color-mix(in srgb,#F08A24 14%,var(--surface));border:1.5px solid color-mix(in srgb,#F08A24 45%,var(--line));display:flex;gap:12px;align-items:center}
.miss .e{font-size:30px;flex:none}
.miss b{display:block;font-size:16px}
.miss small{color:var(--muted);font-size:13.5px}
.dh{font-family:var(--f-display);font-size:26px;line-height:1.15;margin:6px 0 14px}
.dh2{font-size:17px;margin:22px 0 10px}
.dpk[aria-pressed="true"]{border-color:var(--c,var(--accent));box-shadow:0 0 0 2.5px var(--c,var(--accent))}
.chips{display:flex;gap:8px}
.chip{flex:1;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:10px 6px;font-weight:700;font-size:15px;display:flex;flex-direction:column;align-items:center;gap:2px}
.chip small{font-weight:500;color:var(--muted);font-size:12px}
.chip[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2.5px var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.cele .emo{font-size:64px;line-height:1;animation:pop .5s ease-out}
.cele h2{font-family:var(--f-display);font-size:30px;line-height:1.1}
.cele .stat3{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.cele .stat3 span{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 12px;font-size:14px}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
.confetti i{position:absolute;top:-24px;width:9px;height:15px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(760deg)}}
.sw{display:flex;align-items:center;gap:12px;width:100%;text-align:left}
.tg{flex:none;width:52px;height:30px;border-radius:30px;background:var(--line);position:relative;border:none;transition:background .2s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .2s}
.tg[aria-checked="true"]{background:var(--good)}
.tg[aria-checked="true"]::after{left:25px}
.login[hidden]{display:none!important}
.login{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;gap:16px;max-width:440px;margin:0 auto;padding:28px 20px calc(28px + env(safe-area-inset-bottom,0px))}
.login .lg{width:64px;height:64px}
.login h1{font-family:var(--f-display);font-size:34px;line-height:1.05;margin:0}
.login p{margin:0;color:var(--muted)}
.login input{font:inherit;font-size:16px;width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.login .gbtn{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.login .gbtn svg{width:20px;height:20px}
.login .or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.login .or::before,.login .or::after{content:"";flex:1;height:1px;background:var(--line)}
.login .lnk{background:none;border:none;color:var(--accent);font-weight:700;padding:4px;font-size:14.5px}
.login .err{color:var(--bad);font-size:14px;min-height:1em}
.login form{display:grid;gap:10px}
.inst{margin-top:14px;padding:14px 16px;border-radius:var(--r);background:var(--surface);border:1.5px dashed color-mix(in srgb,var(--accent) 45%,var(--line));display:flex;gap:12px;align-items:center}
.inst .e{font-size:28px;flex:none}
.inst b{display:block}
.inst small{color:var(--muted);font-size:13.5px}
.inst .x2{background:none;border:none;color:var(--muted);font-size:22px;padding:4px 6px;flex:none}
.kseg{display:flex;width:fit-content;gap:4px;padding:4px;border-radius:999px;background:rgba(255,255,255,.12);margin-bottom:12px;position:relative;z-index:1}
.kseg button{font:inherit;font-weight:800;font-size:13.5px;border:none;border-radius:999px;padding:7px 14px;background:transparent;color:inherit;opacity:.75;cursor:pointer}
.kseg button[aria-selected="true"]{background:#fff;color:#101A33;opacity:1}
.goal{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-top:14px}
.goal .ring{width:52px;height:52px;flex:none}
.goal .tx{flex:1;min-width:0}
.goal small{color:var(--muted);font-size:13px}
.sect{padding-block:30px 4px}
.sect h2{font-size:28px;font-weight:800;letter-spacing:-.02em}
.sect p{color:var(--muted);margin:6px 0 0}

/* journey */
.journey{position:relative;padding-block:18px 0}
.stop{position:relative;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:start;padding-block:10px}
.stop .node{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:18px;
  background:var(--surface);border:5px solid color-mix(in srgb,var(--c) 30%,var(--surface));color:var(--c);box-shadow:0 0 0 6px color-mix(in srgb,var(--c) 10%,transparent);z-index:2}
.stop.active .node{background:var(--c);color:#fff;border-color:color-mix(in srgb,var(--c) 45%,#fff);box-shadow:0 0 0 8px color-mix(in srgb,var(--c) 22%,transparent),0 0 30px color-mix(in srgb,var(--c) 50%,transparent)}
.stop.done .node{background:var(--lane);color:var(--lane-ink);border-color:color-mix(in srgb,var(--lane) 55%,#fff)}
.stop.alt .node{margin-left:36px}
.stop .info{min-width:0;display:grid;gap:6px;padding-top:6px}
.stop h3{font-size:21px;font-weight:800;letter-spacing:-.01em}
.meta{display:grid;gap:3px;color:var(--muted);font-size:14px;font-weight:600}
.meta span{display:flex;align-items:center;gap:8px}
.meta svg{width:17px;height:17px;flex:none}
.mini{height:6px;border-radius:9px;background:var(--line);overflow:hidden;max-width:160px}
.mini i{display:block;height:100%;background:var(--c);border-radius:9px}
.go{justify-self:start;display:inline-flex;align-items:center;gap:10px;border:none;border-radius:999px;padding:11px 18px;font-weight:700;font-size:15px;background:var(--ink);color:var(--bg);margin-top:4px}
.go svg{width:18px;height:18px}
.go.soft{background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--ink)}
.art{width:112px;display:grid;justify-items:end;gap:4px;text-align:right}
.art em{font-family:var(--f-display);font-style:italic;font-weight:600;font-size:13px;line-height:1.2;color:var(--c);max-width:14ch}
.art .ill{width:104px;height:104px}
.link{position:relative;height:56px;margin-block:-8px}
.link svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.finish{display:flex;align-items:center;gap:12px;padding:14px 4px 0;color:var(--muted);font-weight:600}
.finish svg{width:34px;height:34px}

/* course page */
.chead{position:relative;overflow:hidden;border-radius:26px;padding:20px 20px 18px;margin-top:8px;color:#fff;background:var(--c);isolation:isolate}
.chead::after{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(120% 90% at 100% 0%,rgba(255,255,255,.28),transparent 55%),linear-gradient(160deg,transparent 40%,rgba(0,0,0,.28))}
.chead .ill{position:absolute;right:-6px;top:6px;width:150px;height:150px;z-index:-1;filter:drop-shadow(0 10px 18px rgba(0,0,0,.25))}
.chead .eyebrow{color:rgba(255,255,255,.85)}
.chead h1{font-size:clamp(28px,8vw,38px);font-weight:800;letter-spacing:-.02em;margin-top:6px;max-width:11ch}
.chead em{display:block;font-family:var(--f-display);font-style:italic;margin-top:8px;opacity:.9}
.cstats{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.cstats span{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28);padding:6px 10px;border-radius:999px;font-family:var(--f-mono);font-size:13px;font-weight:700}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px;margin-top:16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:7}
.seg button{border:none;background:none;border-radius:12px;padding:10px 4px;font-weight:700;font-size:14px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button svg{width:17px;height:17px}
.seg button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.panel{display:grid;gap:12px;padding-top:16px}
.unit{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;width:100%}
.unit .num{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}
.unit.done .num{background:var(--lane);color:var(--lane-ink)}
.unit .tx{min-width:0;display:grid;gap:2px}
.unit .tx b{font-weight:700;font-size:16px}
.unit .tx small{color:var(--muted);font-size:13px}
.unit .topics{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.unit .topics span{font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.unit .play{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
.unit .play svg{width:16px;height:16px}
.stars{font-size:12px;letter-spacing:2px;color:#E7A900}
.cheat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.cheat h3{font-size:18px;font-weight:800;margin-bottom:8px;color:var(--c)}
.cheat h4{margin:12px 0 4px;font-size:15px}
.cheat ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:14.5px}
.cheat b{color:var(--ink)}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:9;padding:0 max(14px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));pointer-events:none}
.tabs .in{pointer-events:auto;max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:8px;box-shadow:0 10px 30px rgba(10,20,40,.12)}
.tab{position:relative;background:none;border:none;display:grid;justify-items:center;gap:2px;padding:6px 0;border-radius:18px;font-size:12px;font-weight:600;color:var(--muted)}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:-9px;width:26px;height:4px;border-radius:4px;background:var(--accent)}

/* shared */
.list{display:grid;gap:12px}
.row{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;text-align:left;width:100%}
.row .ic{font-size:24px;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--c,var(--accent)) 14%,transparent);color:var(--c,var(--accent));flex:none}
.row .ic svg{width:30px;height:30px}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-weight:700}
.row .tx small{color:var(--muted);font-size:13px}
.pill{font-family:var(--f-mono);font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--line);white-space:nowrap}
.pill.ok{background:var(--good-bg);color:var(--good)} .pill.no{background:var(--bad-bg);color:var(--bad)}
.feature{position:relative;overflow:hidden;display:grid;gap:6px;text-align:left;width:100%;border:none;border-radius:22px;padding:20px;background:var(--hero);color:var(--hero-ink);isolation:isolate}
.feature .flag{position:absolute;right:-10px;bottom:-14px;width:130px;height:130px;z-index:-1;opacity:.9}
.feature b{font-family:var(--f-display);font-size:24px;font-weight:800}
.feature small{color:var(--hero-muted);max-width:26ch}
.feature .pill{justify-self:start;margin-top:6px}
.note{color:var(--muted);font-size:14px;margin:0}
.btn{border:none;border-radius:14px;padding:15px 18px;font-weight:700;font-size:16px;width:100%;background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 55%,#000)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 55%,#000)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.good{background:var(--good);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--good) 55%,#000)}
.btn.bad{background:var(--bad);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--bad) 55%,#000)}
.empty{text-align:center;color:var(--muted);padding:30px 14px;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.toggle{display:flex;gap:8px}
.credit{text-align:center;color:var(--muted);font-size:12.5px;margin-top:26px}
.credit b{color:var(--ink)}

/* session overlay */
.sess{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sess[hidden]{display:none}
.sess .wrap{max-width:560px;width:100%;margin:0 auto;display:flex;flex-direction:column;flex:1;min-height:0;gap:14px}
.sbar{display:flex;align-items:center;gap:12px}
.x{background:none;border:none;font-size:28px;line-height:1;color:var(--muted);padding:4px}
.prog{flex:1;height:14px;border-radius:99px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--good);border-radius:99px;transition:width .3s}
.body{flex:1;overflow-y:auto;min-height:0;display:flex;flex-direction:column;gap:14px}
.lesson{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px 20px}
.lesson .ill{position:absolute;right:-20px;top:-20px;width:110px;height:110px;opacity:.16}
.lesson h3{font-size:26px;font-weight:800;margin-bottom:14px;max-width:14ch}
.lesson ul{margin:0;padding:0;list-style:none;display:grid;gap:12px}
.lesson li{position:relative;padding-left:24px}
.lesson li::before{content:"";position:absolute;left:2px;top:.5em;width:11px;height:11px;border-radius:3px;background:var(--c,var(--lane))}
.lesson b{color:var(--c,var(--accent))}
.qtag{display:flex;justify-content:space-between;gap:10px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.pastb{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:#f5b301;color:#2a1d00;font-size:12.5px;font-weight:800;letter-spacing:.02em}
.pastb.kbb{background:#dbe7ff;color:#14306b}
.qtext{white-space:pre-line;font-family:var(--f-display);font-size:23px;font-weight:800;line-height:1.22;text-wrap:balance}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:13px 14px;box-shadow:0 3px 0 var(--line)}
.opt .k{width:30px;height:30px;flex:none;border-radius:8px;display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:13px;background:var(--bg);border:1.5px solid var(--line)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.opt.right{border-color:var(--good);background:var(--good-bg)} .opt.right .k{background:var(--good);color:#fff;border-color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)} .opt.wrong .k{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt:disabled{cursor:default}
.fb{border-radius:16px;padding:14px 16px;display:grid;gap:4px}
.fb.ok{background:var(--good-bg);color:var(--good)} .fb.no{background:var(--bad-bg);color:var(--bad)}
.fb strong{font-family:var(--f-display);font-size:20px}
.fb p{margin:0;color:var(--ink);font-size:15px}
.result{text-align:center;display:grid;gap:14px;justify-items:center;padding-top:20px}
.big{font-family:var(--f-display);font-size:68px;font-weight:800;line-height:1}
.mods{display:grid;gap:8px;width:100%}
.mods .row{padding:10px 14px}
.timer{font-family:var(--f-mono);font-weight:700;font-size:14px;padding:6px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.combo{font-family:var(--f-mono);font-weight:700;font-size:13px;color:var(--lane-ink);background:var(--lane);padding:4px 10px;border-radius:999px}

/* Koç Zahide: sesli anlatım */
.spk{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:999px;padding:7px 12px;font-weight:700;font-size:13px;background:color-mix(in srgb,var(--accent) 12%,var(--surface));color:var(--accent)}
.spk svg{width:18px;height:18px}
.spk[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.listen{position:relative;z-index:1;display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 14px 7px 8px;font-weight:700;font-size:14px;margin-bottom:12px}
.listen i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--c,var(--accent));color:#fff;font-style:normal}
.listen svg{width:16px;height:16px}
.coach{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:3;display:flex;flex-direction:column;align-items:flex-end;gap:4px;max-width:min(calc(100% - 32px),520px);pointer-events:none}
.coach .av{pointer-events:auto;width:86px;height:86px;flex:none;border:none;padding:0;background:none;border-radius:50%;filter:drop-shadow(0 8px 14px rgba(10,20,40,.25));animation:pop .35s ease-out}
.coach .av svg{width:100%;height:100%;display:block}
.coach .bub{position:relative;pointer-events:auto;background:var(--surface);border:1.5px solid var(--line);border-radius:22px;padding:12px 16px;font-size:14.5px;line-height:1.4;box-shadow:0 8px 24px rgba(10,20,40,.14);max-width:280px;margin-bottom:18px;animation:pop .25s ease-out}
.coach .bub::before,.coach .bub::after{content:"";position:absolute;background:var(--surface);border:1.5px solid var(--line);border-radius:50%}
.coach .bub::before{width:14px;height:14px;right:34px;bottom:-12px}
.coach .bub::after{width:8px;height:8px;right:30px;bottom:-24px}
.coach .ask{display:flex;gap:8px;margin-top:10px}
.coach .ask[hidden]{display:none}
.coach .ask button{flex:1;border:none;border-radius:12px;padding:9px 12px;font-weight:700;font-size:14px}
.coach .ask .yes{background:var(--accent);color:var(--accent-ink)}
.coach .ask .no{background:var(--bg);color:var(--ink);border:1.5px solid var(--line)}
.coach .bub small{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:800;margin-bottom:2px}
.coach .bub[hidden]{display:none}
.coach .m-open{display:none}
.coach.talk .m-closed{display:none}
.coach.talk .m-open{display:block;transform-origin:50px 57px;animation:talk .18s ease-in-out infinite alternate}
.coach .eyes{transform-origin:50px 46px;animation:blink 4s infinite}
@keyframes talk{from{transform:scaleY(.35)}to{transform:scaleY(1.1)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes pop{from{transform:scale(.4) translateY(30px);opacity:0}to{transform:none;opacity:1}}
.sess.with-coach .body{padding-bottom:120px}
.reading{background:color-mix(in srgb,var(--lane) 30%,transparent);border-radius:8px;box-shadow:0 0 0 6px color-mix(in srgb,var(--lane) 30%,transparent)}
.opt.reading{box-shadow:0 0 0 3px var(--lane)}
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:4;max-width:90%}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.pk{display:grid;justify-items:center;gap:4px;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:16px 10px}
.pk svg{width:84px;height:84px}
.pk small{color:var(--muted);font-size:12.5px}
.pk[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
.review{position:absolute;inset:0;z-index:2;background:var(--bg);overflow-y:auto;display:flex;flex-direction:column;gap:14px;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(130px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-width:600px;margin:0 auto}
.why,.deep{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px;display:grid;gap:6px}
.why p,.deep p{margin:0}
.w-ok b{color:var(--good)} .w-no b{color:var(--bad)}
.deep{border-color:color-mix(in srgb,var(--c) 40%,var(--line))}
.deep-t{white-space:pre-wrap;font-size:15.5px;line-height:1.6}
.revlink{justify-self:start;margin-top:6px;border:none;background:var(--surface);color:var(--ink);font-weight:700;font-size:14px;padding:8px 12px;border-radius:10px}
.aprog{height:5px;border-radius:9px;background:var(--line);overflow:hidden;margin:-4px 0 14px;opacity:0;transition:opacity .3s}
.aprog i{display:block;height:100%;width:0;background:var(--c);border-radius:9px;transition:width .2s linear}
.lesson.playing .aprog{opacity:1}
.lesson.playing{border-color:color-mix(in srgb,var(--c) 55%,var(--line));box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 14%,transparent)}
/* içerik kartları küçülüp kırpılmasın; alan yetmezse sayfa kaysın */
.body>*,.review>*{flex-shrink:0}
@media (max-width:420px){.art{width:84px}.art .ill{width:80px;height:80px}.stop.alt .node{margin-left:20px}.stop .node{width:56px;height:56px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
const ALLD=[{"meta": {"title": "1. Kademe Antrenörlük Temel Eğitim", "version": "1.0", "note": "Konu başlıkları GSB Antrenör Temel Eğitimi 5 modül yapısına göre düzenlenmiştir. Soru ve özetler özgün olarak yazılmıştır; resmî sınav sorusu değildir.", "exam": {"modules": 5, "questionsPerModule": 20, "passScore": 60}}, "courses": [{"id": "hab", "title": "Hareket ve Antrenman Bilimleri", "short": "Antrenman", "icon": "⚡", "color": "#E8833A", "units": [{"id": "hab1", "title": "Antrenmanın Temel Kavramları", "cards": [{"title": "Antrenman biliminin gelişimi", "points": ["Dünyadaki ilk genel antrenman araştırması: Sovyet **Matwejew**'in **\"Spor Antrenmanlarının Periyotlanması\"** kitabı.", "Türkiye'de ilk çalışmalar: **1973**'te **Ege Üniversitesi Spor Hekimliği Enstitüsü**'nün antropometrik ölçümleri. **1975**'te Spor Akademileri kuruldu.", "**1982**'de Beden Terbiyesi Kanunu çerçevesinde **SESAM** (Ankara Sporcu Eğitim Sağlık ve Araştırma Merkezi) kuruldu.", "**Açık antrenman kavramı (Muratlı):** Antrenman, yeni başlayandan elit sporcuya, çocuktan yaşlıya **herkese açık** olmalıdır."]}, {"title": "Temel kavramlar", "points": ["**Spor (TDK):** Bedeni veya zihni geliştirmek amacıyla kişisel veya toplu, **bazı kurallara göre** uygulanan hareketlerin tümü.", "**Fiziksel aktivite:** **İskelet kasları** aracılığıyla vücudun hareketi sonucu oluşan **enerji harcaması**. İlk programlar **1860**'ta Amerika'da.", "**Egzersiz:** **Planlı ve programlı**, fiziksel uygunluğun bir veya birkaç öğesini geliştirmeye/korumaya yönelik **tekrarlayıcı** vücut hareketleri.", "**Performans:** Sporcunun fiziksel, fizyolojik, biyomotorik ve psikolojik olarak ortaya koyduğu **verim düzeyi**.", "**Antrenman (dar anlam):** Sporcunun değişik egzersizlerle fiziksel, teknik, taktik, zihinsel, psikolojik ve moral hazırlanması. **Spor antrenmanı (geniş anlam):** En yüksek sporsal verime ulaştıran **tüm sistematik hazırlanma yöntemleri**.", "**Antrenör:** Sporcuyu teknik, taktik, kondisyon, psikolojik, sosyolojik ve zihinsel açıdan **basamaklı olarak** üst düzey verime ulaştıran eğitici kişi."]}, {"title": "Performansı etkileyen faktörler", "points": ["**İçsel faktörler:** Kişide var olan, kısmen **kalıtsal**, dışarıdan etkisi çok sınırlı olanlar: **yaş, cinsiyet, anatomik yapı, genetik, zekâ**, psikolojik denge, metabolizma, nöromüsküler ileti hızı, kardiyovasküler yapı.", "**Dışsal faktörler:** Vücut dışından gelen ve değiştirilmesi **daha kolay** olanlar: **malzeme kalitesi**, ortam, beslenme, antrenman koşulları vb.", "Performansı artırmak için **dışsal faktörlerde** değişiklik yapmak daha kolay ve etkilidir."]}, {"title": "LTAD: Uzun vadeli sporcu gelişimi (1)", "points": ["LTAD (Balyi) **biyolojik/fizyolojik** odaklı bir modeldir; **7 aşama** vardır. Geçişte **takvim yaşından çok biyolojik yaş** dikkate alınır.", "**1. Aktif başlangıç (0-6 yaş):** Oyun ve temel hareket becerileri. En önemli sorumluluk **ebeveynlerde**. Üç temel beceri: **lokomotor** (yer değiştirme), **lokomotor olmayan/denge** ve **manipülatif** (nesne kontrolü).", "**2. Temel eğitim (kız 6-8, erkek 6-9):** **Hareketin ABC'si: çeviklik, denge, koordinasyon** + sürat. Eğlence esastır, resmi yarışma çok az.", "**3. Antrenman yapmayı öğrenme (kız 8-11, erkek 9-12):** Temel spor becerileri; **3-4 farklı spor dalı** denenmeli. Kazanmak değil **beceri gelişimi** önemlidir. Hata yapmak öğrenmenin parçasıdır."]}, {"title": "LTAD: Uzun vadeli sporcu gelişimi (2)", "points": ["**4. Antrenman için antrenman (kız 11-15, erkek 12-16):** Hızlı boy uzaması dönemi; **aerobik dayanıklılık, sürat, kuvvet** için hassas dönemler. **Antrenman/yarışma oranı %60/%40.**", "Kızlarda kuvvete **boy uzama zirvesinden hemen sonra** (veya menarşla), erkeklerde **zirveden 12-18 ay sonra** yoğunlaşılır.", "**5. Yarışma için antrenman (kız 15-17, erkek 16-18):** Tek branşta özelleşme seçilebilir; yüksek kapsam ve şiddet başlar.", "**6. Kazanmak için antrenman (kız 17+, erkek 18+):** Elit sporculuk; uluslararası madalya hedefi. Geç özelleşen sporlarda **18-26 yaş** arasında ulaşılır.", "**7. Aktif yaşam için antrenman:** Rekabetten **yaşam boyu fiziksel aktiviteye** geçiş (veteran sporcu, hakem, antrenör).", "**Erken özelleşen sporlar:** **jimnastik**, ritmik jimnastik, artistik buz pateni, dalma. **Geç özelleşen sporlar:** atletizm, yüzme, futbol, basketbol, voleybol, hentbol, halter, okçuluk."]}, {"title": "DMSP: Spora katılım gelişim modeli", "points": ["DMSP (**Jean Côté**) ağırlıklı olarak **psikolojik** bir modeldir; LTAD'ı tamamlar.", "**Örnekleme yılları (6-12):** **Çoklu spora katılım**, oyun-eğlence, plansız ve düşük yoğunluk.", "**Uzmanlaşma yılları (13-15):** Spor sayısı azalır, yoğunluk artar.", "**Yatırım yılları (16+):** **Tek spora** odaklanma, planlı antrenman, çok yüksek yoğunluk.", "İki vurgu: **yapılandırılmamış (serbest) oyun** ve **spor çeşitlendirmesi**. Erken yaşta çok sporlu katılım daha başarılı sonuç verir; **erken uzmanlaşma** genelde zirveye götürmez."]}, {"title": "Uyum ve süperkompanzasyon", "points": ["Antrenman stresi **akut ve kronik uyum** oluşturur. Uyum; kapsam, şiddet, sporcunun düzeyi ve **dinlenme süresine** bağlıdır.", "Antrenman etkileri, antrenman kesildikten birkaç hafta sonra kaybolur; haftada **1-2 yüklenmeyle** korunabilir.", "**Süperkompanzasyon (fazla tamlama):** Aktivitede eksilen depoların dinlenme sonrası **başlangıç düzeyinin üzerine** çıkması.", "Evreler: **1. yüklenme-yorgunluk → 2. dinlenme-yenilenme → 3. fazla tamlama**. Yeni uyaran zamanında gelmezse kazanım kaybolur.", "Fazla tamlama süresi: dayanıklılık antrenmanında **~6 saat sonra**, sinir sistemine ağır yük getiren yoğun antrenmanda **24-48 saat**.", "Yüksek ve düşük şiddetli uyaranlar **dalgalı** planlanmalıdır."]}, {"title": "Antrenmansızlaşma (detraining)", "points": ["Antrenmana fazla ara verilince performansın ve fizyolojik uyumların **gerilemesi**. Kayıplar kazanmaktan **daha hızlıdır**.", "Kazanılan form **4-8 haftada** tamamen kaybolabilir; yüksek antrenmanlı sporcular **2-3 haftada** düşer.", "Kalp-solunum: kapiller yoğunluk ve oksidatif enzimler azalır, VO₂maks düşer, **yüklenme nabzı artar**, **kalp debisi ve atım hacmi azalır**.", "Kas: **atrofi (~%1/hafta)**; alt bedendeki kayıp üst bedenden fazla. Kas verimi pasif yaşamın **4. haftasına** kadar korunabilir.", "Dayanıklılık en çok etkilenir: **12 haftada aerobik enzimlerin %75'i** kaybolur. **Sürat** en az kaybolan özelliktir (6-7. ayda düşer). **Esneklik** çok çabuk geriler."]}, {"title": "Sürantrenman", "points": ["**Sürantrenman:** Aşırı antrenman ve **yetersiz dinlenme** sonucu yorgunluğun birikmesi ve **performans düşüşü**. Genelde periyot sonlarında oluşan **kronik** yorgunluktur.", "Genel belirtiler: huzursuzluk, kilo kaybı, çabuk yorulma, **sabah taşikardisi**, gece terlemesi, iştahsızlık, **uyuyamama**, yarışma isteğinde azalma.", "Fizyolojik belirtiler: kas glikojeninde düşüş, dinlenik nabızda artış, VO₂maks düşüşü, **testosteron/kortizol oranında düşüş**, kreatin kinaz artışı.", "Nedenler: **monoton antrenman**, yetersiz dinlenme, sakatlık sonrası ani ağır yük, çok sık müsabaka, **yükün çok hızlı artırılması**; ayrıca beslenme, uyku, aile, okul gibi çevresel stresler.", "Önleme: mikro döngülerde **2:1 veya 3:1** (yüklenme:dinlenme) oranı; her yüklenmeyi yenilenme izlemeli.", "Giderme: **spor hekimiyle iş birliği**, **önce yoğunluğu düşür**, uyku-beslenme düzeni, düşük yoğunluklu aerobik, oyunlar; **34-37 °C** suda banyo, masaj. **Sıcak sauna yasaktır.** Antrenman sayısını artırmak **çözüm değildir**."]}], "questions": [{"q": "\"Bedeni veya zihni geliştirmek amacıyla kişisel veya toplu olarak gerçekleştirilen, bazı kurallara göre uygulanan hareketlerin tümü\" tanımı hangi kavrama aittir?", "o": ["Performans", "Fiziksel aktivite", "Antrenman", "Egzersiz", "Spor"], "a": 4, "e": "Bu TDK'nın spor tanımıdır."}, {"q": "İskelet kasları aracılığıyla vücudun hareketi sonucu oluşan enerji harcaması hangi kavramdır?", "o": ["Performans", "Egzersiz", "Fiziksel aktivite", "Spor", "Antrenman"], "a": 2, "e": "Egzersiz ise planlı-programlı ve tekrarlayıcı hareketlerdir."}, {"q": "Planlı ve programlı, fiziksel uygunluğu geliştirmeye yönelik tekrarlayıcı vücut hareketlerine ne denir?", "o": ["Spor", "Oyun", "Fiziksel aktivite", "Performans", "Egzersiz"], "a": 4, "e": "Egzersiz, fiziksel aktivitenin planlı alt türüdür."}, {"q": "Aşağıdakilerden hangisi performansın içsel faktörlerinden değildir?", "o": ["Anatomik yapı", "Genetik", "Malzeme kalitesi", "Yaş", "Nöromüsküler ileti hızı"], "a": 2, "e": "Malzeme kalitesi dışsal bir faktördür."}, {"q": "Türkiye'de antrenman bilimindeki ilk çalışmalar hangi kurumda başlamıştır?", "o": ["Gazi Üniversitesi (1926)", "Hacettepe Üniversitesi (1990)", "Ege Üniversitesi Spor Hekimliği Enstitüsü (1973)", "Spor Akademileri (1975)", "SESAM (1982)"], "a": 2, "e": "Antropometrik ölçümlerle başlamıştır."}, {"q": "LTAD'da kızlarda 11-15, erkeklerde 12-16 yaş aralığı hangi evredir?", "o": ["Temel eğitim", "Yarışma için antrenman", "Antrenman için antrenman", "Aktif başlangıç", "Kazanmak için antrenman"], "a": 2, "e": "Bu evrede antrenman/yarışma oranı %60/%40'tır."}, {"q": "LTAD'da hareketin ABC'si (çeviklik, denge, koordinasyon) hangi evrede öne çıkar?", "o": ["Antrenman için antrenman", "Kazanmak için antrenman", "Temel eğitim", "Yarışma için antrenman", "Aktif yaşam için antrenman"], "a": 2, "e": "Temel eğitim kızlarda 6-8, erkeklerde 6-9 yaştır."}, {"q": "Aşağıdaki branşlardan hangisi erken uzmanlaşılan sporlardandır?", "o": ["Halter", "Voleybol", "Basketbol", "Futbol", "Jimnastik"], "a": 4, "e": "Ritmik jimnastik, artistik buz pateni ve dalma da erken özelleşir."}, {"q": "DMSP modelinde uzmanlaşma aşaması hangi yaş aralığındadır?", "o": ["16+", "18-26", "0-6", "6-12", "13-15"], "a": 4, "e": "Örnekleme 6-12, yatırım 16+ yaştır."}, {"q": "LTAD ve DMSP modellerini doğru eşleştiren seçenek hangisidir?", "o": ["LTAD psikolojik, DMSP fizyolojiktir", "İkisi de yalnız psikolojiktir", "DMSP tek spora erken odaklanmayı önerir", "LTAD biyolojik/fizyolojik, DMSP psikolojik odaklıdır", "İkisi de erken uzmanlaşmayı önerir"], "a": 3, "e": "LTAD Balyi'nin, DMSP Côté'nin modelidir."}, {"q": "Fazla tamlamanın (süperkompanzasyon) evreleri hangi sıradadır?", "o": ["Isınma → Ana bölüm → Soğuma", "Yorgunluk → Fazla tamlama → Yüklenme", "Dinlenme → Yüklenme → Yorgunluk", "Fazla tamlama → Yüklenme → Dinlenme", "Yüklenme-yorgunluk → Dinlenme → Fazla tamlama"], "a": 4, "e": "Yeni uyaran fazla tamlama evresinde verilmelidir."}, {"q": "Antrenmansızlaşmada en az ve en geç kaybedilen motorik özellik hangisidir?", "o": ["Sürat", "Aerobik kapasite", "Dayanıklılık", "Esneklik", "Kuvvet"], "a": 0, "e": "Sürat genetiğe bağlıdır; 6-7. ayda antrenman öncesine döner."}, {"q": "Antrenmansızlaşmada kalp-solunum işlevinde görülmeyen değişiklik hangisidir?", "o": ["Yüklenme nabzında artış", "Kapiller yoğunlukta azalma", "VO₂maks'ta azalma", "Kalp debisi ve atım hacminde artış", "Oksidatif enzimlerde azalma"], "a": 3, "e": "Antrenmansızlaşmada kalp debisi ve atım hacmi azalır."}, {"q": "Aşırı antrenman ve yetersiz dinlenme sonucu yorgunluğun birikerek performansın düşmesine ne denir?", "o": ["Isınma", "Antrenmansızlaşma", "Süperkompanzasyon", "Adaptasyon", "Sürantrenman"], "a": 4, "e": "Sürantrenman kronik bir yorgunluk tablosudur."}, {"q": "Aşağıdakilerden hangisi sürantrenmanı gidermek için alınacak önlemlerden değildir?", "o": ["Spor hekimiyle iş birliği yapmak", "Antrenman sayısını artırarak yüklenmeye devam etmek", "Yoğunluğu düşürmek", "Eğlenceli, oyun biçiminde etkinlikler yapmak", "Uyku düzenini sağlamak"], "a": 1, "e": "Önce yoğunluk düşürülmelidir."}, {"q": "Sürantrenmanı önlemek için mikro döngülerde önerilen yüklenme:dinlenme oranı hangisidir?", "o": ["2:1 veya 3:1", "1:3", "1:1 her zaman", "5:1", "10:1"], "a": 0, "e": "Her yüklenme dönemini mutlaka yenilenme izlemelidir."}, {"q": "Sürantrenman tedavisinde hangisi yasaktır?", "o": ["Masaj", "Yüzme", "Sıcak sauna", "Sabah soğuk duş", "34-37 °C suda banyo"], "a": 2, "e": "İklimsel tedavide sakin ortamda dinlenmek önerilir."}, {"q": "“Bedeni veya zihni geliştirmek amacıyla kişisel veya toplu olarak gerçekleştirilen, bazı kurallara göre uygulanan hareketlerin tümü” tanımı aşağıdakilerden hangisidir?", "o": ["Fiziksel Aktivite", "Performans", "Spor", "Antrenman", "Egzersiz"], "a": 2, "e": "Doğru cevap: Spor.", "kb": 1}, {"q": "İskelet kasları vasıtasıyla vücudun hareketi sonucunda oluşan enerji harcaması aşağıdakilerden hangisidir?", "o": ["Egzersiz", "Spor", "Performans", "Fiziksel Aktivite", "Antrenman"], "a": 3, "e": "Doğru cevap: Fiziksel Aktivite. Kitabın cevap anahtarında A yazıyor, ancak kitabın metninde bu tanım fiziksel aktivite için verilir.", "kb": 1}, {"q": "Aşağıdakilerden hangisi performansın başlıca içsel faktörü değildir?", "o": ["Yaş", "Alerji", "Otonom sinir sistemi", "Malzeme kalitesi", "Anatomik yapı"], "a": 3, "e": "Doğru cevap: Malzeme kalitesi.", "kb": 1}, {"q": "Sporcuların en yüksek sporsal verime ulaşmalarını sağlayan tüm sistematik hazırlanma yöntemlerine ……………………. denir.", "o": ["Fiziksel Aktivite", "Koşu/Yürüyüş", "Aerobik egzersizler", "Müsabaka/Yarış", "Spor Antrenmanı"], "a": 4, "e": "Doğru cevap: Spor Antrenmanı.", "kb": 1}, {"q": "LTAD antrenman evrelerinden kadınlar 11- 15 ve erkekler 12-16 yaş aralığı hangi evrede gerçekleşir?", "o": ["Temel becerileri", "Kazanmak için antrenman", "Antrenman yapmayı Öğrenme", "Antrenman için Antrenman", "Yarışma için antrenman"], "a": 3, "e": "Doğru cevap: Antrenman için Antrenman.", "kb": 1}, {"q": "Aşağıdaki spor branşlarından hangisi erken uzmanlaşılan sporlar arasında gösterilebilir?", "o": ["Güreş", "Atletizm", "Boks", "Futbol", "Jimnastik"], "a": 4, "e": "Doğru cevap: Jimnastik.", "kb": 1}, {"q": "DMSP modelinde uzmanlık derecesi ve katılım yoğunluğuna göre uzmanlık aşaması hangi yaş aralığındadır?", "o": ["13-15", "8-11", "15-17", "11-13", "17- ve üstü"], "a": 0, "e": "Doğru cevap: 13-15.", "kb": 1}, {"q": "Aşağıdakilerden hangisi aşırı antrenman sonucunda, vücutta yorgunluğun birikmesi ve yetersiz dinlenmenin sonucunda düşük performans ile sonuçlanan yoğun bir eğitim sürecini ifade eder?", "o": ["Superkompenzasyon", "Detraining", "Antrenman", "Sürantrenman", "Hipertrofi"], "a": 3, "e": "Doğru cevap: Sürantrenman.", "kb": 1}, {"q": "Aşağıdakilerden hangisinde sürantrenmanı gidermek için alınması gereken tedbirlerden biri değildir?", "o": ["Antrenman sayısını artırarak yüklenmeye devam etmek", "Antrenman sonrasında masaj yapmak", "Sporcunun dengeli beslenmesini sağlamak", "Antrenmanın miktarını ve/veya zorluk derecesini azaltmak.", "Yenilenmeye olanak verecek derecede antrenmanlara ara vermek"], "a": 0, "e": "Doğru cevap: Antrenman sayısını artırarak yüklenmeye devam etmek.", "kb": 1}, {"q": "Aşadıdakilerden hangisi antrenmansızlaşma/ detraining sonucunda kalp solunum işlevinde meydana gelen değişikliklerden biri değildir?", "o": ["Kapiller yoğunlukta azalma", "Arterio- venöz oksijen farkında azalma", "Kalp debisi ve atım hacminde artış", "Oksidatif enzim aktivitesinde azalma", "Glikolitik enzimlerde sistematik olmayan değişiklikler"], "a": 2, "e": "Doğru cevap: Kalp debisi ve atım hacminde artış.", "kb": 1}], "tf": [{"q": "Antrenmanın etkileri haftada bir ya da iki kez yapılan yüklenmelerle korunabilir.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Kitapta belirtilen antrenman etkilerinden biridir.", "tf": true}, {"q": "LTAD'da aşamalar arası geçişte biyolojik yaştan çok takvim yaşı dikkate alınır.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Gelişimsel (biyolojik) yaş esas alınır; takvim yaşı yalnızca rehberdir.", "tf": true}, {"q": "Aktif başlangıç evresinde en önemli sorumluluk ebeveynlerdedir.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "0-6 yaşta oyun ve temel hareket becerileri öne çıkar.", "tf": true}, {"q": "DMSP, erken yaşta tek bir spora odaklanmayı önerir.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "DMSP erken yaşta çoklu spora katılımı (örnekleme) önerir.", "tf": true}, {"q": "Antrenmansızlaşmada kayıplar, kazanımlardan daha yavaş gerçekleşir.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Kayıplar kazanmaktan daha hızlıdır.", "tf": true}, {"q": "Dayanıklılık antrenmanında fazla tamlama yaklaşık 6 saat sonra gerçekleşir.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Sinir sistemine ağır yük getiren antrenmanlarda 24-48 saat sürer.", "tf": true}]}, {"id": "hab2", "title": "Antrenmanı Oluşturan Öğeler", "cards": [{"title": "Antrenmanın temel işlevleri", "points": ["Antrenmanın temel işlevleri: **fiziksel, teknik, taktik, zihinsel-psikolojik ve kuramsal (eğitim) hazırlık**.", "**Antrenman faktörleri piramidi** (alttan üste): **fiziksel → teknik → taktik → psikolojik** antrenman. **İlk (temel) hazırlık fiziksel hazırlıktır.**", "Fiziksel uygunluğu yetersiz sporcuda erken yorgunluk, sinir-kas koordinasyonunu bozar → **teknik düşer** → taktik uygulanamaz.", "Sporun üç temel özelliği: **teknik, taktik, kondisyon**."]}, {"title": "Fiziksel (bedensel) hazırlık", "points": ["Bedensel hazırlık: Temel motorik özellikleri ve koordinatif yetenekleri, spor dalının gerektirdiği düzeye ulaştırma çalışmaları.", "Fiziksel antrenmanın iki amacı: **fizyolojik potansiyeli artırmak** ve **branşa özgü biyomotor yetenekleri** en üst düzeye çıkarmak.", "Uzun süreli antrenmanın 3 aşaması: **temel antrenman** (genel, çok yönlü; değerler eğitimi) → **gelişim antrenmanı** → **üst düzey antrenman** (branşa özgü kondisyon).", "Hazırlık döneminin **1. evresinde genel fiziksel hazırlık**, sonlarında **özel fiziksel hazırlık** baskındır."]}, {"title": "Genel ve özel fiziksel hazırlık", "points": ["**Genel fiziksel hazırlık:** Çalışma kapasitesini artırır, **çok yönlü** gelişim. **Orta şiddette, uzun süreli** antrenman. Gençlerde **2-4 yıl** sürebilir.", "Araçlar: aletsiz alıştırmalar veya **düz bar, sıra, ip, sağlık topu**. Bu evrede **branşa özgü özelliklerin önceliği yoktur**.", "Genel hazırlık ne kadar uzun olursa bir sonraki evre o kadar verimli olur.", "**Özel fiziksel hazırlık:** Genel hazırlığın üzerine kurulur; alıştırmalar branşa **benzer** olur (özel antrenman). Süre **2-4 ay** (uzun vadede 6 ay - 1-2 yıl).", "**Biyomotor yetilerde üst düzey hazırlık:** Yarışma evresi uzun sporlarda (futbol, basketbol) **kısa**, kısa sporlarda (yüzme, boks) **uzun**. Örnek: yüksek atlamacının bacak presi, derinlik sıçramaları."]}, {"title": "Teknik ve stil", "points": ["**Teknik:** Branşa özgü hareketleri **doğru ve en ekonomik** şekilde yapmak; hareketin **ideal modeli**. Sporda başarının **birinci temel öğesidir**.", "**Stil:** Sporcunun teknik modeli **kişisel olarak** uygulama biçimi. Modelin ana yapısı değişmez; sporcu kendi anatomik-fizyolojik özelliklerini ekler.", "Stil örnekleri: Maradona gibi çalım, **Hidayet gibi smaç**, Sharapova gibi forehand, **Naim Süleymanoğlu gibi kaldırış**. (\"Fatih Terim gibi yorum yapmak\" sporsal stil değildir.)", "Teknik **öğrenilir**, motorik özellik **geliştirilir**. Örnek: badmintonda backhand vuruş öğrenilen tekniktir; ön kol kuvveti geliştirilen motorik özelliktir.", "Teknik hazırlık, **bedensel hazırlığın** başarıyla tamamlanmasına bağlıdır. İyi tekniği olan sporcu kondisyonu düşse de **daha uzun süre** spor yapabilir.", "Teknik eğitimin 3 aşaması: **çok yönlü** → **genel** → **özel teknik eğitim** (otomatikleşme)."]}, {"title": "Tekniğin öğrenim safhaları", "points": ["**1. Amaca yönelik tanıma ve anlama:** Hareketin bütün olarak tanımı; algılama yoluyla zihinde model oluşur.", "**2. Kaba koordinasyon:** Hareketin ana safhaları kabaca öğrenilir; hatalar ve ekonomik olmayan hareket görülebilir.", "**3. Ayrıntılı ve ince koordinasyon:** Kinematik ve dinamik özellikler en iyi şekilde kullanılır; bilinçli ve ayrıntılı uygulama.", "**4. Sağlamlaştırma ve pekiştirme:** Teknik **otomatikleşir**; her koşulda doğru uygulanır.", "Sportif tekniğin özellikleri: **kinematik** (zamanlama, mesafe, hızlanma) ve **dinamik** (ivmelenme, frenleme, kuvvet vuruşu).", "Hata düzeltmede **ana hata yan hatadan, büyük hata küçük hatalardan önce** düzeltilir."]}, {"title": "Taktiksel hazırlık", "points": ["**Taktik:** Teknik yeteneği gelişmiş sporcunun sabit ve değişken koşullarda bireysel/takım olarak becerilerini **planlı** sergilemesi; başarıya yönelik düşünce.", "**Taktiksel hazırlık, teknik hazırlığın** gelişmesiyle başarıya ulaşır: \"Topu iyi tutamayan sporcu pası istediği yere atamaz\" → **teknik-taktik** ilişkisi.", "Taktik örneği: sporcunun **uzun boy avantajını kullanarak savunma** yapması.", "Sınıflamalar: **genel-özel taktik**, **bireysel-kolektif taktik**, **bireysel-grup-takım taktiği**.", "Uygulama sırası (Harre): **durumu algılama ve analiz** → **zihinde çözüm** → **motorik uygulama**.", "Taktik eğitimin bileşenleri (Brath): **araştırmak, gizlemek, duruma uygun davranmak**.", "Zorlaştırma sırası: **savunmasız → pasif → yarı aktif → aktif savunma → müsabaka şartları**. Teknik ve taktik **paralel** geliştirilir."]}, {"title": "Zihinsel ve kuramsal hazırlık", "points": ["**Zihinsel-psikolojik hazırlık:** Sporcunun kendisini etkileyen **algı, stres, motivasyon, eğitim ve motorik becerilerin** üstesinden gelerek spor dalına hazırlanması.", "**Zihinsel antrenman:** Hareketin **fiziksel uygulama olmadan** zihinde yoğun şekilde canlandırılması; yeni hareketin **pasif öğrenme** süreci.", "Üç türü: **kendi kendine konuşma**, **gizli algı** (idealize edilen şampiyonu hayal etme), **kendini hayal etme (imgeleme-ideomotor)**.", "Zihinsel hazırlık öğeleri: oyun zekâsı, deneyim, **dikkat, konsantrasyon**, kendine güven, gevşeme, motivasyon, hedef belirleme. (Topu kontrol etmek teknik bir öğedir.)", "**Eğitim (kuramsal) hazırlığı:** Bilimsel kurallar ve **başarılı antrenör ve sporcuların deneyimlerinden yararlanmak**, bunları genelleştirip uyarlamak.", "Örnekler: **Bill Russell** ve **Allen Iverson** hareketleri zihinde canlandırarak çalışmıştır."]}], "questions": [{"q": "Antrenmanın temel işlevlerinden ilk antrenman hazırlığını oluşturan hangisidir?", "o": ["Taktik hazırlık", "Zihinsel hazırlık", "Eğitim hazırlığı", "Fiziksel hazırlık", "Teknik hazırlık"], "a": 3, "e": "Antrenman faktörleri piramidinin tabanında fiziksel antrenman vardır."}, {"q": "Hazırlık döneminin 1. evresinde ağırlıklı olarak hangisi uygulanmalıdır?", "o": ["Zihinsel hazırlık", "Genel fiziksel hazırlık", "Müsabaka hazırlığı", "Taktik hazırlık", "Özel fiziksel hazırlık"], "a": 1, "e": "Hazırlık döneminin sonlarında özel fiziksel hazırlık baskın hâle gelir."}, {"q": "Aşağıdakilerden hangisi fiziksel hazırlıkla ilgili doğru bir özellik değildir?", "o": ["Genel fiziksel hazırlıkta orta şiddette uzun süreli antrenman yapılması", "Genel hazırlıkta sağlık topu, ip, sıra gibi araçların kullanılması", "Üst düzey hazırlıkta defalarca özel alıştırma yapılması", "Genel fiziksel hazırlıkta öncelikle branşa özgü özelliklerin geliştirilmesi", "Bedensel hazırlığın motorik ve koordinatif özellikleri geliştirmesi"], "a": 3, "e": "Genel fiziksel hazırlıkta çok yönlü gelişim hedeflenir."}, {"q": "Branşa özgü hareketlerin doğru ve en ekonomik şekilde yapılmasına ne denir?", "o": ["Strateji", "Teknik", "Kondisyon", "Stil", "Taktik"], "a": 1, "e": "Teknik, hareketin ideal modelidir."}, {"q": "Sporcunun teknik modeli kendi anatomik ve fizyolojik özelliklerine göre kişisel uygulama biçimine ne denir?", "o": ["Sistem", "Stil", "Strateji", "Teknik", "Taktik"], "a": 1, "e": "Stilde modelin ana yapısı değişmez."}, {"q": "Aşağıdakilerden hangisi sporsal stil örneği değildir?", "o": ["Sharapova gibi forehand vurması", "Hidayet gibi smaç yapması", "Fatih Terim gibi yorum yapması", "Maradona gibi çalım atması", "Naim Süleymanoğlu gibi ağırlık kaldırması"], "a": 2, "e": "Stil bir sportif becerinin kişisel uygulama biçimidir."}, {"q": "Tekniğin öğreniminde hareketin otomatik hâle geldiği safha hangisidir?", "o": ["Sağlamlaştırma ve pekiştirme", "Çok yönlü teknik eğitim", "Tanıma ve anlama", "Ayrıntılı ve ince koordinasyon", "Kaba koordinasyon"], "a": 0, "e": "Bu safhada sporcu en üst düzeye ulaşır."}, {"q": "Hareketin ana safhalarının kabaca öğrenildiği, ekonomik olmayan uygulamaların görülebildiği safha hangisidir?", "o": ["Kaba koordinasyon", "Pekiştirme", "Otomatikleşme", "Tanıma ve anlama", "İnce koordinasyon"], "a": 0, "e": "Önemli olan hareketin kabaca öğrenilmesidir."}, {"q": "\"Topu iyi tutamayan bir sporcu, pası istediği yere atamaz.\" ifadesi hangi ilişkiyi açıklar?", "o": ["Zihinsel-Fiziksel", "Fiziksel-Taktik", "Teknik-Zihinsel", "Fiziksel-Teknik", "Teknik-Taktik"], "a": 4, "e": "Taktiksel hazırlık teknik hazırlığın gelişmesine bağlıdır."}, {"q": "Taktiksel hazırlık hangi hazırlığın başarıyla tamamlanmasına bağlıdır?", "o": ["Psikolojik hazırlık", "Teknik hazırlık", "Sosyal hazırlık", "Eğitim hazırlığı", "Zihinsel hazırlık"], "a": 1, "e": "Teknik hazırlık da bedensel hazırlığa bağlıdır."}, {"q": "Aşağıdakilerden hangisi taktiksel üstünlük kurmaya yönelik bir harekettir?", "o": ["Bacak presi yapmak", "Ailesi için başarılı olmak istemek", "Sağlık topuyla alıştırma yapmak", "Sosyal çevresiyle etkileşmek", "Uzun boy avantajını kullanarak savunma yapmak"], "a": 4, "e": "Taktik, eldeki imkânları plan dâhilinde kullanmaktır."}, {"q": "Taktik davranışlar hangi sırayla zorlaştırılarak çalışılmalıdır?", "o": ["Aktif → pasif → savunmasız → müsabaka", "Pasif → müsabaka → aktif → savunmasız", "Savunmasız → pasif → yarı aktif → aktif savunma → müsabaka", "Yarı aktif → müsabaka → savunmasız", "Müsabaka → aktif → pasif → savunmasız"], "a": 2, "e": "Kolaydan zora ilkesi uygulanır."}, {"q": "Sporcunun algı, stres, motivasyon, eğitim ve motorik becerilerin üstesinden gelerek spor dalına hazırlanması hangisidir?", "o": ["Eğitim hazırlığı", "Teknik hazırlık", "Taktik hazırlık", "Zihinsel hazırlık", "Fiziksel hazırlık"], "a": 3, "e": "Zihinsel hazırlık psikoenerji kontrolünü gerektirir."}, {"q": "Sporcunun idealize ettiği bir şampiyonu hareketi yaparken zihninde canlandırdığı zihinsel antrenman türü hangisidir?", "o": ["Kaba koordinasyon", "Pratik taktik eğitim", "İdeomotor antrenman", "Gizli algı antrenmanı", "Kendi kendine konuşma"], "a": 3, "e": "İdeomotor antrenmanda sporcu kendini hayal eder."}, {"q": "Aşağıdakilerden hangisi zihinsel hazırlık öğelerinden değildir?", "o": ["Dikkat", "Deneyim", "Oyun zekâsı", "Konsantrasyon", "Topu kontrol etmesi"], "a": 4, "e": "Topu kontrol etmek teknik bir beceridir."}, {"q": "Başarılı antrenör ve sporcuların deneyimlerinden yararlanmak, bunları genelleştirip uyarlamak hangi hazırlığın özelliğidir?", "o": ["Taktik hazırlık", "Fiziksel hazırlık", "Teknik hazırlık", "Zihinsel hazırlık", "Eğitim hazırlığı"], "a": 4, "e": "Antrenman bilimsel kurallar ve denenmiş deneyimlerle düzenlenir."}, {"q": "Aşağıdakilerden hangisi fiziksel hazırlıkla ilgili özelliklerden biri değildir?", "o": ["Genel fiziksel hazırlıkta orta şiddette uzun süreli bir antrenman uygulanması", "Genel fiziksel hazırlıkta düz bar, sıra, ip, sağlık topları gibi araçlar kullanılması", "Genel fiziksel hazırlıkta öncelikli spor dalına özgü özelliklerin geliştirilmesi", "Motor yeteneklerin üst düzey hazırlığında, defalarca özel alıştırma yapılması", "Bedensel hazırlık, temel motorik özelliklerin ve koordinatif yeteneklerin geliştirilmesi"], "a": 2, "e": "Doğru cevap: Genel fiziksel hazırlıkta öncelikli spor dalına özgü özelliklerin geliştirilmesi.", "kb": 1}, {"q": "Aşağıdakilerden hangisi sporcunun taktiksel hazırlık veya üstünlük kurmak için yaptığı hareketlerden biridir?", "o": ["Sporcunun sosyal çevresiyle etkileşime girmesi", "Sporcunun uzun boy avantajını kullanıp savunma yapması", "Sağlık topları ve değişik araçlarla hareketler yapması", "Ailesi ve kendisi için başarılı sporcu olmak istemesi", "Bacak kuvvetini geliştirmeye yönelik bacak presi yapması"], "a": 1, "e": "Doğru cevap: Sporcunun uzun boy avantajını kullanıp savunma yapması.", "kb": 1}, {"q": "Aşağıdakilerden hangisi antrenmanın temel işlevlerinden ilk antrenman hazırlığını oluşturur?", "o": ["Fiziksel hazırlık", "Teknik hazırlık", "Taktik hazırlık", "Zihinsel hazırlık", "Eğitim hazırlığı"], "a": 0, "e": "Doğru cevap: Fiziksel hazırlık.", "kb": 1}, {"q": "Aşağıdaki ikili ilişkilerden hangisi “Topu iyi tutamayan bir sporcu, pası istediği yere atamaz.” ifadesini doğru olarak açıklar?", "o": ["Fiziksel-Teknik", "Fiziksel-Taktik", "Teknik-Taktik", "Teknik-Zihinsel", "Zihinsel-Fiziksel"], "a": 2, "e": "Doğru cevap: Teknik-Taktik.", "kb": 1}, {"q": "Aşağıdakilerden hangisi zihinsel hazırlık ögelerinden biri değildir?", "o": ["Oyun zekasını iyi kullanması", "Antrenmanlarda üstlendiği rolleri yarışmaya taşıması", "Kendi kendine konuşması", "Dikkat ve konsantrasyonunu sağlaması", "Topu kontrol etmesi"], "a": 4, "e": "Doğru cevap: Topu kontrol etmesi.", "kb": 1}, {"q": "Aşağıdaki ifadelerden hangisi sporsal stil örneklerinden biri değildir?", "o": ["Maradona gibi çalım atması", "Hidayet gibi smaç yapması", "Shrapova gibi forehand vurması", "Fatih Terim gibi yorum yapması", "Naim Süleymanoğlu gibi ağırlık kaldırması"], "a": 3, "e": "Doğru cevap: Fatih Terim gibi yorum yapması.", "kb": 1}, {"q": "Aşağıdaki hazırlık antrenmanlarından hangisi Hazırlık Döneminin 1. evresinde ağırlıklı olarak uygulanmalıdır?", "o": ["Genel fiziksel hazırlık", "Özel fiziksel hazırlık", "Teknik hazırlık", "Taktik hazırlık", "Zihinsel hazırlık"], "a": 0, "e": "Doğru cevap: Genel fiziksel hazırlık.", "kb": 1}, {"q": "Başarılı antrenörlerin ve sporcuların deneyimlerinden yararlanmak, bu deneyimleri genelleştirmek ve uyarlamak, hangi hazırlık antrenmanının özelliklerinden biridir?", "o": ["Teknik hazırlık", "Taktik hazırlık", "Fiziksel hazırlık", "Zihinsel hazırlık", "Eğitim hazırlığı"], "a": 4, "e": "Doğru cevap: Eğitim hazırlığı.", "kb": 1}, {"q": "Aşağıdakilerden hangisi, bir sporcunun kendisini etkileyen algı, stres, motivasyon, eğitim ve motorik becerilerin üstesinden gelerek ilgili spor dalına hazırlanma işidir?", "o": ["Teknik hazırlık", "Taktik hazırlık", "Fiziksel hazırlık", "Zihinsel hazırlık", "Eğitim hazırlığı"], "a": 3, "e": "Doğru cevap: Zihinsel hazırlık.", "kb": 1}, {"q": "Taktiksel hazırlık, aşağıdaki hazırlık evrelerinden hangisinin başarıyla tamamlanmasına bağlıdır?", "o": ["Fiziksel hazırlık", "Teknik hazırlık", "Taktik hazırlık", "Zihinsel hazırlık", "Eğitim hazırlığı"], "a": 1, "e": "Doğru cevap: Teknik hazırlık.", "kb": 1}], "tf": [{"q": "Antrenman faktörleri piramidinin en üstünde psikolojik antrenman yer alır.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Sıralama: fiziksel, teknik, taktik, psikolojik.", "tf": true}, {"q": "Genel fiziksel hazırlıkta yüksek şiddette kısa süreli antrenman uygulanır.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Orta şiddette uzun süreli antrenman uygulanır.", "tf": true}, {"q": "Teknik öğrenilen, motorik özellik ise geliştirilen bir niteliktir.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Örneğin backhand vuruş öğrenilir, ön kol kuvveti geliştirilir.", "tf": true}, {"q": "Stilde tekniğin ana yapısı tamamen değişir.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Stilde modelin ana yapısı değişmez; kişisel uyarlamalar yapılır.", "tf": true}, {"q": "Zihinsel antrenman, hareketin fiziksel uygulama olmadan zihinde canlandırılmasıdır.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Yeni bir hareketin pasif öğrenme süreci olarak da tanımlanır.", "tf": true}, {"q": "Hata düzeltmede önce küçük hatalar, sonra ana hata düzeltilir.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Ana hata yan hatadan, büyük hata küçüklerden önce düzeltilir.", "tf": true}]}, {"id": "hab3", "title": "Antrenman İlkeleri ve Yüklenme", "cards": [{"title": "İlke ve kural farkı", "points": ["Antrenman ilkeleri, antrenman metodolojisi ve teorisinin **biyolojik, pedagojik, psikolojik ve sosyolojik** bilimlere dayalı üst düzey açıklamalarıdır.", "**İlkeler daha genel, kuramsal** bir kavramdır; **kurallar ise ilkeleri yorumlamaya ve somutlaştırmaya** yarar.", "**Harre (1982):** giderek artan yüklenme, yıl boyu yüklenme, periyotlama, devamlılık, bilinçlilik, sistemlilik, açıklık, anlaşılabilirlik ilkeleri.", "**Grosser:** uyum etkisi yaratacak yüklenme, döngülü yüklenme (periyotlama), özelleşme ve uygun oranlama ilkeleri. **Martin:** pedagojik, yapı-organizasyon, yöntem-içerik ilkeleri."]}, {"title": "Bilinçli katılım ve çok yönlü gelişim", "points": ["**Bilinçli ve aktif katılım ilkesi:** Sporcu antrenmanın amacını bilir; programdan haberdar edilir, yaratıcılığı desteklenir, **gerçekçi ve ulaşılabilir hedefler** belirlenir, zararlı alışkanlıklar önlenir.", "**Çok yönlü gelişim ilkesi:** Yüksek düzeyde özelleşmenin ön şartı **geniş ve çok yönlü temel fiziksel gelişimdir**. Özellikle **çocuk ve gençler** için gereklidir.", "Çok yönlü gelişim piramidi (alttan üste): **çok yönlü gelişim (çocukluk) → özel antrenman (gençler) → yüksek performans (olgunluk)**."]}, {"title": "Özelleşme (branşlaşma) ilkesi", "points": ["Doğru zamanda branşlaşma; branşa özgü antrenman organizmada **branşa özgü morfolojik ve fonksiyonel uyum** yaratır (antrenmanın spesifikliği).", "Branşa özel egzersizler: **branşa özgü egzersizler** ve **biyomotor becerileri geliştiren egzersizler**.", "Özelleştirme alanları: **metabolik, biyomekanik, kinetik-kinematik, fizyolojik**, antrenman deneyimi-atletik durum ilişkisi. (\"Sistematik özelleştirme\" bu listede yoktur.)", "Spora başlama/branşlaşma yaşı örnekleri: **yüzme 3-7 / 10-12**, artistik jimnastik 5-6 / 8-10, basketbol 7-8 / 10-12, futbol 10-12 / 11-13, voleybol 11-12 / 14-15, güreş 13-14 / 15-16, kürek 12-14 / 16-18."]}, {"title": "Bireyselleştirme, çeşitlilik, model antrenman", "points": ["**Bireyselleştirme:** Başarılı sporcuların programı başka sporculara aynen uygulanmamalı. Efor kapasitesi **biyolojik ve takvim yaşına**, antrenman altyapısına, sağlık durumuna, toparlanma hızına, vücut yapısı ve kişiliğe bağlıdır.", "**Çeşitlilik ilkesi:** Elit sporcu yılda ~**2000 saat** antrenman yapar; tekdüzelik sıkılmaya ve sürantrenmana yol açar. Çeşitlilik **monotonluğu önler**, antrenmanı sevdirir.", "**Model antrenman ilkesi:** Antrenmanların **yarışma şartlarına** (hava, zemin, seyirci, malzeme) uygun hâle getirilmesi. Model **bireye/takıma özgü** olmalı, başarılı birinin modeli **aynen taklit edilmemeli**.", "Model oluşturmada çevre, zemin, seyirci, malzeme gibi yarışma koşulları rol alır; **cinsiyet faktörü modelin oluşturulmasında rol almaz**."]}, {"title": "Geriye dönüşüm ve yıllık periyotlama ilkesi", "points": ["**Geriye dönüşüm ilkesi (detraining):** Antrenman kesilince kazanımlar antrenman öncesi düzeye döner. **Uzun sürede kazanılan yavaş, kısa sürede kazanılan hızlı** kaybolur.", "Belirtiler: yorgunluk, baş ağrısı, uykusuzluk, iştahsızlık, depresyon. Spor **birden değil kademeli** bırakılmalı.", "**Yıllık antrenman periyotlama ilkesi:** Bütün yıl boyunca, **aktif dinlenme** safhasını da içeren plan yapılır; amaç en iyi verim düzeyine ulaşmaktır."]}, {"title": "Yüklenme: tanım, iç ve dış yük", "points": ["**Yüklenme:** Plan çerçevesinde ölçüsü belirlenmiş, organizmada **morfolojik, fonksiyonel ve kimyasal** değişiklik yaratan etkinlik.", "**Dış yüklenme:** Antrenmanın kendisi: **şiddet, sıklık, süre, kapsam, dinlenme aralıkları** (mesafe, hız, kaldırılan ağırlık; GPS ve **video hareket analizi** ile ölçülen değerler).", "**İç yüklenme:** Dış yükün organizmada yarattığı fizyolojik, biyokimyasal ve psikolojik tepki: **kalp atım hızı, kan laktatı, algılanan zorluk (RPE)**. **Video hareket analizi iç yük değildir.**", "Yüklenme yaklaşımları: **standart, doğrusal (lineer), basamaklı, odaklanmış (konsantre), bağlantılı sıralanan, düz** yüklenme.", "**Doğrusal** yük sürekli artar → sürantrenman riski, sadece kısa süre uygulanmalı. **Basamaklı** (artış sonrası boşaltma) **yeni başlayanlara** uygundur.", "**Odaklanmış** yüklenmede verim artışı kesilmeden **4-12 hafta** sonra görülür. Odaklanmış, bağlantılı sıralanan ve düz yüklenme **sadece üst düzey sporculara** önerilir."]}, {"title": "Yüklenmenin dört ana öğesi", "points": ["Yüklenme nicelik ve nitelik bakımından **4 öğeden** oluşur: **şiddet, süre, sıklık, kapsam**. (\"Yüklenme türü\" bu öğelerden değildir.)", "**Şiddet:** Birim zamandaki iş, yani **işin zorluğu** (m/sn, kg/sn). **Şiddet ile kapsam ters orantılıdır**: şiddet artınca tekrar azalır.", "**Sıklık:** Yüklenme ve dinlenme arasındaki zamansal ilişki; kural olarak **haftadaki antrenman sayısı**.", "**Süre:** Hareket uyarısının organizmaya etki ettiği zaman.", "**Kapsam (hacim):** Tüm uyarıların süre ve tekrarı (km, tekrar sayısı, toplam kg/ton). Ulusal düzeyde cimnastikçi yılda ~800 saat, uluslararası düzeyde 1000+ saat çalışır."]}, {"title": "Artan yüklenme ve aşırı yüklenme", "points": ["**Artan yüklenme (overload) ilkesi:** Yük, sporcunun kapasitesine uygun olarak artırılmalı; organizma artan yüke uyum sağlar.", "Gelişme hızları: **esneklik günden güne, kuvvet haftadan haftaya, sürat aydan aya, dayanıklılık ay-yıl** içinde artar.", "Antrenman sıklığı arttıkça sporsal verim **doğru orantılı** artar; ama seyrek ve çok şiddetli antrenman sakatlık ve sürantrenman getirir.", "Yaygın hatalar: aşırı antrenman, antrenman azlığı, branşa uymayan egzersiz, programın sporcuyla paylaşılmaması, zirveden müsabakaya geçişte başarısızlık."]}, {"title": "Yüklenme-dinlenme dengesi", "points": ["**Süperkompanzasyon** kavramı **yüklenme ve dinlenmenin dengelenmesi ilkesi** ile ilişkilidir.", "**Tam dinlenme:** Organizmanın tamamen toparlanması için gereken sürenin tamamı. **Eksik dinlenme:** bu sürenin **üçte biri**.", "**Tam dinlenme gerektirenler:** dikkat ve koordinasyon, **maksimal kuvvet**, müsabakalar, teknik öğrenme, **sürat, reaksiyon, patlayıcı** hareketler.", "**Eksik dinlenme gerektirenler:** süratte ve kuvvette devamlılık, **temel ve özel dayanıklılık**, irade gücü çalışmaları.", "Dinlenme türleri: **aktif** (hafif alıştırmalarla) ve **pasif** (hiçbir şey yapmadan)."]}], "questions": [{"q": "Antrenman ilkeleri ile antrenman kuralları arasındaki farkı doğru açıklayan ifade hangisidir?", "o": ["İlkeler daha genel ve kuramsal, kurallar ise ilkeleri yorumlayıp somutlaştırır", "İkisi tamamen aynı kavramdır", "Kurallar daha genel, ilkeler daha somuttur", "İlkeler sadece takım sporlarında geçerlidir", "Kurallar biyolojik, ilkeler sosyolojiktir"], "a": 0, "e": "İlkeler olmadan kurallar bir şey ifade etmez."}, {"q": "Yüksek düzeyde özelleşmenin ön şartı olarak geniş temel fiziksel gelişimi vurgulayan ilke hangisidir?", "o": ["Çok yönlü gelişim ilkesi", "Özelleşme ilkesi", "Model antrenman ilkesi", "Bireyselleştirme ilkesi", "Geriye dönüşüm ilkesi"], "a": 0, "e": "Çocuk ve gençlerin antrenmanında özellikle önemlidir."}, {"q": "Aşağıdakilerden hangisi antrenmanda özelleşme ilkesine etki eden faktörlerden değildir?", "o": ["Fizyolojik özelleştirme", "Sistematik özelleştirme", "Kinetik ve kinematik özelleştirme", "Biyomekanik özelleştirme", "Metabolik özelleştirme"], "a": 1, "e": "Beşinci faktör antrenman deneyimi ve atletik durum ilişkisidir."}, {"q": "Antrenmanların yarışma şartlarına uygun hâle getirilerek yapılmasını öngören ilke hangisidir?", "o": ["Çeşitlilik ilkesi", "Geriye dönüşüm ilkesi", "Bilinçli katılım ilkesi", "Model antrenman ilkesi", "Çok yönlü gelişim ilkesi"], "a": 3, "e": "Model bireye/takıma özgü olmalı, aynen taklit edilmemelidir."}, {"q": "Aşağıdakilerden hangisi model antrenman ilkesinin oluşturulmasında rol almaz?", "o": ["Cinsiyet faktörü", "Hava koşulları", "Kullanılan malzeme", "Zemin/alan", "Seyirci"], "a": 0, "e": "Model, yarışmanın çevresel koşullarını içerir."}, {"q": "Aşağıdakilerden hangisi çeşitlilik ilkesinin sonuçlarından değildir?", "o": ["Sporcunun antrenmanı sevmesi", "Antrenmanların monotonlaşması", "Verimin artması", "Sürantrenman riskinin azalması", "Zihinsel sağlığın olumlu etkilenmesi"], "a": 1, "e": "Çeşitlilik ilkesi monotonluğu önler."}, {"q": "Antrenmansızlaşma (detraining) hangi ilkeyle ilişkilidir?", "o": ["Çok yönlü gelişim ilkesi", "Çeşitlilik ilkesi", "Bilinçli katılım ilkesi", "Geriye dönüşüm ilkesi", "Model antrenman ilkesi"], "a": 3, "e": "Kısa sürede kazanılanlar daha hızlı kaybolur."}, {"q": "Süperkompanzasyon kavramı hangi ilkeyle ilişkilidir?", "o": ["Yüklenme ve dinlenmenin dengelenmesi ilkesi", "Model antrenman ilkesi", "Bireyselleştirme ilkesi", "Çeşitlilik ilkesi", "Geriye dönüşüm ilkesi"], "a": 0, "e": "Yeterli dinlenme sonrası performans başlangıcın üzerine çıkar."}, {"q": "Yüklenme nicelik ve nitelik bakımından incelendiğinde hangisini içermez?", "o": ["Yüklenme türü", "Yüklenme sıklığı", "Yüklenme kapsamı", "Yüklenme şiddeti", "Yüklenme süresi"], "a": 0, "e": "Dört ana öğe: şiddet, süre, sıklık, kapsam."}, {"q": "Şiddet ile kapsam arasındaki ilişki nasıldır?", "o": ["Ters orantılıdır", "Her zaman eşittir", "Sadece dayanıklılıkta ilişkilidir", "Doğru orantılıdır", "İlişkisizdir"], "a": 0, "e": "Şiddet arttıkça tekrar sayısı azalır."}, {"q": "Kural olarak bir hafta içindeki antrenman sayısını ifade eden yüklenme öğesi hangisidir?", "o": ["Yüklenme sıklığı", "Yüklenme şiddeti", "Yüklenme türü", "Yüklenme süresi", "Yüklenme kapsamı"], "a": 0, "e": "Sıklık, yüklenme ve dinlenme arasındaki zamansal ilişkidir."}, {"q": "Aşağıdakilerden hangisi sporcularda iç yük değişkenine örnek olarak verilemez?", "o": ["Antrenman sonrası nabız toparlanması", "Algılanan zorluk derecesi (RPE)", "Video hareket analizi", "Kan laktat düzeyi", "Kalp atım hızı"], "a": 2, "e": "Video analizi, mesafe ve hız gibi dış yükü ölçer."}, {"q": "Artan yüklenme ilkesine göre hangi özellik \"günden güne\" gelişir?", "o": ["Dayanıklılık", "Sürat", "Esneklik", "Kuvvet", "Koordinasyon"], "a": 2, "e": "Kuvvet haftadan haftaya, sürat aydan aya, dayanıklılık ay-yıl içinde gelişir."}, {"q": "Aşağıdakilerden hangisi antrenman yükünün sürekli artırılması ilkesinin etkilerinden değildir?", "o": ["Kas liflerinin sayısının artması", "Dayanıklılığın ay-yıl içinde artması", "Esnekliğin günden güne artması", "Süratin aydan aya artması", "Kuvvetin haftadan haftaya artması"], "a": 0, "e": "Kitapta kas lifi sayısı artışı bu ilkenin etkileri arasında sayılmaz."}, {"q": "Aşağıdaki çalışmalardan hangisi tam dinlenme aralığı gerektirir?", "o": ["İrade gücü çalışması", "Süratte devamlılık", "Maksimal kuvvet çalışması", "Kuvvette devamlılık", "Temel dayanıklılık"], "a": 2, "e": "Sürat, reaksiyon, teknik ve patlayıcı çalışmalar da tam dinlenme ister."}, {"q": "Yeni başlayanlar için en uygun yüklenme yaklaşımı hangisidir?", "o": ["Düz yüklenme", "Sürekli doğrusal yüklenme", "Bağlantılı sıralanan yüklenme", "Basamaklı yüklenme", "Odaklanmış yüklenme"], "a": 3, "e": "Düz ve odaklanmış yüklenme sadece üst düzey sporculara önerilir."}, {"q": "Antrenman ilkeleri kavramını açıklayan ifade aşağıdakilerden hangisidir?", "o": ["Somut bir davranış yönergesidir.", "Antrenman metodolojisi ve teorisinin biyolojik, pedagojik, psikolojik ve sosyolojik bilimlere dayalı ilkeleri ile yapılan sporsal antrenmana ait üst düzeyde açıklamaları kapsar.", "Antrenman metodolojisi ve teorisinin biyolojik, pedagojik, psikolojik ve sosyolojik bilimlere dayalı ilkeleri ile yapılan antrenmanın kurallarını kapsar.", "Sporsal verimi yönlendirmede rolü olmayan kavramlar bütünüdür.", "Sporsal verimi yönetmede rolü olmayan kavramlar bütünüdür."], "a": 1, "e": "Doğru cevap: Antrenman metodolojisi ve teorisinin biyolojik, pedagojik, psikolojik ve sosyolojik bilimlere dayalı ilkeleri ile yapılan sporsal antrenmana ait üst düzeyde açıklamaları kapsar.", "kb": 1}, {"q": "Antrenman ilkeleri ile antrenman kuralları kavramları arasındaki farkı açıklayan ifade aşağıdakilerden hangisidir?", "o": ["İlkeler daha genel kuramsal bir kavram iken kurallar ise ilkeleri yorumlamaya ve somutlaştırmaya yarayan kavramlardır.", "İlkeler kuralları yorumlamaya ve somutlaştırmaya yararken kurallar daha genel kuramsal bir kavramdır.", "Antrenman ilkeleri ile antrenman kuralları kavramları arasındaki fark, spor dalına ait oyun kurallarıdır.", "Antrenman ilkeleri ile antrenman kuralları kavramları arasındaki fark, spor dalına ait antrenman metotlarıdır.", "Antrenman ilkeleri ile antrenman kuralları kavramları arasında fark yoktur."], "a": 0, "e": "Doğru cevap: İlkeler daha genel kuramsal bir kavram iken kurallar ise ilkeleri yorumlamaya ve somutlaştırmaya yarayan kavramlardır.", "kb": 1}, {"q": "Aşağıdaki antrenmanın branşlaşma (özelleşme) ilkesini açıklayan ifadelerden hangisi yanlıştır?", "o": ["İnsan organizmasının yaptığı aktivitelere uyum sağlama sürecini içerir.", "Spor dalına özel egzersizlere katılımı dolayısıyla organizmada o branşa özgü morfolojik ve fonksiyonel değişiklikleri içerir.", "Spor branşlarına göre farklılık göstermeksizin organizmada meydana gelen morfolojik ve fonksiyonel değişiklikleri içerir.", "Yapılan çalışmaya bağlı olarak organizmanın hem teknik ve taktik hem de fizyolojik uyum sağlama sürecini içerir.", "Başarı için doğru zamanda branşlaşma ve amalına özgü çalışmaları içerir."], "a": 2, "e": "Doğru cevap: Spor branşlarına göre farklılık göstermeksizin organizmada meydana gelen morfolojik ve fonksiyonel değişiklikleri içerir.", "kb": 1}, {"q": "Aşağıdakilerden hangisi antrenmanda branşlaşma (özelleşme) ilkesine etki eden faktörlerden biri değildir?", "o": ["Antrenman deneyimi ve atletik durum ilişkisinin özelleştirilmesi", "Metabolik ve biomekaniksel özelleştirme", "Kinetik ve kinematik özelleştirme", "Fizyolojik özelleştirme", "Sistematik özelleştirme"], "a": 4, "e": "Doğru cevap: Sistematik özelleştirme.", "kb": 1}, {"q": "Aşağıdakilerden hangisi antrenmanın çeşitlilik ilkesinin sonuçlarından biri değildir?", "o": ["Sporcunun antrenmanlarının monotonlaşmasına neden olur.", "Antrenmanın tek tipe bağlı kalınmaksızın çoklu eğitim drilleri ile işlenmesini sağlar.", "Sporcuların zihinsel ve psikolojik sağlığı üzerinde olumlu bir etki yaratır.", "Sporcunun antrenmanı sevmesini sağlar.", "Sporcunun sürantrene olmasına neden olur."], "a": 0, "e": "Doğru cevap: Sporcunun antrenmanlarının monotonlaşmasına neden olur.", "kb": 1}, {"q": "Aşağıdakilerden hangisi model antrenman ilkesinin oluşturulmasında rol almaz?", "o": ["Bireye veya takıma özgü hazırlanması", "Çevresel faktörler", "Antrenörün yarışmalarda edindiği tecrübeler", "Cinsiyet faktörü", "Yarışma şartlarına uygun hâle getirilerek yapılması"], "a": 3, "e": "Doğru cevap: Cinsiyet faktörü.", "kb": 1}, {"q": "Aşağıdakilerden hangisi antrenman yükünün sürekli artırılması ilkesinin sporcu üzerindeki etkilerinden biri değildir?", "o": ["Sürat/Hızın var olan genetik ve diğer özelliklerin düzeyine bağlı olarak aydan aya artması", "Esnekliğin günden güne artması", "Kuvvetin haftadan haftaya artması", "Kas liflerinin artması", "Dayanıklılığın ay-yıl süreci içerisinde artması"], "a": 3, "e": "Doğru cevap: Kas liflerinin artması.", "kb": 1}, {"q": "Süper kompenzasyon kavramı aşağıdaki ilkelerden hangisi ile ilişkilidir?", "o": ["Model antrenman ilkesi", "Antrenmanda yüklenme ve dinlenmenin dengelenmesi ilkesi", "Antrenman yükünün sürekli artırılması ilkesi (artan yüklenim)", "Antrenmanın özel olma ilkesi", "Çeşitlilik ilkesi"], "a": 1, "e": "Doğru cevap: Antrenmanda yüklenme ve dinlenmenin dengelenmesi ilkesi.", "kb": 1}, {"q": "Antrenmansızlaşma – Detraining kavramı aşağıdaki ilkelerden hangisi ile ilişkilidir?", "o": ["Antrenmanın özel olma ilkesi", "Antrenman yükünün sürekli artırılması ilkesi (artan yüklenim)", "Geriye dönüşüm ilkesi", "Antrenmanda yüklenme ve dinlenmenin dengelenmesi ilkesi", "Model antrenman ilkesi"], "a": 2, "e": "Doğru cevap: Geriye dönüşüm ilkesi.", "kb": 1}, {"q": "Yüklenme, nicelik ve nitelik bakımından incelendiğinde aşağıdakilerden hangisini içermez?", "o": ["Yüklenme kapsamı", "Yüklenme şiddeti", "Yüklenme süresi", "Yüklenme sıklığı", "Yüklenme türü"], "a": 4, "e": "Doğru cevap: Yüklenme türü.", "kb": 1}], "tf": [{"q": "Antrenman ilkeleri sadece biyolojik bilimlere dayanır.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Biyolojik, pedagojik, psikolojik ve sosyolojik bilimlere dayanır.", "tf": true}, {"q": "Başarılı bir sporcunun programı, farklı yaştaki sporculara aynen uygulanırsa aynı başarı elde edilir.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Bireyselleştirme ilkesi bunun bir yanılgı olduğunu vurgular.", "tf": true}, {"q": "Uzun sürede kazanılan performans, antrenman bırakılınca daha yavaş kaybolur.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Kısa sürede kazanılanlar hızlı kaybolur.", "tf": true}, {"q": "Doğrusal yüklenme uzun süre uygulanırsa sürantrenmana yol açabilir.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Bu nedenle yalnızca kısa süreler için önerilir.", "tf": true}, {"q": "Eksik dinlenme, tam toparlanma için gereken sürenin yarısıdır.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Eksik dinlenme gereken sürenin üçte biridir.", "tf": true}, {"q": "Kalp atım hızı bir iç yük göstergesidir.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "İç yük, dış yükün organizmada yarattığı tepkidir.", "tf": true}]}, {"id": "hab4", "title": "Biyomotor Özellikler", "cards": [{"title": "Temel ve tamamlayıcı motorik özellikler", "points": ["**Temel motorik özellikler: dayanıklılık, kuvvet, sürat.** **Tamamlayıcı motorik özellikler: esneklik ve beceri** (özel güçlülüğü sınırlar).", "Performans/sporsal verim, **temel ve tamamlayıcı motorik özelliklerin düzeyiyle** ilgilidir.", "Temel motorik özellikler antrenman yapılmasa da doğal olarak gelişir; örneğin kuvvet **25-30 yaşına** kadar gelişir.", "Özel yetenek sınavlarının ana unsurlarını sürat, dayanıklılık ve kuvvet belirler."]}, {"title": "Dayanıklılık", "points": ["**Dayanıklılık:** Sporcunun **fiziki ve fizyolojik yorgunluğa dayanma gücü**; uzun süren antrenman veya müsabakada **yorgunluğa karşı koyabilme** ve **çabuk toparlanabilme** yeteneği.", "Kalp-dolaşım, solunum, sinir sistemi ve psikolojik etkenlerle belirlenir. Maksimal dayanıklılık = **maksimal aerobik kapasite** (maksimal yüklenmede kullanılabilen **oksijen** miktarı; karbondioksit değil).", "Dayanıklılık antrenmanının etkileri: hızlı toparlanma, **vital kapasite artar**, kalp güçlenir, **aktif kılcal damar sayısı artar**, enerji kapasitesi artar.", "VO₂maks'ı etkileyen faktörler: kalp debisi, hemoglobin ve kan hacmi, kasın oksijen kullanma kapasitesi (mitokondri, kılcal damar), genetik, ya
