nden sorumludur."}, {"q": "Gerilmeye karşı en dirençli bağ dokusu lifi hangisidir?", "o": ["Kollajen lif", "Aktin filamenti", "Miyofibril", "Elastin lif", "Retiküler lif"], "a": 0, "e": "Kollajen boyunun ancak %8'i kadar esner; 1 mm² lif 10-20 kg taşır."}, {"q": "Uzunluğunun %150'si kadar gerilip bırakıldığında eski boyuna dönebilen lif hangisidir?", "o": ["Retiküler lif", "Miyozin", "Elastin lif", "Kollajen lif", "Tendon lifi"], "a": 2, "e": "Elastin lifler akciğer ve damarlarda boldur."}, {"q": "Omurlar arası diskleri ve dizdeki menisküsleri oluşturan kıkırdak tipi hangisidir?", "o": ["Elastik kıkırdak", "Hiyalin kıkırdak", "Retiküler kıkırdak", "Embriyonal kıkırdak", "Lifli kıkırdak"], "a": 4, "e": "Hiyalin kıkırdak eklem yüzeylerini, elastik kıkırdak kulağı oluşturur."}, {"q": "Büyüyen kemikte boy uzamasının gerçekleştiği bölüm hangisidir?", "o": ["Epifiz", "Periost", "Metafiz", "Havers kanalı", "Diafiz"], "a": 2, "e": "Metafiz 20-23 yaşlarında kemikleşir ve kemik büyümesi durur."}, {"q": "Kas lifinin en küçük işlev birimi olan, iki Z çizgisi arasındaki bölüme ne ad verilir?", "o": ["Sarkomer", "Miyofibril", "Fasikül", "Sarkolemma", "Motor ünite"], "a": 0, "e": "Kasılmada aktin filamentleri miyozinin ortasına doğru kayar."}, {"q": "Aşağıdakilerden hangisi Tip I (yavaş kasılan) kas liflerinin özelliğidir?", "o": ["Kalın ve hızlı olması", "Güç odaklı olması", "Mitokondriyum oranının fazla olması", "Anaerobik enerjinin baskın olması", "Beyaz renkli olması"], "a": 2, "e": "Tip I lifler kırmızı, ince, yavaş ve aerobiktir; dayanıklılığa yöneliktir."}, {"q": "Miyelinli aksonlarda uyarının atlayarak hızlı iletilmesini sağlayan miyelinsiz aralıklara ne denir?", "o": ["Schwann hücreleri", "Ranvier boğumları", "Motorik son plak", "Z çizgileri", "Dendritler"], "a": 1, "e": "Miyelin yalıtkan olduğu için uyarı boğumdan boğuma atlar."}, {"q": "Vücudu sağ ve sol olarak ikiye ayıran düzlem hangisidir?", "o": ["Frontal düzlem", "Transvers düzlem", "Horizontal düzlem", "Koronal düzlem", "Sagittal düzlem"], "a": 4, "e": "Tam ortadan geçen sagittal düzleme median düzlem denir."}, {"q": "Aşağıdaki hareketlerden hangisi frontal düzlemde gerçekleşir?", "o": ["Lateral fleksiyon", "İç rotasyon", "Ekstansiyon", "Dorsifleksiyon", "Fleksiyon"], "a": 0, "e": "Frontal düzlem hareketleri: abduksiyon-adduksiyon, lateral fleksiyon, inversiyon-eversiyon."}, {"q": "Bacağın laterale doğru vücuttan uzaklaştırılması hareketine ne ad verilir?", "o": ["Fleksiyon", "Rotasyon", "Eversiyon", "Adduksiyon", "Abduksiyon"], "a": 4, "e": "Orta hatta yaklaştırma ise adduksiyondur."}, {"q": "Parmak ucuna kalkma hareketi hangisidir?", "o": ["Dorsifleksiyon", "Pronasyon", "Plantar fleksiyon", "Eversiyon", "İnversiyon"], "a": 2, "e": "Topuk üzerine kalkmak dorsifleksiyondur."}, {"q": "Kas lifini doğrudan saran bağ dokusu kılıfına ne ad verilir?", "o": ["Sarkolemma", "Epimisyum", "Periost", "Perimisyum", "Endomisyum"], "a": 4, "e": "Fasikülü perimisyum, tüm kası epimisyum sarar."}, {"q": "Kas kasılma tiplerinde üretilebilen maksimal kuvvet büyükten küçüğe nasıl sıralanır?", "o": ["Konsantrik > Eksantrik > İzometrik", "Eksantrik > İzometrik > Konsantrik", "İzometrik > Eksantrik > Konsantrik", "Konsantrik > İzometrik > Eksantrik", "Eksantrik > Konsantrik > İzometrik"], "a": 1, "e": "Kas uzayarak kasılırken en yüksek kuvveti üretir."}, {"q": "Dorsifleksiyon hareketinde gastroknemius ve soleus kasları hangi görevi üstlenir?", "o": ["Sinerjist", "Agonist", "Antagonist", "Stabilizatör", "Fiksatör"], "a": 2, "e": "Agonist kas tibialis anteriordur."}, {"q": "Vücutta en sık görülen, hız avantajı sağlayan kaldıraç tipi hangisidir?", "o": ["Dairesel kaldıraç", "3. tip kaldıraç", "2. tip kaldıraç", "Kapalı kaldıraç", "1. tip kaldıraç"], "a": 1, "e": "Örnek: dirsek fleksiyonunda biceps brachii."}, {"q": "Kemiği kemiğe bağlayan yapı hangisidir?", "o": ["Menisküs", "Bursa", "Ligament", "Tendon", "Fasya"], "a": 2, "e": "Tendon ise kası kemiğe bağlar."}, {"q": "Tibia ile fibula arasındaki sıkı bağ dokusu bağlantısı hangi eklem tipine örnektir?", "o": ["Sinostoz", "Sinkondroz", "Sindesmoz", "Eyer eklem", "Diartroz"], "a": 2, "e": "Sinkondrozda bağlantıyı kıkırdak, sinostozda kemik yapar."}, {"q": "Aşağıdakilerden hangisi omurganın sagital eğriliklerinden değildir?", "o": ["Servikal lordoz", "Sakral kifoz", "Lumbal lordoz", "Torakal kifoz", "Skolyoz"], "a": 4, "e": "Skolyoz omurganın yana (frontal düzlemde) eğriliğidir."}, {"q": "Hücrede ribozom faaliyeti artarsa aşağıdakilerden hangisi artar?", "o": ["Su miktarı", "Amino asit miktarı", "Ozmotik basınç", "Protein miktarı", "ATP üretim miktarı"], "a": 3, "e": "Doğru cevap: Protein miktarı.", "kb": 1}, {"q": "Aşağıdakilerden hangisi frontal düzlemde gerçekleşen hareketlerden biri değildir?", "o": ["Abduksiyon", "Lateral fleksiyon", "İnversiyon", "Adduksiyon", "Ekstansiyon"], "a": 4, "e": "Doğru cevap: Ekstansiyon.", "kb": 1}, {"q": "Kas kasılma tiplerinde üretilebilecek maksimum kas kuvvetlerinin büyükten küçüğe sıralanışı aşağıdakilerden hangisidir?", "o": ["İzometrik – Eksantrik - Konsantrik", "Konsantrik – Eksantrik - İzometrik", "Eksantrik – Konsantrik - İzometrik", "Eksantrik – İzometrik -Konsantrik", "İzometrik – Konsantrik - Eksantrik"], "a": 3, "e": "Doğru cevap: Eksantrik – İzometrik -Konsantrik.", "kb": 1}, {"q": "Kemiği kemiğe bağlayan yapı aşağıdakilerden hangisidir?", "o": ["Ligament", "Tendon", "Kartilaj", "Diyafiz", "Kıkırdak"], "a": 0, "e": "Doğru cevap: Ligament.", "kb": 1}, {"q": "Gerilmeye karşı en dirençli lif tipi aşağıdakilerden hangisidir?", "o": ["Kollajen", "Elastin", "Retiküler", "Kas", "Kartilaj"], "a": 0, "e": "Doğru cevap: Kollajen.", "kb": 1}, {"q": "Radius ve humerus vücudun hangi bölgesindedir?", "o": ["Aksiyel iskelet", "Üst ekstremite", "Alt ekstremite", "Sırasıyla alt ve üst ekstremite", "Toraks"], "a": 1, "e": "Doğru cevap: Üst ekstremite.", "kb": 1}, {"q": "Bacağın laterale doğru vücuttan uzaklaştırılması hareketine ne ad verilir?", "o": ["Ekstansiyon", "Adduksiyon", "Abduksiyon", "Fleksiyon", "Protraksiyon"], "a": 2, "e": "Doğru cevap: Abduksiyon.", "kb": 1}, {"q": "Aşağıdaki terimlerden hangisi hareket sırasında, eklem hareketine karşı yönde kuvvet üreten kası ifade eder?", "o": ["Agonist", "Antagonist", "Sinerjist", "Stabilizatör", "İzotonik"], "a": 1, "e": "Doğru cevap: Antagonist.", "kb": 1}, {"q": "“Vücudumuzdaki eklemlerin birçoğu 3. tip kaldıraç olarak görev alırlar.” ifadesi hangi anlama gelir?", "o": ["Mekanik avantaj sağlarlar.", "Kuvvet kolu yük kolundan daha uzundur.", "Kas tendonu yük ile eklem aksisi arasındadır.", "Kas tendonu eklemden uzak bir noktaya bağlanmıştır.", "Az kuvvetle fazla yük kaldırabilirler."], "a": 2, "e": "Doğru cevap: Kas tendonu yük ile eklem aksisi arasındadır.", "kb": 1}, {"q": "Aşağıdakilerden hangisinde kas komponentleri büyükten küçüğe doğru sıralanmıştır?", "o": ["Kas fibrili - sarkomer - myofilament - myofibril", "Kas - fasikül - kas fibrili - myofibril", "Sarkomer - fasikül - myofibril - myofilament", "Kas - kas fibrili - myosin - myofibril", "Fasikül - myofilament - kas fibrili - sarkomer"], "a": 1, "e": "Doğru cevap: Kas - fasikül - kas fibrili - myofibril.", "kb": 1}], "tf": [{"q": "Sinir hücreleri dışındaki bütün hücreler bölünerek çoğalabilir.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Kitap: Sinir hücreleri dışındaki bütün hücreler ikiye bölünerek çoğalabilir.", "tf": true}, {"q": "Kıkırdak dokusunda bol miktarda kan damarı ve sinir bulunur.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Kıkırdakta kan damarı ve sinir yoktur; beslenme difüzyonla olur.", "tf": true}, {"q": "Hiyalin kıkırdak vücudun bütün eklem yüzeylerini kaplar.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Lifli kıkırdak disk ve menisküste, elastik kıkırdak kulakta bulunur.", "tf": true}, {"q": "Pennat kaslarda kas lifleri tendona paralel dizilir.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Paralel diziliş fusiform kaslarda görülür; pennat kaslarda lifler açılı bağlanır.", "tf": true}, {"q": "2. tip kaldıraçta kuvvet kolu yük kolundan uzun olduğu için mekanik avantaj vardır.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Örnek: parmak ucuna kalkarken gastroknemius.", "tf": true}, {"q": "Omuz ekleminde eklem çanağı derin olduğu için çıkık riski kalçaya göre azdır.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Omuz soketi sığdır; hareket serbestliği fazla ama çıkık riski yüksektir.", "tf": true}]}, {"id": "ssb2", "title": "Spor Fizyolojisi", "cards": [{"title": "Fizyoloji ve canlının özellikleri", "points": ["Fizyoloji: Latince **\"physus\" (yaşam) + \"logos\" (bilim)**. Canlıdaki yapı ve organların görevlerini inceler.", "**Egzersiz ve spor fizyolojisi:** Organizmanın kassal çalışmaya **cevabını ve uyumunu**, performansı artıran antrenmanların fizyolojik temellerini inceler.", "Canlının ortak özellikleri: hücre yapısı, beslenme, solunum-ATP üretimi, metabolizma, boşaltım, hareket, **uyarılabilirlik**, homeostaz, adaptasyon, büyüme-gelişme, üreme.", "**Uyarılabilirlik:** İç/dış kaynaklı elektrik sinyali, hormon ve salgı değişikliklerini algılayıp cevap verebilme.", "**Metabolizma:** Yapım ve yıkım tepkimelerinin tümü. **Anabolizma** = basit moleküllerden büyük molekül yapımı (amino asitten protein). **Katabolizma** = büyük moleküllerin parçalanması.", "**Bazal metabolizma:** Uyku dışında tam dinlenmede yaşamı sürdürmek için gereken minimum enerji."]}, {"title": "Organizasyon ve vücut sıvıları", "points": ["Vücut ağırlığının **%96,3'ü** dört elementtir: **oksijen, karbon, hidrojen, azot**.", "Dört organik bileşen: **karbonhidrat, lipit, protein, nükleik asit** (DNA, RNA).", "Vücutta **4 doku** vardır: **bağ doku** (en yaygın), epitel, kas, sinir.", "Vücut ağırlığının **~%60'ı sudur**; hücrenin **%70-85'i** sudur. Vücut sıvısının **2/3'ü hücre içi** (ICF), **1/3'ü hücre dışı** (ECF).", "Hücre dışı sıvının **3/4'ü interstisyel sıvı**, **1/4'ü kan plazması**. Hücre dışında **sodyum, klor, bikarbonat**; hücre içinde **potasyum, magnezyum** fazladır.", "Hücre dışı sıvıya **\"iç ortam\" (milieu interieur)** diyen: **Claude Bernard**."]}, {"title": "Homeostaz ve geri bildirim", "points": ["**Homeostaz:** İç ortamın yaklaşık sabit koşullarda korunması. Terimi ilk kullanan: **Walter Cannon**.", "Örnek: Egzersizde artan ısı **terle** atılır, vücut ısısı dengelenir.", "**Negatif geri bildirim:** Yanıt, başlatan etkiye **zıt yöndedir**; vücuttaki kontrol sistemlerinin çoğu böyledir. Örnek: CO₂ artınca solunumun artması, vücut ısısı ve **kan şekerinin pankreasla** düzenlenmesi.", "**Pozitif geri bildirim:** Değişikliği **artırır**, daha seyrektir. Yararlı örneği: **kanın pıhtılaşması**."]}, {"title": "Hücre ve hücre zarı", "points": ["Hücreyi **1665'te Robert Hooke** keşfetti (şişe mantarında \"cellula\").", "**Prokaryot** hücre: çekirdek zarı yok (bakteriler). **Ökaryot** hücre: zarla çevrili çekirdek ve organeller var. İnsanda **~100 trilyon** hücre, ~200 hücre tipi vardır.", "Protoplazmanın 5 temel maddesi: **su, elektrolitler, proteinler, lipitler, karbonhidratlar**. Sudan sonra en çok bulunan: **protein** (%10-20).", "Hücre zarı **akıcı mozaik modeli** ile açıklanır (Singer ve Nicholson, 1972): **çift katlı fosfolipit** + gömülü proteinler. Bileşimi ~%55 protein, %25 fosfolipit, %13 kolesterol.", "Hücre zarı **seçici geçirgendir**. Oksijen, karbondioksit, alkol gibi **yağda çözünenler** kolay geçer; iyon, glikoz ve üre geçemez.", "Hücre yüzeyini örten karbonhidrat örtüye **glikokaliks** denir; hormon (insülin) reseptörü ve hücre tanıma görevi vardır."]}, {"title": "Hücre zarında taşınma", "points": ["**Pasif taşıma** (ATP harcanmaz, çoktan aza): **difüzyon** (basit ve kolaylaştırılmış) ve **ozmoz**.", "**Basit difüzyon:** taşıyıcısız (O₂, CO₂, alkol). **Kolaylaştırılmış difüzyon:** taşıyıcı proteinle (glikoz, fruktoz, amino asit).", "Difüzyon hızını artıranlar: **yoğunluk farkının artması, sıcaklığın artması, yüzeyin genişlemesi**, molekülün küçük olması.", "**Ozmoz:** Suyun yarı geçirgen zardan geçişi. Hipertonik ortamda büzülme **plazmoliz**, hipotonik ortamda şişme **deplazmoliz**.", "**Aktif taşıma** (ATP harcanır, azdan çoğa): **aktif transport** (örn. **sodyum-potasyum pompası**), **endositoz** ve **ekzositoz**.", "Endositoz: **fagositoz** (katı madde, \"yeme\") ve **pinositoz** (sıvı, \"içme\"). **Ekzositoz:** büyük moleküllerin hücre dışına atılması."]}, {"title": "Hücre organelleri", "points": ["**Membranlı:** endoplazmik retikulum, Golgi, mitokondri, lizozom, peroksizom. **Membransız:** **ribozom**, sentriyol, mikrotübül, filamentler.", "**Granüllü ER:** üzerinde ribozom vardır, **protein** sentezler. **Düz ER:** **lipit** sentezi, karaciğerde glikojen depolama, kasta **kalsiyum** depolama.", "**Ribozom:** protein sentezinin yapıldığı organel. **Golgi:** maddeleri işler, **paketler**, salgılar; alyuvar ve spermde yoktur.", "**Lizozom:** hücre içi **sindirim** (~40 hidrolitik enzim, pH ~5). Zarı yırtılırsa hücre kendini sindirir: **otoliz**.", "**Peroksizom:** oksidaz enzimleri; karaciğerde **alkol** gibi zehirli maddeleri zararsız hâle getirir.", "**Mitokondri:** hücrenin **enerji santrali**; ATP burada üretilir. **Kendi DNA'sı ve ribozomu** vardır. Alyuvarda mitokondri yoktur.", "**Çekirdekçik (nükleolus):** ribozomal RNA sentezler; bölünmede kaybolur."]}, {"title": "Enerji, iş, güç ve ATP", "points": ["**1 kalori:** 1 g suyu 1 °C ısıtan enerji. **1 kkal** = 1000 kal (1 kg su).", "**İş = kuvvet × mesafe** (birimi joule / Nm). **Güç = iş / zaman**, birimi **watt**.", "Vücudun **doğrudan enerji kaynağı ATP**'dir; besinler dolaylı kaynaktır.", "ATP'nin son fosfat bağı koparılınca **ADP + Pi + ~7,3 kkal** enerji açığa çıkar.", "ATP sentezi üç sistemle olur: **ATP-CP (fosfojen)**, **laktik asit (anaerobik glikoliz)**, **aerobik (oksijen) sistem**. İlk ikisi birlikte **anaerobik** sistemi oluşturur."]}, {"title": "ATP-CP (fosfojen) sistemi", "points": ["Kas içi depolanmış **ATP ve kreatin fosfat (CP)** kullanılır; **oksijen gerekmez**, en hızlı sistemdir.", "Vücuttaki ATP deposu ~**85 g**; CP depoları ATP'nin **3-5 katıdır**. Her 1 mol CP → 1 mol ATP.", "Süre: yaklaşık **10-15 saniyelik** maksimal işler (örn. **100 m koşu**, sıçrama, atma, smaç, halter).", "Diğer adı: **alaktik anaerobik** sistem. CP hızlı tükenir ama dinlenmede **çok hızlı yenilenir**.", "**6-10 saniyelik** aralıklı sürat çalışmaları ATP-CP depolarını artırır."]}, {"title": "Laktik asit sistemi", "points": ["Oksijensiz ortamda **yalnız karbonhidrat** (glikoz/glikojen) **sitoplazmada** parçalanır: glikoz → **pirüvik asit → laktik asit**.", "ATP verimi: **kan glikozundan 2 mol**, **kas glikojeninden 3 mol** ATP. Aerobik yolun ~**%5'i** kadar ama ~2,5 kat daha hızlı.", "Süre: yaklaşık **45 sn - 2/3 dk**; örn. **400-800 m** koşu, 100-200 m yüzme.", "Kan laktatı dinlenmede ~**1 mmol/L**, yoğun egzersizde **16-20 mmol/L**. Asit birikimi pH'ı düşürür, enzimleri engeller → **yorgunluk**.", "Laktik asidin uzaklaştırılması: **~%72'si pirüvik aside dönüp aerobik sistemde yakılır**, **~%18'i glikoz/glikojene** dönüşür; geri kalanı başka yollarla (proteine dönüşme, terle/idrarla az miktarda atılma) olur. Laktik asidin **proteine dönüşmesi** temel uzaklaştırma yolu sayılmaz."]}, {"title": "Aerobik (oksijen) sistem", "points": ["**Mitokondride** karbonhidrat, yağ ve gerekirse protein **oksijenle** tamamen parçalanır; son ürünler **CO₂ ve H₂O**.", "Aşamalar: **aerobik glikoliz** → **Krebs çemberi** (ortak yol, Asetil-CoA ile başlar) → **elektron transfer sistemi** (oksijen kullanılır, su oluşur).", "ATP verimi: **1 mol glikozdan 38-39 mol**, **yağlardan 129 mol** ATP. Yağdan enerji üretebilen **tek sistemdir**.", "Yağ asitlerinin Asetil-CoA'ya dönüşmesi: **beta-oksidasyon**. Trigliserit = 1 gliserol + **3 yağ asidi**.", "Proteinler normalde enerji için kullanılmaz; uzun açlık, karbonhidrat eksikliği ve çok uzun dayanıklılık işlerinde önem kazanır.", "Sistem karşılaştırması: ATP-CP **çok hızlı-az**, laktik asit **hızlı-sınırlı**, aerobik **yavaş-sürekli**."]}, {"title": "Dinlenme ve egzersizde enerji", "points": ["Dinlenmede yalnız **aerobik sistem** çalışır; enerjinin **2/3'ü yağlardan**, 1/3'ü glikozdan gelir. Kanda yine de az miktarda sabit laktat bulunur (LDH enzimi).", "Oksijen kullanımının tam devreye girmesi **2-3 dakika** sürer. Bu dönemdeki eksik oksijene **oksijen açığı (borçlanması)** denir.", "Uzun egzersizde oksijen tüketimi **3-4. dakikada** **kararlı dengeye (plato)** ulaşır.", "Uzun egzersizde yorgunluk laktattan değil, **glikojen depolarının azalması** ile **su-elektrolit kaybından** kaynaklanır.", "**100 m** sadece fosfojen; **200 m** fosfojen + laktik asit; **1500 m** başta-sonda anaerobik, ortada aerobik; **maraton** aerobik. **Futbol** aerobik ağırlıklı ama tekrarlı sprintler nedeniyle anaerobik de kullanılır.", "Sporcu erkek dakikada ~**5 L O₂**, sedanter erkek ~3,2 L tüketebilir."]}], "questions": [{"q": "\"Basit moleküllerden büyük moleküllerin yapılması\" hangi kavramla ifade edilir?", "o": ["Homeostaz", "Bazal metabolizma", "Oksidasyon", "Anabolizma", "Katabolizma"], "a": 3, "e": "Örnek: amino asitlerden protein yapılması."}, {"q": "Vücuttaki homeostatik kontrol mekanizmalarının çoğu hangi sistemle çalışır?", "o": ["Negatif geri bildirim", "Fagositoz", "Aktif taşıma", "Ozmoz", "Pozitif geri bildirim"], "a": 0, "e": "Negatif geri bildirimde yanıt, başlatan etkiye zıt yöndedir."}, {"q": "Pozitif geri bildirimin vücut yararına çalıştığı örnek hangisidir?", "o": ["CO₂ artınca solunumun hızlanması", "Vücut ısısının terlemeyle düşmesi", "Kan pH'ının dengelenmesi", "Kan şekerinin pankreasla düzenlenmesi", "Kanın pıhtılaşması"], "a": 4, "e": "Diğerleri negatif geri bildirim örnekleridir."}, {"q": "Yetişkin vücut sıvısının ne kadarı hücre içindedir?", "o": ["1/3'ü", "1/2'si", "1/4'ü", "2/3'ü", "3/4'ü"], "a": 3, "e": "Kalan 1/3'ü hücre dışı sıvıdır."}, {"q": "Glikoz ve amino asitlerin taşıyıcı protein aracılığıyla, enerji harcanmadan zardan geçişine ne ad verilir?", "o": ["Ekzositoz", "Aktif transport", "Kolaylaştırılmış difüzyon", "Pinositoz", "Basit difüzyon"], "a": 2, "e": "Basit difüzyon taşıyıcı gerektirmez (O₂, CO₂, alkol)."}, {"q": "Aşağıdakilerden hangisi aktif taşımaya örnektir?", "o": ["Sodyum-potasyum pompası", "Kolaylaştırılmış difüzyon", "Ozmoz", "Basit difüzyon", "Oksijenin kana geçişi"], "a": 0, "e": "Aktif taşımada ATP harcanır ve madde azdan çoğa taşınır."}, {"q": "Hücrenin enerji üretim merkezi olan organel hangisidir?", "o": ["Golgi aygıtı", "Sentriyol", "Lizozom", "Ribozom", "Mitokondri"], "a": 4, "e": "Mitokondrinin kendi DNA'sı vardır, kendini çoğaltabilir."}, {"q": "Kas hücresinde kasılma için gerekli kalsiyumu depolayan yapı hangisidir?", "o": ["Golgi aygıtı", "Düz (sarkoplazmik) endoplazmik retikulum", "Peroksizom", "Çekirdekçik", "Lizozom"], "a": 1, "e": "Kas hücresinin endoplazmik retikulumuna sarkoplazmik retikulum denir."}, {"q": "Karaciğerde alkol gibi zararlı maddeleri zararsız hâle getiren organel hangisidir?", "o": ["Lizozom", "Sentriyol", "Ribozom", "Golgi aygıtı", "Peroksizom"], "a": 4, "e": "Peroksizomlar oksidaz enzimleri içerir."}, {"q": "Birim zamanda yapılan iş hangi kavramla ifade edilir?", "o": ["Kuvvet", "Tork", "Kalori", "Güç", "Enerji"], "a": 3, "e": "Güç birimi watt'tır (joule/saniye)."}, {"q": "100 m koşusu için gereken enerji başlıca hangi sistemden sağlanır?", "o": ["Laktik asit sistemi", "Beta-oksidasyon", "ATP-CP (fosfojen) sistemi", "Aerobik sistem", "Krebs çemberi"], "a": 2, "e": "ATP-CP yaklaşık 10-15 saniyelik maksimal işleri karşılar."}, {"q": "Anaerobik glikolizde kan glikozundan kaç mol ATP elde edilir?", "o": ["2 mol", "129 mol", "3 mol", "38 mol", "1 mol"], "a": 0, "e": "Kas glikojeninden 3 mol elde edilir; aradaki 1 mol kan glikozunun işlenmesine harcanır."}, {"q": "Laktik asit sisteminin enerji kaynağı hangisidir?", "o": ["Gliserol", "Glikoz/glikojen", "Protein", "Yağ asitleri", "Kreatin fosfat"], "a": 1, "e": "Bu sistemde yalnızca karbonhidratlar kullanılır."}, {"q": "Aerobik sistemde yağlardan kaç mol ATP elde edilir?", "o": ["129 mol", "85 mol", "38-39 mol", "2 mol", "3 mol"], "a": 0, "e": "Glikozdan 38-39 mol ATP elde edilir."}, {"q": "Aerobik enerji sisteminin son ürünleri hangileridir?", "o": ["Karbondioksit ve su", "Pirüvik asit", "Amonyak ve üre", "Kreatin ve fosfat", "Laktik asit ve su"], "a": 0, "e": "Aerobik sistemde laktik asit gibi yorgunluk yapan bir ürün oluşmaz."}, {"q": "Biriken laktik asidin en büyük kısmı nasıl uzaklaştırılır?", "o": ["Proteine dönüşerek", "Terle atılarak", "İdrarla atılarak", "Glikojene dönüşerek", "Pirüvik aside dönüşüp aerobik sistemde kullanılarak"], "a": 4, "e": "Yaklaşık %72'si bu yolla, %18'i glikoz/glikojene dönüşerek uzaklaştırılır."}, {"q": "Uzun süreli düşük şiddetli egzersizlerde yorgunluğun temel nedeni hangisidir?", "o": ["Kalsiyum birikimi", "Glikojen depolarının azalması ve su-elektrolit kaybı", "Laktik asit birikimi", "Oksijen fazlalığı", "CP depolarının tükenmesi"], "a": 1, "e": "Kararlı dengeye ulaşıldığı için laktat fazla birikmez."}, {"q": "Kalbin en kalın katmanını oluşturan kas tabakası hangisidir?", "o": ["Epikard", "Miyokard", "Perikard", "Endomisyum", "Endokard"], "a": 1, "e": "Miyokard kalbin kasılmasını sağlar."}, {"q": "Uyarılan motor ünitenin ya tamamen kasılması ya da hiç kasılmaması hangi ilkeyle açıklanır?", "o": ["Wolff kanunu", "Aşırı yüklenme ilkesi", "Süperkompansasyon", "Hep ya da hiç kanunu", "Negatif geri bildirim"], "a": 3, "e": "Sinir uyarısının iletimi de bu ilkeye uyar."}, {"q": "Anaerobik enerji sisteminde kan glikozundan kaç mol ATP elde edilir?", "o": ["3 mol", "39 mol", "2 mol", "129 mol", "38 mol"], "a": 2, "e": "Doğru cevap: 2 mol.", "kb": 1}, {"q": "Aerobik enerji sisteminde son ürün aşağıdakilerden hangisidir?", "o": ["Laktik asit", "Pürivik asit", "Oksijen", "Karbondioksit", "Laktat"], "a": 3, "e": "Doğru cevap: Karbondioksit.", "kb": 1}, {"q": "Laktik asit enerji sisteminde enerji kaynağı aşağıdakilerden hangisidir?", "o": ["Glikoz", "Glikojen+yağlar", "Glikojen+proteinler", "Kreatin fosfat", "Kreatin fosfat+yağlar"], "a": 0, "e": "Doğru cevap: Glikoz.", "kb": 1}, {"q": "Bir canlının iç kaynaklı veya dış kaynaklı elektrik sinyali, hormon ve salgı bezlerindeki değişiklikleri algılayıp cevap vererek reaksiyon göstermesi hangi karakteristik özelliğini belirtir?", "o": ["Adaptasyon", "Uyarılabilirlik", "Üreme", "ATP üretimi", "Metabolizma"], "a": 1, "e": "Doğru cevap: Uyarılabilirlik.", "kb": 1}, {"q": "Aerobik enerji sisteminde yağlardan kaç mol ATP elde edilir?", "o": ["2 mol", "3 mol", "39 mol", "129 mol", "132 mol"], "a": 3, "e": "Doğru cevap: 129 mol.", "kb": 1}, {"q": "“Basit moleküllerden büyük moleküllerin yapılması” aşağıdaki kavramlardan hangisi ile ifade edilir?", "o": ["Adaptasyon", "Homeostaz", "Anabolizma", "Katabolizma", "Gelişme"], "a": 2, "e": "Doğru cevap: Anabolizma.", "kb": 1}, {"q": "I. Ribozom\nII. Mitokondri\nIII. Endoplazmik retikulum\nIV. Lizozom\nV. Çekirdekçik\nYukarıdakilerden hangileri hücrenin membranöz yapılarındandır?", "o": ["I ve II", "I, II ve III", "II, III ve IV", "I, IV ve V", "II, III, IV ve V"], "a": 2, "e": "Doğru cevap: II, III ve IV.", "kb": 1}, {"q": "“Birim zamanda ortaya konan iş ………….. olarak ifade edilmektedir.” ifadesinde boş bırakılan yere aşağıdakilerden hangisi getirilmelidir?", "o": ["enerji", "güç", "iş", "kinetik enerji", "kuvvet"], "a": 1, "e": "Doğru cevap: güç.", "kb": 1}, {"q": "Hücrenin enerji üretim merkezi hangi hücre organelidir?", "o": ["Ribozom", "Golgi aygıtı", "Endoplazmik retikulum", "Mitokondri", "Çekirdek"], "a": 3, "e": "Doğru cevap: Mitokondri.", "kb": 1}, {"q": "I. Difüzyon\nII. Ozmoz\nIII. Fagositoz\nIV. Ekzositoz\nV. Pinositoz\nYukarıdakilerden hangileri hücre zarında aktif taşıma içerisinde yer alır?", "o": ["I, II, III ve IV", "II, III ve IV", "I, II ve IV", "II, III, IV ve V", "III, IV ve V"], "a": 4, "e": "Doğru cevap: III, IV ve V.", "kb": 1}], "tf": [{"q": "Dinlenmede enerjinin büyük bölümü yağlardan sağlanır.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Dinlenmede enerjinin 2/3'ü yağlardan, 1/3'ü glikozdan gelir.", "tf": true}, {"q": "Laktik asit sistemi hücrenin mitokondrisinde çalışır.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Anaerobik glikoliz sitoplazmada gerçekleşir; aerobik sistem mitokondridedir.", "tf": true}, {"q": "Kreatin fosfat depoları ATP depolarından 3-5 kat daha fazladır.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Buna rağmen fosfojen sistem ancak 10-15 saniye yeter.", "tf": true}, {"q": "Yağlar yalnızca aerobik sistemde enerji kaynağı olarak kullanılabilir.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Aerobik sistem, yağların kullanılabildiği tek sistemdir.", "tf": true}, {"q": "Oksijen tüketimi egzersizin ilk saniyesinde ihtiyaç düzeyine ulaşır.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Oksijen kullanımının artması 2-3 dakika sürer; aradaki eksiklik oksijen açığıdır.", "tf": true}, {"q": "Lizozom zarı yırtılırsa hücre kendi kendini sindirir; buna otoliz denir.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Lizozom hücre içi sindirimden sorumludur.", "tf": true}]}, {"id": "ssb3", "title": "Sporda Beslenme", "cards": [{"title": "Beslenmenin önemi ve enerji ihtiyacı", "points": ["Sporcu beslenmesinde **öncelik sağlığın korunmasıdır**. Doğru beslenme toparlanmayı hızlandırır, bağışıklığı destekler, uyku kalitesini ve konsantrasyonu artırır.", "**Yeterli beslenme:** gereken enerjiyi karşılamak. **Dengeli beslenme:** tüm besin öğelerini ihtiyaca en uygun şekilde ve sağlığı koruyacak biçimde karşılamak.", "Çocukların kilogram başına enerji harcaması yüksektir: 7 yaşındaki çocuk yetişkinden **~%25** fazla harcar. 8-10 yaş **%20-25**, 11-14 yaş **%10-15** daha fazla kalori almalıdır.", "Çocuk sporcuda yetersiz enerji: ergenlikte gecikme, boy uzamasında aksama, kemik gelişim sorunları, sakatlık riskinde artış.", "Üst düzey dayanıklılık sporcularında günlük ihtiyaç **10.000 kkal** ve üzerine çıkabilir."]}, {"title": "Besin öğeleri ve enerji değerleri", "points": ["**Makro (enerji veren) besin öğeleri:** **karbonhidrat, protein, yağ**. Vitamin, mineral ve su **enerji vermez** ama enerji oluşumuna yardım eder.", "1 gramın verdiği enerji: **karbonhidrat 4 kkal, protein 4 kkal, yağ 9 kkal**. 1 kalori ≈ 4,184 joule.", "Günlük enerji = **bazal metabolizma (%60-75)** + besinlerin termik etkisi (~%10) + fiziksel aktivite.", "Kas kütlesi fazla olanların ve erkeklerin bazal metabolizması daha yüksektir. Pratikte en çok kullanılan formül: **Harris-Benedict**.", "Sporcuda diyet dağılımı: **karbonhidrat %55-70**, **protein %15-20**, **yağ %15-25**."]}, {"title": "Karbonhidratlar", "points": ["**Monosakkaritler:** glikoz, **fruktoz (meyve şekeri)**, **galaktoz**. **Disakkaritler:** **laktoz** (süt şekeri = glikoz+galaktoz), **sukroz** (sofra şekeri = glikoz+fruktoz), **maltoz** (glikoz+glikoz). **Polisakkaritler:** glikojen, nişasta, selüloz.", "**Basit** karbonhidrat (şeker, bal, reçel) hızlı emilir, **glisemik indeksi yüksektir**. **Kompleks** karbonhidrat (ekmek, makarna, tahıl, baklagil) yavaş emilir. Günlük karbonhidratın **%80-85'i kompleks** olmalı.", "Depolar: **karaciğerde ~100 g**, **kasta 300-400 g** glikojen, kanda 15-20 g glikoz. Karaciğer glikojeni **24 saatlik açlıkta** neredeyse tükenir.", "Sporcuda karbonhidrat toplam kalorinin **%60-65**'i (dönemine göre %70'e kadar). Günlük ihtiyaç: <1 saat antrenman **3-5 g/kg**, 1-3 saat **6-10 g/kg**, 4-5 saat ve üzeri **10-12 g/kg**.", "Beynin en önemli yakıtı **glikozdur**."]}, {"title": "Antrenman öncesi, sırası ve sonrası karbonhidrat", "points": ["Antrenmandan **3-4 saat önce**: **düşük-orta glisemik indeksli katı karbonhidrat** ağırlıklı, düşük yağlı ve düşük posalı büyük öğün.", "Antrenmandan **1 saat önce** katı gıdadan kaçınılmalı.", "Antrenman sırasında (1 saati aşınca): **%6-8 karbonhidratlı** sporcu içeceği, **her 15-20 dakikada 150-250 ml**; saatte ~**60 g** karbonhidrat. 30 °C üstü sıcakta veya çok uzun antrenmanda ihtiyaç **%50 artar**.", "Antrenman sonrası: **ilk 2 saat kritik**; hemen **yüksek glisemik indeksli** karbonhidrat (~1,5 g/kg) ve yanında protein. Diyet profili: **yüksek karbonhidrat, orta protein, düşük yağ**.", "Doğru beslenmeyle glikojen **24-48 saatte**, kötü beslenmeyle ancak **72 saatte** dolar.", "**Modern karbonhidrat yüklemesi:** yarışmadan **5-7 gün önce** karbonhidrat 10-12 g/kg'a çıkarılır, antrenman yükü azaltılır. Her gram glikojen **3 g su** tutar."]}, {"title": "Proteinler", "points": ["Proteinin birincil işlevi **büyüme, onarım ve yenileme**dir; enerji metabolizmasında karbonhidrat ve yağ kadar yer almaz.", "22 amino asitten **8'i esansiyeldir** (vücut yapamaz): **lösin, izolösin, valin**, fenilalanin, lizin, treonin, metiyonin, triptofan. Çocuklarda **histidin ve arginin** de esansiyeldir.", "**Dallı zincirli amino asitler (BCAA): lösin, izolösin, valin.** Glikojen tükenince antrenmanın ileri evrelerinde enerjiye **~%10** katkı sağlar. **Glutamin BCAA değildir.**", "**Hayvansal protein** daha kalitelidir (yumurta, et, süt %91-100 kullanılabilir). Bitkisel proteinler esansiyel amino asit bakımından **eksiktir**; bezelye+pirinç gibi karıştırılarak tamamlanabilir. Yumurta ve anne sütü en kaliteli proteindir.", "Yüksek protein kaynakları: et, tavuk, balık, yumurta, süt ürünleri, baklagiller. **Ispanak** gibi yapraklı sebzeler protein kaynağı değildir.", "Günlük ihtiyaç: sedanter **0,8-1 g/kg**, dayanıklılık **1,2-1,7 g/kg**, kuvvet-güç **1,6-2,2 g/kg**, kas kütlesi artışı dönemlerinde kitap metnine göre **2,5-3 g/kg**.", "Öğün başına **20-40 g** kaliteli protein, **3-4 saatte bir**. Uykudan **yarım saat önce 30-40 g kazein** (süt, yoğurt) kas protein sentezini destekler."]}, {"title": "Yağlar", "points": ["Vücudun **en büyük enerji deposu** yağlardır (karbonhidratın ~**50 katı** depolanır); trigliserit hâlinde saklanır.", "Yağların görevleri: enerji, organları darbeden koruma, ısı yalıtımı, **A, D, E, K vitaminlerinin emilimi**, hücre zarı ve sinir lifi yapımı, hormon sentezi. **Kas hasarının onarımı yağların değil proteinlerin görevidir.**", "Yağ, egzersizde öncelikli yakıt değildir çünkü yakılması **daha fazla oksijen** gerektirir.", "Sporcuda yağ oranı **%15-25**; **%15'in altına inmemeli** (yağda eriyen vitaminler eksik kalır). Doymuş yağ %7'yi geçmemeli.", "**Esansiyel yağ asitleri: omega-3 ve omega-6** (çoklu doymamış). Omega-3 kaynakları: **hamsi, uskumru, somon, ceviz, keten tohumu**. WHO önerisi **omega-6/omega-3 = 5/1**. Balık haftada **2-3 kez**."]}, {"title": "Vitaminler", "points": ["Vitaminler **mikro besindir**, enerji vermez ama enerjinin açığa çıkması için gereklidir. Kökeni: \"vita\" (yaşam) + \"amin\".", "**Yağda eriyen vitaminler: A, D, E, K.** Fazlası **karaciğerde depolanır**, aşırısı toksik olabilir; ısıya dayanıklıdırlar.", "**Suda eriyen vitaminler: B grubu ve C.** Depolanmaz, fazlası atılır; ısıyla kolay bozulur. **C vitamini yağda eriyen değildir.**", "**D vitamini:** kalsiyum-fosfor emilimi, kemik, kas fonksiyonu; sporcularda (özellikle **kapalı salon**) eksikliği **yaygındır**. Kaynak: güneş, balık, yumurta, süt.", "**E vitamini:** güçlü antioksidan, alyuvarları korur. **K vitamini:** **kan pıhtılaşması**, kemik. **A vitamini:** görme, epitel, bağışıklık.", "**B12** yalnızca **hayvansal gıdalarda** bulunur; veganlarda eksiklik görülür. **C vitamini** en kolay okside olan vitamindir; en çok **kuşburnu, siyah üzüm, kırmızı biberde**.", "Dengeli beslenen sporcuda genellikle **takviye gerekmez**."]}, {"title": "Mineraller", "points": ["Mineraller vücudun **~%4**'ünü oluşturur. **Makro mineraller:** kalsiyum, fosfor, potasyum, sodyum, magnezyum, klor, sülfür. **Mikro mineraller:** demir, çinko, iyot, bakır, krom, selenyum, flor vb.", "**Kalsiyum:** kemik sağlığı, stres kırığını önleme; kullanımı için **D vitamini ve magnezyum** gerekir.", "**Demir:** **hemoglobin ve miyoglobinin** yapısında; oksijen taşır. Demir eksikliği anemisi kadınlarda, çocuklarda ve **dayanıklılık sporcularında** sık.", "Demir emilimini **C vitamini artırır**, **çay-kahve azaltır** (öğünden 2 saat sonra içilmeli).", "**Potasyum ve sodyum:** sıvı-elektrolit dengesi, kas kasılması; eksikliğinde **kramp**. **İyot:** tiroid hormonları.", "Sıklet sporlarında **su atarak kilo verme** önemli mineral kaybına yol açar, kaçınılmalıdır."]}, {"title": "Su ve hidrasyon", "points": ["Vücut su oranı: **çocuklarda %75**, yetişkin kadında %55, erkekte %50-55. En sulu organlar: **karaciğer, beyin, kas**.", "Ter kaybının etkisi (vücut ağırlığına göre): **%2** aerobik performans bozulur, **%4** kassal iş düşer, **%5** sıcak çarpması, **%7** halüsinasyon, **%10** kardiyovasküler çöküş.", "**Dehidrasyon belirtileri:** bitkinlik, **baş dönmesi**, performans düşüşü, vücut ısısında artış.", "Antrenman öncesi son öğünde **5-10 ml/kg** su, antrenmandan **20-30 dk önce 1-2 bardak** su.", "Ter kaybı = (ağırlık kaybı) + içilen sıvı − idrar. Örnek: 1,6 kg kayıp + 300 ml − 100 ml = **1800 ml**.", "Kaybedilen sıvının **%120-150**'si sonraki 24 saatte içilmeli: **3 L kayıp → 4,5 L**. Sadece su değil, **elektrolitli içecek, süt, ayran, çikolatalı süt** tercih edilmeli.", "Açık renkli idrar (1-3 numara) iyi hidrasyonu gösterir. Normal miktarda kahve **sıvı kaybına yol açmaz**."]}], "questions": [{"q": "Vücutta enerji oluşturan makro besin öğeleri hangileridir?", "o": ["Protein - Vitamin - Su", "Vitamin - Mineral - Su", "Protein - Yağ - Karbonhidrat", "Karbonhidrat - Mineral - Vitamin", "Yağ - Su - Mineral"], "a": 2, "e": "Vitamin, mineral ve su enerji vermez."}, {"q": "1 gram karbonhidrat, protein ve yağın verdiği enerji sırasıyla kaç kilokaloridir?", "o": ["7 - 4 - 9", "4 - 4 - 9", "9 - 4 - 4", "4 - 4 - 4", "4 - 9 - 4"], "a": 1, "e": "Yağ, karbonhidrat ve proteinin iki katından fazla enerji verir."}, {"q": "Sofra şekeri olarak bilinen disakkarit hangisidir?", "o": ["Fruktoz", "Laktoz", "Galaktoz", "Maltoz", "Sukroz"], "a": 4, "e": "Sukroz = glikoz + fruktoz."}, {"q": "Kas glikojen depolarının yaklaşık miktarı ne kadardır?", "o": ["300-400 g", "50 g", "15-20 g", "1000 g", "100 g"], "a": 0, "e": "Karaciğerde ~100 g, kanda 15-20 g glikoz bulunur."}, {"q": "Antrenmandan 3-4 saat önce tüketilecek öğün nasıl olmalıdır?", "o": ["Yüksek yağlı ve yüksek posalı", "Orta-düşük glisemik indeksli katı karbonhidrat ağırlıklı", "Sadece protein içeren", "Yüksek glisemik indeksli şekerli", "Hiç karbonhidrat içermeyen"], "a": 1, "e": "Bu öğün düşük yağlı ve düşük posalı olmalıdır."}, {"q": "Egzersiz sonrası boşalan enerji depolarının doldurulmasında doğru diyet profili hangisidir?", "o": ["Düşük karbonhidrat, yüksek yağ", "Sadece su ve elektrolit", "Yüksek yağ, düşük karbonhidrat", "Yüksek karbonhidrat, orta protein, düşük yağ", "Yüksek protein, düşük karbonhidrat"], "a": 3, "e": "İlk 2 saat glikojen yenilenmesi için kritiktir."}, {"q": "Aşağıdakilerden hangisi dallı zincirli amino asitlerden (BCAA) değildir?", "o": ["İzolösin", "Lösin", "Hepsi BCAA'dır", "Glutamin", "Valin"], "a": 3, "e": "BCAA: lösin, izolösin ve valin."}, {"q": "Aşağıdakilerden hangisi yüksek protein kaynaklarından değildir?", "o": ["Yumurta", "Balık", "Süt ürünleri", "Kırmızı et", "Ispanak"], "a": 4, "e": "Ispanak bir sebzedir; protein değeri düşüktür."}, {"q": "Kuvvet-güç sporcularında önerilen günlük protein miktarı hangisidir?", "o": ["4-5 g/kg", "10-12 g/kg", "1,6-2,2 g/kg", "0,5 g/kg", "0,8-1 g/kg"], "a": 2, "e": "Dayanıklılık sporcularında 1,2-1,7 g/kg önerilir."}, {"q": "Aşağıdakilerden hangisi yağların vücuttaki görevlerinden değildir?", "o": ["Vücut ısısını korumak", "A, D, E, K vitaminlerinin emilimini sağlamak", "Egzersiz sonrası kas hasarının onarımı", "Hücre zarı yapımına katılmak", "Organları darbelere karşı korumak"], "a": 2, "e": "Kas hasarının onarımı proteinlerin görevidir."}, {"q": "Aşağıdakilerden hangisi yağda eriyen vitaminlerden değildir?", "o": ["D vitamini", "K vitamini", "C vitamini", "A vitamini", "E vitamini"], "a": 2, "e": "C vitamini ve B grubu suda erir."}, {"q": "Kapalı salonda antrenman yapan sporcularda eksikliği yaygın görülen vitamin hangisidir?", "o": ["C vitamini", "K vitamini", "D vitamini", "B1 vitamini", "E vitamini"], "a": 2, "e": "D vitamininin ana kaynağı güneştir."}, {"q": "Yalnızca hayvansal gıdalarda bulunan, veganlarda eksikliği görülen vitamin hangisidir?", "o": ["K vitamini", "Folik asit", "B12 vitamini", "B1 vitamini", "C vitamini"], "a": 2, "e": "Sakatat, peynir, süt, yumurta ve balık B12'den zengindir."}, {"q": "Demir emilimini azaltan içecek hangisidir?", "o": ["Portakal suyu", "Su", "Ayran", "Çay ve kahve", "Süt"], "a": 3, "e": "C vitamini emilimi artırır; çay-kahve öğünden 2 saat sonra içilmelidir."}, {"q": "Antrenmanda 3 litre sıvı kaybeden sporcu sonraki 24 saatte kaç litre sıvı almalıdır?", "o": ["4,5 litre", "2 litre", "9 litre", "6 litre", "3 litre"], "a": 0, "e": "Kaybın %120-150'si yerine konmalıdır."}, {"q": "Ter kaybı vücut ağırlığının yüzde kaçına ulaştığında aerobik performans bozulmaya başlar?", "o": ["%15", "%5", "%7", "%2", "%10"], "a": 3, "e": "%5'te sıcak çarpması, %10'da kardiyovasküler çöküş görülebilir."}, {"q": "Dehidrasyonun olumsuz etkilerinden hangisi görülür?", "o": ["Bitkinlik ve baş dönmesi", "Kalp atımının yavaşlaması", "Kas kuvvetinin artması", "Performansın artması", "Vücut ısısının düşmesi"], "a": 0, "e": "Sıvı kaybı ısı düzenlemesini ve performansı bozar."}, {"q": "Antrenman 1 saati aştığında sporcu içeceğinin karbonhidrat oranı ne olmalıdır?", "o": ["%15-20", "%6-8", "%50", "%1-2", "%25-30"], "a": 1, "e": "Her 15-20 dakikada 150-250 ml tüketilir."}, {"q": "Aşağıdakilerden hangisinde makro besin öğeleri (vücutta enerji oluşturan) doğru şekilde verilmiştir?", "o": ["Protein-Yağ-Karbonhidrat", "Vitamin-Mineral-Su", "Lösin-İzolösin-Valin", "Mineral-Vitamin-Su", "Sodyum-Potasyum-Magnezyum"], "a": 0, "e": "Doğru cevap: Protein-Yağ-Karbonhidrat.", "kb": 1}, {"q": "Aşağıdakilerden hangisi antrenmanlar sırasında organizmada gözlenen değişikliklerden biri değildir?", "o": ["Solunum hızının artması", "Sinir iletim hızının yavaşlaması", "Kas kasılmasının artması", "Enerji harcamasının artması", "KAH’nın artması"], "a": 1, "e": "Doğru cevap: Sinir iletim hızının yavaşlaması.", "kb": 1}, {"q": "Vücutta enerji oluşturan besin öğelerinin 1 gramlarının sağladığı kalori miktarları hangi seçenekte doğru verilmiştir?", "o": ["Karbonhidrat=4 – Protein=4 – Yağ= 9", "Karbonhidrat=9 – Protein=4 – Yağ= 4", "Karbonhidrat=4 – Protein=9 – Yağ= 4", "Karbonhidrat=4 – Protein=9 – Yağ= 9", "Karbonhidrat=4 – Protein=4 – Yağ= 4"], "a": 0, "e": "Doğru cevap: Karbonhidrat=4 – Protein=4 – Yağ= 9.", "kb": 1}, {"q": "Aşağıdakilerden hangisinde yağda çözünen vitaminler doğru şekilde verilmiştir?", "o": ["B grubu vitaminleri ve C vitamini", "B12 vitamini", "Tiamin ve Riboflavin", "D, A, E ve K vitaminleri", "Riboflavin ve Tiamin"], "a": 3, "e": "Doğru cevap: D, A, E ve K vitaminleri.", "kb": 1}, {"q": "Antrenman sonucunda 3 litre sıvı kaybetmiş bir sporcu sıvı dengesinin sağlanabilmesi için sonraki 24 saat içerisinde kaç litre sıvı tüketmelidir?", "o": ["2.5", "3", "8", "5", "4.5"], "a": 4, "e": "Doğru cevap: 4.5.", "kb": 1}, {"q": "Egzersiz sonrası boşalan enerji depolarının doldurulmasında diyet profili önem arz etmektedir. Doğru bir şekilde yapılandırılmamış bir beslenme planı, uygun bir beslenme ile 24 saatte doldurulabilen depoların 72 saatte dolabilmesine yol açabilir. Buna göre antrenman sonrası beslenme/ öğün nasıl planlanmalıdır?", "o": ["Tüm besin öğeleri yüksek miktarlarda tüketilmeli", "Yüksek oranda karbonhidrat, orta düzeyde protein, düşük yağ tüketilmeli", "Yüksek oranda yağ ve protein, düşük karbonhidrat tüketilmeli", "Yüksek oranda protein, düşük karbonhidrat ve yağ tüketilmeli", "Yüksek yağ, düşük karbonhidrat ve protein tüketilmeli"], "a": 1, "e": "Doğru cevap: Yüksek oranda karbonhidrat, orta düzeyde protein, düşük yağ tüketilmeli.", "kb": 1}, {"q": "Birincil işlevleri büyüme, onarım ve yenileme olduğundan enerji metabolizmasında diğer besin öğeleri kadar yer almayan besin öğesi aşağıdakilerden hangisidir?", "o": ["Magnezyum", "Asetilkolin", "Karbonhidrat", "Yağ", "Protein"], "a": 4, "e": "Doğru cevap: Protein.", "kb": 1}, {"q": "Egzersiz öncesi kas ve karaciğer enerji depolarının doygunluğunun sağlanması açısından 3-4 saat önce tüketilmesi gereken karbonhidrat türü ve formu aşağıdakilerden hangisidir?", "o": ["Düşük glisemik indeksli-katı karbonhidratlar", "Orta-düşük glisemik indeksli- katı karbonhidratlar", "Orta-düşük glisemik indeksli-sıvı ve katı karbonhidratlar", "Yüksek glisemik indeksli-sıvı ve katı karbonhidratlar", "Orta-düşük glisemik indeksli-sıvı karbonhidratlar"], "a": 1, "e": "Doğru cevap: Orta-düşük glisemik indeksli- katı karbonhidratlar.", "kb": 1}, {"q": "Aşağıdakilerden hangisi yağların vücuttaki görevleri arasında yer almaz?", "o": ["Organları sararak dış etkilere karşı korumak", "Vücut sıcaklığının korunmasına yardımcı olmak", "Egzersiz sonrası oluşan kas hasarının onarımına yardımcı olmak", "Düşük şiddetli egzersizler için enerji kaynağı sağlamak", "Bazı vitaminlerinin sindirimi ve emilmesine katkıda bulunmak"], "a": 2, "e": "Doğru cevap: Egzersiz sonrası oluşan kas hasarının onarımına yardımcı olmak.", "kb": 1}, {"q": "as kütlesinde artış hedeflediğinde sporcunun vücut ağırlığının her kilogramı başına tüketmesi gereken en düşük protein miktarı aşağıdakilerden hangisidir?", "o": ["2 gram", "3 gram", "1.6 gram", "4 gram", "20 gram"], "a": 0, "e": "Doğru cevap: 2 gram. Not: Kitabın metninde kas kütlesi artışı için 2,5-3 g/kg önerilir; cevap anahtarı 2 gramı işaretler.", "kb": 1}], "tf": [{"q": "Vitamin, mineral ve su vücuda enerji sağlar.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Bu öğelerin kalorisi yoktur; enerji oluşumuna yardım ederler.", "tf": true}, {"q": "Günlük karbonhidrat alımının büyük kısmı kompleks karbonhidratlardan oluşmalıdır.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Önerilen oran %80-85'tir.", "tf": true}, {"q": "Yağda eriyen vitaminler fazla alındığında idrarla kolayca atılır.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Yağda eriyen vitaminler karaciğerde depolanır; aşırısı toksik olabilir.", "tf": true}, {"q": "Hayvansal proteinlerin vücutta kullanılabilirliği bitkisel proteinlerden yüksektir.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Bitkisel proteinler esansiyel amino asit bakımından eksiktir.", "tf": true}, {"q": "Yağlar, karbonhidratlara göre vücutta çok daha fazla depolanır.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Yağlar yaklaşık 50 kat daha fazla depolanır.", "tf": true}, {"q": "Normal miktarda içilen kahve sporcuda belirgin sıvı kaybına yol açar.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Araştırmalar kahvenin diüretik etkisini doğrulamamıştır.", "tf": true}]}, {"id": "ssb4", "title": "Sporcu Sağlığı ve İlk Yardım", "cards": [{"title": "Sağlık ve sporun faydaları", "points": ["**Sağlık:** Fiziksel, zihinsel ve sosyal yönden iyi olma hâlidir.", "Düzenli fiziksel aktivite kas-iskelet, dolaşım ve solunum sistemini geliştirir; kalp-damar hastalığı, felç, diyabet, **kemik erimesi** ve bazı kanserleri önler. Esnekliği **artırır** (azaltmaz).", "Doku üzerine binen stres, dokunun bu stresi **absorbe etme yeteneğini aşarsa** yaralanma oluşur.", "Profesyonellerde en sık görülenler: **bağ yaralanmaları ve kas zedelenmeleri**; yaralanmalar **alt ekstremitede** daha sık.", "Spora katılım öncesi **tıbbi değerlendirme** risk faktörlerini ortaya çıkarmak için çok önemlidir."]}, {"title": "Yaralanma risk faktörleri", "points": ["**İçsel (kişiye bağlı) faktörler:** **önceki yaralanma öyküsü**, **yaş**, cinsiyet, yetersiz fiziksel uygunluk, **biyomekanik dizilim bozukluğu**, yetersiz uyku-beslenme-sıvı, yorgunluk, yaralanma korkusu, tecrübesizlik, konsantrasyon eksikliği, psikososyal faktörler.", "**12-15 yaş:** Hızlı büyüme döneminde kemik gelişimine göre kas gelişimi ve esneklik geride kalır → yaralanma riski artar.", "Kadınlarda bağ yapıları daha gevşek olduğu için bazı yaralanmalarda risk yüksektir; çocukluk-ergenlikte ise **erkekler** daha risklidir.", "**Çevresel faktörler:** **ekipman-ayakkabı-zemin**, ışıklandırma, oynanan pozisyon, **hava koşulları**, spor tipi, aşırı antrenman/maç yoğunluğu, teknik yanlışlıklar, sporcu-antrenör anlaşmazlığı.", "Uluslararası karşılaşmalar için ortam sıcaklığı **en fazla 25 °C, en az 16 °C**.", "Bazı risk faktörleri **değiştirilebilir**, bazıları (yaş, cinsiyet) **değiştirilemez**."]}, {"title": "Yaralanmaları önleme piramidi", "points": ["Önleme; ekipman (breys, ortez, ayakkabı), eğitim (kuvvet, propriosepsiyon) ve **kurallar** ile yapılır.", "Piramidin basamakları (alttan üste): **1. Hedef belirleme ve risk faktörü analizi** → **2. Yüklenme yönetimi** → **3. Atletik gelişim, kuvvet ve kondisyon** → **4. Hareket verimliliği** → **5. Önceki yaralanma ve etkin rehabilitasyon** (en üst).", "Gelecekteki yaralanmanın **en iyi belirleyicisi: önceki yaralanma öyküsü**.", "Hem **yetersiz** hem **aşırı** yüklenme yaralanma riskini artırır; yük **kademeli** artırılmalıdır.", "Koruyucu ekipman (dişlik, ayak bileği desteği) yaralanmayı azaltır. Çim zemin elit sporcu için, yapay zemin daha az profesyonel sporcu için daha güvenli bulunmuştur."]}, {"title": "İlk yardımın amacı ve 9 hayati bulgu", "points": ["**İlk yardım:** Olay yerinde, eldeki imkânlarla, **ilaçsız** yapılan geçici müdahale. Amaç: hayati tehlikeyi kaldırmak, yaşamsal fonksiyonları sürdürmek, kötüleşmeyi önlemek.", "Bilinç kapalıysa hızla: **hava yolu**, **solunum (bak-dinle-hisset)**, **dolaşım** (şah damarından 5 saniye nabız).", "**Dokuz hayati bulgu:** nabız, solunum, kan basıncı, vücut sıcaklığı, cilt rengi, göz bebekleri, bilinç durumu, hareket yeteneği, ağrıya tepki. (\"Ayakta durabilme\" bu listede yoktur.)", "**Nabız:** yetişkin 60-100, çocuk 80-100, **sporcu 40-60**. **Solunum:** dakikada 12-20, sporcuda 6-8.", "Göz bebeğinin ışığa normal tepkisi **daralmadır**; genişleme bilinç kaybını gösterir. Mavi deri **oksijen yetersizliği**, soluk deri dolaşım yetersizliğidir.", "Bilinç kaybı dereceleri: 1. derece sözlü uyarana, 2. derece ağrılı uyarana cevap verir; 3. derece hiçbir uyarana cevap vermez."]}, {"title": "Temel yaşam desteği, şok, boğulma, donma", "points": ["Beyinde oksijensizliğin **4-6. dakikasında** geri dönüşümsüz hasar başlar.", "Hava yolu: sırtüstü yatır, **baş geriye, çene yukarı**.", "Kitapta tek kişilik KSC: **15 kalp masajı - 2 solunum**, dakikada 80-100 bası. (Güncel ilk yardım kılavuzları **30:2** ve dakikada 100-120 bası önerir.)", "**Şok belirtileri:** soluk deri, **hızlı ve zayıf nabız**, soğuk terleme, göz bebeği genişlemesi, tansiyon düşmesi. Yapılacaklar: battaniyeyle ısıt, **bacakları yukarı kaldır**.", "Boğulma: **kuru** (akciğere su dolmadan), **yaş** (akciğere sıvı dolar), **ikincil** (kurtulduktan sonraki günlerde akciğer ödemiyle). Soğuk suda yaşama şansı ılık suya göre fazladır.", "Hipotermi: hafif 33-35 °C (titreme), orta 30-33 °C, ağır <30 °C (bilinç kaybı). Orta hipotermide **40 °C banyo** etkilidir."]}, {"title": "Sahada değerlendirme: TOTAPS", "points": ["Önce **alanın güvenliği** sağlanır; ilk yardımcının en önemli görevi **daha ileri yaralanmayı önlemektir**.", "**TOTAPS:** **T**alk (Konuş) → **O**bserve (Gözle) → **T**ouch (Dokun) → **A**ctive motion (Aktif hareket) → **P**assive motion (Pasif hareket) → **S**kill tests (Beceri testleri).", "Gözle: yaralı bölge **diğer tarafla karşılaştırılır**. Dokun: ağrılı nokta nazikçe bulunur.", "Beceri testleri: kırık düşünülmüyorsa ayağa kalkma, desteksiz durma gibi giderek zorlaşan hareketler denenir.", "Yaralanma ciddiyse veya karar verilemiyorsa sporcu **saha dışına** alınır."]}, {"title": "Yaralanmaya ilk tepki ve POLICE", "points": ["Yaralanmaya ilk fizyolojik cevap **doku içine kanamadır**; ardından **ödem (şişlik)**, ağrı, hassasiyet, sıcaklık, kızarıklık ve koruyucu **kas spazmı** gelir. Öncelik **kanamayı durdurmaktır**.", "Yumuşak doku hasarı belirtileri: şişlik, ağrı, kızarıklık, ısı artışı, hareket kısıtlılığı. (\"İğnelenme\" buz uygulamasında hissedilen bir duyudur.)", "Güncel protokol **POLICE**: **P**rotection (koruma), **OL** Optimal Loading (**uygun yüklenme**), **I**ce (buz), **C**ompression (kompresyon), **E**levation (yükseltme).", "Eski protokol **PRICE**'taki **Rest (dinlenme)** yerine POLICE'te **uygun yüklenme** gelmiştir; kontrollü kullanım iyileşmeyi hızlandırır. **\"Dinlenme\" POLICE'in aşaması değildir.**", "Koruma: kol yaralanmasında **üçgen askı**, bacakta **koltuk değneği**. Ama uzun süreli tam hareketsizlik zararlıdır.", "Kas spazmı, yaralı bölgenin daha az hareket etmesini sağlayarak **koruma** fazına destek olur."]}, {"title": "Buz, kompresyon, elevasyon", "points": ["Buz kanamayı ve şişliği azaltır; **15 °C altı** ağrı liflerini yavaşlatır. Ağrıyı **tümüyle geçirmez**.", "Süre: **en az 12-15 dakika, en fazla 30 dakika**. (\"Minimum 25 dakika\" yanlıştır.) İlk 24 saatte **2 saatte bir**, sonra 4-6 saatte bir; genelde ilk **24-48 saat**.", "Hisler sırasıyla: ilk 3 dk **soğukluk** → 2-7. dk **yanma ve ağrı** → **iğnelenme ve uyuşma**.", "Buz **asla doğrudan cilde** konmaz; arada **ıslak** bez/havlu olmalı. Açık yaranın üzerine konmaz.", "**Kompresyon:** elastik bandaj, **spiral veya 8 şeklinde**, **uçtan kalbe doğru** (ayak bileğinde parmaklardan başlanır). Uçta renk değişirse bandaj gevşetilir.", "**Elevasyon:** bölge **kalp seviyesinin üstüne** kaldırılır; şişlik fazlaysa 24-48 saat sürdürülür."]}], "questions": [{"q": "Aşağıdakilerden hangisi sporun kişiye yarattığı faydalardan değildir?", "o": ["Kemik erimesini önlemesi", "Dolaşım sistemini geliştirmesi", "Solunum fonksiyonunu geliştirmesi", "Diyabet riskini azaltması", "Vücut esnekliğini azaltması"], "a": 4, "e": "Düzenli spor esnekliği artırır."}, {"q": "Aşağıdakilerden hangisi spor yaralanmalarına hazırlayıcı çevresel faktörlerden değildir?", "o": ["Zemin ve ayakkabı", "Aşırı maç yoğunluğu", "Biyomekanik dizilim bozukluğu", "Işıklandırma", "Hava koşulları"], "a": 2, "e": "Biyomekanik dizilim bozukluğu kişiye bağlı (içsel) bir faktördür."}, {"q": "Aşağıdakilerden hangisi kişiye bağlı risk faktörlerindendir?", "o": ["Teknik yanlışlıklar", "Hava sıcaklığı", "Zemin", "Işıklandırma", "Yaş"], "a": 4, "e": "Yaş, cinsiyet ve önceki yaralanma kişiye bağlı faktörlerdir."}, {"q": "Gelecekteki spor yaralanmalarının en iyi belirleyicisi hangisidir?", "o": ["Zemin tipi", "Antrenör deneyimi", "Önceki yaralanma öyküsü", "Boy uzunluğu", "Spor branşı"], "a": 2, "e": "Tam iyileşmeden spora dönen sporcuda tekrar yaralanma riski çok yüksektir."}, {"q": "Spor yaralanmalarını önleme piramidinin ilk (temel) basamağı hangisidir?", "o": ["Önceki yaralanma ve rehabilitasyon", "Hareket verimliliği", "Hedef belirleme ve risk faktörü analizi", "Kuvvet ve kondisyon", "Yüklenme yönetimi"], "a": 2, "e": "Önceki yaralanma ve rehabilitasyon piramidin en üstündedir."}, {"q": "Aşağıdakilerden hangisi ilk yardımdaki dokuz hayati bulgu arasında yer almaz?", "o": ["Cilt rengi", "Göz bebekleri", "Ayakta durabilme durumu", "Nabız", "Ağrıya tepki"], "a": 2, "e": "Dokuz bulgu: nabız, solunum, kan basıncı, vücut sıcaklığı, cilt rengi, göz bebekleri, bilinç, hareket yeteneği, ağrıya tepki."}, {"q": "Sporcularda dinlenik nabız sayısı genellikle hangi aralıktadır?", "o": ["60-100", "80-100", "100-120", "40-60", "20-30"], "a": 3, "e": "Yetişkinlerde 60-100, çocuklarda 80-100'dür."}, {"q": "Kitaba göre tek kişinin uyguladığı kalp-solunum canlandırmasında oran nedir?", "o": ["5 kalp masajı - 1 solunum", "30 kalp masajı - 5 solunum", "10 kalp masajı - 10 solunum", "15 kalp masajı - 2 solunum", "2 kalp masajı - 15 solunum"], "a": 3, "e": "Not: Güncel ilk yardım kılavuzları 30 kalp masajı - 2 solunum oranını önerir."}, {"q": "Şok durumunda ilk yapılacaklardan biri hangisidir?", "o": ["Buz uygulamak", "Başını yukarı kaldırmak", "Ayağa kaldırıp yürütmek", "Hastayı ısıtıp bacaklarını yukarı kaldırmak", "Bol su içirmek"], "a": 3, "e": "Şokta nabız hızlı ve zayıf, deri soluk ve soğuk terlidir."}, {"q": "TOTAPS değerlendirmesinde ilk aşama hangisidir?", "o": ["Beceri testleri", "Dokun (Touch)", "Aktif hareket", "Konuş (Talk)", "Gözle (Observe)"], "a": 3, "e": "Sıra: Konuş, Gözle, Dokun, Aktif hareket, Pasif hareket, Beceri testleri."}, {"q": "Kas-iskelet yaralanmalarında kullanılan en güncel ilk yardım protokolü hangisidir?", "o": ["TOTAPS", "RICE", "PRICE", "POLICE", "ABC"], "a": 3, "e": "TOTAPS bir değerlendirme sırasıdır, tedavi protokolü değildir."}, {"q": "Aşağıdakilerden hangisi POLICE protokolünün aşamalarından değildir?", "o": ["Buz", "Dinlenme (Rest)", "Koruma", "Elevasyon", "Uygun yüklenme"], "a": 1, "e": "Eski PRICE'taki dinlenmenin yerini uygun yüklenme almıştır."}, {"q": "Yumuşak doku yaralanmasında vücudun ilk fizyolojik cevabı hangisidir?", "o": ["Kemikleşme", "Kas atrofisi", "Doku içine kanama", "Kas hipertrofisi", "Tendon kısalması"], "a": 2, "e": "Kanamayı ödem, ağrı ve hassasiyet izler."}, {"q": "Soğuk uygulama ile ilgili hangisi yanlıştır?", "o": ["Buz doğrudan cilde konmamalıdır.", "İlk 24 saatte 2 saatte bir uygulanabilir.", "Uygulama süresi en az 25 dakikadır.", "Açık yaranın üzerine buz torbası konmaz.", "Ağrıyı tümüyle geçirmez."], "a": 2, "e": "Doğru süre en az 12-15 dakika, en fazla 30 dakikadır."}, {"q": "Ayak bileğine kompresyon bandajı nasıl uygulanmalıdır?", "o": ["Kalpten uzaklaşacak şekilde", "Mümkün olduğunca sıkı ve tek kat", "Dizden başlayıp aşağı doğru", "Sadece eklemin üzerine düz şekilde", "Ayak parmaklarından başlayıp kalbe doğru"], "a": 4, "e": "Spiral veya 8 şeklinde, uçtan kalbe doğru sarılır."}, {"q": "Elevasyon uygulamasının amacı nedir?", "o": ["Yaralı bölgeyi kalp seviyesinin üstüne kaldırarak şişliği azaltmak", "Bölgeyi tamamen hareketsiz bırakmak", "Kas kuvvetini artırmak", "Bölgeyi ısıtmak", "Ağrılı noktayı bulmak"], "a": 0, "e": "Yerçekimi kaynaklı ödem birikimi engellenir."}, {"q": "Aşağıdakilerden hangisi sporun kişiye yarattığı faydalar arasında sayılamaz?", "o": ["Bazı kanser türlerini önler.", "Diyabet riskini azaltır.", "Kalbi güçlendirir.", "Vücut esnekliğini azaltır.", "Kasların güçlenmesini sağlar."], "a": 3, "e": "Doğru cevap: Vücut esnekliğini azaltır.", "kb": 1}, {"q": "Aşağıdaki faktörlerden hangisi spor yaralanmalarına hazırlayıcı çevresel faktörler arasında yer almaz?", "o": ["Antrenör tutumu", "Biyomekaniksel dizilim bozukluğu", "Hava koşulları", "Spor tipi", "Aşırı antrenman yoğunluğu"], "a": 1, "e": "Doğru cevap: Biyomekaniksel dizilim bozukluğu.", "kb": 1}, {"q": "Aşağıdakilerden hangisi ilk yardımın ilk aşaması olan dokuz hayati bulgu değerlendirmesi arasında yer almaz?", "o": ["Nabız değerlendirmesi", "Kan basıncının değerlendirilmesi", "Ayakta durma durumunun değerlendirilmesi", "Cilt renginin değerlendirilmesi", "Göz bebeklerinin değerlendirilmesi"], "a": 2, "e": "Doğru cevap: Ayakta durma durumunun değerlendirilmesi.", "kb": 1}, {"q": "Aşağıdaki spor yaralanmalarına zemin hazırlayan risk faktörlerinden hangisi, kişiye bağlı risk faktörleri arasında sayılır?", "o": ["Yaş", "Spor ayakkabı", "Hava koşulları", "Zemin özellikleri", "Işıklandırma"], "a": 0, "e": "Doğru cevap: Yaş.", "kb": 1}, {"q": "Solunumu ve nabzı olmayan yetişkin bir kişiye suni solunum, kalp masajı sayılarınız ne kadar olmalıdır?", "o": ["İki nefes suni solunum, 15 kalp masajı", "Üç nefes suni solunum, 10 kalp masajı", "Beş nefes suni solunum, 10 kalp masajı", "Beş nefes suni solunum, 5 kalp masajı", "Üç nefes suni solunum, 5 kalp masajı"], "a": 0, "e": "Doğru cevap: İki nefes suni solunum, 15 kalp masajı. Not: Kitapta 15 kalp masajına 2 nefes oranı verilir; güncel ilk yardım kılavuzları 30:2 oranını önerir.", "kb": 1}, {"q": "Aşağıdakilerden hangisi spor yaralanmalarını önleme piramidinde ilk basamağı oluşturur?", "o": ["Yüklenme yönetimi", "Beceri testleri", "Germe", "Risk faktörü analizi", "Fiziksel uygunluk düzeyini geliştirme"], "a": 3, "e": "Doğru cevap: Risk faktörü analizi.", "kb": 1}, {"q": "Aşağıdakilerden hangisi spor yaralanması sonrası yumuşak doku hasarı olan bir sporcuda görülen semptomlardan biri değildir?", "o": ["Ciltte kızarıklık", "Şişlik", "Ağrı", "İğnelenme", "Ciltte ısı artışı"], "a": 3, "e": "Doğru cevap: İğnelenme.", "kb": 1}, {"q": "Aşağıdakilerden hangisi spor yaralanmaları sonrası uygulanan kabul görmüş en güncel ilk yardım protokolünün kısaltmasıdır?", "o": ["RICE", "PRICE", "POLICE", "POLICET", "RICED"], "a": 2, "e": "Doğru cevap: POLICE.", "kb": 1}, {"q": "Aşağıdakilerden hangisi spor yaralanmalarından sonra uygulanan ilk yardım protokolünün aşamalarından biri değildir?", "o": ["Koruma", "Dinlenme", "Buz", "Kompresyon", "Elevasyon"], "a": 1, "e": "Doğru cevap: Dinlenme.", "kb": 1}, {"q": "Soğuk uygulama prensipleri ile ilgili aşağıdaki ifadelerden hangisi yanlıştır?", "o": ["Genellikle sporcu yaralandıktan sonraki ilk 24- 48 saat içinde kullanılır.", "Uygulama süresi minimum 25 dakikadır.", "Buz kalıbı direkt cilde uygulanmamalı, araya bir bandaj/ havlu yerleştirilmelidir.", "Uygulama yapılan bölge takip edilmeli aşırı morarma, dolaşımsal bozukluk gözlenirse soğuk tedavisi uygulanmamalıdır.", "Açık yara varsa buz torbası direkt yara üzerine uygulanmamalıdır."], "a": 1, "e": "Doğru cevap: Uygulama süresi minimum 25 dakikadır.", "kb": 1}], "tf": [{"q": "Spor yaralanmaları vücudun alt bölümlerinde daha sık görülür.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Alt ekstremite yaralanmaları daha yaygındır.", "tf": true}, {"q": "12-15 yaş döneminde kas gelişimi ve esneklik kemik gelişiminden hızlı ilerler.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Bu dönemde kemik hızlı büyür; kas gelişimi ve esneklik geride kalır, risk artar.", "tf": true}, {"q": "Hem yetersiz hem aşırı yüklenme yaralanma riskini artırır.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Bu nedenle yüklenme yönetimi piramidin ikinci basamağıdır.", "tf": true}, {"q": "Buz uygulaması doğrudan cilde yapılmalıdır.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Cilt ile buz arasına ıslatılmış bez/havlu konmalıdır.", "tf": true}, {"q": "POLICE protokolünde yaralı bölgenin uzun süre tamamen hareketsiz kalması önerilir.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Koruma ile birlikte uygun yüklenme (kontrollü kullanım) önerilir.", "tf": true}, {"q": "Sporcuyu değerlendirmeden önce alanın güvenli olduğundan emin olunmalıdır.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Hem ilk yardımcı hem sporcu için güvenlik önceliklidir.", "tf": true}]}, {"id": "ssb5", "title": "Dopingle Mücadele", "cards": [{"title": "Doping nedir, neden yasak?", "points": ["WADA tanımına göre doping, **Dünya Dopingle Mücadele Kuralları'nın 2. maddesindeki** bir veya birden fazla kuralın **ihlal edilmesidir** (sadece madde kullanmak değil).", "Doping hem **sporcunun sağlığına** hem de **sporun bütünlüğüne** zarar verdiği için yasaktır.", "Dopingle mücadelenin **en temel ilkesi: sporcunun sağlığını korumak**.", "Dünya Dopingle Mücadele Kuralları'nın amacı: **temiz sporcuların haklarını korumak**.", "Sağlık riskleri büyür çünkü: hasta insan/hayvan için üretilen maddeler sağlıklı sporcuda farklı etki yapar, **tedavi dozunun çok üstünde** kullanılır, maddeler bir arada kullanılır."]}, {"title": "Dopingle mücadele kuruluşları", "points": ["**WADA (Dünya Dopingle Mücadele Ajansı):** **1999**'da kurulan bağımsız uluslararası kuruluş; dopingle mücadeleyi destekler, koordine eder, denetler. Hükümetler ve spor hareketi **eşit** temsil edilir.", "Türkiye'de WADA'nın tanıdığı tek ulusal kuruluş: **Türkiye Dopingle Mücadele Komisyonu (TDMK)**.", "Dünyada ~**30** WADA akrediteli laboratuvar var; Türkiye'deki: **Hacettepe Doping Kontrol Laboratuvarı (Merkezi)**.", "Diğer kuruluşlar: IOC, Uluslararası Paralimpik Komite, uluslararası federasyonlar, **büyük çaplı turnuva düzenleyicileri** (Akdeniz Oyunları Komitesi, CISM vb.).", "WADA normalde doping kontrolü **yapmaz** ama **yetkilidir**.", "Kurallar ilk kez **2003**'te kabul edildi, **1 Ocak 2004**'te yürürlüğe girdi; 2009, 2015 ve **2021**'de güncellendi."]}, {"title": "Dopingle mücadele kural ihlalleri (Madde 2)", "points": ["**2.1** Örnekte yasaklı madde veya belirtecinin bulunması. **2.2** Kullanma veya kullanmaya **teşebbüs**.", "**2.3** Örnek vermekten **kaçınma, reddetme** veya örnek vermeme.", "**2.4** **12 ay içinde 3 kez bulunabilirlik kusuru** (yer bildirimi hatası veya kaçırılan test).", "**2.5** Doping kontrolünü bozma veya hile. **2.6** Yasaklı maddeyi **bulundurma**. **2.7** Yasa dışı **ticaret**.", "**2.8** Sporcuya yasaklı madde/yöntem **uygulama**. **2.9** **Suç ortaklığı**. **2.10** **Ceza almış destek personeliyle** yasak iş birliği.", "**2.11** (2021) Sporcuyu veya başkasını yetkililere bilgi vermekten vazgeçirme, **gözünü korkutma**."]}, {"title": "Yasaklılar Listesi", "points": ["WADA hazırlar; **her yıl** (yılda en az bir kez) güncellenir; **1 Ocak - 31 Aralık** geçerlidir.", "Yasaklılar Listesi: **müsabaka içi ve müsabaka dışı kullanımı yasaklı** madde ve yöntemlerin listesidir.", "Listeye alınma ölçütleri (en az **ikisi** gerekir): **performansı artırması**, **sağlık riski oluşturması**, **sporun ruhuna aykırı olması**.", "**Her zaman yasaklı maddeler:** S0 onaylanmamış maddeler, **S1 anabolik maddeler**, S2 peptid hormonlar ve büyüme faktörleri, S3 beta-2 agonistler, S4 hormon ve metabolik modülatörler, **S5 idrar söktürücüler ve maskeleyiciler**.", "**Her zaman yasaklı yöntemler:** **M1 kan ve kan ürünleri**, M2 kimyasal-fiziksel müdahale, **M3 gen dopingi**.", "**Yalnız müsabaka içinde yasaklı:** **S6 uyarıcılar**, S7 narkotikler, S8 kannabinoidler, S9 glukokortikosteroidler. **Bazı sporlarda yasaklı:** **P1 beta blokerler**.", "Tıbbi zorunlulukta yasaklı madde ancak **Tedavi Amaçlı Kullanım İstisnası (TAKİ)** onayıyla kullanılabilir."]}, {"title": "Kusursuz sorumluluk ve besin destekleri", "points": ["**Kusursuz sorumluluk ilkesi:** Sporcu, örneğinde bulunan **her maddeden doğrudan kendisi sorumludur**; kullandığı tüm ilaç ve besin desteklerinden ve kuralları bilmekten de sorumludur.", "Besin destek ürünleri etiketinde yazmayan yasaklı madde içerebilir. \"Etiket yanlıştı\" savunması **kabul edilmez**.", "**İçeriğinden emin olunmayan ürün kullanılmamalıdır.** Bilmemek **bahane değildir**.", "Sporun ruhu değerleri: ahlak-dürüstlük, sağlık, mükemmel performans, eğlenme, ekip çalışması, kurallara ve kendine-diğerlerine saygı, cesaret."]}, {"title": "Doping kontrol süreci", "points": ["Doping kontrolü **her zaman, her yerde** yapılabilir. Sporcuya **önceden haber verilmesi gerekmez**.", "Sporcu kontrolü **reddedemez**; reddetmek bir kural ihlalidir ve men cezasıyla sonuçlanabilir.", "Sporcunun hakları: yanında **temsilci/tercüman** bulundurma, bilgi isteme, geçerli nedenle **geç gitme** talebi, engelliyse uyarlama isteme.", "Geç gitmenin geçerli nedenleri: **ödül töreni**, medya yükümlülüğü, aynı gün başka müsabaka, **soğuma**, tıbbi tedavi, temsilci bulma, kimlik getirme.", "Sporcu, bildirimden itibaren görevlinin **kesintisiz gözetiminde** kalır ve **fotoğraflı kimlik** gösterir.", "Eller **sabunsuz, sadece suyla** yıkanır; **aynı cinsiyetten** görevli idrar verilişini doğrudan izler."]}, {"title": "Örnek, A-B şişeleri ve laboratuvar", "points": ["En az **90 ml idrar** gerekir. **B şişesi en az 30 ml**, **A şişesi en az 60 ml** doldurulur; kapta özgül ağırlık için az miktar bırakılır.", "İdrar fazla seyreltikse (özgül ağırlık yetersizse) **yeni örnek** istenir.", "Formda sporcunun **son 7 gündeki** ilaç ve besin destekleri yazılır.", "Laboratuvara giden bilgiler: **sporcunun branşı, cinsiyeti, federasyonu ve örnek kod numarası**; **kimliği (adı) gitmez**.", "Laboratuvarda önce **A örneği** analiz edilir; **B örneği** Aykırı Analitik Bulgunun (AAB) **teyidi** için saklanır.", "Örnekler **10 yıl** saklanıp yeniden analiz edilebilir; bu güçlü bir caydırıcılıktır."]}, {"title": "Sporcu ve antrenörün sorumlulukları", "points": ["Sporcu: kuralları bilmeli, **vücuduna giren her şeyden** sorumlu olmalı, örnek için her zaman hazır olmalı, doktoru yasaklı madde konusunda **uyarmalı**, soruşturmalarla iş birliği yapmalı.", "Antrenörün en önemli sorumluluklarından biri: sporcularını dopingle mücadele hakkında **bilgilendirmek** ve onları kural ihlallerinden korumak.", "Antrenör; temel kavramları, yasaklı listeyi, kontrol sürecini ve **besin desteklerinin risklerini** bilip sporcuya aktarmalıdır.", "Antrenör, dopinge **eğilimli/riskli sporcuları fark etmeye** çalışmalıdır.", "WADA'nın e-öğrenme platformu: **ADeL**."]}], "questions": [{"q": "Aşağıdakilerden hangisi dopingle mücadelenin temel ilkesidir?", "o": ["Sporcunun sağlığını korumak", "Madalya sayısını artırmak", "Antrenörleri cezalandırmak", "Federasyonların gelirini artırmak", "Rekorları korumak"], "a": 0, "e": "Dünya Dopingle Mücadele Kuralları'nın amacı ise temiz sporcuların haklarını korumaktır."}, {"q": "Uluslararası alanda dopingle mücadeleyi yürüten kuruluş hangisidir?", "o": ["FIFA", "IOC Sağlık Komisyonu", "WADA", "UNESCO", "TDMK"], "a": 2, "e": "WADA 1999'da kurulmuş bağımsız bir uluslararası kuruluştur."}, {"q": "Türkiye'de WADA tarafından akredite edilen doping kontrol laboratuvarı hangisidir?", "o": ["Gazi Üniversitesi Laboratuvarı", "Ege Üniversitesi Laboratuvarı", "Ankara Üniversitesi Laboratuvarı", "Hacettepe Doping Kontrol Laboratuvarı", "İstanbul Tıp Fakültesi"], "a": 3, "e": "Ulusal dopingle mücadele kuruluşu ise TDMK'dır."}, {"q": "Ülkemizde WADA'nın tanıdığı tek ulusal dopingle mücadele kuruluşu hangisidir?", "o": ["Türkiye Dopingle Mücadele Komisyonu (TDMK)", "Türkiye Milli Olimpiyat Komitesi", "Sağlık Bakanlığı", "Spor Genel Müdürlüğü", "Gençlik ve Spor Bakanlığı"], "a": 0, "e": "TDMK ulusal düzeyde doping kontrol sürecinden sorumludur."}, {"q": "12 aylık süre içinde kaç bulunabilirlik kusuru kural ihlali sayılır?", "o": ["10", "2", "1", "3", "5"], "a": 3, "e": "Bu durum Madde 2.4'te düzenlenmiştir."}, {"q": "Yasaklılar Listesi'nin tanımı hangisidir?", "o": ["Doping kontrolüne seçilecek sporcuların listesi", "Ceza almış doktorların listesi", "Akredite laboratuvarların listesi", "Müsabaka içi ve müsabaka dışı kullanımı yasaklı madde ve yöntemlerin listesi", "Ceza almış sporcuların listesi"], "a": 3, "e": "Liste WADA tarafından hazırlanır."}, {"q": "Yasaklılar Listesi hangi sıklıkla güncellenir?", "o": ["Dört yılda bir (olimpiyat döngüsü)", "Her ay", "İki yılda bir", "Her yıl", "On yılda bir"], "a": 3, "e": "Liste 1 Ocak - 31 Aralık arasında geçerlidir."}, {"q": "Aşağıdakilerden hangisi bir maddenin Yasaklılar Listesi'ne alınma ölçütlerinden biridir?", "o": ["Yurt dışında üretilmesi", "Sağlık riski oluşturması", "Bitkisel olması", "Reçeteyle satılması", "Pahalı olması"], "a": 1, "e": "Ölçütler: performansı artırma, sağlık riski, sporun ruhuna aykırılık (en az ikisi)."}, {"q": "Aşağıdakilerden hangisi yalnızca müsabaka içinde yasaklı madde grubundadır?", "o": ["Gen dopingi (M3)", "Anabolik maddeler (S1)", "İdrar söktürücüler (S5)", "Peptid hormonlar (S2)", "Uyarıcılar (S6)"], "a": 4, "e": "S6-S9 müsabaka içinde yasaklıdır; S0-S5 ve M1-M3 her zaman yasaklıdır."}, {"q": "Beta blokerler Yasaklılar Listesi'nde hangi sınıftadır?", "o": ["Hiç yasaklı değil", "Bazı özel sporlarda yasaklı (P1)", "Her zaman yasaklı", "Yalnızca müsabaka dışında yasaklı", "Yalnızca kadınlarda yasaklı"], "a": 1, "e": "P1 grubu, beta blokerlerin yasaklı olduğu özel spor dallarını kapsar."}, {"q": "Tıbbi zorunlulukla yasaklı madde kullanması gereken sporcu ne yapmalıdır?", "o": ["Hiçbir izin almadan kullanabilir", "Hiçbir koşulda kullanamaz", "Sadece antrenörüne haber vermesi yeterlidir", "Müsabakadan sonra bildirmesi yeterlidir", "Tedavi Amaçlı Kullanım İstisnası (TAKİ) onayı almalıdır"], "a": 4, "e": "TAKİ onayı bağlı olunan dopingle mücadele kuruluşundan alınır."}, {"q": "Sporcunun vücudunda saptanan maddelerden kim sorumludur?", "o": ["Besin desteğini üreten firma", "Takım doktoru", "Federasyon", "Sporcunun kendisi", "Antrenörü"], "a": 3, "e": "Kusursuz sorumluluk ilkesi gereği sporcu doğrudan sorumludur."}, {"q": "Yaklaşan bir doping kontrolüyle ilgili sporcuya ne zaman haber verilmelidir?", "o": ["Sezon başında", "Bir ay önce", "Önceden bildirim yapılması gerekli değildir", "Bir gün önce", "Bir hafta önce"], "a": 2, "e": "Doping kontrolü her zaman, her yerde yapılabilir."}, {"q": "Bir sporcu hangi durumda doping kontrolünü reddedebilir?", "o": ["Sporcular doping kontrolünü reddedemez", "Kontrol gece yapılıyorsa", "Müsabakayı kaybettiyse", "Yorgunsa", "Antrenörü izin vermezse"], "a": 0, "e": "Reddetmek kural ihlalidir ve men cezası getirebilir."}, {"q": "Aşağıdakilerden hangisi sporcunun doping kontrol istasyonuna geç gitmesi için geçerli bir neden değildir?", "o": ["Medya yükümlülüğü", "Ödül törenine katılmak", "Arkadaşlarıyla kutlamaya katılmak", "Soğuma egzersizi yapmak", "Gerekli tıbbi tedavi almak"], "a": 2, "e": "Geçerli nedenler doping kontrol görevlisince onaylanmalıdır."}, {"q": "Doping kontrol örneği için en az ne kadar idrar gereklidir?", "o": ["90 ml", "150 ml", "60 ml", "30 ml", "250 ml"], "a": 0, "e": "B şişesine en az 30 ml, A şişesine en az 60 ml konur."}, {"q": "Sporcunun örneği ile birlikte laboratuvara giden bilgiler hangisidir?", "o": ["Branşı, cinsiyeti, federasyonu ve örnek kod numarası", "Adresi ve telefonu", "Kulübünün adı ve sporcunun fotoğrafı", "Adı, soyadı ve kimlik numarası", "Antrenörünün adı"], "a": 0, "e": "Laboratuvar sporcunun kimliğini görmez, yalnızca kod numarasını görür."}, {"q": "Doping kontrol örnekleri ne kadar süre saklanabilir?", "o": ["20 yıl", "10 yıl", "5 yıl", "2 yıl", "1 yıl"], "a": 1, "e": "İleride geliştirilen yöntemlerle yeniden analiz edilebilirler."}, {"q": "Aşağıdakilerden hangisi dopingle mücadelenin temel ilkelerinden biridir?", "o": ["Yasaklı maddelerin satılmasına engel olmak", "Sporcuların arasındaki rekabeti artırmak", "Yasaklı yöntemleri kullananların ceza almasını sağlamak", "Sporcunun sağlığını korumak", "İlaç endüstrisinin sporculara erişimini kısıtlamak"], "a": 3, "e": "Doğru cevap: Sporcunun sağlığını korumak.", "kb": 1}, {"q": "Yasaklılar Listesi’nin açıklaması aşağıdakilerin hangisinde doğru verilmiştir?", "o": ["Müsabakalardan men edilmiş sporcuların listesidir.", "Müsabaka içi ve müsabaka dışı uyulması gereken disiplin kuralları listesidir.", "Müsabaka içi ve müsabaka dışı kullanımı yasaklı madde ve yöntemlerin listesidir.", "Dopingle mücadele kural ihlalleri nedeniyle ceza almış sporcularla çalışmalarına izin verilmeyen sporcu destek personelinin listesidir.", "Dopingle mücadele kural ihlalleri nedeniyle ceza almış doktorların listesidir."], "a": 2, "e": "Doğru cevap: Müsabaka içi ve müsabaka dışı kullanımı yasaklı madde ve yöntemlerin listesidir.", "kb": 1}, {"q": "Yasaklılar Listesi hangi sıklıkla güncellenir?", "o": ["Her yıl", "Her dört yılda bir", "Olimpiyatlardan önce", "Her iki yılda bir", "Her yıl iki kere"], "a": 0, "e": "Doğru cevap: Her yıl.", "kb": 1}, {"q": "Aşağıdakilerden hangisi herhangi bir madde veya yöntemin “Yasaklılar Listesine” alınma gerekçelerinden biridir?", "o": ["Eczanelerde satılıyor olması", "Reçeteli ilaç kapsamına girmesi", "Sağlık riski oluşturması", "Reçetesiz ilaç kapsamına girmesi", "Besin destek ürünü kapsamına girmesi"], "a": 2, "e": "Doğru cevap: Sağlık riski oluşturması.", "kb": 1}, {"q": "Yaklaşan bir doping kontrolüyle ilgili sporcuya ne zaman haber verilmelidir?", "o": ["24 saat önce", "7 gün önce", "1 ay önce", "Sadece müsabaka içi doping kontrollerinde önceden haber verilmelidir.", "Önceden bildirim yapılması gerekli değildir."], "a": 4, "e": "Doğru cevap: Önceden bildirim yapılması gerekli değildir.", "kb": 1}, {"q": "Bir sporcu hangi durumda doping kontrolünü reddedebilir?", "o": ["Ailevi yükümlülükler olduğunda.", "Yoğun bir program olduğunda.", "Tatile gidilmesi durumunda.", "Eğitimle ilgili yükümlülükler olduğunda.", "Sporcular doping kontrolünü reddedemez."], "a": 4, "e": "Doğru cevap: Sporcular doping kontrolünü reddedemez.", "kb": 1}, {"q": "Sporcunun örneği ile birlikte laboratuvara giden bilgiler aşağıdakilerden hangisidir?", "o": ["Sporcunun adı ve doğum tarihi", "Sporcunun adı ve telefon numarası", "Sporcunun branşı, cinsiyeti, bağlı olduğu federasyonu ve doping kontrol tarihi", "Sporcunun imzası ve e-posta adresi", "Sporcunun adresi ve doğum tarihi"], "a": 2, "e": "Doğru cevap: Sporcunun branşı, cinsiyeti, bağlı olduğu federasyonu ve doping kontrol tarihi.", "kb": 1}, {"q": "Doping kontrol örneği için en az ne kadar idrar gereklidir?", "o": ["100 mL", "120 mL", "50 mL", "90 mL", "80 mL"], "a": 3, "e": "Doğru cevap: 90 mL.", "kb": 1}, {"q": "Doping kontrol örneklerinin saklanması gereken süre aşağıdakilerden hangisidir?", "o": ["3 ay", "6 ay", "1 yıl", "5 yıl", "10 yıl"], "a": 4, "e": "Doğru cevap: 10 yıl.", "kb": 1}, {"q": "Sporcunun vücudunda saptanan maddelerden kim sorumludur?", "o": ["Sporcunun ailesi", "Sporcunun kendisi", "Sporcunun doktoru", "Sporcunun antrenörü", "Sporcuya maddeyi veren kişi"], "a": 1, "e": "Doğru cevap: Sporcunun kendisi.", "kb": 1}], "tf": [{"q": "Doping yalnızca yasaklı bir maddenin kullanılması anlamına gelir.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Doping, Madde 2'deki kural ihlallerinden herhangi biridir (bulundurma, ticaret, kontrolden kaçma vb.).", "tf": true}, {"q": "WADA'nın yönetiminde hükümetler ve spor hareketi eşit temsil edilir.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Maddi kaynak da eşit ölçüde sağlanır.", "tf": true}, {"q": "Laboratuvarda ilk olarak B örneği analiz edilir.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Önce A örneği analiz edilir; B örneği teyit için saklanır.", "tf": true}, {"q": "Etiketi yanlış bir besin destek ürünü nedeniyle pozitif çıkan sporcunun bu savunması yeterli kabul edilir.", "o": ["Doğru", "Yanlış"], "a": 1, "e": "Kusursuz sorumluluk ilkesi gereği bu savunma kabul edilmez.", "tf": true}, {"q": "Örnek vermeden önce sporcu ellerini sabunsuz, sadece suyla yıkar.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Örneğe yabancı madde bulaşması önlenir.", "tf": true}, {"q": "Ceza almış bir destek personeliyle iş birliği yapmak dopingle mücadele kural ihlalidir.", "o": ["Doğru", "Yanlış"], "a": 0, "e": "Madde 2.10'da düzenlenmiştir.", "tf": true}]}], "past": [], "source": "Kitap: AÖF / GSB Antrenör Eğitimi kitabı"}, {"id": "soo", "title": "Sporda Öğrenme ve Öğretme", "short": "Öğretim", "icon": "🎓", "color": "#3A7BD5", "units": [{"id": "soo1", "title": "Antrenörlük Mesleğine Giriş", "cards": [{"title": "Antrenörlüğün tarihi", "points": ["Antrenör; sporcunun **fiziksel, teknik, psikolojik ve zihinsel** gelişiminden sorumludur ve bir **rol modeldir**.", "Antik çağlarda antrenörlerden daha çok **avcılık ve savaşa hazırlık** amaçlı faaliyetlerde söz edilir.", "**Coaching (koçluk)** kelimesi **19. yüzyılda** kullanılmaya başlandı. O dönem antrenörlük yalnızca İngiliz **üst zümresinin** sporlarına (kriket, kürek) sunulan bir imkândı.", "Alt zümre sporlarını (boks, yürüyüş) öğretenlere çalıştırıcı anlamında **trainer** denirdi.", "Bugün antrenör; eğitimci, spor psikoloğu ve yönetici rollerini de üstlenir. Antrenörlük **organize ve sosyal** bir görevdir."]}, {"title": "Çalışma şekilleri ve amaçlar", "points": ["Antrenörlerin çalışma kapsamını **ulusal spor federasyonlarının** kuralları belirler.", "**Gönüllü antrenör:** Ücret almaz; genellikle sporcunun yakınları, ebeveynleri veya arkadaşlarıdır.", "**Kısmi zamanlı antrenör:** Başka bir meslekte çalışırken ücret karşılığı antrenörlük yapar.", "**Ücretli antrenör:** Antrenörlüğü profesyonel meslek olarak yapar.", "Amaç sadece teknik beceri değil, **bütünsel gelişimdir**. Bunun 5 özelliği: **yetkinlik, özgüven, bağ kurma, karakter, umursama/umursanma**.", "**Karakter:** Doğruyu yanlıştan ayırma ve eylemlerinin sorumluluğunu alma. **Umursama:** Paydaşlara karşı **empati** geliştirme."]}, {"title": "Spora katılım ve piramit", "points": ["Spora katılım **ilk ve en yoğun** olarak **okul sporu / beden eğitimiyle** başlar.", "**Piramit modeli** (alttan üste): okul sporu → yerel → bölgesel → ulusal → elit yarışmalar.", "Eleştiriler: her basamakta sporcu sayısı azalır, üste geçemeyen çocuklar spordan uzaklaşır, sadece beceriye odaklanılır.", "**Bağıl yaş etkisi:** Aynı yıl doğanlar içinde **ay olarak önce doğan** çocuklar avantajlıdır."]}, {"title": "Katılım ve performans ortamı", "points": ["**Katılım spor ortamı:** Hedef eğlenmek, beceri geliştirmek ve sağlıklı yaşam; **yarışma ve kazanma hedefi yoktur**. Grupları: çocuklar (**12 yaşa kadar**), ergenler, yetişkinler.", "**Performans spor ortamı:** Hedef sportif kapasiteyi geliştirmek ve yarışmada yüksek performans. Grupları: gelişmekte olan sporcu, performans sporcusu, yüksek performans sporcusu.", "**Yüksek performans sporcusu** grubu, performans ortamında **en az katılıma** sahip gruptur.", "Ortamlar arası **geçiş mümkündür**; aynı kişi basketbolda yüksek performans, yüzmede katılım ortamında olabilir."]}, {"title": "Katılım sporu antrenörlüğü", "points": ["Katılım sporu antrenörlüğünün en belirgin özelliği **yarışma performansına odaklanmamasıdır**.", "**Çocuk antrenörlüğü (6-12 yaş):** Önce spor **ilgi çekici ve tatmin edici** olmalı. Yarışma planlaması **yapılmaz**; temel hareketler oyunlarla geliştirilir.", "Çocuklarda **haftalık antrenman 4 saati geçmemelidir**.", "**Ergen/yetişkin antrenörlüğü:** Beceri gelişimi çocuklara göre daha çok önemsenir, ama yarışmaya verilen önem **az** olmalı.", "Antrenör, sporcuya kendini başkalarıyla değil **kendi gelişimiyle** kıyaslamayı öğretmeli ve **içsel motivasyonu** desteklemeli."]}, {"title": "Performans sporu antrenörlüğü", "points": ["**Gelişmekte olan sporcu (13-15 yaş):** Eğlenceli etkinlikler ile beceri etkinlikleri **beraber ve eşit** oranda yapılır.", "**Amaçlı oyun:** Asıl amaç **eğlenmek**; kurallar esnetilebilir. **Amaçlı alıştırma:** Amaç beceri ve performans; antrenör **tam karar vericidir**.", "**Performans sporcusu:** Amaçlı alıştırmaya oyundan **daha fazla** yer verilir, ama oyun tamamen bırakılmaz. Yetenek seçimi kararları antrenörün.", "**Yüksek performans sporcusu:** Eğlence için amaçlı oyuna **yer verilmez**. Sporcu **sadece bir alanda** (pozisyon/mesafe) çalışır.", "Sporcu yetişkinleştikçe **üst/ast ilişkisinin azaltılması** ve fikrinin alınması performansı olumlu etkiler."]}, {"title": "Paydaşlar ve ilişkiler", "points": ["Spor ortamının paydaşları: **yöneticiler, antrenörler, sporcular, ebeveynler**. En temel paydaşlar **antrenör ve sporcudur**.", "Antrenör-sporcu ilişkisinde stratejiler: **etkili iletişim, pozitif destek, ilgi/samimiyet, ulaşılabilir olma, güven**.", "Ebeveynler **sosyal** yönden destekleyici olmalı; beceri, performans ve taktiği **antrenöre bırakmalıdır**. Yüksek beklenti stres yaratır.", "Ebeveynlerin **öncelikli beklentisi**, çocuklarına **adil davranılmasıdır**.", "Antrenör-ebeveyn stratejileri: spor hakkında bilgi verme, ebeveyn davranışları için kurallar, **iki yönlü iletişim**, olumlu davranış eğitimi, **periyodik toplantılar**."]}], "questions": [{"q": "Başka bir meslekte çalışırken ücret karşılığı antrenörlük yapan kişiye ne denir?", "o": ["Ücretli antrenör", "Kısmi zamanlı antrenör", "Gönüllü antrenör", "Trainer", "Yardımcı antrenör"], "a": 1, "e": "Gönüllü antrenör ücret almaz; ücretli antrenör ise antrenörlüğü asıl mesleği olarak yapar."}, {"q": "19. yüzyılda İngiltere'de alt zümre sporlarını öğreten kişilere ne ad verilirdi?", "o": ["Antrenör", "Trainer", "Mentor", "Hoca", "Coach"], "a": 1, "e": "Üst zümre sporlarında coaching kullanılırken, boks ve yürüyüş gibi sporları öğretenlere trainer denirdi."}, {"q": "Antrenörlerin çalışma kapsamı hangi kurumların kurallarıyla belirlenir?", "o": ["Okul müdürlükleri", "Uluslararası Olimpiyat Komitesi", "Belediyeler", "Spor kulüpleri", "Ulusal spor federasyonları"], "a": 4, "e": "Her branşın oyun formları ve yarışma statülerine uygun görevleri federasyonlar belirler."}, {"q": "Bütünsel gelişimde, akranlara ve diğer paydaşlara karşı empati geliştirme hangi özelliktir?", "o": ["Bağ kurma", "Yetkinlik", "Özgüven", "Karakter", "Umursama/umursanma"], "a": 4, "e": "Umursama, dinleme ve anlama becerilerinin gelişmesine bağlıdır."}, {"q": "Doğruyu yanlıştan ayırt etme ve eylemlerinin sorumluluğunu alma bütünsel gelişimin hangi özelliğidir?", "o": ["Bağ kurma", "Karakter", "Özgüven", "Yetkinlik", "Umursama"], "a": 1, "e": "Karakter, doğru bildiğini ifade edebilmeyi de kapsar."}, {"q": "Bireyin spora katılımı ilk ve en yoğun olarak nereden başlar?", "o": ["Yerel yarışmalar", "Spor
