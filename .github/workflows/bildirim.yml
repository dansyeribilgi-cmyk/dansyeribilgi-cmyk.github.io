name: Günlük hatırlatma bildirimleri
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: bildirim
  cancel-in-progress: false
jobs:
  gonder:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Bağımlılıkları kur
        working-directory: .
        run: npm install --no-audit --no-fund --silent
      - name: Bildirimleri gönder
        working-directory: .
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: node notify.js
      # GitHub, 60 gün değişiklik olmayan depolarda zamanlayıcıyı durdurur; ayda bir boş kayıt atarak açık tutar
      - name: Zamanlayıcıyı canlı tut
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 40*86400 )) ]; then
            git config user.name "bildirim-bot"
            git config user.email "bildirim-bot@users.noreply.github.com"
            git commit --allow-empty -m "Zamanlayıcıyı canlı tut"
            git push
          fi
